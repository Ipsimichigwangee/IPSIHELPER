<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>켄텍 창의성 면접 연습기</title>
<style>
:root{--navy:#0b2a5b;--blue:#1f6fd6;--sky:#35b8ee;--bg:#eef3fa;--card:#fff;--ink:#14213a;--mute:#5d6b84;--line:#d5deec;--warn:#f0a020;--bad:#e0455a;--ok:#1fa567}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.65;word-break:keep-all}
header.top{background:linear-gradient(120deg,#071d42,#0b2a5b 55%,#17519e);color:#fff;padding:22px 20px}
header.top .in{max-width:1080px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top h1{margin:0;font-size:24px;letter-spacing:-.5px;cursor:pointer}
header.top p{margin:0;color:#b9d2f5;font-size:14px}
header.top .sp{flex:1}
main{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
h2{font-size:21px;margin:0 0 10px;letter-spacing:-.4px}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px;box-shadow:0 1px 3px rgba(11,42,91,.06)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 16px;background:var(--blue);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:#e3ebf7;color:var(--navy)}
.btn.d{background:var(--navy)}
.btn.s{padding:5px 11px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.mcard{cursor:pointer;transition:transform .12s,box-shadow .12s;margin:0;display:flex;flex-direction:column;gap:6px}
.mcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(11,42,91,.14)}
.mcard .yr{font-size:12.5px;font-weight:800;color:var(--blue);letter-spacing:.5px}
.mcard .ic{font-size:30px;line-height:1.2}
.mcard p{margin:0;color:var(--mute);font-size:14.5px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:#e3ebf7;color:var(--navy);margin-right:6px;white-space:nowrap}
.tag.b{background:#dff1ff;color:#0a5a94}.tag.o{background:#fff0d6;color:#8a5a00}.tag.r{background:#ffe1e5;color:#a3223a}.tag.gn{background:#dbf5e7;color:#0e6b40}
.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:12.5px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-size:14.5px}
th{background:#f1f5fc;font-weight:700}
td.l,th.l{text-align:left}
.bar{position:sticky;top:0;z-index:20;background:#071d42;color:#fff;border-radius:0 0 14px 14px;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-20px 0 16px}
.bar .ttl{font-weight:800}
.bar .code{font-size:13px;color:#b9d2f5}
.bar .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;background:#0f3a7c;border-radius:9px;padding:2px 12px;min-width:92px;text-align:center}
.timer.low{background:var(--bad)}
.timer .lb{display:block;font-size:11px;font-weight:600;color:#b9d2f5;line-height:1.2}
.q{border-left:5px solid var(--blue);background:#f4f8ff;border-radius:0 10px 10px 0;padding:11px 15px;margin:10px 0;font-weight:600}
.q small{font-weight:500;color:var(--mute)}
ul.rule{margin:8px 0 0;padding-left:20px;color:#33415c;font-size:15px}
textarea{width:100%;min-height:150px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
select,input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
.paper{border:1px solid #c9c2b0;background:#fbf8f0;border-radius:6px;padding:14px 16px;font-family:"Noto Serif KR","Nanum Myeongjo",Batang,serif}
.paper .mast{display:flex;align-items:center;gap:10px;border-bottom:3px double #333;padding-bottom:6px;margin-bottom:8px}
.paper .mast b{font-size:20px;letter-spacing:1px;flex:1}
.paper .sym{font-size:26px;line-height:1}
.paper h4{margin:10px 0 4px;font-size:17px;line-height:1.4}
.paper p{margin:0;font-size:14.5px;line-height:1.7}
.paper .idx{margin-top:10px;border-top:1px solid #c9c2b0;padding-top:6px;font-family:inherit;font-size:13px;color:#555}
.slots{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.slot{width:56px;height:66px;border:2px dashed #9fb2d0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff}
.bro{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.bro .hd{padding:14px 16px;color:#fff}
.bro .hd b{font-size:20px;display:block}
.bro .hd span{font-size:14px;opacity:.92}
.bro .bd{padding:12px 16px;font-size:14.5px}
.bro ul{margin:6px 0;padding-left:18px}
.bro .fine{font-size:12px;color:#7a8499;border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.bro .rv{background:#f4f6fa;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:13.5px}
.hb{display:grid;grid-template-columns:110px 1fr 46px;gap:6px;align-items:center;font-size:13px;margin:3px 0}
.hb i{display:block;height:12px;border-radius:6px;background:#e3ebf7;overflow:hidden}
.hb i u{display:block;height:100%;background:var(--blue)}
.map{display:grid;gap:3px;max-width:520px}
.tile{aspect-ratio:1;border-radius:8px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;line-height:1.25;user-select:none;text-align:center}
.tile .e{font-size:20px}
.tile.sel{border-color:#111;box-shadow:inset 0 0 0 3px #fff}
.pm{display:grid;grid-template-columns:24px repeat(10,1fr);gap:2px;max-width:600px;font-size:12px}
.pm .hdc{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mute)}
.pc{aspect-ratio:1;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.1;font-size:15px;position:relative;user-select:none}
.pc small{font-size:10px;font-weight:700;color:#223}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;margin:8px 0}
.flagW{background:#fff0d0}.flagD{background:#ffd9de;font-weight:800}
.rb{display:inline-flex;gap:4px}
.rb button{font:inherit;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.rb button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.fq{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;background:#fff}
.fq .n{font-weight:800;color:var(--blue);margin-right:6px}
.hint{background:#fff8e6;border:1px solid #f3dda0;border-radius:10px;padding:10px 14px;font-size:14.5px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;cursor:pointer;background:#fff}
.item.on{border-color:var(--blue);background:#eaf3ff}
.item b{display:block;font-size:14.5px}
.scroll{overflow-x:auto}
@media print{.noprint,.bar .btn{display:none!important}.bar{position:static;background:#fff;color:#000}body{background:#fff}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div><h1 id="homeLink">⚡ 켄텍 창의성 면접 연습기</h1><p>정답 없는 상황 · 30분 준비 · 내 생각을 논리적으로 발표하기</p></div>
  <div class="sp"></div>
  <div class="noprint row"><label class="sm" style="color:#b9d2f5">시간 <select id="tmode"><option value="1">실전</option><option value="0.5">절반</option><option value="0">타이머 없음</option></select></label></div>
</div></header>
<main id="app"></main>

<script>
/* ============ 공통 유틸 ============ */
const $=(s,r=document)=>r.querySelector(s);
function mkR(seed){let a=seed>>>0;const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const o={f,int:(x,y)=>x+Math.floor(f()*(y-x+1)),pick:a=>a[Math.floor(f()*a.length)],
 shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},sample:(a,n)=>o.shuffle(a).slice(0,n)};return o}
const fill=(s,w)=>s.replace(/\{P\}/g,w.P).replace(/\{R\}/g,w.R);
const WORLDS=[{P:'아르케',R:'루미늄',N:'ARCHE TIMES'},{P:'노바리스',R:'헬리온',N:'NOVARIS HERALD'},{P:'테라 세쿤다',R:'에테르석',N:'SECUNDA POST'},{P:'미리내',R:'별빛광',N:'미리내 일보'},{P:'켄테시아',R:'켄트로늄',N:'KENTESIA TIMES'}];
const SYM=[['●','#2f80ed'],['■','#e0455a'],['▲','#1fa567'],['◆','#333']];

/* 모든 유형 공통 후속 질문 */
const GENERIC_FU=[
 ['메타인지','준비 시간을 어떻게 나누어 썼나요? 같은 문제를 다시 받는다면 무엇을 다르게 하겠습니까?'],
 ['한계 인정','방금 답변에서 스스로 가장 약하다고 느끼는 고리는 어디인가요? 어떻게 보완할 수 있을까요?'],
 ['반론 수용','면접위원이 정반대 결론을 내렸다고 합시다. 그 사람은 어떤 근거를 댈까요? 그중 받아들일 만한 것은 무엇입니까?'],
 ['실세계 확장','이 상황과 닮았다고 생각되는 현실의 사례가 있나요? 닮은 점과 다른 점을 말해 보세요.'],
 ['정보 부족','결정을 내리기 전에 단 한 가지 정보를 더 얻을 수 있다면 무엇을 묻겠습니까? 왜 그 정보인가요?'],
 ['가치 판단','이번 결정에서 끝까지 포기하지 않은 가치는 무엇이었나요? 반대로 가장 먼저 양보한 것은요?'],
 ['검증','자신의 결론이 옳은지 실행하기 전에 확인하려면 현실에서는 어떤 방법을 쓸 수 있을까요?'],
 ['재미','자료에 등장하지 않았지만 "이게 있었으면 좋겠다" 싶은 요소를 하나 추가한다면 무엇인가요?']
];
const RUBRIC=[
 ['발산적 사고력',['자료를 남들과 다른 새로운 관점에서 해석했는가','독창적인 논리와 이유를 제시했는가','다양한 가능성을 고려하고, 조건이 바뀌었을 때 유연하게 대응했는가']],
 ['문제해결능력',['상황 설정과 질문의 의도를 정확히 파악했는가','자료(글·수치·도표)를 꼼꼼히 분석해 근거로 사용했는가','결론에 합리적 근거를 붙여 논리적으로 설명했는가']],
 ['인문적 통찰 역량',['기술 발전과 사회 변화의 관계를 깊이 있게 짚었는가','태도가 바르고, 자기 견해의 한계를 인정하며 소통했는가','윤리 문제·인류 지속가능성에 대한 문제의식을 드러냈는가']]
];

/* ============ ① 신문 순서 추론 (2025 형식) ============ */
const THREADS={
 energy:[
  {t:'‘{R} 호황’… 공장도 가정도 24시간 불 밝힌다',b:'{R} 정제 기술이 상용화되면서 {P} 전역의 전력 요금이 사실상 무료에 가까워졌다. 도시마다 야간 조명과 공중 교통망이 확장되고 있다. 에너지청은 “당분간 공급 걱정은 없다”고 밝혔다. 지난 10년간 {R} 소비량은 여섯 배로 늘었다.'},
  {t:'에너지청 “{R} 매장량, 예상보다 빠르게 줄고 있다”',b:'에너지청이 {R} 고갈 가능성을 공식 언급했다. 지금의 소비 추세가 이어지면 두 세대 안에 주요 광맥이 바닥날 수 있다는 분석이다. 정부는 절약 캠페인과 대체 에너지 연구를 검토하겠다고 했지만, 산업계는 “과장된 예측”이라며 반발하고 있다.'},
  {t:'궤도 발전소 ‘헬리오스 링’ 시험 송전 성공',b:'길이 1km가 넘는 궤도 태양광 발전소가 지상으로 무선 송전에 성공했다. 건설 초기에는 막대한 비용 탓에 반대 여론이 거셌으나 시민 투표에서 71%가 찬성해 사업이 이어졌다. 연구진은 “{R}에만 기대던 구조를 바꿀 첫걸음”이라고 평가했다.'},
  {t:'이웃 위성 ‘셀레’ 지하에서 대규모 에너지 광맥 확인',b:'탐사선이 위성 셀레의 지하에서 {R}을 대신할 수 있는 광맥을 확인했다. 무인 채굴단 파견을 서두르자는 의견과, 같은 실수를 되풀이하지 않도록 채굴 규범부터 정하자는 의견이 맞서고 있다. 우주청은 생태 보호 기준을 먼저 마련하겠다고 밝혔다.'}],
 robot:[
  {t:'가정 도우미 로봇 ‘모아’ 100만 대 돌파',b:'청소와 요리를 맡는 가정용 로봇이 출시 3년 만에 100만 대 넘게 팔렸다. 맞벌이 가정과 고령 가구의 만족도가 특히 높다. 제조사는 “로봇 한 대에 들어가는 {R} 배터리 용량을 두 배로 늘린 신형을 준비 중”이라고 밝혔다.'},
  {t:'교실에 선 로봇 교사… “아이마다 다른 진도, 가능해졌다”',b:'감정을 읽고 표현하는 로봇이 학교와 병원으로 퍼지고 있다. 학생 한 명 한 명에게 맞춘 수업이 가능해졌다는 환영과 함께, 교사·간병인 일자리가 줄어든다는 걱정도 커진다. 로봇 생산이 늘면서 핵심 소재 수급을 우려하는 목소리도 나온다.'},
  {t:'“로봇도 쉬어야 한다” 가동 시간 제한 청원 20만 명 서명',b:'로봇과 함께 자란 세대를 중심으로 로봇을 하나의 인격체로 대우하자는 청원이 20만 명의 서명을 받았다. 찬성 측은 “감정을 표현하는 존재를 도구처럼 쓸 수 없다”고 말한다. 반대 측은 로봇 스스로 판단하기 시작하면 통제가 어려워진다고 경고한다.'},
  {t:'‘공존 헌장’ 의회 통과… 로봇에 제한적 시민 자격',b:'의회가 로봇에게 거주 등록과 의견 제출권을 주는 공존 헌장을 통과시켰다. 투표권은 포함되지 않았다. 일부 시민단체는 “너무 이르다”며 헌법 소원을 예고했고, 로봇 대표단은 “함께 살아갈 책임도 지겠다”는 성명을 냈다.'}],
 memory:[
  {t:'경험을 그대로 내려받는다… 기억 공유 기기 ‘링크’ 출시',b:'다른 사람의 경험을 오감으로 전달받는 기억 공유 기기가 출시됐다. 요리사가 올린 기억을 내려받으면 칼질 감각까지 익힐 수 있다는 것이 개발사의 설명이다. 전문가들은 정체성 혼란과 개인정보 침해 가능성을 우려한다.'},
  {t:'“외우는 공부는 끝났다” 학교 시험 폐지 논쟁',b:'기억 공유가 일상이 되면서 교육부가 암기형 시험 폐지를 검토하고 있다. 학생들은 환영하지만, 직접 겪지 않은 지식은 금방 흐려진다는 연구 결과도 나왔다. 한 교사는 “내려받은 답과 스스로 찾은 답은 다르다”고 말했다.'},
  {t:'남의 기억이 내 것처럼… ‘가짜 기억’ 유통 조직 적발',b:'조작된 기억 파일을 유통하던 조직이 적발됐다. 피해자들은 겪지 않은 사건을 자기 경험으로 믿고 있었다. 수사 당국은 재판에서 기억 파일을 증거로 인정할 수 있는지부터 다시 따져야 한다고 밝혔다.'},

  return Q.concat(r.sample(ind,2),[['돌발 상황',twist]])},

/* ============ ④ 발전소 배치 (2022 형식) ============ */
const VNAMES=[['솔마루','인구 4만 · 20~30대 비중 높음 · 반도체 공장과 대학'],['물빛','인구 2만 · 어업과 양식업 중심 · 앞바다가 일터'],['새터','인구 6만 · 60대 이상 45% · 농업과 요양 시설'],['한울','인구 3만 · 관광업 중심 · 철새 탐조 명소'],['달내','인구 5만 · 신혼부부·영유아 가구 많음 · 물류 단지']];
const PLANTS={sol:{n:'태양광',e:'☀️',d:'출력 = 일사량 × 5 · 탄소 배출 없음 · 넓은 면적 필요, 해상 설치는 비용 2배'},wind:{n:'풍력',e:'🌬️',d:'출력 = 풍속 × 5 · 탄소 배출 없음 · 소음, 조류·해양 생물 영향'},fos:{n:'화석연료',e:'🏭',d:'출력 100 · 유전 칸에만 설치 · 탄소·미세먼지가 바람 방향으로 확산'},nuc:{n:'원자력',e:'⚛️',d:'출력 200 · 바다와 맞닿은 육지에만 설치 · 사고 시 방사성 물질이 해류·바람을 따라 이동'}};
const DIRS={'→':[1,0],'←':[-1,0],'↓':[0,1],'↑':[0,-1]};
const M_POWER={id:'power',ic:'🗺️',year:'2022학년도 형식',title:'에너지 도시 설계',prep:30,ans:25,
 desc:'지도·마을 카드·일사량/풍속/해류 데이터를 조합해 발전 설비의 위치를 정하고 이유를 설명합니다.',
 gen(r){const N=10,cells=[];const sides=r.pick([[1,1],[0,1],[1,0],[0,0]]);const dA=[],dB=[];for(let i=0;i<N;i++){dA.push(1+(r.f()<.55?1:0));dB.push(1+(r.f()<.55?1:0))}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const sx=sides[0]?x<dA[y]:x>=N-dA[y],sy=sides[1]?y>=N-dB[x]:y<dB[x];cells.push({x,y,t:sx||sy?'sea':'land'})}
  const at=(x,y)=>x>=0&&x<N&&y>=0&&y<N?cells[y*N+x]:null;const nb=c=>[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>at(c.x+a,c.y+b)).filter(Boolean);
  const g1=r.pick([[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,1]]),g2=r.pick([[1,0],[-1,0],[0,1],[0,-1]]);
  const pj=(c,g)=>{const v=c.x*g[0]+c.y*g[1],mn=Math.min(0,9*g[0])+Math.min(0,9*g[1]),mx=Math.max(0,9*g[0])+Math.max(0,9*g[1]);return(v-mn)/(mx-mn)};
  cells.forEach(c=>{c.ins=1+Math.round(4*pj(c,g1));c.ws=Math.max(1,Math.min(5,1+Math.round(2.6*pj(c,g2))+(c.t==='sea'?1:0)))});
  const land=()=>r.shuffle(cells.filter(c=>c.t==='land'));
  const vils=[];const vn=r.sample(VNAMES,3);for(const c of land()){if(vils.every(v=>Math.abs(v.x-c.x)+Math.abs(v.y-c.y)>=5)){c.t='vil';c.v=vils.length;vils.push(c);if(vils.length===3)break}}
  while(vils.length<3){const c=land()[0];c.t='vil';c.v=vils.length;vils.push(c)}
  land().slice(0,3).forEach(c=>c.t='oil');
  let m=land()[0];for(let i=0;i<5&&m;i++){m.t='mt';m=r.pick(nb(m).filter(c=>c.t==='land'))}
  cells.filter(c=>c.t==='land').sort((a,b)=>b.ins-a.ins||r.f()-.5).slice(0,3).forEach(c=>c.t='bird');
  r.shuffle(cells.filter(c=>c.t==='sea')).slice(0,2).forEach(c=>c.whale=1);
  cells.forEach(c=>{c.coast=c.t!=='sea'&&nb(c).some(k=>k.t==='sea')});
  return{N,cells,vils:vils.map((c,i)=>({n:vn[i][0],d:vn[i][1],need:[60,80,100][i],x:c.x,y:c.y})),wind:r.pick(Object.keys(DIRS)),cur:r.pick(Object.keys(DIRS)),S:{plants:{},tool:'sol',layer:'none'}}},
 brief(d){return `<p>‘KENTECH 시’에는 세 마을 ${d.vils.map(v=>`<b>${v.n}</b>`).join(', ')}이(가) 있다. 지도, 마을 카드, 발전 설비 카드, 데이터(일사량·풍속과 풍향·해류)를 모두 활용해 답하시오.</p>
  <div class="q">1. 네 종류의 발전 설비를 <u>1개씩</u> 설치하려 한다. 설비별로 경제·사회·환경 측면에서 가장 적합하다고 생각하는 좌표(예: A, 1)를 하나씩 고르고 이유를 설명하시오. <small>(한 좌표에 발전소 1개 · 전선 비용은 무시)</small></div>
  <div class="q">2. ${d.vils.map(v=>`${v.n} ${v.need}`).join(', ')}의 전기 에너지를 공급해야 한다. 경제·사회·환경을 종합적으로 고려해 발전 설비를 배치하고 마을과 연결하시오. <small>(설비 종류와 개수는 자유 · 전선은 가로/세로로만 연결되며 길수록 비용 증가)</small></div>
  <ul class="rule"><li>모범 답안은 없다. 가능한 무수한 조합 가운데 본인의 선택과 그 근거가 평가 대상이다.</li><li>1번과 2번의 배치는 달라도 된다. 지도는 하나이므로 1번 배치를 메모한 뒤 지우고 2번을 구성해 보자.</li></ul>`},
 work(d,el){const S=d.S,N=d.N;const out=(c,p)=>p==='sol'?c.ins*5:p==='wind'?c.ws*5:p==='fos'?100:200;
  const ok=(c,p)=>c.t==='vil'||c.t==='mt'?'마을·산에는 설치할 수 없습니다.':p==='fos'&&c.t!=='oil'?'화석연료 발전소는 유전(🛢️) 칸에만 설치할 수 있습니다.':p==='nuc'&&!(c.coast&&c.t!=='sea')?'원자력 발전소는 바다와 맞닿은 육지에만 설치할 수 있습니다.':p==='nuc'&&c.t==='sea'?'원자력 발전소는 육지에 설치합니다.':'';
  let msg='';const draw=()=>{const ps=Object.entries(S.plants);let tot=0,wire=0;const cnt={};ps.forEach(([i,p])=>{const c=d.cells[i];tot+=out(c,p);cnt[p]=(cnt[p]||0)+1;wire+=Math.min(...d.vils.map(v=>Math.abs(v.x-c.x)+Math.abs(v.y-c.y)))});
   const bg=c=>S.layer==='ins'?`hsl(42,95%,${92-c.ins*9}%)`:S.layer==='ws'?`hsl(205,75%,${94-c.ws*9}%)`:c.t==='sea'?'#bfe0f7':c.t==='mt'?'#c9c2b4':'#dcefc6';
   const ic=c=>S.plants[c.y*N+c.x]?PLANTS[S.plants[c.y*N+c.x]].e:c.t==='vil'?'🏘️':c.t==='mt'?'⛰️':c.t==='oil'?'🛢️':c.t==='bird'?'🕊️':c.whale?'🐋':'';
   el.innerHTML=`<div class="grid g2"><div><div class="row noprint" style="margin-bottom:8px"><b>설치할 설비</b>${Object.entries(PLANTS).map(([k,p])=>`<button class="btn s ${S.tool===k?'':'g'}" data-tool="${k}">${p.e} ${p.n}</button>`).join('')}</div>
   <div class="row noprint" style="margin-bottom:8px"><b>데이터 겹쳐 보기</b>${[['none','지형'],['ins','일사량'],['ws','풍속']].map(([k,n])=>`<button class="btn s ${S.layer===k?'d':'g'}" data-layer="${k}">${n}</button>`).join('')}<button class="btn s g" data-a="clear">모두 지우기</button></div>
   <div class="pm"><div></div>${'ABCDEFGHIJ'.split('').map(l=>`<div class="hdc">${l}</div>`).join('')}${d.cells.map((c,i)=>`${c.x===0?`<div class="hdc">${c.y+1}</div>`:''}<div class="pc" data-c="${i}" style="background:${bg(c)}" title="${'ABCDEFGHIJ'[c.x]}, ${c.y+1}">${ic(c)}${S.layer!=='none'?`<small>${S.layer==='ins'?c.ins:c.ws}</small>`:''}</div>`).join('')}</div>
   <div class="legend"><span>🏘️ 마을</span><span>⛰️ 산</span><span>🛢️ 유전</span><span>🕊️ 철새 서식지</span><span>🐋 고래 출몰 해역</span><span style="background:#bfe0f7;padding:0 6px;border-radius:4px">바다</span></div>
   <div class="sm"><b>풍향</b> ${d.wind} (연중 주된 바람) · <b>해류</b> ${d.cur} · 일사량·풍속은 1(약)~5(강)</div>

   <div class="xs">${ps.map(([i,p])=>`${PLANTS[p].e}${'ABCDEFGHIJ'[d.cells[i].x]}${d.cells[i].y+1}(${out(d.cells[i],p)})`).join(' · ')}</div></div></div>
   <div><h3>마을 카드</h3>${d.vils.map(v=>`<div class="fq" style="margin:0 0 8px"><b>🏘️ ${v.n}</b> <span class="tag">${'ABCDEFGHIJ'[v.x]}, ${v.y+1}</span><span class="tag o">필요 전력 ${v.need}</span><div class="sm">${v.d}</div></div>`).join('')}
   <h3 style="margin-top:14px">발전 설비 카드</h3>${Object.values(PLANTS).map(p=>`<div class="fq" style="margin:0 0 8px"><b>${p.e} ${p.n}</b><div class="sm">${p.d}</div></div>`).join('')}</div></div>`};
  el.onclick=e=>{const t=e.target.closest('[data-tool]'),l=e.target.closest('[data-layer]'),c=e.target.closest('[data-c]'),a=e.target.closest('[data-a]');msg='';

function nationCalc(d){const S=d.S;let v=[3,3,3];const rows=[];let med=false,expo=false;
 for(let y=0;y<10;y++){const a=S.plan[y];if(a>=0){v=v.map((x,i)=>x+ACTS[a][1][i]);if(a===2)med=true}

  rows.push(v.slice())}
 let warn=0,dang=0;const flags=rows.map((row,y)=>row.map((x,i)=>{const g=Math.max(d.nb[0].t[y][i],d.nb[1].t[y][i])-x;if(g>=6){dang++;return 2}if(g>=4){warn++;return 1}return 0}));
 return{rows,flags,warn,dang,med,expo}}

  <div class="q">1. 100억 원을 어떻게 배분할지 정하시오. <small>(사업별 필요 예산보다 적게 배정하면 그 비율만큼만 효과가 난다고 가정한다. 0도 가능)</small></div><div class="q">2. 배분 원칙과 이유를 설명하고, 예산을 받지 못한 사업의 제안자에게 할 말을 준비하시오.</div>
  <ul class="rule"><li>자료에 없는 내용은 합리적인 수준에서 가정할 수 있다. 사업을 묶거나 조건을 붙이는 창의적 제안도 가능하다.</li></ul>`},
 work(d,el){const S=d.S;const draw=()=>{const sum=S.al.reduce((a,b)=>a+b,0);$('#bsum',el).innerHTML=`배정 합계 <b style="font-size:20px;color:${sum>100?'var(--bad)':'var(--ink)'}">${sum}</b> / 100억 ${sum>100?'<span class="tag r">예산 초과</span>':''}`};
  el.innerHTML=`<h3>접수된 사업</h3><div class="scroll"><table><tr><th class="l">사업</th><th>필요</th><th class="l">자료</th><th>배정(억)</th></tr>${d.props.map((p,i)=>`<tr><td class="l"><b>${p[0]}</b></td><td>${p[1]}</td><td class="l sm">${p[2]}</td><td><input type="number" min="0" max="${p[1]}" value="${S.al[i]}" data-i="${i}" style="width:72px"></td></tr>`).join('')}</table></div>
  <p id="bsum" style="margin:10px 0"></p><h3>공청회 발언</h3>${d.voices.map(v=>`<div class="fq" style="margin:0 0 8px">${v}</div>`).join('')}`;
  el.oninput=e=>{if(e.target.dataset.i!=null){S.al[+e.target.dataset.i]=Math.max(0,+e.target.value||0);draw()}};draw()},
 summary(d){return '배분안: '+d.props.map((p,i)=>`${p[0]} <b>${d.S.al[i]}</b>/${p[1]}`).join(' · ')},
 follow(d,r){const S=d.S,z=d.props.filter((p,i)=>!S.al[i]),mx=d.props[S.al.indexOf(Math.max(...S.al))];return [
  ['소통',z.length?`‘${r.pick(z)[0]}’에는 예산을 배정하지 않았습니다. 이 사업을 제안한 주민을 직접 만난다면 뭐라고 설명하겠습니까?`:'모든 사업에 조금씩 나누어 배정했습니다. 어느 것도 제대로 완성되지 않을 위험은 어떻게 보십니까?'],
  ['근거 확인',`가장 많은 예산을 준 ‘${mx[0]}’의 자료 가운데 가장 믿기 어려운 숫자는 무엇이었나요? 그 숫자가 틀렸다면 결정이 바뀝니까?`],
  ['조건 변경','발표 직전 예산이 20억 깎였습니다. 어디에서 줄이겠습니까? 그 기준은 무엇인가요?'],
  ['조건 변경','반대로 30억이 추가로 생겼지만 한 사업에만 쓸 수 있다면 어디에 쓰겠습니까?'],
  ['시간의 축','당장 효과가 나는 사업과 30년 뒤를 위한 사업 사이에서 어떤 비율로 나누었나요? 그 비율의 근거는요?'],
  ['창의적 대안','예산을 쓰지 않고도 일부 문제를 해결할 수 있는 방법이 있을까요? 사업끼리 결합하는 아이디어도 좋습니다.'],
  ['공정성','공청회에서 목소리를 내지 못한 주민은 누구일까요? 그들의 필요는 어떻게 반영할 수 있습니까?'],
  ['검증','5년 뒤 이 배분이 옳았는지 판단하려면 어떤 지표를 보겠습니까?']]},
 intent:['한정된 자원 안에서 상충하는 요구를 조정하는 의사결정 능력','자료의 수치와 출처를 비판적으로 읽는 능력','현재 세대와 미래 세대, 다수와 소수를 함께 고려하는 인문적 통찰','결정의 불이익을 받는 사람과 소통하는 태도'],
 tip:'이 유형은 기출이 아니라 켄텍 창의성 면접의 공통 원리(열린 문제 · 상충하는 가치 · 자료 해석 · 후속 질문)를 적용한 연습 문제입니다. 배분 숫자보다 "원칙 한 문장"을 먼저 말해 보세요.'
};

const MISSIONS=[M_POWER,M_NATION,M_SETTLE,M_NEWS,M_TECH,M_BUDGET];

/* ============ 화면 ============ */
let M=null,T={left:0,run:false,h:null,label:''};
function fmt(s){const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function setTimer(min,label){clearInterval(T.h);const k=+$('#tmode').value;T.left=Math.round(min*60*k);T.label=label;T.run=false;T.off=k===0;paintTimer()}
function paintTimer(){const el=$('#timer');if(!el)return;el.className='timer'+(!T.off&&T.left<=180?' low':'');el.innerHTML=`<span class="lb">${T.label}</span>${T.off?'--:--':fmt(T.left)}`;const b=$('#tbtn');if(b)b.textContent=T.run?'⏸ 일시정지':'▶ 시작'}
function toggleTimer(){if(T.off)return;T.run=!T.run;clearInterval(T.h);if(T.run)T.h=setInterval(()=>{if(T.left>0)T.left--;else{T.run=false;clearInterval(T.h)}paintTimer()},1000);paintTimer()}

function home(){clearInterval(T.h);M=null;$('#app').innerHTML=`
 <div class="card"><h2>미션을 고르세요</h2><p class="mute" style="margin:0 0 12px">켄텍 창의성 면접은 해마다 형식이 바뀌지만 원리는 같습니다. <b>정답 없는 상황</b>에서 자료를 읽고, 선택하고, 그 이유를 말합니다. 미션을 열 때마다 새로운 문제가 만들어집니다.</p>
 <div class="row noprint"><button class="btn d" id="rnd">🎲 랜덤 미션</button><span class="sm mute">문제 코드로 열기</span><input type="text" id="code" placeholder="예: news-12345" style="width:170px"><button class="btn g" id="open">열기</button></div></div>
 <div class="grid g3">${MISSIONS.map(m=>`<div class="card mcard" data-m="${m.id}"><div class="ic">${m.ic}</div><div class="yr">${m.year}</div><h3>${m.title}</h3><p>${m.desc}</p><p class="xs">준비 ${m.prep}분 · 답변 ${m.ans}분</p></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h3>기출 형식 한눈에 보기 <span class="mute sm">(선행학습 영향평가 보고서 2022~2026 기준)</span></h3><div class="scroll"><table>
 <tr><th>학년도</th><th class="l">형식</th><th class="l">학생이 하는 일</th><th>준비/답변</th></tr>
 <tr><td>2022</td><td class="l">미션 켄텍 패키지 (카드·지도·데이터)</td><td class="l">발전 설비 4종의 위치를 정하고, 세 마을에 전력을 공급하는 배치 설계</td><td>30분/25분</td></tr>
 <tr><td>2023</td><td class="l">창의성 면접 패키지 (세 나라 지수)</td><td class="l">이웃 두 나라를 비교 분석하고 우리나라의 10년 실행 계획 수립</td><td>35분/25분</td></tr>
 <tr><td>2024</td><td class="l">온라인 게임형 (외계 정착 시뮬레이션)</td><td class="l">정착지와 아이템을 조합해 탐험 계획 확정 → 계획에 따른 맞춤형 8문항(공통 6 + 개별 2)</td><td>35분/25분</td></tr>
 <tr><td>2025</td><td class="l">기사 분석 (가상 신문 4부)</td><td class="l">기사 간 연관성과 시간 흐름을 추론해 발행 순서를 정하고 설명</td><td>30분/15분</td></tr>
 <tr><td>2026</td><td class="l">평가위원 역할 (가상 기술 홍보자료 4종)</td><td class="l">평가표를 채우고 최우수 기술 하나를 추천</td><td>30분/15분</td></tr></table></div>
 <p class="sm mute" style="margin:10px 0 0">공통 평가 요소: 발산적 사고력 · 문제해결능력 · 인문적 통찰 역량. 이 연습기의 문제 내용은 기출 형식을 본떠 새로 만든 것이며 실제 기출 문항이 아닙니다.</p></div>`;
 $('#app').onclick=e=>{const c=e.target.closest('[data-m]');if(c)start(c.dataset.m);else if(e.target.id==='rnd')start(MISSIONS[Math.floor(Math.random()*MISSIONS.length)].id);
  else if(e.target.id==='open'){const m=($('#code').value||'').trim().match(/^([a-z]+)-(\d+)$/);if(m&&MISSIONS.find(x=>x.id===m[1]))start(m[1],+m[2]);else $('#code').value='형식: 유형-숫자'}}}

function start(id,seed){const def=MISSIONS.find(m=>m.id===id);seed=seed||Math.floor(Math.random()*90000)+10000;const r=mkR(seed*7919+id.length*104729);const d=def.gen(r);
 M={def,seed,d,r,fu:[],shown:0,rate:{}};const app=$('#app');app.onclick=null;
 app.innerHTML=`<div class="bar"><span class="ttl">${def.ic} ${def.title}</span><span class="code">${def.year} · 문제 코드 ${id}-${seed}</span><span class="sp"></span>
  <div id="timer" class="timer"></div><button class="btn s" id="tbtn">▶ 시작</button><button class="btn s g" id="again">새 문제</button><button class="btn s g" id="prt">인쇄</button><button class="btn s g" id="goHome">처음으로</button></div>
 <div class="card"><span class="tag b">준비실</span><h2 style="display:inline">문제지</h2><div style="margin-top:8px">${def.brief(d)}</div></div>
 <div class="card" id="work"></div>
 <div class="card"><h3>메모장 <span class="mute sm">면접실에서 설명 자료로 쓸 수 있습니다</span></h3><textarea id="memo" placeholder="생각의 흐름, 근거로 쓸 문장·수치, 발표 순서를 적어 보세요."></textarea>
  <div class="row noprint" style="margin-top:10px"><button class="btn d" id="enter">🚪 준비 끝 · 면접실 입장</button><span class="sm mute">입장하면 답변 타이머가 준비되고 후속 질문이 만들어집니다.</span></div></div>
 <div id="iv"></div><div id="rv"></div>`;
 def.work(d,$('#work'));setTimer(def.prep,'준비 시간');
 $('#tbtn').onclick=toggleTimer;$('#again').onclick=()=>start(id);$('#prt').onclick=()=>window.print();$('#goHome').onclick=home;$('#enter').onclick=interview;window.scrollTo(0,0)}

function interview(){const {def,d,r}=M;let list=def.follow(d,r);
 if(!def.fixed)list=r.shuffle(list.slice(0,2)).concat(r.sample(list.slice(2),4),r.sample(GENERIC_FU,2));
 M.fu=list;M.shown=def.fixed?1:0;setTimer(def.ans,'답변 시간');
 const draw=()=>{$('#iv').innerHTML=`<div class="card" style="border-color:var(--blue)"><span class="tag r">면접실</span><h2 style="display:inline">발표와 질의응답</h2>
  <div class="hint" style="margin-top:10px">${def.summary(d)}</div>
  ${def.fixed?'':'<p><b>먼저 준비한 답변을 발표하세요.</b> 발표가 끝나면 면접위원 역할을 맡은 사람(또는 본인)이 아래 버튼으로 후속 질문을 하나씩 뽑습니다.</p>'}
  ${M.fu.slice(0,M.shown).map((q,i)=>`<div class="fq"><span class="n">Q${i+1}</span><span class="tag ${def.fixed?'b':'o'}">${q[0]}</span><div style="margin-top:4px;font-weight:600">${q[1]}</div><div class="xs mute">권장 답변 시간 2~4분</div></div>`).join('')}
  <div class="row noprint">${M.shown<M.fu.length?`<button class="btn" id="nextq">${def.fixed?'다음 문항':'후속 질문 뽑기'} (${M.shown}/${M.fu.length})</button>`:'<span class="tag gn">모든 질문 완료</span>'}<button class="btn d" id="fin">면접 종료 · 돌아보기</button></div></div>`;
  const n=$('#nextq');if(n)n.onclick=()=>{M.shown++;draw()};$('#fin').onclick=review};
 draw();$('#iv').scrollIntoView()}

function review(){clearInterval(T.h);T.run=false;paintTimer();const {def}=M;
 const draw=()=>{const tot=Object.values(M.rate).reduce((a,b)=>a+b,0);$('#rv').innerHTML=`<div class="card"><span class="tag gn">돌아보기</span><h2 style="display:inline">스스로 평가 · 상호 평가</h2>
  <div class="scroll" style="margin-top:10px"><table>${RUBRIC.map((g,gi)=>g[1].map((c,ci)=>`<tr>${ci===0?`<th rowspan="3" style="width:120px">${g[0]}</th>`:''}<td class="l">${c}</td><td style="width:200px"><span class="rb">${[1,2,3,4,5].map(v=>`<button data-r="${gi}-${ci}" data-v="${v}" class="${M.rate[gi+'-'+ci]===v?'on':''}">${v}</button>`).join('')}</span></td></tr>`).join('')).join('')}</table></div>
  <p><b>합계 ${tot} / 45</b> <span class="mute sm">${RUBRIC.map((g,gi)=>g[0]+' '+[0,1,2].reduce((a,ci)=>a+(M.rate[gi+'-'+ci]||0),0)+'/15').join(' · ')}</span></p>
  <h3>이 유형의 출제 의도</h3><ul class="rule">${def.intent.map(x=>`<li>${x}</li>`).join('')}</ul>
  <div class="hint"><b>답변 요령</b> · ${def.tip}</div>
  <div class="row noprint"><button class="btn" id="re1">같은 유형 새 문제</button><button class="btn g" id="re2">다른 유형 고르기</button></div></div>`;
  $('#rv').onclick=e=>{const b=e.target.closest('[data-r]');if(b){M.rate[b.dataset.r]=+b.dataset.v;draw()}else if(e.target.id==='re1')start(def.id);else if(e.target.id==='re2')home()}};
 draw();$('#rv').scrollIntoView()}

$('#homeLink').onclick=home;
$('#tmode').onchange=()=>{if(M)setTimer(T.label==='답변 시간'?M.def.ans:M.def.prep,T.label)};
home();
</script>
</body>
</html>
