{pts:11.5,area:'국어·문법 + 수필',std:['10국05-01','10국03-01'],
 intent:'표기와 발음의 차이를 다룬 두 글을 읽고, 음운 변동의 원리를 이해하여 실제 낱말에 적용한다.',
 body:[
 {label:'(가)',text:R`한국어를 배우는 친구 마리가 받아쓰기 공책에 ‘궁물’이라고 적어 놓고 고개를 갸웃거렸다. 사전을 아무리 찾아도 그런 낱말이 없다는 것이다. 나는 웃으며 ‘국물’이라고 고쳐 주었다. 마리는 억울해했다. “분명히 [궁물]이라고 들었어. 왜 쓰는 것과 소리가 달라?” 나는 대답하지 못했다. 평생 ㉠<u>‘국물’</u>이라 쓰고 ㉡<u>[궁물]</u>이라 말하면서도 둘이 다르다는 사실조차 의식한 적이 없었기 때문이다. 그날 저녁 문법책을 찾아보고서야 우리말 표기가 낱말의 본모습을 밝혀 적는 것을 원칙으로 삼는다는 것, 그리고 소리가 달라지는 데에는 한결같은 규칙이 있다는 것을 알았다. 글자가 제 모습을 지켜 주기에 우리는 ‘국물’과 ‘국밥’과 ‘국수’에서 같은 ‘국’을 알아본다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`사람의 입은 되도록 힘을 덜 들이려 한다. ‘ㄱ’은 입안에서 공기의 흐름을 막았다가 터뜨리는 소리이고, ‘ㅁ’은 코로 공기를 내보내는 소리이다. ‘국물’을 글자대로 소리 내려면 공기를 완전히 막았다가 곧바로 코로 길을 터야 하는데, 이 일은 생각보다 번거롭다. 그래서 앞소리 ‘ㄱ’이 뒤따르는 ‘ㅁ’을 닮아, 미리 코로 공기를 내보내는 소리인 ‘ㅇ’으로 바뀐다. 이웃한 소리끼리 닮아 가는 이런 현상을 동화라고 한다. 닮는다는 것은 한쪽이 제 모습을 조금 내려놓는다는 뜻이다. 나는 말소리가 사람 사이의 일과 비슷하다고 생각했다. 함께 지내려면 서로 조금씩 닮아야 하고, 그 닮음 덕분에 말은 물 흐르듯 이어진다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'(가)와 (나)를 &lt;보기&gt;와 같이 요약할 때, ⓐ와 ⓑ에 들어갈 단어를 각각 (가)와 (나)에서 찾아 쓰시오.',p:3.2,box:'두 글은 쓰는 것과 소리 내는 것의 차이를 통해 우리말의 원리를 보여 준다. (가)는 표기가 낱말의 ( ⓐ )을/를 밝혀 적는다는 점을, (나)는 발음이 이웃한 소리끼리 닮아 가는 ( ⓑ )을/를 통해 편해진다는 점을 드러낸다.',a:'ⓐ 본모습, ⓑ 동화',r:'ⓐ: 본모습 - 1.6점, ⓑ: 동화 - 1.6점',e:'(가)에서 표기는 “낱말의 본모습을 밝혀 적는 것”을 원칙으로 한다고 하였고, (나)에서 이웃한 소리끼리 닮는 현상을 ‘동화’라고 하였다.'},
 {q:'&lt;보기&gt;를 활용하여 ㉠이 ㉡으로 소리 나는 까닭을 한 문장으로 쓰시오.',p:4.2,box:'‘비음화’는 비음이 아닌 자음 ‘ㄱ, ㄷ, ㅂ’이 비음 ‘ㄴ, ㅁ’ 앞에서 각각 비음 ‘ㅇ, ㄴ, ㅁ’으로 바뀌는 현상이다.',a:'‘국’의 받침 ‘ㄱ’이 뒤에 오는 비음 ‘ㅁ’ 앞에서 비음 ‘ㅇ’으로 바뀌는 비음화가 일어났기 때문이다.',r:'‘받침 ㄱ이 비음 ㅁ 앞에서 비음 ㅇ으로 바뀌었다(비음화)’는 의미의 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'‘국물’에서 ‘ㄱ’ 뒤에 비음 ‘ㅁ’이 오므로 <보기>의 조건에 해당한다. ‘ㄱ’은 ‘ㅇ’으로 바뀐다.'},
 {q:'(2)의 &lt;보기&gt;를 참고할 때, 마리가 ‘밥물’을 소리 나는 대로 받아 적는다면 어떻게 적게 될지 쓰시오.',p:4.1,a:'밤물',r:'‘밤물’을 정확히 기재하면 정답',e:'‘ㅂ’은 비음 ‘ㅁ’ 앞에서 비음 ‘ㅁ’으로 바뀌므로 ‘밥물’은 [밤물]로 소리 난다.'}]},

{pts:9.0,area:'국어·고전 수필',std:['10국05-01','12독서01-01'],
 intent:'박지원의 「일야구도하기」에 나타난 인식론적 성찰을 사실적·추론적으로 이해하고 다른 글과 관련지어 읽는다.',
 body:[{text:R`강물은 두 산 사이에서 나와 바위에 부딪히며 사납게 흐른다. 사람들은 이곳이 옛 싸움터여서 강물이 그렇게 운다고 하지만 그렇지 않다. 강물 소리는 듣는 사람이 어떻게 듣느냐에 달려 있다. 내 집은 산속에 있고 문 앞에 큰 시내가 있다. 여름철에 소나기가 한 차례 지나가면 시냇물이 갑자기 불어, 수레 소리, 말 달리는 소리, 북소리를 늘 듣게 된다. 내가 문을 닫고 누워 그 소리를 견주어 들어 보았다. 솔숲에 바람이 이는 듯한 소리는 내 마음이 맑을 때 들은 것이고, 산이 갈라지고 언덕이 무너지는 듯한 소리는 내 마음이 성났을 때 들은 것이며, 개구리 떼가 다투어 우는 듯한 소리는 내 마음이 우쭐할 때 들은 것이다. 이는 모두 바르게 들은 것이 아니라, 가슴속에 미리 품은 뜻이 귀에 들리는 소리를 지어낸 것이다.

나는 어제 하룻밤 사이에 강을 아홉 번 건넜다. 낮에 강을 건널 때에는 사람들이 모두 고개를 젖히고 하늘을 쳐다보기에, 나는 그들이 하늘에 기도를 올리는 줄 알았다. 나중에야 알았다. 거세게 소용돌이치는 물살을 보면 눈이 어지러워 물에 빠질 듯하므로, 물을 보지 않으려고 고개를 드는 것이었다. ㉡<u>그들은 눈에 보이는 것이 위태로워 귀로는 아무 소리도 듣지 못하였다.</u> 그런데 밤에 건널 때에는 눈으로 물을 볼 수 없으니 위태로움이 오로지 듣는 데로 쏠려, 귀가 무서워 떨며 걱정을 이기지 못하였다. 같은 강물인데도 낮과 밤에 달리 느껴지는 것은 강물이 달라져서가 아니라 ( ㉠ )의 마음이 달라졌기 때문이다.

나는 이제야 도(道)를 알았다. 마음을 고요히 가라앉힌 사람에게는 귀와 눈이 누가 되지 않고, 귀와 눈만을 믿는 사람에게는 보고 듣는 것이 자세할수록 그것이 도리어 병이 된다. 하물며 사람이 세상을 살아가는 일은 강을 건너는 것보다 훨씬 험하고 위태로우니, 보고 듣는 것이 얼마나 자주 병이 되겠는가.`,src:'박지원, 「일야구도하기(一夜九渡河記)」 (한문 원전을 간추려 현대어로 풀어 씀)'}],
 qs:[
 {q:'㉠에 들어갈 말을 첫째 문단에서 찾아 4음절로 쓰시오.',p:4.2,a:'듣는 사람',r:'‘듣는 사람’을 정확히 기재하면 정답',e:'첫째 문단에서 “강물 소리는 듣는 사람이 어떻게 듣느냐에 달려 있다.”라고 하였다. 둘째 문단은 이 주장을 낮과 밤의 경험으로 확인한다.'},
 {q:'㉡과 같은 일이 일어나는 까닭을 설명하기에 가장 적합한 한 단어를 &lt;보기&gt;에서 찾아 쓰시오.',p:4.8,box:'사람이 한꺼번에 처리할 수 있는 정보의 양에는 한계가 있다. 그래서 우리의 마음은 들어오는 감각 정보 가운데 일부만을 골라 처리하는데, 이렇게 특정한 정보에 마음의 힘을 모으는 작용을 주의라고 한다. 주의가 한 감각에 온통 쏠리면 다른 감각으로 들어온 정보는 의식에 이르지 못한다. 시끄러운 잔치 자리에서도 마주 앉은 사람의 말만 또렷이 들리는 것이 그 예이다.',a:'주의',r:'‘주의’를 정확히 기재하면 정답',e:'낮에는 눈에 보이는 물살에 마음이 온통 쏠려 귀로 들어온 소리가 의식에 이르지 못한 것이다. <보기>에서 이를 설명하는 개념은 ‘주의’이다.'}]},

{pts:9.5,area:'국어·독서(사회)',std:['12독서03-02','12독서02-05'],
 intent:'법 해석의 방법을 다룬 사회 분야의 글을 읽고, 개념을 구분하여 구체적인 사례에 적용한다.',
 body:[{text:R`법조문은 일반적이고 추상적인 말로 쓰여 있어서, 구체적인 사건에 적용하려면 그 뜻을 밝히는 해석이 필요하다. 가장 먼저 하는 것은 조문의 낱말과 문장이 지닌 보통의 뜻에 따라 풀이하는 ( ㉠ ) 해석이다. 그러나 낱말의 뜻만으로는 답이 나오지 않을 때가 많다. 그럴 때에는 그 법을 만든 까닭, 곧 입법 취지에 비추어 풀이하는 ( ㉡ ) 해석이 쓰인다. 그래서 문리 해석이 법 해석의 출발점이라면 목적 해석은 도착점이라고들 한다.

‘공원에 차량의 진입을 금지한다.’라는 규정이 있다고 하자. 전동 킥보드는 들어갈 수 있을까? 여기에서 두 가지 추론 방식이 갈린다. 하나는 규정에 적힌 것만 금지되고 적히지 않은 것은 허용된다고 보는 반대 해석이다. 다른 하나는 규정에 적히지 않았더라도 성질이 비슷한 것에는 같은 규정을 적용하는 유추 해석이다. 전동 킥보드가 ‘차량’이라는 말에 들어가는지 분명하지 않더라도, 보행자의 안전을 지킨다는 취지에 비추어 차량과 비슷한 위험을 낳으므로 진입이 금지된다고 보는 것이 유추 해석의 예이다.

그런데 형법에서는 유추 해석이 금지된다. 무엇이 범죄이고 그 범죄에 어떤 형벌이 주어지는지는 미리 법률로 정해져 있어야 한다는 죄형 법정주의 때문이다. 법률에 적혀 있지 않은 행위를 적혀 있는 행위와 비슷하다는 이유로 처벌한다면 (㉢                    ). 다만 피고인에게 유리한 방향의 유추는 허용된다고 본다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠과 ㉡에 각각 들어갈 2음절의 단어를 윗글에서 찾아 쓰시오.',p:2.0,a:'㉠ 문리, ㉡ 목적',r:'문리, 목적을 정확히 기재하면 각각 1.0점을 부여함',e:'낱말의 보통의 뜻에 따르는 것이 문리 해석, 입법 취지에 비추는 것이 목적 해석이다. 두 용어는 첫 문단 끝에 제시되어 있다.'},
 {q:'윗글의 논지에 비추어 ㉢에 들어갈 내용을 30자 내외로 서술하시오.',p:4.5,a:'국민은 어떤 행위가 범죄가 되어 처벌받는지 미리 알 수 없게 된다.',r:'‘어떤 행위가 처벌되는지 미리 알 수 없게 된다(범죄와 형벌이 미리 정해져 있어야 한다는 원칙에 어긋난다)’는 내용을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'죄형 법정주의는 범죄와 형벌이 ‘미리 법률로’ 정해져 있어야 한다는 원칙이다. 유추로 처벌하면 법률에 없는 행위가 처벌되므로 이 원칙이 무너진다.'},
 {q:'&lt;보기&gt;의 갑과 을이 사용한 해석 방법을 각각 윗글에서 찾아 쓰시오.',p:3.0,box:'‘도서관 열람실에서는 음식물을 먹을 수 없다.’라는 규정이 있다.<br>갑: “‘먹을 수 없다’고만 했으니, 음식물을 가지고 들어가는 것은 허용됩니다.”<br>을: “껌이 음식물인지는 분명하지 않지만, 냄새와 소리로 다른 이용자를 방해한다는 점에서 음식물과 비슷하니 껌을 씹는 것도 금지됩니다.”',a:'갑: 반대 해석, 을: 유추 해석',r:'정답을 정확히 기재하면 각각 1.5점을 부여함',e:'갑은 규정에 적히지 않은 행위는 허용된다고 보았고(반대 해석), 을은 적히지 않았더라도 성질이 비슷한 것에 같은 규정을 적용하였다(유추 해석).'}]},

{pts:9.0,area:'국어·독서(주제 통합)',std:['10국02-03','12독서01-02'],
 intent:'물가와 금리에 관한 두 글을 통합적으로 읽고, 개념 사이의 관계를 이해하여 수치에 적용한다.',
 body:[
 {label:'(가)',text:R`물가가 오른다는 것은 같은 돈으로 살 수 있는 물건이 줄어든다는 뜻이다. 작년에 1,000원이던 빵이 올해 1,100원이 되었다면, 빵값이 오른 것이기도 하지만 돈의 ( ㉠ )이/가 떨어진 것이기도 하다. 이처럼 돈으로 물건을 살 수 있는 힘을 구매력이라 한다. 물가 상승은 돈을 빌려준 사람에게 불리하고 빌린 사람에게 유리하다. 갚을 때의 돈은 빌릴 때의 돈보다 살 수 있는 것이 적기 때문이다. 은행에 넣어 둔 예금도 마찬가지이다. 통장에 찍힌 숫자는 그대로여도 그 돈으로 살 수 있는 물건은 물가가 오른 만큼 줄어든다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`은행이 알려 주는 이자율을 명목 금리라고 한다. 그러나 예금자가 실제로 얼마나 더 넉넉해지는지를 알려면 물가의 변화를 함께 보아야 한다. 명목 금리에서 물가 상승률을 뺀 값을 실질 금리라고 한다. 명목 금리가 연 5%이고 물가 상승률이 연 3%라면 실질 금리는 연 2%이다. 1년 뒤 통장의 돈은 5% 늘지만 물건값도 3% 올랐으므로, 그 돈으로 살 수 있는 물건은 2%쯤만 늘어나는 셈이다. 물가 상승률이 명목 금리보다 높으면 실질 금리는 음수가 된다. 이때에는 예금을 해 둘수록 돈의 ( ㉠ )이/가 줄어들므로, 사람들은 저축보다 소비나 실물 자산의 구입을 택하려는 경향이 커진다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 단어를 (가)에서 찾아 한 단어로 쓰시오.',p:2.7,a:'구매력',r:'‘구매력’을 정확히 기재하면 정답',e:'물가가 오르면 같은 돈으로 살 수 있는 물건이 줄어든다. (가)는 이 ‘살 수 있는 힘’을 구매력이라 정의하였다.'},
 {q:'다음 ⓐ, ⓑ, ⓒ에 들어갈 수를 쓰시오.',p:6.3,box:'&lt;탐구 활동&gt; 국민이는 (나)를 읽고 세 예금 상품을 다음과 같이 정리해 보았다.',table:{head:['상품','명목 금리(연)','물가 상승률(연)','실질 금리(연)'],rows:[['A','5%','2%','( ⓐ )%'],['B','3%','( ⓑ )%','−1%'],['C','( ⓒ )%','2.5%','1.5%']]},a:'ⓐ 3, ⓑ 4, ⓒ 4',r:'3, 4, 4를 모두 정확히 기재하면 정답, 각각 2.1점씩 부여',e:'실질 금리 = 명목 금리 − 물가 상승률이다. ⓐ 5−2=3, ⓑ 3−(−1)=4, ⓒ 1.5+2.5=4.'}]},

{pts:9.5,area:'국어·독서(과학·기술)',std:['12독서02-01','12독서03-03'],
 intent:'냉장고의 냉매 순환 과정을 서술한 글을 읽고 장치의 작동 원리를 사실적·추론적으로 이해한다.',
 body:[{text:R`냉장고는 차가움을 만들어 내는 기계가 아니라 안쪽의 열을 바깥으로 퍼 나르는 기계이다. 그 일을 맡는 물질을 냉매라고 한다. 냉장고의 원리는 액체가 기체로 변할 때 주위에서 열을 빼앗고, 기체가 액체로 변할 때 주위로 열을 내놓는다는 사실에 바탕을 둔다. 손등에 알코올을 바르면 시원한 것은 알코올이 ( ㉠ )하면서 손의 열을 빼앗기 때문이다.

냉매는 네 가지 장치를 차례로 돌며 순환한다. 먼저 압축기는 기체 상태의 냉매를 강하게 눌러 온도와 압력이 높은 기체로 만든다. 이 기체는 냉장고의 뒷면이나 옆면에 있는 응축기를 지나면서 바깥 공기에 열을 내놓고 액체로 변한다. 냉장고의 옆면이 따뜻한 것은 이 때문이다. 액체가 된 냉매는 좁은 관으로 된 팽창 밸브를 지나며 압력이 갑자기 낮아진다. 압력이 낮아진 냉매는 냉장실 안쪽 벽에 있는 증발기에서 ( ㉠ )하면서 냉장실 안의 열을 빼앗는다. 열을 머금고 기체가 된 냉매는 다시 압축기로 돌아간다.

이 순환에서 열은 사라지지 않는다. 냉장고는 냉장실 안에서 빼앗은 열에 압축기가 일하면서 생긴 열까지 더하여 모두 방 안으로 내보낸다. 그러므로 더운 여름날 방을 식히려고 냉장고 문을 활짝 열어 두면 (㉡                    ).`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 2음절의 단어를 윗글에 쓰인 말을 활용하여 쓰시오.',p:2.1,a:'증발 (‘기화’도 정답)',r:'‘증발’을 정확히 기재하면 정답 (‘기화’도 정답으로 인정)',e:'액체가 기체로 변하면서 주위의 열을 빼앗는 현상이며, 이 일이 일어나는 장치의 이름이 ‘증발기’이다.'},
 {q:'윗글을 참고하여 ㉡에 들어갈 내용을 20자 내외로 쓰시오.',p:5.2,a:'방 안의 온도는 오히려 올라가게 된다.',r:'‘방은 시원해지지 않고 오히려 더워진다’는 내용이 들어 있는 문장이면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'문을 열어 두면 방에서 빼앗은 열이 다시 방으로 나오고, 여기에 압축기가 일하며 생긴 열이 더해지므로 방 전체의 열은 늘어난다.'},
 {q:'냉매가 액체에서 기체로 변하는 장치와 기체에서 액체로 변하는 장치를 윗글에서 찾아 차례대로 쓰시오.',p:2.2,a:'증발기, 응축기',r:'‘증발기’, ‘응축기’를 순서대로 정확히 기재하면 정답',e:'증발기에서 액체 냉매가 기체가 되며 열을 빼앗고, 응축기에서 기체 냉매가 액체가 되며 열을 내놓는다.'}]},

{pts:9.5,area:'국어·독서 + 문학',std:['12독서02-02','12문학02-03'],
 intent:'덕과 습관에 관한 아리스토텔레스의 견해를 이해하고 이를 고전 시가에 추론적으로 적용할 수 있는지 평가한다.',
 body:[
 {label:'(가)',text:R`아리스토텔레스는 덕이 타고나는 것도, 한 번의 결심으로 얻어지는 것도 아니라고 보았다. 집을 지어 봄으로써 목수가 되고 악기를 타 봄으로써 연주자가 되듯이, 사람은 올바른 행위를 되풀이함으로써 올바른 사람이 된다. 그는 되풀이된 행위가 몸에 배어 굳어진 상태를 습관이라 하고, 덕이란 곧 좋은 습관이라고 하였다. 그래서 그는 “제비 한 마리가 왔다고 봄이 오는 것은 아니다.”라고 말한다. 하루의 선행으로 덕 있는 사람이 되지는 않는다는 뜻이다. 덕의 핵심은 강렬함이 아니라 지속이다. 한순간 타오르는 열정보다 날마다 멈추지 않는 꾸준함이 사람을 만든다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`청산(靑山)은 어찌하여 만고(萬古)에 푸르르며
유수(流水)는 어찌하여 주야(晝夜)에 그치지 아니하는고
우리도 그치지 마라 만고상청(萬古常靑)하리라

*만고상청: 오랜 세월 동안 변함없이 늘 푸름.`,src:'이황, 「도산십이곡」 중'}],
 qs:[
 {q:'&lt;보기&gt;는 (가)를 정리한 것이다. ⓐ에 들어갈 적절한 단어를 (가)에서 찾아 쓰시오.',p:3.7,box:'아리스토텔레스에 따르면 덕은 한 번의 결심이 아니라 올바른 행위의 되풀이로 얻어지며, 그 핵심은 강렬함이 아니라 ( ⓐ )에 있다.',a:'지속',r:'‘지속’을 정확히 기재하면 정답, ‘꾸준함’은 부분 점수',e:'“덕의 핵심은 강렬함이 아니라 지속이다.”라는 문장에서 찾을 수 있다.'},
 {q:'&lt;보기&gt;는 (가)의 관점에서 (나)를 정리한 것이다. ⓑ에 들어갈 적절한 2어절의 말을 (나)에서 찾아 쓰시오.',p:5.8,box:'(나)의 화자는 언제나 푸른 ‘청산’과 밤낮으로 흐르는 ‘유수’에서 멈추지 않는 꾸준함을 발견한다. 그리고 종장에서 ( ⓑ )(이)라는 말로 학문과 수양을 끊임없이 이어 가겠다는 다짐을 드러낸다.',a:'그치지 마라',r:'‘그치지 마라’를 정확히 기재하면 정답',e:'초장과 중장의 자연물이 보여 주는 ‘지속’을 본받겠다는 다짐이 종장의 “우리도 그치지 마라”에 담겨 있다.'}]},

{pts:10,area:'국어·독서(예술) + 문학',std:['12독서02-02','12문학02-01'],
 intent:'음악의 어울림과 시의 율격을 설명한 글을 이해하고 이를 시 작품에 적용할 수 있는지 평가한다.',
 body:[{text:R`고대 그리스의 피타고라스학파는 팽팽하게 맨 줄을 퉁기며 소리의 어울림을 탐구하였다. 그들은 줄의 길이를 간단한 정수의 비로 나누었을 때 두 소리가 잘 어울린다는 것을 알아냈다. 줄의 길이의 비가 2:1이면 옥타브, 3:2이면 완전 5도, 4:3이면 완전 4도의 음정이 된다. 그리고 비를 이루는 수가 작을수록 두 음은 더 잘 어울린다고 보았다. 따라서 세 음정 가운데 가장 잘 어울리는 것은 ( ㉠ )이고, 그다음은 ( ㉡ )이며, 어울림의 정도가 가장 낮은 것은 ( ㉢ )이다. 이들에게 아름다움은 감각의 문제이기에 앞서 비례의 문제였다.

음악의 어울림이 단순한 비례에서 나오듯, 시의 운율은 일정한 단위의 규칙적인 되풀이에서 나온다. 우리 시가에서는 한 행을 끊어 읽는 단위를 음보라 하고, 한 행에 음보가 몇 번 되풀이되는가에 따라 율격을 나눈다. 한 행을 세 번 끊어 읽는 3음보 율격은 민요에서 흔히 볼 수 있는데, 짝이 맞지 않아 한쪽으로 기우는 듯한 흐름이 생기므로 가볍고 출렁이는 느낌을 준다. 한 행을 네 번 끊어 읽는 4음보 율격은 시조와 가사에서 두루 쓰였는데, 둘씩 짝을 이루어 균형이 잡히므로 차분하고 안정된 느낌을 준다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠, ㉡, ㉢에 각각 들어갈 음정의 이름을 윗글에서 찾아 쓰시오.',p:4.5,a:'㉠ 옥타브, ㉡ 완전 5도, ㉢ 완전 4도',r:'‘옥타브’, ‘완전 5도’, ‘완전 4도’를 순서대로 정확히 기재하면 정답, 각각의 항목별로 부분 점수 1.5점을 부여할 수 있음',e:'비를 이루는 수가 작을수록 잘 어울린다고 하였으므로 2:1(옥타브), 3:2(완전 5도), 4:3(완전 4도)의 순서이다.'},
 {q:'윗글을 참고하여 &lt;보기&gt;의 ⓐ에 나타난 율격과 그 효과를 40자 내외로 쓰시오.',p:5.5,box:'ⓐ<u>나 보기가 ∨ 역겨워 ∨ 가실 때에는</u><br>말없이 ∨ 고이 보내 ∨ 드리우리다<br><br>영변에 ∨ 약산 ∨ 진달래꽃<br>아름 따다 ∨ 가실 길에 ∨ 뿌리우리다<br><span class="src">- 김소월, 「진달래꽃」 (∨는 끊어 읽는 자리. 행은 음보 단위에 맞추어 다시 나누었음)</span>',a:'한 행을 세 번 끊어 읽는 3음보 율격을 되풀이하여 민요처럼 가볍고 출렁이는 느낌을 준다.',r:'‘3음보 율격’과 ‘가볍고 출렁이는(민요적인) 느낌’을 모두 쓰면 정답. 율격만 맞게 쓴 경우 부분 점수 부여, 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'ⓐ는 세 번 끊어 읽히므로 3음보이다. 윗글은 3음보가 민요에서 흔하며 가볍고 출렁이는 느낌을 준다고 설명한다.'}]},

{pts:12,area:'국어·독서 + 고전 시가',std:['12문학01-01','12독서02-03'],
 intent:'안빈낙도의 태도와 강호 시가의 자연관을 이해하고 이를 시조에 적용함으로써 문학의 가치를 이해한다.',
 body:[
 {label:'(가)',text:R`조선의 사대부들에게 자연은 벼슬길에서 물러나 몸과 마음을 닦는 곳이었다. 이들이 노래한 삶의 태도를 ‘안빈낙도(安貧樂道)’라 한다. 가난을 편안히 여기고 도를 즐긴다는 뜻이다. 여기서 가난은 참고 견뎌야 할 ㉠<u>결핍</u>이 아니었다. 그들은 재물이 적은 것을 모자람으로 여기지 않고, 오히려 욕심을 덜어 낸 맑은 상태로 여겼다. 이러한 태도는 자연을 대하는 방식에서도 드러난다. 사대부의 시가에서 자연은 값을 치르고 차지하는 ( ㉡ )의 대상이 아니다.`},
 {label:'<A>',text:R`강호 시가의 화자는 흔히 아주 작은 집을 짓는다. 집이 작다는 것은 화자가 지닌 것이 적다는 뜻이지만, 화자는 그 작은 집마저 달이나 바람 같은 자연물과 나누어 쓴다고 말한다. 자연물을 한집에 사는 벗처럼 대하는 것이다. 더 나아가 화자는 집 안에 들일 수 없는 산과 강을 두고도 아쉬워하지 않는다. 담을 쌓아 소유를 표시하는 대신, 있는 그대로 둘러 두고 바라보는 것으로 넉넉하다고 여긴다. 이처럼 강호 시가에서 넉넉함은 많이 ( ㉡ )하는 데서가 아니라 자연과 더불어 누리는 데서 나온다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`십 년을 경영하여 초려삼간(草廬三間) 지어 내니
나 한 간 달 한 간에 청풍(淸風) 한 간 맡겨 두고
강산은 들일 데 없으니 둘러 두고 보리라

*초려삼간: 세 칸짜리 초가집.`,src:'송순의 시조'}],
 qs:[
 {q:'㉠과 유사한 의미를 지닌 단어를 (가)에서 찾아 쓰시오.',p:3.9,a:'모자람',r:'‘모자람’을 정확히 기재하면 정답',e:'“재물이 적은 것을 모자람으로 여기지 않고”에서 ‘결핍’과 같은 뜻의 고유어 ‘모자람’을 찾을 수 있다.'},
 {q:'㉡에 공통적으로 들어갈 단어를 (가)에서 찾아 쓰시오.',p:2.4,a:'소유',r:'‘소유’를 정확히 기재하면 정답',e:'‘값을 치르고 차지하는’ 것, ‘담을 쌓아 표시하는’ 것은 소유이다. <A>에 “소유를 표시하는 대신”이라는 구절이 있다.'},
 {q:'&lt;A&gt;의 내용을 바탕으로 (나)를 설명하시오.',p:5.7,a:'화자는 세 칸뿐인 작은 집을 달, 청풍과 나누어 쓰고 강산은 둘러 두고 보겠다고 함으로써, 자연을 소유하지 않고 더불어 누리는 데서 넉넉함을 찾는 태도를 드러낸다.',r:'‘작은 집을 자연물(달, 청풍)과 나누어 씀’, ‘강산을 소유하지 않고 둘러 두고 봄’, ‘자연과 더불어 누리는 넉넉함(안빈낙도)’의 내용을 서술하면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'중장은 <A>의 ‘작은 집을 자연물과 나누어 쓴다’에, 종장은 ‘들일 수 없는 산과 강을 둘러 두고 바라본다’에 대응한다.'}]}
],
M:[
{pts:8,area:'수학Ⅰ · 로그함수',std:['12수학Ⅰ01-07','12수학Ⅰ01-08'],
 intent:'로그의 성질과 로그함수의 성질을 이용하여 방정식과 부등식을 풀 수 있는지 평가한다.',
 body:R`로그가 포함된 방정식과 부등식에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`방정식 $\log_{2}(x-1)+\log_{2}(x+1)=3$ 의 해를 구하시오.`,p:3.5,a:R`$3$`,e:R`진수 조건에서 $x>1$ 이다. $\log_{2}(x^{2}-1)=3$ 에서 $x^{2}-1=8$, $x=\pm3$ 이고 $x>1$ 이므로 $x=3$ 이다.`},
 {q:R`부등식 $(\log_{2}x)^{2}-\log_{2}x^{3}-4\le0$ 을 만족하는 정수 $x$ 의 개수를 구하시오.`,p:4.5,a:R`$16$`,e:R`$\log_{2}x=t$ 로 놓으면 $t^{2}-3t-4\le0$, $(t+1)(t-4)\le0$ 에서 $-1\le t\le4$ 이다. 따라서 $\dfrac12\le x\le16$ 이고 정수 $x$ 는 $1,\ 2,\ \cdots,\ 16$ 의 $16$ 개이다.`}]},
{pts:12,area:'수학Ⅱ · 정적분과 그 활용',std:['12수학Ⅱ03-04','12수학Ⅱ03-05'],
 intent:'다항함수의 정적분과 넓이를 구하고, 정적분으로 정의된 함수의 극값을 방정식에 활용할 수 있는지 평가한다.',
 body:R`함수 $f(x)=3x^{2}-6x$ 와 함수 $g(x)=\displaystyle\int_{0}^{x}f(t)\,dt$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`$\displaystyle\int_{0}^{3}f(x)\,dx$ 의 값을 구하시오.`,p:1.5,a:R`$0$`,e:R`$\Big[x^{3}-3x^{2}\Big]_{0}^{3}=27-27=0$.`},
 {q:R`곡선 $y=f(x)$ 와 $x$ 축으로 둘러싸인 부분의 넓이를 구하시오.`,p:2.0,a:R`$4$`,e:R`$f(x)=3x(x-2)$ 이고 $0\le x\le2$ 에서 $f(x)\le0$ 이므로 $\displaystyle\int_{0}^{2}(6x-3x^{2})\,dx=12-8=4$.`},
 {q:R`함수 $g(x)$ 의 극솟값을 구하시오.`,p:3.9,a:R`$-4$`,e:R`$g(x)=x^{3}-3x^{2}$, $g'(x)=f(x)=3x(x-2)$ 이므로 $x=2$ 에서 극소이고 극솟값은 $g(2)=-4$ 이다.`},
 {q:R`방정식 $g(x)=k$ 가 서로 다른 세 실근을 갖도록 하는 정수 $k$ 의 개수를 구하시오.`,p:4.6,a:R`$3$`,e:R`극댓값은 $g(0)=0$, 극솟값은 $g(2)=-4$ 이므로 $-4<k<0$ 이다. 정수 $k$ 는 $-3,\ -2,\ -1$ 의 $3$ 개이다.`}]}
]},
nat:{M:[
{pts:12,area:'미적분, 수학Ⅱ · 등비수열의 극한',std:['12미적01-03','12수학Ⅱ03-04'],
 intent:'등비수열의 극한으로 정의된 함수를 구간별로 구하고, 이를 방정식과 정적분에 활용할 수 있는지 평가한다.',
 body:R`$x>0$ 에서 정의된 함수 $$f(x)=\lim_{n\to\infty}\frac{x^{2n+1}+3x}{x^{2n}+1}$$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`$f\!\left(\dfrac12\right)$ 의 값을 구하시오.`,p:2.5,a:R`$\dfrac32$`,e:R`$0<x<1$ 이면 $\displaystyle\lim_{n\to\infty}x^{2n}=0$ 이므로 $f(x)=3x$ 이다. 따라서 $f\!\left(\dfrac12\right)=\dfrac32$.`},
 {q:R`방정식 $f(x)=2$ 의 모든 실근의 합을 구하시오.`,p:4.0,a:R`$\dfrac{11}{3}$`,e:R`$0<x<1$ 일 때 $f(x)=3x$, $x=1$ 일 때 $f(1)=\dfrac{1+3}{1+1}=2$, $x>1$ 일 때 분모와 분자를 $x^{2n}$ 으로 나누면 $f(x)=x$ 이다. 따라서 $f(x)=2$ 의 해는 $x=\dfrac23,\ 1,\ 2$ 이고 합은 $\dfrac{11}{3}$ 이다.`},
 {q:R`$\displaystyle\int_{0}^{1}f(x)\,dx+\int_{1}^{2}f(x)\,dx$ 의 값을 구하시오.`,p:5.5,a:R`$3$`,e:R`$\displaystyle\int_{0}^{1}3x\,dx+\int_{1}^{2}x\,dx=\frac32+\frac32=3$.`}]},
{pts:12,area:'미적분 · 정적분과 급수, 접선',std:['12미적03-04','12미적02-02','12미적02-11'],
 intent:'정적분과 급수의 합 사이의 관계를 이해하고, 로그함수의 접선과 부분적분법을 이용하여 문제를 해결할 수 있는지 평가한다.',
 body:R`다음 물음에 답하시오.`,
 qs:[
 {q:R`$\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\frac1n\,e^{\frac kn}$ 의 값을 구하시오.`,p:3.3,a:R`$e-1$`,e:R`$\displaystyle\int_{0}^{1}e^{x}\,dx=e-1$.`},
 {q:R`곡선 $y=\ln x$ 위의 점 $(e,\ 1)$ 에서의 접선과 곡선 $y=\ln x$ 및 $x$ 축으로 둘러싸인 부분의 넓이를 구하시오.`,p:3.3,a:R`$\dfrac e2-1$`,e:R`접선은 $y=\dfrac xe$ 로 원점을 지난다. $y$ 에 대하여 적분하면 $0\le y\le1$ 에서 곡선은 $x=e^{y}$, 접선은 $x=ey$ 이므로 $$\int_{0}^{1}(e^{y}-ey)\,dy=(e-1)-\frac e2=\frac e2-1.$$`},
 {q:R`$\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\frac{k}{n^{2}}\ln\!\left(1+\frac kn\right)$ 의 값을 구하시오.`,p:5.4,a:R`$\dfrac14$`,e:R`$\displaystyle\int_{0}^{1}x\ln(1+x)\,dx=\Big[\frac{x^{2}}{2}\ln(1+x)\Big]_{0}^{1}-\frac12\int_{0}^{1}\frac{x^{2}}{1+x}\,dx$ 이고 $\dfrac{x^{2}}{1+x}=x-1+\dfrac{1}{1+x}$ 이므로 $$\frac{\ln2}{2}-\frac12\left(\frac12-1+\ln2\right)=\frac14.$$`}]},
{pts:10,area:'수학Ⅱ · 정적분으로 정의된 함수',std:['12수학Ⅱ03-04','12수학Ⅱ01-02','12수학Ⅱ03-05'],
 intent:'정적분으로 정의된 함수의 극값과 극한을 구하고, 넓이와의 관계를 이해하는지 평가한다.',
 body:R`함수 $f(x)=\displaystyle\int_{1}^{x}(t^{2}-4t+3)\,dt$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`함수 $f(x)$ 의 극솟값을 구하시오.`,p:3.9,a:R`$-\dfrac43$`,e:R`$f'(x)=(x-1)(x-3)$ 이므로 $x=3$ 에서 극소이다. $f(3)=\Big[\dfrac{t^{3}}{3}-2t^{2}+3t\Big]_{1}^{3}=0-\dfrac43=-\dfrac43$.`},
 {q:R`$\displaystyle\lim_{x\to1}\frac{f(x)}{(x-1)^{2}}$ 의 값을 구하시오.`,p:2.5,a:R`$-1$`,e:R`$f(x)=\dfrac{x^{3}}{3}-2x^{2}+3x-\dfrac43=\dfrac13(x-1)^{2}(x-4)$ 이므로 극한값은 $\dfrac13(1-4)=-1$ 이다.`},
 {q:R`곡선 $y=f'(x)$ 와 $x$ 축으로 둘러싸인 부분의 넓이를 구하시오.`,p:3.6,a:R`$\dfrac43$`,e:R`$1\le x\le3$ 에서 $f'(x)\le0$ 이므로 넓이는 $-\displaystyle\int_{1}^{3}f'(x)\,dx=-\{f(3)-f(1)\}=\dfrac43$.`}]},
{pts:10,area:'미적분 · 입체도형의 부피',std:['12미적03-06','12미적02-05'],
 intent:'단면의 넓이와 입체도형의 부피 사이의 관계를 이해하고, 부분적분법을 이용하여 부피를 계산할 수 있는지 평가한다.',
 body:R`곡선 $y=\sqrt{x\sin x}\ (0\le x\le\pi)$ 와 $x$ 축으로 둘러싸인 부분을 밑면으로 하는 입체도형 $S$ 가 있다. 이 입체도형을 $x$ 축에 수직인 평면으로 자른 단면이 모두 정사각형일 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$0\le x\le\pi$ 인 실수 $x$ 에 대하여 단면의 넓이에 대한 식 $A(x)$ 를 구하시오.`,p:1.5,a:R`$x\sin x$`,e:R`한 변의 길이가 $\sqrt{x\sin x}$ 인 정사각형이므로 $A(x)=x\sin x$ 이다.`},
 {q:R`$x=\dfrac{\pi}{2}$ 인 점을 지나는 단면의 넓이를 구하시오.`,p:1.5,a:R`$\dfrac{\pi}{2}$`,e:R`$A\!\left(\dfrac\pi2\right)=\dfrac\pi2\cdot1=\dfrac\pi2$.`},
 {q:R`입체도형 $S$ 의 부피를 구하시오.`,p:7.0,a:R`$\pi$`,e:R`$$V=\int_{0}^{\pi}x\sin x\,dx=\Big[-x\cos x\Big]_{0}^{\pi}+\int_{0}^{\pi}\cos x\,dx=\pi+0=\pi.$$`}]},
{pts:10,area:'수학Ⅰ · 등비수열',std:['12수학Ⅰ03-03','12수학Ⅰ01-08'],
 intent:'등비수열의 일반항과 합의 공식을 이해하고, 로그와 관련지어 문제를 해결할 수 있는지 평가한다.',
 body:R`등비수열 $\{a_{n}\}$ 이 $a_{2}=6$, $a_{5}=48$ 을 만족할 때, 다음 물음에 답하시오. (단, 공비는 실수)`,
 qs:[
 {q:R`$\displaystyle\sum_{k=1}^{6}a_{k}$ 의 값을 구하시오.`,p:2.5,a:R`$189$`,e:R`공비를 $r$ 라 하면 $r^{3}=8$ 에서 $r=2$, $a_{1}=3$ 이다. 합은 $\dfrac{3(2^{6}-1)}{2-1}=189$ 이다.`},
 {q:R`$\displaystyle\sum_{k=1}^{n}a_{k}>1000$ 을 만족하는 자연수 $n$ 의 최솟값을 구하시오.`,p:4.3,a:R`$9$`,e:R`$3(2^{n}-1)>1000$ 에서 $2^{n}>\dfrac{1003}{3}=334.3\cdots$ 이다. $2^{8}=256$, $2^{9}=512$ 이므로 최솟값은 $9$ 이다.`},
 {q:R`$\displaystyle\sum_{k=1}^{10}\log_{2}\frac{a_{k}}{3}$ 의 값을 구하시오.`,p:3.2,a:R`$45$`,e:R`$\dfrac{a_{k}}{3}=2^{k-1}$ 이므로 $\displaystyle\sum_{k=1}^{10}(k-1)=45$.`}]},
{pts:10,area:'수학 · 복소수와 이차방정식',unit:'수학 방정식과 부등식(복소수, 이차방정식의 근과 계수의 관계)',
 intent:'이차방정식의 근과 계수의 관계를 이해하고, 근이 만족하는 식을 이용하여 식의 값을 구할 수 있는지 평가한다.',
 body:R`이차방정식 $x^{2}-2x+4=0$ 의 두 근을 $\alpha,\ \beta$ 라 할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$\alpha^{2}+\beta^{2}$ 의 값을 구하시오.`,p:2.4,a:R`$-4$`,e:R`$\alpha+\beta=2$, $\alpha\beta=4$ 이므로 $(\alpha+\beta)^{2}-2\alpha\beta=4-8=-4$.`},
 {q:R`$\alpha^{10}+\beta^{10}$ 의 값을 구하시오.`,p:5.4,a:R`$-1024$`,e:R`$\alpha^{2}=2\alpha-4$ 이므로 $\alpha^{3}=2\alpha^{2}-4\alpha=-8$ 이고, 같은 방법으로 $\beta^{3}=-8$ 이다. $\alpha^{10}=(\alpha^{3})^{3}\alpha=-512\alpha$ 이므로 $\alpha^{10}+\beta^{10}=-512(\alpha+\beta)=-1024$.`},
 {q:R`$\dfrac1\alpha+\dfrac1\beta$ 의 값을 구하시오.`,p:2.2,a:R`$\dfrac12$`,e:R`$\dfrac{\alpha+\beta}{\alpha\beta}=\dfrac24=\dfrac12$.`}]},
{pts:8,area:'수학Ⅱ · 속도와 거리',std:['12수학Ⅱ02-11','12수학Ⅱ03-06'],
 intent:'수직선 위를 움직이는 점의 속도, 가속도와 위치의 관계를 이해하고 움직인 거리를 구할 수 있는지 평가한다.',
 body:R`원점을 출발하여 수직선 위를 움직이는 점 $\mathrm{P}$ 의 시각 $t\ (t\ge0)$ 에서의 속도가 $$v(t)=3t^{2}-6t$$ 일 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`점 $\mathrm{P}$ 의 가속도가 $0$ 인 시각에서의 점 $\mathrm{P}$ 의 위치를 구하시오.`,p:2.6,a:R`$-2$`,e:R`가속도 $a(t)=6t-6=0$ 에서 $t=1$ 이다. 위치는 $x(t)=t^{3}-3t^{2}$ 이므로 $x(1)=-2$ 이다.`},
 {q:R`점 $\mathrm{P}$ 가 출발한 뒤 다시 원점을 지나는 시각을 구하시오.`,p:2.6,a:R`$3$`,e:R`$x(t)=t^{2}(t-3)=0$, $t>0$ 에서 $t=3$ 이다.`},
 {q:R`$t=0$ 에서 $t=3$ 까지 점 $\mathrm{P}$ 가 움직인 거리를 구하시오.`,p:2.8,a:R`$8$`,e:R`$t=2$ 에서 운동 방향이 바뀌고 $x(2)=-4$, $x(3)=0$ 이므로 움직인 거리는 $4+4=8$ 이다.`}]},
{pts:8,area:'미적분 · 매개변수로 나타낸 함수의 미분',unit:'미적분 여러 가지 미분법(매개변수로 나타낸 함수의 미분법)',std:['12미적02-11'],
 intent:'매개변수로 나타낸 함수의 미분법을 이용하여 접선의 기울기와 접선의 방정식을 구할 수 있는지 평가한다.',
 body:R`매개변수 $t$ 로 나타낸 곡선 $$x=e^{t}+e^{-t},\qquad y=e^{t}-e^{-t}$$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`$t=\ln2$ 에 대응하는 점에서의 접선의 기울기를 구하시오.`,p:1.8,a:R`$\dfrac53$`,e:R`$\dfrac{dy}{dx}=\dfrac{e^{t}+e^{-t}}{e^{t}-e^{-t}}$ 이고 $t=\ln2$ 일 때 $\dfrac{2+\frac12}{2-\frac12}=\dfrac53$ 이다.`},
 {q:R`$t=\ln2$ 에 대응하는 점에서의 접선의 $y$ 절편을 구하시오.`,p:3.1,a:R`$-\dfrac83$`,e:R`접점은 $\left(\dfrac52,\ \dfrac32\right)$ 이므로 접선은 $y=\dfrac53\left(x-\dfrac52\right)+\dfrac32$ 이고 $y$ 절편은 $\dfrac32-\dfrac{25}{6}=-\dfrac83$ 이다.`},
 {q:R`이 곡선 위의 점 중에서 접선의 기울기가 $2$ 인 점의 $x$ 좌표를 구하시오.`,p:3.1,a:R`$\dfrac{4\sqrt3}{3}$ $\left(\dfrac{4}{\sqrt3}\ \text{도 정답}\right)$`,e:R`$\dfrac{dy}{dx}=\dfrac xy=2$ 에서 $x=2y$ 이다. 한편 $x^{2}-y^{2}=4$ 이므로 $3y^{2}=4$ 이고, $x>0$ 이므로 $y=\dfrac{2}{\sqrt3}$, $x=\dfrac{4}{\sqrt3}=\dfrac{4\sqrt3}{3}$ 이다.`}]}
],
K:[
{pts:10,area:'국어·문학 + 독서',std:['12문학02-03','12독서02-02'],
 intent:'과학 분야의 글에 나타난 관점을 바탕으로 시 작품을 이해하고, 화자의 행위가 지닌 의미를 구성한다.',
 body:[
 {label:'(가)',verse:true,text:R`산모퉁이를 돌아 논가 외딴 우물을 홀로 찾아가선 가만히 들여다봅니다.

우물 속에는 달이 밝고 구름이 흐르고 하늘이 펼치고 파아란 바람이 불고 가을이 있습니다.

그리고 한 사나이가 있습니다.
어쩐지 그 사나이가 미워져 돌아갑니다.

돌아가다 생각하니 그 사나이가 가엾어집니다.
도로 가 들여다보니 사나이는 그대로 있습니다.

다시 그 사나이가 미워져 돌아갑니다.
돌아가다 생각하니 그 사나이가 그리워집니다.

우물 속에는 달이 밝고 구름이 흐르고 하늘이 펼치고 파아란 바람이 불고 가을이 있고 추억처럼 사나이가 있습니다.`,src:'윤동주, 「자화상」'},
 {label:'(나)',text:R`밤하늘의 별을 본다는 것은 지나간 시간을 보는 일이다. 빛은 1초에 약 30만 km를 가지만 우주는 그보다 훨씬 넓어서, 별빛이 우리 눈에 닿기까지는 긴 시간이 걸린다. 태양의 빛은 약 8분 전에 태양을 떠난 것이고, 밤하늘에서 가장 밝게 보이는 별인 시리우스의 빛은 약 8.6년 전에 떠난 것이다. 우리가 보는 것은 지금의 별이 아니라 빛이 떠나던 순간의 별이다. 그러니 망원경은 먼 곳을 보는 도구이면서 동시에 ( ㉠ )을/를 보는 도구이다. 천문학자들은 더 먼 곳을 볼수록 더 오래된 우주의 모습을 본다. 어떤 별은 그 빛이 우리에게 오는 동안 이미 사라졌을지도 모른다. 그래도 우리는 그 빛을 보며 별이 거기에 있다고 말한다. ㉡<u>보는 일에는 언제나 시간의 어긋남이 끼어 있다.</u> 이 어긋남 덕분에 우리는 과거를 들여다볼 수 있고, 과거를 들여다봄으로써 지금의 우주가 어떻게 이루어졌는지를 이해하게 된다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 들어갈 적절한 2음절의 단어를 (나)에서 찾아 쓰시오.',p:2.5,a:'과거',r:'‘과거’를 정확히 기재하면 정답',e:'별빛은 지나간 시간의 모습이며, (나)의 끝에서 “과거를 들여다볼 수 있고”라고 하였다.'},
 {q:'(가)의 화자가 우물 속에서 본 ‘사나이’가 지금의 자신이 아니라 지나간 날의 자신임을 드러내는 시어를 (가)에서 찾아 쓰시오. (㉡ 참고)',p:3.1,a:'추억',r:'‘추억’을 정확히 기재하면 정답 (‘추억처럼’도 정답)',e:'마지막 연에서 사나이는 “추억처럼” 있다. 우물에 비친 모습은 지난날의 자신이라는 점에서 (나)의 ‘시간의 어긋남’과 통한다.'},
 {q:'(나)를 참고하여 (가)에서 화자가 우물을 들여다보는 행위의 의미를 한 문장으로 쓰시오.',p:4.4,a:'우물에 비친 지난날의 자신을 들여다봄으로써 지금의 자신을 돌아보고 이해하려는 성찰의 행위이다.',r:'‘지난날(과거)의 자신을 들여다본다’, ‘이를 통해 자신을 돌아본다(성찰한다)’는 내용의 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'(나)는 과거를 들여다봄으로써 지금을 이해하게 된다고 말한다. (가)의 화자도 우물 속의 ‘추억처럼’ 있는 자신을 거듭 들여다보며 미움, 가엾음, 그리움을 거쳐 자신을 돌아본다.'}]},
{pts:10,area:'국어·독서(과학·기술)',std:['12독서02-02','12독서03-03'],
 intent:'국제 표준 도서 번호의 검증 숫자 원리를 이해하고, 지문의 규칙을 적용하여 값을 추론한다.',
 body:[{text:R`책 뒤표지의 바코드 아래에는 13자리 숫자가 적혀 있다. 국제 표준 도서 번호(ISBN)이다. 앞의 12자리는 나라와 출판사, 책을 나타내고, 마지막 한 자리는 검증 숫자이다. 검증 숫자는 앞의 12자리로부터 정해진 규칙에 따라 계산된다. 먼저 12자리 숫자 가운데 홀수 번째 자리의 숫자에는 1을, 짝수 번째 자리의 숫자에는 3을 곱하여 모두 더한다. 이 값을 가중합이라 하자. 가중합을 10으로 나눈 나머지를 구하고, 10에서 그 나머지를 뺀 값이 검증 숫자이다. 다만 나머지가 0이면 검증 숫자는 0이다.

검증 숫자는 번호를 옮겨 적다가 생기는 잘못을 찾아내기 위한 것이다. 12자리 가운데 한 자리를 다른 숫자로 잘못 적으면, 그 자리에 곱하는 수가 1이든 3이든 가중합을 10으로 나눈 나머지가 반드시 달라진다. 그러면 계산한 검증 숫자가 적혀 있는 검증 숫자와 맞지 않으므로 잘못을 곧바로 알아챌 수 있다.

그러나 이 방식이 모든 잘못을 잡아내는 것은 아니다. 사람들이 흔히 저지르는 또 하나의 잘못은 이웃한 두 숫자의 자리를 서로 바꾸어 적는 것이다. 이웃한 두 숫자의 자리를 바꾸면 가중합은 두 숫자의 차의 2배만큼 달라진다. 그러므로 대부분의 경우에는 잘못이 드러나지만, 두 숫자의 차가 5일 때에는 (㉠                    ).`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 들어갈 적절한 말을 20자 내외로 쓰시오.',p:4.3,a:'나머지가 달라지지 않아 잘못을 알아낼 수 없다.',r:'‘가중합을 10으로 나눈 나머지(검증 숫자)가 변하지 않아 잘못을 찾아내지 못한다’는 내용을 정확히 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'두 숫자의 차가 5이면 가중합은 10만큼 달라지므로 10으로 나눈 나머지가 그대로이다. 따라서 검증 숫자도 그대로여서 잘못이 드러나지 않는다.'},
 {q:'&lt;보기&gt;의 빈칸에 들어갈 적절한 말을 윗글에서 찾아 쓰시오.',p:2.5,box:'ISBN의 마지막 자리에 있는 (        )은/는 앞의 12자리를 옮겨 적는 과정에서 생긴 잘못을 찾아내는 구실을 한다.',a:'검증 숫자',r:'‘검증 숫자’를 정확히 기재하면 정답',e:'첫째 문단과 둘째 문단의 첫 문장에서 확인할 수 있다.'},
 {q:'윗글을 바탕으로 다음 표의 ⓐ, ⓑ, ⓒ, ⓓ에 들어갈 값을 쓰시오.',p:3.2,table:{head:['앞의 12자리','가중합','10으로 나눈 나머지','검증 숫자'],rows:[['9 7 8 8 9 0 1 2 3 4 5 6','116','ⓐ','ⓑ'],['9 7 9 1 1 0 0 0 0 0 1 0','ⓒ','4','ⓓ']]},a:'ⓐ 6, ⓑ 4, ⓒ 44, ⓓ 6',r:'예시 답안을 정확히 기재하면 정답. 각각의 항목별로 부분 점수 0.8점을 부여할 수 있음',e:'첫째 줄: 116을 10으로 나눈 나머지는 6, 검증 숫자는 10−6=4. 둘째 줄: 9+21+9+3+1+0+0+0+0+0+1+0=44, 나머지 4, 검증 숫자는 10−4=6.'}]}
]}
});

id:3,
hum:{K:[
{pts:11.5,area:'국어·문법 + 수필',std:['10국05-01','10국03-01'],
 intent:'높임 표현을 다룬 두 글을 읽고, 높임법의 종류와 실현 방식을 이해하여 문장에 적용한다.',
 body:[
 {label:'(가)',text:R`초등학교에 들어가기 전, 나는 시골에 계신 할머니와 통화할 때마다 “할머니, 밥 먹었어?” 하고 물었다. 옆에서 듣던 어머니는 그때마다 “할머니, 진지 잡수셨어요?”라고 고쳐 주셨다. 나는 그 말이 길고 번거로워 싫었다. 뜻은 같은데 왜 굳이 다른 낱말을 써야 하는지 알 수 없었다. 세월이 흘러 할머니가 돌아가신 뒤에야 나는 그 차이를 알았다. ㉠<u>“밥 먹었어?”</u>는 끼니를 챙겼는지를 묻는 말이지만, ㉡<u>“진지 잡수셨어요?”</u>는 끼니를 묻는 동시에 내가 상대를 어떻게 여기는지를 함께 건네는 말이었다. 높임말은 정보에 공경을 얹어 보내는 말이다. 이제는 그 말을 건넬 분이 계시지 않는다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`우리말의 높임법은 흔히 위아래를 가르는 장치로 오해받는다. 그러나 높임법이 가르는 것은 높낮이만이 아니다. 처음 만난 사람에게, 나이가 어리더라도 가게를 찾은 손님에게 우리는 높임말을 쓴다. 이때의 높임말은 상대가 높아서가 아니라 아직 가깝지 않아서 쓰는 말, 곧 상대와 나 사이의 거리를 지켜 주는 말이다. 거꾸로 오랜 벗 사이의 반말은 낮춤이 아니라 가까움의 표시이다. 높임법은 사람 사이를 재는 자와 같아서, 너무 멀게 잡으면 서먹해지고 너무 가깝게 잡으면 무례해진다. 말을 고른다는 것은 결국 상대와 나 사이의 알맞은 자리를 고르는 일이다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'(가)와 (나)를 &lt;보기&gt;와 같이 요약할 때, ⓐ와 ⓑ에 들어갈 단어를 각각 (가)와 (나)에서 찾아 쓰시오.',p:3.2,box:'두 글은 높임 표현이 정보를 전하는 것 이상의 구실을 한다는 점을 보여 준다. (가)는 높임말이 상대를 향한 ( ⓐ )을/를 함께 전한다는 점을, (나)는 높임법이 사람 사이의 ( ⓑ )을/를 조절한다는 점을 드러낸다.',a:'ⓐ 공경, ⓑ 거리',r:'ⓐ: 공경 - 1.6점, ⓑ: 거리 - 1.6점',e:'(가)는 “높임말은 정보에 공경을 얹어 보내는 말”이라 하였고, (나)는 높임말이 “상대와 나 사이의 거리를 지켜 주는 말”이라 하였다.'},
 {q:'&lt;보기&gt;를 활용하여 ㉡에 쓰인 높임 표현을 한 문장으로 설명하시오.',p:4.2,box:'‘주체 높임법’은 문장의 주어가 가리키는 대상을 높이는 방법으로, 선어말 어미 ‘-(으)시-’나 ‘잡수시다, 계시다, 주무시다’와 같은 특수 어휘로 실현된다. ‘상대 높임법’은 말을 듣는 상대를 높이거나 낮추는 방법으로, 종결 어미로 실현된다.',a:'㉡은 특수 어휘 ‘잡수시다’로 주어인 할머니를 높이는 주체 높임법과, 종결 어미 ‘-어요’로 듣는 이인 할머니를 높이는 상대 높임법을 함께 사용하였다.',r:'‘특수 어휘(잡수시다)에 의한 주체 높임’과 ‘종결 어미(-어요)에 의한 상대 높임’을 모두 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'‘잡수셨어요’는 ‘잡수시-’(주체 높임 특수 어휘) + ‘-었-’ + ‘-어요’(상대 높임 종결 어미)로 분석된다.'},
 {q:'(2)의 &lt;보기&gt;에 제시된 특수 어휘를 활용하여 ‘할아버지가 방에서 잔다.’를 주체 높임 문장으로 고쳐 쓰시오.',p:4.1,a:'할아버지께서 방에서 주무신다.',r:'‘주무신다’를 사용하여 고쳐 쓰면 정답 (‘할아버지가 방에서 주무신다.’도 정답)',e:'‘자다’의 주체 높임 특수 어휘는 ‘주무시다’이다. 조사 ‘가’를 ‘께서’로 바꾸면 높임의 뜻이 더 분명해진다.'}]},

{pts:9.0,area:'국어·고전 수필',std:['10국05-01','12독서01-01'],
 intent:'이규보의 「경설」에 나타난 삶의 태도를 사실적·추론적으로 이해하고 다른 글과 관련지어 읽는다.',
 body:[{text:R`거사에게 거울이 하나 있었는데, 먼지가 끼어 마치 구름에 가린 달빛처럼 흐릿하였다. 그런데도 거사는 아침저녁으로 그 거울을 들여다보며 얼굴을 가다듬었다. 한 손님이 이를 보고 물었다.

“거울은 얼굴을 비추어 보는 물건이오. 그렇지 않으면 군자가 거울을 대하여 그 맑음을 본받는 것이오. 지금 그대의 거울은 안개가 낀 듯 흐려서 얼굴을 비출 수도 없고 맑음을 본받을 수도 없소. 그런데도 그대가 여전히 거울을 들여다보니 무슨 까닭이오?”

거사가 대답하였다.

“거울이 맑으면 잘생긴 사람은 기뻐하지만 못생긴 사람은 꺼리오. 그런데 세상에는 잘생긴 사람은 적고 못생긴 사람은 많소. 못생긴 사람이 맑은 거울을 보면 반드시 깨뜨려 버리고야 말 것이니, 차라리 먼지에 흐려진 채로 두는 편이 낫소. 먼지로 흐려진 것은 겉만 흐려진 것일 뿐, 거울의 맑은 바탕은 없어지지 않소. 잘생긴 사람을 만난 뒤에 닦고 갈아도 늦지 않소. 아, 옛사람이 거울을 대한 것은 그 ( ㉠ )을/를 취하기 위함이었지만, 내가 거울을 대하는 것은 그 흐림을 취하기 위함이오. 그대는 무엇을 이상하게 여기오?”

손님은 아무 대답도 하지 못하였다.`,src:'이규보, 「경설(鏡說)」 (한문 원전을 현대어로 풀어 씀)'}],
 qs:[
 {q:'㉠에 들어갈 말을 윗글에서 찾아 2음절로 쓰시오.',p:4.2,a:'맑음',r:'‘맑음’을 정확히 기재하면 정답',e:'‘옛사람’은 손님이 말한 군자처럼 거울의 ‘맑음’을 본받으려 한 사람이며, 거사가 취하는 ‘흐림’과 대비된다.'},
 {q:'거사가 ‘흐린 거울’을 통해 드러내고자 한 삶의 태도를 나타내기에 가장 적합한 한 단어를 &lt;보기&gt;에서 찾아 쓰시오.',p:4.8,box:'“물이 너무 맑으면 고기가 살지 못하고, 사람이 너무 살피면 따르는 무리가 없다.”라는 옛말이 있다. 남의 허물을 낱낱이 들추어내는 사람 곁에는 사람이 모이지 않는다는 뜻이다. 그래서 옛사람들은 남의 잘못을 알면서도 때로는 모르는 체 덮어 주는 것을 지혜로 여겼다. 이러한 태도를 포용이라 한다.',a:'포용',r:'‘포용’을 정확히 기재하면 정답',e:'맑은 거울은 못생긴 사람(허물이 있는 사람)의 결점을 낱낱이 드러낸다. 거사는 거울을 흐린 채로 두어 결점을 덮어 주려 하므로 <보기>의 ‘포용’에 해당한다.'}]},

{pts:9.5,area:'국어·독서(사회)',std:['12독서03-02','12독서02-05'],
 intent:'선거 제도를 다룬 사회 분야의 글을 읽고, 제도별 장단점을 비교하며 구체적인 수치에 적용한다.',
 body:[{text:R`대표를 뽑는 방식은 크게 둘로 나뉜다. 하나는 한 선거구에서 가장 많은 표를 얻은 후보가 당선되는 ( ㉠ ) 대표제이고, 다른 하나는 각 정당이 얻은 표의 비율에 따라 의석을 나누어 주는 ( ㉡ ) 대표제이다. 다수 대표제는 선거구마다 한 사람만 뽑으므로 누가 우리 지역의 대표인지 분명하고, 큰 정당이 의석을 많이 얻기 쉬워 정국이 안정되는 경향이 있다. 그러나 낙선한 후보에게 던진 표, 곧 사표(死票)가 많이 생긴다. 한 선거구에서 세 후보가 40%, 35%, 25%를 얻었다면 60%의 표는 의석에 반영되지 않는다.

비례 대표제에서는 정당의 득표율과 의석률이 비슷해지므로 사표가 줄고 소수의 목소리도 의회에 들어갈 수 있다. 그러나 (㉢                    ). 또 유권자가 인물이 아니라 정당에 투표하므로 대표와 지역 주민 사이의 유대가 약해질 수 있다.

그래서 많은 나라가 두 제도를 섞어 쓴다. 섞는 방식은 두 가지이다. 병립형은 지역구 의석과 비례 의석을 따로 계산한다. 지역구 의석은 선거구에서 이긴 후보에게 주고, 비례 의석은 비례 의석의 수에 각 정당의 득표율을 곱한 만큼 나누어 준 뒤 둘을 그냥 더한다. 연동형은 전체 의석의 수에 정당 득표율을 곱하여 각 정당이 가져갈 전체 의석수를 먼저 정하고, 지역구에서 얻은 의석이 그보다 모자라면 모자란 만큼을 비례 의석으로 채워 준다. 그러므로 지역구에서 많이 당선된 정당일수록 연동형에서는 비례 의석을 적게 받는다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠과 ㉡에 각각 들어갈 2음절의 단어를 윗글에서 찾아 쓰시오.',p:2.0,a:'㉠ 다수, ㉡ 비례',r:'다수, 비례를 정확히 기재하면 각각 1.0점을 부여함',e:'가장 많은 표를 얻은 후보가 당선되는 것이 다수 대표제, 득표 비율에 따라 의석을 나누는 것이 비례 대표제이다.'},
 {q:'윗글의 논지에 비추어 ㉢에 들어갈 내용을 30자 내외로 서술하시오.',p:4.5,a:'여러 정당이 의석을 나누어 가지게 되어 정국이 불안정해질 수 있다.',r:'‘여러(작은) 정당이 난립하여 정국이 불안정해질 수 있다’는 내용을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'다수 대표제의 장점이 “큰 정당이 의석을 많이 얻기 쉬워 정국이 안정”된다는 것이므로, 이와 대비되는 비례 대표제의 단점이 들어가야 한다.'},
 {q:'&lt;보기&gt;의 ㉣과 ㉤에 들어갈 수를 윗글을 바탕으로 구하여 쓰시오.',p:3.0,box:'어느 나라의 의회는 지역구 70석과 비례 30석을 합하여 모두 100석이다. A당은 정당 득표율 30%를 얻었고 지역구에서 20명이 당선되었다. 이 나라가 병립형을 쓴다면 A당이 받는 비례 의석은 ( ㉣ )석이고, 연동형을 쓴다면 A당이 받는 비례 의석은 ( ㉤ )석이다.',a:'㉣ 9, ㉤ 10',r:'정답을 정확히 기재하면 각각 1.5점을 부여함',e:'병립형: 비례 30석 × 30% = 9석. 연동형: 전체 100석 × 30% = 30석이 A당의 몫이고, 지역구 20석을 뺀 10석을 비례 의석으로 채워 준다.'}]},

{pts:9.0,area:'국어·독서(주제 통합)',std:['10국02-03','12독서01-02'],
 intent:'비용에 관한 두 글을 통합적으로 읽고, 매몰 비용과 기회비용의 개념을 구체적인 상황에 적용한다.',
 body:[
 {label:'(가)',text:R`영화가 시작된 지 30분, 도무지 재미가 없다. 그런데도 우리는 “표값이 아까워서” 끝까지 앉아 있다. 그러나 표값은 영화를 끝까지 보든 중간에 나가든 돌려받을 수 없다. 이처럼 이미 치렀고 어떤 선택을 하더라도 되찾을 수 없는 비용을 매몰 비용이라 한다. 합리적인 선택은 앞으로 얻을 것과 앞으로 치를 것만을 견주어 이루어져야 하므로, 매몰 비용은 선택할 때 따지지 말아야 한다. 재미없는 영화를 끝까지 보는 사람은 표값을 건지는 것이 아니라, 남은 한 시간 반 동안 할 수 있었던 더 즐거운 일을 ( ㉠ )하고 있을 뿐이다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`모든 선택에는 대가가 따른다. 어떤 것을 고르면 다른 것은 고를 수 없기 때문이다. 경제학에서는 하나를 선택함으로써 포기한 여러 대안 가운데 가장 가치가 큰 것의 가치를 기회비용이라 한다. 기회비용에는 그 선택 때문에 실제로 지갑에서 나가게 되는 돈인 명시적 비용뿐 아니라, 돈이 나가지는 않지만 ( ㉠ )한 이익인 암묵적 비용도 들어간다. 예를 들어 한 달에 300만 원을 받던 직장을 그만두고 가게를 차려 재료비와 임대료로 한 달에 400만 원을 쓴다면, 가게를 운영하는 것의 기회비용은 명시적 비용 400만 원에 암묵적 비용 300만 원을 더한 700만 원이다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 단어를 (나)에서 찾아 한 단어로 쓰시오.',p:2.7,a:'포기',r:'‘포기’를 정확히 기재하면 정답',e:'(나)는 기회비용을 “포기한 대안”의 가치로 정의한다. (가)의 관객도 남은 시간에 할 수 있었던 일을 포기하고 있다.'},
 {q:'다음 ⓐ, ⓑ, ⓒ에 들어갈 금액을 쓰시오.',p:6.3,box:'&lt;탐구 활동&gt; 국민이는 2주 전에 환불이 되지 않는 공연 표를 5만 원에 사 두었다. 공연 날인 토요일에 일당 9만 원짜리 아르바이트 제안이 들어왔지만, 국민이는 공연을 보러 가기로 하였다. 공연장까지 다녀오는 데에는 교통비 1만 원이 든다.',table:{head:['항목','금액'],rows:[['토요일의 선택에서 따지지 말아야 할 매몰 비용','( ⓐ )만 원'],['공연을 보러 가는 선택의 암묵적 비용','( ⓑ )만 원'],['공연을 보러 가는 선택의 기회비용','( ⓒ )만 원']]},a:'ⓐ 5, ⓑ 9, ⓒ 10',r:'5, 9, 10을 모두 정확히 기재하면 정답, 각각 2.1점씩 부여',e:'표값 5만 원은 이미 치렀고 되찾을 수 없으므로 매몰 비용이다. 포기한 일당 9만 원이 암묵적 비용, 새로 나가는 교통비 1만 원이 명시적 비용이므로 기회비용은 10만 원이다.'}]},

{pts:9.5,area:'국어·독서(과학·기술)',std:['12독서02-01','12독서03-03'],
 intent:'전자레인지의 가열 원리를 서술한 글을 읽고 작동 원리와 그에 따른 특징을 사실적·추론적으로 이해한다.',
 body:[{text:R`전자레인지는 불 없이 음식을 데운다. 그 비밀은 마이크로파라는 전자기파에 있다. 전자레인지 안의 마그네트론이라는 장치는 1초에 약 24억 5천만 번 진동하는 마이크로파를 만들어 조리실 안으로 내보낸다.

음식에 들어 있는 물 분자는 한쪽은 양(+)의 전기를, 다른 쪽은 음(−)의 전기를 약하게 띠고 있다. 마이크로파는 방향이 끊임없이 뒤바뀌는 전기장을 지니고 있어서, 물 분자는 이 전기장의 방향을 따라 이리저리 돌려고 한다. 이렇게 회전하려는 물 분자들이 이웃한 분자들과 부딪히고 비벼지면서 ( ㉠ )이/가 생긴다. 불이 바깥에서부터 음식을 데우는 것과 달리, 전자레인지에서는 음식 속의 물 분자가 스스로 ( ㉠ )을/를 내는 셈이다.

이 원리 때문에 전자레인지에는 몇 가지 특징이 있다. 첫째, 마이크로파는 유리나 도자기, 종이를 그대로 지나가므로 그릇은 직접 데워지지 않는다. 그릇이 뜨거워지는 것은 데워진 음식의 열이 옮겨 갔기 때문이다. 둘째, 금속은 마이크로파를 반사한다. 조리실의 벽이 금속으로 되어 있고 문의 유리에 촘촘한 금속 그물이 붙어 있는 것은 마이크로파가 밖으로 새어 나가지 못하게 하기 위해서이다. 같은 까닭으로 금속 그릇에 담아 뚜껑까지 덮은 음식은 (㉡                    ). 셋째, 얼음은 물 분자들이 서로 단단히 묶여 있어 잘 회전하지 못하므로 물보다 훨씬 느리게 데워진다. 그래서 언 음식을 녹일 때에는 마이크로파를 쏘았다 멈추기를 되풀이하여, 먼저 녹은 부분의 열이 아직 얼어 있는 부분으로 퍼질 시간을 준다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 단어를 윗글에서 찾아 한 단어로 쓰시오.',p:2.1,a:'열',r:'‘열’을 정확히 기재하면 정답',e:'물 분자들이 부딪히고 비벼지면서 생기는 것은 열이며, 셋째 문단에 ‘음식의 열’, ‘녹은 부분의 열’이라는 표현이 있다.'},
 {q:'윗글을 참고하여 ㉡에 들어갈 내용을 20자 내외로 쓰시오.',p:5.2,a:'마이크로파가 음식에 닿지 못해 데워지지 않는다.',r:'‘마이크로파가 금속에 반사되어 음식에 닿지 못하므로 데워지지 않는다’는 내용이 들어 있는 문장이면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'금속은 마이크로파를 반사하므로, 금속 그릇과 뚜껑으로 둘러싸인 음식에는 마이크로파가 들어가지 못한다.'},
 {q:'전자레인지에서 마이크로파를 만들어 내는 장치의 이름을 윗글에서 찾아 쓰시오.',p:2.2,a:'마그네트론',r:'‘마그네트론’을 정확히 기재하면 정답',e:'첫째 문단에 제시되어 있다.'}]},

{pts:9.5,area:'국어·독서 + 문학',std:['12독서02-02','12문학02-03'],
 intent:'‘공간’과 ‘장소’의 개념을 이해하고 이를 문학 작품에 추론적으로 적용할 수 있는지 평가한다.',
 body:[
 {label:'(가)',text:R`지리학자 이-푸 투안은 ‘공간’과 ‘장소’를 구별하였다. 공간은 아직 아무 의미도 입혀지지 않은, 열려 있고 추상적인 곳이다. 지도 위의 좌표나 처음 도착한 낯선 도시가 그러하다. 그러나 우리가 어떤 곳에 머물며 그곳을 보고 듣고 만지는 동안 공간에는 기억과 느낌이 쌓인다. 이렇게 경험을 통해 의미와 가치가 깃든 공간을 장소라고 한다. 투안은 사람이 장소에 대하여 품는 정서적 유대를 ‘장소애(토포필리아)’라고 불렀다. 장소애는 눈으로 본 풍경만으로는 생기지 않는다. 그곳의 소리와 냄새와 감촉, 그곳에서 함께한 사람들과 되풀이한 일상이 몸에 새겨질 때 생긴다. 그래서 고향은 지도에서 가리킬 수 있는 한 지점이 아니라 감각의 기억들이 겹겹이 쌓인 장소이다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`넓은 벌 동쪽 끝으로
옛이야기 지줄대는 실개천이 회돌아 나가고,
얼룩백이 황소가
해설피 금빛 게으른 울음을 우는 곳,

― 그곳이 차마 꿈엔들 잊힐 리야.

*해설피: 해가 질 무렵 햇빛이 옅어진 모양.`,src:'정지용, 「향수」 중'}],
 qs:[
 {q:'&lt;보기&gt;는 (가)를 정리한 것이다. ⓐ에 들어갈 적절한 단어를 (가)에서 찾아 쓰시오.',p:3.7,box:'투안에 따르면 아무 의미도 없던 추상적인 공간은 사람의 ( ⓐ )을/를 통해 의미와 가치가 깃든 장소가 된다.',a:'경험',r:'‘경험’을 정확히 기재하면 정답',e:'“경험을 통해 의미와 가치가 깃든 공간을 장소라고 한다.”에서 찾을 수 있다.'},
 {q:'&lt;보기&gt;는 (가)의 관점에서 (나)를 정리한 것이다. ⓑ에 들어갈 적절한 2어절의 말을 (나)에서 찾아 쓰시오.',p:5.8,box:'(나)의 화자에게 고향은 실개천이 지줄대는 소리와 황소의 게으른 울음 같은 감각의 기억이 쌓인 ‘장소’이다. 화자가 이 장소에 품은 깊은 정서적 유대는 후렴구의 ( ⓑ )(이)라는 말에 집약되어 있다.',a:'잊힐 리야',r:'‘잊힐 리야’를 정확히 기재하면 정답 (‘잊힐리야’로 붙여 쓴 경우도 정답)',e:'후렴구 “그곳이 차마 꿈엔들 잊힐 리야.”는 꿈에서조차 잊을 수 없다는 뜻으로, 고향에 대한 장소애를 직접 드러낸다.'}]},

{pts:10,area:'국어·독서(예술)',std:['12독서02-02','12독서02-01'],
 intent:'사진의 노출을 결정하는 세 요소를 정확히 이해하고, 이를 구체적인 사진에 적용할 수 있는지 평가한다.',
 body:[{text:R`사진은 빛으로 그리는 그림이다. 사진기가 받아들이는 빛의 양을 노출이라 하는데, 노출은 조리개, 셔터 속도, 감도의 세 가지로 조절한다. 조리개는 렌즈 안에서 빛이 지나는 구멍의 크기를 바꾼다. 구멍을 넓히면 빛이 많이 들어오지만 초점이 맞는 범위가 얕아져, 인물은 또렷하고 배경은 흐릿한 사진이 된다. 구멍을 좁히면 가까운 곳부터 먼 곳까지 두루 또렷해진다. 셔터 속도는 빛을 받아들이는 시간의 길이이다. 셔터를 짧게 열면 움직이는 대상이 멈춘 듯 찍히고, 길게 열면 그동안 움직인 자취가 한 장에 겹쳐 흐르듯 찍힌다. 감도는 빛에 반응하는 민감한 정도이다. 감도를 높이면 어두운 곳에서도 밝게 찍을 수 있지만, 사진에 거친 알갱이 같은 잡티가 늘어난다.

세 가지는 서로 맞물려 있다. 하나를 바꾸어 빛이 줄면 다른 것을 바꾸어 빛을 채워야 한다. 그래서 사진가는 무엇을 얻고 무엇을 내줄지를 늘 골라야 한다. 배경의 흐림을 조절하려면 ( ㉠ )을/를, 움직임의 표현을 조절하려면 ( ㉡ )을/를 먼저 정하고, 화질이 거칠어지는 것을 무릅쓰고라도 밝기를 얻어야 할 때에 ( ㉢ )을/를 올린다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠, ㉡, ㉢에 각각 들어갈 말을 윗글에서 찾아 쓰시오.',p:4.5,a:'㉠ 조리개, ㉡ 셔터 속도, ㉢ 감도',r:'‘조리개’, ‘셔터 속도’, ‘감도’를 순서대로 정확히 기재하면 정답, 각각의 항목별로 부분 점수 1.5점을 부여할 수 있음',e:'배경의 흐림은 조리개의 구멍 크기, 움직임의 표현은 셔터를 여는 시간, 잡티를 무릅쓴 밝기는 감도와 관련된다.'},
 {q:'윗글을 참고하여 &lt;보기&gt;의 사진에서 ⓐ를 얻기 위해 사진가가 택한 방법과 그 원리를 40자 내외로 쓰시오.',p:5.5,box:'숲속의 폭포를 찍은 사진이다. 둘레의 바위와 나무는 또렷한데, ⓐ<u>물줄기는 낱낱의 물방울이 아니라 흰 비단을 드리운 듯 부드럽게 이어져 있다.</u>',a:'셔터를 길게 열어, 그동안 물이 움직인 자취가 한 장에 겹쳐 흐르듯 찍히게 하였다.',r:'‘셔터를 길게 엶(느린 셔터 속도)’과 ‘움직인 자취가 겹쳐 흐르듯 찍힘’을 모두 쓰면 정답. 방법만 맞게 쓴 경우 부분 점수 부여, 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'셔터를 길게 열면 움직이는 대상의 자취가 겹쳐 찍힌다. 움직이지 않는 바위와 나무는 또렷하게 남는다.'}]},

{pts:12,area:'국어·독서 + 고전 시가',std:['12문학01-01','12독서02-03'],
 intent:'교훈 시가의 설득 방식을 이해하고 이를 시조에 적용함으로써 문학의 윤리적·정서적 가치를 이해한다.',
 body:[
 {label:'(가)',text:R`조선의 사대부들은 시가를 즐거움의 도구이자 가르침의 도구로 여겼다. 백성에게 유교의 도리를 일깨우려고 지은 노래를 교훈 시가라 한다. 고을을 다스리게 된 사대부들은 어려운 한문 경전 대신 쉬운 우리말 노래로 효도와 우애, 이웃 사이의 화목을 권하였다. 이때 노래는 도리를 실어 나르는 ㉠<u>수레</u>였다. 그러나 도리를 말한다고 해서 사람의 마음이 곧바로 움직이는 것은 아니다. 사람은 옳은 줄 알면서도 하지 않을 때가 많고, 그런 사람을 움직이는 것은 논리보다 감정이기 때문이다. 그래서 교훈 시가의 지은이들은 듣는 이를 꾸짖는 대신 ( ㉡ )에 호소하는 길을 택하였다.`},
 {label:'<A>',text:R`교훈 시가는 흔히 ‘하라’는 명령으로 시작하지만 명령만으로 끝나지 않는다. 지은이는 곧이어 그 일을 하지 않았을 때 닥칠 뉘우침을 떠올리게 한다. 기회는 한 번뿐이고 지나가면 되돌릴 수 없다는 점을 일깨워, 듣는 이가 스스로 서두르게 만드는 것이다. 이때 노래는 ‘마땅히 그래야 한다’는 도리의 말에서 ‘그러지 않으면 얼마나 서럽겠는가’라는 ( ㉡ )의 말로 옮겨 간다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`어버이 살아신 제 섬길 일란 다하여라
지나간 후면 애닯다 어찌하리
평생에 고쳐 못할 일이 이뿐인가 하노라`,src:'정철, 「훈민가」 중'}],
 qs:[
 {q:'㉠과 유사한 의미로 쓰인 단어를 (가)에서 찾아 쓰시오.',p:3.9,a:'도구',r:'‘도구’를 정확히 기재하면 정답',e:'‘도리를 실어 나르는 수레’는 노래가 가르침의 수단이라는 뜻이며, 첫 문장의 ‘가르침의 도구’와 통한다.'},
 {q:'㉡에 공통적으로 들어갈 단어를 (가)에서 찾아 쓰시오.',p:2.4,a:'감정',r:'‘감정’을 정확히 기재하면 정답',e:'“사람을 움직이는 것은 논리보다 감정”이라고 하였고, <A>에서 ‘서럽겠는가’는 감정에 호소하는 말이다.'},
 {q:'&lt;A&gt;의 내용을 바탕으로 (나)를 설명하시오.',p:5.7,a:'초장에서 어버이가 살아 계실 때 효도를 다하라고 명령한 뒤, 중장과 종장에서 돌아가신 뒤의 뉘우침과 되돌릴 수 없음을 떠올리게 하여 듣는 이의 감정에 호소함으로써 효의 실천을 이끈다.',r:'‘효도하라는 명령(초장)’, ‘뉘우침과 되돌릴 수 없음의 환기(중장·종장)’, ‘감정에 호소하여 실천을 이끎’의 내용을 서술하면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'초장의 ‘다하여라’는 명령, 중장의 ‘애닯다 어찌하리’는 뉘우침, 종장의 ‘고쳐 못할 일’은 되돌릴 수 없음에 대응한다.'}]}
],
M:[
{pts:8,area:'수학Ⅰ · 등차수열과 수열의 합',std:['12수학Ⅰ03-02','12수학Ⅰ03-01'],
 intent:'등차수열의 일반항을 구하고, 부분분수로 변형하여 수열의 합을 구할 수 있는지 평가한다.',
 body:R`등차수열 $\{a_{n}\}$ 이 $a_{2}=5$, $a_{4}=11$ 을 만족할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$a_{10}$ 의 값을 구하시오.`,p:3.5,a:R`$29$`,e:R`공차는 $\dfrac{11-5}{2}=3$, 첫째항은 $2$ 이므로 $a_{n}=3n-1$ 이고 $a_{10}=29$ 이다.`},
 {q:R`$\displaystyle\sum_{k=1}^{10}\frac{1}{a_{k}a_{k+1}}$ 의 값을 구하시오.`,p:4.5,a:R`$\dfrac{5}{32}$`,e:R`$\dfrac{1}{(3k-1)(3k+2)}=\dfrac13\left(\dfrac{1}{3k-1}-\dfrac{1}{3k+2}\right)$ 이므로 $$\frac13\left(\frac12-\frac1{32}\right)=\frac13\cdot\frac{15}{32}=\frac{5}{32}.$$`}]},
{pts:12,area:'수학Ⅰ · 삼각함수',std:['12수학Ⅰ02-02'],
 intent:'삼각함수의 그래프의 성질을 이해하고, 이를 이용하여 삼각방정식과 삼각부등식을 풀 수 있는지 평가한다.',
 body:R`함수 $f(x)=a\sin bx+c$ 의 최댓값이 $5$, 최솟값이 $-1$, 주기가 $\pi$ 일 때, 다음 물음에 답하시오. (단, $a>0$, $b>0$ 이고 $a,\ b,\ c$ 는 상수)`,
 qs:[
 {q:R`$a$ 의 값을 구하시오.`,p:1.5,a:R`$3$`,e:R`$a+c=5$, $-a+c=-1$ 에서 $a=3$, $c=2$ 이다.`},
 {q:R`$b+c$ 의 값을 구하시오.`,p:2.0,a:R`$4$`,e:R`주기 $\dfrac{2\pi}{b}=\pi$ 에서 $b=2$ 이고 $c=2$ 이므로 $b+c=4$ 이다.`},
 {q:R`$0\le x<2\pi$ 에서 방정식 $f(x)=2$ 의 서로 다른 실근의 개수를 구하시오.`,p:3.9,a:R`$4$`,e:R`$3\sin2x+2=2$ 에서 $\sin2x=0$ 이다. $0\le2x<4\pi$ 이므로 $2x=0,\ \pi,\ 2\pi,\ 3\pi$, 즉 $x=0,\ \dfrac\pi2,\ \pi,\ \dfrac{3\pi}{2}$ 의 $4$ 개이다.`},
 {q:R`$0\le x\le\pi$ 에서 부등식 $f(x)\ge\dfrac72$ 의 해가 $\alpha\le x\le\beta$ 일 때, $\beta-\alpha$ 의 값을 구하시오.`,p:4.6,a:R`$\dfrac{\pi}{3}$`,e:R`$\sin2x\ge\dfrac12$ 이고 $0\le2x\le2\pi$ 이므로 $\dfrac\pi6\le2x\le\dfrac{5\pi}{6}$, 즉 $\dfrac{\pi}{12}\le x\le\dfrac{5\pi}{12}$ 이다. 따라서 $\beta-\alpha=\dfrac\pi3$ 이다.`}]}
]},
nat:{M:[
{pts:12,area:'미적분 · 급수와 등비급수',std:['12미적01-04','12미적01-05'],
 intent:'부분분수를 이용하여 급수의 합을 구하고, 등비급수의 수렴 조건과 합을 구할 수 있는지 평가한다.',
 body:R`다음 물음에 답하시오.`,
 qs:[
 {q:R`$\displaystyle\sum_{n=1}^{\infty}\frac{1}{n(n+2)}$ 의 값을 구하시오.`,p:2.5,a:R`$\dfrac34$`,e:R`$\dfrac{1}{n(n+2)}=\dfrac12\left(\dfrac1n-\dfrac1{n+2}\right)$ 이므로 부분합은 $\dfrac12\left(1+\dfrac12-\dfrac1{n+1}-\dfrac1{n+2}\right)$ 이고 극한은 $\dfrac34$ 이다.`},
 {q:R`등비급수 $\displaystyle\sum_{n=1}^{\infty}\left(\frac x2-1\right)^{n}$ 이 수렴하도록 하는 정수 $x$ 의 개수를 구하시오.`,p:4.0,a:R`$3$`,e:R`$-1<\dfrac x2-1<1$ 에서 $0<x<4$ 이므로 정수 $x$ 는 $1,\ 2,\ 3$ 의 $3$ 개이다.`},
 {q:R`(2)에서 구한 각 정수 $x$ 에 대하여 등비급수 $\displaystyle\sum_{n=1}^{\infty}\left(\frac x2-1\right)^{n}$ 의 합을 $f(x)$ 라 할 때, 모든 $f(x)$ 의 값의 합을 구하시오.`,p:5.5,a:R`$\dfrac23$`,e:R`공비를 $r=\dfrac x2-1$ 라 하면 합은 $\dfrac{r}{1-r}$ 이다. $x=1$ 일 때 $r=-\dfrac12$, $f(1)=-\dfrac13$; $x=2$ 일 때 $r=0$, $f(2)=0$; $x=3$ 일 때 $r=\dfrac12$, $f(3)=1$ 이므로 합은 $\dfrac23$ 이다.`}]},
{pts:12,area:'미적분 · 삼각함수의 극한과 미분',std:['12미적02-04','12미적02-05','12미적02-11'],
 intent:'도형의 길이와 넓이를 삼각함수로 나타내고, 삼각함수의 극한과 미분을 이용하여 문제를 해결할 수 있는지 평가한다.',
 body:R`중심이 원점 $\mathrm{O}$ 이고 반지름의 길이가 $1$ 인 원 위에 두 점 $\mathrm{A}(1,\ 0)$, $\mathrm{P}(\cos\theta,\ \sin\theta)$ 가 있다. 점 $\mathrm{P}$ 에서의 원의 접선이 $x$ 축과 만나는 점을 $\mathrm{T}$ 라 할 때, 다음 물음에 답하시오. $\left(\text{단, }0<\theta<\dfrac\pi2\right)$`,
 qs:[
 {q:R`선분 $\mathrm{AP}$ 의 길이를 $L(\theta)$ 라 할 때, $\displaystyle\lim_{\theta\to0+}\frac{L(\theta)}{\theta}$ 의 값을 구하시오.`,p:3.3,a:R`$1$`,e:R`이등변삼각형 $\mathrm{OAP}$ 에서 $L(\theta)=2\sin\dfrac\theta2$ 이므로 $\displaystyle\lim_{\theta\to0+}\frac{2\sin\frac\theta2}{\theta}=1$ 이다.`},
 {q:R`삼각형 $\mathrm{PAT}$ 의 넓이를 $S(\theta)$ 라 할 때, $\displaystyle\lim_{\theta\to0+}\frac{S(\theta)}{\theta^{3}}$ 의 값을 구하시오.`,p:3.3,a:R`$\dfrac14$`,e:R`직각삼각형 $\mathrm{OPT}$ 에서 $\overline{\mathrm{OT}}=\dfrac{1}{\cos\theta}$ 이므로 $\overline{\mathrm{AT}}=\dfrac{1}{\cos\theta}-1$ 이고, 높이는 $\sin\theta$ 이다. $$S(\theta)=\frac12\cdot\frac{1-\cos\theta}{\cos\theta}\cdot\sin\theta,\qquad \frac{S(\theta)}{\theta^{3}}=\frac12\cdot\frac{1-\cos\theta}{\theta^{2}}\cdot\frac{\sin\theta}{\theta}\cdot\frac{1}{\cos\theta}\to\frac12\cdot\frac12\cdot1\cdot1=\frac14.$$`},
 {q:R`(2)의 $S(\theta)$ 에 대하여 $S'\!\left(\dfrac\pi3\right)$ 의 값을 구하시오.`,p:5.4,a:R`$\dfrac74$`,e:R`$S(\theta)=\dfrac12(\tan\theta-\sin\theta)$ 이므로 $S'(\theta)=\dfrac12(\sec^{2}\theta-\cos\theta)$ 이고 $S'\!\left(\dfrac\pi3\right)=\dfrac12\left(4-\dfrac12\right)=\dfrac74$ 이다.`}]},
{pts:10,area:'수학Ⅱ · 정적분의 활용',std:['12수학Ⅱ03-05','12수학Ⅱ03-04','12수학Ⅱ01-02'],
 intent:'두 곡선으로 둘러싸인 도형의 넓이를 구하고, 넓이를 이등분하는 직선을 구할 수 있는지 평가한다.',
 body:R`두 함수 $f(x)=x^{2}-2x$, $g(x)=-x^{2}+4x$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`두 곡선 $y=f(x)$, $y=g(x)$ 로 둘러싸인 부분의 넓이를 구하시오.`,p:3.9,a:R`$9$`,e:R`교점의 $x$ 좌표는 $2x^{2}-6x=0$ 에서 $x=0,\ 3$ 이다. $\displaystyle\int_{0}^{3}(6x-2x^{2})\,dx=27-18=9$.`},
 {q:R`$\displaystyle\lim_{h\to0}\frac1h\int_{3}^{3+h}f(t)\,dt$ 의 값을 구하시오.`,p:2.5,a:R`$3$`,e:R`$F'(x)=f(x)$ 인 $F$ 에 대하여 $\displaystyle\lim_{h\to0}\frac{F(3+h)-F(3)}{h}=f(3)=3$.`},
 {q:R`직선 $x=k$ 가 (1)의 부분의 넓이를 이등분할 때, 상수 $k$ 의 값을 구하시오.`,p:3.6,a:R`$\dfrac32$`,e:R`$\displaystyle\int_{0}^{k}(6x-2x^{2})\,dx=3k^{2}-\frac23k^{3}=\frac92$ 에서 $4k^{3}-18k^{2}+27=0$, $(2k-3)(2k^{2}-6k-9)=0$ 이다. $0<k<3$ 이므로 $k=\dfrac32$ 이다. ($6x-2x^{2}$ 의 그래프가 직선 $x=\dfrac32$ 에 대하여 대칭임을 이용해도 된다.)`}]},
{pts:10,area:'미적분 · 입체도형의 부피',std:['12미적03-06','12미적02-02'],
 intent:'단면의 넓이와 입체도형의 부피 사이의 관계를 이해하고, 지수함수의 정적분을 이용하여 부피를 계산할 수 있는지 평가한다.',
 body:R`두 곡선 $y=e^{x}$, $y=e^{-x}$ 과 직선 $x=1$ 로 둘러싸인 부분을 밑면으로 하는 입체도형 $S$ 가 있다. 이 입체도형을 $x$ 축에 수직인 평면으로 자른 단면이 모두 정사각형일 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$0\le x\le1$ 인 실수 $x$ 에 대하여 단면의 넓이에 대한 식 $A(x)$ 를 구하시오.`,p:1.5,a:R`$(e^{x}-e^{-x})^{2}$ $\left(e^{2x}-2+e^{-2x}\ \text{도 정답}\right)$`,e:R`$0\le x\le1$ 에서 $e^{x}\ge e^{-x}$ 이므로 한 변의 길이는 $e^{x}-e^{-x}$ 이다.`},
 {q:R`$x=\ln2$ 인 점을 지나는 단면의 넓이를 구하시오.`,p:1.5,a:R`$\dfrac94$`,e:R`$\left(2-\dfrac12\right)^{2}=\dfrac94$.`},
 {q:R`입체도형 $S$ 의 부피를 구하시오.`,p:7.0,a:R`$\dfrac{e^{2}-e^{-2}}{2}-2$ $\left(\dfrac{e^{2}}{2}-\dfrac{1}{2e^{2}}-2\ \text{도 정답}\right)$`,e:R`$$V=\int_{0}^{1}(e^{2x}-2+e^{-2x})\,dx=\Big[\frac{e^{2x}}{2}-2x-\frac{e^{-2x}}{2}\Big]_{0}^{1}=\frac{e^{2}-e^{-2}}{2}-2.$$`}]},
{pts:10,area:'수학Ⅰ · 수열의 귀납적 정의',std:['12수학Ⅰ03-01'],unit:'수학Ⅰ 수열(수열의 귀납적 정의, 여러 가지 수열의 합)',
 intent:'귀납적으로 정의된 수열의 일반항을 구하고, 자연수의 거듭제곱의 합을 이용하여 수열의 합을 구할 수 있는지 평가한다.',
 body:R`수열 $\{a_{n}\}$ 이 $$a_{1}=1,\qquad a_{n+1}=a_{n}+2n\quad(n=1,\ 2,\ 3,\ \cdots)$$ 을 만족할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$a_{5}$ 의 값을 구하시오.`,p:2.5,a:R`$21$`,e:R`$a_{2}=3$, $a_{3}=7$, $a_{4}=13$, $a_{5}=21$.`},
 {q:R`$a_{n}=111$ 을 만족하는 자연수 $n$ 의 값을 구하시오.`,p:4.3,a:R`$11$`,e:R`$a_{n}=1+\displaystyle\sum_{k=1}^{n-1}2k=n^{2}-n+1$ 이다. $n^{2}-n-110=0$, $(n-11)(n+10)=0$ 에서 $n=11$ 이다.`},
 {q:R`$\displaystyle\sum_{k=1}^{10}a_{k}$ 의 값을 구하시오.`,p:3.2,a:R`$340$`,e:R`$\displaystyle\sum_{k=1}^{10}(k^{2}-k+1)=385-55+10=340$.`}]},
{pts:10,area:'수학 · 집합과 명제',unit:'수학 집합과 명제(필요조건과 충분조건)',
 intent:'조건의 진리집합 사이의 포함 관계를 이용하여 필요조건과 충분조건을 판단할 수 있는지 평가한다.',
 body:R`실수 $x$ 에 대한 두 조건 $$p:\ x^{2}-4x-5\le0,\qquad q:\ |x-a|\le2$$ 에 대하여 다음 물음에 답하시오. (단, $a$ 는 정수)`,
 qs:[
 {q:R`조건 $p$ 의 진리집합에 속하는 정수의 개수를 구하시오.`,p:2.4,a:R`$7$`,e:R`$(x+1)(x-5)\le0$ 에서 $-1\le x\le5$ 이므로 정수는 $7$ 개이다.`},
 {q:R`$q$ 가 $p$ 이기 위한 충분조건이 되도록 하는 정수 $a$ 의 개수를 구하시오.`,p:5.4,a:R`$3$`,e:R`$q$ 의 진리집합 $\{x\mid a-2\le x\le a+2\}$ 가 $p$ 의 진리집합 $\{x\mid -1\le x\le5\}$ 에 포함되어야 하므로 $a-2\ge-1$, $a+2\le5$, 즉 $1\le a\le3$ 이다. 정수 $a$ 는 $3$ 개이다.`},
 {q:R`두 조건 $p,\ q$ 를 모두 만족하는 실수 $x$ 가 존재하도록 하는 정수 $a$ 의 최댓값을 구하시오.`,p:2.2,a:R`$7$`,e:R`두 진리집합의 교집합이 공집합이 아니려면 $a-2\le5$ 이고 $a+2\ge-1$, 즉 $-3\le a\le7$ 이다. 최댓값은 $7$ 이다.`}]},
{pts:8,area:'수학Ⅱ · 도함수의 활용',unit:'수학Ⅱ 미분(함수의 최대와 최소)',
 intent:'도형의 넓이를 함수로 나타내고, 도함수를 이용하여 최댓값을 구할 수 있는지 평가한다.',
 body:R`곡선 $y=9-x^{2}$ 위의 점 $\mathrm{P}(x,\ 9-x^{2})\ (0<x<3)$ 에서 $x$ 축, $y$ 축에 내린 수선의 발을 각각 $\mathrm{Q}$, $\mathrm{R}$ 라 하고, 원점 $\mathrm{O}$ 에 대하여 직사각형 $\mathrm{OQPR}$ 의 넓이를 $A(x)$ 라 할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$A'(1)$ 의 값을 구하시오.`,p:2.6,a:R`$6$`,e:R`$A(x)=x(9-x^{2})=9x-x^{3}$ 이므로 $A'(x)=9-3x^{2}$, $A'(1)=6$ 이다.`},
 {q:R`$A(x)$ 의 최댓값을 구하시오.`,p:2.6,a:R`$6\sqrt3$`,e:R`$A'(x)=0$ 에서 $x=\sqrt3$ 이고 이때 극대이면서 최대이다. $A(\sqrt3)=\sqrt3\cdot6=6\sqrt3$.`},
 {q:R`$A(x)$ 가 최대일 때, 직사각형 $\mathrm{OQPR}$ 의 둘레의 길이를 구하시오.`,p:2.8,a:R`$12+2\sqrt3$`,e:R`가로 $\sqrt3$, 세로 $6$ 이므로 둘레의 길이는 $2(\sqrt3+6)=12+2\sqrt3$ 이다.`}]},
{pts:8,area:'미적분 · 역함수의 미분',std:['12미적02-09'],
 intent:'역함수의 미분법을 이해하고, 역함수의 정적분을 넓이의 관계를 이용하여 구할 수 있는지 평가한다.',
 body:R`함수 $f(x)=x^{3}+x+1$ 의 역함수를 $g(x)$ 라 할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$g(3)$ 의 값을 구하시오.`,p:1.8,a:R`$1$`,e:R`$f(1)=3$ 이므로 $g(3)=1$ 이다.`},
 {q:R`$g'(3)$ 의 값을 구하시오.`,p:3.1,a:R`$\dfrac14$`,e:R`$g'(3)=\dfrac{1}{f'(g(3))}=\dfrac{1}{f'(1)}=\dfrac14$ 이다. ($f'(x)=3x^{2}+1$)`},
 {q:R`$\displaystyle\int_{1}^{3}g(x)\,dx$ 의 값을 구하시오.`,p:3.1,a:R`$\dfrac54$`,e:R`$f(0)=1$, $f(1)=3$ 이고 $f$ 는 증가함수이므로 $$\int_{1}^{3}g(x)\,dx=1\cdot3-0\cdot1-\int_{0}^{1}f(x)\,dx=3-\left(\frac14+\frac12+1\right)=\frac54.$$`}]}
],
K:[
{pts:10,area:'국어·독서 + 문학',std:['12독서02-05','12문학02-03'],
 intent:'빛 공해를 다룬 과학 분야의 글과 시 작품을 함께 읽고, 글의 정보를 바탕으로 문제 상황의 원인을 구성한다.',
 body:[
 {label:'(가)',text:R`도시의 밤하늘에서 별이 사라지고 있다. 별이 없어진 것이 아니라 우리가 보지 못하게 된 것이다. 가로등과 간판에서 하늘로 새어 나간 빛은 공기 중의 먼지와 수증기에 부딪혀 사방으로 흩어지고, 이 흩어진 빛이 밤하늘 전체를 뿌옇게 밝힌다. 낮에 별이 보이지 않는 것과 같은 이치이다. 별은 낮에도 떠 있지만 햇빛으로 밝아진 하늘과의 밝기 차이가 너무 작아서 보이지 않을 뿐이다. 별이 보이느냐 보이지 않느냐는 별 자체의 밝기가 아니라 별과 배경 하늘의 밝기 ( ㉠ )에 달려 있다.

빛 공해는 별만 가리는 것이 아니다. 갓 깨어난 바다거북은 밝은 쪽을 바다로 여겨 기어가는데, 해안의 불빛 때문에 뭍 쪽으로 향하다가 목숨을 잃는다. 밤에 이동하는 철새는 도시의 불빛에 이끌려 건물에 부딪힌다. 해결책은 뜻밖에 간단하다. 가로등에 갓을 씌워 빛이 아래쪽으로만 향하게 하면, 하늘로 새는 빛이 줄어들 뿐 아니라 같은 전기로 길은 더 밝아진다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`계절이 지나가는 하늘에는
가을로 가득 차 있습니다.

나는 아무 걱정도 없이
가을 속의 별들을 다 헤일 듯합니다.

가슴속에 하나둘 새겨지는 별을
이제 다 못 헤는 것은
쉬이 아침이 오는 까닭이요,
내일 밤이 남은 까닭이요,
아직 나의 청춘이 다하지 않은 까닭입니다.`,src:'윤동주, 「별 헤는 밤」 중'}],
 qs:[
 {q:'㉠에 들어갈 적절한 2음절의 단어를 (가)에서 찾아 쓰시오.',p:2.5,a:'차이',r:'‘차이’를 정확히 기재하면 정답',e:'낮에 별이 보이지 않는 까닭을 “하늘과의 밝기 차이가 너무 작아서”라고 설명하였다.'},
 {q:'(가)에서 빛 공해로 피해를 입는 동물 두 가지를 찾아 쓰시오.',p:3.1,a:'바다거북, 철새',r:'‘바다거북’, ‘철새’를 모두 정확히 기재하면 정답, 하나만 쓴 경우 부분 점수 부여',e:'둘째 문단에 두 사례가 제시되어 있다.'},
 {q:'(가)를 참고하여, 오늘날 도시에서는 (나)의 화자처럼 별을 헤아리기 어려운 까닭을 한 문장으로 쓰시오.',p:4.4,a:'하늘로 새어 나간 인공의 빛이 흩어져 밤하늘이 밝아지면서 별과 하늘의 밝기 차이가 줄어들어 별이 보이지 않기 때문이다.',r:'‘인공의 빛이 흩어져 밤하늘이 밝아짐’, ‘별과 하늘의 밝기 차이가 줄어듦’이라는 내용의 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'(가)의 첫 문단이 원인(새어 나간 빛의 흩어짐)과 원리(밝기 차이)를 모두 제시한다.'}]},
{pts:10,area:'국어·독서(과학·기술)',std:['12독서02-02','12독서03-03'],
 intent:'패리티 검사의 원리와 한계를 이해하고, 지문의 규칙을 적용하여 값을 추론한다.',
 body:[{text:R`컴퓨터는 모든 정보를 0과 1로 이루어진 비트의 열로 주고받는다. 그런데 전송 도중 잡음 때문에 0이 1로, 1이 0으로 뒤바뀌는 일이 생긴다. 이런 오류를 찾아내는 가장 간단한 방법이 패리티 검사이다. 보내는 쪽은 데이터 비트들 뒤에 패리티 비트라는 비트 하나를 덧붙인다. 짝수 패리티 방식에서는 데이터와 패리티 비트를 합친 전체에서 1의 개수가 짝수가 되도록 패리티 비트의 값을 정한다. 예를 들어 데이터가 1011001이면 1이 네 개로 이미 짝수이므로 패리티 비트는 0이고, 데이터가 1011000이면 1이 세 개이므로 패리티 비트는 1이다. 받는 쪽은 받은 비트 전체에서 1의 개수를 센다. 짝수이면 오류가 없다고 보고, 홀수이면 오류가 있다고 판단하여 다시 보내 달라고 요청한다.

패리티 검사는 비트 하나만 덧붙이면 되므로 간편하지만 한계가 뚜렷하다. 전송 중에 비트 하나가 뒤바뀌면 1의 개수가 하나 늘거나 줄어 홀수가 되므로 오류가 드러난다. 그러나 비트 두 개가 한꺼번에 뒤바뀌면 (㉠                    ). 또 오류가 있다는 사실만 알 뿐 오류가 난 비트의 위치는 알 수 없으므로, 받는 쪽이 스스로 오류를 고칠 수도 없다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 들어갈 적절한 말을 20자 내외로 쓰시오.',p:4.3,a:'1의 개수가 그대로 짝수여서 오류를 찾지 못한다.',r:'‘1의 개수가 여전히 짝수이므로 오류를 찾아내지 못한다’는 내용을 정확히 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'비트 두 개가 바뀌면 1의 개수는 2만큼 늘거나 줄거나 그대로이므로 짝수라는 성질이 유지된다.'},
 {q:'&lt;보기&gt;의 빈칸에 들어갈 적절한 말을 윗글에서 찾아 쓰시오.',p:2.5,box:'짝수 패리티 방식에서 받는 쪽은 받은 비트 전체에 들어 있는 1의 개수가 (        )이면 전송 중에 오류가 생겼다고 판단한다.',a:'홀수',r:'‘홀수’를 정확히 기재하면 정답',e:'첫째 문단의 마지막 문장에서 확인할 수 있다.'},
 {q:'짝수 패리티 방식을 쓴다고 할 때, 윗글을 바탕으로 다음 표의 ⓐ, ⓑ, ⓒ, ⓓ에 들어갈 내용을 쓰시오. (ⓒ, ⓓ는 ‘오류 있음’ 또는 ‘오류 없음’으로 쓸 것)',p:3.2,table:{head:['구분','비트열','구하는 것'],rows:[['보내는 쪽','데이터 1100101','패리티 비트 ⓐ'],['보내는 쪽','데이터 0111000','패리티 비트 ⓑ'],['받는 쪽','받은 비트 전체 10110011','판단 ⓒ'],['받는 쪽','받은 비트 전체 11110000','판단 ⓓ']]},a:'ⓐ 0, ⓑ 1, ⓒ 오류 있음, ⓓ 오류 없음',r:'예시 답안을 정확히 기재하면 정답. 각각의 항목별로 부분 점수 0.8점을 부여할 수 있음',e:'ⓐ 1이 4개(짝수)이므로 0. ⓑ 1이 3개(홀수)이므로 1. ⓒ 1이 5개(홀수)이므로 오류 있음. ⓓ 1이 4개(짝수)이므로 오류 없음.'}]}
]}
