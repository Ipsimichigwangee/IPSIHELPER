<style>
:root{--navy:#0c2748;--main:#17519c;--accent:#2f7fd6;--bg:#f1f4f8;--card:#fff;--ink:#141d2b;--mute:#5a6678;--line:#d5dde8;--warn:#b97a06;--bad:#c8414f;--ok:#1f8a5f;--soft:#e4edf9}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
header.top{background:linear-gradient(120deg,#081b33,#0c2748 55%,#17519c);color:#fff;padding:22px 16px 0}
header.top .in{max-width:1000px;margin:0 auto}
header.top h1{margin:0;font-size:23px;letter-spacing:-.5px}
header.top p{margin:2px 0 12px;color:#c3d8f2;font-size:14px}
nav.tabs{max-width:1000px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:inherit;font-size:15px;font-weight:700;color:#cfe0f5;background:transparent;border:0;border-radius:10px 10px 0 0;padding:9px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--bg);color:var(--navy)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
h2{font-size:21px;margin:0 0 10px;letter-spacing:-.4px}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px;box-shadow:0 1px 3px rgba(12,39,72,.06)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 14px;background:var(--main);color:#fff;cursor:pointer;font-size:14.5px}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--soft);color:var(--navy)}
.btn.s{padding:4px 10px;font-size:13.5px;border-radius:8px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--navy);margin:0 5px 4px 0;white-space:nowrap}
.tag.y{background:#fff1d1;color:#7a5200}.tag.r{background:#ffe1e4;color:#9b2433}.tag.b{background:#e0ecff;color:#1d4d9a}.tag.gr{background:#eceff1;color:#4a5560}
.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:12.5px}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;font-size:14.5px;vertical-align:top}
th{background:#edf2f9;font-weight:700}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px;color:var(--main);line-height:1.25}
.stat span{font-size:13.5px;color:var(--mute)}
.note{border-radius:10px;padding:11px 14px;margin:0 0 16px;font-size:14.5px}
.note.past{background:#fff3f4;border:1px solid #f3cdd2}
.note.mock{background:#eef5ff;border:1px solid #cfe0f7}
.note.src{background:#f6f6f6;border:1px solid #e2e2e2;font-size:13.5px}
ul.tight{margin:6px 0 0;padding-left:20px}ul.tight li{margin-bottom:4px}
/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:rgba(241,244,248,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:14.5px;font-weight:700;border:0;background:transparent;color:var(--mute);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--main);color:#fff}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;color:var(--navy);min-width:74px}
.timer.low{color:var(--bad)}
.score{margin-left:auto;font-size:14.5px;font-weight:700;color:var(--navy)}
.score b{font-size:18px;color:var(--main)}
/* problems */
.prob{scroll-margin-top:70px}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:-2px 0 10px}
.ph .no{font-size:18px;font-weight:800;color:#fff;background:var(--main);border-radius:8px;padding:2px 14px}
.ph .pts{margin-left:auto;font-weight:700;color:var(--main)}
.lead{font-weight:600;margin:0 0 8px}
.psg{border:1px solid #cdd9ea;background:#f7fafe;border-radius:8px;padding:14px 16px;margin:0 0 10px;font-family:"Noto Serif KR","Nanum Myeongjo","Batang",serif;font-size:15.5px;line-height:1.9}
.psg .lb{font-family:"Pretendard Variable","Pretendard",sans-serif;font-weight:800;color:var(--navy);margin:0 0 2px}
.psg p{margin:0 0 8px;text-indent:.9em}
.psg p.stz{text-indent:0;padding-left:1.2em;margin:0 0 14px}
.psg .srcl{text-align:right;font-size:13.5px;color:var(--mute);margin:4px 0 0;font-family:"Pretendard Variable","Pretendard",sans-serif}
.psg.sum{background:#fbfaf5;border:1px dashed #cfc7ad;font-family:inherit;font-size:15px;line-height:1.75}
.psg.sum p{text-indent:0}
.psg.sum .lb::after{content:" · 지문 요약";font-weight:600;color:var(--warn);font-size:13px}
.psg.sum .lb.only::after{content:"지문 요약"}
.mbody{border:1px solid #cdd9ea;background:#f4f9ff;border-radius:8px;padding:14px 16px;margin:0 0 10px;font-size:16.5px;line-height:2;overflow-x:auto}
.cond{border:1px solid #9cc3ee;background:#fff;border-radius:6px;padding:8px 14px;margin:8px 0 0;line-height:2.1}
.sq{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line)}
.sq:first-of-type{border-top:0}
.sqh{display:flex;gap:8px;align-items:baseline}
.sqh .n{font-weight:800;color:var(--main);flex:0 0 auto}
.sqh .t{flex:1 1 auto;font-weight:600;line-height:1.9;min-width:0;overflow-x:auto;overflow-y:hidden}
.pt{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#fff;background:#4a76c0;border-radius:99px;padding:1px 9px;white-space:nowrap}
.bx{border:1px solid #9aa8ba;border-radius:6px;padding:10px 14px 10px;margin:8px 0 0 22px;background:#fff;font-size:15px}
.bx .bl{text-align:center;font-weight:700;color:var(--mute);font-size:13.5px;margin:0 0 4px}
.qt{margin:8px 0 0 22px}
.qt td,.qt th{text-align:center;vertical-align:middle}
.qt td:first-child{text-align:left}
.qt.eq td{text-align:center;border:0;font-weight:600}.qt.eq th{border:0;background:transparent;font-size:13.5px;color:var(--mute);white-space:normal}
textarea.ans{display:block;width:calc(100% - 22px);margin:8px 0 0 22px;min-height:44px;height:44px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;background:#fff}
details.sol{border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:16px 0 0;background:#fbfcfe}
details.sol>summary{cursor:pointer;font-weight:800;color:var(--main)}
.aq{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.aq .row{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;margin:2px 0;align-items:baseline}
.aq .row>span{min-width:0}.aq .row>span:last-child{overflow-x:auto;overflow-y:hidden}
.aq .lab{font-size:13px;font-weight:800;color:var(--mute)}
.aq .lab.a{color:var(--bad)}
.aq .ansv{font-weight:700}
.my{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:14px}
.my input{width:70px;font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;text-align:right}
.meta{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:14px;color:#3b4656}
.meta b{color:var(--navy)}
.meta ul{margin:2px 0 6px;padding-left:18px}
.katex{font-size:1.12em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
u{text-underline-offset:3px}
.bx .src{display:block;text-align:right;font-size:13px;color:var(--mute);margin-top:4px}
footer{max-width:1000px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:13px}
@media (max-width:600px){
 .card{padding:14px 14px;min-width:0}.bx,.qt,textarea.ans{margin-left:0}textarea.ans{width:100%}
 .aq .row{grid-template-columns:1fr}.bar #printq,.bar #printa{display:none}.mbody{font-size:15.5px}.score{margin-left:0;width:100%}
}
@media print{
 header.top p,nav.tabs,.bar,.noprint,textarea.ans,.my,footer{display:none!important}
 body{background:#fff;font-size:12.5pt}main{padding:0;max-width:none}
 header.top{background:none;color:#000;padding:0 0 6px}header.top h1{font-size:15pt}
 .card{box-shadow:none;border:1px solid #999;break-inside:avoid-page}
 details.sol:not([open]){display:none}
 .psg,.mbody{background:#fff}
}
</style>
</head>

const PAST={
hum:{K:[
{pts:11.5,page:15,area:'국어·문학(수필) + 문법',std:['12문학02-01','10국05-01'],
 intent:'김훈의 「회상」과 김소연의 「최초의 경험」을 통해 언어와 문학의 관계를 바탕으로 작품을 이해하고 글에 드러난 정보를 바탕으로 중심 내용과 표현을 파악한다.',
 body:[
 {label:'(가)',sum:true,text:R`소설 『칼의 노래』의 첫 문장을 “꽃은 피었다.”로 썼다가 고민 끝에 “꽃이 피었다.”로 고친 경험을 이야기한다. 글쓴이는 ㉠“꽃이 피었다.”는 사실의 세계를 진술한 언어이고 ㉡“꽃은 피었다.”는 의견과 정서의 세계를 진술한 언어라고 구별한다.`,src:'김훈, 「회상」'},
 {label:'(나)',sum:true,text:R`고민을 털어놓은 ‘나’에게 선배가 “그런 일은 ( ㉢ )”라고 말해 준다. “건성으로 해도 돼.”가 아니었다. 늘 지당한 말과 결합해 숨통을 막던 강요의 말 “해야 돼.”가 성실의 반대말인 ‘건성’과 함께 쓰이자 강압이 아니라 해방감이 되었다는 내용이다.`,src:'김소연, 「최초의 경험」'}],
 qs:[
 {q:'(가)와 (나)를 &lt;보기&gt;와 같이 요약할 때, ⓐ와 ⓑ에 들어갈 단어를 각각 (가)와 (나)에서 찾아 쓰시오.',p:3.2,box:'두 글은 언어의 미세한 차이가 세계를 인식하는 태도와 감정을 바꾼다는 점을 보여준다. (가)는 ( ⓐ )와/과 정서를 구분하는 언어의 힘을, (나)는 ( ⓑ )을/를 해방으로 바꾸는 언어의 전환을 통해 말의 선택이 곧 사유의 방식임을 드러낸다.',a:'ⓐ 사실, ⓑ 강요(강압)',r:'ⓐ: 사실 - 1.6점, ⓑ: 강요 - 1.6점 (‘강압’도 정답으로 인정)',e:'두 글에 공통으로 드러나는 언어 사용과 세계 인식의 관계를 이해하고, 핵심어인 ‘정서’와 ‘해방’을 바탕으로 ‘사실’과 ‘강요(강압)’를 추론한다.'},
 {q:'&lt;보기&gt;를 활용하여 ㉠과 ㉡에 대한 설명을 한 문장으로 쓰시오.',p:4.2,box:'‘격 조사’는 체언이나 체언 구실을 하는 말 뒤에 붙어 앞말이 다른 말에 대하여 갖는 일정한 자격을 나타내는 조사이고, ‘보조사’는 체언, 부사, 활용 어미 따위에 붙어서 어떤 특별한 의미를 더해 주는 조사이다.',a:'㉠은 격조사를 사용하였고, ㉡은 보조사를 사용하여 특별한 의미를 더한다.',r:'‘㉠은 격조사를 사용하였고, ㉡은 보조사를 사용하여 특별한 의미(정서)를 더한다.’라는 의미의 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'문법 요소의 특성을 탐구하고 이를 문학적 언어에 적용한다.'},
 {q:'㉢에 공통적으로 들어갈 말을 (나)에 있는 표현을 활용하여 쓰시오.',p:4.1,a:'건성으로 해야 돼.',r:'‘건성으로 해야 돼.’를 정확히 기재하면 정답',e:'언어와 삶의 유기적인 관계를 이해하고 핵심 표현을 글의 내용을 통해 추론한다.'}]},

{pts:9.0,page:17,area:'국어·고전 수필',std:['10국05-01','12독서01-01'],
 intent:'정약용의 「수오재기」에 나타난 인문학적 사유를 이해하고, 작품 구성의 유기적 관계를 사실적, 추론적으로 파악하며 글의 주제를 통해 삶의 가치를 깨닫는다.',
 body:[{sum:true,text:R`큰형님이 집에 붙인 ‘수오재(守吾齋, 나를 지키는 집)’라는 이름에서 출발하여 ‘나’를 지키는 일의 뜻을 깨닫는 글이다. &lt;A&gt; 부분에서 글쓴이는 밭, 집, 옷, 곡식 같은 것은 누가 훔쳐 갈 수 없으니 “( ㉠ )은/는 모두 지킬 필요가 없다.”라고 하고, 오직 달아나기 쉬운 ‘나’만은 지켜야 한다고 말한다. 이어 ㉡“나는 나를 잘못 간직했다가 잃어버렸던 자다.”라며 과거 공부와 벼슬살이에 빠져 지낸 지난날을 돌아본다.`,src:'정약용, 「수오재기」'}],
 qs:[
 {q:'㉠에 들어갈 말을 &lt;A&gt;에서 찾아 4음절로 쓰시오.',p:4.2,a:'천하 만물',r:'‘천하 만물’을 정확히 기재하면 정답',e:'제시된 <A>를 사실적으로 이해하고 종합적으로 추론하여 ‘천하 만물’을 찾아 쓴다.'},
 {q:'㉡에서 정약용이 추구했던 바를 표현하기에 가장 적합한 한 단어를 &lt;보기&gt;에서 찾아 쓰시오.',p:4.8,box:'[요약] 자아 존중감을 설명하는 글이다. 스스로를 부정적으로 평가하여 실망과 좌절을 겪은 사람은 자기를 고양하려 하며, 남에게 없는 것을 손에 넣어 다른 사람들로부터 인정을 받으면 자아 존중감이 높아진다는 내용이다.',a:'인정',r:'‘인정’을 정확히 기재하면 정답',e:'㉡은 ‘나’를 잃지 않고 지킨 큰형님과 대비되게, 다른 사람의 인정을 받으려고 애쓴 모습을 서술한 부분이다. ㉡과 <보기>를 종합하여 가장 적합한 단어 ‘인정’을 찾는다.'}]},

{pts:9.5,page:19,area:'국어·독서(사회)',std:['12독서03-02','12독서02-05'],
 intent:'연금에 대해 서술한 사회 분야의 글을 읽고 연금이 공적 연금, 사적 연금, 기초 연금으로 구성되어 있음을 알고, 우리나라의 기초 연금 제도에 대해 이해할 수 있다.',
 body:[{sum:true,text:R`연금 제도를 세 종류로 나누어 설명한다. 국가가 운영하며 의무적으로 가입하는 ( ㉠ ) 연금, 기업이나 개인 차원에서 노후 준비를 지원하는 ( ㉡ ) 연금, 그리고 기초 연금이다. 기초 연금의 유형 가운데 사회 수당형은 일정 연령 이상의 모든 노인에게 지급하는 방식으로 장점이 있지만 (㉢          ). 최저 소득 보장형은 소득·자산을 조사해 일정 수준 이하의 노인에게만 지급하여 재정 효율성이 높고, 최저 보장 연금형은 수령 연금이 기준 금액보다 적은 노인에게 차액을 보충한다. 우리나라의 기초 연금은 소득 인정액이 최저 소득 이하인 사람에게만 지급한다는 점에서 ( ㉣ )에 가깝지만, 기초 연금과 국민연금의 합이 일정 금액을 넘으면 기초 연금을 감하는 점에서 ( ㉤ )의 성격도 갖는다.`,src:'EBS 수능특강 독서(2025) 연계 지문'}],
 qs:[
 {q:'㉠과 ㉡에 각각 들어갈 2음절의 단어를 윗글에서 찾아 쓰시오.',p:2.0,a:'㉠ 공적, ㉡ 사적',r:'공적, 사적을 정확히 기재하면 각각 1.0점을 부여함',e:'‘국가에서 운영하는’ 공적 연금과 ‘기업이나 개인’ 차원의 사적 연금이 첫째·둘째 단락에 각각 서술되어 있다.'},
 {q:'윗글의 논지에 비추어 ㉢에 들어갈 내용을 30자 내외로 서술하시오.',p:4.5,a:'지원 대상을 특정할 수 없고, 예산이 많이 든다. (모든 국민을 지원하므로 예산 사용이 비효율적이다.)',r:'‘지원 대상을 특정할 수 없고, 예산이 많이 든다. (모든 국민을 지원하므로 예산 사용이 비효율적이다.)’라는 내용을 정확히 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'최저 소득 보장형이 특정 경제 수준 이하의 노인만을 목표로 하여 재정 효율성이 뛰어나다는 서술에서, 이와 대비되는 사회 수당형의 단점을 파악한다.'},
 {q:'㉣과 ㉤에 각각 들어갈 연금의 유형을 윗글에서 찾아 쓰시오.',p:3.0,a:'㉣ 최저 소득 보장형, ㉤ 최저 보장 연금형',r:'정답을 정확히 기재하면 각각 1.5점을 부여함',e:'소득 인정액이 최저 소득에 미치지 못하는 경우 지급하는 것이 ‘최저 소득 보장형’, 국가가 정한 연금 수령 기준 금액에 따라 가감하는 것이 ‘최저 보장 연금형’이다.'}]},

{pts:9.0,page:21,area:'국어·독서(사회) 주제 통합',std:['10국02-03','12독서01-02'],
 intent:'전망 이론의 등장 배경 및 주요 개념에 대한 글과 합리적·윤리적 소비에 대한 글을 함께 읽고 현대 사회의 가치 있는 소비와 관련된 문제를 통합적으로 이해한다.',
 body:[
 {label:'(가)',sum:true,text:R`합리적 소비와 윤리적 소비를 다룬 글이다. 소비자는 특정 상품을 사거나 사지 않는 선택을 함으로써 자신이 추구하는 ( ㉠ )을/를 드러낼 수 있다고 설명한다.`,src:'고등학교 국어 교과서 수록 지문'},
 {label:'(나)',sum:true,text:R`전망 이론의 등장 배경과 주요 개념(이익과 손실 상황에 따라 달라지는 선택, 보유 효과 등)을 설명한다. 보유 효과는 자신이 소유한 것에 더 높은 ( ㉠ )을/를 부여하는 것을 말한다.`,src:'EBS 수능완성(2025) 연계 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 단어를 (나)에서 찾아 한 단어로 쓰시오.',p:2.7,a:'가치',r:'‘가치’를 정확히 기재하면 정답',e:'소비자가 특정한 소비로 자신의 ‘가치’를 나타내는 상황과, 소유한 것에 더 높은 ‘가치’를 부여하는 보유 효과를 통해 핵심어를 추론한다.'},
 {q:'다음 ⓐ, ⓑ, ⓒ에 들어갈 말을 쓰시오.',p:6.3,box:'&lt;탐구 활동&gt; 국민이는 전망 이론에서 설명하는 개념을 다음과 같이 정리해 보았다.',table:{head:['이익과 손실에 따라 달라지는 확실성의 선호','','이득과 관련되는 상황','','손실과 관련되는 상황'],rows:[['( ⓐ )','=','( ⓑ )','+','( ⓒ )']]},a:'ⓐ 반사 효과, ⓑ 확실성의 효과, ⓒ 손실 회피',r:'반사 효과, 확실성의 효과, 손실 회피를 모두 정확히 기재하면 정답, 각각 2.1점씩 부여. ‘확실성의 효과’ 대신 ‘위험 회피적인 결정’, ‘손실 회피’ 대신 ‘위험 선호적인 결정’을 쓰면 부분 점수 부여',e:'전망 이론에서 설명하는 ‘반사 효과’, ‘확실성의 효과’, ‘손실 회피’의 정의와 개념들 사이의 관계를 이해한다.'}]},

{pts:9.5,page:23,area:'국어·독서(과학·기술)',std:['12독서02-01','12독서03-03'],
 intent:'에디슨 축음기의 구조를 서술한 과학 분야의 글을 읽고 과학 발명품의 작동 원리를 과학적 개념을 통해 이해할 수 있는지를 묻는 문제이다.',
 body:[{sum:true,text:R`에디슨의 축음기가 수화 장치, 기록 장치, 재생 장치로 이루어져 있음을 밝히고 각 장치의 구조와 작동 원리를 차례로 설명한다. 기록 장치의 원통에는 V자 모양의 ( ㉠ )이/가 나선 모양으로 파여 있고, 재생할 때에는 핀이 새겨진 ( ㉠ )을/를 따라 움직이며 진동을 되살린다. 에디슨은 축음기를 발명할 때 소리는 (㉡          )는 간단한 음향학적 지식에 근거를 두었다.`,src:'EBS 수능특강 독서(2025) 연계 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 단어를 윗글에서 찾아 한 단어로 쓰시오.',p:2.1,a:'홈',r:'‘홈’을 정확히 기재하면 정답',e:'‘V자 모양의 홈이 나선 모양으로 파여 있다.’ 등의 서술을 통해 ‘홈’을 추측한다.'},
 {q:'윗글을 참고하여 ㉡에 들어갈 내용을 20자 내외로 쓰시오.',p:5.2,a:'소리는 진동에서 비롯된다. (소리는 진동이다.)',r:'‘소리는 진동이다.’라는 내용이 들어 있는 문장이면 정답, 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'에디슨 축음기가 소리가 진동이라는 음향학적 원리에 기초해서 만들어졌다는 서술이 제시문에 반복적으로 나타난다.'},
 {q:'아래 &lt;그림&gt;은 에디슨의 축음기를 그린 것이다. 이 &lt;그림&gt;에 그려지지 않은 장치는 무엇인지 쓰시오. (그림은 가이드북 23쪽 참조)',p:2.2,a:'재생 장치',r:'‘재생 장치’를 정확히 기재하면 정답',e:'수화 장치, 기록 장치, 재생 장치에 대한 서술이 둘째, 셋째, 넷째 단락에 차례로 이어진다.'}]},

{pts:9.5,page:25,area:'국어·독서(인문) + 수필',std:['12독서02-02','12문학02-03'],
 intent:'본문에서 설명하고 있는 브뤼노 라투르의 가이아 개념을 이해하고 이를 문학 작품에 추론적으로 적용할 수 있는지 평가한다.',
 body:[
 {label:'(가)',sum:true,text:R`브뤼노 라투르의 ‘가이아’ 개념을 설명한다. 가이아는 수많은 행위자가 각자의 방식으로 행위의 물결을 일으키는 공생의 네트워크이다. 라투르는 파국을 외면하는 ‘인간들’과 달리, 파국을 중대한 문제로 지각하고 대안을 찾아가는 자들을 ‘지구생활자’라 부른다.`,src:'EBS 수능특강 독서(2025) 연계 지문'},
 {label:'(나)',sum:true,text:R`‘바다’라는 우리말의 크고 넓은 울림을 예찬하고, 육지보다 수면이 훨씬 넓으니 지구가 아니라 ‘수구(水球)’라 해야 옳다며 사람 중심의 생각을 뒤집어 본다. 사람이 어족이었다면 육대주는 무인절도였을 것이고 거기에 포대를 쌓는 자도 없었을 것이며, 오직 「별주부전」의 세계였으리라고 맺는다.`,src:'이태준, 「바다」'}],
 qs:[
 {q:'&lt;보기&gt;는 (가)를 정리한 것이다. ⓐ에 들어갈 적절한 단어를 (가)에서 찾아 쓰시오.',p:3.7,box:'(가)의 ‘지구생활자’는 ( ⓐ )을/를 벗어나기 위해서 지금의 세계가 이미 종말을 맞이한 상태임을 인정하고 이러한 절박한 인식을 바탕으로 대안을 모색하는 실천적인 주체이다.',a:'파국',r:'‘파국’을 정확히 기재하면 정답, ‘전쟁 상태’는 부분 점수',e:'둘째 단락에서 지구생활자는 “파국을 중대한 문제로 지각하고 있으며 대안을 찾아가는 자들”이라고 정의되어 있다.'},
 {q:'&lt;보기&gt;는 브뤼노 라투르의 가이아에 대응하는 말들을 (나)에서 찾아 정리한 것이다. ⓒ에 들어갈 적절한 2어절의 말을 (나)에서 찾아 쓰시오.',p:5.8,box:'바다, 수구, ( ⓒ )',a:'「별주부전」의 세계',r:'‘「별주부전」의 세계’를 정확히 기재하면 정답 (홑낫표를 생략한 ‘별주부전의 세계’도 정답으로 처리)',e:'(나)의 화자는 세상을 인간 중심적인 시각으로 판단하지 않으려 한다. ‘포대’는 인간 중심적 행위의 결과이고 ‘「별주부전」의 세계’는 그러한 행위가 억압한 대상으로, 인간의 인식 범위를 넘어서는 공생의 세계인 가이아와 연결된다.'}]},

{pts:10,page:27,area:'국어·독서(예술·과학) + 현대시',std:['12독서02-02','12문학02-03'],
 intent:'괴테의 색채론을 명확히 이해하고 이를 문학 작품에 추론적으로 적용할 수 있는지 평가한다.',
 body:[{sum:true,text:R`뉴턴의 광학 이론과 대비되는 괴테의 색채론을 설명한다. 괴테는 색채를 생리색, 물리색, 화학색으로 나누었다. 물리색은 생리색보다 객관적이고, 화학색은 생리색이나 물리색과 달리 고정적이며 객관적인 색이다. 괴테는 감각을 매개로 인간의 내부와 자연이 연결되어 있다고 보았고, 각각의 색에는 상징적 의미가 있어 색이 감각적·도덕적·미학적 목적으로 사용될 수 있다고 생각하였다. 문항 (1)은 세 가지 색채를 객관성의 정도에 따라 배열한 ㉠, ㉡, ㉢을 묻는다.`,src:'괴테의 색채론을 다룬 지문'}],
 qs:[
 {q:'㉠, ㉡, ㉢에 각각 들어갈 단어를 윗글에서 찾아 쓰시오.',p:4.5,a:'㉠ 화학색, ㉡ 생리색, ㉢ 물리색',r:'‘화학색’, ‘생리색’, ‘물리색’을 순서대로 정확히 기재하면 정답, 각각의 항목별로 부분 점수 1.5점을 부여할 수 있음',e:'넷째 단락에 물리색은 생리색보다 객관적이라는 서술이, 다섯째 단락에 화학색은 생리색이나 물리색과 다르게 객관적인 색이라는 서술이 있다. 이를 참고하여 세 색채의 객관성 정도를 비교한다.'},
 {q:'윗글을 참고하여 &lt;보기&gt;의 ⓐ의 표현 방식에 대해 40자 내외로 쓰시오.',p:5.5,box:'[요약] 백석의 시 「흰 바람벽이 있어」의 일부가 제시된다. 화자는 좁다란 방의 흰 바람벽에 떠오르는 가난한 늙은 어머니의 모습을 본다. 어머니는 “이렇게 ⓐ<u>시퍼러둥둥하니</u> 추운 날인데” 차디찬 물에 손을 담그고 무와 배추를 씻고 있다.',a:'색에는 상징적 의미가 있기에 감각적이고 미학적인 목적으로 사용될 수 있다.',r:'‘색에는 상징적 의미가 있기에 감각적이고 미학적인 목적으로 사용될 수 있다.’라는 내용의 문장이면 정답. 시에 언급된 표현 방식(“시퍼러둥둥하니”)에 주목하지 않은 채 단순히 시를 해석한 경우 부분 점수 부여. 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'<보기>의 시에서 색채는 감각과 연결되어 있으므로 뉴턴의 광학 이론이 아니라 괴테의 색채론을 참고하여 답해야 한다. 괴테는 색채 현상이 인간의 심리적·미학적 관점과 연결되어 있다고 보았다.'}]},

{pts:12,page:30,area:'국어·독서(인문) + 고전 시가',std:['12문학01-01','12독서02-03'],
 intent:'은유학의 창시자인 블루멘베르크의 ‘절대적 은유’ 개념을 활용하여 월명사의 향가 「제망매가」를 이해함으로써, 문학의 심미적, 정서적 가치에 대해 이해한다.',
 body:[
 {label:'(가)',sum:true,text:R`은유에 대한 종래 철학의 견해와 블루멘베르크의 견해를 설명한다. 종래 철학은 은유를 군더더기 장식으로 보거나, 개념이 형성되기 이전에 잠정적으로 사용되는 필요악으로 보았다. 블루멘베르크는 은유가 개념으로 환원되지 못한 ㉠잉여일 수 있음을 인정하면서도, 결코 ( ㉡ )(으)로 대체될 수 없는 고유한 표현이 있다고 보고 이를 ‘절대적 은유’라 하였다. &lt;A&gt; 부분은 인간이 ( ㉡ )(으)로 규정할 수 없는 것을 절대적 은유로 표현함으로써 세계와의 조화를 추구한다는 내용이다.`,src:'EBS 수능특강 독서(2025) 연계 지문'},
 {label:'(나)',sum:true,text:R`죽은 누이를 추모하는 10구체 향가이다. 삶과 죽음의 갈림길, 한 가지에서 나고도 가는 곳을 모르는 잎이라는 비유로 누이의 죽음을 노래하고, 미타찰에서 다시 만날 날을 기다리며 도를 닦겠다는 다짐으로 맺는다.`,src:'월명사, 「제망매가」'}],
 qs:[
 {q:'㉠과 유사한 의미를 지닌 단어를 (가)에서 찾아 쓰시오.',p:3.9,a:'필요악',r:'‘필요악’을 정확히 기재하면 정답',e:'‘개념으로 환원되지 못한 잉여’와 유사한 ‘개념이 형성되기 이전에 잠정적으로 사용되는 필요악’을 찾는다. 종래 철학의 두 번째 해석과 관련되므로 ‘군더더기’나 ‘장식’은 오답이다.'},
 {q:'㉡에 공통적으로 들어갈 단어를 (가)에서 찾아 쓰시오.',p:2.4,a:'개념',r:'‘개념’을 정확히 기재하면 정답',e:'은유와 대비되는 용어로 ‘개념’을 찾을 수 있다.'},
 {q:'&lt;A&gt;의 ‘절대적 은유’에 대한 내용을 바탕으로 (나)를 설명하시오.',p:5.7,a:'삶의 근원적인 허무를 은유를 통해 구체화함으로써 종교적으로 승화하고 있다. (죽음이 주는 공포와 슬픔을 은유를 통해 형상화함으로써 상실감을 승화시킨다.)',r:'‘삶의 근원적인 허무를 은유를 통해 구체화함으로써 종교적으로 승화하고 있다.’라는 답안의 내용을 서술하면 정답, 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'개념으로는 파악할 수 없는 인식을 절대적 은유로 표현함으로써 세계와의 조화를 추구할 수 있다는 개념을 「제망매가」에 적용한다.'}]}
],
M:[
{pts:8,page:32,area:'수학Ⅰ · 로그함수',std:['12수학Ⅰ01-07','12수학Ⅰ01-08'],
 intent:'로그함수를 이해하고 로그함수의 그래프를 그릴 수 있으며, 그 성질을 바탕으로 하는 문제 해결 능력을 평가한다.',
 body:R`직선 $x=2$ 가 $f(x)=\log_{2}x-1$, $g(x)=\log_{\frac12}x$ 와 만나는 점을 각각 $\mathrm{A}$, $\mathrm{B}$ 라 하고, 두 곡선 $y=f(x)$ 와 $y=g(x)$ 가 만나는 점을 $\mathrm{C}$ 라 할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`점 $\mathrm{C}$ 의 좌표가 $(a,\ b)$ 일 때, $ab$ 의 값을 구하시오.`,p:3.5,a:R`$-\dfrac{\sqrt2}{2}$`,e:R`$f(2)=\log_{2}2-1=0$ 이므로 $\mathrm{A}(2,\ 0)$, $g(2)=-\log_{2}2=-1$ 이므로 $\mathrm{B}(2,\ -1)$ 이다. 두 곡선의 교점은 $\log_{2}x-1=-\log_{2}x$ 에서 $2\log_{2}x=1$, 진수 $x>0$ 이므로 $x=\sqrt2$ 이다. $f(\sqrt2)=\dfrac12-1=-\dfrac12$ 이므로 $\mathrm{C}\left(\sqrt2,\ -\dfrac12\right)$ 이고 $ab=\sqrt2\times\left(-\dfrac12\right)=-\dfrac{\sqrt2}{2}$ 이다.`},
 {q:R`삼각형 $\mathrm{ACB}$ 의 넓이가 $p+q\sqrt2$ 일 때, $p+q$ 의 값을 구하시오. (단, $p$ 와 $q$ 는 유리수)`,p:4.5,a:R`$\dfrac12$`,e:R`선분 $\mathrm{AB}$ 의 길이는 $1$, 삼각형의 높이는 $h=2-\sqrt2$ 이다. 따라서 넓이는 $$S=\frac12\cdot1\cdot(2-\sqrt2)=1-\frac12\sqrt2=p+q\sqrt2$$ 이고 $p+q=1+\left(-\dfrac12\right)=\dfrac12$ 이다.`}]},
{pts:12,page:34,area:'수학Ⅰ · 삼각함수',std:['12수학Ⅰ02-02'],
 intent:'주어진 구간 안에서 삼각함수의 성질을 이용하여 삼각부등식을 풀 수 있다.',
 body:R`구간 $0\le x<2\pi$ 에서 부등식 $6\cos^{2}x+\sin x\le5$ 를 만족하는 해 $x$ 는 $\alpha\le x\le\beta$ 또는 $\gamma\le x\le\delta$ 일 때, 다음 물음에 답하시오. (단, $\beta<\gamma$)`,
 qs:[
 {q:R`$\alpha$ 의 값을 구하시오.`,p:1.5,a:R`$\dfrac{\pi}{6}$`,e:R`$6(1-\sin^{2}x)+\sin x-5\le0$ 에서 $6\sin^{2}x-\sin x-1=(3\sin x+1)(2\sin x-1)\ge0$ 이다. 그러므로 $\sin x\le-\dfrac13$ 또는 $\sin x\ge\dfrac12$ 이다. $0<\alpha<\dfrac{\pi}{2}$ 이므로 $\sin\alpha=\dfrac12$, $\alpha=\dfrac{\pi}{6}$ 이다.`},
 {q:R`$\beta$ 의 값을 구하시오.`,p:2.0,a:R`$\dfrac{5\pi}{6}$`,e:R`$\sin\alpha=\sin\beta=\dfrac12$, $\alpha\le\beta$ 이므로 $\beta=\dfrac{5\pi}{6}$ 이다.`},
 {q:R`$\gamma+\delta$ 의 값을 구하시오.`,p:3.9,a:R`$3\pi$`,e:R`$\sin\gamma=\sin\delta=-\dfrac13$ 인 두 각은 직선 $x=\dfrac{3\pi}{2}$ 에 대하여 대칭이므로 $\dfrac{\gamma+\delta}{2}=\dfrac{3\pi}{2}$ 이고 $\gamma+\delta=3\pi$ 이다.`},
 {q:R`$\cos(-\alpha+\beta+\gamma+\delta)$ 의 값을 구하시오.`,p:4.6,a:R`$\dfrac12$`,e:R`$$\cos(-\alpha+\beta+\gamma+\delta)=\cos\left(-\frac{\pi}{6}+\frac{5\pi}{6}+3\pi\right)=\cos\left(2\pi+\left(\pi+\frac{2\pi}{3}\right)\right)=\cos\left(\pi+\frac{2\pi}{3}\right)=\frac12$$`}]}
]},
nat:{M:[
{pts:12,page:37,area:'수학Ⅰ, 미적분 · 등비급수',std:['12수학Ⅰ03-03','12미적01-03','12미적01-04','12미적01-05'],
 intent:'수렴하는 등비급수를 이용하여 등비수열의 일반항을 구할 수 있고, 급수의 수렴성으로부터 수열의 극한값과 다른 급수의 수렴을 판단할 수 있는지 평가한다.',
 body:R`등비수열 $\{a_{n}\}$ 과 수열 $\{b_{n}\}$ 이 $$\sum_{n=1}^{3}a_{n}=26,\qquad \sum_{n=1}^{\infty}a_{n}=27,\qquad \sum_{n=1}^{\infty}\left(a_{n}+b_{n}-\frac{3n^{2}-n}{9n^{2}-3n-2}\right)=28$$ 을 만족할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$a_{4}$ 의 값을 구하시오.`,p:2.5,a:R`$\dfrac23$`,e:R`첫째항을 $a$, 공비를 $r$ 라 하면 $\dfrac{a(1-r^{3})}{1-r}=26$, $\dfrac{a}{1-r}=27$ 에서 $1-r^{3}=\dfrac{26}{27}$, $r=\dfrac13$, $a=18$ 이다. 따라서 $a_{4}=18\cdot\dfrac{1}{27}=\dfrac23$ 이다.`},
 {q:R`$\displaystyle\lim_{n\to\infty}b_{n}$ 의 값을 구하시오.`,p:4.0,a:R`$\dfrac13$`,e:R`급수가 수렴하므로 $\displaystyle\lim_{n\to\infty}\left(a_{n}+b_{n}-\frac{3n^{2}-n}{9n^{2}-3n-2}\right)=0$ 이다. $\displaystyle\lim_{n\to\infty}a_{n}=0$, $\displaystyle\lim_{n\to\infty}\frac{3n^{2}-n}{9n^{2}-3n-2}=\frac13$ 이므로 $\displaystyle\lim_{n\to\infty}b_{n}=\frac13$ 이다.`},
 {q:R`$\displaystyle\lim_{n\to\infty}\left\{a_{n}+b_{n}+\sum_{k=1}^{n}\left(a_{k}+b_{k}-\frac13\right)\right\}=29+A$ 일 때, 유리수 $A$ 를 구하시오.`,p:5.5,a:R`$-\dfrac49$`,e:R`$c_{k}=\dfrac{3k^{2}-k}{9k^{2}-3k-2}$ 라 하면 $$c_{k}-\frac13=\frac{2}{3(3k-2)(3k+1)}=\frac29\left(\frac{1}{3k-2}-\frac{1}{3k+1}\right)$$ 이므로 $\displaystyle\sum_{k=1}^{\infty}\left(c_{k}-\frac13\right)=\frac29$ 이다. 따라서 $$\sum_{k=1}^{\infty}\left(a_{k}+b_{k}-\frac13\right)=\sum_{k=1}^{\infty}\left(a_{k}+b_{k}-c_{k}\right)+\sum_{k=1}^{\infty}\left(c_{k}-\frac13\right)=28+\frac29$$ 이고, $\displaystyle\lim_{n\to\infty}(a_{n}+b_{n})=\frac13$ 이므로 구하는 극한값은 $\dfrac13+28+\dfrac29=29-\dfrac49$ 이다. 따라서 $A=-\dfrac49$ 이다.`}]},
{pts:12,page:39,area:'미적분 · 접선, 삼각함수의 극한, 정적분과 급수',std:['12미적02-09','12미적02-11','12미적02-04','12미적03-04'],
 intent:'정적분과 급수의 합 사이의 관계를 이해하고, 미분계수와 접선의 기울기와의 관계, 음함수의 미분법과 삼각함수의 극한을 이용하여 문제를 해결할 수 있는지 평가한다.',
 body:R`$k$ 가 자연수일 때, 중심이 원점이고 반지름이 $1$ 인 원 위의 점 $\mathrm{P}_{k}(\cos\theta_{k},\ \sin\theta_{k})$ 에 대하여 다음 물음에 답하시오. (단, $\theta_{k}=\dfrac{k\pi}{2n}$, $1\le k\le n-1$ 이고, $n$ 은 $2$ 이상의 자연수)`,
 qs:[
 {q:R`점 $\mathrm{P}_{k}$ 에서의 접선과 $x$ 축 및 $y$ 축으로 둘러싸인 부분의 넓이를 $A_{k}$ 라 할 때, $A_{k}=\dfrac{1}{\sin\alpha_{k}}$ 를 만족한다. 이때, $\dfrac{\alpha_{k}}{\theta_{k}}$ 의 값을 구하시오.`,p:3.3,a:R`$2$`,e:R`점 $\mathrm{P}_{k}$ 에서의 접선은 $x\cos\theta_{k}+y\sin\theta_{k}=1$ 이므로 $x$ 절편은 $\dfrac{1}{\cos\theta_{k}}$, $y$ 절편은 $\dfrac{1}{\sin\theta_{k}}$ 이다. 따라서 $$A_{k}=\frac{1}{2\sin\theta_{k}\cos\theta_{k}}=\frac{1}{\sin2\theta_{k}}$$ 이고 $\alpha_{k}=2\theta_{k}$, 즉 $\dfrac{\alpha_{k}}{\theta_{k}}=2$ 이다.`},
 {q:R`점 $\mathrm{P}_{k}$ 를 지나는 접선의 기울기가 $m_{k}$ 일 때, 이 접선과 $x$ 축이 만나는 점을 $\mathrm{Q}_{k}$ 라 하고, 점 $\mathrm{P}_{k}$ 를 지나고 기울기가 $-\dfrac{1}{m_{k}}$ 인 직선과 $x$ 축이 만나는 점을 $\mathrm{R}_{k}$ 라 하자. 삼각형 $\mathrm{P}_{k}\mathrm{Q}_{k}\mathrm{R}_{k}$ 의 넓이를 $\dfrac12f(\theta_{k})$ 라 할 때, $\displaystyle\lim_{x\to0}\frac{f(x)}{x}$ 의 값을 구하시오.`,p:3.3,a:R`$1$`,e:R`$m_{k}=-\dfrac{\cos\theta_{k}}{\sin\theta_{k}}$ 이므로 기울기가 $-\dfrac{1}{m_{k}}=\tan\theta_{k}$ 이고 점 $\mathrm{P}_{k}$ 를 지나는 직선은 원점을 지난다. 즉 $\mathrm{R}_{k}$ 는 원점이고 $\mathrm{Q}_{k}\left(\dfrac{1}{\cos\theta_{k}},\ 0\right)$ 이다. 삼각형의 밑변의 길이는 $\dfrac{1}{\cos\theta_{k}}$, 높이는 $\sin\theta_{k}$ 이므로 넓이는 $\dfrac12\tan\theta_{k}$, 즉 $f(x)=\tan x$ 이다. 따라서 $\displaystyle\lim_{x\to0}\frac{\tan x}{x}=1$ 이다.`},
 {q:R`문제 (1)에서 구한 $A_{k}$ 에 대하여 $S_{n}=\displaystyle\sum_{k=1}^{n-1}\frac{1}{A_{k}}$ 일 때, $\displaystyle\lim_{n\to\infty}\frac{S_{n}}{n}$ 의 값을 구하시오.`,p:5.4,a:R`$\dfrac{2}{\pi}$`,e:R`$\dfrac{1}{A_{k}}=\sin2\theta_{k}=\sin\dfrac{k\pi}{n}$ 이므로 $$\lim_{n\to\infty}\frac{S_{n}}{n}=\lim_{n\to\infty}\frac1n\sum_{k=1}^{n-1}\sin\frac{k\pi}{n}=\int_{0}^{1}\sin\pi x\,dx=\left[-\frac{1}{\pi}\cos\pi x\right]_{0}^{1}=\frac{2}{\pi}$$ 이다.`}]},
{pts:10,page:41,area:'수학Ⅱ, 미적분 · 넓이와 극한',std:['12수학Ⅱ03-05','12수학Ⅱ01-01','12수학Ⅱ01-02','12미적03-04'],
 intent:'정적분을 활용하여 곡선으로 둘러싸인 도형의 넓이를 구하고, 도형의 넓이를 임의의 독립변수에 대한 함수로 이해하여 함수의 극한을 계산할 수 있음을 확인한다. 또한 정적분과 급수의 합 사이의 관계를 이해하고 있음을 평가한다.',
 body:R`곡선 $f(x)=\dfrac{1}{x^{4}}$ 과 두 직선 $y=f(k)$, $x=1$ 로 둘러싸인 영역의 넓이를 $A(k)$ 라 할 때, 다음 물음에 답하시오. (단, $k>1$)`,
 qs:[
 {q:R`넓이가 $A(k)=\dfrac1B+\dfrac{1}{k^{B}}\left(\dfrac1k+C\right)$ 일 때, $BC$ 의 값을 구하시오. (단, $B$, $C$ 는 상수)`,p:3.9,a:R`$-4$`,e:R`$$A(k)=\int_{1}^{k}\left(\frac{1}{x^{4}}-\frac{1}{k^{4}}\right)dx=\left[-\frac{1}{3x^{3}}\right]_{1}^{k}-\frac{k-1}{k^{4}}=\frac13+\frac{1}{k^{3}}\left(\frac1k-\frac43\right)$$ 이므로 $B=3$, $C=-\dfrac43$ 이고 $BC=-4$ 이다.`},
 {q:R`$\displaystyle\lim_{k\to\infty}A(k)$ 의 값을 구하시오.`,p:2.5,a:R`$\dfrac13$`,e:R`$k\to\infty$ 일 때 $\dfrac{1}{k^{3}}\left(\dfrac1k-\dfrac43\right)\to0$ 이므로 극한값은 $\dfrac13$ 이다.`},
 {q:R`$\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\left\{f\left(1+\frac{k}{n}\right)-f\left(1+\frac{k+1}{n}\right)\right\}\frac{k}{n}$ 의 값을 구하시오.`,p:3.6,a:R`$\dfrac{11}{48}$`,e:R`$x_{k}=1+\dfrac{k}{n}$ 라 하면 $\displaystyle\sum_{k=1}^{n}\{f(x_{k})-f(x_{k+1})\}\frac{k}{n}=\frac1n\sum_{k=1}^{n}f(x_{k})-f(x_{n+1})$ 이다. (각 $f(x_{k})$ 의 계수가 $\dfrac{k}{n}-\dfrac{k-1}{n}=\dfrac1n$ 이고, 마지막 항의 계수는 $-\dfrac{n}{n}=-1$ 이다.) 따라서 $n\to\infty$ 일 때 $$\int_{1}^{2}\frac{1}{x^{4}}\,dx-f(2)=\frac13\left(1-\frac18\right)-\frac{1}{16}=\frac{7}{24}-\frac{1}{16}=\frac{11}{48}$$ 이다.`}]},
{pts:10,page:44,area:'수학Ⅱ, 미적분 · 입체도형의 부피',std:['12수학Ⅱ03-05','12수학Ⅱ03-04','12미적03-06'],
 intent:'단면의 넓이와 입체도형의 부피 사이의 관계를 이해하고, 다항함수의 적분법을 이용하여 입체도형의 부피를 계산할 수 있음을 평가한다.',
 body:R`$S$ 는 곡선 $y=\sqrt{x}$ 와 세 직선 $x=2$, $y=-1$, $y=-x$ 로 둘러싸인 부분을 밑면으로 하는 입체도형이다. 이 입체도형을 $x$ 축에 수직인 평면으로 자른 단면들이 모두 정사각형일 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$\dfrac14\le x\le\dfrac13$ 인 실수 $x$ 에 대하여 단면의 넓이에 대한 식 $A(x)$ 를 구하시오.`,p:1.5,a:R`$A(x)=(\sqrt{x}+x)^{2}$`,e:R`$0\le x\le1$ 에서 밑면은 $y=-x$ 와 $y=\sqrt{x}$ 사이에 있으므로 단면인 정사각형의 한 변의 길이는 $\sqrt{x}+x$ 이다.`},
 {q:R`$\dfrac65\le x\le\dfrac{11}{6}$ 인 실수 $x$ 에 대하여 단면의 넓이에 대한 식 $B(x)$ 를 구하시오.`,p:1.5,a:R`$B(x)=(\sqrt{x}+1)^{2}$`,e:R`$1\le x\le2$ 에서 밑면은 $y=-1$ 과 $y=\sqrt{x}$ 사이에 있으므로 한 변의 길이는 $\sqrt{x}+1$ 이다.`},
 {q:R`입체도형 $S$ 의 전체 부피를 구하시오.`,p:7.0,a:R`$\dfrac{14}{5}+\dfrac83\sqrt2$`,e:R`$$V=\int_{0}^{1}\left(x+2x^{\frac32}+x^{2}\right)dx+\int_{1}^{2}\left(x+2\sqrt{x}+1\right)dx=\left(\frac12+\frac45+\frac13\right)+\left(\frac76+\frac83\sqrt2\right)=\frac{14}{5}+\frac83\sqrt2$$`}]},
{pts:10,page:47,area:'수학Ⅰ · 등차수열',std:['12수학Ⅰ03-01','12수학Ⅰ03-02'],
 intent:'등차수열의 뜻을 알고 있는지와 등차수열의 합의 공식을 이해하고 이를 이용해 문제를 해결할 수 있는지를 평가한다.',
 body:R`공차가 $2$ 인 등차수열 $\{a_{n}\}$ 이 아래 조건을 만족한다. 다음 물음에 답하시오. (단, $k\ge2$ 인 자연수)
<div class="cond">가) $a_{k}=0$<br>나) $a_{1}+a_{2}+a_{3}+\cdots+a_{m}=120$<br>다) $|a_{1}|+|a_{2}|+|a_{3}|+\cdots+|a_{m}|=144$</div>`,
 qs:[
 {q:R`$a_{1}+a_{2}+\cdots+a_{k-1}$ 의 값을 구하시오.`,p:4.3,a:R`$-12$`,e:R`공차가 양수이고 $a_{k}=0$ 이므로 음수인 항은 $a_{1},\ \cdots,\ a_{k-1}$ 이다. 이들의 합을 $N$ 이라 하면 나)와 다)에서 $120-144=2N$ 이므로 $N=-12$ 이다.`},
 {q:R`$a_{1}=Ak+2$ 일 때, 상수 $A$ 의 값을 구하시오.`,p:3.2,a:R`$-2$`,e:R`$a_{k}=a_{1}+2(k-1)=0$ 이므로 $a_{1}=-2k+2$, 즉 $A=-2$ 이다.`},
 {q:R`$m$ 의 값을 구하시오.`,p:2.5,a:R`$15$`,e:R`$a_{1}+\cdots+a_{k-1}=-2\{(k-1)+\cdots+1\}=-k(k-1)=-12$ 에서 $k=4$, $a_{1}=-6$ 이다. $a_{1}+\cdots+a_{m}=-6m+m(m-1)=m^{2}-7m=120$ 에서 $(m-15)(m+8)=0$ 이므로 $m=15$ 이다.`}]},
{pts:10,page:49,area:'수학 · 다항식과 나머지정리',std:['10수학01-03','10수학01-01'],
 intent:'다항식의 연산과 나머지정리의 의미를 이해하고, 이를 활용하여 문제를 해결할 수 있는지 평가한다.',
 body:R`다항식 $f(x)$ 를 $x-3$ 으로 나누면 나머지가 $5$ 이고, $x+2$ 로 나누면 나머지가 $-7$ 이며, $x+1$ 과 $x-1$ 로 나누면 나머지가 모두 $0$ 일 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$f(x)$ 의 가능한 최소 차수 $n$ 의 값을 구하시오.`,p:2.4,a:R`$3$`,e:R`$f(x)=(x^{2}-1)q(x)$ 로 놓으면 $f(3)=8q(3)=5$, $f(-2)=3q(-2)=-7$ 에서 $q(3)=\dfrac58$, $q(-2)=-\dfrac73$ 이다. $q(x)$ 가 상수일 수는 없고 일차식이면 가능하므로 최소 차수는 $3$ 이다.`},
 {q:R`문제 (1)에서 구한 최소 차수 $n$ 에 대하여 $f(x)=a_{n}x^{n}+a_{n-1}x^{n-1}+\cdots+a_{2}x^{2}+a_{1}x+a_{0}$ 이고 $a_{2}=-\dfrac{23}{20}$ 일 때, $\dfrac{a_{1}}{a_{0}}$ 의 값을 구하시오.`,p:5.4,a:R`$-\dfrac{71}{138}$`,e:R`$q(x)=cx+d$ 라 하면 $f(x)=cx^{3}+dx^{2}-cx-d$ 이므로 $a_{2}=d=-\dfrac{23}{20}$, $a_{1}=-c$, $a_{0}=-d$ 이다. $3c+d=\dfrac58$ 에서 $c=\dfrac13\left(\dfrac58+\dfrac{23}{20}\right)=\dfrac{71}{120}$ 이다. (이때 $-2c+d=-\dfrac73$ 도 성립한다.) 따라서 $\dfrac{a_{1}}{a_{0}}=\dfrac{c}{d}=\dfrac{71}{120}\times\left(-\dfrac{20}{23}\right)=-\dfrac{71}{138}$ 이다.`},
 {q:R`두 자연수 $a,\ b$ 의 최대공약수를 $\gcd(a,\ b)$ 라고 하자. 문제 (2)에서 구한 $a_{0},\ a_{1}$ 에 대하여 $|a_{0}|=\dfrac{A_{0}}{B_{0}}$, $|a_{1}|=\dfrac{A_{1}}{B_{1}}$ 이고 $\gcd(A_{0},\ B_{0})=1$, $\gcd(A_{1},\ B_{1})=1$ 일 때, $\gcd(B_{0},\ B_{1})$ 의 값을 구하시오.`,p:2.2,a:R`$20$`,e:R`$|a_{0}|=\dfrac{23}{20}$, $|a_{1}|=\dfrac{71}{120}$ 이므로 $B_{0}=20$, $B_{1}=120$ 이고 $\gcd(20,\ 120)=20$ 이다.`}]},
{pts:8,page:51,area:'수학Ⅱ · 속도와 거리',std:['12수학Ⅱ02-11','12수학Ⅱ03-06'],
 intent:'수직선 위를 움직이는 점의 속도와 가속도 그리고 변위량을 이용하여 거리를 구할 수 있는지 평가한다.',
 body:R`원점을 출발하여 수직선 위를 움직이는 점 $\mathrm{P}$ 의 시각 $t$ 에서 속도 $v(t)$ 가 아래 조건을 만족할 때, 다음 물음에 답하시오.
<div class="cond">가) $v(t)=t^{3}-At^{2}+Bt$ 이다.<br>나) $t=1$ 일 때, 가속도는 $0$ 이다.<br>다) $t=1$ 일 때와 $t=3$ 일 때, 점 $\mathrm{P}$ 의 위치가 같다.</div>`,
 qs:[
 {q:R`상수 $A$ 의 값을 구하시오.`,p:2.6,a:R`$12$`,e:R`가속도는 $v'(t)=3t^{2}-2At+B$ 이므로 나)에서 $3-2A+B=0$ 이다. 다)에서 $$\int_{1}^{3}v(t)\,dt=20-\frac{26}{3}A+4B=0$$ 이다. $B=2A-3$ 을 대입하면 $8-\dfrac23A=0$ 이므로 $A=12$ 이다.`},
 {q:R`상수 $B$ 의 값을 구하시오.`,p:2.6,a:R`$21$`,e:R`$B=2A-3=21$ 이다.`},
 {q:R`$t=0$ 에서 $t=1$ 까지 점 $\mathrm{P}$ 가 움직인 거리를 구하시오.`,p:2.8,a:R`$\dfrac{27}{4}$`,e:R`$v(t)=t(t^{2}-12t+21)$ 이고 $0<t<1$ 에서 $v(t)>0$ 이므로 움직인 거리는 $$\int_{0}^{1}\left(t^{3}-12t^{2}+21t\right)dt=\frac14-4+\frac{21}{2}=\frac{27}{4}$$ 이다.`}]},
{pts:8,page:53,area:'미적분 · 음함수의 미분과 접선',std:['12미적02-09','12미적02-02','12미적02-05','12미적02-11'],
 intent:'접선과 곡선의 위치 관계를 이해하고, 음함수의 미분을 이용하여 문제를 해결할 수 있음을 평가한다.',
 body:R`점 $(1,\ 0)$ 은 두 곡선 $Axe^{xy}=2$ 와 $x-x\sin y=Bx^{2}+C$ 위의 점이다. 점 $(1,\ 0)$ 에서 두 곡선이 같은 접선을 가질 때, 다음 물음에 답하시오. (단, $A,\ B,\ C$ 는 상수)`,
 qs:[
 {q:R`$A$ 의 값을 구하시오.`,p:1.8,a:R`$2$`,e:R`두 식에 $(1,\ 0)$ 을 대입하면 $A=2$, $1=B+C$ 이다.`},
 {q:R`$B$ 의 값을 구하시오.`,p:3.1,a:R`$1$`,e:R`$x-x\sin y=Bx^{2}+C$ 를 음함수 미분하면 $1-\sin y-x\cos y\,\dfrac{dy}{dx}=2Bx$ 이고, $(1,\ 0)$ 을 대입하면 기울기는 $1-2B$ 이다. $2xe^{xy}=2$ 에 같은 방법을 적용하면 $e^{xy}+xe^{xy}\left(y+x\dfrac{dy}{dx}\right)=0$ 에서 기울기는 $-1$ 이다. 두 곡선이 같은 접선을 가지므로 $1-2B=-1$, $B=1$ 이다.`},
 {q:R`$C$ 의 값을 구하시오.`,p:3.1,a:R`$0$`,e:R`$1=B+C$ 와 $B=1$ 에서 $C=0$ 이다.`}]}
],
K:[
{pts:10,page:55,area:'국어·수필 + 독서',std:['10국03-01','12독서03-05'],
 intent:'사회적 상호작용으로서의 글 읽기라는 측면에서 구체적인 상황과 맥락을 고려하면서 글을 이해하고 지역의 사회·문화적 특성이 다양한 형식과 내용으로 글에 반영되어 있음을 이해한다.',
 body:[
 {label:'(가)',sum:true,text:R`아메리카 원주민 라코타족의 삶에서 자연이 지니는 의미를 말한다. 그들에게 지혜는 자연에서 전수되었고, 세상은 거대한 ( ㉠ )이었으며 그 속의 책은 돌과 나뭇잎, 풀, 실개천, 새와 들짐승이었다. 사랑하는 형제자매인 자연에 ㉡불의를 저지르는 것이야말로 야만적인 일이었다고 말한다.`,src:'루서 스탠딩 베어, 「말과 침묵」'},
 {label:'(나)',sum:true,text:R`무주 공설 운동장을 ‘등나무 운동장’으로 바꾼 건축가의 글이다. 모더니즘 건축은 자연을 ‘조경’이라는 부수적 측면에서 다루며 자연 위에 군림하는 듯했다고 비판하고, ㉢“건축은 공간을 만드는 일이라고 알려져 있지만 궁극적으로 시간을 다루는 일”이라고 말한다. 등나무 운동장의 구조물은 등나무가 자라려는 의지를 실현할 수 있게 지지하고 돕도록 설계되었다.`,src:'정기용, 「등나무 운동장 이야기」'}],
 qs:[
 {q:'㉠에 들어갈 적절한 3음절의 단어를 쓰시오.',p:2.5,a:'도서관',r:'‘도서관’을 정확히 기재하면 정답',e:'(가)의 첫 문단을 사실적으로 이해하고 종합적으로 추론하여 3음절의 단어 ‘도서관’을 쓴다.'},
 {q:'인간과 자연의 관계에서 ㉡과 유사한 의미를 가지는 단어를 (나)에서 찾아 쓰시오.',p:3.1,a:'군림',r:'‘군림’을 정확히 기재하면 정답',e:'(가)에서 ‘우리가 사랑하는 형제자매’는 자연을 뜻한다. 자연에 불의를 저지른다는 것과 유사한 의미의 ‘군림’을 (나)의 둘째 문단에서 찾는다.'},
 {q:'(나)를 참고하여 ㉢의 의미가 무엇인지 한 문장으로 쓰시오.',p:4.4,a:'건축은 시시각각 변화하는 자연을 고려하고, 자연을 지지하고 돕는 역할을 해야 한다.',r:'‘건축은 시시각각 변화하는 자연을 고려하고, 자연을 지지하고 돕는 역할을 해야 한다.’라는 내용의 문장을 쓰면 정답, 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'(나)의 후반부에 자연을 지지하고 도와 시시각각 변화하는 자연을 고려하는 건축의 사례가 서술되어 있다.'}]},
{pts:10,page:57,area:'국어·독서(과학·기술)',std:['12독서02-02','12독서03-03'],
 intent:'지문에서 제시된 양자 컴퓨터의 연산 원리를 이해하고 이를 재구성하는 다양한 표현들을 완성한다.',
 body:[{sum:true,text:R`고전 컴퓨터의 메모리 용량은 한 비트가 차지하는 크기를 줄여 늘려 왔으나, 그 크기가 원자에 가까워지면 합선 문제가 생긴다. 이것은 더 이상 고전 컴퓨터로는 (㉠          )을/를 나타낸다. 대안인 양자 컴퓨터는 0과 1의 중첩 상태도 나타낼 수 있는 큐비트를 쓰며, 전자의 스핀으로 이를 구현한다. 기본 연산으로 회전 연산과 CNOT 연산이 있다. CNOT 연산은 두 큐비트 가운데 제어 비트는 그대로 통과시키고, 제어 비트가 0이면 표적 비트를 그대로 두며 제어 비트가 1이면 표적 비트의 상태를 뒤바꾼다. &lt;그림 2&gt;는 CNOT 연산의 입력값과 출력값을 나타낸 그림이다.`,src:'EBS 수능특강 독서(2025) 연계 지문'}],
 qs:[
 {q:'㉠에 들어갈 적절한 말을 20자 내외로 쓰시오.',p:4.3,a:'연산 처리 능력을 향상시키기 어렵다.',r:'‘연산 처리 능력을 향상시킬 수 없다.’는 내용을 정확히 쓰면 정답, 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'비트의 물리적 크기를 줄이는 방식은 최대치에 달했기에 더 이상 고전 컴퓨터로는 연산 처리 능력을 향상시킬 수 없다.'},
 {q:'&lt;보기&gt;의 빈칸에 들어갈 적절한 말을 윗글에서 찾아 쓰시오.',p:2.5,box:'양자 컴퓨터는 (        )을/를 지니고 있기 때문에 처리해야 하는 이진수의 자릿수가 클수록 고전 컴퓨터보다 빠른 속도로 연산을 할 수 있다.',a:'양자 병렬성',r:'‘양자 병렬성’을 정확히 기재하면 정답',e:'마지막 단락에 양자 컴퓨터가 지닌 양자 병렬성에 대한 개념이 설명되어 있다.'},
 {q:'&lt;그림 2&gt;에서 ⓐ, ⓑ, ⓒ, ⓓ에 들어갈 값을 쓰시오. (그림은 가이드북 58쪽 참조)',p:3.2,a:'ⓐ 0, ⓑ 1, ⓒ 1, ⓓ 0',r:'예시 답안을 정확히 기재하면 정답. 각각의 항목별로 부분 점수 0.8점을 부여할 수 있음',e:'제어 비트는 입력값과 출력값이 일치하고, 표적 비트는 제어 비트가 0이면 그대로, 1이면 뒤바뀐다는 CNOT 연산의 규칙을 그림에 적용한다.'}]}
]}

{pts:11.5,area:'국어·문법 + 수필',std:['10국05-01','10국03-01'],
 intent:'피동 표현과 능동 표현의 차이를 다룬 두 글을 읽고, 문법 요소가 의미와 태도에 미치는 영향을 파악한다.',
 body:[
 {label:'(가)',text:R`공문서나 기사에서 자주 보는 문장 가운데 “예산이 삭감되었다.”와 같은 것이 있다. 이 문장에는 예산을 줄인 사람이 보이지 않는다. 같은 일을 “위원회가 예산을 삭감했다.”라고 쓰면 사정이 달라진다. 행위를 한 주체가 문장의 주어 자리에 서고, 독자는 누구에게 책임을 물어야 하는지 곧바로 알게 된다. ㉠<u>“예산이 삭감되었다.”</u>는 일어난 결과를 앞세우는 문장이고, ㉡<u>“위원회가 예산을 삭감했다.”</u>는 행위의 주인을 앞세우는 문장이다.

물론 피동 표현이 늘 나쁜 것은 아니다. 행위자를 알 수 없거나, 행위자보다 결과가 더 중요할 때에는 피동 표현이 오히려 자연스럽다. “새 도로가 개통되었다.”라는 문장에서 도로를 연 사람들의 이름을 일일이 밝힐 필요는 없다. 문제는 행위자를 밝힐 수 있고 또 밝혀야 하는데도 일부러 가릴 때이다. 그때 피동 표현은 사실을 전하는 도구가 아니라 ( ⓐ )을/를 흐리는 도구가 된다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`어린 시절 나는 꽃병을 깨뜨리고는 “꽃병이 깨졌어요.”라고 말했다. 어머니는 빙긋 웃으며 “꽃병이 혼자 깨졌니?” 하고 되물으셨다. 나는 그제야 “제가 꽃병을 깨뜨렸어요.”라고 고쳐 말했다. 문장 하나를 바꾸었을 뿐인데, 그 순간 나는 꽃병 조각 앞에 서 있는 사람이 바로 나라는 것을 받아들였다. 이상하게도 꾸중을 들을 각오를 하고 나니 마음이 가벼워졌다. 숨는 문장보다 드러내는 문장이 나를 더 자유롭게 했다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'ⓐ에 들어갈 2음절의 단어를 (가)에서 찾아 쓰시오.',p:3.2,a:'책임',r:'‘책임’을 정확히 기재하면 정답',e:'(가)의 첫 문단에서 능동문은 “누구에게 책임을 물어야 하는지”를 알게 한다고 하였다. 행위자를 일부러 가리는 피동 표현은 이 ‘책임’의 소재를 흐린다.'},
 {q:'&lt;보기&gt;를 활용하여 ㉠과 ㉡의 차이를 한 문장으로 쓰시오.',p:4.2,box:'‘능동문’은 주어가 제힘으로 동작을 하는 문장이고, ‘피동문’은 주어가 다른 주체의 행동에 의해 동작을 당하는 문장이다. 능동문이 피동문으로 바뀌면 능동문의 목적어가 피동문의 주어가 되고, 능동문의 주어는 부사어가 되거나 생략된다.',a:'㉠은 능동문의 목적어였던 ‘예산’이 주어가 되고 행위의 주체가 생략된 피동문이고, ㉡은 행위의 주체인 ‘위원회’가 주어로 드러난 능동문이다.',r:'‘㉠은 행위 주체가 생략된 피동문, ㉡은 행위 주체가 주어로 드러난 능동문’이라는 내용을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'<보기>의 정의를 두 문장에 적용한다. ㉠에서는 능동문의 목적어 ‘예산을’이 주어 ‘예산이’가 되었고 주어 ‘위원회가’는 생략되었다.'},
 {q:'(나)에서 ‘나’가 행위의 주체를 밝혀 고쳐 말한 문장을 찾아 쓰시오.',p:4.1,a:'제가 꽃병을 깨뜨렸어요.',r:'‘제가 꽃병을 깨뜨렸어요.’를 정확히 기재하면 정답',e:'“꽃병이 깨졌어요.”(피동)를 “제가 꽃병을 깨뜨렸어요.”(능동)로 고쳐 말함으로써 행위의 주체가 ‘나’임을 드러냈다.'}]},

{pts:9.0,area:'국어·고전 수필',std:['10국05-01','12독서01-01'],
 intent:'이규보의 「슬견설」에 나타난 사유를 사실적·추론적으로 이해하고, 글쓴이가 비판하는 인식 태도를 파악한다.',
 body:[{text:R`어떤 손님이 나를 찾아와 말하였다.

“어제저녁에 어떤 불량한 사람이 큰 몽둥이로 돌아다니는 개를 쳐서 죽이는 것을 보았는데, 그 모습이 너무 가엾어서 마음이 아팠소. 그래서 이제부터는 개고기나 돼지고기를 먹지 않기로 맹세하였소.”

내가 대답하였다.

“어제 어떤 사람이 불이 이글거리는 화로를 끼고 앉아 이를 잡아 태워 죽이는 것을 보았소. 나는 마음이 아파서 다시는 이를 잡지 않기로 맹세하였소.”

손님이 실망한 얼굴로 말하였다.

“이는 하찮은 것이 아니오? 나는 덩치 큰 짐승이 죽는 것을 보고 가여워서 한 말인데, 그대가 이런 것으로 맞받으니 나를 놀리는 것이 아니오?”

내가 말하였다.

“무릇 피와 기운이 있는 것은 사람에서부터 소, 말, 돼지, 양, 벌레, 개미에 이르기까지 살기를 바라고 죽기를 싫어하는 마음이 모두 같소. 어찌 큰 것만 죽기를 싫어하고 작은 것은 그렇지 않겠소? 그러니 개의 죽음과 이의 죽음은 같은 것이오. 그래서 이를 들어 맞대어 말한 것이지 어찌 그대를 놀린 것이겠소? 내 말이 믿기지 않거든 그대의 열 손가락을 깨물어 보시오. 엄지손가락만 아프고 나머지는 아프지 않겠소? 한 몸에 붙은 것은 크고 작은 마디를 가릴 것 없이 똑같이 아픈 법이오. 하물며 저마다 숨과 기운을 받아 태어난 것들인데, 어찌 저것은 죽음을 싫어하고 이것은 죽음을 좋아하겠소? 그대는 물러가 눈을 감고 고요히 생각해 보시오. 그리하여 달팽이의 뿔을 쇠뿔과 같이 보고, 메추라기를 큰 붕새와 같이 보게 되거든, 그때 내가 그대와 더불어 도(道)를 이야기하겠소.”`,src:'이규보, 「슬견설(蝨犬說)」 (한문 원전을 현대어로 풀어 씀)'}],
 qs:[
 {q:'‘나’가 손님의 생각이 잘못되었음을 깨우치기 위해 끌어들인 신체의 일부를 윗글에서 찾아 2어절로 쓰시오.',p:4.2,a:'열 손가락',r:'‘열 손가락’을 정확히 기재하면 정답',e:'‘나’는 엄지손가락이든 다른 손가락이든 깨물면 똑같이 아프다는 비유로, 크고 작음과 상관없이 생명이 죽음을 싫어하는 마음은 같다는 점을 깨우친다.'},
 {q:'‘나’의 관점에서 볼 때 손님의 생각이 지닌 문제점을 25자 내외로 쓰시오.',p:4.8,a:'생명의 가치를 대상의 크기에 따라 차별하여 판단한다.',r:'‘크기(겉모습)에 따라 생명의 가치를 다르게 본다’는 내용을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'손님은 ‘덩치 큰 짐승’인 개의 죽음은 가여워하면서 이는 ‘하찮은 것’이라 한다. ‘나’는 살기를 바라는 마음은 모든 생명이 같다고 보므로, 크기를 기준으로 삼는 손님의 태도는 편견이다.'}]},

{pts:9.5,area:'국어·독서(사회)',std:['12독서03-02','12독서02-05'],
 intent:'공유 자원의 특성과 관리 방식을 다룬 사회 분야의 글을 읽고, 개념을 구분하며 생략된 내용을 추론한다.',
 body:[{text:R`초원 하나를 여러 목동이 함께 쓴다고 하자. 한 목동이 양을 한 마리 더 풀어 놓으면 그 양이 주는 이익은 고스란히 그 목동에게 돌아가지만, 풀이 줄어드는 손해는 모든 목동이 나누어 진다. 그래서 각자에게는 양을 늘리는 것이 언제나 이득이고, 결국 초원은 황폐해진다. 하딘은 이를 ‘공유지의 비극’이라 불렀다. 경제학에서는 재화를 두 가지 기준으로 분류한다. 대가를 치르지 않은 사람의 사용을 막을 수 있는가를 뜻하는 ( ㉠ )성과, 한 사람이 쓰면 다른 사람이 쓸 수 있는 양이 줄어드는가를 뜻하는 ( ㉡ )성이다. 초원이나 어장처럼 앞의 성질은 없고 뒤의 성질만 있는 재화를 공유 자원이라 한다. 이는 배제성과 경합성이 모두 없는 등대 같은 공공재와도, 둘 다 있는 옷이나 빵 같은 사적 재화와도 다르다.

공유지의 비극을 막는 방법으로 흔히 두 가지가 제시되었다. 하나는 정부가 사용량을 직접 규제하는 것이고, 다른 하나는 자원을 쪼개어 개인에게 소유권을 나누어 주는 것이다. 그러나 정부 규제는 현장 사정을 정확히 알기 어렵고 감시에 큰 비용이 든다는 문제가 있다. 소유권 분할도 만능이 아니다. 초원은 울타리를 쳐서 나눌 수 있지만, 어장의 물고기나 땅속의 지하수는 한곳에 머물지 않고 움직인다. 따라서 소유권을 나누는 방법은 (㉢                    ).

오스트롬은 세계 곳곳의 마을을 조사하여 제3의 길을 찾아냈다. 수백 년 동안 자원을 고갈시키지 않고 함께 써 온 공동체들이 있었던 것이다. 이 공동체들에는 공통점이 있었다. 자원을 쓸 수 있는 사람의 범위가 분명하였고, 사용 규칙을 만드는 데 사용자들이 직접 참여하였으며, 규칙 위반을 사용자들이 스스로 감시하고 위반이 거듭될수록 제재를 무겁게 하였다. 외부의 강제나 사유화 없이 이용자들이 스스로 규칙을 만들고 지키는 이러한 방식을 공동체의 자율적 관리라 한다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠과 ㉡에 각각 들어갈 2음절의 단어를 윗글에서 찾아 쓰시오.',p:2.0,a:'㉠ 배제, ㉡ 경합',r:'배제, 경합을 정확히 기재하면 각각 1.0점을 부여함',e:'대가를 치르지 않은 사람의 사용을 막을 수 있는 성질이 배제성, 한 사람의 사용이 다른 사람의 사용량을 줄이는 성질이 경합성이다. 두 단어는 첫 문단 끝에 제시되어 있다.'},
 {q:'윗글의 논지에 비추어 ㉢에 들어갈 내용을 30자 내외로 서술하시오.',p:4.5,a:'물고기나 지하수처럼 움직이는 자원에는 경계를 나누어 적용하기 어렵다.',r:'‘움직이는(경계를 나눌 수 없는) 자원에는 적용하기 어렵다’는 내용을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'바로 앞 문장에서 초원과 달리 물고기와 지하수는 한곳에 머물지 않는다고 하였다. 따라서 소유권 분할은 경계를 정할 수 없는 자원에는 쓰기 어렵다는 한계가 이어져야 한다.'},
 {q:'&lt;보기&gt;의 사례에 나타난 자원 관리 방식을 윗글에서 찾아 2어절로 쓰시오.',p:3.0,box:'어느 해안 마을의 어민들은 어촌계를 꾸려 마을 주민만 조업할 수 있도록 하고, 총회에서 금어기와 그물코의 크기를 정하였다. 규칙을 어긴 어민에게는 처음에는 경고를, 거듭 어기면 조업 정지를 내렸는데, 감시도 어민들이 돌아가며 맡았다.',a:'자율적 관리',r:'‘자율적 관리’를 정확히 기재하면 정답 (‘공동체의 자율적 관리’도 정답)',e:'<보기>의 어촌계는 이용자 범위의 한정, 규칙 제정 참여, 자체 감시와 점증적 제재라는 공통점을 모두 갖추고 있다.'}]},

{pts:9.0,area:'국어·독서(주제 통합)',std:['10국02-03','12독서01-02'],
 intent:'선택 설계에 관한 두 글을 통합적으로 읽고, 핵심 개념을 새로운 사례에 적용한다.',
 body:[
 {label:'(가)',text:R`어떤 나라에서는 운전면허를 받을 때 장기 기증에 동의하는 사람만 서류에 따로 표시하게 하고, 다른 나라에서는 기증을 원하지 않는 사람만 따로 표시하게 한다. 앞의 방식을 ‘옵트인’, 뒤의 방식을 ‘옵트아웃’이라 한다. 두 방식은 사람들에게 똑같은 선택권을 준다. 그런데 실제 동의율은 크게 다르다. 옵트인 방식을 택한 나라의 동의율은 대체로 낮지만, 옵트아웃 방식을 택한 나라에서는 대부분의 국민이 기증자로 등록되어 있다. 옵트아웃 방식에서 기본값은 ‘기증 동의’이기 때문이다. 사람들은 특별한 이유가 없는 한 아무것도 하지 않았을 때 자동으로 적용되는 ( ㉠ )을/를 그대로 받아들이는 경향이 있다. 바꾸려면 생각하고 결정하고 서류를 고쳐야 하지만, 그대로 두는 데에는 아무런 노력이 들지 않기 때문이다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`탈러와 선스타인은 선택지를 없애거나 경제적 유인을 크게 바꾸지 않으면서, 선택이 제시되는 방식을 설계하여 사람들을 더 나은 선택으로 부드럽게 이끄는 것을 ‘넛지’라고 불렀다. 넛지는 본래 ‘팔꿈치로 슬쩍 찌르다’라는 뜻이다. 구내식당에서 과일을 눈높이에 놓고 튀김을 안쪽에 두는 것, 퇴직 연금에 자동으로 가입시키되 탈퇴는 자유롭게 허용하는 것이 넛지의 예이다. 이와 달리 튀김 판매를 금지하는 것은 선택지를 없애는 것이므로 넛지가 아니며, 튀김에 무거운 세금을 매기는 것은 경제적 유인을 크게 바꾸는 것이므로 역시 넛지가 아니다. 두 사람은 선택이 제시되는 방식을 짜는 사람을 ‘선택 설계자’라 부르고, 그가 쓸 수 있는 가장 강력한 도구로 ( ㉠ ) 설정을 꼽았다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 단어를 (가)에서 찾아 한 단어로 쓰시오.',p:2.7,a:'기본값',r:'‘기본값’을 정확히 기재하면 정답',e:'‘아무것도 하지 않았을 때 자동으로 적용되는’ 것은 기본값이다. (나)의 자동 가입 역시 기본값을 ‘가입’으로 정하는 넛지이다.'},
 {q:'다음은 (나)를 읽고 수행한 탐구 활동이다. ⓐ, ⓑ, ⓒ 각각이 넛지에 해당하는지 판단하여, 해당하면 ‘넛지’라고 쓰고 해당하지 않으면 그 이유를 (나)의 표현을 활용하여 쓰시오.',p:6.3,box:'ⓐ 학교 매점에서 탄산음료 판매를 전면 금지한다.<br>ⓑ 계단에 피아노 건반 모양의 그림을 그려 계단 이용을 유도한다.<br>ⓒ 일회용 컵을 쓰는 손님에게 컵 하나당 1만 원의 부담금을 물린다.',a:'ⓐ 선택지를 없애므로 넛지가 아니다. ⓑ 넛지 ⓒ 경제적 유인을 크게 바꾸므로 넛지가 아니다.',r:'ⓐ, ⓑ, ⓒ를 모두 정확히 기재하면 정답, 각각 2.1점씩 부여. 판단은 맞았으나 이유가 빠진 경우 부분 점수 부여',e:'넛지의 조건은 ① 선택지를 없애지 않을 것, ② 경제적 유인을 크게 바꾸지 않을 것이다. ⓐ는 ①을, ⓒ는 ②를 어긴다. ⓑ는 선택지와 유인을 그대로 둔 채 제시 방식만 바꾼다.'}]},

{pts:9.5,area:'국어·독서(과학·기술)',std:['12독서02-01','12독서03-03'],
 intent:'소음 제거 헤드폰의 작동 원리를 설명한 글을 읽고, 장치의 구성과 원리를 사실적·추론적으로 이해한다.',
 body:[{text:R`소리는 공기의 압력이 높아졌다 낮아졌다를 되풀이하며 퍼져 나가는 파동이다. 압력이 높은 부분을 마루, 낮은 부분을 골이라 할 때, 두 소리의 파동이 만나면 서로 더해져 새로운 파동이 된다. 마루와 마루가 만나면 진폭이 커져 소리가 커지는데 이를 보강 간섭이라 한다. 반대로 한 파동의 마루가 다른 파동의 골과 만나면 두 파동이 서로를 지워 소리가 작아지는데 이를 상쇄 간섭이라 한다. 능동형 소음 제거 헤드폰은 바로 이 ( ㉠ ) 간섭을 이용한다.

이 헤드폰은 마이크, 처리 회로, 스피커로 이루어진다. 이어컵 바깥쪽에 달린 마이크는 주변의 소음을 끊임없이 받아들여 전기 신호로 바꾼다. 처리 회로는 이 신호를 분석하여 소음과 진폭은 같고 위상은 정반대인 신호, 곧 소음의 마루가 올 때 골이 오도록 뒤집은 신호를 만든다. 스피커는 음악 신호에 이 뒤집은 신호를 더하여 귀로 내보낸다. 그러면 귀에 다다른 소음과 뒤집은 소리가 ( ㉠ ) 간섭을 일으켜 소음은 크게 줄어들고 음악만 남는다.

이 방식은 비행기의 엔진 소리나 냉방기 소리처럼 일정하게 되풀이되는 낮은 소리에 특히 효과적이다. 이런 소리는 파장이 길고 모양이 규칙적이어서 다음 순간의 모양을 예측하기 쉬우므로, 처리 회로가 뒤집은 신호를 제때 만들어 낼 수 있다. 반면 사람의 말소리나 유리가 깨지는 소리처럼 높고 불규칙한 소리는 파장이 짧고 변화가 빨라서, 처리 회로가 신호를 만드는 사이에 이미 소음의 모양이 바뀌어 버린다. 그래서 능동형 소음 제거 방식은 (㉡                    ). 이러한 소리는 이어컵의 두꺼운 쿠션으로 귀를 덮어 물리적으로 막는 방식으로 보완한다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 단어를 윗글에서 찾아 한 단어로 쓰시오.',p:2.1,a:'상쇄',r:'‘상쇄’를 정확히 기재하면 정답',e:'소음과 위상이 정반대인 소리를 더해 서로 지우는 것이므로 마루와 골이 만나는 상쇄 간섭이다.'},
 {q:'윗글을 참고하여 ㉡에 들어갈 내용을 20자 내외로 쓰시오.',p:5.2,a:'높고 불규칙한 소리는 잘 줄이지 못한다.',r:'‘높고 불규칙한 소리는 제거하기 어렵다’는 내용이 들어 있는 문장이면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'높고 불규칙한 소리는 처리 회로가 뒤집은 신호를 제때 만들지 못한다고 하였고, 뒤 문장에서 ‘이러한 소리’를 쿠션으로 보완한다고 하였으므로 한계에 관한 진술이 들어간다.'},
 {q:'이 헤드폰을 구성하는 세 장치 가운데 소음과 위상이 정반대인 신호를 만들어 내는 장치를 쓰시오.',p:2.2,a:'처리 회로',r:'‘처리 회로’를 정확히 기재하면 정답',e:'마이크는 소음을 전기 신호로 바꾸고, 처리 회로가 위상을 뒤집은 신호를 만들며, 스피커는 이를 음악과 함께 내보낸다.'}]},

{pts:9.5,area:'국어·독서 + 문학',std:['12독서02-02','12문학02-03'],
 intent:'‘낯설게 하기’ 개념을 이해하고 이를 문학 작품에 추론적으로 적용할 수 있는지 평가한다.',
 body:[
 {label:'(가)',text:R`러시아의 비평가 슈클롭스키는 습관이 우리의 지각을 갉아먹는다고 보았다. 처음 자전거를 탈 때 우리는 페달 하나, 손잡이의 기울기 하나에 온 신경을 쏟지만, 익숙해지고 나면 아무것도 의식하지 않은 채 탄다. 이처럼 되풀이된 경험은 자동화되어, 우리는 사물을 보는 것이 아니라 사물의 이름만을 알아볼 뿐이다. 그는 예술이 존재하는 까닭이 바로 이 자동화에서 벗어나 사물을 다시 느끼게 하는 데 있다고 하였다. 돌을 돌답게 느끼게 하려고 예술이 있다는 것이다.

이를 위해 예술은 익숙한 대상을 낯설게 제시한다. 대상을 처음 보는 것처럼 그리거나, 일상 언어의 질서를 비틀거나, 평범한 사물을 뜻밖의 것에 빗대어 지각에 걸리는 시간을 일부러 늘린다. 이를 ‘낯설게 하기’라고 한다. 낯설게 하기에서 중요한 것은 대상에 관한 정보를 늘리는 것이 아니라, 대상을 지각하는 과정 자체를 새롭게 하는 것이다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`바람도 없는 공중에 수직의 파문을 내이며 고요히 떨어지는 오동잎은 누구의 발자취입니까.
지리한 장마 끝에 서풍에 몰려가는 무서운 검은 구름의 터진 틈으로 언뜻언뜻 보이는 푸른 하늘은 누구의 얼굴입니까.
꽃도 없는 깊은 나무에 푸른 이끼를 거쳐서 옛 탑 위의 고요한 하늘을 스치는 알 수 없는 향기는 누구의 입김입니까.
근원은 알지도 못할 곳에서 나서 돌부리를 울리고 가늘게 흐르는 작은 시내는 굽이굽이 누구의 노래입니까.
연꽃 같은 발꿈치로 가이없는 바다를 밟고 옥 같은 손으로 끝없는 하늘을 만지면서 떨어지는 날을 곱게 단장하는 저녁놀은 누구의 시입니까.
타고 남은 재가 다시 기름이 됩니다. 그칠 줄을 모르고 타는 나의 가슴은 누구의 밤을 지키는 약한 등불입니까.`,src:'한용운, 「알 수 없어요」'}],
 qs:[
 {q:'&lt;보기&gt;는 (가)를 정리한 것이다. ⓐ에 들어갈 적절한 단어를 (가)에서 찾아 쓰시오.',p:3.7,box:'슈클롭스키에 따르면 예술은 되풀이된 경험이 낳은 ( ⓐ )에서 벗어나, 사물을 처음 보듯이 다시 지각하게 하려는 시도이다.',a:'자동화',r:'‘자동화’를 정확히 기재하면 정답, ‘습관’은 부분 점수',e:'첫 문단에서 되풀이된 경험이 ‘자동화’되며, 예술은 이 자동화에서 벗어나게 한다고 하였다.'},
 {q:'&lt;보기&gt;는 (가)의 관점에서 (나)를 정리한 것이다. ⓑ에 들어갈 적절한 2어절의 말을 (나)에서 찾아 쓰시오.',p:5.8,box:'(나)는 오동잎을 ‘발자취’로, 푸른 하늘을 ‘얼굴’로, 향기를 ‘입김’으로, 작은 시내를 ‘노래’로, 저녁놀을 ‘시’로 제시하여 익숙한 자연 현상을 낯설게 지각하도록 한다. 마지막 행에서는 같은 방식으로 화자 자신의 ‘나의 가슴’을 ( ⓑ )(으)로 제시한다.',a:'약한 등불',r:'‘약한 등불’을 정확히 기재하면 정답',e:'1~5행의 ‘A는 누구의 B입니까’ 구조가 6행에서도 되풀이된다. ‘나의 가슴’에 대응하는 2어절의 말은 ‘약한 등불’이다.'}]},

{pts:10,area:'국어·독서(예술)',std:['12독서02-02','12독서02-01'],
 intent:'산수화의 삼원법을 설명한 글을 정확히 이해하고, 이를 새로운 그림에 적용할 수 있는지 평가한다.',
 body:[{text:R`서양의 풍경화는 오랫동안 선 원근법을 따랐다. 화가는 한자리에 서서 한 방향을 바라보고, 화면 속의 모든 선은 하나의 소실점을 향해 모인다. 그림을 보는 사람도 화가가 섰던 바로 그 자리에 서게 된다. 이와 달리 동아시아의 산수화는 한 화면 안에 여러 시점을 함께 담았다. 산을 오르내리고 골짜기를 돌아 나가며 본 모습들을 한 폭에 모아, 보는 사람이 그림 속을 거닐 수 있게 한 것이다.

북송의 화가 곽희는 산을 바라보는 시점을 세 가지로 정리하고 이를 삼원(三遠)이라 하였다. 산 아래에서 산꼭대기를 올려다보는 것을 ( ㉠ ), 산 앞에서 산 뒤를 넘겨다보는 것을 ( ㉡ ), 가까운 산에서 먼 산을 바라보는 것을 ( ㉢ )이라 한다. 곽희에 따르면 고원의 형세는 우뚝 솟아 있고, 심원의 뜻은 겹겹이 쌓여 있으며, 평원의 뜻은 아득하게 펼쳐져 있다. 그래서 고원법으로 그린 산은 보는 사람을 압도하는 웅장함을, 심원법으로 그린 산은 골짜기가 첩첩이 이어지는 깊이를, 평원법으로 그린 산은 물안개 너머로 잦아드는 넓고 평온한 느낌을 준다.

화가들은 그리려는 뜻에 따라 이 세 가지를 골라 쓰거나 한 화면에 섞어 썼다. 임금의 위엄이나 자연의 장대함을 드러내려는 그림에는 고원법이, 속세를 떠난 은자의 깊은 거처를 그리는 그림에는 심원법이, 강과 호수의 한가로운 풍광을 담는 그림에는 평원법이 즐겨 쓰였다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠, ㉡, ㉢에 각각 들어갈 단어를 윗글에서 찾아 쓰시오.',p:4.5,a:'㉠ 고원, ㉡ 심원, ㉢ 평원',r:'‘고원’, ‘심원’, ‘평원’을 순서대로 정확히 기재하면 정답, 각각의 항목별로 부분 점수 1.5점을 부여할 수 있음',e:'올려다보는 시점은 ‘우뚝 솟은’ 고원, 산 뒤를 넘겨다보는 시점은 ‘겹겹이 쌓인’ 심원, 가까운 산에서 먼 산을 바라보는 시점은 ‘아득하게 펼쳐진’ 평원에 대응한다.'},
 {q:'&lt;보기&gt;의 그림에 쓰인 시점을 삼원 가운데에서 고르고, 그 시점이 주는 느낌을 윗글을 참고하여 40자 내외로 쓰시오.',p:5.5,box:'화면 아래쪽에는 강가의 나지막한 언덕과 작은 정자가 그려져 있다. 그 너머로 넓은 강물과 모래톱이 가로로 길게 펼쳐지고, 화면 위쪽 끝에는 먼 산이 옅은 먹으로 흐릿하게 그려져 있다.',a:'가까운 언덕에서 먼 산을 바라보는 평원법으로, 아득하게 펼쳐진 넓고 평온한 느낌을 준다.',r:'‘평원(법)’과 ‘아득하게 펼쳐진 넓고 평온한 느낌’을 모두 쓰면 정답. 시점만 맞게 쓴 경우 부분 점수 부여, 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'가까운 언덕에서 강 건너 먼 산을 바라보는 구도이고 강과 호수의 한가로운 풍광을 담았으므로 평원법이다.'}]},

{pts:12,area:'국어·독서 + 고전 시가',std:['12문학01-01','12독서02-03'],
 intent:'‘비덕(比德)’의 사유를 이해하고 이를 시조에 적용함으로써 문학의 인식적·윤리적 가치를 이해한다.',
 body:[
 {label:'(가)',text:R`동아시아의 문인들은 자연물을 바라볼 때 그 겉모습보다 그 속에 깃든 성질에 주목하였다. 공자는 “날이 추워진 뒤에야 소나무와 잣나무가 늦게 시든다는 것을 안다.”라고 하였다. 이 말은 나무의 생태를 관찰한 기록이 아니라, 어려움이 닥친 뒤에야 드러나는 사람의 절개를 말한 것이다. 이처럼 자연물의 성질에 사람이 갖추어야 할 덕을 견주는 사유를 ‘비덕(比德)’이라 한다.

비덕의 사유에서 자연물은 눈을 즐겁게 하는 경치에 머물지 않는다. 자연은 사람이 날마다 자신을 비추어 보고 스스로를 바로잡는 ( ㉡ )이었다. 옛 문인들이 산수를 ‘마음의 거울’이라 부른 것도 이 때문이다. 그래서 문인들은 자연물을 노래하면서도 ㉠<u>자연물의 겉모습을 그려 내는 일</u> 자체에는 큰 뜻을 두지 않았다. 꽃의 빛깔이나 산의 높이를 그리는 것은 덕을 드러내기 위한 실마리일 뿐, 그것만으로는 시가 되지 못한다고 여겼다.`},
 {label:'<A>',text:R`비덕의 시에서는 대개 두 부류의 자연물이 맞세워진다. 하나는 쉽게 변하는 것이고, 다른 하나는 변하지 않는 것이다. 시인은 쉽게 변하는 것을 먼저 내세운 뒤 이와 대비하여 변하지 않는 것을 드러냄으로써 그 대상이 지닌 덕을 부각한다. 이때 쉽게 변하는 것은 세속의 이익을 좇아 흔들리는 사람의 모습을, 변하지 않는 것은 시련 속에서도 지조를 지키는 군자의 모습을 나타낸다. 비덕의 시를 읽는 사람은 이 대비를 통해 자신이 어떤 사람이 되어야 하는지를 ( ㉡ )에 비추듯 돌아보게 된다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`꽃은 무슨 일로 피면서 쉬이 지고
풀은 어이하여 푸르는 듯 누르나니
아마도 변치 아닐손 바위뿐인가 하노라`,src:'윤선도, 「오우가」 중'}],
 qs:[
 {q:'문인들이 ㉠을 무엇으로 여겼는지 (가)에서 3음절의 단어로 찾아 쓰시오.',p:3.9,a:'실마리',r:'‘실마리’를 정확히 기재하면 정답',e:'겉모습을 그리는 것은 “덕을 드러내기 위한 실마리일 뿐”이라고 하였다.'},
 {q:'㉡에 공통적으로 들어갈 단어를 (가)에서 찾아 쓰시오.',p:2.4,a:'거울',r:'‘거울’을 정확히 기재하면 정답',e:'‘자신을 비추어 보고’, ‘비추듯 돌아보게’라는 표현과 ‘마음의 거울’이라는 구절에서 ‘거울’을 찾을 수 있다.'},
 {q:'&lt;A&gt;의 내용을 바탕으로 (나)를 설명하시오.',p:5.7,a:'쉽게 변하는 꽃과 풀을 변하지 않는 바위와 대비하여 바위의 불변성을 부각함으로써, 시련 속에서도 지조를 지키는 군자의 덕을 드러낸다.',r:'‘쉽게 변하는 꽃·풀과 변하지 않는 바위의 대비’, ‘지조(변함없는 덕)의 부각’이라는 내용을 서술하면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'초장의 꽃(쉬이 짐)과 중장의 풀(푸르는 듯 누름)은 쉽게 변하는 것, 종장의 바위는 변하지 않는 것이다. <A>의 대비 구조에 그대로 대응한다.'}]}
],
M:[
{pts:8,area:'수학Ⅰ · 지수함수와 로그함수',std:['12수학Ⅰ01-07','12수학Ⅰ01-08'],
 intent:'지수함수의 그래프의 교점을 구하고, 지수와 로그의 성질을 이용하여 도형의 넓이를 구할 수 있는지 평가한다.',
 body:R`두 곡선 $y=2^{x}$, $y=4^{x}-2$ 가 만나는 점을 $\mathrm{P}$ 라 하고, 직선 $x=k\ (k>1)$ 가 두 곡선 $y=2^{x}$, $y=4^{x}-2$ 와 만나는 점을 각각 $\mathrm{Q}$, $\mathrm{R}$ 라 할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`점 $\mathrm{P}$ 의 좌표가 $(a,\ b)$ 일 때, $a+b$ 의 값을 구하시오.`,p:3.5,a:R`$3$`,e:R`$2^{x}=t\ (t>0)$ 로 놓으면 $t=t^{2}-2$, 즉 $(t-2)(t+1)=0$ 에서 $t=2$ 이다. 따라서 $x=1$, $y=2$ 이므로 $\mathrm{P}(1,\ 2)$ 이고 $a+b=3$ 이다.`},
 {q:R`$\overline{\mathrm{QR}}=4$ 일 때, 삼각형 $\mathrm{PQR}$ 의 넓이를 구하시오.`,p:4.5,a:R`$2\log_{2}3-2$ $\left(\log_{2}\dfrac{9}{4}\ \text{도 정답}\right)$`,e:R`$k>1$ 에서 $4^{k}-2>2^{k}$ 이므로 $\overline{\mathrm{QR}}=4^{k}-2-2^{k}=4$ 이다. $2^{k}=t$ 로 놓으면 $t^{2}-t-6=0$ 에서 $t=3$, 즉 $k=\log_{2}3$ 이다. 점 $\mathrm{P}$ 와 직선 $x=k$ 사이의 거리는 $k-1=\log_{2}3-1$ 이므로 $$S=\frac12\cdot 4\cdot(\log_{2}3-1)=2\log_{2}3-2.$$`}]},
{pts:12,area:'수학Ⅱ · 도함수의 활용',unit:'수학Ⅱ 미분(함수의 극대·극소, 방정식에의 활용)',
 intent:'삼차함수의 극값을 구하고 이를 방정식의 실근의 개수와 최대·최소 문제에 활용할 수 있는지 평가한다.',
 body:R`함수 $f(x)=x^{3}-3x^{2}-9x+a$ 에 대하여 다음 물음에 답하시오. (단, $a$ 는 상수)`,
 qs:[
 {q:R`함수 $f(x)$ 가 극댓값을 갖는 $x$ 의 값을 구하시오.`,p:1.5,a:R`$-1$`,e:R`$f'(x)=3x^{2}-6x-9=3(x+1)(x-3)$ 이고, $x=-1$ 의 좌우에서 $f'(x)$ 의 부호가 양에서 음으로 바뀌므로 $x=-1$ 에서 극대이다.`},
 {q:R`함수 $f(x)$ 의 극댓값과 극솟값의 차를 구하시오.`,p:2.0,a:R`$32$`,e:R`$f(-1)=a+5$, $f(3)=a-27$ 이므로 차는 $(a+5)-(a-27)=32$ 이다.`},
 {q:R`방정식 $f(x)=0$ 이 서로 다른 세 실근을 갖도록 하는 정수 $a$ 의 개수를 구하시오.`,p:3.9,a:R`$31$`,e:R`(극댓값)$>0$ 이고 (극솟값)$<0$ 이어야 하므로 $a+5>0$, $a-27<0$, 즉 $-5<a<27$ 이다. 정수 $a$ 는 $-4,\ -3,\ \cdots,\ 26$ 의 $31$ 개이다.`},
 {q:R`$a=5$ 일 때, 닫힌구간 $[0,\ 4]$ 에서 함수 $f(x)$ 의 최댓값과 최솟값의 합을 구하시오.`,p:4.6,a:R`$-17$`,e:R`$f(x)=x^{3}-3x^{2}-9x+5$ 에서 $f(0)=5$, $f(3)=-22$, $f(4)=-15$ 이다. 구간 안의 극값은 $x=3$ 에서의 극솟값뿐이므로 최댓값은 $5$, 최솟값은 $-22$ 이고 합은 $-17$ 이다.`}]}
]},
nat:{M:[
{pts:12,area:'수학Ⅰ, 미적분 · 등비수열과 급수',std:['12수학Ⅰ03-03','12미적01-04','12미적01-05'],
 intent:'등비급수의 합을 이용하여 등비수열의 일반항을 구하고, 급수의 수렴으로부터 수열의 극한값을 구할 수 있는지 평가한다.',
 body:R`모든 항이 양수인 등비수열 $\{a_{n}\}$ 과 수열 $\{b_{n}\}$ 이 $$a_{1}+a_{2}=12,\qquad \sum_{n=1}^{\infty}a_{n}=16,\qquad \sum_{n=1}^{\infty}\left(b_{n}-\frac{2n+1}{n+3}\right)=5$$ 를 만족할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$a_{3}$ 의 값을 구하시오.`,p:2.5,a:R`$2$`,e:R`첫째항을 $a$, 공비를 $r$ 라 하면 $a(1+r)=12$, $\dfrac{a}{1-r}=16$ 이다. $a=16(1-r)$ 를 대입하면 $16(1-r^{2})=12$, $r^{2}=\dfrac14$ 이고 모든 항이 양수이므로 $r=\dfrac12$, $a=8$ 이다. 따라서 $a_{3}=8\cdot\dfrac14=2$ 이다.`},
 {q:R`$\displaystyle\sum_{n=1}^{\infty}a_{n}^{\,2}$ 의 값을 구하시오.`,p:4.0,a:R`$\dfrac{256}{3}$`,e:R`$\{a_{n}^{\,2}\}$ 은 첫째항 $64$, 공비 $\dfrac14$ 인 등비수열이므로 합은 $\dfrac{64}{1-\frac14}=\dfrac{256}{3}$ 이다.`},
 {q:R`$S_{n}=\displaystyle\sum_{k=1}^{n}a_{k}$ 라 할 때, $\displaystyle\lim_{n\to\infty}\left(b_{n}S_{n}+a_{n}\right)$ 의 값을 구하시오.`,p:5.5,a:R`$32$`,e:R`급수 $\displaystyle\sum\left(b_{n}-\frac{2n+1}{n+3}\right)$ 이 수렴하므로 $\displaystyle\lim_{n\to\infty}\left(b_{n}-\frac{2n+1}{n+3}\right)=0$ 이고, $\displaystyle\lim_{n\to\infty}\frac{2n+1}{n+3}=2$ 이므로 $\displaystyle\lim_{n\to\infty}b_{n}=2$ 이다. 또 $\displaystyle\lim_{n\to\infty}S_{n}=16$, $\displaystyle\lim_{n\to\infty}a_{n}=0$ 이므로 구하는 값은 $2\cdot16+0=32$ 이다.`}]},
{pts:12,area:'미적분 · 정적분과 급수, 접선',std:['12미적03-04','12미적02-05','12미적02-11'],
 intent:'부분적분법으로 정적분을 구하고, 정적분과 급수의 합 사이의 관계 및 접선의 방정식을 이용하여 문제를 해결할 수 있는지 평가한다.',
 body:R`함수 $f(x)=x\sin x$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`$\displaystyle\int_{0}^{\pi}f(x)\,dx$ 의 값을 구하시오.`,p:3.3,a:R`$\pi$`,e:R`$\displaystyle\int_{0}^{\pi}x\sin x\,dx=\Big[-x\cos x\Big]_{0}^{\pi}+\int_{0}^{\pi}\cos x\,dx=\pi+0=\pi$.`},
 {q:R`$\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\frac{k}{n^{2}}\sin\frac{k\pi}{n}$ 의 값을 구하시오.`,p:3.3,a:R`$\dfrac{1}{\pi}$`,e:R`$\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\frac{k}{n}\sin\!\left(\pi\cdot\frac{k}{n}\right)\frac1n=\int_{0}^{1}x\sin \pi x\,dx$ 이다. $\pi x=t$ 로 치환하면 $\dfrac{1}{\pi^{2}}\displaystyle\int_{0}^{\pi}t\sin t\,dt=\dfrac{1}{\pi^{2}}\cdot\pi=\dfrac1\pi$.`},
 {q:R`곡선 $y=f(x)$ 위의 점 $(\pi,\ 0)$ 에서의 접선을 $l$ 이라 하자. 곡선 $y=f(x)\ (0\le x\le\pi)$ 와 직선 $l$ 및 $y$ 축으로 둘러싸인 부분의 넓이를 구하시오.`,p:5.4,a:R`$\dfrac{\pi^{3}}{2}-\pi$`,e:R`$f'(x)=\sin x+x\cos x$ 에서 $f'(\pi)=-\pi$ 이므로 $l:\ y=-\pi(x-\pi)$ 이다. $0\le x\le\pi$ 에서 직선 $l$ 이 곡선보다 위쪽에 있으므로 $$\int_{0}^{\pi}\{-\pi(x-\pi)-x\sin x\}\,dx=\frac{\pi^{3}}{2}-\pi.$$ (직선 $l$ 과 두 좌표축으로 둘러싸인 삼각형의 넓이 $\dfrac12\cdot\pi\cdot\pi^{2}$ 에서 (1)의 값을 뺀 것과 같다.)`}]},
{pts:10,area:'수학Ⅱ · 정적분의 활용',std:['12수학Ⅱ03-05','12수학Ⅱ03-04','12수학Ⅱ01-02'],
 intent:'곡선으로 둘러싸인 도형의 넓이를 구하고, 정적분으로 정의된 함수의 극한을 미분계수와 관련지어 구할 수 있는지 평가한다.',
 body:R`함수 $f(x)=x^{3}-x$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`곡선 $y=f(x)$ 와 직선 $y=3x$ 로 둘러싸인 부분의 넓이를 구하시오.`,p:3.9,a:R`$8$`,e:R`$x^{3}-x=3x$ 에서 $x=-2,\ 0,\ 2$ 이다. 두 부분은 원점에 대하여 대칭이므로 $$2\int_{0}^{2}(4x-x^{3})\,dx=2\Big[2x^{2}-\frac{x^{4}}{4}\Big]_{0}^{2}=2(8-4)=8.$$`},
 {q:R`곡선 $y=f(x)$ 와 $x$ 축으로 둘러싸인 부분의 넓이를 구하시오.`,p:2.5,a:R`$\dfrac12$`,e:R`$f(x)=x(x-1)(x+1)$ 이므로 $2\displaystyle\int_{0}^{1}(x-x^{3})\,dx=2\left(\frac12-\frac14\right)=\frac12$.`},
 {q:R`$\displaystyle\lim_{x\to 2}\frac{1}{x^{2}-4}\int_{2}^{x}t\,f(t)\,dt$ 의 값을 구하시오.`,p:3.6,a:R`$3$`,e:R`$G(x)=\displaystyle\int_{2}^{x}tf(t)\,dt$ 라 하면 $G(2)=0$, $G'(x)=xf(x)$ 이다. $$\lim_{x\to2}\frac{G(x)-G(2)}{x-2}\cdot\frac{1}{x+2}=\frac{G'(2)}{4}=\frac{2\cdot f(2)}{4}=\frac{2\cdot 6}{4}=3.$$`}]},
{pts:10,area:'미적분 · 입체도형의 부피',std:['12미적03-06','12미적02-02'],
 intent:'단면의 넓이와 입체도형의 부피 사이의 관계를 이해하고, 부분적분법을 이용하여 부피를 계산할 수 있는지 평가한다.',
 body:R`곡선 $y=\ln x$ 와 $x$ 축 및 직선 $x=e$ 로 둘러싸인 부분을 밑면으로 하는 입체도형 $S$ 가 있다. 이 입체도형을 $x$ 축에 수직인 평면으로 자른 단면이 모두 정사각형일 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$1\le x\le e$ 인 실수 $x$ 에 대하여 단면의 넓이에 대한 식 $A(x)$ 를 구하시오.`,p:1.5,a:R`$(\ln x)^{2}$`,e:R`단면인 정사각형의 한 변의 길이가 $\ln x$ 이므로 $A(x)=(\ln x)^{2}$ 이다.`},
 {q:R`밑면의 넓이를 구하시오.`,p:1.5,a:R`$1$`,e:R`$\displaystyle\int_{1}^{e}\ln x\,dx=\Big[x\ln x-x\Big]_{1}^{e}=(e-e)-(0-1)=1$.`},
 {q:R`입체도형 $S$ 의 부피를 구하시오.`,p:7.0,a:R`$e-2$`,e:R`$$V=\int_{1}^{e}(\ln x)^{2}\,dx=\Big[x(\ln x)^{2}\Big]_{1}^{e}-2\int_{1}^{e}\ln x\,dx=e-2\cdot1=e-2.$$`}]},
{pts:10,area:'수학Ⅰ · 등차수열',std:['12수학Ⅰ03-01','12수학Ⅰ03-02'],
 intent:'등차수열의 일반항과 합의 공식을 이해하고, 절댓값이 포함된 합을 구할 수 있는지 평가한다.',
 body:R`등차수열 $\{a_{n}\}$ 이 $a_{2}=-14$, $a_{6}=-2$ 를 만족할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$a_{n}<0$ 을 만족하는 자연수 $n$ 의 최댓값을 구하시오.`,p:2.5,a:R`$6$`,e:R`공차는 $\dfrac{-2-(-14)}{4}=3$, 첫째항은 $-17$ 이므로 $a_{n}=3n-20$ 이다. $3n-20<0$ 에서 $n<\dfrac{20}{3}$ 이므로 최댓값은 $6$ 이다.`},
 {q:R`$S_{n}=\displaystyle\sum_{k=1}^{n}a_{k}$ 의 최솟값을 구하시오.`,p:4.3,a:R`$-57$`,e:R`$a_{6}<0<a_{7}$ 이므로 $S_{n}$ 은 $n=6$ 일 때 최소이다. $S_{6}=\dfrac{6(-17-2)}{2}=-57$.`},
 {q:R`$\displaystyle\sum_{k=1}^{20}|a_{k}|$ 의 값을 구하시오.`,p:3.2,a:R`$344$`,e:R`$S_{20}=\dfrac{20(-17+40)}{2}=230$ 이고 $\displaystyle\sum_{k=1}^{20}|a_{k}|=-S_{6}+(S_{20}-S_{6})=230+114=344$.`}]},
{pts:10,area:'수학 · 나머지정리와 인수분해',std:['10수학01-03','10수학01-01'],
 intent:'나머지정리와 인수정리의 의미를 이해하고, 이를 활용하여 문제를 해결할 수 있는지 평가한다.',
 body:R`다항식 $P(x)=x^{3}+ax^{2}+bx+6$ 은 $x-1$ 로 나누어떨어지고, $x+1$ 로 나누면 나머지가 $8$ 이다. 다음 물음에 답하시오. (단, $a,\ b$ 는 상수)`,
 qs:[
 {q:R`$ab$ 의 값을 구하시오.`,p:2.4,a:R`$10$`,e:R`$P(1)=a+b+7=0$, $P(-1)=a-b+5=8$ 에서 $a+b=-7$, $a-b=3$ 이므로 $a=-2$, $b=-5$ 이고 $ab=10$ 이다.`},
 {q:R`$P(x)$ 를 $x^{2}-4$ 로 나눈 나머지를 $R(x)$ 라 할 때, $R(3)$ 의 값을 구하시오.`,p:5.4,a:R`$-5$`,e:R`$R(x)=px+q$ 라 하면 $P(2)=2p+q=-4$, $P(-2)=-2p+q=0$ 에서 $p=-1$, $q=-2$ 이다. 따라서 $R(x)=-x-2$ 이고 $R(3)=-5$ 이다.`},
 {q:R`방정식 $P(x)=0$ 의 세 근 중 가장 큰 근과 가장 작은 근의 곱을 구하시오.`,p:2.2,a:R`$-6$`,e:R`$P(x)=(x-1)(x^{2}-x-6)=(x-1)(x-3)(x+2)$ 이므로 세 근은 $-2,\ 1,\ 3$ 이고 구하는 값은 $3\cdot(-2)=-6$ 이다.`}]},
{pts:8,area:'수학Ⅱ · 속도와 거리',std:['12수학Ⅱ02-11','12수학Ⅱ03-06'],
 intent:'수직선 위를 움직이는 점의 속도와 위치의 변화량을 이용하여 움직인 거리를 구할 수 있는지 평가한다.',
 body:R`원점을 출발하여 수직선 위를 움직이는 점 $\mathrm{P}$ 의 시각 $t\ (t\ge0)$ 에서의 속도가 $$v(t)=3t^{2}-12t+9$$ 일 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`점 $\mathrm{P}$ 가 운동 방향을 바꾸는 모든 시각의 합을 구하시오.`,p:2.6,a:R`$4$`,e:R`$v(t)=3(t-1)(t-3)$ 이고 $t=1$, $t=3$ 의 좌우에서 부호가 바뀌므로 합은 $4$ 이다.`},
 {q:R`$t=3$ 일 때 점 $\mathrm{P}$ 의 위치를 구하시오.`,p:2.6,a:R`$0$`,e:R`$\displaystyle\int_{0}^{3}v(t)\,dt=\Big[t^{3}-6t^{2}+9t\Big]_{0}^{3}=27-54+27=0$.`},
 {q:R`$t=0$ 에서 $t=4$ 까지 점 $\mathrm{P}$ 가 움직인 거리를 구하시오.`,p:2.8,a:R`$12$`,e:R`위치 $x(t)=t^{3}-6t^{2}+9t$ 에서 $x(0)=0$, $x(1)=4$, $x(3)=0$, $x(4)=4$ 이므로 움직인 거리는 $4+4+4=12$ 이다.`}]},
{pts:8,area:'미적분 · 음함수의 미분',std:['12미적02-09','12미적02-11'],
 intent:'음함수의 미분법을 이용하여 접선의 기울기와 접선의 방정식을 구할 수 있는지 평가한다.',
 body:R`곡선 $x^{2}+xy+y^{2}=7$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`곡선 위의 점 $(1,\ 2)$ 에서의 접선의 기울기를 구하시오.`,p:1.8,a:R`$-\dfrac45$`,e:R`양변을 $x$ 에 대하여 미분하면 $2x+y+x\dfrac{dy}{dx}+2y\dfrac{dy}{dx}=0$, 즉 $\dfrac{dy}{dx}=-\dfrac{2x+y}{x+2y}$ 이다. $(1,\ 2)$ 를 대입하면 $-\dfrac45$ 이다.`},
 {q:R`곡선 위의 점 $(1,\ 2)$ 에서의 접선의 $y$ 절편을 구하시오.`,p:3.1,a:R`$\dfrac{14}{5}$`,e:R`접선은 $y-2=-\dfrac45(x-1)$, 즉 $y=-\dfrac45x+\dfrac{14}{5}$ 이다.`},
 {q:R`곡선 위의 점 중에서 접선의 기울기가 $0$ 인 점의 $y$ 좌표의 최댓값을 구하시오.`,p:3.1,a:R`$\dfrac{2\sqrt{21}}{3}$ $\left(2\sqrt{\dfrac73}\ \text{도 정답}\right)$`,e:R`$2x+y=0$ 에서 $y=-2x$ 를 곡선의 식에 대입하면 $3x^{2}=7$, $x=\pm\sqrt{\dfrac73}$ 이다. $y=-2x$ 이므로 $y$ 좌표의 최댓값은 $2\sqrt{\dfrac73}=\dfrac{2\sqrt{21}}{3}$ 이다. (이때 $x+2y\ne0$)`}]}
],
K:[
{pts:10,area:'국어·독서 + 수필',std:['10국03-01','12독서02-05'],
 intent:'생물 다양성의 가치를 다룬 설명문과 수필을 함께 읽고, 구체적인 상황과 맥락을 고려하여 글의 의미를 구성한다.',
 body:[
 {label:'(가)',text:R`19세기 중반 아일랜드의 많은 농민은 감자에 기대어 살았다. 감자는 좁고 메마른 땅에서도 많이 거둘 수 있었기 때문이다. 농민들은 그중에서도 수확량이 많은 한두 품종만을 골라 심었다. 감자는 씨앗이 아니라 덩이줄기를 잘라 심어 번식시키므로, 같은 품종의 감자들은 유전적으로 거의 똑같았다. 1845년 감자 역병이 퍼지자 이 똑같음이 재앙이 되었다. 한 포기를 쓰러뜨린 병원균은 똑같은 방식으로 다른 모든 포기를 쓰러뜨렸고, 여러 해에 걸친 흉작으로 수많은 사람이 굶어 죽거나 고향을 떠나야 했다.

이 사건은 생물 다양성이 왜 중요한지를 보여 준다. 서로 다른 유전자를 지닌 개체들이 섞여 있는 집단에서는 어떤 병이 퍼지더라도 그 병을 견디는 개체가 살아남을 가능성이 크다. 다양성은 예측할 수 없는 위기에 대비하는 ( ㉠ )인 셈이다. 그러나 현대 농업은 여전히 ㉡<u>단일 경작</u>에 크게 기대고 있다. 넓은 땅에 한 품종만 심으면 기계로 한꺼번에 심고 거둘 수 있어 비용이 줄어들기 때문이다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`할머니의 텃밭에는 질서가 없어 보였다. 고추 옆에 들깨가, 들깨 옆에 호박이, 호박 덩굴 아래에는 이름 모를 풀이 함께 자랐다. 어린 나는 밭을 반듯하게 정리하지 않는 할머니가 답답했다. 그런데 어느 해 여름 이웃 마을의 고추밭이 병으로 한꺼번에 시들었을 때에도 할머니의 밭은 멀쩡했다. 할머니는 “한 가지만 심으면 병도 한 번에 온다.”라고 하셨다. 들깨 냄새는 벌레를 쫓았고, 호박잎은 흙이 마르지 않게 덮어 주었다. 밭의 식물들은 서로에게 안전망이 되어 주고 있었다. ㉢<u>할머니의 밭에서 사람은 땅을 다스리는 이가 아니라 땅이 스스로 살아가도록 거드는 이였다.</u>`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 들어갈 적절한 3음절의 단어를 (나)에서 찾아 쓰시오.',p:2.5,a:'안전망',r:'‘안전망’을 정확히 기재하면 정답',e:'다양성이 위기에 대비하는 장치라는 뜻이므로, (나)에서 식물들이 서로에게 되어 준다고 한 ‘안전망’이 알맞다.'},
 {q:'㉡의 위험성을 압축적으로 드러낸 할머니의 말을 (나)에서 찾아 쓰시오.',p:3.1,a:'한 가지만 심으면 병도 한 번에 온다.',r:'‘한 가지만 심으면 병도 한 번에 온다.’를 정확히 기재하면 정답',e:'(가)의 아일랜드 사례처럼 한 품종만 심으면 병이 한꺼번에 번진다는 내용과 일치한다.'},
 {q:'(가)를 참고하여 ㉢에 담긴 할머니의 농사 방식의 의미를 한 문장으로 쓰시오.',p:4.4,a:'여러 작물을 섞어 길러 다양성을 지킴으로써 병과 같은 예측할 수 없는 위기에 대비하는 방식이다.',r:'‘여러 작물을 함께 길러 다양성을 유지하고, 이를 통해 위기에 대비한다’는 내용의 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'(가)는 다양성이 위기에 대비하는 안전망이라고 설명한다. (나)의 텃밭은 여러 식물이 섞여 자라 병에도 멀쩡했으므로 이 설명의 실제 사례이다.'}]},
{pts:10,area:'국어·독서(과학·기술)',std:['12독서02-02','12독서03-03'],
 intent:'위성 위치 확인 시스템의 원리를 이해하고, 지문의 정보를 표로 재구성하여 값을 추론한다.',
 body:[{text:R`위성 위치 확인 시스템(GPS)의 수신기는 하늘에 떠 있는 위성들이 보내는 전파를 받아 자신의 위치를 계산한다. 각 위성은 자신의 위치와 전파를 보낸 시각을 담은 신호를 끊임없이 내보낸다. 수신기는 전파가 도착한 시각에서 보낸 시각을 빼어 전파가 날아온 시간을 구하고, 여기에 전파의 속력인 초속 30만 km를 곱하여 위성까지의 거리를 구한다.

위성 하나까지의 거리를 알면 수신기는 그 위성을 중심으로 하고 그 거리를 반지름으로 하는 구면 위 어딘가에 있다. 두 위성까지의 거리를 알면 두 구면이 만나는 원 위로, 세 위성까지의 거리를 알면 세 구면이 만나는 두 점 가운데 하나로 범위가 좁혀진다. 두 점 중 하나는 대개 지구에서 멀리 떨어진 우주 공간에 있어 쉽게 가려낼 수 있으므로, 이론적으로는 위성 세 개만 있으면 위치를 정할 수 있다.

그런데 실제로는 적어도 네 개의 위성이 필요하다. 위성에는 매우 정밀한 원자시계가 실려 있지만 수신기에 들어 있는 시계는 그보다 훨씬 부정확하다. 전파는 1초에 30만 km를 가므로 수신기의 시계가 100만분의 1초만 틀려도 계산한 거리는 300m나 어긋난다. 따라서 수신기는 자신의 위도, 경도, 높이뿐 아니라 수신기 시계의 오차까지 모두 네 개의 값을 구해야 하고, 모르는 값이 네 개이므로 식도 네 개가 있어야 한다. 그래서 수신기는 네 번째 위성의 신호를 더 받아 (㉠                    ).`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 들어갈 적절한 말을 20자 내외로 쓰시오.',p:4.3,a:'수신기 시계의 오차를 구하여 바로잡는다.',r:'‘수신기 시계의 오차를 구한다(보정한다)’는 내용을 정확히 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'네 번째 위성이 필요한 까닭은 모르는 값에 ‘수신기 시계의 오차’가 더해지기 때문이다.'},
 {q:'&lt;보기&gt;의 빈칸에 들어갈 적절한 말을 윗글에서 찾아 쓰시오.',p:2.5,box:'수신기가 위치를 정하기 위해 구해야 하는 네 개의 값은 위도, 경도, 높이, (        )이다.',a:'수신기 시계의 오차',r:'‘수신기 시계의 오차’를 정확히 기재하면 정답',e:'셋째 문단에 네 개의 값이 나열되어 있다.'},
 {q:'윗글을 바탕으로 다음 표의 ⓐ, ⓑ, ⓒ, ⓓ에 들어갈 값을 쓰시오.',p:3.2,table:{head:['구분','주어진 값','구하는 값'],rows:[['위성 A','전파가 날아온 시간 0.07초','위성까지의 거리 ⓐ km'],['위성 B','전파가 날아온 시간 0.08초','위성까지의 거리 ⓑ km'],['수신기','시계의 오차 100만분의 2초','거리의 오차 ⓒ m'],['수신기','거리의 오차 1.5 km','시계의 오차 100만분의 ⓓ초']]},a:'ⓐ 21,000  ⓑ 24,000  ⓒ 600  ⓓ 5',r:'예시 답안을 정확히 기재하면 정답. 각각의 항목별로 부분 점수 0.8점을 부여할 수 있음',e:'거리 = 시간 × 30만 km이므로 ⓐ 0.07×300,000=21,000, ⓑ 0.08×300,000=24,000이다. 100만분의 1초에 300m가 어긋나므로 ⓒ 600m, ⓓ 1,500m÷300m=5이다.'}]}
]}
});

id:2,
