{pts:11.5,area:'국어·문법 + 수필',std:['10국05-01','10국03-01'],
 intent:'중의적 표현을 다룬 두 글을 읽고, 중의성이 생기는 까닭을 이해하여 문장을 정확하게 고쳐 쓴다.',
 body:[
 {label:'(가)',text:R`주말에 같이 놀자는 친구의 문자에 나는 ㉠<u>“나는 너보다 축구를 더 좋아해.”</u>라고 답장을 보냈다. 친구도 축구를 좋아하지만 내가 더 열성이니 이번 주말에는 함께 경기를 보러 가자는 뜻이었다. 그런데 친구에게서는 한참 동안 답이 없었다. 나중에 들으니 친구는 그 문장을 ‘너와 노는 것보다 축구가 더 좋다.’라는 뜻으로 읽고 서운해했다는 것이다. 얼굴을 보고 말했더라면 표정과 억양이 뜻을 가려 주었을 것이다. 그러나 글자만 건너간 자리에서는 하나의 문장이 두 갈래의 뜻으로 갈라졌다. 나는 ㉡<u>“네가 축구를 좋아하는 것보다 내가 축구를 더 좋아해.”</u>라고 다시 써서 보냈고, 그제야 오해가 풀렸다. 문장은 길어졌지만 뜻은 하나가 되었다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`하나의 표현이 둘 이상의 뜻으로 풀이되는 성질을 중의성이라 한다. 중의성은 흔히 글쓰기의 적으로 여겨진다. 설명서나 계약서, 법조문에서 뜻이 둘로 읽히면 다툼이 생기기 때문이다. 그래서 정확한 전달을 목표로 하는 글에서는 꾸미는 말의 자리를 옮기거나 쉼표를 찍거나 말을 보태어 중의성을 없앤다. 그러나 중의성이 언제나 흠인 것은 아니다. 시와 광고와 농담은 일부러 한 표현에 두 뜻을 겹쳐 놓는다. 읽는 이는 두 뜻 사이를 오가며 한 번 더 생각하게 되고, 그 머뭇거림 속에서 말은 더 오래 기억된다. 정확성을 좇는 글에서 중의성은 덜어 내야 할 짐이지만, 울림을 좇는 글에서 중의성은 아껴 써야 할 자산이다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'(가)와 (나)를 &lt;보기&gt;와 같이 요약할 때, ⓐ와 ⓑ에 들어갈 단어를 각각 (가)와 (나)에서 찾아 쓰시오.',p:3.2,box:'두 글은 한 표현이 여러 뜻으로 읽히는 현상을 다룬다. (가)는 중의적 표현이 일상의 소통에서 ( ⓐ )을/를 낳을 수 있음을, (나)는 중의성이 글의 목적에 따라 짐이 될 수도 있고 ( ⓑ )이/가 될 수도 있음을 보여 준다.',a:'ⓐ 오해, ⓑ 자산',r:'ⓐ: 오해 - 1.6점, ⓑ: 자산 - 1.6점',e:'(가)에서 친구는 문장을 다른 뜻으로 읽었고 고쳐 쓴 뒤에야 “오해가 풀렸다.” (나)의 마지막 문장은 중의성을 ‘짐’과 ‘자산’으로 대비한다.'},
 {q:'&lt;보기&gt;를 활용하여 ㉠이 두 가지 뜻으로 읽히는 까닭을 한 문장으로 쓰시오.',p:4.2,box:'‘A는 B보다 C를 더 좋아한다.’와 같은 비교 구문은 ‘B’가 주어 ‘A’와 비교되는 대상인지, 목적어 ‘C’와 비교되는 대상인지에 따라 두 가지로 풀이될 수 있다.',a:'‘너’가 주어인 ‘나’와 비교되는 대상인지, 목적어인 ‘축구’와 비교되는 대상인지 분명하지 않기 때문이다.',r:'‘‘너’의 비교 대상이 주어 ‘나’인지 목적어 ‘축구’인지 분명하지 않다’는 의미의 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'‘나’와 ‘너’를 견주면 ‘네가 축구를 좋아하는 것보다’의 뜻이 되고, ‘너’와 ‘축구’를 견주면 ‘내가 너를 좋아하는 것보다’의 뜻이 된다.'},
 {q:'“예쁜 친구의 동생을 만났다.”에서 ‘예쁜’이 ‘동생’만을 꾸미도록, (나)에 제시된 방법 가운데 ‘꾸미는 말의 자리를 옮기는’ 방법으로 고쳐 쓰시오.',p:4.1,a:'친구의 예쁜 동생을 만났다.',r:'‘친구의 예쁜 동생을 만났다.’를 정확히 기재하면 정답',e:'‘예쁜’을 꾸밈을 받는 말 ‘동생’ 바로 앞으로 옮기면 ‘친구’를 꾸미는 뜻으로 읽힐 여지가 사라진다.'}]},

{pts:9.0,area:'국어·고전 수필',std:['10국05-01','12독서01-01'],
 intent:'이곡의 「차마설」에 나타난 소유에 대한 성찰을 사실적·추론적으로 이해하고 다른 글과 관련지어 읽는다.',
 body:[{text:R`나는 집이 가난하여 말이 없으므로 가끔 남의 말을 빌려 탄다. 여위고 둔한 말을 빌리면 일이 급해도 감히 채찍을 대지 못하고 넘어질까 조심하며, 개울이나 구렁을 만나면 내려서 걷는다. 그래서 뉘우치는 일이 드물다. 발굽이 높고 귀가 쫑긋하며 날랜 말을 빌리면 의기양양하여 마음대로 채찍질하고 고삐를 놓아 언덕과 골짜기를 평지처럼 달리니 매우 통쾌하다. 그러나 때로는 말에서 떨어지는 위태로움을 면하지 못한다.

아, 사람의 마음이 옮겨 가고 바뀌는 것이 이와 같구나. 남의 것을 빌려 하루아침 쓰는 것도 이러한데, 하물며 참으로 제가 가지고 있는 것이야 말할 나위가 있겠는가.

그러나 사람이 가진 것 가운데 남에게서 빌리지 않은 것이 무엇인가. 임금은 백성에게서 힘을 빌려 높고 귀한 자리에 있고, 신하는 임금에게서 권세를 빌려 귀한 대접을 누린다. 자식은 아버지에게서, 아내는 남편에게서, 종은 주인에게서 빌린 것이 또한 많다. ㉡<u>그런데도 모두 그것을 본래 제가 가진 것으로 여기고 끝내 돌아보지 않으니</u> 어찌 어리석은 일이 아니겠는가. 그러다가 혹 잠깐 사이에 빌린 것을 도로 돌려주게 되면, 만 나라를 거느리던 임금도 외로운 한 사람이 되고, 백 대의 수레를 거느리던 신하도 외로운 신하가 된다. 하물며 그보다 미약한 사람이야 말할 것이 있겠는가.

맹자가 말하기를 “오래도록 빌려 쓰고 돌려주지 않으면, 어찌 그것이 제 것이 아닌 줄을 알겠는가.”라고 하였다. 나는 이 말에 느낀 바가 있어 「차마설」을 지어 그 뜻을 넓힌다.`,src:'이곡, 「차마설(借馬說)」 (한문 원전을 현대어로 풀어 씀)'}],
 qs:[
 {q:'&lt;보기&gt;의 ㉠에 들어갈 말을 윗글에서 찾아 2어절로 쓰시오.',p:4.2,box:'글쓴이는 말을 빌려 탄 경험에서 출발하여, 사람이 누리는 권세와 재물이 본래 제 것이 아니라 모두 남에게서 ( ㉠ )(이)라는 깨달음으로 나아간다.',a:'빌린 것',r:'‘빌린 것’을 정확히 기재하면 정답',e:'셋째 문단에서 임금, 신하, 자식, 아내, 종이 가진 것이 모두 “빌린 것”이라고 하였다.'},
 {q:'㉡과 같은 태도를 경계하는 데 필요한 마음가짐을 나타내기에 가장 적합한 한 단어를 &lt;보기&gt;에서 찾아 쓰시오.',p:4.8,box:'옛사람들은 높은 자리에 오를수록 스스로를 낮추라고 가르쳤다. 가득 찬 그릇은 조금만 기울어도 쏟아지지만, 덜 찬 그릇은 기울어도 쏟아지지 않는다. 제가 누리는 것이 제힘만으로 얻은 것이 아님을 아는 사람은 뽐내지 않는다. 이렇게 자신을 낮추고 삼가는 마음가짐을 겸손이라 한다.',a:'겸손',r:'‘겸손’을 정확히 기재하면 정답',e:'㉡은 빌린 것을 본래 제 것으로 여기는 태도이다. <보기>는 누리는 것이 제힘만으로 얻은 것이 아님을 알고 자신을 낮추는 ‘겸손’을 제시한다.'}]},

{pts:9.5,area:'국어·독서(사회)',std:['12독서03-02','12독서02-05'],
 intent:'정보의 비대칭이 낳는 문제와 해결 방안을 다룬 글을 읽고, 개념을 구분하여 사례에 적용한다.',
 body:[{text:R`중고차 시장에서 파는 사람은 차의 상태를 잘 알지만 사는 사람은 알기 어렵다. 이처럼 거래 당사자 가운데 한쪽만 정보를 많이 가진 상황을 정보의 비대칭이라 한다. 정보의 비대칭은 두 가지 문제를 낳는다.

첫째는 거래가 이루어지기 전에 생기는 역선택이다. 사는 사람은 좋은 차와 나쁜 차를 가려낼 수 없으므로 평균적인 값만 치르려 한다. 그러면 좋은 차의 주인은 제값을 받지 못해 시장을 떠나고, 시장에는 나쁜 차만 남는다. 상대의 특성을 알 수 없어서 바람직하지 않은 상대와 거래하게 되는 것이다. 보험도 마찬가지이다. 보험 회사가 가입자의 건강 상태를 알 수 없어 모두에게 같은 보험료를 매기면 (㉢                    ).

둘째는 거래가 이루어진 뒤에 생기는 도덕적 해이이다. 화재 보험에 든 사람이 불조심을 게을리하거나, 월급을 받는 직원이 주인이 보지 않을 때 일을 소홀히 하는 것이 그 예이다. 상대의 행동을 일일이 지켜볼 수 없어서 생기는 문제이다.

해결책도 서로 다르다. 역선택은 정보를 가진 쪽이 자신의 특성을 믿을 만한 방식으로 알리는 ‘신호 보내기’나, 정보가 없는 쪽이 상대로 하여금 특성을 드러내게 하는 ‘선별’로 줄일 수 있다. 중고차 판매자가 무상 수리 보증을 내거는 것은 신호 보내기이고, 보험 회사가 건강 검진 결과를 요구하는 것은 선별이다. 도덕적 해이는 손해의 일부를 가입자가 부담하게 하는 자기 부담금 제도나 성과에 따라 보수를 주는 성과급처럼, 상대의 이익을 나의 이익과 맞물리게 하는 장치로 줄일 수 있다. 요컨대 역선택은 감추어진 ( ㉠ )의 문제이고, 도덕적 해이는 감추어진 ( ㉡ )의 문제이다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠과 ㉡에 각각 들어갈 2음절의 단어를 윗글에서 찾아 쓰시오.',p:2.0,a:'㉠ 특성, ㉡ 행동',r:'특성, 행동을 정확히 기재하면 각각 1.0점을 부여함',e:'역선택은 “상대의 특성을 알 수 없어서”, 도덕적 해이는 “상대의 행동을 일일이 지켜볼 수 없어서” 생긴다고 하였다.'},
 {q:'윗글의 논지에 비추어 ㉢에 들어갈 내용을 30자 내외로 서술하시오.',p:4.5,a:'건강한 사람은 가입하지 않고 아플 가능성이 큰 사람만 가입하게 된다.',r:'‘건강한 사람은 빠져나가고 건강이 나쁜 사람만 가입하게 된다’는 내용을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'중고차 시장에서 좋은 차가 떠나고 나쁜 차만 남는 것과 같은 구조이다. 평균 보험료는 건강한 사람에게 비싸므로 건강한 사람이 떠난다.'},
 {q:'&lt;보기&gt;의 ㉮가 줄이려는 문제와 ㉯에 쓰인 해결 방법을 각각 윗글에서 찾아 쓰시오.',p:3.0,box:'㉮ 어느 자동차 보험 회사는 사고가 났을 때 수리비의 20%를 가입자가 내도록 약관을 고쳤다.<br>㉯ 한 구직자는 자신의 능력을 보여 주려고 따기 어려운 자격증을 취득하여 이력서에 적었다.',a:'㉮ 도덕적 해이, ㉯ 신호 보내기',r:'정답을 정확히 기재하면 각각 1.5점을 부여함',e:'㉮는 자기 부담금 제도로, 가입 뒤 조심하지 않는 도덕적 해이를 줄인다. ㉯는 정보를 가진 구직자가 자신의 특성을 믿을 만하게 알리는 신호 보내기이다.'}]},

{pts:9.0,area:'국어·독서(주제 통합)',std:['10국02-03','12독서01-02'],
 intent:'외부 효과와 그 해결 방안에 관한 두 글을 통합적으로 읽고, 개념을 사례에 적용한다.',
 body:[
 {label:'(가)',text:R`양봉업자의 벌이 이웃 과수원의 꽃가루받이를 도와도 과수원 주인은 양봉업자에게 돈을 내지 않는다. 공장이 강에 폐수를 흘려보내 하류의 어민이 피해를 입어도 공장은 어민에게 값을 치르지 않는다. 이처럼 어떤 사람의 경제 활동이 시장의 거래를 거치지 않고 다른 사람에게 이익이나 손해를 주는 것을 ( ㉠ ) 효과라고 한다. 이익을 주는 경우를 긍정적 외부 효과, 손해를 주는 경우를 부정적 외부 효과라 한다. 문제는 대가가 오가지 않기 때문에 당사자가 그 이익이나 손해를 자기 셈에 넣지 않는다는 데 있다. 그래서 긍정적 외부 효과를 낳는 활동은 사회에 바람직한 수준보다 적게, 부정적 외부 효과를 낳는 활동은 바람직한 수준보다 많이 이루어진다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`경제학자 피구는 정부가 나서서 이 어긋남을 바로잡아야 한다고 보았다. 남에게 손해를 끼치는 활동에는 그 손해만큼 세금을 매기고, 남에게 이익을 주는 활동에는 그 이익만큼 보조금을 주자는 것이다. 그러면 당사자는 남에게 끼치는 영향까지 자기 셈에 넣게 되어, 활동의 양이 사회에 바람직한 수준에 가까워진다. 이를 ( ㉠ ) 효과의 내부화라고 한다. 탄소를 배출하는 만큼 물리는 세금이나 전기 자동차를 사는 사람에게 주는 지원금이 그 예이다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 단어를 (가)에서 찾아 한 단어로 쓰시오.',p:2.7,a:'외부',r:'‘외부’를 정확히 기재하면 정답',e:'시장의 거래 ‘바깥’에서 남에게 이익이나 손해를 주는 것이 외부 효과이다.'},
 {q:'다음 ⓐ, ⓑ, ⓒ에 들어갈 말을 (가)와 (나)에 쓰인 표현으로 쓰시오.',p:6.3,box:'&lt;탐구 활동&gt; 국민이는 두 글을 읽고 다음과 같이 정리해 보았다.',table:{head:['사례','외부 효과의 종류','실제 활동의 양','피구의 처방'],rows:[['독감 예방 접종','긍정적 외부 효과','바람직한 수준보다 ( ⓐ )','보조금'],['공장의 매연 배출','( ⓑ ) 외부 효과','바람직한 수준보다 많음','( ⓒ )']]},a:'ⓐ 적음(적게 이루어짐), ⓑ 부정적, ⓒ 세금',r:'ⓐ, ⓑ, ⓒ를 모두 정확히 기재하면 정답, 각각 2.1점씩 부여',e:'예방 접종은 남의 감염 위험까지 줄이는 긍정적 외부 효과를 낳으므로 바람직한 수준보다 적게 이루어진다. 매연은 남에게 손해를 주는 부정적 외부 효과이므로 피구는 세금을 처방한다.'}]},

{pts:9.5,area:'국어·독서(과학·기술)',std:['12독서02-01','12독서03-03'],
 intent:'면역 기억과 백신의 원리를 서술한 글을 읽고 그 과정을 사실적·추론적으로 이해한다.',
 body:[{text:R`우리 몸은 한 번 앓은 병에 다시 걸리지 않거나 걸리더라도 가볍게 앓는다. 면역 체계가 침입자를 기억하기 때문이다. 병원체가 처음 들어오면 몸은 그 병원체의 표면에 있는 고유한 분자, 곧 항원을 알아보는 림프구를 찾아내어 수를 불린다. 이 가운데 B 림프구는 형질 세포로 바뀌어, 항원에 달라붙는 단백질인 항체를 만들어 낸다. 이를 1차 면역 반응이라 한다. 1차 면역 반응에서는 알맞은 림프구를 찾아 불리는 데 시간이 걸려서, 항체가 넉넉히 만들어지기까지 여러 날이 걸리고 그동안 우리는 병을 앓는다.

그런데 이때 불어난 림프구의 일부는 형질 세포가 되지 않고 ( ㉠ ) 세포로 남아 오랫동안 몸속에 머문다. 같은 병원체가 다시 들어오면 ( ㉠ ) 세포가 곧바로 불어나 형질 세포로 바뀌고 항체를 만들어 낸다. 이를 2차 면역 반응이라 한다. 2차 면역 반응에서는 1차 때보다 항체가 훨씬 빨리, 훨씬 많이 만들어지므로 병원체는 병을 일으키기 전에 제거된다.

백신은 이 원리를 이용한다. 백신은 병을 일으키는 힘을 없애거나 약하게 한 병원체, 또는 병원체의 항원 조각을 몸에 넣어 주는 것이다. 그러면 몸은 병을 앓지 않으면서도 1차 면역 반응을 일으켜 (㉡                    ). 그 뒤 진짜 병원체가 들어오면, 몸은 처음 만나는 상대인데도 2차 면역 반응으로 맞선다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 공통적으로 들어갈 2음절의 단어를 윗글에 쓰인 말을 활용하여 쓰시오.',p:2.1,a:'기억',r:'‘기억’을 정확히 기재하면 정답',e:'첫 문단에서 “면역 체계가 침입자를 기억”한다고 하였고, 다시 들어온 병원체에 곧바로 반응하는 세포이므로 ‘기억 세포’이다.'},
 {q:'윗글을 참고하여 ㉡에 들어갈 내용을 20자 내외로 쓰시오.',p:5.2,a:'그 병원체를 기억하는 세포를 미리 만들어 둔다.',r:'‘기억 세포를 (미리) 만들어 둔다’는 내용이 들어 있는 문장이면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'진짜 병원체가 들어왔을 때 2차 면역 반응이 일어나려면 기억 세포가 있어야 한다. 백신이 일으킨 1차 면역 반응의 결과로 기억 세포가 남는다.'},
 {q:'항체를 직접 만들어 내는 세포의 이름을 윗글에서 찾아 쓰시오.',p:2.2,a:'형질 세포',r:'‘형질 세포’를 정확히 기재하면 정답',e:'B 림프구가 형질 세포로 바뀌어 항체를 만들어 낸다.'}]},

{pts:9.5,area:'국어·독서 + 문학',std:['12독서02-02','12문학02-03'],
 intent:'상실에 대한 두 가지 반응을 구별한 글을 이해하고 이를 시 작품에 추론적으로 적용할 수 있는지 평가한다.',
 body:[
 {label:'(가)',text:R`프로이트는 사랑하는 대상을 잃은 사람이 보이는 반응을 ‘애도’와 ‘우울’로 나누었다. 애도는 대상이 이제 없다는 현실을 조금씩 받아들이고, 대상에게 쏟았던 마음을 거두어들이는 느리고 고통스러운 작업이다. 이 작업이 끝나면 사람은 다시 삶으로 돌아와 새로운 대상을 사랑할 수 있게 된다. 반면 우울은 상실을 끝내 받아들이지 못하는 상태이다. 떠난 대상을 놓지 못한 사람은 마음을 거두어들이지 못하고, 대상이 없는 세계에서 대상을 계속 부르며 머문다. 프로이트는 애도하는 사람에게는 세계가 텅 빈 것처럼 느껴지지만, 우울한 사람에게는 자기 자신이 텅 빈 것처럼 느껴진다고 하였다. 둘을 가르는 것은 슬픔의 크기가 아니다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`산산이 부서진 이름이여!
허공중에 헤어진 이름이여!
불러도 주인 없는 이름이여!
부르다가 내가 죽을 이름이여!

심중에 남아 있는 말 한마디는
끝끝내 마저 하지 못하였구나.
사랑하던 그 사람이여!
사랑하던 그 사람이여!`,src:'김소월, 「초혼」 중'}],
 qs:[
 {q:'&lt;보기&gt;는 (가)를 정리한 것이다. ⓐ에 들어갈 적절한 단어를 (가)에서 찾아 쓰시오.',p:3.7,box:'프로이트에 따르면 애도와 우울을 가르는 것은 슬픔의 크기가 아니라, 대상이 이제 없다는 ( ⓐ )을/를 받아들이는가이다.',a:'현실',r:'‘현실’을 정확히 기재하면 정답, ‘상실’은 부분 점수',e:'애도는 “대상이 이제 없다는 현실을 조금씩 받아들이는” 작업이고, 우울은 상실을 받아들이지 못하는 상태이다.'},
 {q:'&lt;보기&gt;는 (가)의 관점에서 (나)를 정리한 것이다. ⓑ에 들어갈 적절한 2어절의 말을 (나)의 1연에서 찾아 쓰시오.',p:5.8,box:'(나)의 화자는 떠난 이를 놓지 못하고 그 이름을 거듭 부른다. 1연에서 ‘이름’을 꾸미는 말 가운데 ( ⓑ )은/는 그 이름의 임자가 이미 이 세상에 없음을 직접 드러낸다. 화자는 이를 알면서도 부르기를 멈추지 못한다.',a:'주인 없는',r:'‘주인 없는’을 정확히 기재하면 정답',e:'“불러도 주인 없는 이름”은 이름의 임자가 세상에 없음을 직접 말한다. 대상이 없는 줄 알면서 계속 부른다는 점에서 (가)의 ‘대상을 계속 부르며 머무는’ 상태와 통한다.'}]},

{pts:10,area:'국어·독서(예술)',std:['12독서02-02','12독서02-01'],
 intent:'전통 건축의 착시 보정 기법을 정확히 이해하고, 이를 새로운 상황에 적용할 수 있는지 평가한다.',
 body:[{text:R`우리 눈은 사물을 있는 그대로 보지 않는다. 곧은 선을 휘었다고 보기도 하고 같은 길이를 다르게 보기도 한다. 옛 목수들은 이러한 착시를 잘 알고 있었고, 건물이 바르게 ‘보이도록’ 일부러 바르지 않게 지었다.

첫째, 위아래의 굵기가 같은 기둥을 멀리서 보면 가운데가 홀쭉해 보인다. 그래서 목수들은 기둥의 가운데 부분을 위아래보다 조금 굵게 깎았다. 이를 ( ㉠ )이라 한다. 둘째, 높이가 같은 기둥을 한 줄로 세우면 건물의 양쪽 끝이 아래로 처져 보인다. 그래서 건물의 모서리에 서는 기둥을 가운데 기둥보다 조금 높게 세웠다. 이를 ( ㉡ )이라 한다. 셋째, 기둥을 모두 똑바로 세우면 건물의 위쪽이 바깥으로 벌어져 보인다. 그래서 기둥의 머리를 건물 안쪽으로 조금 기울여 세웠다. 이를 ( ㉢ )이라 한다.

이름에는 그 방법이 담겨 있다. ‘귀솟음’은 건물의 귀, 곧 모서리가 솟았다는 뜻이고, ‘안쏠림’은 기둥이 안으로 쏠렸다는 뜻이며, ‘배흘림’은 기둥의 배가 불룩하다는 뜻이다. 이 기법들은 눈에 띄지 않을 만큼 작게 베풀어진다. 알아차릴 만큼 크면 그것이 도리어 눈에 거슬리기 때문이다. 보는 이는 기법을 알아보지 못한 채 다만 건물이 반듯하고 든든하다고 느낀다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠, ㉡, ㉢에 각각 들어갈 단어를 윗글에서 찾아 쓰시오.',p:4.5,a:'㉠ 배흘림, ㉡ 귀솟음, ㉢ 안쏠림',r:'‘배흘림’, ‘귀솟음’, ‘안쏠림’을 순서대로 정확히 기재하면 정답, 각각의 항목별로 부분 점수 1.5점을 부여할 수 있음',e:'가운데를 굵게(배가 불룩) → 배흘림, 모서리 기둥을 높게(귀가 솟음) → 귀솟음, 기둥 머리를 안으로 기울임 → 안쏠림.'},
 {q:'&lt;보기&gt;의 문제를 바로잡는 데 알맞은 기법을 고르고, 그 방법을 윗글을 참고하여 40자 내외로 쓰시오.',p:5.5,box:'어느 목조 건물을 지으면서 모든 기둥을 같은 높이, 같은 굵기로 똑바로 세웠더니, 멀리서 볼 때 지붕의 양쪽 끝이 아래로 처져 보인다는 지적을 받았다.',a:'귀솟음 기법을 써서 건물 모서리에 서는 기둥을 가운데 기둥보다 조금 높게 세운다.',r:'‘귀솟음’과 ‘모서리 기둥을 가운데 기둥보다 높게 세움’을 모두 쓰면 정답. 기법만 맞게 쓴 경우 부분 점수 부여, 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'양쪽 끝이 처져 보이는 착시는 둘째 경우에 해당하며, 이를 바로잡는 기법은 귀솟음이다.'}]},

{pts:12,area:'국어·독서 + 고전 시가',std:['12문학01-01','12독서02-03'],
 intent:'강호가도의 특징을 이해하고 이를 시조에 적용함으로써 작품에 담긴 가치관을 이해한다.',
 body:[
 {label:'(가)',text:R`조선 전기의 사대부들은 벼슬에서 물러나 자연에 묻혀 사는 삶을 즐겨 노래하였다. 이러한 노래의 흐름을 강호가도(江湖歌道)라 한다. 그런데 이들의 자연은 세상을 등진 사람의 ㉠<u>도피처</u>가 아니었다. 이들에게 자연은 세상이 싫어 달아난 은신처가 아니라, 나라가 평안하기에 마음 놓고 누릴 수 있는 삶의 자리였다. 사대부들은 나라의 평안이 임금의 덕에서 비롯된다고 여겼다. 그러므로 강호에서 한가로이 지내는 사대부의 모습은 임금이 나라를 잘 다스린다는 증거로 여겨졌고, 자연을 즐기는 노래는 곧 임금의 덕을 드러내는 ( ㉡ )이/가 되었다.`},
 {label:'<A>',text:R`강호가도의 노래는 대개 세 단계로 짜인다. 먼저 계절의 변화에 따라 저절로 일어나는 흥을 말한다. 다음으로 그 흥을 누리는 구체적인 생활의 모습, 곧 소박한 술과 안주, 낚시와 같은 일상을 그린다. 끝으로 이 모든 한가로움이 임금의 은혜 덕분이라고 말하며 노래를 맺는다. 이 마지막 구절은 덧붙인 인사말이 아니다. 화자가 누리는 한가로움이 곧 나라가 잘 다스려지고 있다는 ( ㉡ )이기 때문이다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`강호(江湖)에 봄이 드니 미친 흥(興)이 절로 난다
탁료계변(濁醪溪邊)에 금린어(錦鱗魚) 안주로다
이 몸이 한가(閑暇)해옴도 역군은(亦君恩)이샷다

*탁료계변: 막걸리를 마시며 노는 시냇가.
*금린어: 쏘가리. 싱싱한 물고기를 이름.
*역군은이샷다: 또한 임금의 은혜이시도다.`,src:'맹사성, 「강호사시가」 중'}],
 qs:[
 {q:'㉠과 유사한 의미를 지닌 단어를 (가)에서 찾아 쓰시오.',p:3.9,a:'은신처',r:'‘은신처’를 정확히 기재하면 정답',e:'“세상이 싫어 달아난 은신처”는 ‘세상을 등진 사람의 도피처’와 같은 뜻이다.'},
 {q:'㉡에 공통적으로 들어갈 단어를 (가)에서 찾아 쓰시오.',p:2.4,a:'증거',r:'‘증거’를 정확히 기재하면 정답',e:'“임금이 나라를 잘 다스린다는 증거로 여겨졌고”에서 찾을 수 있다.'},
 {q:'&lt;A&gt;의 내용을 바탕으로 (나)를 설명하시오.',p:5.7,a:'초장에서 봄을 맞아 저절로 일어나는 흥을, 중장에서 시냇가에서 막걸리와 물고기 안주를 즐기는 소박한 생활을 말한 뒤, 종장에서 이 한가로움이 임금의 은혜라고 하여 태평한 세상을 기린다.',r:'‘계절에 따른 흥(초장)’, ‘소박한 생활의 모습(중장)’, ‘한가로움을 임금의 은혜로 돌림(종장)’의 내용을 서술하면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 줄 수 있음',e:'<A>의 세 단계가 초장·중장·종장에 그대로 대응한다.'}]}
],
M:[
{pts:8,area:'수학Ⅰ · 지수',std:['12수학Ⅰ01-08'],unit:'수학Ⅰ 지수함수와 로그함수(지수의 확장과 지수법칙)',
 intent:'지수법칙과 곱셈 공식을 이용하여 식의 값을 구할 수 있는지 평가한다.',
 body:R`실수 $x$ 가 $2^{x}-2^{-x}=1$ 을 만족할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$4^{x}+4^{-x}$ 의 값을 구하시오.`,p:3.5,a:R`$3$`,e:R`$(2^{x}-2^{-x})^{2}=4^{x}-2+4^{-x}=1$ 이므로 $4^{x}+4^{-x}=3$ 이다.`},
 {q:R`$8^{x}-8^{-x}$ 의 값을 구하시오.`,p:4.5,a:R`$4$`,e:R`$a=2^{x}$, $b=2^{-x}$ 라 하면 $ab=1$ 이고 $a^{3}-b^{3}=(a-b)(a^{2}+ab+b^{2})=1\cdot(3+1)=4$ 이다.`}]},
{pts:12,area:'수학Ⅱ · 함수의 극한과 미분',std:['12수학Ⅱ01-01','12수학Ⅱ01-02'],
 intent:'함수의 극한 조건으로부터 다항함수를 결정하고, 도함수를 활용하여 극값과 방정식의 실근의 개수를 구할 수 있는지 평가한다.',
 body:R`다항함수 $f(x)$ 가 $$\lim_{x\to\infty}\frac{f(x)-x^{3}}{x^{2}}=2,\qquad \lim_{x\to0}\frac{f(x)}{x}=-4$$ 를 만족할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$f(1)$ 의 값을 구하시오.`,p:1.5,a:R`$-1$`,e:R`첫째 조건에서 $f(x)-x^{3}$ 은 이차항의 계수가 $2$ 인 이차식이므로 $f(x)=x^{3}+2x^{2}+ax+b$ 이다. 둘째 조건에서 $f(0)=0$ 이므로 $b=0$ 이고 극한값은 $a=-4$ 이다. 따라서 $f(x)=x^{3}+2x^{2}-4x$, $f(1)=-1$ 이다.`},
 {q:R`$f'(1)$ 의 값을 구하시오.`,p:2.0,a:R`$3$`,e:R`$f'(x)=3x^{2}+4x-4$ 이므로 $f'(1)=3$ 이다.`},
 {q:R`함수 $f(x)$ 의 극댓값을 구하시오.`,p:3.9,a:R`$8$`,e:R`$f'(x)=(3x-2)(x+2)$ 이므로 $x=-2$ 에서 극대이고 $f(-2)=-8+8+8=8$ 이다.`},
 {q:R`방정식 $f(x)=k$ 가 서로 다른 세 실근을 갖도록 하는 정수 $k$ 의 개수를 구하시오.`,p:4.6,a:R`$9$`,e:R`극솟값은 $f\!\left(\dfrac23\right)=\dfrac{8}{27}+\dfrac{8}{9}-\dfrac83=-\dfrac{40}{27}$ 이므로 $-\dfrac{40}{27}<k<8$ 이다. 정수 $k$ 는 $-1,\ 0,\ \cdots,\ 7$ 의 $9$ 개이다.`}]}
]},
nat:{M:[
{pts:12,area:'미적분, 수학 · 수열의 극한과 급수',std:['12미적01-04'],unit:'미적분 수열의 극한(수열의 극한값의 계산, 급수)',
 intent:'이차방정식의 근으로 정의된 수열의 극한값을 구하고, 근과 계수의 관계를 이용하여 급수의 합을 구할 수 있는지 평가한다.',
 body:R`자연수 $n$ 에 대하여 $x$ 에 대한 이차방정식 $$x^{2}-2nx-n=0$$ 의 두 실근을 $\alpha_{n},\ \beta_{n}\ (\alpha_{n}<\beta_{n})$ 이라 할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$\displaystyle\lim_{n\to\infty}(\beta_{n}-2n)$ 의 값을 구하시오.`,p:2.5,a:R`$\dfrac12$`,e:R`$\beta_{n}=n+\sqrt{n^{2}+n}$ 이므로 $\beta_{n}-2n=\sqrt{n^{2}+n}-n=\dfrac{n}{\sqrt{n^{2}+n}+n}\to\dfrac12$.`},
 {q:R`$\displaystyle\lim_{n\to\infty}n\left(\alpha_{n}+\frac12\right)$ 의 값을 구하시오.`,p:4.0,a:R`$\dfrac18$`,e:R`$\alpha_{n}=n-\sqrt{n^{2}+n}=-\dfrac{n}{n+\sqrt{n^{2}+n}}$ 이므로 $$\alpha_{n}+\frac12=\frac{\sqrt{n^{2}+n}-n}{2(n+\sqrt{n^{2}+n})}=\frac{n}{2(n+\sqrt{n^{2}+n})^{2}}$$ 이다. 따라서 $n\left(\alpha_{n}+\dfrac12\right)=\dfrac{n^{2}}{2(n+\sqrt{n^{2}+n})^{2}}\to\dfrac{1}{2\cdot 2^{2}}=\dfrac18$ 이다.`},
 {q:R`$\displaystyle\sum_{n=1}^{\infty}\frac{1}{\alpha_{n}\beta_{n}\,\alpha_{n+1}\beta_{n+1}}$ 의 값을 구하시오.`,p:5.5,a:R`$1$`,e:R`근과 계수의 관계에서 $\alpha_{n}\beta_{n}=-n$ 이므로 $\alpha_{n}\beta_{n}\alpha_{n+1}\beta_{n+1}=n(n+1)$ 이다. $$\sum_{n=1}^{\infty}\frac{1}{n(n+1)}=\lim_{n\to\infty}\left(1-\frac{1}{n+1}\right)=1.$$`}]},
{pts:12,area:'미적분 · 지수함수의 미분과 적분',std:['12미적02-02'],unit:'미적분 도함수의 활용, 여러 가지 적분법(부분적분법)',
 intent:'지수함수가 포함된 함수의 최댓값과 변곡점을 구하고, 부분적분법으로 넓이를 구할 수 있는지 평가한다.',
 body:R`함수 $f(x)=xe^{-x}$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`함수 $f(x)$ 의 최댓값을 구하시오.`,p:3.3,a:R`$\dfrac1e$`,e:R`$f'(x)=(1-x)e^{-x}$ 이므로 $x=1$ 에서 극대이면서 최대이고 $f(1)=\dfrac1e$ 이다.`},
 {q:R`곡선 $y=f(x)$ 의 변곡점의 $x$ 좌표를 구하시오.`,p:3.3,a:R`$2$`,e:R`$f''(x)=(x-2)e^{-x}$ 이고 $x=2$ 의 좌우에서 $f''(x)$ 의 부호가 바뀌므로 변곡점의 $x$ 좌표는 $2$ 이다.`},
 {q:R`곡선 $y=f(x)$ 와 $x$ 축 및 직선 $x=2$ 로 둘러싸인 부분의 넓이를 구하시오.`,p:5.4,a:R`$1-\dfrac{3}{e^{2}}$`,e:R`$$\int_{0}^{2}xe^{-x}\,dx=\Big[-xe^{-x}\Big]_{0}^{2}+\int_{0}^{2}e^{-x}\,dx=-\frac{2}{e^{2}}+1-\frac{1}{e^{2}}=1-\frac{3}{e^{2}}.$$`}]},
{pts:10,area:'수학Ⅱ · 정적분',std:['12수학Ⅱ03-04','12수학Ⅱ03-05'],
 intent:'절댓값이 포함된 함수의 정적분을 구간을 나누어 계산하고, 정적분으로 정의된 함수를 미분할 수 있는지 평가한다.',
 body:R`함수 $f(x)=|x^{2}-1|$ 과 함수 $F(x)=\displaystyle\int_{0}^{x}f(t)\,dt$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`$F(2)$ 의 값을 구하시오.`,p:3.9,a:R`$2$`,e:R`$\displaystyle\int_{0}^{1}(1-x^{2})\,dx+\int_{1}^{2}(x^{2}-1)\,dx=\frac23+\frac43=2$.`},
 {q:R`$F'(3)$ 의 값을 구하시오.`,p:2.5,a:R`$8$`,e:R`$F'(x)=f(x)$ 이므로 $F'(3)=|9-1|=8$ 이다.`},
 {q:R`$\displaystyle\int_{-1}^{2}\{f(x)+x\}\,dx$ 의 값을 구하시오.`,p:3.6,a:R`$\dfrac{25}{6}$`,e:R`$\displaystyle\int_{-1}^{1}(1-x^{2})\,dx+\int_{1}^{2}(x^{2}-1)\,dx+\int_{-1}^{2}x\,dx=\frac43+\frac43+\frac32=\frac{25}{6}$.`}]},
{pts:10,area:'미적분 · 입체도형의 부피',std:['12미적03-06'],
 intent:'단면의 넓이와 입체도형의 부피 사이의 관계를 이해하고, 정적분을 이용하여 부피를 계산할 수 있는지 평가한다.',
 body:R`원 $x^{2}+y^{2}=4$ 의 내부를 밑면으로 하는 입체도형 $S$ 가 있다. 이 입체도형을 $x$ 축에 수직인 평면으로 자른 단면이 모두 정삼각형일 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$-2\le x\le2$ 인 실수 $x$ 에 대하여 단면인 정삼각형의 한 변의 길이를 $x$ 에 대한 식으로 나타내시오.`,p:1.5,a:R`$2\sqrt{4-x^{2}}$`,e:R`직선 $x=t$ 가 원과 만나는 두 점 사이의 거리는 $2\sqrt{4-t^{2}}$ 이다.`},
 {q:R`$x=0$ 인 점을 지나는 단면의 넓이를 구하시오.`,p:1.5,a:R`$4\sqrt3$`,e:R`한 변의 길이가 $4$ 인 정삼각형이므로 $\dfrac{\sqrt3}{4}\cdot16=4\sqrt3$ 이다.`},
 {q:R`입체도형 $S$ 의 부피를 구하시오.`,p:7.0,a:R`$\dfrac{32\sqrt3}{3}$`,e:R`단면의 넓이는 $\dfrac{\sqrt3}{4}\cdot4(4-x^{2})=\sqrt3(4-x^{2})$ 이므로 $$V=\int_{-2}^{2}\sqrt3(4-x^{2})\,dx=2\sqrt3\Big[4x-\frac{x^{3}}{3}\Big]_{0}^{2}=2\sqrt3\cdot\frac{16}{3}=\frac{32\sqrt3}{3}.$$`}]},
{pts:10,area:'수학Ⅰ · 로그와 수열의 합',std:['12수학Ⅰ03-01','12수학Ⅰ01-08'],
 intent:'로그의 성질을 이용하여 수열의 합을 간단히 하고, 조건을 만족하는 항의 수를 구할 수 있는지 평가한다.',
 body:R`수열 $\{a_{n}\}$ 의 일반항이 $$a_{n}=\log_{3}\frac{2n+1}{2n-1}$$ 일 때, $S_{n}=\displaystyle\sum_{k=1}^{n}a_{k}$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`$S_{4}$ 의 값을 구하시오.`,p:2.5,a:R`$2$`,e:R`$S_{n}=\log_{3}\left(\dfrac31\cdot\dfrac53\cdots\dfrac{2n+1}{2n-1}\right)=\log_{3}(2n+1)$ 이므로 $S_{4}=\log_{3}9=2$ 이다.`},
 {q:R`$S_{n}=4$ 를 만족하는 자연수 $n$ 의 값을 구하시오.`,p:4.3,a:R`$40$`,e:R`$2n+1=3^{4}=81$ 에서 $n=40$ 이다.`},
 {q:R`$S_{n}$ 의 값이 자연수가 되도록 하는 $100$ 이하의 자연수 $n$ 의 개수를 구하시오.`,p:3.2,a:R`$4$`,e:R`$2n+1=3^{m}$ ($m$ 은 자연수)에서 $n=\dfrac{3^{m}-1}{2}$ 이다. $m=1,\ 2,\ 3,\ 4$ 일 때 $n=1,\ 4,\ 13,\ 40$ 이고 $m=5$ 이면 $n=121>100$ 이므로 $4$ 개이다.`}]},
{pts:10,area:'수학 · 원의 방정식',unit:'수학 도형의 방정식(원의 방정식, 원과 직선의 위치 관계)',
 intent:'원의 방정식을 표준형으로 고치고, 점과 직선 사이의 거리를 이용하여 현의 길이와 거리의 최솟값을 구할 수 있는지 평가한다.',
 body:R`원 $C:\ x^{2}+y^{2}-4x+2y-4=0$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`원 $C$ 의 중심의 좌표를 $(a,\ b)$, 반지름의 길이를 $r$ 라 할 때, $a+b+r$ 의 값을 구하시오.`,p:2.4,a:R`$4$`,e:R`$(x-2)^{2}+(y+1)^{2}=9$ 이므로 $a=2$, $b=-1$, $r=3$ 이다.`},
 {q:R`직선 $y=x+k$ 가 원 $C$ 와 만나서 생기는 현의 길이가 $2\sqrt7$ 일 때, 모든 상수 $k$ 의 값의 합을 구하시오.`,p:5.4,a:R`$-6$`,e:R`중심과 직선 사이의 거리는 $\sqrt{9-7}=\sqrt2$ 이다. 직선 $x-y+k=0$ 에 대하여 $\dfrac{|2+1+k|}{\sqrt2}=\sqrt2$ 에서 $|k+3|=2$, $k=-1$ 또는 $k=-5$ 이므로 합은 $-6$ 이다.`},
 {q:R`원 $C$ 위의 점과 점 $(5,\ 3)$ 사이의 거리의 최솟값을 구하시오.`,p:2.2,a:R`$2$`,e:R`중심 $(2,\ -1)$ 과 점 $(5,\ 3)$ 사이의 거리는 $\sqrt{9+16}=5$ 이므로 최솟값은 $5-3=2$ 이다.`}]},
{pts:8,area:'수학Ⅱ · 접선과 넓이',std:['12수학Ⅱ03-05'],unit:'수학Ⅱ 미분(접선의 방정식), 적분(넓이)',
 intent:'곡선 위의 점에서의 접선의 방정식을 구하고, 곡선과 접선으로 둘러싸인 부분의 넓이를 구할 수 있는지 평가한다.',
 body:R`곡선 $y=x^{3}-2x$ 위의 점 $(1,\ -1)$ 에서의 접선을 $l$ 이라 할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`직선 $l$ 의 $y$ 절편을 구하시오.`,p:2.6,a:R`$-2$`,e:R`$y'=3x^{2}-2$ 에서 기울기는 $1$ 이므로 $l:\ y=x-2$ 이다.`},
 {q:R`직선 $l$ 이 곡선과 다시 만나는 점의 $x$ 좌표를 구하시오.`,p:2.6,a:R`$-2$`,e:R`$x^{3}-2x=x-2$ 에서 $x^{3}-3x+2=(x-1)^{2}(x+2)=0$ 이므로 $x=-2$ 이다.`},
 {q:R`곡선과 직선 $l$ 로 둘러싸인 부분의 넓이를 구하시오.`,p:2.8,a:R`$\dfrac{27}{4}$`,e:R`$-2\le x\le1$ 에서 $(x-1)^{2}(x+2)\ge0$ 이므로 $$\int_{-2}^{1}(x^{3}-3x+2)\,dx=\Big[\frac{x^{4}}{4}-\frac{3x^{2}}{2}+2x\Big]_{-2}^{1}=\frac34-(-6)=\frac{27}{4}.$$`}]},
{pts:8,area:'미적분 · 부분적분법',std:['12미적02-05'],unit:'미적분 여러 가지 적분법(부분적분법)',
 intent:'정적분이 포함된 등식에서 정적분의 값이 상수임을 이용하여 함수를 결정할 수 있는지 평가한다.',
 body:R`함수 $f(x)$ 가 모든 실수 $x$ 에 대하여 $$f(x)=x\cos x+\int_{0}^{\frac\pi2}f(t)\,dt$$ 를 만족할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$\displaystyle\int_{0}^{\frac\pi2}x\cos x\,dx$ 의 값을 구하시오.`,p:1.8,a:R`$\dfrac\pi2-1$`,e:R`$\Big[x\sin x\Big]_{0}^{\frac\pi2}-\displaystyle\int_{0}^{\frac\pi2}\sin x\,dx=\frac\pi2-1$.`},
 {q:R`$\displaystyle\int_{0}^{\frac\pi2}f(t)\,dt$ 의 값을 구하시오.`,p:3.1,a:R`$-1$`,e:R`구하는 값을 $c$ 라 하면 $f(x)=x\cos x+c$ 이므로 $c=\left(\dfrac\pi2-1\right)+\dfrac\pi2c$, 즉 $c\left(1-\dfrac\pi2\right)=\dfrac\pi2-1$ 에서 $c=-1$ 이다.`},
 {q:R`$f(\pi)$ 의 값을 구하시오.`,p:3.1,a:R`$-\pi-1$`,e:R`$f(x)=x\cos x-1$ 이므로 $f(\pi)=-\pi-1$ 이다.`}]}
],
K:[
{pts:10,area:'국어·독서 + 수필',std:['10국03-01','12독서02-05'],
 intent:'꿀벌의 의사소통을 다룬 설명문과 수필을 함께 읽고, 구체적인 상황과 맥락을 고려하여 글의 의미를 구성한다.',
 body:[
 {label:'(가)',text:R`꿀벌은 꽃밭을 찾으면 벌집으로 돌아와 동료들에게 그 위치를 춤으로 알린다. 동물학자 프리슈가 밝혀낸 이 춤에는 두 가지가 있다. 먹이가 벌집 가까이에 있으면 벌은 제자리에서 둥글게 도는 원형 춤을 춘다. 이 춤은 가까이에 먹이가 있으니 찾아보라는 뜻일 뿐 방향을 알려 주지는 않는다. 먹이가 멀리 있으면 벌은 8자 모양을 그리며 도는데, 8자의 가운데 직선 구간을 지날 때 배를 좌우로 빠르게 떤다. 이 직선 구간이 정보를 담고 있다. 벌집의 수직 벽면에서 직선 구간이 똑바로 위를 향하면 먹이가 태양이 있는 방향에 있다는 뜻이고, 위쪽에서 오른쪽으로 60도 기울어 있으면 태양의 방향에서 오른쪽으로 60도 되는 방향에 먹이가 있다는 뜻이다. 그리고 배를 떨며 직선 구간을 지나는 시간이 길수록 먹이는 멀리 있다. 동료 벌들은 춤추는 벌을 더듬이로 만지며 따라 돈 뒤, 한 번도 가 본 적 없는 꽃밭으로 곧장 날아간다. 한 마리가 찾아낸 것이 춤을 거쳐 무리 전체의 ( ㉠ )이/가 된다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`대학 시절 우리 연구실에는 ‘실패 공책’이 있었다. 실험이 실패하면 누구든 무엇을 어떻게 하다가 왜 안 되었는지를 적어 두는 공책이었다. 처음에 나는 내 실패를 남에게 보이는 것이 부끄러워 ㉡<u>혼자만 알고 넘어가려 했다.</u> 선배가 말했다. “네가 적지 않으면 내년에 누군가 똑같은 자리에서 똑같이 넘어진다.” 그 말을 듣고 나는 처음으로 공책을 폈다. 몇 달 뒤 후배 하나가 내 기록 덕분에 한 달을 아꼈다며 고마워했다. 그때 알았다. 한 사람이 겪은 일은 나누어질 때 비로소 모두의 지식이 된다. ㉢<u>연구실의 공책은 우리의 춤이었다.</u>`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 들어갈 적절한 2음절의 단어를 (나)에서 찾아 쓰시오.',p:2.5,a:'지식',r:'‘지식’을 정확히 기재하면 정답',e:'(나)의 “나누어질 때 비로소 모두의 지식이 된다.”와 같은 구조의 문장이다.'},
 {q:'8자 춤에서 먹이까지의 거리를 알려 주는 것은 무엇인지 (가)를 바탕으로 20자 내외로 쓰시오.',p:3.1,a:'배를 떨며 직선 구간을 지나는 시간의 길이',r:'‘직선 구간을 지나는 시간(의 길이)’이라는 내용을 쓰면 정답',e:'직선 구간의 방향은 먹이의 방향을, 직선 구간을 지나는 시간은 먹이까지의 거리를 알려 준다.'},
 {q:'(가)를 참고하여 ㉢의 의미가 무엇인지 한 문장으로 쓰시오.',p:4.4,a:'꿀벌의 춤이 한 마리가 찾은 먹이의 위치를 무리 전체에 알리듯이, 실패 공책은 한 사람이 겪은 일을 연구실 모두의 지식으로 만들어 주었다는 뜻이다.',r:'‘꿀벌의 춤이 개체의 발견을 무리 전체와 나누는 수단이듯, 공책도 개인의 경험을 모두의 지식으로 나누는 수단이었다’는 내용의 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'(가)에서 춤은 개체의 발견을 무리 전체의 것으로 만드는 수단이다. (나)의 공책도 ㉡과 달리 경험을 나누는 수단이라는 점에서 ‘춤’에 빗대었다.'}]},
{pts:10,area:'국어·독서(과학·기술)',std:['12독서02-02','12독서03-03'],
 intent:'런 길이 부호화의 원리와 한계를 이해하고, 지문의 규칙을 적용하여 값을 추론한다.',
 body:[{text:R`그림 파일은 수많은 점의 색을 차례로 적은 것이다. 흑백 그림이라면 흰 점을 W, 검은 점을 B로 적을 수 있다. 그런데 그림에는 같은 색이 길게 이어지는 부분이 많다. 런 길이 부호화는 이 점을 이용한 압축 방법이다. 같은 값이 연달아 나오는 구간을 ‘런’이라 하는데, 런마다 값을 일일이 되풀이해 적는 대신 ‘되풀이 횟수와 값’의 쌍으로 적는다. 예를 들어 WWWWWWBBBWWWW는 13글자이지만 6W3B4W로 적으면 6글자가 된다. 받는 쪽은 이 부호를 차례로 풀어 원래의 열을 한 글자도 틀리지 않게 되살릴 수 있다. 이처럼 원래의 정보를 조금도 잃지 않는 압축을 무손실 압축이라 한다.

이 방법이 늘 유리한 것은 아니다. 압축의 효과는 런의 길이에 달려 있다. 같은 값이 길게 이어지는 문서나 도면, 만화 같은 그림에서는 크기가 크게 줄어든다. 그러나 WBWBWB처럼 값이 한 칸마다 바뀌는 자료를 이 방법으로 적으면 1W1B1W1B1W1B가 되어 (㉠                    ). 이웃한 점들의 색이 조금씩 다 다른 사진이 그러한 경우이다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 들어갈 적절한 말을 20자 내외로 쓰시오.',p:4.3,a:'압축하기 전보다 오히려 길이가 늘어난다.',r:'‘원래보다 오히려 길어진다(크기가 커진다)’는 내용을 정확히 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'WBWBWB는 6글자인데 1W1B1W1B1W1B는 12글자이다. 런의 길이가 1이면 부호가 원래보다 길어진다.'},
 {q:'&lt;보기&gt;의 빈칸에 들어갈 적절한 말을 윗글에서 찾아 쓰시오.',p:2.5,box:'런 길이 부호화는 압축을 풀었을 때 원래의 정보가 그대로 되살아나므로 (        ) 압축에 속한다.',a:'무손실',r:'‘무손실’을 정확히 기재하면 정답',e:'첫째 문단의 마지막 문장에서 확인할 수 있다.'},
 {q:'윗글을 바탕으로 다음 표의 ⓐ, ⓑ, ⓒ, ⓓ에 들어갈 내용을 쓰시오. (부호의 글자 수를 셀 때 숫자 한 자리와 문자 하나를 각각 한 글자로 센다.)',p:3.2,table:{head:['주어진 것','구하는 것'],rows:[['원래의 열 BBBBBWWBBB','부호 ⓐ'],['부호 4W1B7W','원래 열의 글자 수 ⓑ'],['W가 12번 이어진 열','부호의 글자 수 ⓒ'],['원래의 열 WBBW','부호의 글자 수 ⓓ']]},a:'ⓐ 5B2W3B, ⓑ 12, ⓒ 3, ⓓ 6',r:'예시 답안을 정확히 기재하면 정답. 각각의 항목별로 부분 점수 0.8점을 부여할 수 있음',e:'ⓐ B 5번, W 2번, B 3번이므로 5B2W3B. ⓑ 4+1+7=12. ⓒ 부호는 12W이므로 3글자. ⓓ 부호는 1W2B1W이므로 6글자.'}]}
]}
});

SETS.push({
id:5,
hum:{K:[
{pts:11.5,area:'국어·문법 + 수필',std:['10국05-01','10국03-01'],
 intent:'새말을 다룬 두 글을 읽고, 단어의 짜임을 이해하여 단어를 형성 방식에 따라 분류한다.',
 body:[
 {label:'(가)',text:R`저녁상을 물리고 나서 할머니께 요즘은 혼자 밥 먹는 것을 ‘혼밥’이라 부른다고 말씀드렸다. 할머니는 고개를 저으며 세상에 없던 말이 자꾸 생겨 알아듣기 어렵다고 하셨다. 그러다 문득 웃으시며, 당신이 젊었을 때에는 ‘㉠<u>풋사과</u>’ 같은 말도 누군가에게는 새말이었을 것이라고 하셨다. 덜 익은 것을 가리키는 ‘풋-’을 사과 앞에 붙였을 뿐이니 처음 들은 사람도 곧 알아들었으리라는 것이다. 마을 앞 개울에 놓인 ‘㉡<u>돌다리</u>’도 그렇다. ‘돌’과 ‘다리’를 모르는 사람은 없으니, 둘을 이어 놓은 말을 모를 사람도 없다. 생각해 보면 ‘혼밥’도 ‘혼자’와 ‘밥’에서 온 말이다. 새말은 낯선 얼굴을 하고 있지만 그 뼈대는 오래된 것이다. 할머니는 그날 밤 ‘혼밥’이라는 말을 몇 번이나 소리 내어 되뇌셨다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`단어는 그 짜임에 따라 나눌 수 있다. 단어에서 실질적인 뜻을 나타내는 중심 부분을 어근이라 하고, 어근에 붙어 뜻을 더하거나 제한하는 부분을 접사라 한다. 접사는 홀로 쓰이지 못한다. ‘하늘’, ‘밥’처럼 하나의 어근으로만 이루어진 단어를 단일어라 하고, 둘 이상의 요소가 결합한 단어를 복합어라 한다. 복합어는 다시 둘로 나뉜다. ‘밤낮’, ‘책가방’처럼 어근과 어근이 결합한 단어는 합성어이고, ‘맨손’, ‘나무꾼’처럼 어근에 접사가 결합한 단어는 파생어이다. ‘맨-’처럼 어근의 앞에 붙는 접사를 접두사, ‘-꾼’처럼 어근의 뒤에 붙는 접사를 접미사라 한다. 새말은 무(無)에서 생겨나지 않는다. 새로운 대상이나 개념이 나타나면 사람들은 대개 이미 있는 말을 재료로 삼아, 이미 있는 방식으로 새 단어를 만든다. 그래서 처음 듣는 말도 그 짜임을 헤아리면 뜻을 짐작할 수 있다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'(가)와 (나)를 &lt;보기&gt;와 같이 요약할 때, ⓐ와 ⓑ에 들어갈 단어를 각각 (가)와 (나)에서 찾아 쓰시오.',p:3.2,box:'두 글은 새말이 만들어지는 방식을 다룬다. (가)는 새말이 낯설어 보여도 그 ( ⓐ )은/는 오래된 것임을, (나)는 새말이 이미 있는 말을 ( ⓑ )(으)로 삼아 만들어짐을 말한다.',a:'ⓐ 뼈대, ⓑ 재료',r:'ⓐ: 뼈대 - 1.6점, ⓑ: 재료 - 1.6점',e:'(가)의 “새말은 낯선 얼굴을 하고 있지만 그 뼈대는 오래된 것이다.”, (나)의 “이미 있는 말을 재료로 삼아”에서 확인할 수 있다.'},
 {q:'(나)를 바탕으로 ㉠과 ㉡의 짜임이 어떻게 다른지 한 문장으로 쓰시오.',p:4.2,a:'㉠은 접두사 ‘풋-’과 어근 ‘사과’가 결합한 파생어이고, ㉡은 어근 ‘돌’과 어근 ‘다리’가 결합한 합성어이다.',r:'‘㉠은 접사(접두사)와 어근이 결합한 파생어, ㉡은 어근과 어근이 결합한 합성어’라는 의미의 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'‘풋-’은 ‘덜 익은’의 뜻을 더하는 접두사로 홀로 쓰이지 못한다. ‘돌’과 ‘다리’는 각각 홀로 쓰이는 어근이다.'},
 {q:'&lt;보기&gt;의 단어 가운데 (나)의 분류에 따른 파생어를 모두 찾아 쓰시오.',p:4.1,box:'손수건, 맨발, 봄비, 사냥꾼, 논밭',a:'맨발, 사냥꾼',r:'‘맨발’, ‘사냥꾼’ 두 단어만을 정확히 기재하면 정답',e:'‘맨발’은 접두사 ‘맨-’+어근 ‘발’, ‘사냥꾼’은 어근 ‘사냥’+접미사 ‘-꾼’으로 이루어진 파생어이다. ‘손수건’, ‘봄비’, ‘논밭’은 어근끼리 결합한 합성어이다.'}]},

{pts:9.0,area:'국어·고전 수필',std:['10국05-01','12독서01-01'],
 intent:'허균의 「호민론」에 나타난 백성에 대한 인식을 사실적·추론적으로 이해하고 다른 글과 관련지어 읽는다.',
 body:[{text:R`천하에 두려워할 만한 것은 오직 백성뿐이다. 백성은 홍수나 화재, 호랑이나 표범보다도 더 두렵다. 그런데도 윗자리에 있는 사람들이 백성을 함부로 업신여기며 모질게 부려 먹는 것은 어째서인가.

이미 이루어진 것만을 함께 즐기며 늘 눈앞의 일에 얽매여, 순순히 법을 받들고 윗사람에게 부림을 당하는 사람들은 항민(恒民)이다. 항민은 두려워할 것이 없다. 모질게 빼앗겨 살이 벗겨지고 뼈가 부서지도록 집안의 수입과 땅에서 나는 것을 다 바쳐 끝없는 요구를 대느라 시름하고 탄식하며 윗사람을 탓하는 사람들은 원민(怨民)이다. 원민도 반드시 두려운 것은 아니다. 자취를 푸줏간 속에 숨기고 남모르게 딴마음을 품고서 세상을 흘겨보다가, 때에 변고가 생기면 제 바람을 이루려는 사람들은 호민(豪民)이다. 호민이야말로 몹시 두려워해야 할 존재이다.

호민이 나라의 틈을 엿보고 일의 형세가 탈 만한가를 살피다가 팔을 휘두르며 밭두렁 위에서 한 번 소리치면, 원민은 그 소리만 듣고도 모여들어 의논하지 않고도 함께 외친다. 항민 또한 살길을 찾아 호미와 고무래와 창 자루를 들고 따라나서 무도한 자들을 친다.

㉡<u>하늘이 임금을 세운 것은 백성을 기르게 하려는 것이지</u>, 한 사람이 윗자리에서 방자하게 눈을 부릅뜨고 골짜기 같은 욕심을 채우게 하려는 것이 아니다.`,src:'허균, 「호민론(豪民論)」 (한문 원전의 일부를 현대어로 풀어 씀)'}],
 qs:[
 {q:'&lt;보기&gt;의 ㉠에 들어갈 말을 윗글에서 찾아 쓰시오.',p:4.2,box:'글쓴이는 백성을 세 부류로 나눈다. 그 가운데 평소에는 몸을 숨기고 있다가 나라의 틈을 엿보아 앞장서 일어나는 ( ㉠ )을/를 가장 두려워해야 할 존재로 꼽는다.',a:'호민',r:'‘호민’을 정확히 기재하면 정답',e:'둘째 문단에서 항민과 원민은 두렵지 않으나 “호민이야말로 몹시 두려워해야 할 존재”라고 하였다.'},
 {q:'㉡에 담긴 생각을 나타내기에 가장 적합한 한 단어를 &lt;보기&gt;에서 찾아 쓰시오.',p:4.8,box:'옛 정치사상에서는 나라의 근본이 백성에게 있다고 보았다. 임금의 자리는 백성을 위해 마련된 것이므로, 임금은 백성의 삶을 편안하게 하는 일을 정치의 으뜸으로 삼아야 한다. 백성을 나라의 뿌리로 여기는 이러한 생각을 민본이라 한다.',a:'민본',r:'‘민본’을 정확히 기재하면 정답',e:'㉡은 임금이 백성을 기르기 위해 세워진 존재라는 뜻이다. 이는 <보기>에서 백성을 나라의 근본으로 여기는 생각이라 한 ‘민본’에 해당한다.'}]},

{pts:9.5,area:'국어·독서(사회)',std:['12독서03-02','12독서02-05'],
 intent:'무역의 원리를 다룬 글을 읽고, 절대 우위와 비교 우위의 개념을 구분하여 사례에 적용한다.',
 body:[{text:R`나라와 나라가 물건을 사고파는 까닭은 무엇일까. 가장 쉽게 떠올릴 수 있는 답은 생산비의 차이이다. 어떤 재화를 다른 나라보다 더 적은 비용으로 생산할 수 있을 때 그 나라는 그 재화에 절대 우위가 있다고 한다. 두 나라가 저마다 절대 우위가 있는 재화를 만들어 맞바꾸면 둘 다 이익을 얻는다.

그렇다면 모든 재화를 다른 나라보다 싸게 만드는 나라는 무역을 할 까닭이 없을까. 그렇지 않다. 이를 이해하려면 기회비용을 알아야 한다. 기회비용이란 어떤 것을 선택함으로써 포기해야 하는 것의 가치이다. 한 나라의 노동과 자원은 한정되어 있으므로 옷을 한 벌 더 만들려면 그만큼 쌀을 덜 만들어야 한다. 이때 포기한 쌀의 양이 옷 한 벌의 기회비용이다. 어떤 재화를 다른 나라보다 더 작은 기회비용으로 생산할 수 있을 때 그 나라는 그 재화에 비교 우위가 있다고 한다.

절대 우위는 한 나라가 모든 재화에서 다 가질 수도 있지만, 비교 우위는 그럴 수 없다. 한 재화의 기회비용이 상대국보다 작으면 다른 재화의 기회비용은 반드시 상대국보다 크기 때문이다. 그러므로 ㉠<u>모든 재화에 절대 우위가 있는 나라도 무역을 통해 이익을 얻을 수 있다.</u> 이것이 비교 우위에 따른 무역의 원리이다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'&lt;보기&gt;의 ⓐ, ⓑ에 들어갈 말을 윗글에서 찾아 순서대로 쓰시오.',p:2.0,box:'생산에 드는 비용 자체가 상대국보다 적을 때에는 ( ⓐ ) 우위가, 생산을 위해 포기해야 하는 다른 재화의 양이 상대국보다 적을 때에는 ( ⓑ ) 우위가 있다고 한다.',a:'ⓐ 절대, ⓑ 비교',r:'ⓐ와 ⓑ를 정확히 써야 정답. ⓐ, ⓑ 각각 1.0점',e:'첫째 문단과 둘째 문단의 정의에서 확인할 수 있다.'},
 {q:'윗글을 바탕으로 ㉠의 까닭을 한 문장으로 쓰시오.',p:4.5,a:'두 나라가 각각 기회비용이 더 작은(비교 우위가 있는) 재화를 생산하여 서로 교환하면 두 나라 모두 이익을 얻기 때문이다.',r:'‘각 나라가 비교 우위가 있는(기회비용이 더 작은) 재화에 특화하여 교환하면 모두 이익을 얻는다’는 의미의 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'모든 재화에 절대 우위가 있더라도 비교 우위는 모든 재화에서 가질 수 없다. 따라서 각자 비교 우위가 있는 재화가 반드시 있고, 그것에 집중하여 교환하면 서로 이익이 된다.'},
 {q:'다음은 갑국과 을국이 옷 1벌과 쌀 1포대를 생산하는 데 드는 노동 시간이다. 윗글을 바탕으로 &lt;보기&gt;의 ⓐ, ⓑ에 들어갈 내용을 쓰시오. (단, 두 나라는 노동만으로 두 재화를 생산한다.)',p:3.0,tfirst:true,table:{head:['','옷 1벌','쌀 1포대'],rows:[['갑국','2시간','4시간'],['을국','6시간','6시간']]},box:'갑국에서 옷 1벌을 더 만들기 위해 포기해야 하는 쌀은 ( ⓐ )포대이다. 한편 을국은 두 재화 가운데 ( ⓑ )에 비교 우위가 있다.',a:'ⓐ 1/2(0.5), ⓑ 쌀',r:'ⓐ: 1/2(0.5) - 1.5점, ⓑ: 쌀 - 1.5점',e:'갑국에서 옷 1벌에 드는 2시간으로는 쌀 2/4=1/2포대를 만들 수 있다. 을국의 옷 1벌의 기회비용은 쌀 1포대이므로 옷은 갑국이 비교 우위에 있다. 쌀 1포대의 기회비용은 갑국이 옷 2벌, 을국이 옷 1벌이므로 쌀은 을국이 비교 우위에 있다.'}]},

{pts:9.0,area:'국어·독서(인문 + 사회)',std:['12독서01-02','12독서02-01'],
 intent:'정보를 받아들이는 방식의 치우침을 다룬 두 글을 주제 통합적으로 읽고, 개념을 구체적 사례에 적용한다.',
 body:[
 {label:'(가)',text:R`사람은 자신의 신념에 들어맞는 정보는 쉽게 받아들이고 어긋나는 정보는 외면하는 경향이 있다. 심리학에서는 이를 확증 편향이라 한다. 확증 편향은 정보를 다루는 여러 단계에서 나타난다. 먼저 정보를 찾는 단계에서는 자기 생각을 뒷받침해 줄 만한 자료만 골라서 접하는 선택적 노출이 일어난다. 다음으로 정보를 받아들이는 단계에서는 같은 증거를 보고도 자기 생각에 유리한 쪽으로 풀이하는 편향된 해석이 일어난다. 마지막으로 정보를 떠올리는 단계에서는 자기 생각과 맞았던 일은 또렷이 떠올리고 맞지 않았던 일은 잊어버리는 선택적 기억이 일어난다. 이 세 단계를 거치는 동안 처음의 생각은 검증되기는커녕 더욱 굳어진다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`인터넷 서비스는 이용자가 무엇을 찾아보고 무엇에 오래 머물렀는지를 기록하고, 이를 바탕으로 이용자가 좋아할 만한 정보를 골라 먼저 보여 준다. 이용자에게는 편리한 일이다. 그러나 그 결과 이용자는 자신의 신념과 취향에 맞게 걸러진 정보에만 둘러싸이게 된다. 마치 투명한 막 안에 갇힌 것과 같다고 하여 이를 필터 버블이라 부른다. 필터 버블이 무서운 까닭은 걸러졌다는 사실 자체를 이용자가 알기 어렵다는 데 있다. 사람들은 자기가 보는 화면이 세상의 전부라고 여기기 쉽고, 생각이 다른 사람들과 마주칠 기회는 점점 줄어든다. 공동의 문제를 함께 논의해야 하는 사회에서 이것은 가볍지 않은 위험이다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'&lt;보기&gt;의 빈칸에 공통으로 들어갈 한 단어를 (가)와 (나)에서 찾아 쓰시오.',p:2.7,box:'(가)는 사람이 스스로 자신의 (     )에 맞는 정보만 받아들이는 심리적 경향을, (나)는 기술이 이용자의 (     )에 맞는 정보만 걸러서 보여 주는 현상을 다룬다.',a:'신념',r:'‘신념’을 정확히 기재하면 정답',e:'(가)의 “자신의 신념에 들어맞는 정보”, (나)의 “자신의 신념과 취향에 맞게 걸러진 정보”에 공통으로 쓰인 단어이다.'},
 {q:'다음 ⓐ, ⓑ, ⓒ에 들어갈 말을 (가)에 쓰인 표현으로 쓰시오.',p:6.3,box:'&lt;탐구 활동&gt; 국민이는 (가)를 읽고 주변의 사례를 다음과 같이 정리해 보았다.',table:{head:['사례','해당하는 개념'],rows:[['혈액형과 성격이 관련 있다고 믿는 사람이, 자기 생각과 맞아떨어졌던 친구들의 경우만 떠올린다.','( ⓐ )'],['어떤 건강식품의 효능을 믿는 사람이, 효능을 칭찬하는 글만 찾아 읽는다.','( ⓑ )'],['응원하는 팀과 상대 팀이 똑같은 반칙을 했는데, 응원하는 팀의 반칙은 실수로, 상대 팀의 반칙은 고의로 받아들인다.','( ⓒ )']]},a:'ⓐ 선택적 기억, ⓑ 선택적 노출, ⓒ 편향된 해석',r:'ⓐ, ⓑ, ⓒ를 정확히 써야 정답. 각각의 항목별로 부분 점수 2.1점을 부여할 수 있음',e:'ⓐ는 떠올리는 단계, ⓑ는 정보를 찾는 단계, ⓒ는 같은 증거를 유리하게 풀이하는 받아들이는 단계의 편향이다.'}]},

{pts:9.5,area:'국어·독서(과학)',std:['12독서03-03','12독서02-01'],
 intent:'지진파의 성질을 설명한 글을 읽고, 원리를 사실적으로 이해하여 새로운 상황에 적용한다.',
 body:[{text:R`땅속에서 지진이 일어난 곳을 진원이라 한다. 진원에서 생긴 흔들림은 지진파가 되어 사방으로 퍼져 나간다. 지구 내부를 통과하는 지진파에는 P파와 S파가 있다. P파는 매질이 파의 진행 방향과 나란하게 진동하는 파동으로, 고체, 액체, 기체를 모두 통과한다. S파는 매질이 파의 진행 방향과 수직으로 진동하는 파동으로, 고체만 통과할 수 있다. 속도는 P파가 S파보다 빠르다. 그래서 관측소에는 언제나 P파가 먼저 도착하고 S파가 나중에 도착한다. P파가 도착한 뒤 S파가 도착할 때까지의 시간을 PS시라 하는데, 진원에서 멀수록 두 파의 도착 시각이 더 벌어지므로 PS시가 길어진다. 따라서 PS시를 재면 진원까지의 거리를 알 수 있다.

지진파는 사람이 들어가 볼 수 없는 지구 내부를 알려 주는 창이기도 하다. 큰 지진이 일어나면 세계 곳곳의 관측소에 지진파가 기록되는데, 진원의 지구 반대편에 가까운 넓은 지역에는 S파가 도달하지 않는다. 과학자들은 이 사실을 근거로 ㉠<u>지구 내부의 외핵이 액체 상태라고 추정하였다.</u>

두 지진파의 속도 차이는 피해를 줄이는 데에도 쓰인다. 흔들림이 크고 피해를 많이 주는 것은 주로 S파이다. 진원 가까이에 있는 관측소가 먼저 도착한 P파를 탐지하여 곧바로 알리면, 멀리 있는 지역에서는 S파가 도착하기 전에 대피할 시간을 얼마간 벌 수 있다. 지진 조기 경보는 이 원리를 이용한다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'&lt;보기&gt;의 빈칸에 들어갈 적절한 말을 윗글에서 찾아 쓰시오.',p:2.1,box:'같은 지진을 두 관측소에서 기록하였을 때, (        )이/가 더 길게 기록된 관측소가 진원에서 더 멀리 떨어져 있다.',a:'PS시',r:'‘PS시’를 정확히 기재하면 정답',e:'첫째 문단에서 진원에서 멀수록 PS시가 길어진다고 하였다.'},
 {q:'윗글에서 근거를 찾아 과학자들이 ㉠과 같이 추정한 까닭을 한 문장으로 쓰시오.',p:5.2,a:'S파는 고체만 통과할 수 있는데, 외핵을 지나야 닿을 수 있는 진원 반대편 지역에는 S파가 도달하지 않기 때문이다.',r:'‘S파는 고체만 통과한다’는 내용과 ‘진원 반대편에 S파가 도달하지 않는다(S파가 외핵을 통과하지 못한다)’는 내용을 모두 포함하면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'S파가 통과하지 못하는 부분이 지구 내부에 있다는 것은 그 부분이 고체가 아니라는 뜻이다.'},
 {q:'&lt;보기&gt;의 빈칸에 들어갈 수를 쓰시오.',p:2.2,box:'어떤 지진에서 P파의 속도는 8 km/s, S파의 속도는 4 km/s로 일정하였다. 한 관측소에서 잰 PS시가 10초였다면, 진원에서 이 관측소까지의 거리는 (        ) km이다.',a:'80',r:'‘80’을 정확히 기재하면 정답',e:'거리를 d km라 하면 S파가 걸린 시간 d/4초와 P파가 걸린 시간 d/8초의 차가 10초이다. d/4 − d/8 = d/8 = 10이므로 d = 80이다.'}]},

{pts:9.5,area:'국어·독서(인문) + 현대시',std:['12문학02-03','12독서02-02'],
 intent:'시간에 대한 인문학적 이해를 바탕으로 문학 작품에 형상화된 화자의 성찰과 결단을 해석한다.',
 body:[
 {label:'(가)',text:R`고대 그리스 사람들은 시간을 두 가지 이름으로 불렀다. 하나는 크로노스이다. 크로노스는 과거에서 미래로 한결같이 흘러가는 시간, 시계와 달력으로 잴 수 있는 시간이다. 누구에게나 같은 빠르기로 주어지고, 붙잡을 수 없이 지나간다. 다른 하나는 카이로스이다. 카이로스는 길이로 잴 수 없는 시간, 의미로 채워지는 시간이다. 사람이 자신을 깊이 돌아보고 새롭게 결단하는 순간, 무심히 흘러가던 시간은 문득 멈추어 서고 삶은 그 이전과 이후로 나뉜다. 같은 하룻밤이라도 누군가에게는 그저 지나가는 몇 시간이지만, 누군가에게는 평생을 바꾸는 시간이 된다. 크로노스가 사람에게 주어지는 시간이라면 카이로스는 사람이 만들어 내는 시간이다.`,src:'자체 집필 지문'},
 {label:'(나)',verse:true,text:R`창밖에 밤비가 속살거려
육첩방은 남의 나라,

시인이란 슬픈 천명인 줄 알면서도
한 줄 시를 적어 볼까,

땀내와 사랑내 포근히 품긴
보내 주신 학비 봉투를 받아

대학 노트를 끼고
늙은 교수의 강의 들으러 간다.

생각해 보면 어린 때 동무를
하나, 둘, 죄다 잃어버리고

나는 무얼 바라
나는 다만, 홀로 침전하는 것일까?

인생은 살기 어렵다는데
시가 이렇게 쉽게 씌어지는 것은
부끄러운 일이다.

육첩방은 남의 나라
창밖에 밤비가 속살거리는데,

등불을 밝혀 어둠을 조금 내몰고,
㉠<u>시대처럼 올 아침을 기다리는 최후의 나,</u>

나는 나에게 작은 손을 내밀어
㉡<u>눈물과 위안으로 잡는 최초의 악수.</u>`,src:'윤동주, 「쉽게 씌어진 시」'}],
 qs:[
 {q:'(가)를 바탕으로 (나)를 감상한 &lt;보기&gt;의 빈칸에 들어갈 말을 (가)에서 찾아 쓰시오.',p:3.7,box:'㉠에서 화자가 등불을 밝히고 아침을 기다리는 밤은 시계로 잴 수 있는 몇 시간에 그치지 않는다. 부끄러움 속에서 자신을 돌아보고 새로운 삶을 다짐하는 이 밤은 화자에게 (        )의 시간이다.',a:'카이로스',r:'‘카이로스’를 정확히 기재하면 정답',e:'(가)에서 자신을 깊이 돌아보고 새롭게 결단하는, 의미로 채워지는 시간을 카이로스라 하였다.'},
 {q:'(가)의 관점에서 ㉡이 화자에게 지니는 의미를 한 문장으로 쓰시오.',p:5.8,a:'부끄러운 현실의 자신을 돌아본 화자가 내면의 자신과 화해하며 새롭게 살아가기로 결단하는 순간이다.',r:'‘자기 성찰을 거쳐 내면의 자아와 화해한다’는 내용과 ‘새롭게 결단하는(삶이 달라지는) 순간이다’라는 내용을 모두 포함하면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'‘나는 나에게’ 손을 내미는 악수는 현실에 안주하던 나와 그것을 부끄러워하는 나의 화해이다. ‘최초’라는 말은 이 순간이 삶을 이전과 이후로 나누는 새로운 출발임을 보여 주며, 이는 (가)의 카이로스에 해당한다.'}]},

{pts:10,area:'국어·독서(예술)',std:['12독서02-01','12독서02-02'],
 intent:'인상주의 회화의 색채 원리를 설명한 글을 읽고, 핵심 개념을 정리하여 구체적 작품에 적용한다.',
 body:[{text:R`19세기 중반까지 서양의 화가들은 사물마다 본래 정해진 색이 있다고 믿었다. 풀은 초록, 하늘은 파랑, 그늘은 어두운 갈색이나 검정이라는 식이다. 이렇게 사물이 본래 지닌다고 여겨진 색을 고유색이라 한다. 화가들은 화실 안에서 고유색을 칠하고, 거기에 밝고 어두움의 단계를 더하여 사물의 입체감을 나타냈다.

인상주의 화가들은 화실 밖으로 나가 이 믿음을 뒤집었다. 야외에서 본 사물의 색은 햇빛의 세기와 방향, 시각과 날씨에 따라 끊임없이 달라졌다. 눈 위에 드리운 그늘은 검지 않고 푸르스름했다. 이들에게 색은 사물에 붙박인 것이 아니라 빛이 만들어 내는 순간의 인상이었다. 문제는 물감이었다. 물감은 섞을수록 어둡고 탁해져서 햇빛의 밝음을 옮기기 어려웠다. 그래서 이들은 물감을 팔레트에서 섞지 않고, 순수한 색의 짧은 붓질을 화면에 나란히 놓았다. 조금 떨어져서 보면 이웃한 색들이 보는 이의 눈에서 섞여 한층 밝고 생생한 색으로 느껴진다. 이를 병치 혼합이라 한다.

이 원리를 더욱 엄격하게 밀고 나간 이들이 신인상주의 화가들이다. 이들은 붓질 대신 순수한 색의 작은 점을 화면 가득 규칙적으로 찍어 형태와 색을 나타냈는데, 이 기법을 점묘법이라 한다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'윗글의 내용을 정리한 다음 표의 ⓐ, ⓑ, ⓒ에 들어갈 말을 윗글에서 찾아 쓰시오.',p:4.5,table:{head:['구분','핵심 개념','내용'],rows:[['인상주의 이전의 회화','( ⓐ )','사물이 본래 지닌다고 여겨진 색'],['인상주의','( ⓑ )','순수한 색을 화면에 나란히 놓아 보는 이의 눈에서 섞이게 함'],['신인상주의','( ⓒ )','순수한 색의 작은 점을 규칙적으로 찍어 형태와 색을 나타냄']]},a:'ⓐ 고유색, ⓑ 병치 혼합, ⓒ 점묘법',r:'ⓐ, ⓑ, ⓒ를 정확히 써야 정답. 각각의 항목별로 부분 점수 1.5점을 부여할 수 있음',e:'첫째, 둘째, 셋째 문단에서 각각 확인할 수 있다.'},
 {q:'윗글을 바탕으로 &lt;보기&gt;의 화가가 같은 대상을 여러 번 그린 까닭을 한 문장으로 쓰시오.',p:5.5,box:'인상주의 화가 모네는 루앙 대성당의 맞은편에 방을 얻어 놓고, 같은 자리에서 본 성당의 정면을 수십 점의 그림으로 남겼다. 아침에 그린 성당은 푸른빛이 감돌고, 한낮의 성당은 누렇게 빛나며, 해 질 무렵의 성당은 붉게 물들어 있다.',a:'사물의 색은 고정된 것이 아니라 빛에 따라 달라진다고 보고, 시각과 날씨에 따라 변하는 빛과 색의 순간적인 인상을 담아내려 했기 때문이다.',r:'‘색은 사물에 고정된 것이 아니라 빛에 따라 달라진다’는 내용과 ‘그때그때 달라지는 빛(색)의 인상을 그리려 했다’는 내용을 모두 포함하면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'둘째 문단에서 인상주의 화가들에게 색은 “빛이 만들어 내는 순간의 인상”이라고 하였다. 같은 성당도 시각에 따라 다른 색으로 보이므로 그 각각이 서로 다른 그림의 대상이 된다.'}]},

{pts:12,area:'국어·독서(인문) + 고전 시가',std:['12독서02-03','12문학01-01'],
 intent:'자연물에서 삶의 가치를 읽어 내는 인문학적 사유를 이해하고, 같은 제재가 고전 시가에서 다르게 형상화됨을 비교하여 감상한다.',
 body:[
 {label:'(가)',text:R`옛사람들은 자연물을 바라보며 사람이 살아가야 할 길을 물었다. 노자가 눈여겨본 것은 물이었다. 『도덕경』에는 “가장 좋은 것은 물과 같다. 물은 만물을 이롭게 하면서도 다투지 않고, 뭇사람이 싫어하는 낮은 곳에 머문다.”라는 구절이 있다. 사람들은 저마다 높은 곳에 오르려 하지만 물은 언제나 아래로 흐른다. 노자는 강과 바다가 온갖 골짜기의 물을 받아들이는 왕이 될 수 있는 것도 스스로 낮은 곳에 있기 때문이라고 하였다. 물은 또한 부드럽다. 네모난 그릇에 담기면 네모가 되고 둥근 그릇에 담기면 둥글어진다. 그러나 노자는 “천하에 물보다 부드럽고 약한 것이 없지만, 굳세고 강한 것을 치는 데에는 물을 이길 것이 없다.”라고 하였다. 한 방울씩 떨어지는 물이 끝내 바위를 뚫는다. 노자는 이처럼 부드럽고 약한 것이 지닌 힘을 유약(柔弱)이라 부르며 높이 샀다. 그러나 같은 물이라도 바라보는 이에 따라 전혀 다른 뜻을 띤다. 우리 옛 시가에서 흐르는 물은 흔히 한번 가면 돌아오지 않는 세월과 인생에 견주어졌다.`,src:'자체 집필 지문 (인용문은 『도덕경』의 구절을 풀어 씀)'},
 {label:'(나)',verse:true,text:R`청산리(靑山裏) 벽계수(碧溪水)야 수이 감을 자랑 마라
㉠<u>일도창해(一到滄海)하면 돌아오기 어려우니</u>
명월(明月)이 만공산(滿空山)하니 쉬어 간들 어떠리

* 수이: 쉽게, 빨리.
* 일도창해: 한번 넓고 푸른 바다에 이름.
* 만공산: 텅 빈 산에 가득함.`,src:'황진이의 시조 (현대어 표기로 옮김)'}],
 qs:[
 {q:'&lt;보기&gt;의 빈칸에 들어갈 말을 (가)에서 찾아 한 단어로 쓰시오.',p:3.9,box:'노자는 물이 그릇의 모양에 따라 제 모습을 바꿀 만큼 부드럽지만 끝내 바위를 뚫는다는 점에 주목하였다. 굳세고 강한 것을 이기는 이러한 물의 성질을 노자는 (        )(이)라 하였다.',a:'유약',r:'‘유약’을 정확히 기재하면 정답 (한자 병기 여부는 무관)',e:'(가)에서 “부드럽고 약한 것이 지닌 힘을 유약(柔弱)이라 부르며 높이 샀다.”라고 하였다.'},
 {q:'(나)에서 ‘벽계수’가 흘러가 끝내 이르게 되는 곳을 뜻하는 2음절의 말을 찾아 쓰시오.',p:2.4,a:'창해',r:'‘창해’를 정확히 기재하면 정답 (‘滄海’로 쓴 경우도 정답으로 인정)',e:'‘일도창해’는 한번 넓고 푸른 바다, 곧 ‘창해’에 이른다는 뜻이다. 골짜기의 시냇물은 흘러서 바다에 이르면 다시 돌아오지 못한다.'},
 {q:'(가)의 노자와 (나)의 화자가 ‘아래로 흘러가는 물’을 바라보는 태도가 어떻게 다른지 ㉠을 참고하여 한 문장으로 쓰시오.',p:5.7,a:'(가)의 노자는 낮은 곳으로 흐르며 다투지 않는 물을 본받을 덕으로 높이 평가하지만, (나)의 화자는 빨리 흘러가면 돌아오지 못하는 물을 덧없이 지나가는 것으로 보아 쉬어 가라고 권한다.',r:'‘(가)는 낮은 곳으로 흐르는 물을 본받을 만한 것(덕)으로 긍정한다’는 내용과 ‘(나)는 흘러가 돌아오지 못함을 아쉬워하여(덧없게 여겨) 쉬어 가기를 권한다’는 내용을 모두 포함하면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'(가)에서 아래로 흐르는 것은 스스로를 낮추는 덕이다. (나)에서 흘러감은 한번 가면 되돌릴 수 없는 세월과 인생의 덧없음이어서, 화자는 달빛 가득한 지금 이곳에 머물기를 권한다.'}]}
],
M:[
{pts:8,area:'수학Ⅰ · 로그',std:['12수학Ⅰ01-08'],unit:'수학Ⅰ 지수함수와 로그함수(로그의 뜻과 성질, 상용로그의 활용)',
 intent:'로그의 정의와 성질을 실생활 상황에 적용하여 문제를 해결할 수 있는지 평가한다.',
 body:R`소리의 세기가 $I$ 인 소리의 크기 $L$ 은 $$L=10\log\frac{I}{I_{0}}$$ 로 정해진다고 한다. (단, $I_{0}$ 은 양의 상수이고, $\log$ 는 상용로그이다.) 다음 물음에 답하시오.`,
 qs:[
 {q:R`크기가 $50$ 인 소리의 세기를 $I_{1}$, 크기가 $80$ 인 소리의 세기를 $I_{2}$ 라 할 때, $\dfrac{I_{2}}{I_{1}}$ 의 값을 구하시오.`,p:3.5,a:R`$1000$`,e:R`$10\log\dfrac{I_{2}}{I_{0}}-10\log\dfrac{I_{1}}{I_{0}}=10\log\dfrac{I_{2}}{I_{1}}=30$ 이므로 $\dfrac{I_{2}}{I_{1}}=10^{3}=1000$ 이다.`},
 {q:R`크기가 $60$ 인 소리를 내는 기계 $k$ 대를 동시에 작동시키면 소리의 세기는 기계 한 대일 때의 $k$ 배가 된다. 이때 소리의 크기가 $70$ 이상이 되도록 하는 자연수 $k$ 의 최솟값을 구하시오.`,p:4.5,a:R`$10$`,e:R`기계 한 대의 소리의 세기를 $I$ 라 하면 $10\log\dfrac{I}{I_{0}}=60$ 이다. $k$ 대일 때의 크기는 $$10\log\frac{kI}{I_{0}}=10\log k+60\ge 70$$ 이므로 $\log k\ge1$, 즉 $k\ge10$ 이다. 따라서 최솟값은 $10$ 이다.`}]},
{pts:12,area:'수학Ⅱ · 미분과 적분',std:['12수학Ⅱ03-05','12수학Ⅱ03-04'],unit:'수학Ⅱ 도함수의 활용(함수의 극대와 극소), 정적분의 활용(넓이)',
 intent:'극값 조건으로부터 다항함수를 결정하고, 곡선과 직선으로 둘러싸인 도형의 넓이를 구할 수 있는지 평가한다.',
 body:R`함수 $f(x)=x^{3}+ax^{2}+bx$ 가 $x=1$ 에서 극솟값 $-5$ 를 가질 때, 다음 물음에 답하시오. (단, $a,\ b$ 는 상수이다.)`,
 qs:[
 {q:R`$a$ 의 값을 구하시오.`,p:1.5,a:R`$3$`,e:R`$f'(x)=3x^{2}+2ax+b$ 에서 $f'(1)=3+2a+b=0$ 이고, $f(1)=1+a+b=-5$ 이다. 두 식을 연립하면 $a=3,\ b=-9$ 이다.`},
 {q:R`$b$ 의 값을 구하시오.`,p:2.0,a:R`$-9$`,e:R`(1)의 풀이에서 $b=-9$ 이다.`},
 {q:R`함수 $f(x)$ 의 극댓값을 구하시오.`,p:3.9,a:R`$27$`,e:R`$f(x)=x^{3}+3x^{2}-9x$, $f'(x)=3(x+3)(x-1)$ 이므로 $x=-3$ 에서 극대이고 $f(-3)=-27+27+27=27$ 이다.`},
 {q:R`곡선 $y=f(x)$ 와 직선 $y=27$ 로 둘러싸인 도형의 넓이를 구하시오.`,p:4.6,a:R`$108$`,e:R`$f(x)-27=x^{3}+3x^{2}-9x-27=(x+3)^{2}(x-3)$ 이므로 곡선과 직선은 $x=-3$ 에서 접하고 $x=3$ 에서 만난다. $-3\le x\le3$ 에서 $f(x)\le27$ 이므로 넓이는 $$\int_{-3}^{3}\{27-f(x)\}\,dx=\int_{-3}^{3}\left(-x^{3}-3x^{2}+9x+27\right)dx=2\int_{0}^{3}\left(-3x^{2}+27\right)dx=2\,(-27+81)=108$$ 이다.`}]}
]},
nat:{M:[
{pts:12,area:'미적분 · 등비급수',std:['12미적01-03','12미적01-05'],
 intent:'등비급수의 합을 이용하여 공비를 결정하고, 등비수열로 이루어진 여러 가지 급수의 합과 극한값을 구할 수 있는지 평가한다.',
 body:R`첫째항이 $1$ 인 등비수열 $\{a_{n}\}$ 에 대하여 $$\sum_{n=1}^{\infty}a_{n}=3$$ 이다. $S_{n}=\displaystyle\sum_{k=1}^{n}a_{k}$ 라 할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`수열 $\{a_{n}\}$ 의 공비를 구하시오.`,p:2.5,a:R`$\dfrac23$`,e:R`공비를 $r$ 라 하면 $-1<r<1$ 이고 $\dfrac{1}{1-r}=3$ 이므로 $r=\dfrac23$ 이다.`},
 {q:R`$\displaystyle\sum_{n=1}^{\infty}a_{n}a_{n+1}$ 의 값을 구하시오.`,p:4.0,a:R`$\dfrac65$`,e:R`$a_{n}a_{n+1}=r^{n-1}\cdot r^{n}=r^{2n-1}$ 이므로 첫째항이 $r=\dfrac23$, 공비가 $r^{2}=\dfrac49$ 인 등비급수이다. 따라서 합은 $\dfrac{\frac23}{1-\frac49}=\dfrac23\cdot\dfrac95=\dfrac65$ 이다.`},
 {q:R`$\displaystyle\lim_{n\to\infty}\frac{S_{n}-3}{a_{n}}$ 의 값을 구하시오.`,p:5.5,a:R`$-2$`,e:R`$S_{n}=\dfrac{1-r^{n}}{1-r}=3\left(1-r^{n}\right)$ 이므로 $S_{n}-3=-3r^{n}$ 이다. $a_{n}=r^{n-1}$ 이므로 $$\frac{S_{n}-3}{a_{n}}=-3r=-2$$ 로 일정하다. 따라서 극한값은 $-2$ 이다.`}]},
{pts:12,area:'미적분 · 정적분과 급수',std:['12미적03-04'],unit:'미적분 여러 가지 적분법(부분적분법), 정적분의 활용(정적분과 급수)',
 intent:'급수의 합을 정적분으로 나타내고, 부분적분법을 이용하여 그 값을 구할 수 있는지 평가한다.',
 body:R`다음 물음에 답하시오.`,
 qs:[
 {q:R`$\displaystyle\lim_{n\to\infty}\sum_{k=1}^{n}\frac{\pi}{2n}\cos\frac{k\pi}{2n}$ 의 값을 구하시오.`,p:3.3,a:R`$1$`,e:R`$x_{k}=\dfrac{k\pi}{2n}$, $\Delta x=\dfrac{\pi}{2n}$ 로 놓으면 주어진 극한은 $\displaystyle\int_{0}^{\frac{\pi}{2}}\cos x\,dx=\Big[\sin x\Big]_{0}^{\frac{\pi}{2}}=1$ 이다.`},
 {q:R`$\displaystyle\int_{0}^{\frac{\pi}{2}}x\cos x\,dx$ 의 값을 구하시오.`,p:3.3,a:R`$\dfrac{\pi}{2}-1$`,e:R`부분적분법에 의하여 $$\int_{0}^{\frac{\pi}{2}}x\cos x\,dx=\Big[x\sin x\Big]_{0}^{\frac{\pi}{2}}-\int_{0}^{\frac{\pi}{2}}\sin x\,dx=\frac{\pi}{2}-1$$ 이다.`},
 {q:R`$\displaystyle\lim_{n\to\infty}\frac{1}{n}\sum_{k=1}^{n}\frac{k}{n}\cos\frac{k\pi}{2n}$ 의 값을 구하시오.`,p:5.4,a:R`$\dfrac{2}{\pi}-\dfrac{4}{\pi^{2}}$`,e:R`$x_{k}=\dfrac{k\pi}{2n}$, $\Delta x=\dfrac{\pi}{2n}$ 로 놓으면 $\dfrac{k}{n}=\dfrac{2}{\pi}x_{k}$, $\dfrac1n=\dfrac{2}{\pi}\Delta x$ 이므로 $$\lim_{n\to\infty}\frac{1}{n}\sum_{k=1}^{n}\frac{k}{n}\cos\frac{k\pi}{2n}=\frac{4}{\pi^{2}}\int_{0}^{\frac{\pi}{2}}x\cos x\,dx=\frac{4}{\pi^{2}}\left(\frac{\pi}{2}-1\right)=\frac{2}{\pi}-\frac{4}{\pi^{2}}$$ 이다.`}]},
{pts:10,area:'수학Ⅱ · 극한과 넓이',std:['12수학Ⅱ03-05','12수학Ⅱ01-02'],
 intent:'두 곡선으로 둘러싸인 도형의 넓이와 함수의 극한값, 접선의 방정식을 구할 수 있는지 평가한다.',
 body:R`두 함수 $$f(x)=x^{3}-x,\qquad g(x)=x^{2}-1$$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`두 곡선 $y=f(x)$, $y=g(x)$ 로 둘러싸인 도형의 넓이를 구하시오.`,p:3.9,a:R`$\dfrac43$`,e:R`$f(x)-g(x)=x^{3}-x^{2}-x+1=(x-1)^{2}(x+1)$ 이므로 두 곡선은 $x=-1$ 에서 만나고 $x=1$ 에서 접하며, $-1\le x\le1$ 에서 $f(x)\ge g(x)$ 이다. 따라서 넓이는 $$\int_{-1}^{1}\left(x^{3}-x^{2}-x+1\right)dx=2\int_{0}^{1}\left(-x^{2}+1\right)dx=\frac43$$ 이다.`},
 {q:R`$\displaystyle\lim_{x\to1}\frac{f(x)-g(x)}{(x-1)^{2}}$ 의 값을 구하시오.`,p:2.5,a:R`$2$`,e:R`$\dfrac{f(x)-g(x)}{(x-1)^{2}}=x+1\ (x\neq1)$ 이므로 극한값은 $2$ 이다.`},
 {q:R`두 곡선 $y=f(x)$, $y=g(x)$ 가 접하는 점에서의 공통인 접선의 $y$ 절편을 구하시오.`,p:3.6,a:R`$-2$`,e:R`두 곡선은 점 $(1,\ 0)$ 에서 접한다. $f'(x)=3x^{2}-1$ 에서 $f'(1)=2$ ($g'(1)=2$ 와 같다) 이므로 접선은 $y=2(x-1)=2x-2$ 이고, $y$ 절편은 $-2$ 이다.`}]},
{pts:10,area:'미적분 · 입체도형의 부피',std:['12미적03-06'],unit:'미적분 정적분의 활용(입체도형의 부피), 여러 가지 적분법(부분적분법)',
 intent:'단면의 넓이를 식으로 나타내고, 부분적분법을 이용하여 입체도형의 부피를 구할 수 있는지 평가한다.',
 body:R`곡선 $y=\sqrt{x}\,e^{x}\ (0\le x\le1)$ 와 $x$ 축 및 직선 $x=1$ 로 둘러싸인 도형을 밑면으로 하는 입체도형이 있다. 이 입체도형을 $x$ 축에 수직인 평면으로 자른 단면이 모두 정사각형일 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$x$ 좌표가 $x\ (0<x\le1)$ 인 점을 지나고 $x$ 축에 수직인 평면으로 자른 단면의 넓이를 $A(x)$ 라 할 때, $A(x)$ 를 구하시오.`,p:1.5,a:R`$A(x)=xe^{2x}$`,e:R`단면인 정사각형의 한 변의 길이가 $\sqrt{x}\,e^{x}$ 이므로 $A(x)=\left(\sqrt{x}\,e^{x}\right)^{2}=xe^{2x}$ 이다.`},
 {q:R`$A\!\left(\dfrac12\right)$ 의 값을 구하시오.`,p:1.5,a:R`$\dfrac{e}{2}$`,e:R`$A\!\left(\dfrac12\right)=\dfrac12e^{1}=\dfrac{e}{2}$ 이다.`},
 {q:R`이 입체도형의 부피를 구하시오.`,p:7.0,a:R`$\dfrac{e^{2}+1}{4}$`,e:R`부분적분법에 의하여 $$V=\int_{0}^{1}xe^{2x}\,dx=\left[\frac{x}{2}e^{2x}\right]_{0}^{1}-\int_{0}^{1}\frac12e^{2x}\,dx=\frac{e^{2}}{2}-\left[\frac14e^{2x}\right]_{0}^{1}=\frac{e^{2}}{2}-\frac{e^{2}-1}{4}=\frac{e^{2}+1}{4}$$ 이다.`}]},
{pts:10,area:'수학Ⅰ · 수열의 귀납적 정의',std:['12수학Ⅰ03-01'],unit:'수학Ⅰ 수열(수열의 귀납적 정의)',
 intent:'귀납적으로 정의된 수열의 규칙을 찾아 항의 값과 합을 구하고, 조건을 만족하는 첫째항을 거꾸로 추론할 수 있는지 평가한다.',
 body:R`수열 $\{a_{n}\}$ 이 모든 자연수 $n$ 에 대하여 $$a_{n+1}=\begin{cases}\dfrac{a_{n}}{2} & (a_{n}\text{ 이 짝수일 때})\\[2mm] a_{n}+3 & (a_{n}\text{ 이 홀수일 때})\end{cases}$$ 를 만족할 때, 다음 물음에 답하시오.`,
 qs:[
 {q:R`$a_{1}=2$ 일 때, $a_{10}$ 의 값을 구하시오.`,p:2.5,a:R`$2$`,e:R`$a_{1}=2,\ a_{2}=1,\ a_{3}=4,\ a_{4}=2,\ \cdots$ 이므로 $2,\ 1,\ 4$ 가 이 순서로 되풀이된다. $10=3\cdot3+1$ 이므로 $a_{10}=a_{1}=2$ 이다.`},
 {q:R`$a_{1}=2$ 일 때, $\displaystyle\sum_{n=1}^{30}a_{n}$ 의 값을 구하시오.`,p:4.3,a:R`$70$`,e:R`한 주기의 합이 $2+1+4=7$ 이고 $30$ 개의 항은 $10$ 주기이므로 합은 $7\cdot10=70$ 이다.`},
 {q:R`$a_{1}=m$ ($m$ 은 자연수)일 때, $a_{4}=5$ 가 되도록 하는 모든 $m$ 의 값의 합을 구하시오.`,p:3.2,a:R`$71$`,e:R`거꾸로 따진다. $a_{n+1}$ 의 값이 주어지면 $a_{n}$ 은 짝수 $2a_{n+1}$ 이거나, $a_{n+1}-3$ 이 홀수인 자연수일 때 그 값이다. $a_{4}=5$ 이면 $a_{3}=10$ ($5-3=2$ 는 홀수가 아니다). $a_{3}=10$ 이면 $a_{2}=20$ 또는 $a_{2}=7$. $a_{2}=20$ 이면 $a_{1}=40$ 또는 $a_{1}=17$, $a_{2}=7$ 이면 $a_{1}=14$ ($7-3=4$ 는 홀수가 아니다). 따라서 $m=14,\ 17,\ 40$ 이고 합은 $71$ 이다.`}]},
{pts:10,area:'수학 · 경우의 수',std:[],unit:'수학 경우의 수(순열과 조합)',
 intent:'순열과 조합을 이용하여 조건을 만족하는 경우의 수를 구할 수 있는지 평가한다.',
 body:R`남학생 $4$ 명과 여학생 $3$ 명이 있다. 다음 물음에 답하시오.`,
 qs:[
 {q:R`$7$ 명 중에서 $3$ 명을 뽑을 때, 여학생이 적어도 한 명 포함되는 경우의 수를 구하시오.`,p:2.4,a:R`$31$`,e:R`전체 경우의 수 $_{7}\mathrm{C}_{3}=35$ 에서 남학생만 뽑는 경우의 수 $_{4}\mathrm{C}_{3}=4$ 를 빼면 $31$ 이다.`},
 {q:R`$7$ 명을 일렬로 세울 때, 여학생끼리는 서로 이웃하지 않는 경우의 수를 구하시오.`,p:5.4,a:R`$1440$`,e:R`남학생 $4$ 명을 먼저 세우는 경우의 수는 $4!=24$ 이다. 남학생 사이사이와 양 끝의 $5$ 자리 중 $3$ 자리를 골라 여학생을 세우는 경우의 수는 $_{5}\mathrm{P}_{3}=60$ 이다. 따라서 $24\times60=1440$ 이다.`},
 {q:R`남학생 $2$ 명과 여학생 $2$ 명을 뽑아 남학생과 여학생이 번갈아 서도록 일렬로 세우는 경우의 수를 구하시오.`,p:2.2,a:R`$144$`,e:R`뽑는 경우의 수는 $_{4}\mathrm{C}_{2}\times{}_{3}\mathrm{C}_{2}=6\times3=18$ 이다. 뽑힌 $4$ 명을 번갈아 세우는 방법은 남학생이 맨 앞인 경우와 여학생이 맨 앞인 경우 각각 $2!\times2!=4$ 가지이므로 $8$ 가지이다. 따라서 $18\times8=144$ 이다.`}]},
{pts:8,area:'수학Ⅱ · 도함수의 활용',std:[],unit:'수학Ⅱ 도함수의 활용(함수의 극대와 극소, 방정식에의 활용, 최대와 최소)',
 intent:'도함수를 활용하여 삼차함수의 극값, 방정식의 실근의 개수, 닫힌구간에서의 최댓값을 구할 수 있는지 평가한다.',
 body:R`함수 $f(x)=x^{3}-6x^{2}+9x+k$ ($k$ 는 상수)에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`함수 $f(x)$ 의 극댓값과 극솟값의 차를 구하시오.`,p:2.6,a:R`$4$`,e:R`$f'(x)=3(x-1)(x-3)$ 이므로 극댓값은 $f(1)=k+4$, 극솟값은 $f(3)=k$ 이고 그 차는 $4$ 이다.`},
 {q:R`방정식 $f(x)=0$ 이 서로 다른 두 실근을 갖도록 하는 모든 $k$ 의 값의 합을 구하시오.`,p:2.6,a:R`$-4$`,e:R`삼차방정식이 서로 다른 두 실근을 가지려면 극댓값 또는 극솟값이 $0$ 이어야 한다. $k+4=0$ 또는 $k=0$ 이므로 $k=-4,\ 0$ 이고 합은 $-4$ 이다.`},
 {q:R`닫힌구간 $[0,\ 4]$ 에서 함수 $f(x)$ 의 최댓값이 $10$ 일 때, $k$ 의 값을 구하시오.`,p:2.8,a:R`$6$`,e:R`$f(0)=k,\ f(1)=k+4,\ f(3)=k,\ f(4)=64-96+36+k=k+4$ 이므로 최댓값은 $k+4$ 이다. $k+4=10$ 에서 $k=6$ 이다.`}]},
{pts:8,area:'미적분 · 로그함수의 미분과 적분',std:['12미적02-02'],unit:'미적분 도함수의 활용(극대·극소, 변곡점), 여러 가지 적분법(치환적분법)',
 intent:'로그함수가 포함된 함수를 미분하여 최댓값과 변곡점을 구하고, 치환적분법으로 넓이를 구할 수 있는지 평가한다.',
 body:R`함수 $f(x)=\dfrac{\ln x}{x}\ (x>0)$ 에 대하여 다음 물음에 답하시오.`,
 qs:[
 {q:R`함수 $f(x)$ 의 최댓값을 구하시오.`,p:1.8,a:R`$\dfrac1e$`,e:R`$f'(x)=\dfrac{1-\ln x}{x^{2}}$ 이므로 $0<x<e$ 에서 증가, $x>e$ 에서 감소한다. 따라서 최댓값은 $f(e)=\dfrac1e$ 이다.`},
 {q:R`곡선 $y=f(x)$ 의 변곡점의 $x$ 좌표를 구하시오.`,p:3.1,a:R`$e^{\frac32}$ $\left(=e\sqrt{e}\right)$`,e:R`$f''(x)=\dfrac{-\frac1x\cdot x^{2}-(1-\ln x)\cdot2x}{x^{4}}=\dfrac{2\ln x-3}{x^{3}}$ 이다. $f''(x)=0$ 에서 $\ln x=\dfrac32$ 이고 $x=e^{\frac32}$ 의 좌우에서 $f''(x)$ 의 부호가 바뀌므로 변곡점의 $x$ 좌표는 $e^{\frac32}$ 이다.`},
 {q:R`곡선 $y=f(x)$ 와 $x$ 축 및 직선 $x=e$ 로 둘러싸인 도형의 넓이를 구하시오.`,p:3.1,a:R`$\dfrac12$`,e:R`곡선은 $x$ 축과 $x=1$ 에서 만나고 $1\le x\le e$ 에서 $f(x)\ge0$ 이다. $\ln x=t$ 로 놓으면 $\dfrac1x\,dx=dt$ 이므로 $$\int_{1}^{e}\frac{\ln x}{x}\,dx=\int_{0}^{1}t\,dt=\frac12$$ 이다.`}]}
],
K:[
{pts:10,area:'국어·수필 + 독서(과학)',std:['12독서01-02','10국02-03'],
 intent:'갯벌을 다룬 서로 다른 형식의 두 글을 주제 통합적으로 읽고, 한 글의 정보를 바탕으로 다른 글의 의미를 구성한다.',
 body:[
 {label:'(가)',text:R`내가 자란 마을 앞에는 물이 빠지면 십 리나 되는 갯벌이 드러났다. 물때가 되면 어머니는 호미와 바구니를 들고 나가셨고, 저녁상에는 바지락국이 올랐다. 낙지와 게와 조개가 철마다 났으니 갯벌은 우리 마을의 곳간이었다. 내가 중학교에 들어가던 해에 방조제 공사가 시작되었다. 어른들은 저 질척한 땅을 메우면 논이 생기고 공장이 들어선다고 했다. 갯벌은 메워야 할 빈 땅이라고들 했다. 방조제가 바다를 막자 갯벌은 몇 해 만에 딱딱하게 말라 갔다. 가을마다 하늘을 덮던 도요새 떼는 다시 오지 않았고, 고인 물에서는 여름마다 냄새가 났다. 그제야 사람들은 알았다. ㉠<u>갯벌은 빈 땅이 아니었다.</u> 어머니의 호미는 지금도 광 벽에 걸려 있다.`,src:'자체 집필 지문'},
 {label:'(나)',text:R`갯벌은 밀물 때 바닷물에 잠기고 썰물 때 드러나는 평평한 땅이다. 오랫동안 갯벌은 쓸모없는 땅으로 여겨져 간척의 대상이 되었으나, 오늘날에는 그 구실이 새롭게 밝혀지고 있다. 첫째, 갯벌은 오염 물질을 걸러 낸다. 뭍에서 흘러든 오염 물질은 갯벌의 흙에 걸러지고, 그 속에 사는 수많은 미생물과 작은 동물이 이를 분해한다. 몸속의 노폐물을 걸러 내는 장기에 빗대어 갯벌을 ‘자연의 콩팥’이라 부르는 까닭이다. 둘째, 갯벌은 재해를 누그러뜨린다. 넓고 평평한 갯벌은 태풍이나 해일이 밀려올 때 파도의 힘을 흩어 놓아 바닷가 마을의 피해를 줄인다. 셋째, 갯벌은 생물의 터전이다. 조개, 게, 갯지렁이를 비롯한 많은 생물이 살고, 먼 거리를 이동하는 철새들이 쉬면서 먹이를 얻는 중간 기착지가 된다. 이러한 가치를 인정받아 우리나라의 갯벌은 2021년에 유네스코 세계 자연 유산으로 등재되었다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'(가)에서 갯벌이 마을 사람들에게 지녔던 의미를 빗대어 나타낸 2음절의 단어를 찾아 쓰시오.',p:2.5,a:'곳간',r:'‘곳간’을 정확히 기재하면 정답',e:'(가)의 “갯벌은 우리 마을의 곳간이었다.”에서 확인할 수 있다. 철마다 먹을거리를 내어 주는 곳이라는 뜻이다.'},
 {q:'&lt;보기&gt;의 빈칸에 들어갈 말을 (나)에서 찾아 쓰시오.',p:3.1,box:'(가)에서 방조제가 생긴 뒤 고인 물에서 냄새가 나게 된 것은, 갯벌이 사라지면서 ‘자연의 (        )’(이)라 불리는 갯벌의 정화 작용도 함께 사라졌기 때문이다.',a:'콩팥',r:'‘콩팥’을 정확히 기재하면 정답',e:'(나)는 오염 물질을 걸러 내는 갯벌을 ‘자연의 콩팥’이라 부른다고 하였다.'},
 {q:'(나)를 참고하여 ㉠의 의미가 무엇인지 한 문장으로 쓰시오.',p:4.4,a:'갯벌은 쓸모없는 땅이 아니라 오염 물질을 걸러 내고 재해를 줄이며 많은 생물이 살아가는 소중한 터전이다.',r:'‘갯벌은 쓸모없는 땅이 아니다’라는 내용과 (나)에 제시된 갯벌의 구실(정화, 재해 완화, 생물의 터전) 가운데 하나 이상을 포함한 문장을 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'(가)의 도요새 떼와 고인 물의 냄새는 (나)가 설명한 철새의 중간 기착지, 정화 작용과 각각 이어진다. ‘빈 땅’이라는 생각이 틀렸음을 (나)의 설명이 뒷받침한다.'}]},

{pts:10,area:'국어·독서(기술)',std:['12독서03-03','12독서02-01'],
 intent:'디지털 이미지의 표현 원리를 설명한 글을 읽고, 내용을 사실적으로 이해하여 구체적인 값의 계산에 적용한다.',
 body:[{text:R`컴퓨터 화면의 사진을 크게 확대하면 네모난 점들이 바둑판처럼 늘어서 있는 것을 볼 수 있다. 이 점 하나하나를 픽셀이라 한다. 디지털 이미지는 픽셀마다 색의 값을 숫자로 적어 놓은 것이다. 가로와 세로에 놓인 픽셀의 수를 해상도라 하며, 가로 1920개, 세로 1080개의 픽셀로 이루어진 이미지의 해상도는 ‘1920×1080’과 같이 나타낸다. 해상도가 높을수록 이미지를 더 세밀하게 나타낼 수 있다.

픽셀 하나의 색을 적는 데 쓰는 비트의 수를 비트 깊이라 한다. 비트는 0 또는 1의 두 값 가운데 하나를 나타내는 정보의 가장 작은 단위이다. 비트 깊이가 1비트이면 픽셀은 두 가지 색 가운데 하나만 나타낼 수 있다. 2비트이면 00, 01, 10, 11의 네 가지, 3비트이면 여덟 가지 색을 나타낼 수 있다. 곧 비트 깊이가 1비트 늘어날 때마다 나타낼 수 있는 색의 가짓수는 (㉠                    ). 오늘날 흔히 쓰이는 방식은 빛의 삼원색인 빨강, 초록, 파랑에 각각 8비트씩을 주어 픽셀 하나에 24비트를 쓰는 것으로, 약 1,677만 가지 색을 나타낼 수 있다.

압축하지 않은 이미지의 크기는 픽셀의 수에 비트 깊이를 곱하여 구한다. 이렇게 구한 값의 단위는 비트이며, 8비트가 1바이트이므로 8로 나누면 바이트 단위의 크기가 된다. 해상도가 높아지거나 비트 깊이가 커지면 이미지는 더 정교해지지만 그만큼 저장에 필요한 공간도 늘어난다.`,src:'자체 집필 지문'}],
 qs:[
 {q:'㉠에 들어갈 적절한 말을 10자 내외로 쓰시오.',p:4.3,a:'두 배로 늘어난다.',r:'‘두 배가 된다(2배로 늘어난다)’는 내용을 정확히 쓰면 정답. 답안의 완성도에 따라 감점하거나 부분 점수를 부여할 수 있음',e:'1비트에 2가지, 2비트에 4가지, 3비트에 8가지이므로 비트가 하나 늘 때마다 색의 가짓수는 두 배가 된다.'},
 {q:'&lt;보기&gt;의 빈칸에 들어갈 적절한 말을 윗글에서 찾아 쓰시오.',p:2.5,box:'두 이미지의 가로와 세로 픽셀 수가 같더라도, 픽셀 하나의 색을 적는 데 쓰는 비트의 수인 (        )이/가 다르면 나타낼 수 있는 색의 가짓수와 이미지의 크기가 달라진다.',a:'비트 깊이',r:'‘비트 깊이’를 정확히 기재하면 정답',e:'둘째 문단의 첫 문장에서 확인할 수 있다.'},
 {q:'윗글을 바탕으로 다음 표의 ⓐ, ⓑ, ⓒ, ⓓ에 들어갈 수를 쓰시오. (단, 이미지는 압축하지 않은 것이다.)',p:3.2,table:{head:['주어진 것','구하는 것'],rows:[['비트 깊이 4비트','나타낼 수 있는 색의 가짓수 ⓐ'],['비트 깊이 8비트','나타낼 수 있는 색의 가짓수 ⓑ'],['해상도 100×100, 비트 깊이 8비트','이미지의 크기 ⓒ 바이트'],['해상도 1920×1080, 비트 깊이 24비트','이미지의 크기 ⓓ 바이트']]},a:'ⓐ 16, ⓑ 256, ⓒ 10000(10,000), ⓓ 6220800(6,220,800)',r:'예시 답안을 정확히 기재하면 정답. 각각의 항목별로 부분 점수 0.8점을 부여할 수 있음',e:'ⓐ 2⁴=16. ⓑ 2⁸=256. ⓒ 100×100×8÷8=10,000바이트. ⓓ 1920×1080=2,073,600픽셀이고, 픽셀마다 24÷8=3바이트이므로 2,073,600×3=6,220,800바이트.'}]}
]}
});

const STD={
'10국02-03':'삶의 문제에 대한 해결 방안이나 필자의 생각에 대한 대안을 찾으며 읽는다.',
'10국03-01':'쓰기는 의미를 구성하여 소통하는 사회적 상호 작용임을 이해하고 글을 쓴다.',
'10국05-01':'문학 작품은 구성 요소들과 전체가 유기적 관계를 맺고 있는 구조물임을 이해하고 문학 활동을 한다.',

  h+='<div class="row"><span class="lab">채점 기준</span><span>'+(q.r?mth(q.r):'정답을 정확히 기재하면 '+ptxt(q.p))+'</span></div>';
  if(q.e)h+='<div class="row"><span class="lab">해설</span><span>'+mth(esc2(q.e))+'</span></div>';
  h+='<div class="my"><label>내 점수 <input type="number" inputmode="decimal" min="0" max="'+q.p+'" step="0.1" data-k="s:'+k+'" data-max="'+q.p+'" value="'+(v==null?'':v)+'"></label> / '+ptxt(q.p)+' <button class="btn g s" data-full="s:'+k+'">만점</button><button class="btn g s" data-zero="s:'+k+'">0점</button></div></div>'});
 h+='<div class="meta"><b>출제 의도</b> '+esc(pr.intent||'')+'<br>';
 const stds=(pr.std||[]).filter(c=>STD[c]);
 if(stds.length)h+='<b>관련 성취기준</b><ul>'+stds.map(c=>'<li>['+c+'] '+STD[c]+'</li>').join('')+'</ul>';
 if(pr.unit)h+='<b>관련 단원</b> '+esc(pr.unit);
 h+='</div></details></div>';
 return h}
/* 해설에는 수식 밖에 <보기> 같은 꺾쇠가 그대로 쓰일 수 있어 수식 밖의 꺾쇠만 이스케이프한다 */
function esc2(s){return String(s).split(/(\$\$[\s\S]+?\$\$|\$[^$]+?\$)/).map((x,i)=>i%2?x:x.replace(/<(?!\/?(u|br|b)\b)/g,'&lt;')).join('')}
function paperHTML(p){
 const list=probs(p,track);
 let h='<div class="bar noprint"><div class="seg" role="group" aria-label="계열 선택"><button data-track="hum" class="'+(track==='hum'?'on':'')+'">인문계열</button><button data-track="nat" class="'+(track==='nat'?'on':'')+'">자연계열</button></div>';
 h+='<span class="timer" id="timer">90:00</span><button class="btn s" id="tgo">시작</button><button class="btn g s" id="treset">초기화</button>';
 h+='<button class="btn g s" id="openall">정답 모두 펼치기</button><button class="btn g s" id="printq">문제지 인쇄</button><button class="btn g s" id="printa">정답 포함 인쇄</button>';
 h+='<span class="score" id="score"></span></div>';
 h+='<h2>'+(p.kind==='past'?'2026학년도 국민대 논술 기출문제':'예상 연습문항 세트 '+p.d.id)+' · '+(track==='hum'?'인문계열 (국어 8문항 + 수학 2문항)':'자연계열 (수학 8문항 + 국어 2문항)')+'</h2>';
 h+=p.kind==='past'
  ?'<div class="note past"><b>기출문제 안내</b> · 「2027학년도 국민대학교 논술 가이드북」에 실린 2026학년도 수시 논술 기출입니다. 저작권은 국민대학교에 있습니다. 수학은 문제를 그대로 옮겼고, 국어는 지문을 요약하고 발문·정답·채점 기준을 옮겼습니다. 국어 지문 전문과 그림은 각 문항에 표시한 가이드북 쪽수에서 확인하세요. 수학 해설은 가이드북의 문항 해설을 바탕으로 풀어 썼습니다.</div>'
  :'<div class="note mock"><b>예상 문항 안내</b> · 기출의 문항 구성과 배점을 그대로 따라 자체 제작한 연습 문항입니다. 국민대학교가 출제한 문제가 아니며 실제 시험과 다를 수 있습니다. 채점 기준은 기출의 채점 방식을 본떠 작성했습니다.</div>';
 h+=list.map((pr,i)=>probHTML(p,pr,i)).join('');
 return h}
function updScore(){
 const el=document.getElementById('score');if(!el)return;
 const p=PAPERS.find(x=>x.id===cur);if(!p)return;
 let k=0,m=0,any=false;
 probs(p,track).forEach((pr,i)=>pr.qs.forEach((q,j)=>{const v=ST['s:'+p.id+':'+track+':'+i+':'+j];if(v!=null&&v!==''){any=true;if(isMath(pr))m+=+v;else k+=+v}}));
 const km=track==='hum'?[80,20]:[20,80];
 el.innerHTML=any?'자가 채점 <b>'+fmt(k+m)+'</b> / 100점 <span class="mute sm">(국어 '+fmt(k)+'/'+km[0]+' · 수학 '+fmt(m)+'/'+km[1]+')</span>':'<span class="mute sm">정답을 열어 점수를 입력하면 합계가 표시됩니다</span>'}
/* ---------- timer ---------- */
let left=5400,tid=null;
function showT(){const el=document.getElementById('timer');if(!el)return;const m=Math.floor(left/60),s=left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('low',left<=600);const b=document.getElementById('tgo');if(b)b.textContent=tid?'일시정지':(left<5400&&left>0?'계속':'시작')}
function tick(){if(left>0){left--;showT()}if(left<=0){clearInterval(tid);tid=null;showT()}}
/* ---------- render / events ---------- */
function render(){
 document.getElementById('tabs').innerHTML='<button data-tab="guide" class="'+(cur==='guide'?'on':'')+'">시험 안내</button>'+PAPERS.map(p=>'<button data-tab="'+p.id+'" class="'+(cur===p.id?'on':'')+'">'+p.name+'</button>').join('');
 const p=PAPERS.find(x=>x.id===cur);
 document.getElementById('main').innerHTML=p?paperHTML(p):guideHTML();
 showT();updScore();
 const on=document.querySelector('#tabs button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'nearest'})}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;cur=b.dataset.tab;ST.cur=cur;save();render();window.scrollTo(0,0)});
const main=document.getElementById('main');
main.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.track){track=t.dataset.track;ST.track=track;save();render();return}
 if(t.id==='tgo'){if(tid){clearInterval(tid);tid=null}else{if(left<=0)left=5400;tid=setInterval(tick,1000)}showT();return}
 if(t.id==='treset'){clearInterval(tid);tid=null;left=5400;showT();return}
 if(t.id==='openall'){const ds=[...main.querySelectorAll('details.sol')];const open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open);t.textContent=open?'정답 모두 접기':'정답 모두 펼치기';return}
 if(t.id==='printq'){main.querySelectorAll('details.sol').forEach(d=>d.open=false);window.print();return}
 if(t.id==='printa'){main.querySelectorAll('details.sol').forEach(d=>d.open=true);window.print();return}
 const k=t.dataset.full||t.dataset.zero;
 if(k){const inp=main.querySelector('input[data-k="'+k+'"]');const v=t.dataset.full?inp.dataset.max:'0';inp.value=v;ST[k]=v;save();updScore()}});
main.addEventListener('input',e=>{
 const t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;
 if(t.tagName==='INPUT'){let v=t.value;if(v!==''){v=Math.max(0,Math.min(+t.dataset.max,+v||0));if(+t.value!==v)t.value=v}if(v==='')delete ST[k];else ST[k]=String(v);save();updScore()}
 else{if(t.value)ST[k]=t.value;else delete ST[k];save()}});
if(cur!=='guide'&&!PAPERS.some(p=>p.id===cur))cur='guide';
render();
</script>
</body>
</html>
