 즉 \"추가로 구운 빵이 팔릴 확률이 원가÷판매가 이상일 때까지 굽는다\"."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">p=3</annotation></semantics></math></span>이고 (가)의 조건이 더해졌다(손님 수는 처음처럼 주사위의 눈을 따른다). 한 개를 더 구울 때 기대 이익이 줄지 않을 조건을 다시 세우고 가장 좋은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>를 구하시오.","남은 빵을 처분할 수 있게 되면 왜 더 많이 굽게 되는지 설명하시오."],"ans":["한 개 더 구우면 팔릴 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">+2</annotation></semantics></math></span>, 남을 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">-0.5</annotation></semantics></math></span>. 조건은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mtext> </mtext><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><mi>D</mi><mo>&gt;</mo><mi>q</mi><mo stretchy=\"false\">)</mo><mo>−</mo><mn>0.5</mn><mtext> </mtext><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><mi>D</mi><mo>≤</mo><mi>q</mi><mo stretchy=\"false\">)</mo><mo>≥</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">2\\,\\mathrm P(D&gt;q)-0.5\\,\\mathrm P(D\\le q)\\ge0</annotation></semantics></math></span>, 즉 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><mi>D</mi><mo>&gt;</mo><mi>q</mi><mo stretchy=\"false\">)</mo><mo>≥</mo><mn>0.2</mn></mrow><annotation encoding=\"application/x-tex\">\\mathrm P(D&gt;q)\\ge0.2</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</mo><mn>4</mn><mo>→</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">q=4\\to5</annotation></semantics></math></span>는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle><mo>≥</mo><mn>0.2</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac13\\ge0.2</annotation></semantics></math></span>로 굽고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn><mo>→</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">5\\to6</annotation></semantics></math></span>은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>6</mn></mfrac></mstyle><mo>&lt;</mo><mn>0.2</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac16&lt;0.2</annotation></semantics></math></span>로 굽지 않는다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">q=5</annotation></semantics></math></span>. 남을 때의 손해가 줄어 더 낮은 확률에도 구울 만해진다."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">p=3</annotation></semantics></math></span>이고 남은 빵은 버린다고 하자. 손님 수가 (나)를 따를 때, 날씨를 모르고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>를 정하는 경우의 최대 기대 이익과, 아침에 날씨를 알고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>를 정하는 경우의 기대 이익을 각각 구하시오.","두 값의 차는 무엇을 뜻하는가?"],"ans":["모를 때: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><mi>D</mi><mo>=</mo><mi>k</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm P(D=k)</annotation></semantics></math></span>는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>≤</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">k\\le3</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>9</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac19</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>≥</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">k\\ge4</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>9</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac29</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><mi>D</mi><mo>&gt;</mo><mi>q</mi><mo stretchy=\"false\">)</mo><mo>≥</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\mathrm P(D&gt;q)\\ge\\dfrac13</annotation></semantics></math></span>인 동안 굽는다 → <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">q=5</annotation></semantics></math></span>, 기대 이익 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo>×</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>34</mn><mn>9</mn></mfrac></mstyle><mo>−</mo><mn>5</mn><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>19</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">3\\times\\dfrac{34}9-5=\\dfrac{19}3</annotation></semantics></math></span>. 알 때: 비 오는 날 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">q=2</annotation></semantics></math></span>(또는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">3</annotation></semantics></math></span>)로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">3</annotation></semantics></math></span>, 맑은 날 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">q=5</annotation></semantics></math></span>(또는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">6</annotation></semantics></math></span>)로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9</mn></mrow><annotation encoding=\"application/x-tex\">9</annotation></semantics></math></span>, 기대 이익 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle><mo>⋅</mo><mn>3</mn><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle><mo>⋅</mo><mn>9</mn><mo>=</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac13\\cdot3+\\dfrac23\\cdot9=7</annotation></semantics></math></span>. 차 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac23</annotation></semantics></math></span>천 원은 날씨 정보의 값어치, 곧 일기 예보에 낼 만한 최대 금액이다."]}]},{"kind":"연습","src":"연습 3 · 문 뒤의 자동차","scope":"확률과 통계","concept":"수학적 확률, 조건부확률, 이항분포와 정규분포","body":"<p>문 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>개 중 하나의 뒤에만 자동차가 있고 나머지 문 뒤에는 아무것도 없다(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>≥</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n\\ge3</annotation></semantics></math></span>). 참가자가 문 하나를 고르면, 자동차의 위치를 아는 진행자가 참가자가 고르지 않은 문 가운데 빈 문 하나를 열어 보여 준다. 그 뒤 참가자는 처음 고른 문을 그대로 두거나, 열리지 않은 다른 문 하나로 바꿀 수 있다. 바꿀 때에는 남은 문 가운데 하나를 같은 확률로 고른다.</p><div class=\"box\"><b>토막글 · 진행자의 버릇</b><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n=3</annotation></semantics></math></span>이고 참가자가 1번 문을 골랐다고 하자. 자동차가 1번 문 뒤에 있으면 진행자는 2번과 3번 중 어느 문을 열어도 되는데, 이때 2번 문을 열 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>, 3번 문을 열 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">1-t</annotation></semantics></math></span>라 하자(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>≤</mo><mi>t</mi><mo>≤</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">0\\le t\\le1</annotation></semantics></math></span>). 참가자는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>의 값을 알고 있다.</p></div>","qs":[],"ans":[],"follow":["문이 100개이고 진행자가 빈 문 98개를 열면 직관적으로 어떻게 설명할 수 있는가?","문제 2의 (2)에서 열린 문 뒤에 자동차가 있었다면 게임은 어떻게 되는가?"],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n=3</annotation></semantics></math></span>일 때, 문을 바꾸는 참가자가 자동차를 얻을 확률을 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">n=4</annotation></semantics></math></span>일 때, 문을 바꾸지 않는 경우와 바꾸는 경우에 자동차를 얻을 확률을 각각 구하시오."],"ans":["처음 고른 문이 빈 문일 확률은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac23</annotation></semantics></math></span>이고, 그때 바꾸면 반드시 자동차를 얻는다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac23</annotation></semantics></math></span>.","그대로 두면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>4</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac14</annotation></semantics></math></span>. 바꾸면 처음에 빈 문을 골랐을 때(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>4</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac34</annotation></semantics></math></span>) 남은 두 문 중 자동차 문을 고를 확률이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac12</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>8</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac38</annotation></semantics></math></span>."]},{"parts":["일반적인 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>에 대하여 문을 바꾸는 경우의 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>에 대한 식으로 나타내고, 바꾸는 편이 언제나 유리함을 보이시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n=3</annotation></semantics></math></span>이고 진행자가 자동차의 위치를 <b>모르는 채</b> 남은 두 문 중 하나를 아무렇게나 열었는데 빈 문이었다. 이때 문을 바꾸면 자동차를 얻을 확률을 구하고, 문제 1의 (1)의 답과 다른 이유를 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><mi>n</mi></mfrac></mstyle><mo>×</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mrow><mi>n</mi><mo>−</mo><mn>2</mn></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><mrow><mi>n</mi><mo stretchy=\"false\">(</mo><mi>n</mi><mo>−</mo><mn>2</mn><mo stretchy=\"false\">)</mo></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{n-1}{n}\\times\\dfrac1{n-2}=\\dfrac{n-1}{n(n-2)}</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mi>n</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1n</annotation></semantics></math></span>과 견주면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><mrow><mi>n</mi><mo>−</mo><mn>2</mn></mrow></mfrac></mstyle><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{n-1}{n-2}&gt;1</annotation></semantics></math></span>배이므로 항상 크다.","\"열린 문이 빈 문\"이라는 사건의 확률은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle><mo>×</mo><mn>1</mn><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle><mo>×</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac13\\times1+\\dfrac23\\times\\dfrac12=\\dfrac23</annotation></semantics></math></span>. 그중 처음 고른 문이 자동차인 경우가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac13</annotation></semantics></math></span>이므로 조건부확률은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac12</annotation></semantics></math></span>, 바꿔도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac12</annotation></semantics></math></span>. 진행자가 위치를 알고 여는 경우에는 빈 문이 열렸다는 사실이 새 정보를 주지 않지만, 모르고 연 경우에는 정보를 준다."]},{"parts":["진행자가 3번 문을 열었다. 이때 2번 문으로 바꾸면 자동차를 얻을 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>로 나타내고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">t=\\dfrac12</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t=0</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">t=1</annotation></semantics></math></span>인 경우를 각각 해석하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>가 얼마이든 바꾸는 쪽이 손해가 아님을 보이시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>⋅</mo><mn>1</mn></mrow><mrow><mfrac><mn>1</mn><mn>3</mn></mfrac><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>+</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>⋅</mo><mn>1</mn></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mrow><mn>2</mn><mo>−</mo><mi>t</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{\\frac13\\cdot1}{\\frac13(1-t)+\\frac13\\cdot1}=\\dfrac{1}{2-t}</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">t=\\dfrac12</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac23</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t=0</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac12</annotation></semantics></math></span>(자동차가 1번일 때 늘 3번을 열므로 정보가 적다), <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">t=1</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>(자동차가 1번이면 3번을 열 리 없다). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>≤</mo><mi>t</mi><mo>≤</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">0\\le t\\le1</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mrow><mn>2</mn><mo>−</mo><mi>t</mi></mrow></mfrac></mstyle><mo>≥</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1{2-t}\\ge\\dfrac12</annotation></semantics></math></span>."]},{"parts":["처음의 게임(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n=3</annotation></semantics></math></span>, 진행자는 위치를 알고 연다)을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span>번 되풀이하며 매번 문을 바꾼다. 자동차를 얻는 횟수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi></mrow><annotation encoding=\"application/x-tex\">X</annotation></semantics></math></span>의 평균과 표준편차를 구하고, 자동차를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>60</mn></mrow><annotation encoding=\"application/x-tex\">60</annotation></semantics></math></span>번 이하로 얻을 확률을 어림하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>2</mn></msqrt><mo>≈</mo><mn>1.41</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt2\\approx1.41</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><mn>0</mn><mo>≤</mo><mi>Z</mi><mo>≤</mo><mn>1.41</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.42</mn></mrow><annotation encoding=\"application/x-tex\">\\mathrm P(0\\le Z\\le1.41)=0.42</annotation></semantics></math></span>)","(1)의 결과로 \"두 전략은 어차피 반반\"이라는 주장을 실험으로 가려낼 수 있는지 말하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi></mrow><annotation encoding=\"application/x-tex\">X</annotation></semantics></math></span>는 이항분포 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">B</mi><mtext> ⁣</mtext><mrow><mo fence=\"true\">(</mo><mn>100</mn><mo separator=\"true\">,</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathrm B\\!\\left(100,\\dfrac23\\right)</annotation></semantics></math></span>. 평균 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>200</mn><mn>3</mn></mfrac></mstyle><mo>≈</mo><mn>66.7</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{200}3\\approx66.7</annotation></semantics></math></span>, 표준편차 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mrow><mn>100</mn><mo>⋅</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle><mo>⋅</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mrow></msqrt><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>10</mn><msqrt><mn>2</mn></msqrt></mrow><mn>3</mn></mfrac></mstyle><mo>≈</mo><mn>4.7</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt{100\\cdot\\dfrac23\\cdot\\dfrac13}=\\dfrac{10\\sqrt2}{3}\\approx4.7</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo>≤</mo><mn>60</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><mi>Z</mi><mo>≤</mo><mo>−</mo><mn>1.41</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.08</mn></mrow><annotation encoding=\"application/x-tex\">\\mathrm P(X\\le60)\\approx\\mathrm P(Z\\le-1.41)=0.08</annotation></semantics></math></span>. 반반이라면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">50</annotation></semantics></math></span>번 안팎(표준편차 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>)이어야 하므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span>번의 실험으로 두 주장을 꽤 분명히 가릴 수 있다."]}]},{"kind":"연습","src":"연습 4 · 소득 불평등을 재는 곡선","scope":"수학Ⅱ","concept":"다항함수의 정적분, 넓이, 부등식, 구간별로 정의된 함수, 두 그래프의 교점","body":"<p>어느 사회의 구성원을 소득이 낮은 순서로 세울 때, 아래쪽 비율 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mtext> </mtext><mo stretchy=\"false\">(</mo><mn>0</mn><mo>≤</mo><mi>x</mi><mo>≤</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">x\\ (0\\le x\\le1)</annotation></semantics></math></span>에 해당하는 사람들이 버는 소득이 전체 소득에서 차지하는 비율을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">L(x)</annotation></semantics></math></span>라 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">L(0)=0</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">L(1)=1</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mi>L</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">y=L(x)</annotation></semantics></math></span>의 그래프를 로렌츠 곡선이라 한다. 모든 사람의 소득이 같으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">L(x)=x</annotation></semantics></math></span>이다.</p><figure><svg viewBox=\"0 0 300 250\" role=\"img\" aria-label=\"완전 평등선과 로렌츠 곡선\">\n<line class=\"ax\" x1=\"50\" y1=\"210\" x2=\"260\" y2=\"210\"/><line class=\"ax\" x1=\"50\" y1=\"215\" x2=\"50\" y2=\"20\"/><line class=\"dash\" x1=\"50\" y1=\"210\" x2=\"230\" y2=\"30\"/><polyline class=\"ln\" points=\"50.0,210.0 54.5,209.9 59.0,209.6 63.5,209.0 68.0,208.2 72.5,207.2 77.0,205.9 81.5,204.5 86.0,202.8 90.5,200.9 95.0,198.8 99.5,196.4 104.0,193.8 108.5,191.0 113.0,187.9 117.5,184.7 122.0,181.2 126.5,177.5 131.0,173.6 135.5,169.4 140.0,165.0 144.5,160.4 149.0,155.5 153.5,150.5 158.0,145.2 162.5,139.7 167.0,133.9 171.5,128.0 176.0,121.8 180.5,115.4 185.0,108.8 189.5,101.9 194.0,94.8 198.5,87.5 203.0,80.0 207.5,72.2 212.0,64.2 216.5,56.0 221.0,47.6 225.5,38.9 230.0,30.0\"/>\n<line class=\"grid1\" x1=\"230\" y1=\"210\" x2=\"230\" y2=\"30\"/><line class=\"grid1\" x1=\"50\" y1=\"30\" x2=\"230\" y2=\"30\"/>\n<text x=\"110\" y=\"120\">완전 평등선</text><text x=\"170\" y=\"170\">y = L(x)</text><text x=\"226\" y=\"226\">1</text><text x=\"36\" y=\"34\">1</text><text x=\"40\" y=\"226\">O</text>\n<text x=\"90\" y=\"242\">소득이 낮은 쪽부터 센 인구 비율 x</text><text x=\"6\" y=\"14\">누적 소득 비율</text>\n</svg><figcaption>[그림] 로렌츠 곡선. 색선과 점선 사이가 넓을수록 불평등하다</figcaption></figure>\n<p>직선 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">y=x</annotation></semantics></math></span>와 로렌츠 곡선 사이의 넓이의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>배를 지니 계수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G</mi></mrow><annotation encoding=\"application/x-tex\">G</annotation></semantics></math></span>라 한다.</p><div class=\"box\"><b>자료 · 또 다른 사회</b><p>사회 B에서는 소득이 낮은 쪽 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>80</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">80\\,\\%</annotation></semantics></math></span>의 사람들이 전체 소득의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">40\\,\\%</annotation></semantics></math></span>를 고르게 나누어 벌고, 나머지 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">20\\,\\%</annotation></semantics></math></span>의 사람들이 전체 소득의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>60</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">60\\,\\%</annotation></semantics></math></span>를 고르게 나누어 번다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">L(x)=x^2</annotation></semantics></math></span>인 사회를 사회 A라 하자.</p></div>","qs":[],"ans":[],"follow":["L(x)가 항상 y = x 아래에 놓이는 이유는?","지니 계수가 같은 두 사회의 소득 분포가 다를 수 있는가?"],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">L(x)=x^2</annotation></semantics></math></span>인 사회에서 소득이 낮은 쪽 절반의 사람들이 버는 소득은 전체의 몇 %인가? 소득이 높은 쪽 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">10\\,\\%</annotation></semantics></math></span>는 전체의 몇 %를 버는가?","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">L(x)=x^2</annotation></semantics></math></span>일 때 지니 계수를 구하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mn>0.5</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.25</mn></mrow><annotation encoding=\"application/x-tex\">L(0.5)=0.25</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">25\\,\\%</annotation></semantics></math></span>. 위쪽 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">10\\,\\%</annotation></semantics></math></span>는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><mi>L</mi><mo stretchy=\"false\">(</mo><mn>0.9</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.19</mn></mrow><annotation encoding=\"application/x-tex\">1-L(0.9)=0.19</annotation></semantics></math></span>, 즉 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>19</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">19\\,\\%</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G</mi><mo>=</mo><mn>2</mn><mstyle scriptlevel=\"0\" displaystyle=\"true\"><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mo stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><msup><mi>x</mi><mn>2</mn></msup><mo stretchy=\"false\">)</mo><mtext> </mtext><mi>d</mi><mi>x</mi><mo>=</mo><mn>2</mn><mrow><mo fence=\"true\">(</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mstyle></mrow><annotation encoding=\"application/x-tex\">G=2\\displaystyle\\int_0^1(x-x^2)\\,dx=2\\left(\\dfrac12-\\dfrac13\\right)=\\dfrac13</annotation></semantics></math></span>."]},{"parts":["자연수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>에 대하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msup><mi>x</mi><mi>n</mi></msup></mrow><annotation encoding=\"application/x-tex\">L(x)=x^n</annotation></semantics></math></span>일 때 지니 계수를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>에 대한 식으로 나타내고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>이 커질 때 이 값이 어떻게 변하는지와 그 뜻을 설명하시오.","세금과 보조금으로 로렌츠 곡선이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>a</mi><mi>x</mi><mo>+</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>a</mi><mo stretchy=\"false\">)</mo><msup><mi>x</mi><mn>2</mn></msup><mtext> </mtext><mo stretchy=\"false\">(</mo><mn>0</mn><mo>≤</mo><mi>a</mi><mo>≤</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">L(x)=ax+(1-a)x^2\\ (0\\le a\\le1)</annotation></semantics></math></span>으로 바뀐다. 지니 계수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.2</mn></mrow><annotation encoding=\"application/x-tex\">0.2</annotation></semantics></math></span> 이하가 되도록 하는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>의 값의 범위를 구하시오."],"ans":["<span class=\"katex\"><math xmlns=\" ptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>x</mi><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">x^2=\\dfrac x2</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">x=0.5</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>&lt;</mo><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">x&lt;0.5</annotation></semantics></math></span>에서는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>&lt;</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>x</mi><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">x^2&lt;\\dfrac x2</annotation></semantics></math></span>이므로 아래쪽 절반에 못 미치는 계층의 몫은 사회 A가 오히려 작다. 지니 계수 하나로는 어느 계층이 어려운지 알 수 없다."]},{"parts":["사회 B에서 위쪽 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">20\\,\\%</annotation></semantics></math></span>가 버는 소득 가운데 비율 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>만큼을 걷어 아래쪽 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>80</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">80\\,\\%</annotation></semantics></math></span>에게 고르게 나누어 준다. 지니 계수를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>로 나타내고, 사회 A의 지니 계수 등."]}]}],"mn1":[{"kind":"기출","src":"2026학년도 수학 B","page":"문항집 13쪽","scope":"수학 · 확률과 통계","concept":"다항식의 연산과 인수분해, 대우를 이용한 증명, 중복조합","body":"<p>세 문자 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo separator=\"true\">,</mo><mi>y</mi><mo separator=\"true\">,</mo><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">x,y,z</annotation></semantics></math></span>에 대하여 다음 제시문을 읽고 물음에 답하시오.</p>\n<div class=\"box\">\n<p>(가) 실수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>와 음이 아닌 정수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>l</mi><mo separator=\"true\">,</mo><mi>m</mi><mo separator=\"true\">,</mo><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">l,m,n</annotation></semantics></math></span>에 대하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><msup><mi>x</mi><mi>l</mi></msup><msup><mi>y</mi><mi>m</mi></msup><msup><mi>z</mi><mi>n</mi></msup></mrow><annotation encoding=\"application/x-tex\">ax^ly^mz^n</annotation></semantics></math></span> 꼴의 식을 <u>단항식</u>, 단항식들의 합으로 나타낸 식을 <u>다항식</u>이라 한다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>을 포함한 실수도 다항식으로 본다.</p>\n<p>(나) 두 다항식 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo separator=\"true\">,</mo><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">p,q</annotation></semantics></math></span>에 어떤 실수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi><mo separator=\"true\">,</mo><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">a,b,c</annotation></semantics></math></span>를 대입(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mi>a</mi><mo separator=\"true\">,</mo><mi>y</mi><mo>=</mo><mi>b</mi><mo separator=\"true\">,</mo><mi>z</mi><mo>=</mo><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">x=a,y=b,z=c</annotation></semantics></math></span>)하여 얻은 값이 서로 다르면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>는 서로 다른 다항식이다.</p>\n<p>(다) 계수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>인 단항식 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mi>l</mi></msup><msup><mi>y</mi><mi>m</mi></msup><msup><mi>z</mi><mi>n</mi></msup></mrow><annotation encoding=\"application/x-tex\">x^ly^mz^n</annotation></semantics></math></span>을 <u>기본 단항식</u>이라 하고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>l</mi><mo>+</mo><mi>m</mi><mo>+</mo><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">l+m+n</annotation></semantics></math></span>을 그 차수라 한다.</p>\n<p>(라) 세 다항식 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>p</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><msub><mi>p</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">p_1,p_2,p_3</annotation></semantics></math></span>에 대하여 어떤 다항식 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>q</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><msub><mi>q</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">q_1,q_2,q_3</annotation></semantics></math></span>을 써서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><msub><mi>p</mi><mn>1</mn></msub><msub><mi>q</mi><mn>1</mn></msub><mo>+</mo><msub><mi>p</mi><mn>2</mn></msub><msub><mi>q</mi><mn>2</mn></msub><mo>+</mo><msub><mi>p</mi><mn>3</mn></msub><msub><mi>q</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">r=p_1q_1+p_2q_2+p_3q_3</annotation></semantics></math></span>으로 나타낼 수 있는 기본 단항식 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>p</mi><mn>2</mn></msub><mo separator=\"true\">,</mo><msub><mi>p</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">p_1,p_2,p_3</annotation></semantics></math></span>의 <u>열매</u>라 한다.</p>\n<p>예: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>y</mi><mi>z</mi><mo separator=\"true\">,</mo><mtext> </mtext><msub><mi>p</mi><mn>2</mn></msub><mo>=</mo><mn>7</mn><mi>x</mi><mi>z</mi><mo>+</mo><mn>4</mn><msup><mi>z</mi><mn>2</mn></msup><mo separator=\"true\">,</mo><mtext> </mtext><msub><mi>p</mi><mn>3</mn></msub><mo>=</mo><mn>2</mn><mi>x</mi><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">p_1=x^2+3yz,\\ p_2=7xz+4z^2,\\ p_3=2xy</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>4</mn></msup><mo>=</mo><mo stretchy=\"false\">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>y</mi><mi>z</mi><mo stretchy=\"false\">)</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mo stretchy=\"false\">(</mo><mn>7</mn><mi>x</mi><mi>z</mi><mo>+</mo><mn>4</mn><msup><mi>z</mi><mn>2</mn></msup><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mo>−</mo><mi>x</mi><mi>y</mi><mo stretchy=\"false\">)</mo><mo>+</mo><mo stretchy=\"false\">(</mo><mn>2</mn><mi>x</mi><mi>y</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mn>2</mn><mi>x</mi><mi>z</mi><mo>+</mo><mn>2</mn><msup><mi>z</mi><mn>2</mn></msup><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">x^4=(x^2+3yz)x^2+(7xz+4z^2)(-xy)+(2xy)(2xz+2z^2)</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>4</mn></msup></mrow><annotation encoding=\"application/x-tex\">x^4</annotation></semantics></math></span>은 열매이다.</p></div>","qs":["차수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>인 기본 단항식 가운데 다음 세 다항식의 열매가 <b>아닌</b> 것의 개수를 구하시오.<br><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><mi>x</mi><mi>y</mi><mo>−</mo><mi>x</mi><mi>z</mi><mo>+</mo><mi>y</mi><mi>z</mi><mo separator=\"true\">,</mo><mspace width=\"1em\"/><msub><mi>p</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mi>x</mi><mi>y</mi><mo>−</mo><mi>x</mi><mi>z</mi><mo>−</mo><mn>2</mn><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mi>y</mi><mi>z</mi><mo separator=\"true\">,</mo><mspace width=\"1em\"/><msub><mi>p</mi><mn>3</mn></msub><mo>=</mo><mn>4</mn><mi>x</mi><mi>y</mi><mo>−</mo><mn>2</mn><mi>x</mi><mi>z</mi><mo>−</mo><mn>2</mn><mi>y</mi><mi>z</mi><mo>+</mo><msup><mi>z</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">p_1=2x^2-2xy-xz+yz,\\quad p_2=2xy-xz-2y^2+yz,\\quad p_3=4xy-2xz-2yz+z^2</annotation></semantics></math></span>","실수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>에 대하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mi>y</mi><mi>z</mi><mo separator=\"true\">,</mo><mtext> </mtext><msub><mi>p</mi><mn>2</mn></msub><mo>=</mo><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mi>z</mi><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo separator=\"true\">,</mo><mtext> </mtext><msub><mi>p</mi><mn>3</mn></msub><mo>=</mo><msup><mi>z</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">p_1=x^2-y^2+yz,\\ p_2=ax^2+xz+y^2,\\ p_3=z^2</annotation></semantics></math></span>이다. 기본 단항식 가운데 열매가 아닌 것이 무수히 많도록 하는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>의 값을 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mi>y</mi><mi>z</mi><mo separator=\"true\">,</mo><mtext> </mtext><msub><mi>p</mi><mn>2</mn></msub><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mi>z</mi><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo separator=\"true\">,</mo><mtext> </mtext><msub><mi>p</mi><mn>3</mn></msub><mo>=</mo><msup><mi>z</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">p_1=x^2-y^2+yz,\\ p_2=x^2+xz+y^2,\\ p_3=z^2</annotation></semantics></math></span>의 열매 중 차수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>인 것을 모두 구하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><mo>=</mo><mo stretchy=\"false\">(</mo><mn>2</mn><mi>x</mi><mo>−</mo><mi>z</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><mi>y</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">p_1=(2x-z)(x-y)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>2</mn></msub><mo>=</mo><mo stretchy=\"false\">(</mo><mn>2</mn><mi>y</mi><mo>−</mo><mi>z</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><mi>y</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">p_2=(2y-z)(x-y)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>3</mn></msub><mo>=</mo><mo stretchy=\"false\">(</mo><mn>2</mn><mi>x</mi><mo>−</mo><mi>z</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mn>2</mn><mi>y</mi><mo>−</mo><mi>z</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">p_3=(2x-z)(2y-z)</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>y</mi><mo separator=\"true\">,</mo><mi>z</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x,y,z)=(1,1,2)</annotation></semantics></math></span>를 대입하면 세 식이 모두 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><msub><mi>q</mi><mn>1</mn></msub><mo>+</mo><msub><mi>p</mi><mn>2</mn></msub><msub><mi>q</mi><mn>2</mn></msub><mo>+</mo><msub><mi>p</mi><mn>3</mn></msub><msub><mi>q</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">p_1q_1+p_2q_2+p_3q_3</annotation></semantics></math></span>의 값도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>인데, 기본 단항식의 값은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>2</mn><mi>n</mi></msup><mo mathvariant=\"normal\">≠</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">2^n\\ne0</annotation></semantics></math></span>. (나)에 의해 어떤 기본 단항식도 열매가 아니다. 차수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>인 기본 단항식의 수는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mn>3</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>4</mn></msub><mo>=</mo><mn>15</mn></mrow><annotation encoding=\"application/x-tex\"> {}_3\\mathrm{H}_4=15</annotation></semantics></math></span>이므로 답은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15</mn></mrow><annotation encoding=\"application/x-tex\">15</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">a=-1</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>t</mi><mo separator=\"true\">,</mo><mi>t</mi><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(t,t,0)</annotation></semantics></math></span>에서 세 식이 모두 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mi>l</mi></msup><msup><mi>y</mi><mi>m</mi></msup></mrow><annotation encoding=\"application/x-tex\">x^ly^m</annotation></semantics></math></span>의 값은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>t</mi><mrow><mi>l</mi><mo>+</mo><mi>m</mi></mrow></msup><mo mathvariant=\"normal\">≠</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t^{l+m}\\neq0</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">z</annotation></semantics></math></span>가 없는 기본 단항식은 모두 열매가 아니다(무수히 많다). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo mathvariant=\"normal\">≠</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">a\\ne-1</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><mo>+</mo><msub><mi>p</mi><mn>2</mn></msub><mo>=</mo><mo stretchy=\"false\">(</mo><mi>a</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>z</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">p_1+p_2=(a+1)x^2+z(x+y)</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>4</mn></msup></mrow><annotation encoding=\"application/x-tex\">x^4</annotation></semantics></math></span>이, 이어서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>y</mi><mn>4</mn></msup></mrow><annotation encoding=\"application/x-tex\">y^4</annotation></semantics></math></span>이 열매임을 보일 수 있고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">z^2</annotation></semantics></math></span>도 열매이므로, 열매의 배수가 열매라는 점에서 열매가 아닌 것은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>l</mi><mo>≤</mo><mn>3</mn><mo separator=\"true\">,</mo><mi>m</mi><mo>≤</mo><mn>3</mn><mo separator=\"true\">,</mo><mi>n</mi><mo>≤</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">l\\le3,m\\le3,n\\le1</annotation></semantics></math></span>인 유한 개뿐이다. 따라서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">a=-1</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">a=1</annotation></semantics></math></span>인 경우이다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>≡</mo><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>z</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">x^2\\equiv-\\tfrac12z(x+y)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>y</mi><mn>2</mn></msup><mo>≡</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>y</mi><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">y^2\\equiv x^2+yz</annotation></semantics></math></span> 꼴로 차수를 낮추어 가면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">z^2</annotation></semantics></math></span>을 인수로 갖는 식만 남아, 차수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>인 기본 단항식 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15</mn></mrow><annotation encoding=\"application/x-tex\">15</annotation></semantics></math></span>개가 모두 열매이다. (예: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>3</mn></msup><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">x^3y</annotation></semantics></math></span>는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>⋅</mo><mi>x</mi><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">x^2\\cdot xy</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">x^2</annotation></semantics></math></span>을 바꾸면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">z</annotation></semantics></math></span>가 하나 생기고, 남은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">x^2</annotation></semantics></math></span> 또는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>y</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">y^2</annotation></semantics></math></span>을 한 번 더 바꾸면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">z^2</annotation></semantics></math></span>이 생긴다.)"],"follow":["열매에 임의의 기본 단항식을 곱한 것도 열매임을 설명하시오.","1-1에서 세 다항식이 공통으로 0이 되는 점을 어떻게 찾았는가?"]},{"kind":"기출","src":"2026학년도 수학 C","page":"문항집 15~16쪽","scope":"수학 · 확률과 통계 · 미적분","concept":"같은 것이 있는 순열, 수학적 확률, 수열의 극한, 정적분과 급수, 부분적분법","body":"<p>자연수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>2</mn><mi>n</mi><mo>≤</mo><mi>k</mi><mo>≤</mo><mn>2</mn><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">-2n\\le k\\le 2n</annotation></semantics></math></span>인 정수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>에 대하여, 다음 조건을 모두 만족시키며 좌표평면 위를 움직이는 도둑이 있다.</p>\n<div class=\"box\"><b>조건</b>\n<p>(가) 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>y</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x,y)</annotation></semantics></math></span>에 있는 도둑은 한 번 움직일 때마다 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mi>y</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x+1,y+1)</annotation></semantics></math></span> 또는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mi>y</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x+1,y-1)</annotation></semantics></math></span>까지 최단 거리로 이동한다.</p>\n<p>(나) 도둑은 원점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">O</mi><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm O(0,0)</annotation></semantics></math></span>에서 출발하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">4n</annotation></semantics></math></span>번 움직여 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>4</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>2</mn><mi>k</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(4n,2k)</annotation></semantics></math></span>에 도착한다.</p></div>\n<p>도둑이 지나간 모든 점의 집합을 <u>도주경로</u>라 하자.</p><figure><svg viewBox=\"0 0 360 190\" role=\"img\" aria-label=\"n=2, k=1일 때 도주경로의 예\">\n<g class=\"grid\"><line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"170\"/><line x1=\"75\" y1=\"20\" x2=\"75\" y2=\"170\"/><line x1=\"110\" y1=\"20\" x2=\"110\" y2=\"170\"/><line x1=\"145\" y1=\"20\" x2=\"145\" y2=\"170\"/><line x1=\"180\" y1=\"20\" x2=\"180\" y2=\"170\"/><line x1=\"215\" y1=\"20\" x2=\"215\" y2=\"170\"/><line x1=\"250\" y1=\"20\" x2=\"250\" y2=\"170\"/><line x1=\"285\" y1=\"20\" x2=\"285\" y2=\"170\"/><line x1=\"320\" y1=\"20\" x2=\"320\" y2=\"170\"/><line x1=\"40\" y1=\"25\" x2=\"320\" y2=\"25\"/><line x1=\"40\" y1=\"60\" x2=\"320\" y2=\"60\"/><line x1=\"40\" y1=\"95\" x2=\"320\" y2=\"95\"/><line x1=\"40\" y1=\"130\" x2=\"320\" y2=\"130\"/><line x1=\"40\" y1=\"165\" x2=\"320\" y2=\"165\"/></g>\n<line class=\"ax\" x1=\"30\" y1=\"95\" x2=\"340\" y2=\"95\"/><line class=\"ax\" x1=\"40\" y1=\"180\" x2=\"40\" y2=\"10\"/>\n<polyline class=\"ln\" points=\"40,95 75,60 110,25 145,60 180,95 215,130 250,95 285,60 320,25\"/>\n<circle class=\"pt\" cx=\"40\" cy=\"95\" r=\"2.6\"/><circle class=\"pt\" cx=\"75\" cy=\"60\" r=\"2.6\"/><circle class=\"pt\" cx=\"110\" cy=\"25\" r=\"2.6\"/><circle class=\"pt\" cx=\"145\" cy=\"60\" r=\"2.6\"/><circle class=\"pt\" cx=\"180\" cy=\"95\" r=\"2.6\"/><circle class=\"pt\" cx=\"215\" cy=\"130\" r=\"2.6\"/><circle class=\"pt\" cx=\"250\" cy=\"95\" r=\"2.6\"/><circle class=\"pt\" cx=\"285\" cy=\"60\" r=\"2.6\"/><circle class=\"pt\" cx=\"320\" cy=\"25\" r=\"2.6\"/>\n<text x=\"26\" y=\"108\">O</text><text x=\"342\" y=\"99\">x</text><text x=\"36\" y=\"9\">y</text><text x=\"312\" y=\"16\">(8, 2)</text>\n</svg><figcaption>[그림] n = 2, k = 1일 때 가능한 도주경로의 하나</figcaption></figure>\n<p>경찰은 도둑이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>4</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>2</mn><mi>k</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(4n,2k)</annotation></semantics></math></span>에 도착했다는 제보를 받고, 가능한 모든 도주경로 중 하나를 같은 확률로 골라 수사한다. 고른 도주경로가 세 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>2</mn><mi>n</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,2n)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,0)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mo>−</mo><mn>2</mn><mi>n</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,-2n)</annotation></semantics></math></span> 중 하나를 포함하면 경찰은 <u>단서를 발견</u>한다고 하자.</p>","qs":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n=3</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">k=0,2,4</annotation></semantics></math></span>일 때 경찰이 단서를 발견할 확률을 각각 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>2</mn><mi>n</mi><mo>−</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">k=2n-3</annotation></semantics></math></span>일 때 경찰이 단서를 발견할 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_n</annotation></semantics></math></span>이라 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>n</mi><mo>→</mo><mi mathvariant=\"normal\">∞</mi></mrow></munder><msub><mi>p</mi><mi>n</mi></msub></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\lim_{n\\to\\infty}p_n</annotation></semantics></math></span>을 구하시오.","주어진 자연수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mtext> </mtext><mo stretchy=\"false\">(</mo><mi>n</mi><mo>≥</mo><mn>2</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">n\\ (n\\ge2)</annotation></semantics></math></span>에 대하여 경찰이 단서를 발견할 확률이 최소가 되도록 하는 정수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>의 값을 모두 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>가 1-3에서 구한 값 중 가장 큰 값일 때 경찰이 단서를 발견할 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">q_n</annotation></semantics></math></span>이라 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>n</mi><mo>→</mo><mi mathvariant=\"normal\">∞</mi></mrow></munder><mfrac><mn>1</mn><mi>n</mi></mfrac><mi>ln</mi><mo>⁡</mo><msub><mi>q</mi><mi>n</mi></msub></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\lim_{n\\to\\infty}\\frac1n\\ln q_n</annotation></semantics></math></span>을 구하시오."],"ans":["전체 경로 수는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>4</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mn>2</mn><mi>n</mi><mo>+</mo><mi>k</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{4n}\\mathrm C_{2n+k}</annotation></semantics></math></span>. 세 점을 지나는 경로 수는 차례로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{2n}\\mathrm C_{k}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>n</mi></msub><mo>⋅</mo><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mi>n</mi><mo>+</mo><mi>k</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{2n}\\mathrm C_n\\cdot{}_{2n}\\mathrm C_{n+k}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mo>−</mo><mi>k</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{2n}\\mathrm C_{-k}</annotation></semantics></math></span> (정의되지 않으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>)이고 서로 겹치지 않는다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n=3</annotation></semantics></math></span>: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">k=0</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>402</mn><mn>924</mn></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>67</mn><mn>154</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{402}{924}=\\dfrac{67}{154}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">k=2</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>135</mn><mn>495</mn></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>11</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{135}{495}=\\dfrac3{11}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">k=4</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>15</mn><mn>66</mn></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>5</mn><mn>22</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{15}{66}=\\dfrac5{22}</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>≥</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">n\\ge4</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\ </mo><mi>k</mi><mo>≤</mo><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">0\\le k\\le n</annotation></semantics></math></span>에서는 가운데 점을 지나는 경로가 크게 기여하고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>&gt;</mo><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">k&gt;n</annotation></semantics></math></span>에서는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>k</mi></msub></mrow><mrow><msub><mrow></mrow><mrow><mn>4</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mn>2</mn><mi>n</mi><mo>+</mo><mi>k</mi></mrow></msub></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{{}_{2n}\\mathrm C_k}{{}_{4n}\\mathrm C_{2n+k}}</annotation></semantics></math></span>가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>에 대해 증가함을 이웃한 항의 비로 확인한다.)","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mi>n</mi></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mtext> </mtext><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>n</mi></msub></mrow><mrow><msub><mrow></mrow><mrow><mn>4</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mn>3</mn><mi>n</mi></mrow></msub></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">q_n=\\dfrac{2\\,{}_{2n}\\mathrm C_n}{{}_{4n}\\mathrm C_{3n}}</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyl
