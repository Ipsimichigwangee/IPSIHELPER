120.0 65.0,120.0 68.0,120.0 71.0,120.0 74.0,120.0 77.0,120.0 80.0,120.0 83.0,120.0 86.0,120.0 89.0,120.0 92.0,120.0 95.0,120.0 98.0,120.0 101.0,120.0 104.0,120.0 107.0,120.0 110.0,120.9 113.0,122.5 116.0,124.7 119.0,127.2 122.0,129.9 125.0,132.6 128.0,135.3 131.0,137.8 134.0,140.1 137.0,142.2 140.0,144.0 143.0,145.6 146.0,146.9 149.0,148.0 152.0,148.8 155.0,149.4 158.0,149.8 161.0,150.0 164.0,150.0 167.0,149.8 170.0,149.5 173.0,149.1 176.0,148.5 179.0,147.9 182.0,147.2 185.0,146.4 188.0,145.6 191.0,144.7 194.0,143.8 197.0,142.9 200.0,142.0 203.0,141.0 206.0,140.1 209.0,139.2 212.0,138.2 215.0,137.3 218.0,136.5 221.0,135.6 224.0,134.8 227.0,134.0 230.0,133.2 233.0,132.4 236.0,131.7 239.0,131.0 242.0,130.3 245.0,129.7 248.0,129.1 251.0,128.5 254.0,128.0 257.0,127.5 260.0,127.0 263.0,126.5 266.0,126.1 269.0,125.7 272.0,125.3 275.0,124.9 278.0,124.6 281.0,124.3 284.0,124.0 287.0,123.7 290.0,123.4 293.0,123.2 296.0,123.0 299.0,122.7 302.0,122.5 305.0,122.4 308.0,122.2 311.0,122.0 314.0,121.9 317.0,121.7 320.0,121.6\"/>\n<text x=\"326\" y=\"106\">혈당량</text><text x=\"326\" y=\"124\">글루카곤</text><text x=\"326\" y=\"142\">인슐린</text><text x=\"345\" y=\"188\">시간</text><text x=\"6\" y=\"12\">농도(상댓값)</text>\n</svg><figcaption>[그림] 건강한 사람이 식사한 뒤의 혈당량과 두 호르몬의 혈중 농도</figcaption></figure><div class=\"box\"><b>자료 · 포도당을 마신 뒤의 검사</b><p>세 사람이 공복 상태에서 같은 양의 포도당 용액을 마신 뒤 혈당량(mg/100 mL)과 혈중 인슐린 농도(상댓값)를 측정하였다.</p>\n<table><tr><th colspan=\"2\">시간(분)</th><td>0</td><td>30</td><td>60</td><td>120</td></tr>\n<tr><th rowspan=\"2\">건강한 사람</th><th>혈당량</th><td>90</td><td>140</td><td>120</td><td>95</td></tr><tr><th>인슐린</th><td>1</td><td>6</td><td>4</td><td>1.5</td></tr>\n<tr><th rowspan=\"2\">사람 P</th><th>혈당량</th><td>110</td><td>200</td><td>220</td><td>190</td></tr><tr><th>인슐린</th><td>2</td><td>8</td><td>10</td><td>9</td></tr>\n<tr><th rowspan=\"2\">사람 Q</th><th>혈당량</th><td>130</td><td>250</td><td>300</td><td>280</td></tr><tr><th>인슐린</th><td>0.5</td><td>0.6</td><td>0.6</td><td>0.5</td></tr></table></div>","qs":[],"ans":[],"follow":["문제 2의 (1)의 두 경우를 가려내려면 어떤 검사를 하면 되는가?","두 호르몬이 서로 반대로 작용하는 것의 이점은?"],"groups":[{"parts":["식사 뒤 인슐린이 늘고 글루카곤이 주는 이유와, 두 호르몬이 간에서 하는 일을 설명하시오.","혈당량이 식사 전 수준으로 돌아오는 과정을 음성 피드백으로 설명하시오."],"ans":["혈당량이 높아지면 이자의 β세포가 인슐린을 분비하고 α세포의 글루카곤 분비는 준다. 인슐린은 간에서 포도당을 글리코젠으로 바꾸어 저장하게 하고 세포의 포도당 흡수를 늘린다. 글루카곤은 글리코젠을 포도당으로 분해하게 한다.","혈당량 상승이 인슐린 분비를 일으키고, 그 결과 혈당량이 내려가면 인슐린 분비를 일으킨 자극이 줄어 분비도 준다. 결과가 원인을 억제한다."]},{"parts":["어떤 사람 P는 식사 뒤 혈당량이 높게 오래 유지되는데, 혈중 인슐린 농도는 건강한 사람보다 오히려 높다. P의 몸에서 어떤 일이 일어나고 있다고 추론할 수 있는가? 인슐린이 거의 분비되지 않는 사람과는 어떻게 다른가?","오랫동안 달리기를 할 때 혈당량이 크게 떨어지지 않는 이유를 설명하시오."],"ans":["인슐린은 충분히 나오지만 표적 세포가 인슐린에 제대로 반응하지 못한다. 혈당이 내려가지 않으니 이자는 인슐린을 더 분비한다. 인슐린이 분비되지 않는 경우는 이자의 β세포에 문제가 있는 것이고 인슐린을 넣어 주면 혈당이 내려간다.","혈당량이 내려가면 글루카곤(과 에피네프린)이 분비되어 간의 글리코젠을 포도당으로 분해해 혈액으로 내보낸다."]},{"parts":["자료에서 P와 Q의 혈당량이 높게 유지되는 원인이 서로 어떻게 다른지 근거 수치를 들어 설명하시오.","두 사람에게 같은 양의 인슐린을 주사하면 혈당량이 각각 어떻게 변할지 예측하시오."],"ans":["Q는 혈당량이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>300</mn></mrow><annotation encoding=\"application/x-tex\">300</annotation></semantics></math></span>까지 올라도 인슐린이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.5</mn><mo>∼</mo><mn>0.6</mn></mrow><annotation encoding=\"application/x-tex\">0.5\\sim0.6</annotation></semantics></math></span>으로 거의 늘지 않는다(분비 이상). P는 인슐린이 건강한 사람보다 많이(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span>) 나오는데도 혈당량이 내려가지 않는다(표적 세포의 반응 저하). 인슐린을 주사하면 Q의 혈당량은 뚜렷이 내려가고, P는 조금만 내려간다."]},{"parts":["Q가 인슐린을 주사한 뒤 식사를 걸렀다면 어떤 위험이 있는가? 그때 몸에서 일어나는 반응과 필요한 조치를 말하시오.","또 규칙적인 운동이 P의 혈당 조절에 도움이 되는 이유를 근육 세포의 포도당 이용과 관련지어 추론하시오."],"ans":["들어온 포도당이 없는데 인슐린이 세포의 포도당 흡수를 늘려 저혈당이 된다. 몸은 글루카곤과 에피네프린을 분비해 간의 글리코젠을 분해하지만 주사한 인슐린의 작용을 이기지 못하면 어지럼, 의식 저하가 올 수 있어 당분을 바로 먹어야 한다. 운동 중인 근육은 포도당을 많이 쓰고 흡수를 늘리므로 인슐린의 효과가 약한 P에서도 혈당량이 내려간다."]}]},{"kind":"연습","src":"연습 3 · 항생제와 세균","scope":"생명과학Ⅰ · 생명과학Ⅱ","concept":"돌연변이, 자연 선택, 변이와 적응, 자료 해석, 가설의 검증, 자료의 분포 해석","body":"<p>어떤 세균 집단을 배지에서 여러 세대 기르면서 10세대마다 항생제 내성 세균의 비율을 조사하였다. 10세대부터 60세대까지는 배지에 항생제를 넣었고, 그 뒤에는 넣지 않았다.</p><figure><svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"세대에 따른 항생제 내성 세균의 비율\">\n<line class=\"ax\" x1=\"50\" y1=\"170\" x2=\"340\" y2=\"170\"/><line class=\"ax\" x1=\"50\" y1=\"175\" x2=\"50\" y2=\"14\"/><rect class=\"sand\" x=\"80\" y=\"20\" width=\"150\" height=\"150\"/>\n<text x=\"26\" y=\"174\">0</text><text x=\"26\" y=\"104\">50</text><text x=\"26\" y=\"34\">100</text>\n<polyline class=\"ln\" points=\"50,167.2 80,165.8 110,114 140,51.000000000000014 170,35.60000000000002 200,32.80000000000001 230,44.000000000000014 260,58 290,69.2\"/>\n<circle class=\"pt\" cx=\"50\" cy=\"167.2\" r=\"3\"/><text class=\"c s\" x=\"50\" y=\"184\">0</text><circle class=\"pt\" cx=\"80\" cy=\"165.8\" r=\"3\"/><text class=\"c s\" x=\"80\" y=\"184\">10</text><circle class=\"pt\" cx=\"110\" cy=\"114\" r=\"3\"/><text class=\"c s\" x=\"110\" y=\"184\">20</text><circle class=\"pt\" cx=\"140\" cy=\"51.000000000000014\" r=\"3\"/><text class=\"c s\" x=\"140\" y=\"184\">30</text><circle class=\"pt\" cx=\"170\" cy=\"35.60000000000002\" r=\"3\"/><text class=\"c s\" x=\"170\" y=\"184\">40</text><circle class=\"pt\" cx=\"200\" cy=\"32.80000000000001\" r=\"3\"/><text class=\"c s\" x=\"200\" y=\"184\">50</text><circle class=\"pt\" cx=\"230\" cy=\"44.000000000000014\" r=\"3\"/><text class=\"c s\" x=\"230\" y=\"184\">60</text><circle class=\"pt\" cx=\"260\" cy=\"58\" r=\"3\"/><text class=\"c s\" x=\"260\" y=\"184\">70</text><circle class=\"pt\" cx=\"290\" cy=\"69.2\" r=\"3\"/><text class=\"c s\" x=\"290\" y=\"184\">80</text>\n<text x=\"128\" y=\"160\">항생제를 넣은 기간</text><text x=\"300\" y=\"198\">세대</text><text x=\"6\" y=\"12\">내성 세균의 비율(%)</text>\n</svg><figcaption>[그림] 10세대부터 60세대까지만 배지에 항생제를 넣었다</figcaption></figure><div class=\"box\"><b>토막글 · 두 가설을 가르는 실험</b><p>내성이 생기는 까닭에 대해 두 가설이 있다. 가설 Ⅰ: 세균이 항생제를 만난 뒤 그 자극으로 내성이 생긴다. 가설 Ⅱ: 항생제와 상관없이 증식 중에 우연히 내성 돌연변이가 생긴다.</p><p>연구자는 내성이 없는 세균 몇 마리씩을 시험관 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span>개에 넣고 항생제가 없는 배지에서 같은 시간 동안 증식시켰다. 그다음 각 시험관의 세균을 모두 항생제가 든 접시에 옮겨 살아남아 무리를 이룬 군체의 수를 세었다.</p>\n<table><tr><th>시험관</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>군체 수</th><td>0</td><td>1</td><td>0</td><td>3</td><td>0</td><td>0</td><td>107</td><td>2</td><td>0</td><td>5</td></tr></table></div>","qs":[],"ans":[],"follow":["내성 비율이 100 %에 이르지 않은 이유로 무엇을 생각할 수 있는가?","이 실험에 대조군을 둔다면 어떻게 설계하겠는가?"],"groups":[{"parts":["10세대에서 50세대 사이에 내성 세균의 비율이 높아진 과정을 설명하시오.","\"세균이 살아남으려고 항생제에 견디도록 변했다\"는 설명은 어디가 잘못되었는가? 그래프의 0세대 값을 근거로 말하시오."],"ans":["집단에는 처음부터 내성이 있는 개체가 조금 있었다. 항생제가 있는 환경에서 내성이 없는 개체는 죽거나 덜 증식하고 내성 개체가 더 많은 자손을 남겨, 세대를 거듭하며 비율이 높아졌다(자연 선택).","항생제를 넣기 전인 0세대에 이미 내성 세균이 2 % 있었다. 변이는 항생제와 상관없이 생기고, 항생제는 이미 있던 변이 가운데 유리한 것을 골라냈을 뿐이다."]},{"parts":["항생제를 뺀 60세대 이후 내성 세균의 비율이 서서히 낮아졌다. 이 결과에서 추론할 수 있는 것은?","내성 세균이 퍼지는 속도를 늦추는 방법을 두 가지 제시하고 각각의 근거를 위 실험 결과와 관련지어 설명하시오."],"ans":["항생제가 없는 환경에서는 내성이 오히려 불리하다. 내성을 유지하는 데 에너지나 물질이 들어 증식이 조금 느리기 때문으로 볼 수 있다. 유리한 형질은 환경에 따라 달라진다.","꼭 필요할 때만 항생제를 쓴다(선택 압력을 줄이면 문제 2의 (1)처럼 비율이 낮아진다). 처방받은 기간을 지켜 세균을 충분히 없앤다(살아남은 내성 개체가 다시 늘 기회를 줄인다). 감염 자체를 줄이는 위생 관리도 근거를 대면 인정한다."]},{"parts":["가설 Ⅰ과 Ⅱ가 옳다면 시험관마다 군체 수가 각각 어떤 모습으로 나타나야 하는지 예상하시오.","위 결과는 어느 가설을 뒷받침하는가?"],"ans":["가설 Ⅰ: 모든 세균이 항생제를 만났을 때 같은 작은 확률로 내성을 얻으므로 시험관마다 군체 수가 비슷하다. 가설 Ⅱ: 증식 중 돌연변이가 생겼는지, 언제 생겼는지에 따라 시험관마다 크게 다르다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>이 다섯이고 하나만 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>107</mn></mrow><annotation encoding=\"application/x-tex\">107</annotation></semantics></math></span>인 결과는 가설 Ⅱ를 뒷받침한다."]},{"parts":["7번 시험관에서만 군체가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>107</mn></mrow><annotation encoding=\"application/x-tex\">107</annotation></semantics></math></span>개 나온 까닭을 돌연변이가 생긴 시점과 관련지어 설명하시오.","이 실험에서 한 시험관의 결과만 보았다면 어떤 잘못된 결론에 이를 수 있는지, 그리고 그래프(그림)의 0세대에 내성 세균이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">2\\,\\%</annotation></semantics></math></span> 있었다는 사실과 이 실험이 어떻게 이어지는지 말하시오."],"ans":["7번에서는 증식 초기에 돌연변이가 생겨 그 자손이 여러 세대 동안 불어났다. 늦게 생긴 시험관은 자손이 적고, 생기지 않은 시험관은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>이다. 군체가 0인 시험관만 보면 \"내성은 생기지 않는다\", 7번만 보면 \"항생제가 내성을 많이 만든다\"고 잘못 볼 수 있다. 항생제를 넣기 전부터 내성 개체가 있다는 것이 이 실험의 결론이며, 0세대의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">2\\,\\%</annotation></semantics></math></span>가 바로 그런 개체이다."]}]},{"kind":"연습","src":"연습 4 · 두 번째 침입","scope":"생명과학Ⅰ","concept":"특이적 방어 작용, 1차·2차 면역 반응, 기억 세포, 백신, 유전 정보의 흐름, 집단 수준의 방어","body":"<p>그림은 같은 항원이 시간 간격을 두고 두 번 몸에 들어왔을 때 혈중 항체 농도의 변화를 나타낸 것이다.</p><figure><svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"같은 항원이 두 번 들어왔을 때 혈중 항체 농도의 변화\">\n<line class=\"ax\" x1=\"50\" y1=\"170\" x2=\"340\" y2=\"170\"/><line class=\"ax\" x1=\"50\" y1=\"175\" x2=\"50\" y2=\"14\"/>\n<polyline class=\"ln\" points=\"50.0,170.0 52.0,170.0 54.0,170.0 56.0,170.0 58.0,170.0 60.0,170.0 62.0,170.0 64.0,170.0 65.9,170.0 67.9,170.0 69.9,170.0 71.9,170.0 73.9,170.0 75.9,170.0 77.9,170.0 79.9,170.0 81.9,170.0 83.9,170.0 85.9,170.0 87.9,170.0 89.9,170.0 91.8,170.0 93.8,170.0 95.8,170.0 97.8,169.7 99.8,168.5 101.8,166.5 103.8,164.1 105.8,161.3 107.8,158.4 109.8,155.6 111.8,152.8 113.8,150.1 115.8,147.7 117.8,145.5 119.8,143.6 121.7,141.9 123.7,140.5 125.7,139.3 127.7,138.4 129.7,137.7 131.7,137.3 133.7,137.1 135.7,137.0 137.7,137.1 139.7,137.4 141.7,137.8 143.7,138.3 145.7,139.0 147.6,139.7 149.6,140.5 151.6,141.3 153.6,142.2 155.6,143.2 157.6,144.1 159.6,145.1 161.6,146.1 163.6,147.1 165.6,148.1 167.6,149.1 169.6,150.0 171.6,151.0 173.6,151.9 175.6,152.8 177.5,153.7 179.5,154.6 181.5,155.4 183.5,156.2 185.5,157.0 187.5,157.7 189.5,158.4 191.5,159.1 193.5,159.8 195.5,160.4 197.5,161.0 199.5,161.5 201.5,162.1 203.5,162.6 205.4,163.0 207.4,163.5 209.4,162.8 211.4,157.8 213.4,149.6 215.4,139.4 217.4,127.9 219.4,115.8 221.4,103.6 223.4,91.9 225.4,80.8 227.4,70.5 229.4,61.2 231.3,53.0 233.3,46.0 235.3,40.1 237.3,35.3 239.3,31.5 241.3,28.8 243.3,27.0 245.3,26.1 247.3,26.0 249.3,26.6 251.3,27.9 253.3,29.8 255.3,32.2 257.3,35.0 259.3,38.1 261.2,41.6 263.2,45.4 265.2,49.3 267.2,53.4 269.2,57.6 271.2,61.9 273.2,66.2 275.2,70.6 277.2,74.9 279.2,79.2 281.2,83.4 283.2,87.6 285.2,91.6 287.1,95.6 289.1,99.5 291.1,103.2 293.1,106.8 295.1,110.3 297.1,113.6 299.1,116.8 301.1,119.9 303.1,122.9 305.1,125.7 307.1,128.3 309.1,130.9 311.1,133.3 313.1,135.6 315.1,137.8 317.0,139.8 319.0,141.8 321.0,143.6 323.0,145.3 325.0,147.0 327.0,148.5 329.0,150.0\"/>\n<line class=\"dash\" x1=\"81\" y1=\"170\" x2=\"81\" y2=\"20\"/><line class=\"dash\" x1=\"205\" y1=\"170\" x2=\"205\" y2=\"20\"/>\n<text class=\"c s\" x=\"81\" y=\"184\">1차 침입</text><text class=\"c s\" x=\"205\" y=\"184\">2차 침입</text><text x=\"310\" y=\"188\">시간</text><text x=\"6\" y=\"12\">혈중 항체 농도</text>\n</svg><figcaption>[그림] 같은 항원이 시간 간격을 두고 두 번 몸에 들어왔을 때</figcaption></figure><div class=\"box\"><b>토막글 · 새로운 백신과 집단 면역</b><p>(가) 어떤 백신은 병원체의 항원 단백질을 만드는 정보가 담긴 mRNA를 지질 막에 싸서 주사한다. mRNA는 세포질로 들어가 리보솜에서 번역되어 항원 단백질이 만들어지고, 얼마 뒤 분해된다.</p><p>(나) 면역이 없는 집단에서 감염자 한 사람이 평균 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>명에게 병을 옮기는 감염병이 있다. 집단에서 면역을 가진 사람의 비율이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>이면 감염자 한 사람이 옮기는 사람 수는 평균 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">4(1-p)</annotation></semantics></math></span>명이 된다.</p></div>","qs":[],"ans":[],"follow":["그래프에서 2차 침입 뒤 항체 농도가 다시 내려가는 이유는?","다른 종류의 항원이 2차로 들어왔다면 그래프는 어떤 모양인가?"],"groups":[{"parts":["1차 침입 때 항체가 만들어지기까지의 과정을 림프구의 종류를 들어 설명하시오.","2차 침입 때 항체가 더 빨리, 더 많이 만들어지는 이유를 설명하시오."],"ans":["대식 세포가 항원을 삼켜 조각을 내보이면 보조 T 림프구가 이를 알아보고 활성화되어, 그 항원에 맞는 B 림프구를 형질 세포와 기억 세포로 분화시킨다. 형질 세포가 항체를 만든다.","1차 때 만들어진 기억 세포가 남아 있다가 같은 항원을 만나면 빠르게 분열하여 형질 세포로 분화한다."]},{"parts":["백신의 원리를 이 그래프로 설명하시오. 독감 백신을 해마다 다시 맞는 이유는 무엇인가?","독사에게 물린 사람에게는 백신이 아니라 이미 만들어진 항체를 주사한다. 이유와 이 방법의 한계를 말하시오."],"ans":["병을 일으키지 않게 만든 항원을 미리 넣어 1차 면역 반응을 일으키고 기억 세포를 만들어 둔다. 실제 병원체가 들어오면 2차 면역 반응이 일어난다. 독감 바이러스는 항원의 모양이 자주 바뀌어 예전의 기억 세포가 알아보지 못한다.","독은 빨리 퍼지는데 1차 면역 반응은 항체가 생기기까지 시간이 걸린다. 주사한 항체는 곧바로 독을 없애지만 기억 세포가 생기지 않고 시간이 지나면 분해되어 효과가 오래가지 않는다."]},{"parts":["(가)의 백신이 병원체나 그 단백질을 직접 넣는 백신과 다른 점을 유전 정보의 흐름(전사, 번역)으로 설명하시오.","이 mRNA가 사람 세포의 DNA에 담긴 유전 정보를 바꾸지 않는다고 보는 근거를 (가)에서 찾아 말하시오."],"ans":["항원 자체가 아니라 항원을 만드는 설계도를 넣고, 사람 세포가 번역하여 항원을 만든다. 그 뒤의 면역 반응(1차 반응, 기억 세포 형성)은 같다. mRNA는 번역이 일어나는 세포질에서 쓰이고 분해되며, 유전 정보는 DNA → RNA → 단백질 방향으로 흐르므로 RNA가 핵 속 DNA의 정보를 고쳐 쓰지 않는다."]},{"parts":["(나)에서 감염이 퍼지지 않고 줄어들려면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>가 얼마보다 커야 하는가? 한 사람이 평균 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span>명에게 옮기는 병이라면 어떠한가?","백신을 맞을 수 없는 사람이 있는 사회에서 이 계산이 갖는 의미를 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy=\"false\">)</mo><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">4(1-p)&lt;1</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mn>0.75</mn></mrow><annotation encoding=\"application/x-tex\">p&gt;0.75</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span>명이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mn>0.9</mn></mrow><annotation encoding=\"application/x-tex\">p&gt;0.9</annotation></semantics></math></span>. 면역을 가진 사람이 이 비율을 넘으면 감염자가 생겨도 이어지지 못해, 백신을 맞지 못한 사람도 보호받는다. 잘 퍼지는 병일수록 더 많은 사람이 면역을 가져야 한다."]}]},{"kind":"기출","src":"2026학년도 생명과학 문제 1","page":"문항집 53~56쪽","scope":"생명과학Ⅰ · 생명과학Ⅱ","concept":"세포 골격, 미세 소관, 미세 섬유, 원핵세포와 진핵세포, 체세포 분열, 골격근의 수축","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"body":"<p>동물 세포에는 단백질로 된 세포 골격이 있고, 미세 소관, 미세 섬유, 중간 섬유로 나뉜다. 미세 섬유는 액틴, 미세 소관은 튜불린이라는 단백질로 이루어져 있다. 연구진은 같은 배양 조건에서 액틴의 활성을 저해하는 약물 X와 튜불린의 활성을 저해하는 약물 Y를 써서 세포를 다음 기준으로 관찰하였다.</p>\n<div class=\"box\"><b>기준</b><p>형태 안정성: 외부 자극 뒤 정상 세포의 형태가 유지되는 비율<br>분열 성공률: 세포 분열 뒤 정상적이고 완전한 분열을 이룬 세포의 비율<br>물질 이동 효율: 특정 물질이 목표 지점에 도달하는 비율</p></div>\n<table><tr><th rowspan=\"2\">(대조군은 모두 1)</th><th colspan=\"2\">[그림 1-2] 인간 세포</th><th colspan=\"2\">[그림 1-3] 대장균</th></tr><tr><th>X 처리</th><th>Y 처리</th><th>X 처리</th><th>Y 처리</th></tr>\n<tr><th>형태 안정성</th><td>낮음</td><td>낮음</td><td>중간</td><td>높음</td></tr><tr><th>분열 성공률</th><td>낮음</td><td>낮음</td><td>높음</td><td>낮음</td></tr><tr><th>물질 이동 효율</th><td>낮음</td><td>낮음</td><td>높음</td><td>높음</td></tr></table>\n<p>원핵생물에도 구조가 비슷한 액틴 유사체와 튜불린 유사체가 있고, 약물 X와 Y는 이들에도 같은 방식으로 작용한다.</p>","qs":["(1) 그림 1-2를 바탕으로 액틴과 튜불린이 진핵세포에서 하는 기능을 설명하시오.<br>(2) 인간 체세포에 약물 X와 Y를 각각 처리하면 체세포 분열의 어느 단계에서 이상이 생길지 판단하고 이유를 설명하시오.<br>(3) 분화된 인간 세포 a에 약물 Y를 처리했더니 스스로 이동하는 능력이 급격히 줄었다. 세포 a가 어떤 세포인지 추론하고 이유를 설명하시오.","(1) 약물 X가 대장균의 형태 안정성에 준 영향은 동물 세포에 비해 작다. 이유를 설명하시오.<br>(2) 대장균에 약물 Y를 처리하면 DNA 복제와 DNA의 세포질 내 위치 분리는 정상인데 대장균의 모양이 길어졌다. 이 관찰과 그림 1-3으로 대장균의 세포 분열에서 튜불린 유사체의 기능을 추론하고, 진핵생물에서 튜불린의 기능과 어떻게 다른지 설명하시오.","연구진은 원핵생물에서 진핵생물로의 진화가 세포 내 물질 이동 방식의 변화를 일으켰다고 결론지었다.<br>(1) 대장균 안에서 물질 이동이 어떤 방식으로 이루어지는지 설명하고, 약물 X, Y가 물질 이동 효율에 영향을 주지 않은 이유를 설명하시오.<br>(2) 진화 과정에서 세포 구조가 어떻게 변했는지, 그 변화가 세포 내 물질 이동에 어떤 어려움을 가져왔는지 설명하시오.<br>(3) 그 어려움을 진핵생물의 세포 골격이 어떻게 해결했는지 설명하시오.","(1) 같은 쥐에서 얻은 근육 세포(골격근)와 간세포로 자극에 따른 수축 정도를 약물 X 처리 여부에 따라 비교하였다. 두 세포에서 미세 섬유의 배열 방식이 어떻게 다른지 설명하고 그림 1-4를 해석하시오.<figure><svg viewBox=\"0 0 360 180\" role=\"img\" aria-label=\"자극의 세기에 따른 근육 세포와 간세포의 수축 정도\">\n<line class=\"ax\" x1=\"50\" y1=\"150\" x2=\"340\" y2=\"150\"/><line class=\"ax\" x1=\"50\" y1=\"155\" x2=\"50\" y2=\"14\"/><line class=\"dash\" x1=\"50\" y1=\"30\" x2=\"250\" y2=\"30\"/>\n<polyline class=\"ln\" points=\"50.0,150.0 54.0,137.5 58.0,126.3 62.0,116.3 66.0,107.3 70.0,99.2 74.0,92.0 78.0,85.6 82.0,79.8 86.0,74.6 90.0,69.9 94.0,65.8 98.0,62.1 102.0,58.7 106.0,55.7 110.0,53.0 114.0,50.6 118.0,48.5 122.0,46.6 126.0,44.8 130.0,43.3 134.0,41.9 138.0,40.7 142.0,39.6 146.0,38.6 150.0,37.7 154.0,36.9 158.0,36.2 162.0,35.5 166.0,34.9 170.0,34.4 174.0,34.0 178.0,33.6 182.0,33.2 186.0,32.9 190.0,32.6 194.0,32.3 198.0,32.0 202.0,31.8 206 aption>[그림 1-5] 근육 원섬유 마디 R. M선을 기준으로 좌우 대칭이다 (I대는 Z선 한쪽의 길이)</figcaption></figure><br>(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">t_1</annotation></semantics></math></span>의 H대) : (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">t_1</annotation></semantics></math></span>의 I대) <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>3</mn><mo>:</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">=3:2</annotation></semantics></math></span><br>(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">t_1</annotation></semantics></math></span>의 I대) : (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">t_2</annotation></semantics></math></span>의 I대) <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>3</mn><mo>:</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">=3:2</annotation></semantics></math></span><br>(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">t_2</annotation></semantics></math></span>의 R의 길이) : {(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">t_2</annotation></semantics></math></span>의 A대) <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo></mrow><annotation encoding=\"application/x-tex\">-</annotation></semantics></math></span> (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">t_2</annotation></semantics></math></span>의 H대)} <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>2</mn><mo>:</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">=2:1</annotation></semantics></math></span>"],"ans":["실험 자료를 해석하는 능력, 세포 골격의 역할과 세포 분열에서의 역할, 편모가 운동 기관이며 튜불린으로 이루어져 있음을 아는지 본다.","원핵세포의 세포벽이 형태 안정성에 미치는 영향, 진화에 따른 세포 구조의 변화를 알고 자료와 지식을 연결해 추론하는지 본다.","원핵생물의 세포 구조 특성과 진핵생물로의 구조 변화를 알고, 이를 세포 골격의 기능 확장과 연결해 이해하는지 본다.","같은 세포 골격이 세포의 특성에 따라 기능이 특화될 수 있음을 이해하는지, 근육 원섬유 마디의 활주설로 실험 결과를 추론하는지 본다."]},{"kind":"기출","src":"2026학년도 생명과학 문제 2","page":"문항집 60~63쪽","scope":"생명과학Ⅰ · 생명과학Ⅱ","concept":"멘델 유전, 자연 선택, 하디-바인베르크 법칙, 생물의 발생","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"qnum":2,"body":"<p>(가) 경주마로 좋은 성적을 거두었고 신체 기능과 성체 발달이 정상인 암말 '솔바람'과 '휘파람'은 은퇴하여 번식용으로 사육된다. '솔바람'을 생식 능력에 이상이 없는 수말과 교배하면 항상 건강한 자손이 태어난다. '휘파람'은 여러 차례 교배에 실패했고, 인공 수정한 수정란은 항상 2~4세포기에서 분열이 멈추고 죽었다.</p>\n<p>(나) '휘파람'은 상염색체의 M 유전자가 열성 동형 접합(mm)이다. M은 m에 대해 완전 우성이다.</p>\n<p>(다) 유전자형이 mm인 수말을 '솔바람'과 교배하면 항상 건강한 자손이 태어난다.</p>\n<p>(라) 핵을 제거한 '솔바람' 난자의 세포질에 '휘파람'의 난자 핵을 넣고 건강한 수말의 정자로 인공 수정하여 '솔바람'의 자궁에 착상시키면 정상 자손이 발생했다. 반대로 핵을 제거한 '휘파람' 난자의 세포질에 '솔바람'의 난자 핵을 넣어 같은 과정을 거치면 수정란이 배아 발생 중 멈췄다.</p>\n<p>(마) 말의 N 유전자에 의한 질환은 상염색체 열성 유전 질환이며, 열성 동형 접합(nn)인 수정란은 배아 발생 중 멈춘다.</p>\n<p>(바) N 유전자는 갈기 색도 결정한다. NN이면 검은색, Nn이면 갈색이다.</p>","qs":["'휘파람'을 낳은 부모는 모두 건강하였고 모두 열 마리를 낳았는데, 그중 '휘파람'만 자손을 낳지 못했다.<br>(1) '휘파람' 부모의 M 유전자형을 모계와 부계에서 각각 추론하시오.<br>(2) '솔바람'의 M 유전자형을 추론하시오.<br>(3) '휘파람'이 성체까지 정상으로 발달할 수 있었던 이유와, '휘파람'의 난자에서 생긴 모든 수정란의 배아 발생이 멈춘 이유를 M 유전자의 기능을 고려해 추론하시오.","두 야생마 집단 P와 Q를 조사하였다. (사) P에서 검은색 갈기를 가진 말은 일곱 마리당 세 마리이다. (아) Q에서는 세 마리당 두 마리이다. (자) 두 집단은 각각 격리되어 있고, 충분히 크며, 새로운 돌연변이가 없고, 교배는 무작위로 일어난다. 현재 두 집단의 크기는 같다.<br>(1) P와 Q에서 현재 우성 대립유전자 N의 빈도를 각각 구하시오.<br>(2) 두 집단에서 갈색 갈기를 가진 개체 수가 시간(세대 수)에 따라 어떻게 변하는지, 두 집단의 변화 양상이 어떻게 다른지 정성적으로 추론하여 그래프로 그리시오.","'휘파람'과 '솔바람'이 속한 경주마 집단 R을 조사하였다. (차) 유전자형이 mm인 말은 백 마리당 한 마리이다. (카) 암말과 수말의 수는 같다. (타) 생식 능력은 M 유전자로만 결정된다. (파) 집단 R은 격리되어 있고, 충분히 크며, 새로운 돌연변이가 없고, 교배는 무작위로 일어난다.<br>(1) 집단 R의 다음 세대에서 불임인 말의 빈도를 구하고 이유를 설명하시오.<br>(2) 열성 대립유전자 m과 n의 빈도가 시간에 따라 어떻게 변할지 서로 비교하여 설명하시오."],"ans":["멘델 유전 원리를 이해하고, 양방향으로 설계된 실험과 관찰 결과를 해석하여 문제를 해결할 수 있는지 본다.","멘델의 유전 법칙과 하디-바인베르크 법칙의 관계를 이해하고, 발생 실패가 자연 선택에 주는 영향과 불리한 대립유전자의 초깃값이 선택 속도에 주는 영향을 그래프로 엄밀하게 나타낼 수 있는지 본다.","하디-바인베르크 법칙의 각 항의 뜻을 이해하고 응용하는지, 자연 선택의 개념을 명확히 이해하는지 본다."]}],"earth":[{"kind":"연습","src":"연습 1 · 별빛이 어두워질 때","scope":"지구과학Ⅰ","concept":"외계 행성계 탐사(식 현상, 시선 속도 변화), 생명 가능 지대, 공통 질량 중심, 케플러 법칙의 적용, 밀도 추정","body":"<p>어느 별의 밝기를 30일 동안 관측하였더니 그림과 같이 밝기가 일정한 간격으로 잠깐씩 줄어들었다. 이 별의 반지름과 질량은 태양과 같다. 태양의 반지름은 목성 반지름의 약 10배, 지구 반지름의 약 100배이다.</p><figure><svg viewBox=\"0 0 380 190\" role=\"img\" aria-label=\"30일 동안 관측한 별의 밝기 변화 그래프\">\n<line class=\"ax\" x1=\"50\" y1=\"160\" x2=\"345\" y2=\"160\"/><line class=\"ax\" x1=\"50\" y1=\"165\" x2=\"50\" y2=\"14\"/>\n<line class=\"dash\" x1=\"50\" y1=\"130\" x2=\"335\" y2=\"130\"/>\n<polyline class=\"ln\" points=\"50.0,50.0 51.0,50.0 51.9,50.0 52.9,50.0 53.8,50.0 54.8,50.0 55.7,50.0 56.6,50.0 57.6,50.0 58.5,50.0 59.5,50.0 60.5,50.0 61.4,50.0 62.4,50.0 63.3,50.0 64.3,50.0 65.2,50.0 66.2,50.0 67.1,50.0 68.0,50.0 69.0,50.0 70.0,50.0 70.9,50.0 71.8,50.0 72.8,50.0 73.8,50.0 74.7,103.3 75.7,130.0 76.6,130.0 77.5,130.0 78.5,130.0 79.5,130.0 80.4,130.0 81.3,130.0 82.3,103.3 83.3,50.0 84.2,50.0 85.2,50.0 86.1,50.0 87.0,50.0 88.0,50.0 88.9,50.0 89.9,50.0 90.8,50.0 91.8,50.0 92.8,50.0 93.7,50.0 94.7,50.0 95.6,50.0 96.6,50.0 97.5,50.0 98.4,50.0 99.4,50.0 100.3,50.0 101.3,50.0 102.3,50.0 103.2,50.0 104.2,50.0 105.1,50.0 106.1,50.0 107.0,50.0 107.9,50.0 108.9,50.0 109.8,50.0 110.8,50.0 111.8,50.0 112.7,50.0 113.7,50.0 114.6,50.0 115.5,50.0 116.
