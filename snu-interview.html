notation></semantics></math></span>."],"follow":["세 사건이 동시에 일어날 수 없는 이유를 설명하시오.","ln x의 정적분에서 x=0 근처를 어떻게 다루었는가?"]},{"kind":"연습","src":"연습 1 · 동전으로 만들 수 있는 금액","scope":"수학 · 수학Ⅰ","concept":"명제와 증명(귀류법), 수학적 귀납법, 경우의 수, 대칭성, 일대일 대응","body":"<p>자연수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>을 음이 아닌 정수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">a,b</annotation></semantics></math></span>를 써서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mn>3</mn><mi>a</mi><mo>+</mo><mn>5</mn><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">N=3a+5b</annotation></semantics></math></span> 꼴로 나타낼 수 있을 때, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>을 <u>만들 수 있는 수</u>라 하자. 예를 들어 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>11</mn><mo>=</mo><mn>3</mn><mo>×</mo><mn>2</mn><mo>+</mo><mn>5</mn><mo>×</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">11=3\\times2+5\\times1</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>11</mn></mrow><annotation encoding=\"application/x-tex\">11</annotation></semantics></math></span>은 만들 수 있는 수이다.</p><figure><svg viewBox=\"0 0 360 96\" role=\"img\" aria-label=\"3과 5로 나타낼 수 있는 수와 없는 수를 수직선에 표시\">\n<rect class=\"cell\" x=\"12\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"22\" y=\"46\">1</text><rect class=\"cell\" x=\"36\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"46\" y=\"46\">2</text><rect class=\"cell on\" x=\"60\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"70\" y=\"46\">3</text><rect class=\"cell\" x=\"84\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"94\" y=\"46\">4</text><rect class=\"cell on\" x=\"108\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"118\" y=\"46\">5</text><rect class=\"cell on\" x=\"132\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"142\" y=\"46\">6</text><rect class=\"cell\" x=\"156\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"166\" y=\"46\">7</text><rect class=\"cell on\" x=\"180\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"190\" y=\"46\">8</text><rect class=\"cell on\" x=\"204\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"214\" y=\"46\">9</text><rect class=\"cell on\" x=\"228\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"238\" y=\"46\">10</text><rect class=\"cell on\" x=\"252\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"262\" y=\"46\">11</text><rect class=\"cell on\" x=\"276\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"286\" y=\"46\">12</text><rect class=\"cell on\" x=\"300\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"310\" y=\"46\">13</text><rect class=\"cell on\" x=\"324\" y=\"28\" width=\"20\" height=\"26\" rx=\"3\"/><text class=\"c s\" x=\"334\" y=\"46\">14</text>\n<text x=\"12\" y=\"82\" class=\"s\">색칠한 수는 3a + 5b 꼴로 나타낼 수 있다</text>\n</svg><figcaption>[그림] 1부터 14까지의 자연수</figcaption></figure><div class=\"box\"><b>토막글 · 짝을 이루는 수</b><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> 이외의 공약수가 없는 두 자연수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo separator=\"true\">,</mo><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">p,q</annotation></semantics></math></span>에 대하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mi>p</mi><mi>q</mi><mo>−</mo><mi>p</mi><mo>−</mo><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">N=pq-p-q</annotation></semantics></math></span>라 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span> 이상 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span> 이하의 정수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>에 대하여 다음 성질이 알려져 있다.</p><p>(성질) <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>−</mo><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">N-n</annotation></semantics></math></span> 가운데 <b style=\"display:inline\">꼭 하나만</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mi>a</mi><mo>+</mo><mi>q</mi><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">pa+qb</annotation></semantics></math></span> (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">a,b</annotation></semantics></math></span>는 음이 아닌 정수) 꼴로 나타낼 수 있다. 여기서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>=</mo><mi>p</mi><mo>⋅</mo><mn>0</mn><mo>+</mo><mi>q</mi><mo>⋅</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0=p\\cdot0+q\\cdot0</annotation></semantics></math></span>도 나타낼 수 있는 수로 본다.</p></div>","qs":[],"ans":[],"follow":["문제 2의 (2)의 결과가 문제 1의 (1), 문제 2의 (1)의 답과 맞는지 확인하시오.","30을 3a + 5b 꼴로 나타내는 방법은 몇 가지인가? (답: 3가지)"],"groups":[{"parts":["만들 수 없는 자연수를 모두 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">8</annotation></semantics></math></span> 이상의 모든 자연수는 만들 수 있는 수임을 증명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>4</mn><mo separator=\"true\">,</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">1,2,4,7</annotation></semantics></math></span>. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo separator=\"true\">,</mo><mn>5</mn><mo separator=\"true\">,</mo><mn>6</mn><mo separator=\"true\">,</mo><mn>8</mn><mo separator=\"true\">,</mo><mn>9</mn><mo separator=\"true\">,</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">3,5,6,8,9,10</annotation></semantics></math></span>은 직접 확인.)","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn><mo>=</mo><mn>3</mn><mo>+</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">8=3+5</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9</mn><mo>=</mo><mn>3</mn><mo>×</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">9=3\\times3</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn><mo>=</mo><mn>5</mn><mo>×</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">10=5\\times2</annotation></semantics></math></span>가 만들 수 있는 수이고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>을 만들 수 있으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>+</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">N+3</annotation></semantics></math></span>도 만들 수 있다(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> 늘린다). 따라서 수학적 귀납법으로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">8</annotation></semantics></math></span> 이상은 모두 가능하다."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mn>3</mn><mi>a</mi><mo>+</mo><mn>7</mn><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">N=3a+7b</annotation></semantics></math></span> 꼴로 바꾸었을 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>11</mn></mrow><annotation encoding=\"application/x-tex\">11</annotation></semantics></math></span>은 만들 수 없음을 보이고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">12</annotation></semantics></math></span> 이상의 모든 자연수는 만들 수 있음을 설명하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> 이외의 공약수가 없는 두 자연수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo separator=\"true\">,</mo><mi>q</mi><mtext> </mtext><mo stretchy=\"false\">(</mo><mi>p</mi><mo separator=\"true\">,</mo><mi>q</mi><mo>≥</mo><mn>2</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">p,q\\ (p,q\\ge2)</annotation></semantics></math></span>에 대하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mi>q</mi><mo>−</mo><mi>p</mi><mo>−</mo><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">pq-p-q</annotation></semantics></math></span>는 음이 아닌 정수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">a,b</annotation></semantics></math></span>로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mi>a</mi><mo>+</mo><mi>q</mi><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">pa+qb</annotation></semantics></math></span> 꼴로 나타낼 수 없음을 증명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>11</mn><mo>−</mo><mn>7</mn><mi>b</mi><mtext> </mtext><mo stretchy=\"false\">(</mo><mi>b</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">11-7b\\ (b=0,1)</annotation></semantics></math></span>은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>11</mn><mo separator=\"true\">,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">11,4</annotation></semantics></math></span>로 모두 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">3</annotation></semantics></math></span>의 배수가 아니다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn><mo>=</mo><mn>3</mn><mo>×</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">12=3\\times4</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>13</mn><mo>=</mo><mn>3</mn><mo>×</mo><mn>2</mn><mo>+</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">13=3\\times2+7</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>14</mn><mo>=</mo><mn>7</mn><mo>×</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">14=7\\times2</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>→</mo><mi>N</mi><mo>+</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">N\\to N+3</annotation></semantics></math></span>이 가능하므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">12</annotation></semantics></math></span> 이상은 모두 가능하다.","귀류법. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mi>q</mi><mo>−</mo><mi>p</mi><mo>−</mo><mi>q</mi><mo>=</mo><mi>p</mi><mi>a</mi><mo>+</mo><mi>q</mi><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">pq-p-q=pa+qb</annotation></semantics></math></span>라 하면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo stretchy=\"false\">(</mo><mi>a</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mi>q</mi><mo stretchy=\"false\">(</mo><mi>p</mi><mo>−</mo><mn>1</mn><mo>−</mo><mi>b</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">p(a+1)=q(p-1-b)</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo separator=\"true\">,</mo><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">p,q</annotation></semantics></math></span>의 공약수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>뿐이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>+</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">a+1</annotation></semantics></math></span>은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>의 배수이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>+</mo><mn>1</mn><mo>≥</mo><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">a+1\\ge q</annotation></semantics></math></span>. 그러면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mi>a</mi><mo>≥</mo><mi>p</mi><mi>q</mi><mo>−</mo><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">pa\\ge pq-p</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mi>b</mi><mo>=</mo><mi>p</mi><mi>q</mi><mo>−</mo><mi>p</mi><mo>−</mo><mi>q</mi><mo>−</mo><mi>p</mi><mi>a</mi><mo>≤</mo><mo>−</mo><mi>q</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">qb=pq-p-q-pa\\le-q&lt;0</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>≥</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">b\\ge0</annotation></semantics></math></span>에 모순."]},{"parts <mn>4</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">7,4,2,1</annotation></semantics></math></span>이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>7</mn><mo stretchy=\"false\">)</mo><mo separator=\"true\">,</mo><mo stretchy=\"false\">(</mo><mn>3</mn><mo separator=\"true\">,</mo><mn>4</mn><mo stretchy=\"false\">)</mo><mo separator=\"true\">,</mo><mo stretchy=\"false\">(</mo><mn>5</mn><mo separator=\"true\">,</mo><mn>2</mn><mo stretchy=\"false\">)</mo><mo separator=\"true\">,</mo><mo stretchy=\"false\">(</mo><mn>6</mn><mo separator=\"true\">,</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(0,7),(3,4),(5,2),(6,1)</annotation></semantics></math></span>로 짝을 이룬다. 증명: 둘 다 나타낼 수 있다면 두 식을 더해 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>도 나타낼 수 있게 되는데, 이는 문제 2의 (2)에 모순."]},{"parts":["(성질)을 받아들일 때, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mi>a</mi><mo>+</mo><mi>q</mi><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">pa+qb</annotation></semantics></math></span> 꼴로 나타낼 수 없는 자연수의 개수를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo separator=\"true\">,</mo><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">p,q</annotation></semantics></math></span>로 나타내시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>3</mn><mo separator=\"true\">,</mo><mi>q</mi><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">p=3,q=5</annotation></semantics></math></span>와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>3</mn><mo separator=\"true\">,</mo><mi>q</mi><mo>=</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">p=3,q=7</annotation></semantics></math></span>의 경우에 앞에서 구한 결과와 맞는지 확인하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>부터 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>까지 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>+</mo><mn>1</mn><mo>=</mo><mo stretchy=\"false\">(</mo><mi>p</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mi>q</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">N+1=(p-1)(q-1)</annotation></semantics></math></span>개의 정수가 둘씩 짝을 이루고 짝마다 하나만 나타낼 수 없으며, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>보다 큰 수는 모두 나타낼 수 있으므로 개수는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mi>p</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mi>q</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{(p-1)(q-1)}2</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo separator=\"true\">,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">3,5</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>개(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>4</mn><mo separator=\"true\">,</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">1,2,4,7</annotation></semantics></math></span>), <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo separator=\"true\">,</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">3,7</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">6</annotation></semantics></math></span>개(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>4</mn><mo separator=\"true\">,</mo><mn>5</mn><mo separator=\"true\">,</mo><mn>8</mn><mo separator=\"true\">,</mo><mn>11</mn></mrow><annotation encoding=\"application/x-tex\">1,2,4,5,8,11</annotation></semantics></math></span>)로 일치."]}]},{"kind":"연습","src":"연습 2 · 선을 넘지 않는 경로","scope":"확률과 통계 · 미적분","concept":"경우의 수, 수학적 확률, 수열의 극한, 정적분과 급수, 대칭이동에 의한 대응, 여사건","body":"<p>점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>y</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x,y)</annotation></semantics></math></span>에서 한 번에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mi>y</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x+1,y+1)</annotation></semantics></math></span> 또는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mi>y</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x+1,y-1)</annotation></semantics></math></span>로 움직여, 원점에서 출발해 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">2n</annotation></semantics></math></span>번 만에 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,0)</annotation></semantics></math></span>에 도착하는 경로를 생각하자(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>은 자연수). 이 가운데 지나는 모든 점의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span>좌표가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span> 이상인 경로를 <u>좋은 경로</u>라 하고 그 수를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>c</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">c_n</annotation></semantics></math></span>이라 하자.</p><figure><svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"y=-1에 닿는 경로를 처음 닿은 뒤부터 뒤집는 반사 원리\">\n<g class=\"grid\"><line x1=\"40\" y1=\"15\" x2=\"40\" y2=\"190\"/><line x1=\"75\" y1=\"15\" x2=\"75\" y2=\"190\"/><line x1=\"110\" y1=\"15\" x2=\"110\" y2=\"190\"/><line x1=\"145\" y1=\"15\" x2=\"145\" y2=\"190\"/><line x1=\"180\" y1=\"15\" x2=\"180\" y2=\"190\"/><line x1=\"215\" y1=\"15\" x2=\"215\" y2=\"190\"/><line x1=\"250\" y1=\"15\" x2=\"250\" y2=\"190\"/><line x1=\"285\" y1=\"15\" x2=\"285\" y2=\"190\"/><line x1=\"320\" y1=\"15\" x2=\"320\" y2=\"190\"/></g>\n<line class=\"ax\" x1=\"30\" y1=\"85\" x2=\"340\" y2=\"85\"/><line class=\"ax\" x1=\"40\" y1=\"195\" x2=\"40\" y2=\"8\"/>\n<line class=\"dash\" x1=\"30\" y1=\"120\" x2=\"340\" y2=\"120\"/>\n<polyline class=\"ln\" points=\"40,85 75,50 110,85 145,120 180,85 215,50 250,85 285,120 320,85\"/>\n<polyline class=\"ln2\" points=\"145,120 180,155 215,190 250,155 285,120 320,155\"/>\n<circle class=\"pt\" cx=\"145\" cy=\"120\" r=\"3.4\"/><circle class=\"pt\" cx=\"320\" cy=\"85\" r=\"3\"/><circle class=\"pt\" cx=\"320\" cy=\"155\" r=\"3\"/>\n<text x=\"26\" y=\"98\">O</text><text x=\"342\" y=\"89\">x</text><text x=\"2\" y=\"124\">y=−1</text><text x=\"300\" y=\"78\">(8, 0)</text><text x=\"296\" y=\"172\">(8, −2)</text>\n</svg><figcaption>[그림] y = −1에 처음 닿은 뒤의 부분을 직선 y = −1에 대하여 대칭이동(점선)한다</figcaption></figure>\n<p>좋은 경로가 아닌 경로는 직선 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">y=-1</annotation></semantics></math></span> 위의 점을 반드시 지난다. 그런 경로에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">y=-1</annotation></semantics></math></span>에 처음 닿은 뒤의 부분을 직선 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">y=-1</annotation></semantics></math></span>에 대하여 대칭이동하면 원점에서 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mo>−</mo><mn>2</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,-2)</annotation></semantics></math></span>에 이르는 경로가 된다.</p><div class=\"box\"><b>토막글 · 개표 문제</b><p>두 후보 갑, 을이 각각 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>표, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">b</annotation></semantics></math></span>표를 얻었다(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>&gt;</mo><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">a&gt;b</annotation></semantics></math></span>). 표를 한 장씩 여는 모든 순서가 같은 확률로 일어난다고 할 때, 개표가 진행되는 내내 갑이 을을 앞서는 경우를 생각하자. 갑의 표를 위로 한 칸, 을의 표를 아래로 한 칸 가는 것으로 나타내면 개표 과정은 원점에서 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo separator=\"true\">,</mo><mtext> </mtext><mi>a</mi><mo>−</mo><mi>b</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(a+b,\\,a-b)</annotation></semantics></math></span>에 이르는 경로가 된다.</p></div>","qs":[],"ans":[],"follow":["대응이 일대일임을 왜 따로 확인해야 하는가?","c_n이 대략 4ⁿ의 속도로 커진다는 사실을 문제 2의 (2)에서 어떻게 읽을 수 있는가?"],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>c</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">c_3</annotation></semantics></math></span>을 구하시오.","위 대칭이동을 이용하여 좋은 경로가 아닌 경로의 수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{2n}\\mathrm C_{n+1}</annotation></semantics></math></span>임을 설명하고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>c</mi><mi>n</mi></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfrac></mstyle><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">c_n=\\dfrac{1}{n+1}{}_{2n}\\mathrm C_n</annotation></semantics></math></span>임을 보이시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>c</mi><mn>3</mn></msub><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">c_3=5</annotation></semantics></math></span>. (직접 세거나 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>⋅</mo><msub><mrow></mrow><mn>6</mn></msub><msub><mi mathvariant=\"normal\">C</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\frac14\\cdot{}_6\\mathrm C_3</annotation></semantics></math></span>.)","대칭이동은 \"좋지 않은 경로\"와 \"원점에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mo>−</mo><mn>2</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,-2)</annotation></semantics></math></span>로 가는 경로\"를 일대일로 대응시킨다(거꾸로도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">y=-1</annotation></semantics></math></span>에 처음 닿은 뒤를 다시 뒤집으면 된다). 후자는 올라가기 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">n-1</annotation></semantics></math></span>번, 내려가기 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">n+1</annotation></semantics></math></span>번이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{2n}\\mathrm C_{n+1}</annotation></semantics></math></span>가지. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>c</mi><mi>n</mi></msub><mo>=</mo><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>n</mi></msub><mo>−</mo><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>n</mi></msub><mrow><mo fence=\"true\">(</mo><mn>1</mn><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>n</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfrac></mstyle><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">c_n={}_{2n}\\mathrm C_n-{}_{2n}\\mathrm C_{n+1}={}_{2n}\\mathrm C_n\\left(1-\\dfrac n{n+1}\\right)</annotation></semantics></math></span>."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,0)</annotation></semantics></math></span>에 이르는 모든 경로 중 하나를 같은 확률로 고를 때 좋은 경로일 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_n</annotation></semantics></math></span>이라 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>n</mi><mo>→</mo><mi mathvariant=\"normal\">∞</mi></mrow></munder><mi>n</mi><msub><mi>p</mi><mi>n</mi></msub></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\lim_{n\\to\\infty}np_n</annotation></semantics></math></span>을 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>n</mi><mo>→</mo><mi mathvariant=\"normal\">∞</mi></mrow></munder><mfrac><mn>1</mn><mi>n</mi></mfrac><mi>ln</mi><mo>⁡</mo><msub><mi>c</mi><mi>n</mi></msub></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\lim_{n\\to\\infty}\\frac1n\\ln c_n</annotation></semantics></math></span>을 구하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>n</mi></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p_n=\\dfrac1{n+1}</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><msub><mi>p</mi><mi>n</mi></msub><mo>→</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">np_n\\to1</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mi>n</mi></mfrac></mstyle><mi>ln</mi><mo>⁡</mo><msub><mi>c</mi><mi>n</mi></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mi>n</mi></mfrac></mstyle><msubsup><mo>∑</mo><mrow><mi>j</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></msubsup><mi>ln</mi><mo>⁡</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>n</mi><mo>+</mo><mi>j</mi></mrow><mi>j</mi></mfrac></mstyle><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>ln</mi><mo>⁡</mo><mo stretchy=\"false\">(</mo><mi>n</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><mi>n</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1n\\ln c_n=\\dfrac1n\\sum_{j=1}^n\\ln\\dfrac{n+j}j-\\dfrac{\\ln(n+1)}n</annotation></semantics></math></span>. 앞의 합은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mi>ln</mi><mo>⁡</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>1</mn><mo>+</mo><mi>x</mi></mrow><mi>x</mi></mfrac></mstyle><mtext> </mtext><mi>d</mi><mi>x</mi><mo>=</mo><mn>2</mn><mi>ln</mi><mo>⁡</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">\\int_0^1\\ln\\dfrac{1+x}x\\,dx=2\\ln2</annotation></semantics></math></span>로, 뒤의 항은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>으로 가므로 답은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>ln</mi><mo>⁡</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2\\ln2</annotation></semantics></math></span>."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">a=3</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">b=2</annotation></semantics></math></span>일 때 개표 내내(첫 표를 연 뒤부터) 갑이 을을 앞설 확률을 직접 세어 구하시오.","(1)에서 센 방법을 살려 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">a=4</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">b=2</annotation></semantics></math></span>일 때의 확률을 구하고, 두 결과에서 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">a,b</annotation></semantics></math></span>로 나타내는 식을 추측하시오."],"ans":["전체 순서는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mn>5</mn></msub><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\"> {}_5\\mathrm C_2=10</annotation></semantics></math></span>가지. 내내 앞서는 것은 갑갑갑을을, 갑갑을갑을의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>가지. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>5</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac15</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>4</mn><mo separator=\"true\">,</mo><mi>b</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">a=4,b=2</annotation></semantics></math></span>이면 전체 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15</mn></mrow><annotation encoding=\"application/x-tex\">15</annotation></semantics></math></span>가지 가운데 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>가지로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac13</annotation></semantics></math></span>. 두 결과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>5</mn></mfrac></mstyle><mo separator=\"true\">,</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>6</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac15,\\dfrac26</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>a</mi><mo>−</mo><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{a-b}{a+b}</annotation></semantics></math></span>를 추측할 수 있다."]},{"parts":["\"첫 표가 을의 표인 개표 순서\"의 수와 \"첫 표가 갑의 표이지만 도중에 두 후보의 표가 같아지는 때가 있는 개표 순서\"의 수가 같음을, 처음으로 동점이 되는 때까지의 부분을 뒤집는 대응으로 설명하시오.","이를 이용하여 갑이 내내 앞설 확률이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>a</mi><mo>−</mo><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{a-b}{a+b}</annotation></semantics></math></span>임을 보이시오."],"ans":["첫 표가 을이면 끝에는 갑이 앞서므로 반드시 동점이 되는 때가 있다. 처음 동점이 될 때까지의 표를 갑↔을로 모두 바꾸면 첫 표가 갑이고 도중에 동점이 되는 순서가 되며, 거꾸로도 같은 방법으로 되돌릴 수 있다(일대일). 첫 표가 을인 순서는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>−</mo><mn>1</mn></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>a</mi></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{a+b-1}\\mathrm C_{a}</annotation></semantics></math></span>가지이므로 내내 앞서지 못하는 순서는 그 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>배. 확률은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mtext> </mtext><msub><mrow></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>−</mo><mn>1</mn></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>a</mi></msub></mrow><mrow><msub><mrow></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>a</mi></msub></mrow></mfrac></mstyle><mo>=</mo><mn>1</mn><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>a</mi><mo>−</mo><mi>b</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">1-\\dfrac{2\\,{}_{a+b-1}\\mathrm C_a}{{}_{a+b}\\mathrm C_a}=1-\\dfrac{2b}{a+b}=\\dfrac{a-b}{a+b}</annotation></semantics></math></span>."]}]},{"kind":"연습","src":"연습 3 · 제곱근을 구하는 수열","scope":"수학 · 수학Ⅰ · 미적분","concept":"수열의 귀납적 정의, 절대부등식, 수열의 극한, 접선의 방정식, 곡선의 오목·볼록","body":"<p>수열 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">{</mo><msub><mi>a</mi><mi>n</mi></msub><mo stretchy=\"false\">}</mo></mrow><annotation encoding=\"application/x-tex\">\\{a_n\\}</annotation></semantics></math></span>을 다음과 같이 정의한다.</p>\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mrow><mo fence=\"true\">(</mo><msub><mi>a</mi><mi>n</mi></msub><mo>+</mo><mfrac><mn>2</mn><msub><mi>a</mi><mi>n</mi></msub></mfrac><mo fence=\"true\">)</mo></mrow><mspace width=\"1em\"/><mo stretchy=\"false\">(</mo><mi>n</mi><mo>=</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>3</mn><mo separator=\"true\">,</mo><mo>⋯</mo><mtext> </mtext><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">a_1=2,\\qquad a_{n+1}=\\frac12\\left(a_n+\\frac{2}{a_n}\\right)\\quad(n=1,2,3,\\cdots)</annotation></semantics></math></span><div class=\"box\"><b>토막글 · 접선으로 해에 다가가기</b><p>방정식 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">f(x)=0</annotation></semantics></math></span>의 해를 어림하는 한 방법은 다음과 같다. 해에 가까운 값 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">a_n</annotation></semantics></math></span>을 잡고, 곡선 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">y=f(x)</annotation></semantics></math></span> 위의 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><msub><mi>a</mi><mi>n</mi></msub><mo separator=\"true\">,</mo><mi>f</mi><mo stretchy=\"false\">(</mo><msub><mi>a</mi><mi>n</mi></msub><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(a_n,f(a_n))</annotation></semantics></math></span>에서 그은 접선이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축과 만나는 점의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>좌표를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">a_{n+1}</annotation></semantics></math></span>로 삼는다. 이를 되풀이한다.</p></div>","qs":[],"ans":[],"follow":["2 대신 3을 넣으면 어떤 수에 가까워지는가?","a₁을 1로 바꾸어도 문제 1의 (2)의 결론이 성립하는가?"],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">a_2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">a_3</annotation></semantics></math></span>을 구하시오.","모든 자연수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>에 대하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>≥</mo><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">a_n\\ge\\sqrt2</annotation></semantics></math></span>임을 증명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>2</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">a_2=\\dfrac32</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>3</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>17</mn><mn>12</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">a_3=\\dfrac{17}{12}</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">a_n&gt;0</annotation></semantics></math></span>이면 산술평균과 기하평균의 관계에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>≥</mo><msqrt><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>⋅</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><msub><mi>a</mi><mi>n</mi></msub></mfrac></mstyle></mrow></msqrt><mo>=</mo><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">a_{n+1}\\ge\\sqrt{a_n\\cdot\\dfrac2{a_n}}=\\sqrt2</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>≥</mo><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">a_1=2\\ge\\sqrt2</annotation></semantics></math></span>이므로 모든 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>에서 성립."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><msqrt><mn>2</mn></msqrt><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><msub><mi>a</mi><mi>n</mi></msub><mo>−</mo><msqrt><mn>2</mn></msqrt><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mrow><mn>2</mn><msub><mi>a</mi><mi>n</mi></msub></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">a_{n+1}-\\sqrt2=\\dfrac{(a_n-\\sqrt2)^2}{2a_n}</annotation></semantics></math></span>임을 보이고, 이를 이용하여 수열 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">{</mo><msub><mi>a</mi><mi>n</mi></msub><mo stretchy=\"false\">}</mo></mrow><annotation encoding=\"application/x-tex\">\\{a_n\\}</annotation></semantics></math></span>이 감소함을 설명하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>−</mo><msqrt><mn>2</mn></msqrt><mo>=</mo><msub><mi>e</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">a_n-\\sqrt2=e_n</annotation></semantics></math></span>이라 할 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>e</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>≤</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msubsup><mi>e</mi><mi>n</mi><mrow><mtext> </mtext><mn>2</mn></mrow></msubsup><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">e_{n+1}\\le\\dfrac{e_n^{\\,2}}{2\\sqrt2}</annotation></semantics></math></span>임을 보이시오. 또 이 수열이 수렴한다고 할 때 그 극한값을 구하고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>4</mn></msub></mrow><annotation encoding=\"application/x-tex\">a_4</annotation></semantics></math></span>가 극한값과 얼마나 가까운지 어림하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>e</mi><mn>3</mn></msub><mo>&lt;</mo><mn>0.0025</mn></mrow><annotation encoding=\"application/x-tex\">e_3&lt;0.0025</annotation></semantics></math></span>)"],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><msqrt><mn>2</mn></msqrt><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><msubsup><mi>a</mi><mi>n</mi><mn>2</mn></msubsup><mo>−</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><msub><mi>a</mi><mi>n</mi></msub><mo>+</mo><mn>2</mn></mrow><mrow><mn>2</mn><msub><mi>a</mi><mi>n</mi></msub></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">a_{n+1}-\\sqrt2=\\dfrac{a_n^2-2\\sqrt2a_n+2}{2a_n}</annotation></semantics></math></span>. 또 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mo>−</mo><msubsup><mi>a</mi><mi>n</mi><mn>2</mn></msubsup></mrow><mrow><mn>2</mn><msub><mi>a</mi><mi>n</mi></msub></mrow></mfrac></mstyle><mo>≤</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">a_{n+1}-a_n=\\dfrac{2-a_n^2}{2a_n}\\le0</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>≥</mo><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">a_n\\ge\\sqrt2</annotation></semantics></math></span>이므로 분모 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><msub><mi>a</mi><mi>n</mi></msub><mo>≥</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">2a_n\\ge2\\sqrt2</annotation></semantics></math></span>. 극한값을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>라 하면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mrow><mo fence=\"true\">(</mo><mi>α</mi><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mi>α</mi></mfrac></mstyle><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\alpha=\\dfrac12\\left(\\alpha+\\dfrac2\\alpha\\right)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">\\alpha=\\sqrt2</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>e</mi><mn>4</mn></msub><mo>≤</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mn>0.0025</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mn>2.8</mn></mfrac></mstyle><mo>&lt;</mo><mn>3</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">e_4\\le\\dfrac{(0.0025)^2}{2.8}&lt;3\\times10^{-6}</annotation></semantics></math></span>. 한 번 계산할 때마다 맞는 자릿수가 약 두 배로 는다."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn></mrow><annotation encodin mrow><mn>2</mn><msub><mi>a</mi><mi>n</mi></msub></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mrow><mo fence=\"true\">(</mo><msub><mi>a</mi><mi>n</mi></msub><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><msub><mi>a</mi><mi>n</mi></msub></mfrac></mstyle><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">x=a_n-\\dfrac{a_n^2-2}{2a_n}=\\dfrac12\\left(a_n+\\dfrac2{a_n}\\right)</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">y=x^2-2</annotation></semantics></math></span>는 아래로 볼록하여 접선이 곡선 아래에 있으므로, 접선의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>절편은 곡선의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>절편 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">\\sqrt2</annotation></semantics></math></span>의 오른쪽에 놓인다."]},{"parts":["같은 방법으로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mroot><mn>2</mn><mn>3</mn></mroot></mrow><annotation encoding=\"application/x-tex\">\\sqrt[3]{2}</annotation></semantics></math></span>를 어림하는 점화식을 세우고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">a_1=1</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">a_2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">a_3</annotation></semantics></math></span>을 구하시오.","이 수열이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>≥</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">n\\ge2</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mroot><mn>2</mn><mn>3</mn></mroot></mrow><annotation encoding=\"application/x-tex\">\\sqrt[3]{2}</annotation></semantics></math></span> 이상임을 그래프의 모양으로 설명하시오. 또 이 방법이 잘 듣지 않는 처음 값의 예를 하나 들고 이유를 말하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msup><mi>x</mi><mn>3</mn></msup><mo>−</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">f(x)=x^3-2</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>a</mi><mi>n</mi></msub><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><msubsup><mi>a</mi><mi>n</mi><mn>3</mn></msubsup><mo>−</mo><mn>2</mn></mrow><mrow><mn>3</mn><msubsup><mi>a</mi><mi>n</mi><mn>2</mn></msubsup></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle><mrow><mo fence=\"true\">(</mo><mn>2</mn><msub><mi>a</mi><mi>n</mi></msub><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><msubsup><mi>a</mi><mi>n</mi><mn>2</mn></msubsup></mfrac></mstyle><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">a_{n+1}=a_n-\\dfrac{a_n^3-2}{3a_n^2}=\\dfrac13\\left(2a_n+\\dfrac2{a_n^2}\\right)</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>2</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">a_2=\\dfrac43</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>3</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>91</mn><mn>72</mn></mfrac></mstyle><mo>≈</mo><mn>1.264</mn></mrow><annotation encoding=\"application/x-tex\">a_3=\\dfrac{91}{72}\\approx1.264</annotation></semantics></math></span> (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mroot><mn>2</mn><mn>3</mn></mroot><mo>≈</mo><mn>1.260</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt[3]2\\approx1.260</annotation></semantics></math></span>). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">x&gt;0</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><msup><mi>x</mi><mn>3</mn></msup><mo>−</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">y=x^3-2</annotation></semantics></math></span>가 아래로 볼록하므로 같은 이유로 성립. 처음 값이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>이면 접선이 수평이라 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축과 만나지 않고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>에 가까우면 다음 값이 매우 멀리 튄다."]}]},{"kind":"연습","src":"연습 4 · 동전 던지기 내기","scope":"수학Ⅰ · 확률과 통계 · 미적분","concept":"확률의 곱셈정리, 수열의 귀납적 정의, 등비수열, 수열의 극한, 기댓값, 전략의 비교","body":"<p>갑은 구슬 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>개를 가지고 게임을 시작한다. 매회 갑이 이길 확률은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>, 질 확률은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</mo><mn>1</mn><mo>−</mo><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">q=1-p</annotation></semantics></math></span>이고(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>p</mi><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">0&lt;p&lt;1</annotation></semantics></math></span>), 이기면 구슬이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>개 늘고 지면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>개 준다. 구슬이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>개가 되면 갑의 성공으로, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>개가 되면 갑의 실패로 게임이 끝난다. 구슬 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>개로 시작한 갑이 성공할 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">P_k</annotation></semantics></math></span>라 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>0</mn></msub><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">P_0=0</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>N</mi></msub><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">P_N=1</annotation></semantics></math></span>이다.</p><div class=\"box\"><b>토막글 · 얼마나 오래, 얼마씩</b><p>(가) <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p=\\dfrac12</annotation></semantics></math></span>일 때 구슬 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>개로 시작한 게임이 끝날 때까지 걸리는 횟수의 기댓값을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">E_k</annotation></semantics></math></span>라 하면, 첫 회의 결과로 나누어 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>k</mi></msub><mo>=</mo><mn>1</mn><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><msub><mi>E</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><msub><mi>E</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">E_k=1+\\dfrac12E_{k-1}+\\dfrac12E_{k+1}</annotation></semantics></math></span> (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>≤</mo><mi>k</mi><mo>≤</mo><mi>N</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\le k\\le N-1</annotation></semantics></math></span>), <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub><mo>=</mo><msub><mi>E</mi><mi>N</mi></msub><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">E_0=E_N=0</annotation></semantics></math></span>이다.</p><p>(나) 한 번에 구슬을 여러 개 걸 수 있도록 규칙을 바꾼다. 건 만큼 따거나 잃으며, 목표 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>을 넘지 않는 범위에서 가진 구슬을 최대한 많이 거는 방법을 <u>대담한 전략</u>, 매번 하나씩 거는 방법을 <u>소심한 전략</u>이라 하자.</p></div>","qs":[],"ans":[],"follow":["p < 1/2일 때 같은 극한은 얼마인가?","문제 2의 (2)의 식에 N = 3, k = 1을 넣어 문제 2의 (1)과 같은지 확인하시오."],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">P_k</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">P_{k-1}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">P_{k+1}</annotation></semantics></math></span>로 나타내시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>≤</mo><mi>k</mi><mo>≤</mo><mi>N</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\le k\\le N-1</annotation></semantics></math></span>)","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p=\\dfrac12</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">P_k</annotation></semantics></math></span>를 구하시오."],"ans":["첫 회의 결과로 나누면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>k</mi></msub><mo>=</mo><mi>p</mi><msub><mi>P</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>+</mo><mi>q</mi><msub><mi>P</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">P_k=pP_{k+1}+qP_{k-1}</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><msub><mi>P</mi><mi>k</mi></msub><mo>=</mo><msub><mi>P</mi><mi>k</mi></msub><mo>−</mo><msub><mi>P</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">P_{k+1}-P_k=P_k-P_{k-1}</annotation></semantics></math></span>이므로 등차수열. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>k</mi></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>k</mi><mi>N</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">P_k=\\dfrac kN</annotation></semantics></math></span>."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">N=3</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">P_1</annotation></semantics></math></span>을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>에 대한 식으로 나타내고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p=\\dfrac23</annotation></semantics></math></span>일 때와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p=\\dfrac13</annotation></semantics></math></span>일 때의 값을 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo mathvariant=\"normal\">≠</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p\\ne\\dfrac12</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>q</mi><mi>p</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">r=\\dfrac qp</annotation></semantics></math></span>로 놓고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><msub><mi>P</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">P_{k+1}-P_k</annotation></semantics></math></span>가 등비수열을 이룸을 보여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">P_k</annotation></semantics></math></span>를 구하시오. 또 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p&gt;\\dfrac12</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>N</mi><mo>→</mo><mi mathvariant=\"normal\">∞</mi></mrow></munder><msub><mi>P</mi><mi>k</mi></msub></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\lim_{N\\to\\infty}P_k</annotation></semantics></math></span>를 구하고 그 뜻을 말하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>1</mn></msub><mo>=</mo><mi>p</mi><msub><mi>P</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">P_1=pP_2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>2</mn></msub><mo>=</mo><mi>p</mi><mo>+</mo><mi>q</mi><msub><mi>P</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">P_2=p+qP_1</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>1</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msup><mi>p</mi><mn>2</mn></msup><mrow><mn>1</mn><mo>−</mo><mi>p</mi><mi>q</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">P_1=\\dfrac{p^2}{1-pq}</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p=\\dfrac23</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>4</mn><mn>7</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac47</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p=\\dfrac13</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>7</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac17</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo stretchy=\"false\">(</mo><msub><mi>P</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><msub><mi>P</mi><mi>k</mi></msub><mo stretchy=\"false\">)</mo><mo>=</mo><mi>q</mi><mo stretchy=\"false\">(</mo><msub><mi>P</mi><mi>k</mi></msub><mo>−</mo><msub><mi>P</mi><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msub><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">p(P_{k+1}-P_k)=q(P_k-P_{k-1})</annotation></semantics></math></span>이므로 공비 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>인 등비수열. 더하면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>k</mi></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>1</mn><mo>−</mo><msup><mi>r</mi><mi>k</mi></msup></mrow><mrow><mn>1</mn><mo>−</mo><msup><mi>r</mi><mi>N</mi></msup></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">P_k=\\dfrac{1-r^k}{1-r^N}</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p&gt;\\dfrac12</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>r</mi><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">0&lt;r&lt;1</annotation></semantics></math></span>이므로 극한은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><msup><mi>r</mi><mi>k</mi></msup></mrow><annotation encoding=\"application/x-tex\">1-r^k</annotation></semantics></math></span>. 목표가 아무리 커도 실패하지 않고 계속 버틸 확률이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><msup><mi>r</mi><mi>k</mi></msup></mrow><annotation encoding=\"application/x-tex\">1-r^k</annotation></semantics></math></span>라는 뜻."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">N=3</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">E_1</annotation></semantics></math></span>을 구하시오.","또 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>k</mi></msub><mo>=</mo><mi>k</mi><mo stretchy=\"false\">(</mo><mi>N</mi><mo>−</mo><mi>k</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">E_k=k(N-k)</annotation></semantics></math></span>가 (가)의 관계식과 조건을 모두 만족시킴을 확인하고, 구슬 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span>개로 시작하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">20</annotation></semantics></math></span>개를 목표로 할 때 게임이 평균 몇 번 만에 끝나는지 말하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><msub><mi>E</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">E_1=1+\\dfrac12E_2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><msub><mi>E</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">E_2=1+\\dfrac12E_1</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">E_1=2</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mi>k</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mi>N</mi><mo>−</mo><mi>k</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mo stretchy=\"false\">(</mo><mi>k</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mi>N</mi><mo>−</mo><mi>k</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><mn>2</mn></mfrac></mstyle><mo>=</mo><mn>1</mn><mo>+</mo><mi>k</mi><mo stretchy=\"false\">(</mo><mi>N</mi><mo>−</mo><mi>k</mi><mo stretchy=\"false\">)</mo><mo>−</mo><mn>1</mn><mo>=</mo><mi>k</mi><mo stretchy=\"false\">(</mo><mi>N</mi><mo>−</mo><mi>k</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">1+\\dfrac{(k-1)(N-k+1)+(k+1)(N-k-1)}2=1+k(N-k)-1=k(N-k)</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub><mo>=</mo><msub><mi>E</mi><mi>N</mi></msub><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">E_0=E_N=0</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn><mo>×</mo><mn>10</mn><mo>=</mo><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">10\\times10=100</annotation></semantics></math></span>번."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></ms
