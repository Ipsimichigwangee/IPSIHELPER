<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="서울대 면접">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151d" media="(prefers-color-scheme: dark)">
<title>서울대 제시문 면접 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 배치: 왼쪽에 선택 패널(모집단위→유형→영역), 오른쪽에 문항지. 좁은 화면에서는 한 줄로 쌓는다. */
  --bg:#f3f5f8; --paper:#ffffff; --ink:#18212f; --sub:#5b6676; --line:#d5dbe4;
  --accent:#0f3d7a; --accent-soft:#e3ecf8; --mark:#b5471b; --mark-soft:#fbeee6;
  --display:"Noto Serif KR","Pretendard Variable",Pretendard,serif;
  --body:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151d; --paper:#18202b; --ink:#e6ebf2; --sub:#9aa6b6; --line:#2f3a49;
  --accent:#8db8f2; --accent-soft:#1d2c42; --mark:#f0a06f; --mark-soft:#33231a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10151d; --paper:#18202b; --ink:#e6ebf2; --sub:#9aa6b6; --line:#2f3a49;
  --accent:#8db8f2; --accent-soft:#1d2c42; --mark:#f0a06f; --mark-soft:#33231a; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
header{padding:22px 20px 14px;max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-size:1.55rem;margin:0;text-wrap:balance}
header p{margin:0;color:var(--sub);font-size:.9rem}
main{max-width:1180px;margin:0 auto;padding:0 20px 40px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-direction:column;gap:6px}
.step>label,.step>.lab{font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.02em}
select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 11px;font-size:.9rem;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.chip .tag{font-size:.72rem;margin-left:6px;opacity:.75}
button:focus-visible,select:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.info{font-size:.88rem;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px}
.info b{color:var(--ink)}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.info dt{font-weight:700;color:var(--ink)}.info dd{margin:0}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tab{border:1px solid transparent;border-bottom:none;background:none;padding:8px 14px;border-radius:8px 8px 0 0;font-size:.95rem;color:var(--sub)}
.tab[aria-selected="true"]{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:700;position:relative;top:1px}
.tab .k{font-size:.72rem;color:var(--mark);font-weight:700;margin-right:5px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);font-size:.9rem}
.timer{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem;min-width:4.2ch;text-align:right}
.clock.end{color:var(--mark)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:.85rem}
.btn.on{background:var(--mark-soft);border-color:var(--mark);color:var(--mark);font-weight:700}
.doc{padding:22px 24px 28px;max-width:800px}
.meta{font-size:.82rem;color:var(--sub);margin:0 0 4px}
.doc h2{font-family:var(--display);font-size:1.2rem;margin:0 0 14px;text-wrap:balance}
.doc p{margin:.55em 0}
.box{border:1px solid var(--ink);border-radius:4px;padding:10px 16px;margin:12px 0}
.doc table{border-collapse:collapse;margin:12px 0;font-size:.93rem}
.doc th,.doc td{border:1px solid var(--line);padding:5px 12px;text-align:center}
.doc th{background:var(--bg);font-weight:700}
.box>b{display:block;text-align:center;font-size:.9rem}
ol.qs{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:14px;counter-reset:q}
ol.qs>li{display:grid;grid-template-columns:auto 1fr;gap:0 10px}
.note2{font-size:.85rem;color:var(--sub)}
ol.qs figure{margin:10px 0}
ol.pt2{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ol.pt2>li{display:grid;grid-template-columns:auto 1fr;gap:0 8px}
ol.pt2>li>div{min-width:0}
.ans p{margin:.3em 0}
ol.qs>li>div{min-width:0}
@media print{.panel,.bar,.tabs,header p,footer span+span{display:none}main{display:block;padding:0}.sheet{border:none}body{background:#fff}}
.ans{margin-top:8px;padding:8px 12px;border-left:3px solid var(--mark);background:var(--mark-soft);font-size:.93rem;border-radius:0 6px 6px 0}
.ans::before{content:attr(data-l);display:block;font-size:.75rem;font-weight:700;color:var(--mark)}
.teach{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px;font-size:.92rem}
.teach h3{font-size:.85rem;color:var(--mark);margin:0 0 4px}
.teach ul{margin:0;padding-left:1.2em}
body:not(.t) .ans,body:not(.t) .teach,body:not(.t) .tonly{display:none}
figure{margin:14px 0;text-align:center}
figure svg{width:100%;max-width:440px;height:auto}
figcaption{font-size:.82rem;color:var(--sub)}
svg text{font-family:var(--body);font-size:11px;fill:var(--ink)}
svg text.c{text-anchor:middle}svg text.s{font-size:10px}svg text.big{font-size:44px;font-weight:700}
svg .grid line{stroke:var(--line);stroke-width:.7}
svg .ax{stroke:var(--ink);stroke-width:1.2;fill:none}
svg .ln{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round}
svg .ln3{stroke:var(--sub);stroke-width:2;fill:none;stroke-dasharray:2 3}
svg .grid1{stroke:var(--line);stroke-width:.7}
svg .ln2{stroke:var(--mark);stroke-width:1.8;fill:none;stroke-dasharray:5 3}
svg .dash{stroke:var(--sub);stroke-width:1;stroke-dasharray:4 3;fill:none}
svg .pt{fill:var(--ink)}svg .tk{stroke:var(--ink);stroke-width:1}
svg .ball,svg .bub{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
svg .sand{fill:var(--mark-soft)}svg .sea{fill:var(--accent-soft)}
svg .cell{fill:var(--paper);stroke:var(--line)}svg .cell.on{fill:var(--accent-soft);stroke:var(--accent)}
svg .man circle,svg .man line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
math{font-size:1.05em}
math[display="block"]{margin:.6em 0;overflow-x:auto;max-width:100%}
.areaH{margin:0;padding:10px 24px;background:var(--accent-soft);color:var(--accent);font-size:.95rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.areaH:first-child{border-top:none}
@media print{.areaH{break-before:page}.areaH:first-child{break-before:auto}}
.empty{padding:36px 24px;color:var(--sub)}
.empty b{color:var(--ink)}
.note{margin:0 24px;padding:10px 14px;background:var(--accent-soft);border-radius:8px;font-size:.88rem}
footer{max-width:1180px;margin:0 auto;padding:0 20px 28px;color:var(--sub);font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}

/* ── 아이폰·아이패드(Safari) 대응 ── */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overflow-wrap:break-word}
button,select{touch-action:manipulation;-webkit-touch-callout:none}
button{-webkit-user-select:none;user-select:none}
select{font-size:16px}
header,main,footer{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
header{padding-top:max(22px,env(safe-area-inset-top))}
footer{padding-bottom:max(28px,env(safe-area-inset-bottom))}
.hs{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;max-width:100%;padding:2px 0}
.hs>table{margin:10px 0}
.hs.m{text-align:center}
.katex.wide{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;vertical-align:middle;padding:2px 0}
.doc p,.doc li>div,.ans{max-width:100%}
.clock{flex:none}
@media (pointer:coarse){
  .btn,.chip,.tab,select{min-height:44px}
  .btn{padding:8px 13px}.chip{padding:9px 12px}.tab{padding:10px 14px}
}
@media (max-width:600px){
  header,main,footer{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  header{padding-bottom:10px}h1{font-size:1.3rem}
  main{gap:12px}
  .panel{padding:14px}
  .bar{padding:10px 12px}
  .doc{padding:16px 14px 22px}
  .note{margin:0 14px}
  .empty{padding:28px 14px}
  .doc th,.doc td{padding:5px 8px}
  .box{padding:8px 12px}
  ol.qs>li{grid-template-columns:minmax(0,1fr);gap:4px 0}
}
@media print{.hs,.katex.wide{overflow:visible}}
</style>
</head>
<body>
<header>
  <h1>서울대 제시문 면접 생성기</h1>
  <p>2027학년도 수시모집 일반전형 면접 및 구술고사 기준 · 2015 개정 교육과정 범위</p>
</header>
<main>
  <section class="panel" aria-label="면접 선택">
    <div class="step"><label for="col">1. 단과대학</label><select id="col"></select></div>
    <div class="step"><label for="dept">2. 모집단위</label><select id="dept"></select></div>
    <div class="step" id="typeStep"><span class="lab">3. 면접 유형</span><div class="chips" id="types"></div></div>
    <div class="step"><span class="lab" id="areaLab">4. 제시문 영역</span><div class="chips" id="areas"></div></div>
    <div class="info" id="info"></div>
  </section>
  <section class="sheet" aria-label="문항지">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="bar">
      <div class="timer">
        <button class="btn" id="mPrep" type="button">답변 준비</button>
        <button class="btn" id="mInt" type="button">면접 15분</button>
        <span class="clock" id="clock">00:00</span>
        <button class="btn" id="go" type="button">시작</button>
        <button class="btn" id="reset" type="button">처음으로</button>
      </div>
      <span class="timer"><button class="btn" id="print" type="button" hidden>인쇄</button>
      <button class="btn" id="teacher" type="button" aria-pressed="false">교사용 보기 (정답·추가 질문)</button></span>
    </div>
    <div id="view"></div>
  </section>
</main>
<footer><span>운정고 진로도전부 이재규</span><span>기출 문항은 서울대학교 입학본부 공개 문항을 다시 정리한 것입니다. 원문은 문항집의 해당 쪽에서 확인하세요.</span></footer>
<script>
const DATA={"sets":{"apt":[{"kind":"연습","src":"그림 문항 · 마주 선 두 사람","scope":"상황/제시문 기반 면접 (MMI) · 그림 제시형","concept":"관점의 차이, 의사소통, 사실 확인","noAnswer":true,"body":"<p>다음 그림을 1분 동안 살펴본 뒤 면접위원의 질문에 답하시오.</p><figure><svg viewBox=\"0 0 360 215\" role=\"img\" aria-label=\"바닥에 적힌 숫자를 사이에 두고 마주 선 두 사람\">\n<line class=\"ax\" x1=\"20\" y1=\"170\" x2=\"340\" y2=\"170\"/>\n<g class=\"man\"><circle cx=\"70\" cy=\"62\" r=\"13\"/><line x1=\"70\" y1=\"75\" x2=\"70\" y2=\"125\"/><line x1=\"70\" y1=\"125\" x2=\"56\" y2=\"168\"/><line x1=\"70\" y1=\"125\" x2=\"84\" y2=\"168\"/><line x1=\"70\" y1=\"90\" x2=\"100\" y2=\"108\"/><line x1=\"70\" y1=\"90\" x2=\"50\" y2=\"112\"/></g>\n<g class=\"man\"><circle cx=\"290\" cy=\"62\" r=\"13\"/><line x1=\"290\" y1=\"75\" x2=\"290\" y2=\"125\"/><line x1=\"290\" y1=\"125\" x2=\"276\" y2=\"168\"/><line x1=\"290\" y1=\"125\" x2=\"304\" y2=\"168\"/><line x1=\"290\" y1=\"90\" x2=\"260\" y2=\"108\"/><line x1=\"290\" y1=\"90\" x2=\"310\" y2=\"112\"/></g>\n<path class=\"bub\" d=\"M140,176 L220,176 L236,208 L124,208 Z\"/><g transform=\"translate(180 192) scale(1 .7) rotate(90)\"><text class=\"big\" x=\"0\" y=\"16\" text-anchor=\"middle\">6</text></g>\n<rect class=\"bub\" x=\"24\" y=\"8\" width=\"92\" height=\"30\" rx=\"8\"/><text class=\"c\" x=\"70\" y=\"28\">아홉 개야!</text>\n<rect class=\"bub\" x=\"244\" y=\"8\" width=\"92\" height=\"30\" rx=\"8\"/><text class=\"c\" x=\"290\" y=\"28\">여섯 개야!</text>\n<text class=\"c s\" x=\"70\" y=\"190\">가</text><text class=\"c s\" x=\"290\" y=\"190\">나</text>\n</svg><figcaption>[그림] 두 사람이 바닥에 적힌 표시를 사이에 두고 마주 서 있다</figcaption></figure><div class=\"box\"><b>상황</b><p>진료를 마친 의사가 \"검사 결과는 괜찮습니다. 석 달 뒤에 다시 보지요.\"라고 말했다. 환자는 병원을 나서며 가족에게 전화해 \"큰 병이 아니라서 다행이야. 이제 약 안 먹어도 된대.\"라고 말했다. 의사가 뜻한 것은 \"지금 먹는 약이 잘 듣고 있으니 그대로 계속하자\"였다.</p></div>","qs":[],"ans":[],"follow":["두 사람이 끝까지 자기 말만 한다면, 옆에서 지켜보던 제3자로서 무엇을 하겠는가?","\"관점의 차이\"로 설명해서는 안 되는 문제에는 어떤 것이 있는가?"],"groups":[{"parts":["그림에서 일어나고 있는 일을 본 대로 설명하시오.","두 사람은 왜 서로 다른 말을 하고 있는가? 두 사람 모두 옳다고 할 수 있는가, 아니면 누가 옳은지 가릴 방법이 있는가?"],"ans":["관찰과 해석을 구분하는지 본다. \"두 사람이 바닥의 표시를 반대쪽에서 보고 있다\"는 사실부터 말하고, 감정·의도에 대한 추측은 추측이라고 밝히는지 확인한다.","\"보는 위치에 따라 달리 보인다\"에서 멈추지 않는지 본다. 표시를 쓴 사람의 의도, 주변의 다른 단서(다른 숫자의 방향, 물건의 실제 개수) 등 사실을 확인할 방법을 제시하면 높게 평가한다."]},{"parts":["진료실에서 의료인과 환자(또는 보호자) 사이에 이 그림과 비슷한 일이 생기는 경우를 하나 들고, 지원자가 의료인이라면 어떻게 하겠는지 말하시오.","지원자가 자기 생각이 틀렸음을 알게 되어 생각을 바꾼 경험이 있다면 말하시오."],"ans":["예: 의료인이 말한 \"괜찮다\"를 환자가 다르게 받아들이는 경우, 검사 수치의 의미를 서로 다르게 이해하는 경우. 상대의 자리에서 먼저 듣고, 쉬운 말로 다시 설명하고, 이해했는지 되묻는 과정을 구체적으로 말하는지 본다.","경험의 사실 여부보다, 틀렸음을 알게 된 계기와 그 뒤의 행동 변화를 구체적으로 말하는지 본다."]},{"parts":["이 상황에서 의사와 환자는 같은 말을 어떻게 다르게 이해했는가?","그림과 견주어 설명하시오."],"ans":["\"괜찮다\"는 한 낱말을 의사는 '치료가 잘 되고 있다', 환자는 '치료가 필요 없다'로 읽었음을 짚는지 본다."]},{"parts":["오해가 생긴 책임은 누구에게 있다고 생각하는가?","지원자가 이 의사라면 진료실에서 무엇을 다르게 하겠는가?"],"ans":["전문가 쪽의 확인 책임을 인정하는지, 환자에게 이해한 내용을 자기 말로 되짚어 보게 하는 등의 구체적 방법을 내는지 본다."]}]},{"kind":"연습","src":"그림 문항 · 응급실 전광판","scope":"상황/제시문 기반 면접 (MMI) · 그림 제시형","concept":"자원 배분, 공정성의 기준, 설명과 설득","noAnswer":true,"body":"<p>다음 그림을 1분 동안 살펴본 뒤 면접위원의 질문에 답하시오.</p><figure><svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"응급실 대기 환자 네 명의 도착 시각과 증상을 적은 전광판\">\n<rect class=\"bub\" x=\"30\" y=\"14\" width=\"300\" height=\"172\" rx=\"8\"/><text class=\"c\" x=\"180\" y=\"38\">응급실 대기 현황 (진료 가능 의사 1명)</text><line class=\"ax\" x1=\"44\" y1=\"48\" x2=\"316\" y2=\"48\"/>\n<text class=\"s\" x=\"52\" y=\"66\">도착 순서</text><text class=\"s\" x=\"120\" y=\"66\">도착 시각</text><text class=\"s\" x=\"190\" y=\"66\">증상</text><text class=\"s\" x=\"270\" y=\"66\">위급한 정도</text>\n<text x=\"66\" y=\"92\">1</text><text x=\"124\" y=\"92\">09:02</text><text x=\"190\" y=\"92\">발목 삠</text><text x=\"282\" y=\"92\">낮음</text><text x=\"66\" y=\"118\">2</text><text x=\"124\" y=\"118\">09:10</text><text x=\"190\" y=\"118\">가슴 통증</text><text x=\"282\" y=\"118\">높음</text><text x=\"66\" y=\"144\">3</text><text x=\"124\" y=\"144\">09:15</text><text x=\"190\" y=\"144\">손가락 베임</text><text x=\"282\" y=\"144\">낮음</text><text x=\"66\" y=\"170\">4</text><text x=\"124\" y=\"170\">09:21</text><text x=\"190\" y=\"170\">고열 아이</text><text x=\"282\" y=\"170\">중간</text>\n</svg><figcaption>[그림] 어느 병원 응급실의 대기 전광판</figcaption></figure><div class=\"box\"><b>상황</b><p>09시 25분, 2번 환자를 진료하는 사이에 1번 환자의 발목이 심하게 붓고 발가락 색이 변하기 시작했다는 것을 간호사가 발견했다. 같은 때 4번 아이의 보호자가 \"아이가 축 늘어진다\"며 접수대로 왔다. 의사는 여전히 한 명뿐이다.</p></div>","qs":[],"ans":[],"follow":["2번 환자의 보호자가 병원 직원의 가족이라면 판단이 달라지는가?","의사가 두 명이라면 순서를 어떻게 바꾸겠는가?"],"groups":[{"parts":["지원자가 이 응급실의 의료인이라면 네 환자를 어떤 순서로 진료하겠는가? 이유를 말하시오.","가장 먼저 온 1번 환자가 \"내가 제일 먼저 왔는데 왜 뒤로 밀리느냐\"고 항의한다. 어떻게 말하겠는가?"],"ans":["위급한 정도를 기준으로 2번을 먼저 보고, 아이(4번)를 다음에 두는 식의 답이 일반적이다. 순서 자체보다 기준을 분명히 말하고 일관되게 적용하는지 본다.","환자의 불편과 화를 먼저 인정하고, 순서의 기준과 예상 대기 시간을 알기 쉽게 설명하며, 기다리는 동안 상태가 나빠지면 알려 달라고 안내하는지 본다. 규정만 되풀이하면 낮게 평가한다."]},{"parts":["\"먼저 온 사람부터\"와 \"위급한 사람부터\"는 각각 어떤 점에서 공정한가? 두 기준이 부딪칠 때 무엇으로 정해야 하는가?","전광판에 적힌 정보만으로 순서를 정할 때 놓칠 수 있는 것은 무엇인가?"],"ans":["도착순은 모두를 똑같이 대하고 누구나 확인할 수 있다는 점에서, 중증도순은 필요가 큰 사람을 먼저 돕는다는 점에서 공정하다. 생명과 건강에 미치는 차이가 큰 곳에서는 필요가 앞선다는 식으로 근거를 대는지 본다.","증상 이름만으로는 실제 상태를 알 수 없다(발목을 삔 환자의 다른 부상, 말하지 못한 증상). 다시 살펴보고 순서를 고칠 여지를 두는지 본다."]},{"parts":["이 순간 지원자가 간호사라면 무엇을 먼저 하겠는가?","처음에 정한 순서를 바꾸어야 하는가?"],"ans":["새 정보로 우선순위를 다시 정하고, 의사에게 알리며, 할 수 있는 처치를 먼저 하는 등 행동의 순서를 말하는지 본다. 처음 정한 순서를 고집하지 않는지 본다."]},{"parts":["처음의 '위급한 정도' 판단이 틀렸던 것으로 드러났을 때, 그 판단을 내린 동료를 어떻게 대하겠는가?","이런 일을 줄이려면 대기 환자를 어떻게 관리해야 하는가?"],"ans":["사람을 탓하기보다 처음 판단은 그때의 정보로는 타당했을 수 있음을 인정하고, 정해진 간격으로 다시 살피는 절차를 제안하는지 본다."]}]},{"kind":"연습","src":"그림 문항 · 드러난 부분","scope":"상황/제시문 기반 면접 (MMI) · 그림 제시형","concept":"경청, 환자의 맥락 이해, 질문하는 능력","noAnswer":true,"body":"<p>다음 그림을 1분 동안 살펴본 뒤 면접위원의 질문에 답하시오.</p><figure><svg viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"수면 위로 조금만 드러난 빙산\">\n<rect class=\"sea\" x=\"20\" y=\"70\" width=\"320\" height=\"150\"/><line class=\"ax\" x1=\"20\" y1=\"70\" x2=\"340\" y2=\"70\"/>\n<path class=\"bub\" d=\"M150,70 L175,22 L196,44 L214,70 Z\"/><path class=\"bub\" d=\"M150,70 L214,70 L262,120 L240,186 L170,208 L112,172 L98,112 Z\"/>\n<text x=\"226\" y=\"46\">\"요즘 잠을 못 자요.\"</text><text class=\"c\" x=\"180\" y=\"140\">?</text><text x=\"30\" y=\"64\">수면</text>\n</svg><figcaption>[그림] 진료실에서 환자가 한 말을 빙산의 드러난 부분에 적었다</figcaption></figure><div class=\"box\"><b>상황</b><p>잠을 못 잔다는 이 환자는 수면제를 처방해 달라고 한다. 이야기를 더 나누어 보니 석 달 전 일자리를 잃었고, 그 사실을 가족에게 말하지 못한 채 날마다 출근하는 것처럼 집을 나선다고 한다.</p></div>","qs":[],"ans":[],"follow":["수면 아래를 살피느라 진료 시간이 길어지면 기다리는 다른 환자에게는 어떤 영향이 있는가?","친구 사이에서 이 그림과 비슷한 경험을 한 적이 있는가?"],"groups":[{"parts":["이 그림이 말하려는 바를 설명하시오.","물음표가 적힌 부분에 들어갈 수 있는 것을 세 가지 이상 말하시오."],"ans":["환자가 말로 꺼낸 증상은 전체의 일부이고, 그 아래에 더 큰 사정이 있을 수 있다는 뜻으로 읽는지 본다.","예: 일이나 학업의 걱정, 가족 문제, 경제적 어려움, 다른 병이나 먹고 있는 약, 통증, 생활 습관. 몸과 마음과 생활을 고루 떠올리는지 본다."]},{"parts":["지원자가 의료인이라면 수면 아래에 있는 것을 알아내기 위해 환자에게 무엇을 어떻게 묻겠는가? 실제로 할 질문을 두 가지 말해 보시오.","환자가 더 이야기하고 싶어 하지 않는다면 어떻게 하겠는가?"],"ans":["\"언제부터 그러셨어요?\", \"그 무렵에 달라진 일이 있었나요?\"처럼 답을 정해 두지 않은 질문을 하는지, 캐묻는 말투가 아닌지 본다.","말하지 않을 권리를 존중하면서, 언제든 이야기할 수 있음을 알리고 다음 기회를 남겨 두는지 본다. 억지로 끌어내려 하거나 바로 포기하는 답은 낮게 평가한다."]},{"parts":["환자가 바라는 것(수면제)과 환자에게 필요한 것은 같은가?","지원자가 의료인이라면 어떻게 하겠는가?"],"ans":["요구를 무시하지도, 그대로 들어주기만 하지도 않고 원인에 대해 함께 이야기하며 도움받을 곳을 안내하는지 본다."]},{"parts":["환자는 이 이야기를 가족에게 알리지 말아 달라고 부탁한다. 그런데 며칠 뒤 환자의 배우자가 병원에 찾아와 남편이 왜 병원에 다니는지 묻는다. 어떻게 답하겠는가?","(1)의 답에서 환자의 부탁을 지키는 일과 배우자의 걱정에 응답하는 일 가운데 무엇을 앞세웠는가? 그 기준이 달라져야 하는 경우가 있다면 어떤 경우인지 말하시오."],"ans":["환자의 비밀을 지킬 의무를 알고, 거짓말을 하지 않으면서 배우자의 걱정에 응답하는 방법(환자에게 직접 이야기하도록 권하는 일 등)을 찾는지 본다. 비밀을 지키는 것이 기본이지만, 환자 자신이나 다른 사람의 안전이 위험해지는 경우에는 달라질 수 있음을 말하는지 본다."]}]},{"kind":"연습","src":"그림 문항 · 두 개의 선","scope":"상황/제시문 기반 면접 (MMI) · 그림 제시형","concept":"직관과 검증, 확신의 오류, 자기 점검","noAnswer":true,"body":"<p>다음 그림을 1분 동안 살펴본 뒤 면접위원의 질문에 답하시오.</p><figure><svg viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"끝의 화살 모양이 서로 다른 두 수평선\">\n<line class=\"ax\" x1=\"100\" y1=\"45\" x2=\"260\" y2=\"45\"/><path class=\"ax\" d=\"M118,30 L100,45 L118,60 M242,30 L260,45 L242,60\"/>\n<line class=\"ax\" x1=\"100\" y1=\"105\" x2=\"260\" y2=\"105\"/><path class=\"ax\" d=\"M82,90 L100,105 L82,120 M278,90 L260,105 L278,120\"/>\n<text x=\"60\" y=\"49\">가</text><text x=\"60\" y=\"109\">나</text>\n</svg><figcaption>[그림] 두 선 가와 나</figcaption></figure><div class=\"box\"><b>상황</b><p>한 병원에서 경험이 많은 의사가 환자의 사진을 보고 \"틀림없이 가벼운 염좌\"라고 판단하여 추가 검사 없이 돌려보냈다. 며칠 뒤 다른 병원의 정밀 검사에서 작은 골절이 발견되었다. 이 의사는 지난 20년 동안 비슷한 사진을 수천 장 보았고 틀린 적이 거의 없었다.</p></div>","qs":[],"ans":[],"follow":["검사 결과 자체가 틀릴 수 있는 경우는?","자신의 판단이 틀렸음을 다른 사람 앞에서 인정해야 했던 경험이 있는가?"],"groups":[{"parts":["두 선 가와 나 중 어느 쪽이 더 길어 보이는가? 실제 길이를 확인하려면 어떻게 하면 되는가?","두 선의 길이는 실제로 같다. 이 사실을 알고 난 뒤에도 한쪽이 더 길어 보인다면, 이것은 우리의 판단에 대해 무엇을 말해 주는가?"],"ans":["대부분 나가 길어 보인다고 답한다. 자로 재거나 겹쳐 보는 등 확인 방법을 스스로 말하는지 본다.","사실을 알아도 착각은 사라지지 않는다. 확신의 세기가 옳음을 보장하지 않으며, 그래서 판단을 확인하는 절차가 따로 필요하다는 데까지 나아가는지 본다."]},{"parts":["의료 현장에서 \"그렇게 보이는 것\"과 \"실제로 그런 것\"이 다를 수 있는 예를 하나 들고, 그 차이를 줄이기 위해 무엇을 하는지 설명하시오.","경험 많은 선배의 직관과 검사 결과가 서로 다를 때 지원자는 어떻게 하겠는가?"],"ans":["예: 겉으로 멀쩡해 보이는 환자의 검사 이상, 통증의 위치와 실제 원인의 차이. 측정, 재확인, 동료의 점검 같은 방법을 드는지 본다.","어느 한쪽을 무조건 따르지 않고, 검사를 다시 확인하거나 추가 정보를 구하며, 선배에게 근거를 묻고 자신의 생각을 예의 있게 말하는지 본다."]},{"parts":["이 의사의 판단 과정에서 무엇이 문제였는가?","그림과 관련지어 설명하시오."],"ans":["확신의 세기와 판단의 옳음은 별개이며, 잘 맞아 온 직관일수록 확인 절차를 건너뛰기 쉽다는 점을 짚는지 본다."]},{"parts":["경험이 많을수록 확신이 강해지는 것은 장점인가 약점인가?","숙련된 전문가가 스스로의 확신을 점검할 수 있는 방법을 제안하시오."],"ans":["경험의 값을 인정하면서도, 정해진 확인 목록, 동료의 재확인, 틀린 사례의 기록과 되돌아보기 같은 구체적 방법을 내는지 본다."]}]},{"kind":"기출","src":"2026학년도 의과대학 제시문 [5]","page":"적성·인성면접 문항집","scope":"상황/제시문 기반 면접","concept":"자료 해석, 실험 설계, 보상과 행동","ansLabel":"예상 질문의 평가 포인트 (서울대는 이 제시문의 질문을 공개하지 않았습니다)","follow":[],"noAnswer":true,"only":["의과대학"],"body":"<p>금전적 보상이 금연 성공률에 미치는 영향에 관한 연구이다. 연구진은 금연 프로그램에 참여할 성인 자원자 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>300</mn></mrow><annotation encoding=\"application/x-tex\">300</annotation></semantics></math></span>명을 온라인으로 모집하여 무작위로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span>명씩 세 그룹에 배정한 뒤, 각 자원자에게 참여 의사를 확인하였다. 자원자는 다른 그룹의 정보를 알지 못한다.</p>\n<table><tr><th>그룹</th><th>프로그램 내용</th><th>배정</th><th>참여 수락</th><th>6개월 금연 성공</th></tr>\n<tr><th>A</th><td>금연 보조제만 제공</td><td>100명</td><td>100명</td><td>6명</td></tr>\n<tr><th>B</th><td>금연 보조제 제공. 6개월 금연에 성공하면 80만 원 지급(실패하면 없음)</td><td>100명</td><td>100명</td><td>15명</td></tr>\n<tr><th>C</th><td>금연 보조제 제공. 시작 전 15만 원을 스스로 예치. 성공하면 예치금을 돌려받고 65만 원을 더 받음(실패하면 예치금을 돌려받지 못함)</td><td>100명</td><td>20명</td><td>12명</td></tr></table>","qs":["세 그룹의 결과를 비교하여 설명하시오. 어느 프로그램이 가장 효과적이라고 할 수 있는가?","그룹 C의 성공 인원을 배정 인원 기준으로 볼 때와 참여 인원 기준으로 볼 때 결론이 어떻게 달라지는가?","이 결과를 실제 금연 정책에 쓰려면 무엇을 더 확인해야 하는가?"],"ans":["성공률을 기준에 따라 구분해 말하는지 본다(A 6 %, B 15 %, C는 배정 기준 12 %, 참여 기준 60 %).","예치금을 낼 만큼 의지가 강한 사람만 참여했을 가능성(선택 효과)과, 참여율이 낮다는 점을 함께 짚는지 본다.","6개월 이후의 재흡연, 보상이 끝난 뒤의 지속성, 비용, 참여를 꺼리는 사람을 끌어들일 방법 등을 드는지 본다."]},{"kind":"기출","src":"2026학년도 의과대학 제시문 [4]","page":"적성·인성면접 문항집","scope":"상황/제시문 기반 면접","concept":"사과와 책임, 제도 설계, 의사소통","ansLabel":"예상 질문의 평가 포인트 (서울대는 이 제시문의 질문을 공개하지 않았습니다)","follow":[],"noAnswer":true,"only":["의과대학"],"body":"<p>A국에서는 분쟁이 생겼을 때 상대에게 사과하면 법적 과실을 인정한 것으로 여겨져 소송에서 불리한 증거가 될 수 있다는 우려가 컸다. 그래서 가해자가 유감을 표하고 싶어도 침묵했고, 감정싸움이 격해져 소송이 길어지는 사회적 비용이 생겼다.</p>\n<p>이에 A국은 '사과법'을 만들었다. 분쟁 당사자가 한 사과나 후회의 표현을 법적 책임의 인정으로 보지 않고, 민사 소송에서 불리한 증거로 쓰지 못하게 한 것이 핵심이다.</p>","qs":["사과법이 기대하는 효과와 우려되는 부작용을 각각 말하시오.","의료 현장에서 예상하지 못한 나쁜 결과가 생겼을 때 의료인이 환자와 가족에게 어떻게 말해야 한다고 생각하는가?","법적 불이익이 없는 사과는 진정한 사과인가?"],"ans":["효과(대화의 물꼬, 소송 감소)와 부작용(형식적 사과, 책임 회피의 수단)을 균형 있게 드는지 본다.","사실을 숨기지 않고 설명하는 일, 유감의 표현, 앞으로의 조치를 구분해 말하는지 본다.","사과의 값이 불이익의 감수에서 오는지, 상대의 회복에서 오는지 자기 기준을 세워 답하는지 본다."]},{"kind":"기출","src":"2026학년도 수의과대학 제시문 [4]","page":"적성·인성면접 문항집","scope":"상황/제시문 기반 면접","concept":"인공지능과 책임, 보호자와의 소통","ansLabel":"예상 질문의 평가 포인트 (서울대는 이 제시문의 질문을 공개하지 않았습니다)","follow":[],"noAnswer":true,"only":["수의과대학"],"body":"<p>지원자가 수의사로 일하는 동물병원의 진료 기록 시스템에는 퇴원 안내문을 인공지능이 작성해 주는 기능이 있다. 보호자 A는 퇴원 안내문에 자동으로 잘못 입력된 정보를 믿고 따랐고, 그날 저녁 반려견의 증상이 나빠져 급히 다시 병원에 왔다.</p>","qs":["다시 온 보호자 A에게 무엇을 먼저 하고 어떻게 말하겠는가?","이 일의 책임은 누구에게 있다고 생각하는가?","같은 일이 되풀이되지 않게 하려면 병원은 무엇을 바꾸어야 하는가?"],"ans":["동물의 처치를 가장 먼저 하고, 잘못을 숨기지 않고 설명하며 사과하는 순서를 말하는지 본다.","도구를 쓴 수의사의 확인 책임을 인정하면서 병원의 체계와 개발사의 몫도 구분하는지 본다.","안내문을 내보내기 전 사람이 확인하는 절차 등 구체적인 방안을 내는지 본다."]},{"kind":"기출","src":"2026학년도 수의과대학 제시문 [2]","page":"적성·인성면접 문항집","scope":"상황/제시문 기반 면접","concept":"공정성, 배려와 형평","ansLabel":"예상 질문의 평가 포인트 (서울대는 이 제시문의 질문을 공개하지 않았습니다)","follow":[],"noAnswer":true,"only":["수의과대학"],"body":"<p>난독증은 글을 정확하고 유창하게 읽지 못하고 철자를 정확하게 쓰기 힘들어하는 학습 장애의 한 유형이다. A 고등학교는 중간고사에서 난독증이 있는 학생에게 시험 시간을 늘려 주기로 결정했다.</p>","qs":["A 고등학교의 결정에 찬성하는가? 이유를 말하시오.","\"같은 시험인데 시간이 다르면 불공정하다\"고 말하는 학생에게 어떻게 설명하겠는가?","시간을 얼마나 늘려 줄지는 무엇을 기준으로 정해야 하는가?"],"ans":["시험이 재려는 능력이 무엇인지에서 출발해 판단하는지 본다.","같게 대하는 것과 공정하게 대하는 것을 구분하고, 상대의 불만을 인정하며 설명하는지 본다.","객관적 진단, 시험의 목적, 다른 학생에게 미치는 영향 등을 기준으로 드는지 본다."]},{"kind":"기출","src":"2026학년도 치의학과 제시문 [2]","page":"적성·인성면접 문항집","scope":"상황/제시문 기반 면접","concept":"공로의 배분, 리더십, 이해관계의 조정","ansLabel":"예상 질문의 평가 포인트 (서울대는 이 제시문의 질문을 공개하지 않았습니다)","follow":[],"noAnswer":true,"only":["치의학대학원"],"body":"<p class=\"note2\">제시문은 원문을 요약한 것입니다.</p><p>1592년 전라 좌수사 이순신은 새 전투함이 필요하다고 판단하여 부하 장수 나대용에게 거북선의 설계를 맡겼다. 나대용은 설계와 제작을 모두 맡아 세부 기술을 완성했고, 이순신은 사천 해전에서 거북선을 앞세운 전략으로 크게 이겼다. 임금은 이번 승전의 최고 공로자를 분명히 적어 올리라고 명했다.</p>\n<p>나대용을 최고 공로자로 적으면 기술 개발자의 몫이 인정되지만 지휘관의 권위와 입지가 약해질 수 있다. 이순신을 적으면 지도력이 부각되어 민심 안정에 좋지만 공을 독차지했다는 말이 나올 수 있다. 함께 적으면 임금이 최고 공로자가 모호하다며 언짢아할 수 있다. 보고는 포상, 진급, 역사 기록에 그대로 반영되므로 장수와 군졸 모두가 지켜보고 있다. (역사적 사실을 바탕으로 각색한 글)</p>","qs":["지원자가 이순신이라면 보고를 어떻게 쓰겠는가?","그 결정으로 불만을 가질 사람은 누구이며 어떻게 대하겠는가?","여럿이 함께 이룬 성과에서 공로를 나누는 기준은 무엇이어야 하는가?"],"ans":["선택과 근거를 분명히 하고, 사실을 왜곡하지 않는 범위에서 방법을 찾는지 본다.","불만을 가질 사람을 구체적으로 짚고 설명과 보상의 방법을 내는지 본다.","기여의 종류(구상, 실행, 책임)를 구분하고 일관된 기준을 세우는지 본다."]},{"kind":"기출","src":"2026학년도 치의학과 제시문 [3]","page":"적성·인성면접 문항집","scope":"상황/제시문 기반 면접","concept":"책임의 소재, 자율과 감독","ansLabel":"예상 질문의 평가 포인트 (서울대는 이 제시문의 질문을 공개하지 않았습니다)","follow":[],"noAnswer":true,"only":["치의학대학원"],"body":"<p class=\"note2\">제시문은 원문을 요약한 것입니다.</p><p>한 치과 대학의 학생들이 학교의 승인을 받아 지역 사회 구강 보건 봉사 활동을 했다. 학생들이 프로그램을 설계하고 현장을 이끌었으며, 환자들의 만족도가 높아 지역 언론에도 좋게 보도되었다. 그런데 봉사에 참여한 한 학생의 흡연으로 화재 사고가 있었다는 사실이 뒤늦게 알려졌고, 언론은 사고의 책임이 누구에게 있는지 물었다. 책임을 누가 지느냐에 따라 활동의 성과, 학교의 위상, 앞으로의 학생 자율 활동 지원이 달라질 수 있어 학내 의견이 엇갈렸다.</p>","qs":["이 사고의 책임은 누구에게 있다고 생각하는가?","지원자가 이 봉사 활동의 학생 대표였다면 언론의 추가 인터뷰에 어떻게 답하겠는가?","학교는 앞으로 학생 자율 활동을 줄여야 하는가?"],"ans":["개인, 학생 조직, 승인한 학교의 책임을 구분해 말하는지 본다.","사실을 숨기지 않고, 성과와 사고를 분리해 말하며, 후속 조치를 밝히는지 본다.","자율을 없애는 것과 안전 장치를 더하는 것을 구분하는지 본다."]},{"kind":"기출","src":"2026학년도 간호대학 제시문 [1]","page":"적성·인성면접 문항집","scope":"상황/제시문 기반 면접","concept":"자료 해석, 간호 인력과 환자 안전","ansLabel":"예상 질문의 평가 포인트 (서울대는 이 제시문의 질문을 공개하지 않았습니다)","follow":[],"noAnswer":true,"only":["간호대학"],"body":"<p>한 연구는 간호사 한 명이 환자 네 명을 맡는 경우를 기준으로, 환자 여섯 명을 맡을 때(A)와 여덟 명을 맡을 때(B) 추가로 생기는 사망자 수를 그래프로 나타냈다. 맡는 환자가 많을수록 추가 사망자 수가 많았다. (원문의 그래프는 문항집 참조. Aiken 등(2002)의 연구를 참고한 자료)</p>","qs":["이 자료가 말해 주는 바를 설명하시오.","간호사 한 명이 맡는 환자가 늘면 왜 사망자가 늘어난다고 생각하는가?","인력을 늘리기 어려운 병원이라면 환자 안전을 위해 무엇을 할 수 있는가?"],"ans":["자료를 있는 그대로 읽고, 상관관계와 인과 관계를 구분해 말하는지 본다.","관찰과 처치의 지연, 피로와 실수 등 구체적인 경로를 드는지 본다.","우선순위 정하기, 업무 분담, 소통 절차 등 현실적인 방안을 내는지 본다."]},{"kind":"기출","src":"2026학년도 간호대학 제시문 [2]","page":"적성·인성면접 문항집","scope":"상황/제시문 기반 면접","concept":"지역 사회와 재활 시설, 갈등 조정","ansLabel":"예상 질문의 평가 포인트 (서울대는 이 제시문의 질문을 공개하지 않았습니다)","follow":[],"noAnswer":true,"only":["간호대학"],"body":"<p class=\"note2\">제시문은 원문을 요약한 것입니다.</p><p>정신 질환자와 마약류 중독자가 늘면서 사회 복귀를 돕는 재활 시설을 늘려야 하지만, 지역 주민의 반발로 어려움을 겪고 있다. 한 마을에서는 요양원 건립 계획에 주민들이 반대해 공사가 중지되었고, 한 마약 중독 재활 센터는 학교 근처의 유해 시설이라는 민원 때문에 반년 사이에 두 번 자리를 옮겼다. (신문 기사 일부를 요약)</p>","qs":["주민들이 반대하는 이유를 그들의 처지에서 설명해 보시오.","지원자가 재활 시설의 간호사라면 주민 설명회에서 무엇을 말하겠는가?","이런 시설은 어디에 지어야 하는가? 그 기준은 무엇인가?"],"ans":["반대를 이기심으로만 몰지 않고 불안의 내용을 구체적으로 짚는지 본다.","사실에 근거한 정보, 안전 관리 방법, 주민의 우려를 듣는 태도를 함께 말하는지 본다.","이용자의 접근성과 주민의 우려를 함께 고려한 기준과 절차를 내는지 본다."]}],"phy":[{"kind":"연습","src":"연습 1 · 번지점프","scope":"물리학Ⅰ · 물리학Ⅱ","concept":"역학적 에너지 보존, 탄성력과 탄성 퍼텐셜 에너지, 뉴턴 운동 법칙, 단진동의 주기","body":"<p>질량이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>60</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></mrow></mrow><annotation encoding=\"application/x-tex\">60\\ \\mathrm{kg}</annotation></semantics></math></span>인 사람이 다리 위에서 가만히 있다가 뛰어내린다. 사람의 몸에는 원래 길이가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">20\\ \\mathrm{m}</annotation></semantics></math></span>인 줄이 묶여 있고, 줄의 다른 끝은 뛰어내리는 곳에 고정되어 있다. 줄은 원래 길이보다 늘어났을 때에만 용수철 상수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>120</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">/</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow><annotation encoding=\"application/x-tex\">120\\ \\mathrm{N/m}</annotation></semantics></math></span>인 용수철처럼 힘을 주고, 느슨할 때에는 힘을 주지 않는다.</p><figure><svg viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"다리에서 뛰어내린 사람과 줄의 길이 변화\">\n<rect class=\"sand\" x=\"20\" y=\"14\" width=\"120\" height=\"14\"/><line class=\"ax\" x1=\"20\" y1=\"28\" x2=\"140\" y2=\"28\"/>\n<line class=\"dash\" x1=\"120\" y1=\"28\" x2=\"340\" y2=\"28\"/><line class=\"dash\" x1=\"120\" y1=\"108\" x2=\"340\" y2=\"108\"/><line class=\"dash\" x1=\"120\" y1=\"188\" x2=\"340\" y2=\"188\"/>\n<line class=\"ln\" x1=\"130\" y1=\"28\" x2=\"130\" y2=\"108\"/><circle class=\"pt\" cx=\"130\" cy=\"112\" r=\"5\"/>\n<line class=\"ln2\" x1=\"230\" y1=\"28\" x2=\"230\" y2=\"188\"/><circle class=\"pt\" cx=\"230\" cy=\"192\" r=\"5\"/>\n<text x=\"150\" y=\"24\">다리 (뛰어내리는 곳)</text><text x=\"244\" y=\"72\">줄의 원래 길이 20 m</text><text x=\"244\" y=\"104\">줄이 팽팽해지기 시작</text><text x=\"244\" y=\"184\">가장 낮은 곳</text>\n<path class=\"sea\" d=\"M20,214 h320 v12 h-320 z\"/><text x=\"30\" y=\"210\">수면</text>\n</svg><figcaption>[그림] 줄은 원래 길이보다 늘어난 동안에만 용수철처럼 힘을 준다</figcaption></figure>\n<p>사람은 연직 방향으로만 움직이고, 사람의 크기, 줄의 질량, 공기 저항은 무시한다. 중력 가속도는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">/</mi><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup></mrow></mrow><annotation encoding=\"application/x-tex\">10\\ \\mathrm{m/s^2}</annotation></semantics></math></span>이다.</p><div class=\"box\"><b>토막글 · 용수철에 매달린 물체의 운동</b><p>용수철 상수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>인 용수철에 매달린 질량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>인 물체는 알짜힘이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>인 점을 중심으로 왕복 운동(단진동)을 하며, 그 주기는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>m</mi><mi>k</mi></mfrac></mstyle></msqrt></mrow><annotation encoding=\"application/x-tex\">T=2\\pi\\sqrt{\\dfrac mk}</annotation></semantics></math></span>이다. 중심에서의 변위는 시간에 대한 사인 함수 꼴이고, 각진동수는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><msqrt><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>k</mi><mi>m</mi></mfrac></mstyle></msqrt></mrow><annotation encoding=\"application/x-tex\">\\omega=\\sqrt{\\dfrac km}</annotation></semantics></math></span>이다.</p></div>","qs":[],"ans":[],"follow":["속력이 최대인 곳과 가속도가 최대인 곳은 왜 다른가?","줄이 팽팽한 동안의 운동은 어떤 운동과 같은가? 주기는 무엇으로 정해지는가?"],"groups":[{"parts":["줄이 팽팽해지기 시작하는 순간 사람의 속력을 구하시오.","떨어지는 동안 사람의 속력이 가장 큰 곳은 뛰어내린 곳에서 몇 m 아래인가? 그 이유를 힘으로 설명하고, 그때의 속력을 구하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">20\\ \\mathrm{m}</annotation></semantics></math></span>를 자유 낙하하므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mrow><mn>2</mn><mi>g</mi><mi>L</mi></mrow></msqrt><mo>=</mo><msqrt><mrow><mn>2</mn><mo>×</mo><mn>10</mn><mo>×</mo><mn>20</mn></mrow></msqrt><mo>=</mo><mn>20</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">/</mi><mi mathvariant=\"normal\">s</mi></mrow></mrow><annotation encoding=\"application/x-tex\">v=\\sqrt{2gL}=\\sqrt{2\\times10\\times20}=20\\ \\mathrm{m/s}</annotation></semantics></math></span>.","줄이 팽팽해진 뒤에도 탄성력이 중력보다 작은 동안은 계속 빨라진다. 알짜힘이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>인 곳, 즉 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mi>x</mi><mo>=</mo><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">kx=mg</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>5</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">x=5\\ \\mathrm{m}</annotation></semantics></math></span> 늘어난 곳(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">25\\ \\mathrm{m}</annotation></semantics></math></span> 아래)에서 속력이 최대. 에너지 보존: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>g</mi><mo stretchy=\"false\">(</mo><mn>25</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>k</mi><mo stretchy=\"false\">(</mo><mn>5</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">mg(25)=\\tfrac12mv^2+\\tfrac12k(5)^2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15000</mn><mo>=</mo><mn>30</mn><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mn>1500</mn></mrow><annotation encoding=\"application/x-tex\">15000=30v^2+1500</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><mn>15</mn><msqrt><mn>2</mn></msqrt><mo>≈</mo><mn>21</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">/</mi><mi mathvariant=\"normal\">s</mi></mrow></mrow><annotation encoding=\"application/x-tex\">v=15\\sqrt2\\approx21\\ \\mathrm{m/s}</annotation></semantics></math></span>."]},{"parts":["사람이 가장 낮은 곳에 이르렀을 때 뛰어내린 곳에서 몇 m 아래에 있는가? 그 순간 사람의 가속도의 크기와 방향을 구하시오.","같은 줄로 질량이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>80</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></mrow></mrow><annotation encoding=\"application/x-tex\">80\\ \\mathrm{kg}</annotation></semantics></math></span>인 사람이 뛰어내린다. 뛰어내리는 곳이 수면에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>45</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">45\\ \\mathrm{m}</annotation></semantics></math></span> 위에 있다면 이 사람은 수면에 닿는가? 계산으로 판단하고, 안전을 위해 무엇을 바꾸어야 하는지 말하시오."],"ans":["가장 낮은 곳에서 속력이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>g</mi><mo stretchy=\"false\">(</mo><mn>20</mn><mo>+</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">mg(20+x)=\\tfrac12kx^2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>10</mn><mi>x</mi><mo>−</mo><mn>200</mn><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">x^2-10x-200=0</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>20</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">x=20\\ \\mathrm{m}</annotation></semantics></math></span>. 따라서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">40\\ \\mathrm{m}</annotation></semantics></math></span> 아래. 알짜힘은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mi>x</mi><mo>−</mo><mi>m</mi><mi>g</mi><mo>=</mo><mn>2400</mn><mo>−</mo><mn>600</mn><mo>=</mo><mn>1800</mn><mtext> </mtext><mi mathvariant=\"normal\">N</mi></mrow><annotation encoding=\"application/x-tex\">kx-mg=2400-600=1800\\ \\mathrm{N}</annotation></semantics></math></span>(위쪽), 가속도는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">/</mi><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup></mrow></mrow><annotation encoding=\"application/x-tex\">30\\ \\mathrm{m/s^2}</annotation></semantics></math></span>로 위쪽.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>800</mn><mo stretchy=\"false\">(</mo><mn>20</mn><mo>+</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>60</mn><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">800(20+x)=60x^2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>40</mn><mi>x</mi><mo>−</mo><mn>800</mn><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">3x^2-40x-800=0</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>40</mn><mo>+</mo><msqrt><mn>11200</mn></msqrt></mrow><mn>6</mn></mfrac></mstyle><mo>≈</mo><mn>24.3</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">x=\\dfrac{40+\\sqrt{11200}}{6}\\approx24.3\\ \\mathrm{m}</annotation></semantics></math></span>. 가장 낮은 곳은 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>44.3</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">44.3\\ \\mathrm{m}</annotation></semantics></math></span> 아래로, 수면에 닿지는 않지만 여유가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">m</mi></mrow><annotation encoding=\"application/x-tex\">1\\ \\mathrm{m}</annotation></semantics></math></span>도 안 된다. 사람의 키를 생각하면 위험하다. 더 짧은 줄이나 용수철 상수가 더 큰 줄을 써야 한다."]},{"parts":["줄이 팽팽해진 순간부터 가장 낮은 곳에 이를 때까지의 운동은 어느 점을 중심으로 하고 진폭이 얼마인 단진동의 일부인가?","이 구간에 걸리는 시간을 구하고, 뛰어내린 순간부터 가장 낮은 곳까지 걸리는 전체 시간을 구하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>2</mn></msqrt><mo>≈</mo><mn>1.41</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt2\\approx1.41</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>ϕ</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\sin\\phi=\\dfrac13</annotation></semantics></math></span>인 예각 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi><mo>≈</mo><mn>0.34</mn></mrow><annotation encoding=\"application/x-tex\">\\phi\\approx0.34</annotation></semantics></math></span> rad, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14</mn></mrow><annotation encoding=\"application/x-tex\">\\pi\\approx3.14</annotation></semantics></math></span>)"],"ans":["중심은 줄이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span> m 늘어난 곳(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">25</annotation></semantics></math></span> m 아래), 진폭은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mo>−</mo><mn>25</mn><mo>=</mo><mn>15</mn></mrow><annotation encoding=\"application/x-tex\">40-25=15</annotation></semantics></math></span> m. 팽팽해진 순간의 변위는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">-5</annotation></semantics></math></span> m이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>15</mn><mi>sin</mi><mo>⁡</mo><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">-15\\sin\\phi</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>ϕ</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\sin\\phi=\\dfrac13</annotation></semantics></math></span>, 최저점까지 위상이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>π</mi><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\phi+\\dfrac\\pi2</annotation></semantics></math></span>만큼 진행. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">\\omega=\\sqrt2</annotation></semantics></math></span> rad/s이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>0.34</mn><mo>+</mo><mn>1.57</mn></mrow><mn>1.41</mn></mfrac></mstyle><mo>≈</mo><mn>1.35</mn></mrow><annotation encoding=\"application/x-tex\">t=\\dfrac{0.34+1.57}{1.41}\\approx1.35</annotation></semantics></math></span>초. 자유 낙하 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>초를 더해 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.35</mn></mrow><annotation encoding=\"application/x-tex\">3.35</annotation></semantics></math></span>초."]},{"parts":["공기 저항과 줄 내부의 마찰이 없다면 사람은 다시 어디까지 올라가는가?","실제로는 되튀어 오르는 높이가 점점 낮아지다가 한 점에서 멈춘다. 멈추는 곳은 어디이며, 처음의 역학적 에너지 가운데 얼마가 다른 형태로 바뀌었는지 구하시오."],"ans":["역학적 에너지가 보존되므로 뛰어내린 높이(다리)까지 돌아온다. 실제로는 알짜힘이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>인 곳, 곧 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">25</annotation></semantics></math></span> m 아래에서 멈춘다. 처음(다리)과 견준 에너지 변화는 중력 퍼텐셜 에너지 감소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>600</mn><mo>×</mo><mn>25</mn><mo>=</mo><mn>15000</mn></mrow><annotation encoding=\"application/x-tex\">600\\times25=15000</annotation></semantics></math></span> J에서 탄성 퍼텐셜 에너지 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo>⋅</mo><mn>120</mn><mo>⋅</mo><msup><mn>5</mn><mn>2</mn></msup><mo>=</mo><mn>1500</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac12\\cdot120\\cdot5^2=1500</annotation></semantics></math></span> J를 뺀 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>13500</mn></mrow><annotation encoding=\"application/x-tex\">13500</annotation></semantics></math></span> J이 열 등으로 바뀌었다."]}]},{"kind":"연습","src":"연습 2 · 두 스피커 사이의 조용한 자리","scope":"물리학Ⅰ","concept":"파동의 속력·파장·진동수, 파동의 간섭, 경로차의 범위, 실제와 모형의 차이","body":"<p>같은 소리를 같은 위상으로 내는 두 스피커 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">S</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{S_1}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">S</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{S_2}</annotation></semantics></math></span>가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">3</annotation></semantics></math></span> m 떨어져 있다. 관측자는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">S</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{S_1}</annotation></semantics></math></span>에서 두 스피커를 잇는 선분에 수직인 방향으로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span> m 떨어진 점 P에 서 있다. 소리의 속력은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>340</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">/</mi><mi mathvariant=\"normal\">s</mi></mrow></mrow><annotation encoding=\"application/x-tex\">340\\ \\mathrm{m/s}</annotation></semantics></math></span>이고, 처음에 두 스피커는 진동수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>680</mn></mrow><annotation encoding=\"application/x-tex\">680</annotation></semantics></math></span> Hz인 소리를 낸다.</p><div class=\"box\"><b>토막글 · 두 파원 사이</b><p>두 파원에서 같은 위상으로 나온 파동이 만날 때, 두 파원까지의 거리의 차(경로차)가 반파장의 짝수 배인 곳에서는 보강 간섭이, 홀수 배인 곳에서는 상쇄 간섭이 일어난다. 한 점에서 두 파원까지의 거리의 차는 두 파원 사이의 거리보다 클 수 없다.</p></div>","qs":[],"ans":[],"follow":["P를 S₁에서 더 멀리 옮기면 경로차는 어떻게 변하는가?","두 스피커의 위상이 반대라면 문제 1의 (2)의 답은?"],"groups":[{"parts":["이 소리의 파장을 구하시오.","점 P에서 두 소리는 보강 간섭하는가, 상쇄 간섭하는가?"],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>340</mn><mn>680</mn></mfrac></mstyle><mo>=</mo><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">\\lambda=\\dfrac{340}{680}=0.5</annotation></semantics></math></span> m.","P에서 두 스피커까지의 거리는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span> m와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span> m, 경로차 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> m는 파장의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>배이므로 보강 간섭."]},{"parts":["진동수를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>680</mn></mrow><annotation encoding=\"application/x-tex\">680</annotation></semantics></math></span> Hz에서 서서히 높여 가면 점 P에서 소리가 처음으로 가장 작아지는 진동수는 얼마인가?","소음 제거 이어폰은 바깥 소리를 마이크로 받아 그것을 지우는 소리를 만들어 낸다. 그 원리를 설명하고, 이 방식이 낮은 소리(파장이 긴 소리)에 더 잘 듣는 이유를 추론하시오."],"ans":["경로차 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> m가 파장의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.5</mn></mrow><annotation encoding=\"application/x-tex\">2.5</annotation></semantics></math></span>배가 될 때 처음 상쇄된다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mo>=</mo><mn>0.4</mn></mrow><annotation encoding=\"application/x-tex\">\\lambda=0.4</annotation></semantics></math></span> m, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo>=</mo><mn>850</mn></mrow><annotation encoding=\"application/x-tex\">f=850</annotation></semantics></math></span> Hz.","바깥 소리와 진폭이 같고 위상이 반대인 소리를 겹쳐 상쇄 간섭을 일으킨다. 파장이 길면 귀 안의 위치가 조금 달라져도 위상 차가 거의 변하지 않아 상쇄가 잘 유지된다. 파장이 짧으면 작은 위치 차이나 시간 지연에도 위상이 크게 어긋난다."]},{"parts":["진동수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>680</mn></mrow><annotation encoding=\"application/x-tex\">680</annotation></semantics></math></span> Hz일 때 두 스피커를 잇는 선분 위(양 끝 제외)에서 상쇄 간섭이 일어나는 점은 모두 몇 개인가?","이 가운데 이웃한 두 점 사이의 거리는 얼마이며, 그 값이 파장과 어떤 관계인지 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">S</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{S_1}</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> m인 점의 경로차는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∣</mi><mn>2</mn><mi>x</mi><mo>−</mo><mn>3</mn><mi mathvariant=\"normal\">∣</mi></mrow><annotation encoding=\"application/x-tex\">|2x-3|</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>x</mi><mo>&lt;</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">0&lt;x&lt;3</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∣</mi><mn>2</mn><mi>x</mi><mo>−</mo><mn>3</mn><mi mathvariant=\"normal\">∣</mi><mo>=</mo><mn>0.25</mn><mo separator=\"true\">,</mo><mn>0.75</mn><mo separator=\"true\">,</mo><mo>⋯</mo><mtext> </mtext><mo separator=\"true\">,</mo><mn>2.75</mn></mrow><annotation encoding=\"application/x-tex\">|2x-3|=0.25,0.75,\\cdots,2.75</annotation></semantics></math></span>가 되는 점이 각각 둘씩, 모두 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">12</annotation></semantics></math></span>개. 이웃한 점 사이의 거리는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.25</mn></mrow><annotation encoding=\"application/x-tex\">0.25</annotation></semantics></math></span> m로 반파장이다. 서로 마주 보고 진행하는 두 파동이 만드는 정상파의 마디 간격과 같다."]},{"parts":["실제로 이 실험을 하면 \"상쇄 간섭이 일어나는 곳\"에서도 소리가 완전히 사라지지는 않는다. 이유를 두 가지 이상 추론하시오.","또 한 스피커에 연결된 전선의 두 극을 바꾸어 끼우면 문제 1과 문제 2의 (1)의 결과가 어떻게 달라지는지 말하시오."],"ans":["두 스피커까지의 거리가 달라 두 소리의 진폭이 같지 않다. 벽과 바닥에서 반사된 소리가 더해진다. 스피커가 한 진동수만 내지 않는다. 귀가 두 개라 위치가 조금 다르다. 극을 바꾸면 두 소리의 위상이 반대가 되어 보강과 상쇄의 자리가 서로 바뀐다. P는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>680</mn></mrow><annotation encoding=\"application/x-tex\">680</annotation></semantics></math></span> Hz에서 상쇄, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>850</mn></mrow><annotation encoding=\"application/x-tex\">850</annotation></semantics></math></span> Hz에서 보강이 된다."]}]},{"kind":"연습","src":"연습 3 · 전기를 멀리 보내는 방법","scope":"물리학Ⅰ · 물리학Ⅱ","concept":"전력, 저항에서의 열 발생, 전자기 유도와 변압기, 변압기의 전압·전류 관계, 대안의 비교","body":"<p>발전소에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span> kW의 전력을 저항이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">10\\ \\Omega</annotation></semantics></math></span>인 송전선으로 도시에 보낸다. 송전선에서 열로 잃는 전력은 송전선에 흐르는 전류의 제곱과 저항의 곱이다.</p><div class=\"box\"><b>토막글 · 변압기</b><p>에너지 손실이 없는 변압기에서 1차 코일과 2차 코일의 전압의 비는 감은 수의 비와 같고(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>1</mn></msub><mo>:</mo><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><msub><mi>N</mi><mn>1</mn></msub><mo>:</mo><msub><mi>N</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_1:V_2=N_1:N_2</annotation></semantics></math></span>), 1차 코일에 공급되는 전력과 2차 코일에서 나오는 전력은 같다. 도선의 저항은 길이에 비례하고 단면적에 반비례한다.</p></div>","qs":[],"ans":[],"follow":["전압을 높이면 송전선에 걸리는 전압도 커지는가?","가정에 들어오기 전에 전압을 다시 낮추는 이유는?"],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2000</mn></mrow><annotation encoding=\"application/x-tex\">2000</annotation></semantics></math></span> V로 보낼 때 송전선에 흐르는 전류와 송전선에서 잃는 전력을 구하시오.","같은 전력을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20000</mn></mrow><annotation encoding=\"application/x-tex\">20000</annotation></semantics></math></span> V로 보내면 잃는 전력은 몇 배가 되는가?"],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>100000</mn><mn>2000</mn></mfrac></mstyle><mo>=</mo><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">I=\\dfrac{100000}{2000}=50</annotation></semantics></math></span> A, 손실 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>50</mn><mn>2</mn></msup><mo>×</mo><mn>10</mn><mo>=</mo><mn>25000</mn></mrow><annotation encoding=\"application/x-tex\">50^2\\times10=25000</annotation></semantics></math></span> W <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">=25</annotation></semantics></math></span> kW.","전류가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span> A가 되어 손실은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>250</mn></mrow><annotation encoding=\"application/x-tex\">250</annotation></semantics></math></span> W, 즉 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>100</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1{100}</annotation></semantics></math></span>배."]},{"parts":["잃는 전력이 보내는 전력의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">1\\,\\%</annotation></semantics></math></span> 이하가 되려면 전압이 얼마 이상이어야 하는가?","전압을 바꾸는 데 쓰는 변압기의 원리를 전자기 유도로 설명하고, 건전지와 같은 직류 전원으로는 변압기가 작동하지 않는 이유를 말하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>I</mi><mn>2</mn></msup><mo>×</mo><mn>10</mn><mo>≤</mo><mn>1000</mn></mrow><annotation encoding=\"application/x-tex\">I^2\\times10\\le1000</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>≤</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">I\\le10</annotation></semantics></math></span> A, 전압은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10000</mn></mrow><annotation encoding=\"application/x-tex\">10000</annotation></semantics></math></span> V 이상.","1차 코일의 교류가 철심 속 자기장을 계속 변화시키고, 이 변화가 2차 코일에 유도 기전력을 만든다. 전압의 비는 감은 수의 비와 같다. 직류는 자기장이 변하지 않아 유도 기전력이 생기지 않는다."]},{"parts":["발전소에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2000</mn></mrow><annotation encoding=\"application/x-tex\">2000</annotation></semantics></math></span> V로 만든 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span> kW의 전력을 감은 수의 비가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>:</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">1:10</annotation></semantics></math></span>인 변압기로 높여 보낸다. 변압기의 1차 코일과 2차 코일에 흐르는 전류, 도시에 도착했을 때 송전선 끝의 전압과 전달된 전력을 구하시오.","이것을 가정용 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>220</mn></mrow><annotation encoding=\"application/x-tex\">220</annotation></semantics></math></span> V로 낮추려면 감은 수의 비가 대략 얼마인 변압기가 필요한가?"],"ans":["1차 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">50</annotation></semantics></math></span> A, 2차는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20000</mn></mrow><annotation encoding=\"application/x-tex\">20000</annotation></semantics></math></span> V이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span> A. 송전선에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn><mo>×</mo><mn>10</mn><mo>=</mo><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">5\\times10=50</annotation></semantics></math></span> V가 걸려 끝의 전압은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>19950</mn></mrow><annotation encoding=\"application/x-tex\">19950</annotation></semantics></math></span> V, 전달 전력은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100000</mn><mo>−</mo><mn>250</mn><mo>=</mo><mn>99750</mn></mrow><annotation encoding=\"application/x-tex\">100000-250=99750</annotation></semantics></math></span> W. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>19950</mn><mo>:</mo><mn>220</mn><mo>≈</mo><mn>91</mn><mo>:</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">19950:220\\approx91:1</annotation></semantics></math></span>."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2000</mn></mrow><annotation encoding=\"application/x-tex\">2000</annotation></semantics></math></span> V로 보낼 때의 손실을 줄이는 방법으로 (가) 전압을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>배로 높이는 것과 (나) 송전선을 단면적이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>배인 것으로 바꾸는 것을 비교하시오.","손실이 각각 몇 배가 되는지 구하고, 두 방법의 비용과 한계를 생각하여 실제로 전압을 높이는 쪽을 택하는 이유를 설명하시오."],"ans":["(가) 전류가 절반이 되어 손실은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>4</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac14</annotation></semantics></math></span>배. (나) 저항이 절반이 되어 손실은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac12</annotation></semantics></math></span>배. 전선을 굵게 하면 금속이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>배 들고 무거워져 철탑도 튼튼해야 한다. 전압을 높이는 데는 변압기만 있으면 되고 효과는 제곱으로 커진다. 다만 전압이 높을수록 절연과 안전 거리가 더 필요하다."]}]},{"kind":"연습","src":"연습 4 · 하늘에 멈춰 있는 위성","scope":"물리학Ⅰ · 물리학Ⅱ","concept":"등속 원운동, 중력 법칙, 케플러 법칙, 역학적 에너지, 속력과 궤도의 관계","body":"<p>정지 위성은 지구의 자전과 같은 주기로 적도 위를 돌기 때문에 땅에서 보면 한곳에 멈춰 있는 것처럼 보인다. 달은 지구 중심에서 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>38</mn></mrow><annotation encoding=\"application/x-tex\">38</annotation></semantics></math></span>만 km 떨어진 궤도를 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>27.3</mn></mrow><annotation encoding=\"application/x-tex\">27.3</annotation></semantics></math></span>일에 한 번 돈다. 달과 위성의 궤도는 모두 원이라고 하자.</p><div class=\"box\"><b>토막글 · 궤도와 에너지, 그리고 거리</b><p>(가) 질량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>인 지구 중심에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>만큼 떨어진 곳에 있는 질량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>인 물체의 중력 퍼텐셜 에너지는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mi>r</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">-\\dfrac{GMm}{r}</annotation></semantics></math></span>이다(아주 먼 곳을 기준으로 함).</p><p>(나) 통신 위성에는 정지 위성 말고도 지표에서 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>550</mn></mrow><annotation encoding=\"application/x-tex\">550</annotation></semantics></math></span> km 높이를 도는 저궤도 위성이 있다. 지구의 반지름은 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6400</mn></mrow><annotation encoding=\"application/x-tex\">6400</annotation></semantics></math></span> km이고 전파의 속력은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup></mrow><annotation encoding=\"application/x-tex\">3\\times10^5</annotation></semantics></math></span> km/s이다.</p></div>","qs":[],"ans":[],"follow":["정지 위성은 왜 적도 위에만 있을 수 있는가?","위성의 질량이 2배가 되면 궤도 반지름은?"],"groups":[{"parts":["질량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>인 지구 둘레를 반지름 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>인 원 궤도로 도는 물체의 주기 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>에 대하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">T^2</annotation></semantics></math></span>이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>r</mi><mn>3</mn></msup></mrow><annotation encoding=\"application/x-tex\">r^3</annotation></semantics></math></span>에 비례함을 보이시오.","정지 위성의 궤도 반지름을 구하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>27.3</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">/</mi><mn>3</mn></mrow></msup><mo>≈</mo><mn>9.1</mn></mrow><annotation encoding=\"application/x-tex\">27.3^{2/3}\\approx9.1</annotation></semantics></math></span>)"],"ans":["중력이 구심력: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac></mstyle><mo>=</mo><mi>m</mi><mi>r</mi><msup><mrow><mo fence=\"true\">(</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mi>T</mi></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\dfrac{GMm}{r^2}=m r\\left(\\dfrac{2\\pi}{T}\\right)^2</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mn>2</mn></msup><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>4</mn><msup><mi>π</mi><mn>2</mn></msup></mrow><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></mstyle><msup><mi>r</mi><mn>3</mn></msup></mrow><annotation encoding=\"application/x-tex\">T^2=\\dfrac{4\\pi^2}{GM}r^3</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>38</mn><mtext>만</mtext><mo>×</mo><msup><mrow><mo fence=\"true\">(</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>27.3</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">/</mi><mn>3</mn></mrow></msup><mo>≈</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>38</mn><mtext>만</mtext></mrow><mn>9.1</mn></mfrac></mstyle><mo>≈</mo><mn>4.2</mn></mrow><annotation encoding=\"application/x-tex\">r=38\\text{만}\\times\\left(\\dfrac{1}{27.3}\\right)^{2/3}\\approx\\dfrac{38\\text{만}}{9.1}\\approx4.2</annotation></semantics></math></span>만 km."]},{"parts":["정지 위성과 지표면 가까이를 도는 위성 중 어느 쪽이 더 빠른가? 궤도 반지름과 속력의 관계로 설명하시오.","우주 정거장 안의 우주인이 떠다니는 것은 중력이 없기 때문인가? 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mi>r</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{GMm}{r^2}=\\dfrac{mv^2}{r}</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mi>r</mi></mfrac></mstyle></msqrt></mrow><annotation encoding=\"application/x-tex\">v=\\sqrt{\\dfrac{GM}{r}}</annotation></semantics></math></span>. 반지름이 작을수록 빠르므로 지표면 가까이의 위성이 더 빠르다.","아니다. 그 높이에서도 중력은 지표의 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">90\\,\\%</annotation></semantics></math></span>이다. 정거장과 우주인이 같은 가속도로 지구를 향해 계속 떨어지고 있어서 서로를 누르는 힘이 없을 뿐이다."]},{"parts":["반지름 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>인 원 궤도를 도는 위성의 운동 에너지와 역학적 에너지를 구하시오.","저궤도 위성이 엷은 공기의 저항으로 역학적 에너지를 조금씩 잃으면 궤도 반지름과 속력은 각각 어떻게 변하는가? 저항을 받는데도 속력이 그렇게 변하는 까닭을 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mi>r</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{GMm}{r^2}=\\dfrac{mv^2}r</annotation></semantics></math></span>에서 운동 에너지 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>2</mn><mi>r</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{GMm}{2r}</annotation></semantics></math></span>, 역학적 에너지 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>2</mn><mi>r</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">-\\dfrac{GMm}{2r}</annotation></semantics></math></span>. 에너지를 잃으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>이 작아지고 속력 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mi>r</mi></mfrac></mstyle></msqrt></mrow><annotation encoding=\"application/x-tex\">\\sqrt{\\dfrac{GM}r}</annotation></semantics></math></span>은 커진다. 낮아지며 줄어든 퍼텐셜 에너지의 절반은 운동 에너지 증가로, 나머지 절반은 저항에 의한 열로 간다."]},{"parts":["지상에서 바로 위에 있는 위성까지 전파가 갔다가 돌아오는 데 걸리는 시간을 정지 위성과 저궤도 위성에 대해 각각 구하시오.","이 결과와 문제 2의 (1)을 이용하여 저궤도 위성으로 통신망을 만들 때의 장점과, 위성이 아주 많이 필요한 이유를 설명하시오."],"ans":["정지 위성의 고도는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>42000</mn><mo>−</mo><mn>6400</mn><mo>≈</mo><mn>36000</mn></mrow><annotation encoding=\"application/x-tex\">42000-6400\\approx36000</annotation></semantics></math></span> km, 왕복 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>72000</mn></mrow><annotation encoding=\"application/x-tex\">72000</annotation></semantics></math></span> km로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.24</mn></mrow><annotation encoding=\"application/x-tex\">0.24</annotation></semantics></math></span>초. 저궤도는 왕복 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1100</mn></mrow><annotation encoding=\"application/x-tex\">1100</annotation></semantics></math></span> km로 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.004</mn></mrow><annotation encoding=\"application/x-tex\">0.004</annotation></semantics></math></span>초. 지연이 매우 짧다. 그러나 낮은 위성은 훨씬 빠르게 돌아 한 지점의 하늘에 몇 분밖에 머물지 않고, 낮아서 한 대가 내려다보는 범위도 좁다. 끊기지 않으려면 많은 위성이 이어받아야 한다."]}]},{"kind":"기출","src":"2026학년도 물리학 문제 1","page":"문항집 25~30쪽","scope":"물리학Ⅰ · 물리학Ⅱ","concept":"전자기 유도, 힘의 합성과 분해, 전기 저항, 고체의 에너지띠","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"body":"<p>서로 평행한 가느다란 두 금속 레일이 지면과 각 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>를 이루며 기울어져 있다. 레일 사이의 간격은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>이고, 레일 사이에는 지면에 수직으로 나오는 균일한 자기장 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>가 있다. 레일이 놓인 절연체 빗면은 지면에 고정되어 있고, 중력 가속도는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>이다. 모든 마찰은 무시한다.</p><figure><svg viewBox=\"0 0 360 190\" role=\"img\" aria-label=\"비스듬한 두 금속 레일과 연직 방향 자기장을 옆에서 본 모습\">\n<path class=\"sand\" d=\"M40,160 L300,160 L300,50 Z\"/><line class=\"ax\" x1=\"30\" y1=\"160\" x2=\"330\" y2=\"160\"/><line class=\"ln\" x1=\"40\" y1=\"160\" x2=\"300\" y2=\"50\"/>\n<circle class=\"ball\" cx=\"180\" cy=\"97\" r=\"8\"/><text class=\"c s\" x=\"180\" y=\"101\">M</text>\n<line class=\"ln2\" x1=\"90\" y1=\"150\" x2=\"90\" y2=\"20\"/><path class=\"ln2\" d=\"M86,28 L90,20 L94,28\"/><line class=\"ln2\" x1=\"150\" y1=\"150\" x2=\"150\" y2=\"20\"/><path class=\"ln2\" d=\"M146,28 L150,20 L154,28\"/><line class=\"ln2\" x1=\"210\" y1=\"150\" x2=\"210\" y2=\"20\"/><path class=\"ln2\" d=\"M206,28 L210,20 L214,28\"/><line class=\"ln2\" x1=\"270\" y1=\"150\" x2=\"270\" y2=\"20\"/><path class=\"ln2\" d=\"M266,28 L270,20 L274,28\"/>\n<text x=\"276\" y=\"16\">B</text><text x=\"76\" y=\"154\">θ</text><line class=\"ax\" x1=\"330\" y1=\"60\" x2=\"330\" y2=\"100\"/><path class=\"ax\" d=\"M326,92 L330,100 L334,92\"/><text x=\"338\" y=\"84\">g</text>\n<text x=\"40\" y=\"178\">지면</text><text x=\"120\" y=\"178\">M: 금속 막대 (길이 L, 지면에 수평)</text>\n</svg><figcaption>[그림] 옆에서 본 모습. 간격 L인 두 레일이 지면과 θ의 각을 이루고, 자기장 B는 지면에 수직이다</figcaption></figure>\n<div class=\"box\"><b>토막글 ① 자기장 속에서 전류가 흐르는 도선이 받는 힘</b><p>전류 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>가 흐르는 길이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>인 직선 도선을 균일한 자기장 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span> 속에 자기장과 수직으로 놓으면 도선은 크기 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>=</mo><mi>B</mi><mi>I</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">F=BIL</annotation></semantics></math></span>인 힘을 받는다.</p></div>\n<div class=\"box\"><b>토막글 ② 발광 다이오드의 특성</b><p>다이오드에 순방향 전압을 걸어 충분한 전류가 흐르려면 적어도 띠 간격 에너지 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>g</mi></msub></mrow><annotation encoding=\"application/x-tex\">E_g</annotation></semantics></math></span>에 해당하는 전압이 걸려야 한다. 발광 다이오드가 내는 단색광의 파장은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>g</mi></msub></mrow><annotation encoding=\"application/x-tex\">E_g</annotation></semantics></math></span>로 정해진다. 전압을 서서히 올릴 때 빛이 나오기 시작하는 순간의 전압은 그 빛의 진동수에 비례한다.</p></div>\n<div class=\"box\"><b>토막글 ③ 삼각함수의 순간 변화율</b><p>시간에 따라 주기적으로 변하는 함수가 삼각함수이면, 그 순간 변화율도 같은 주기의 삼각함수 꼴이다.</p></div>","qs":["질량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>, 길이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>인 금속 막대를 레일 위에 지면과 수평이 되게 놓고 전원을 연결하여 전류 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_1</annotation></semantics></math></span>을 흐르게 했더니, 막대가 빗면에서 정지해 있었다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_1</annotation></semantics></math></span>의 크기를 주어진 문자로 나타내시오.","전원을 떼고 전류계를 연결한 뒤 막대를 레일을 따라 내려보냈더니, 막대는 일정한 속력 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>로 내려갔고 전류계에는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_2</annotation></semantics></math></span>가 측정되었다. 막대의 저항은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>이고 다른 저항은 무시한다.<br>(1) <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_2</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>이 포함된 식으로 나타내시오.<br>(2) <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_2</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_1</annotation></semantics></math></span>과 비교하고 그 물리적 의미를 설명하시오.<br>(3) 중력이 막대에 한 일의 일률 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">P_1</annotation></semantics></math></sp
