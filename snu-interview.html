mlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">b=1</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>4</mn></mfrac></mstyle><mo>&lt;</mo><mi>a</mi><mo>&lt;</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>4</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac14&lt;a&lt;\\dfrac34</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mrow><mn>8</mn><mi>a</mi></mrow></mfrac></mstyle><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">b=\\dfrac3{8a}-\\dfrac12</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>≥</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>4</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">a\\ge\\dfrac34</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">b=0</annotation></semantics></math></span>.","경우를 나누어 두 조건을 연립하면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo separator=\"true\">,</mo><mtext> </mtext><mrow><mo fence=\"true\">(</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo separator=\"true\">,</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>4</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mo separator=\"true\">,</mo><mtext> </mtext><mo stretchy=\"false\">(</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(a,b)=(0,1),\\ \\left(\\dfrac12,\\dfrac14\\right),\\ (1,0)</annotation></semantics></math></span>. 가운데 해는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><mi>b</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mrow><mn>8</mn><mi>a</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">1-b=\\dfrac3{8a}</annotation></semantics></math></span>와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mrow><mn>8</mn><mi>a</mi></mrow></mfrac></mstyle><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">b=\\dfrac3{8a}-\\dfrac12</annotation></semantics></math></span>에서 나온다."],"follow":["두 사람의 지표에서 분산 앞의 계수 1/2은 무엇을 뜻한다고 볼 수 있는가?","(0, 1)과 (1, 0)은 각각 어떤 상황인지 말로 설명해 보시오."]},{"kind":"기출","src":"2025학년도 수학 문제 3","page":"문항집 16쪽","scope":"수학Ⅰ","concept":"수열의 귀납적 정의, 등비수열의 합","body":"<p>수직선 위에 세 공 P, Q, R이 각각 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">p_1=1</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">q_1=2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">r_1=3</annotation></semantics></math></span>에 놓여 있고, 공에는 수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">x_1=3</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">y_1=2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>z</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">z_1=1</annotation></semantics></math></span>이 쓰여 있다. 양수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>에 대하여 다음 시행을 반복한다. (공의 크기는 무시한다.)</p>\n<div class=\"box\"><b>시행</b>\n<p>(가) 세 공에 쓰인 수의 평균을 구한다.</p>\n<p>(나) P에 쓰인 수에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>를 곱한 값을 P의 현재 위치에 더하여 P를 옮긴다.</p>\n<p>(다) (가)의 평균에서 P에 쓰인 수를 뺀 값에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>를 곱하고, 그 결과를 P에 쓰인 수에 더하여 고쳐 적는다.</p>\n<p>(라) Q와 R에도 (나), (다)를 같은 방식으로 적용한다.</p></div>\n<p>시행을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>번 반복한 뒤 세 공의 위치를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo separator=\"true\">,</mo><msub><mi>q</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo separator=\"true\">,</mo><msub><mi>r</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">p_{n+1},q_{n+1},r_{n+1}</annotation></semantics></math></span>, 쓰인 수를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo separator=\"true\">,</mo><msub><mi>y</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo separator=\"true\">,</mo><msub><mi>z</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">x_{n+1},y_{n+1},z_{n+1}</annotation></semantics></math></span>이라 하자.</p><figure><svg viewBox=\"0 0 360 190\" role=\"img\" aria-label=\"h=0.5일 때 첫 시행 전후의 공의 위치와 쓰인 수\">\n<line class=\"ax\" x1=\"20\" y1=\"70\" x2=\"340\" y2=\"70\"/><line class=\"ax\" x1=\"20\" y1=\"160\" x2=\"340\" y2=\"160\"/>\n<circle class=\"ball\" cx=\"70\" cy=\"48\" r=\"15\"/><text class=\"c\" x=\"70\" y=\"53\">3</text><text class=\"c\" x=\"70\" y=\"26\">P</text><line class=\"tk\" x1=\"70\" y1=\"63\" x2=\"70\" y2=\"76\"/><text class=\"c\" x=\"70\" y=\"90\">1</text><circle class=\"ball\" cx=\"140\" cy=\"48\" r=\"15\"/><text class=\"c\" x=\"140\" y=\"53\">2</text><text class=\"c\" x=\"140\" y=\"26\">Q</text><line class=\"tk\" x1=\"140\" y1=\"63\" x2=\"140\" y2=\"76\"/><text class=\"c\" x=\"140\" y=\"90\">2</text><circle class=\"ball\" cx=\"210\" cy=\"48\" r=\"15\"/><text class=\"c\" x=\"210\" y=\"53\">1</text><text class=\"c\" x=\"210\" y=\"26\">R</text><line class=\"tk\" x1=\"210\" y1=\"63\" x2=\"210\" y2=\"76\"/><text class=\"c\" x=\"210\" y=\"90\">3</text>\n<text class=\"c\" x=\"180\" y=\"112\">▽ 시행 1회</text>\n<circle class=\"ball\" cx=\"175\" cy=\"138\" r=\"15\"/><text class=\"c s\" x=\"175\" y=\"142\">2.5</text><text class=\"c\" x=\"175\" y=\"118\">P</text><line class=\"tk\" x1=\"175\" y1=\"153\" x2=\"175\" y2=\"166\"/><text class=\"c s\" x=\"175\" y=\"180\">2.5</text><circle class=\"ball\" cx=\"210\" cy=\"138\" r=\"15\"/><text class=\"c s\" x=\"210\" y=\"142\">2</text><text class=\"c\" x=\"210\" y=\"118\">Q</text><line class=\"tk\" x1=\"210\" y1=\"153\" x2=\"210\" y2=\"166\"/><text class=\"c s\" x=\"210\" y=\"180\">3</text><circle class=\"ball\" cx=\"245\" cy=\"138\" r=\"15\"/><text class=\"c s\" x=\"245\" y=\"142\">1.5</text><text class=\"c\" x=\"245\" y=\"118\">R</text><line class=\"tk\" x1=\"245\" y1=\"153\" x2=\"245\" y2=\"166\"/><text class=\"c s\" x=\"245\" y=\"180\">3.5</text>\n</svg><figcaption>[그림] h = 0.5일 때 첫 시행 전(위)과 후(아래). 원 안은 쓰인 수, 아래는 위치</figcaption></figure>","qs":["시행을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>회 반복한 뒤 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mn>3</mn></msub><mo separator=\"true\">,</mo><msub><mi>y</mi><mn>3</mn></msub><mo separator=\"true\">,</mo><msub><mi>z</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">x_3,y_3,z_3</annotation></semantics></math></span>의 평균을 구하시오.","시행을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2023</mn></mrow><annotation encoding=\"application/x-tex\">2023</annotation></semantics></math></span>회 반복한 뒤 P에 쓰인 수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mn>2024</mn></msub></mrow><annotation encoding=\"application/x-tex\">x_{2024}</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>에 대한 식으로 나타내시오.","시행을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2023</mn></mrow><annotation encoding=\"application/x-tex\">2023</annotation></semantics></math></span>회 반복한 뒤 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>2024</mn></msub><mo>≤</mo><msub><mi>q</mi><mn>2024</mn></msub><mo>≤</mo><msub><mi>p</mi><mn>2024</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_{2024}\\le q_{2024}\\le p_{2024}</annotation></semantics></math></span>가 되도록 하는 양수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>의 값의 범위를 구하시오."],"ans":["세 수의 합은 시행 전후에 변하지 않는다(더해지는 양의 합이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>). 따라서 평균은 항상 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><mn>2</mn><mo>=</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>h</mi><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><msub><mi>x</mi><mi>n</mi></msub><mo>−</mo><mn>2</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">x_{n+1}-2=(1-h)(x_n-2)</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mn>2024</mn></msub><mo>=</mo><mn>2</mn><mo>+</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>h</mi><msup><mo stretchy=\"false\">)</mo><mn>2023</mn></msup></mrow><annotation encoding=\"application/x-tex\">x_{2024}=2+(1-h)^{2023}</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mi>n</mi></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">y_n=2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>z</mi><mi>n</mi></msub><mo>=</mo><mn>2</mn><mo>−</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>h</mi><msup><mo stretchy=\"false\">)</mo><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">z_n=2-(1-h)^{n-1}</annotation></semantics></math></span>. 위치는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mi>p</mi><mi>n</mi></msub><mo>+</mo><mi>h</mi><msub><mi>x</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_{n+1}=p_n+hx_n</annotation></semantics></math></span>을 더해 가면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mn>2024</mn></msub><mo>=</mo><mn>2</mn><mo>+</mo><mn>4046</mn><mi>h</mi><mo>−</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>h</mi><msup><mo stretchy=\"false\">)</mo><mn>2023</mn></msup></mrow><annotation encoding=\"application/x-tex\">p_{2024}=2+4046h-(1-h)^{2023}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>2024</mn></msub><mo>=</mo><mn>2</mn><mo>+</mo><mn>4046</mn><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">q_{2024}=2+4046h</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>2024</mn></msub><mo>=</mo><mn>2</mn><mo>+</mo><mn>4046</mn><mi>h</mi><mo>+</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>h</mi><msup><mo stretchy=\"false\">)</mo><mn>2023</mn></msup></mrow><annotation encoding=\"application/x-tex\">r_{2024}=2+4046h+(1-h)^{2023}</annotation></semantics></math></span>. 조건은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>h</mi><msup><mo stretchy=\"false\">)</mo><mn>2023</mn></msup><mo>≤</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">(1-h)^{2023}\\le0</annotation></semantics></math></span>, 지수가 홀수이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi><mo>≥</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">h\\ge1</annotation></semantics></math></span>."],"follow":["h가 2보다 크면 쓰인 수는 어떻게 움직이는가?","시행 횟수가 짝수(예: 2024회)였다면 답이 어떻게 달라지는가?"]},{"kind":"연습","src":"연습 1 · 약 복용과 체내 약물량","scope":"수학Ⅰ","concept":"수열의 귀납적 정의, 등비수열, 부등식, 등비수열의 극한값 추정, 조건의 변형","body":"<p>어떤 약은 한 번 먹으면 체내 약물량이 곧바로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> mg 늘어나고, 그 뒤 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">8</annotation></semantics></math></span>시간 동안 체내 약물량이 절반으로 줄어든다. 이 약을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">8</annotation></semantics></math></span>시간마다 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> mg씩 먹는다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>번째 복용 직후의 체내 약물량을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">a_n</annotation></semantics></math></span> (mg)이라 하자. 처음 복용하기 전 체내 약물량은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>이다.</p><figure><svg viewBox=\"0 0 360 180\" role=\"img\" aria-label=\"복용 때마다 올라가고 8시간 동안 절반으로 줄어드는 체내 약물량 그래프\">\n<line class=\"ax\" x1=\"36\" y1=\"150\" x2=\"345\" y2=\"150\"/><line class=\"ax\" x1=\"36\" y1=\"155\" x2=\"36\" y2=\"12\"/>\n<line class=\"dash\" x1=\"36\" y1=\"30\" x2=\"345\" y2=\"30\"/>\n<path class=\"ln\" d=\"M36,150 L36,90 Q66,112 96,120 L96,60 Q126,93 156,105 L156,45 Q186,82 216,97.5 L216,37.5 Q246,78 276,93.75 L276,33.75 Q306,76 336,91.9\"/>\n<text x=\"340\" y=\"165\">시간</text><text x=\"4\" y=\"14\">체내 약물량</text><text x=\"300\" y=\"25\">2d</text>\n<text class=\"c s\" x=\"36\" y=\"166\">1회</text><text class=\"c s\" x=\"96\" y=\"166\">2회</text><text class=\"c s\" x=\"156\" y=\"166\">3회</text><text class=\"c s\" x=\"216\" y=\"166\">4회</text><text class=\"c s\" x=\"276\" y=\"166\">5회</text>\n</svg><figcaption>[그림] 복용 직후 약물량은 뛰어오르고, 다음 복용 전까지 절반으로 줄어든다</figcaption></figure>\n<p>이 약은 체내 약물량이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>400</mn></mrow><annotation encoding=\"application/x-tex\">400</annotation></semantics></math></span> mg을 넘으면 부작용이 생기고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>150</mn></mrow><annotation encoding=\"application/x-tex\">150</annotation></semantics></math></span> mg보다 적으면 효과가 없다고 한다.</p><div class=\"box\"><b>토막글 · 복용 간격과 약효</b><p>같은 약을 하루에 먹는 총량은 그대로 두고 더 자주, 더 조금씩 먹는 방법이 있다. 체내 약물량이 일정한 비율로 줄어든다면, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>시간 동안 남는 비율을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>라 할 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">8</annotation></semantics></math></span>시간 동안 남는 비율은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>r</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">r^2</annotation></semantics></math></span>이다. 오래 복용하여 복용 직후의 체내 약물량이 거의 변하지 않게 된 상태를 <u>안정 상태</u>라 하자.</p></div>","qs":[],"ans":[],"follow":["반감기가 8시간이 아니라 4시간이면 점화식이 어떻게 바뀌는가?","문제 2의 (1)에서 \"세 번째 복용 이후\"를 \"두 번째 복용 이후\"로 바꾸면 조건을 만족시키는 d가 있는가?"],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">a_{n+1}</annotation></semantics></math></span>을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">a_n</annotation></semantics></math></span>과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>로 나타내고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">a_3</annotation></semantics></math></span>을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>로 나타내시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">a_n</annotation></semantics></math></span>을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>에 대한 식으로 나타내고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>이 한없이 커질 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">a_n</annotation></semantics></math></span>이 가까워지는 값을 말하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><msub><mi>a</mi><mi>n</mi></msub><mo>+</mo><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">a_{n+1}=\\dfrac12a_n+d</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">a_1=d</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>2</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>2</mn></mfrac></mstyle><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">a_2=\\dfrac32d</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>3</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>7</mn><mn>4</mn></mfrac></mstyle><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">a_3=\\dfrac74d</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>−</mo><mn>2</mn><mi>d</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo stretchy=\"false\">(</mo><msub><mi>a</mi><mi>n</mi></msub><mo>−</mo><mn>2</mn><mi>d</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">a_{n+1}-2d=\\dfrac12(a_n-2d)</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mn>2</mn><mi>d</mi><mrow><mo fence=\"true\">{</mo><mn>1</mn><mo>−</mo><msup><mrow><mo fence=\"true\">(</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mi>n</mi></msup><mo fence=\"true\">}</mo></mrow></mrow><annotation encoding=\"application/x-tex\">a_n=2d\\left\\{1-\\left(\\dfrac12\\right)^n\\right\\}</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>이 커지면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">2d</annotation></semantics></math></span>에 가까워진다(고등학교 수학Ⅰ 범위에서는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo fence=\"true\">(</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo fence=\"true\">)</mo></mrow><mi>n</mi></msup></mrow><annotation encoding=\"application/x-tex\">\\left(\\frac12\\right)^n</annotation></semantics></math></span>이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>에 가까워진다는 직관으로 충분)."]},{"parts":["몇 번을 복용하더라도 체내 약물량이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>400</mn></mrow><annotation encoding=\"application/x-tex\">400</annotation></semantics></math></span> mg을 넘지 않고, 세 번째 복용 이후로는 (다음 복용 직전을 포함하여) 항상 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>150</mn></mrow><annotation encoding=\"application/x-tex\">150</annotation></semantics></math></span> mg 이상이 되도록 하는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>의 값의 범위를 구하시오.","첫 복용량만 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi></mrow><annotation encoding=\"application/x-tex\">D</annotation></semantics></math></span> mg으로 바꾸고 두 번째부터는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> mg씩 먹는다. 복용 직후의 체내 약물량이 매번 같아지도록 하는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi></mrow><annotation encoding=\"application/x-tex\">D</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>로 나타내고, 그 이유를 설명하시오."],"ans":["최댓값 쪽: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>&lt;</mo><mn>2</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">a_n&lt;2d</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">2d</annotation></semantics></math></span>에 한없이 가까워지므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>d</mi><mo>≤</mo><mn>400</mn></mrow><annotation encoding=\"application/x-tex\">2d\\le400</annotation></semantics></math></span>, 즉 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mo>≤</mo><mn>200</mn></mrow><annotation encoding=\"application/x-tex\">d\\le200</annotation></semantics></math></span>. 최솟값 쪽: 복용 직전 약물량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mi>d</mi><mrow><mo fence=\"true\">{</mo><mn>1</mn><mo>−</mo><msup><mrow><mo fence=\"true\">(</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mi>n</mi></msup><mo fence=\"true\">}</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\dfrac12a_n=d\\left\\{1-\\left(\\dfrac12\\right)^n\\right\\}</annotation></semantics></math></span>은 증가하므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n=3</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>7</mn><mn>8</mn></mfrac></mstyle><mi>d</mi><mo>≥</mo><mn>150</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac78d\\ge150</annotation></semantics></math></span>. 따라서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1200</mn><mn>7</mn></mfrac></mstyle><mo>≤</mo><mi>d</mi><mo>≤</mo><mn>200</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{1200}{7}\\le d\\le200</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mi>D</mi></mrow><annotation encoding=\"application/x-tex\">a_1=D</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mn>2</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>D</mi><mo>+</mo><mi>d</mi><mo>=</mo><mi>D</mi></mrow><annotation encoding=\"application/x-tex\">a_2=\\dfrac12D+d=D</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi><mo>=</mo><mn>2</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">D=2d</annotation></semantics></math></span>. 이때 모든 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>에 대해 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mn>2</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">a_n=2d</annotation></semantics></math></span>. 극한값에서 출발하면 수열이 움직이지 않는다는 뜻이다."]},{"parts":["복용 간격을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>시간으로 줄이고 한 번에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>d</mi><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac d2</annotation></semantics></math></span> mg씩 먹는다. 안정 상태에서 복용 직후와 다음 복용 직전의 체내 약물량을 각각 구하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">8</annotation></semantics></math></span>시간마다 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> mg씩 먹는 경우와 비교하시오.","또 복용 간격과 관계없이 \"안정 상태에서 복용 직후와 직전의 약물량의 차는 1회 복용량과 같다\"는 주장이 옳은지 판단하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>2</mn></msqrt><mo>≈</mo><mn>1.41</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt2\\approx1.41</annotation></semantics></math></span>)"],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">r=\\dfrac1{\\sqrt2}</annotation></semantics></math></span>. 직후는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>d</mi><mi mathvariant=\"normal\">/</mi><mn>2</mn></mrow><mrow><mn>1</mn><mo>−</mo><mi>r</mi></mrow></mfrac></mstyle><mo>≈</mo><mn>1.71</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">\\dfrac{d/2}{1-r}\\approx1.71d</annotation></semantics></math></span>, 직전은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>배인 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.21</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">1.21d</annotation></semantics></math></span>. 기존(직후 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">2d</annotation></semantics></math></span>, 직전 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>)보다 최고는 낮고 최저는 높다. 일반적으로 직후 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>c</mi><mrow><mn>1</mn><mo>−</mo><mi>r</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{c}{1-r}</annotation></semantics></math></span>, 직전 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>c</mi><mi>r</mi></mrow><mrow><mn>1</mn><mo>−</mo><mi>r</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{cr}{1-r}</annotation></semantics></math></span>이므로 차는 항상 1회 복용량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>. 주장은 옳다."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">8</annotation></semantics></math></span>시간마다 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> mg씩 오래 먹어 안정 상태에 있던 환자가 한 번 복용을 빠뜨렸다. 다음 복용 시각에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> mg을 먹는 경우와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">2d</annotation></semantics></math></span> mg을 먹는 경우의 복용 직후 체내 약물량을 각각 구하시오.","(1)의 결과를 이용하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mo>=</mo><mn>200</mn></mrow><annotation encoding=\"application/x-tex\">d=200</annotation></semantics></math></span>일 때 \"빠뜨린 만큼 두 배로 먹으면 된다\"는 생각이 왜 위험한지 설명하시오."],"ans":["안정 상태의 직전 약물량은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">8</annotation></semantics></math></span>시간이 더 지나면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>d</mi><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac d2</annotation></semantics></math></span>. 여기에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>를 먹으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.5</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">1.5d</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">2d</annotation></semantics></math></span>를 먹으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.5</mn><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">2.5d</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mo>=</mo><mn>200</mn></mrow><annotation encoding=\"application/x-tex\">d=200</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>500</mn></mrow><annotation encoding=\"application/x-tex\">500</annotation></semantics></math></span> mg으로 부작용 한계 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>400</mn></mrow><annotation encoding=\"application/x-tex\">400</annotation></semantics></math></span> mg을 넘는다. 빠뜨린 약은 이미 몸에서 줄어든 양의 일부만 설명할 뿐이다."]}]},{"kind":"연습","src":"연습 2 · 빵집의 하루 생산량","scope":"수학 · 확률과 통계","concept":"이산확률변수의 기댓값, 이차함수의 최대, 부등식, 조건부확률, 정보의 가치","body":"<p>어느 빵집은 아침에 식빵을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>개 굽는다. 식빵 한 개를 굽는 데 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>천 원이 들고, 한 개를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>천 원에 판다(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">p&gt;1</annotation></semantics></math></span>). 그날 팔리지 않은 식빵은 버린다. 하루에 식빵을 사러 오는 손님 수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi></mrow><annotation encoding=\"application/x-tex\">D</annotation></semantics></math></span>는 공정한 주사위를 한 번 던져 나온 눈의 수와 같은 확률분포를 따르고, 손님은 한 사람이 한 개씩만 산다.</p>\n<p>하루에 팔리는 식빵의 수는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi></mrow><annotation encoding=\"application/x-tex\">D</annotation></semantics></math></span>와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span> 중 크지 않은 쪽이다. 하루 이익(천 원)을 확률변수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi></mrow><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math></span>라 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> 이상 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">6</annotation></semantics></math></span> 이하의 자연수이다.</p><div class=\"box\"><b>자료 · 남은 빵과 날씨</b><p>(가) 이웃 가게가 그날 남은 식빵을 한 개에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">0.5</annotation></semantics></math></span>천 원씩 모두 사 주기로 하였다.</p><p>(나) 손님 수는 날씨에 따라 달라진다. 비가 오는 날에는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">1,2,3</annotation></semantics></math></span>명 중 하나가 같은 확률로, 비가 오지 않는 날에는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo separator=\"true\">,</mo><mn>5</mn><mo separator=\"true\">,</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">4,5,6</annotation></semantics></math></span>명 중 하나가 같은 확률로 온다. 비가 올 확률은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac13</annotation></semantics></math></span>이다.</p></div>","qs":[],"ans":[],"follow":["일기 예보가 열 번에 여덟 번만 맞는다면 예보의 값어치는 어떻게 달라지는가?","기댓값만으로 생산량을 정할 때의 한계를 분산과 관련지어 말해 보시오."],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">p=3</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">q=3</annotation></semantics></math></span>일 때 하루에 팔리는 식빵 수의 기댓값과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">E</mi><mo stretchy=\"false\">(</mo><mi>Z</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E}(Z)</annotation></semantics></math></span>를 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">p=3</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">E</mi><mo stretchy=\"false\">(</mo><mi>Z</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E}(Z)</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>에 대한 식으로 나타내고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">E</mi><mo stretchy=\"false\">(</mo><mi>Z</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E}(Z)</annotation></semantics></math></span>가 최대가 되는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>의 값을 모두 구하시오."],"ans":["팔리는 수의 기댓값은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>1</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>3</mn><mo>×</mo><mn>4</mn></mrow><mn>6</mn></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>5</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{1+2+3\\times4}{6}=\\dfrac52</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">E</mi><mo stretchy=\"false\">(</mo><mi>Z</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>3</mn><mo>×</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>5</mn><mn>2</mn></mfrac></mstyle><mo>−</mo><mn>3</mn><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>9</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E}(Z)=3\\times\\dfrac52-3=\\dfrac92</annotation></semantics></math></span> (천 원).","팔리는 수의 기댓값은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>6</mn></mfrac></mstyle><mrow><mo fence=\"true\">{</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>q</mi><mo stretchy=\"false\">(</mo><mi>q</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><mn>2</mn></mfrac></mstyle><mo>+</mo><mi>q</mi><mo stretchy=\"false\">(</mo><mn>6</mn><mo>−</mo><mi>q</mi><mo stretchy=\"false\">)</mo><mo fence=\"true\">}</mo></mrow><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>13</mn><mi>q</mi><mo>−</mo><msup><mi>q</mi><mn>2</mn></msup></mrow><mn>12</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac16\\left\\{\\dfrac{q(q+1)}2+q(6-q)\\right\\}=\\dfrac{13q-q^2}{12}</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">E</mi><mo stretchy=\"false\">(</mo><mi>Z</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>13</mn><mi>q</mi><mo>−</mo><msup><mi>q</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac></mstyle><mo>−</mo><mi>q</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>9</mn><mi>q</mi><mo>−</mo><msup><mi>q</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E}(Z)=\\dfrac{13q-q^2}{4}-q=\\dfrac{9q-q^2}{4}</annotation></semantics></math></span>. 꼭짓점이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</mo><mn>4.5</mn></mrow><annotation encoding=\"application/x-tex\">q=4.5</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</m
