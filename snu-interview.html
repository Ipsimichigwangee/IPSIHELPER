scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>35</mn><mrow><mi>ln</mi><mo>⁡</mo><mn>2</mn></mrow></mfrac></mstyle><mo>×</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>4</mn></mfrac></mstyle><mo>≈</mo><mn>58</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">20+\\dfrac{7}{k}\\left(1-e^{-10k}\\right)=20+\\dfrac{35}{\\ln2}\\times\\dfrac34\\approx58\\,</annotation></semantics></math></span>℃. 양 끝 온도의 평균은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>90</mn><mo>+</mo><mn>37.5</mn></mrow><mn>2</mn></mfrac></mstyle><mo>=</mo><mn>63.75</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">\\dfrac{90+37.5}{2}=63.75\\,</annotation></semantics></math></span>℃로 더 높다. 그래프가 아래로 볼록해서 곡선이 양 끝을 이은 선분보다 아래에 있기 때문이다."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>w</mi></msub><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">T_w=10</annotation></semantics></math></span>일 때 방법 ①과 ②로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>분 뒤 국의 온도를 각각 구하시오.","어느 쪽이 더 식는가? 이유를 문제 2의 (1)의 결과와 관련지어 설명하시오."],"ans":["①: 섞으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>300</mn><mo>⋅</mo><mn>90</mn><mo>+</mo><mn>100</mn><mo>⋅</mo><mn>10</mn></mrow><mn>400</mn></mfrac></mstyle><mo>=</mo><mn>70</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{300\\cdot90+100\\cdot10}{400}=70</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>분 뒤 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>50</mn><mn>2</mn></mfrac></mstyle><mo>=</mo><mn>45</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">20+\\dfrac{50}2=45\\,</annotation></semantics></math></span>℃. ②: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>분 뒤 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>55</mn></mrow><annotation encoding=\"application/x-tex\">55</annotation></semantics></math></span>, 섞으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>300</mn><mo>⋅</mo><mn>55</mn><mo>+</mo><mn>1000</mn></mrow><mn>400</mn></mfrac></mstyle><mo>=</mo><mn>43.75</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">\\dfrac{300\\cdot55+1000}{400}=43.75\\,</annotation></semantics></math></span>℃. ②가 더 식는다. 식는 빠르기는 방과의 온도 차에 비례하므로 뜨거운 채로 두는 동안 더 많은 열을 잃는다."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>w</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_w</annotation></semantics></math></span>가 일반적인 값일 때 두 방법의 온도 차 (① <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo></mrow><annotation encoding=\"application/x-tex\">-</annotation></semantics></math></span> ②)를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>w</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_w</annotation></semantics></math></span>로 나타내시오.","이 식에 국의 처음 온도가 나타나지 않는 까닭을 생각해 보고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>w</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_w</annotation></semantics></math></span>가 방의 온도보다 높을 때와 낮을 때 결론이 어떻게 달라지는지 설명하시오."],"ans":["국의 처음 온도를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_0</annotation></semantics></math></span>라 하면 ① <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>20</mn><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mrow><mo fence=\"true\">(</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>3</mn><msub><mi>T</mi><mn>0</mn></msub><mo>+</mo><msub><mi>T</mi><mi>w</mi></msub></mrow><mn>4</mn></mfrac></mstyle><mo>−</mo><mn>20</mn><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">=20+\\dfrac12\\left(\\dfrac{3T_0+T_w}4-20\\right)</annotation></semantics></math></span>, ② <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>3</mn><mo stretchy=\"false\">{</mo><mn>20</mn><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy=\"false\">(</mo><msub><mi>T</mi><mn>0</mn></msub><mo>−</mo><mn>20</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">}</mo><mo>+</mo><msub><mi>T</mi><mi>w</mi></msub></mrow><mn>4</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">=\\dfrac{3\\{20+\\frac12(T_0-20)\\}+T_w}{4}</annotation></semantics></math></span>. 차는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>20</mn><mo>−</mo><msub><mi>T</mi><mi>w</mi></msub></mrow><mn>8</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{20-T_w}{8}</annotation></semantics></math></span>. 두 방법 모두 국이 방과의 온도 차의 절반을 잃는 것은 같고, 차이는 넣는 물이 기다리는 동안 방 온도 쪽으로 변하느냐에서만 생긴다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>w</mi></msub><mo>&lt;</mo><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">T_w&lt;20</annotation></semantics></math></span>이면 ②가 더 차갑고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>w</mi></msub><mo>=</mo><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">T_w=20</annotation></semantics></math></span>이면 같으며, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>w</mi></msub><mo>&gt;</mo><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">T_w&gt;20</annotation></semantics></math></span>이면 ①이 더 차갑다."]}]},{"kind":"연습","src":"연습 4 · 그림이 가장 크게 보이는 자리","scope":"수학 · 미적분","concept":"삼각함수의 덧셈정리, 함수의 최댓값, 산술평균과 기하평균, 원의 방정식, 원주각, 모형의 한계","body":"<p>미술관 벽에 세로 길이가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">3</annotation></semantics></math></span> m인 그림이 걸려 있다. 그림의 아래 끝은 관람객의 눈높이보다 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> m 높고 위 끝은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span> m 높다. 관람객이 벽에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> m 떨어진 곳에 서서 그림의 위 끝과 아래 끝을 바라보는 두 시선이 이루는 각의 크기를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>라 하자.</p><figure><svg viewBox=\"0 0 360 210\" role=\"img\" aria-label=\"벽에 걸린 그림을 떨어진 곳에서 바라보는 눈과 시야각\">\n<line class=\"ax\" x1=\"300\" y1=\"10\" x2=\"300\" y2=\"200\"/><line class=\"dash\" x1=\"60\" y1=\"170\" x2=\"340\" y2=\"170\"/>\n<rect class=\"sea\" x=\"300\" y=\"30\" width=\"10\" height=\"105\"/>\n<line class=\"ln\" x1=\"60\" y1=\"170\" x2=\"300\" y2=\"30\"/><line class=\"ln\" x1=\"60\" y1=\"170\" x2=\"300\" y2=\"135\"/>\n<circle class=\"pt\" cx=\"60\" cy=\"170\" r=\"4\"/><text x=\"40\" y=\"188\">눈</text><text x=\"316\" y=\"34\">위 끝</text><text x=\"316\" y=\"139\">아래 끝</text><text x=\"316\" y=\"88\">그림</text>\n<text x=\"170\" y=\"186\">x m</text><text x=\"100\" y=\"150\">θ</text><text x=\"306\" y=\"158\">1 m</text>\n</svg><figcaption>[그림] 그림의 아래 끝은 눈높이보다 1 m, 위 끝은 4 m 높다</figcaption></figure><div class=\"box\"><b>토막글 · 원으로 보기</b><p>한 원에서 같은 호에 대한 원주각의 크기는 모두 같다. 또 원 밖의 점에서 그 호의 양 끝을 바라보는 각은 원주각보다 작고, 원 안의 점에서 바라보는 각은 원주각보다 크다.</p></div>","qs":[],"ans":[],"follow":["키가 더 큰 사람은 벽에 더 가까이 서야 하는가, 멀리 서야 하는가?","가장 좋은 자리에서 눈은 그림의 두 끝을 지나는 어떤 원 위에 있는가?"],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>에 대한 식으로 나타내시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>가 최대가 되는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>의 값과 그때의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta</annotation></semantics></math></span>를 구하시오."],"ans":["두 시선이 수평과 이루는 각을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi><mo separator=\"true\">,</mo><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha,\\beta</annotation></semantics></math></span>라 하면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>α</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>4</mn><mi>x</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\tan\\alpha=\\dfrac4x</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>β</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mi>x</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\tan\\beta=\\dfrac1x</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mi>tan</mi><mo>⁡</mo><mo stretchy=\"false\">(</mo><mi>α</mi><mo>−</mo><mi>β</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>3</mn><mi>x</mi></mrow><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta=\\tan(\\alpha-\\beta)=\\dfrac{3x}{x^2+4}</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>는 예각이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta</annotation></semantics></math></span>가 최대일 때 최대. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>d</mi><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mstyle><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>3</mn><mi>x</mi></mrow><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>3</mn><mo stretchy=\"false\">(</mo><mn>4</mn><mo>−</mo><msup><mi>x</mi><mn>2</mn></msup><mo stretchy=\"false\">)</mo></mrow><mrow><mo stretchy=\"false\">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{d}{dx}\\dfrac{3x}{x^2+4}=\\dfrac{3(4-x^2)}{(x^2+4)^2}</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">x=2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>4</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta=\\dfrac34</annotation></semantics></math></span>."]},{"parts":["문제 1의 (2)의 결과를 미분을 쓰지 않고 설명하는 방법을 하나 제시하시오.","그림의 아래 끝이 눈높이보다 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span> m, 위 끝이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">b</annotation></semantics></math></span> m 높을 때(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>a</mi><mo>&lt;</mo><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">0&lt;a&lt;b</annotation></semantics></math></span>) 가장 좋은 자리를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">a,b</annotation></semantics></math></span>로 나타내시오. 너무 가까이 서거나 너무 멀리 서면 왜 그림이 작게 보이는지도 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>3</mn><mi>x</mi></mrow><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mrow><mi>x</mi><mo>+</mo><mfrac><mn>4</mn><mi>x</mi></mfrac></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{3x}{x^2+4}=\\dfrac{3}{x+\\frac4x}</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>4</mn><mi>x</mi></mfrac></mstyle><mo>≥</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">x+\\dfrac4x\\ge4</annotation></semantics></math></span> (등호는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">x=2</annotation></semantics></math></span>).","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mi>b</mi><mo>−</mo><mi>a</mi><mo stretchy=\"false\">)</mo><mi>x</mi></mrow><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>a</mi><mi>b</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta=\\dfrac{(b-a)x}{x^2+ab}</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><msqrt><mrow><mi>a</mi><mi>b</mi></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">x=\\sqrt{ab}</annotation></semantics></math></span>. 가까이 가면 두 시선이 모두 거의 위를 향해 각의 차가 작고, 멀어지면 두 시선이 모두 거의 수평이 되어 각의 차가 작다."]},{"parts":["벽을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span>축, 눈높이를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축으로 놓으면 그림의 두 끝은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(0,1)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>4</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(0,4)</annotation></semantics></math></span>이다. 이 두 점을 지나고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축에 접하는 원의 방정식을 구하고, 토막글을 이용하여 접점이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>가 최대인 자리임을 설명하시오.","문제 1의 (2)의 결과와 맞는지 확인하시오."],"ans":["중심을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>c</mi><mo separator=\"true\">,</mo><mi>r</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(c,r)</annotation></semantics></math></span>라 하면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축에 접하므로 반지름 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>, 중심의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span>좌표는 두 점의 가운데 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.5</mn></mrow><annotation encoding=\"application/x-tex\">2.5</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>c</mi><mn>2</mn></msup><mo>+</mo><msup><mn>1.5</mn><mn>2</mn></msup><mo>=</mo><msup><mn>2.5</mn><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">c^2+1.5^2=2.5^2</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">c=2</annotation></semantics></math></span>. 원은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><mn>2</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mo>+</mo><mo stretchy=\"false\">(</mo><mi>y</mi><mo>−</mo><mn>2.5</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mo>=</mo><msup><mn>2.5</mn><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">(x-2)^2+(y-2.5)^2=2.5^2</annotation></semantics></math></span>, 접점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2,0)</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축 위의 다른 점은 모두 원 밖에 있으므로 바라보는 각이 원주각보다 작다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">x=2</annotation></semantics></math></span>로 문제 1의 (2)와 일치."]},{"parts":["키가 큰 관람객의 눈높이가 그림의 아래 끝보다 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> m 높고 위 끝보다 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span> m 낮다. 이때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>에 대한 식으로 나타내고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>가 최대인 자리가 있는지 조사하시오.","이 결과는 \"그림이 가장 크게 보이는 자리\"를 시야각만으로 정하는 방법의 어떤 한계를 보여 주는가?"],"ans":["두 끝이 눈높이의 위아래에 있으므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>=</mo><mi>α</mi><mo>+</mo><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\theta=\\alpha+\\beta</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>α</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mi>x</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\tan\\alpha=\\dfrac2x</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>β</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mi>x</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\tan\\beta=\\dfrac1x</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>가 작아질수록 두 각이 모두 커지므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>는 감소함수이고 최대인 자리가 없다(벽에 다가갈수록 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>에 가까워진다). 시야각만 크다고 잘 보이는 것은 아니다. 눈이 한 번에 볼 수 있는 범위, 비스듬히 볼 때의 일그러짐 등을 함께 넣어야 한다."]}]}],"doc":[{"kind":"연습","src":"서류 기반 면접 예상 질문 1","scope":"제출 서류 기반 면접","concept":"전공 적성, 지원 동기","noAnswer":true,"plain":true,"follow":[],"body":"<p>디자인과 면접은 제시문 없이 서류 평가 자료를 바탕으로 한 심층 질의로 진행된다(답변 준 function art(s,ar){return '<article class="doc"><p class="meta">'+ar.name+' · '+s.kind+(s.kind==='기출'?' · '+s.src+' ('+s.page+')':'')+'<span class="tonly"> · '+s.scope+'</span></p>'
   +'<h2>※ 제시문을 읽고 문제에 답하시오.</h2>'+s.body
   +(s.groups?'<ol class="qs">'+s.groups.map((g,i)=>'<li><b class="qn">문제 '+(i+1)+'.</b><div><ol class="pt2">'+g.parts.map((p,j)=>'<li><b>('+(j+1)+')</b><div>'+p+'</div></li>').join('')+'</ol>'+'<div class="ans" data-l="'+(s.ansLabel||(s.noAnswer?'평가 포인트':'정답과 풀이 요지'))+'">'+(g.ans.length>1?g.ans.map((a,j)=>'<p><b>('+(j+1)+')</b> '+a+'</p>').join(''):g.ans[0])+'</div></div></li>').join('')+'</ol>'
   :'<ol class="qs">'+s.qs.map((q,i)=>'<li><b class="qn">'+(s.plain?'문제 '+(i+1)+'.':(s.qnum||1)+'-'+(i+1)+'.')+'</b><div>'+q+'<div class="ans" data-l="'+(s.ansLabel||(s.noAnswer?'평가 포인트':'정답과 풀이 요지'))+'">'+s.ans[i]+'</div></div></li>').join('')+'</ol>')
   +'<div class="teach"><h3>'+(s.kind==='연습'?s.src+' · ':'')+'핵심 개념</h3><p>'+s.concept+'</p>'+(s.follow&&s.follow.length?'<h3>면접위원 추가 질문</h3><ul>'+s.follow.map(f=>'<li>'+f+'</li>').join('')+'</ul>':'')+'</div></article>';}
/* 타이머 */
let tick=null,endAt=0,wake=null;
/* 타이머가 도는 동안 화면이 꺼지지 않게 한다(iOS 16.4+). 지원하지 않으면 그냥 넘어간다. */
async function keepAwake(on){try{if(on){if(!('wakeLock' in navigator)||wake||document.hidden)return;const w=await navigator.wakeLock.request('screen');if(!S.run){w.release();return}wake=w;w.addEventListener('release',()=>{if(wake===w)wake=null})}else if(wake){const w=wake;wake=null;await w.release()}}catch(e){wake=null}}
function stop(){clearInterval(tick);tick=null;S.run=false;keepAwake(false)}
/* 남은 시간은 실제 시각으로 계산한다. 사파리가 뒤로 가거나 화면이 잠겨도 돌아오면 정확하다. */
function sync(){if(!S.run)return;S.left=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(S.left<=0)stop();show()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();if(S.run)keepAwake(true)}});
window.addEventListener('pageshow',sync);
function show(){const m=Math.floor(S.left/60),s=S.left%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('clock').classList.toggle('end',S.left===0);$('go').textContent=S.run?'멈춤':'시작';$('mPrep').classList.toggle('on',S.mode==='prep');$('mInt').classList.toggle('on',S.mode==='int')}
function resetClock(){stop();if(S.mode==='prep'&&!prepMin())S.mode='int';S.left=(S.mode==='prep'?prepMin():15)*60;show()}
$('mPrep').onclick=()=>{S.mode='prep';resetClock()};
$('mInt').onclick=()=>{S.mode='int';resetClock()};
$('reset').onclick=resetClock;
$('go').onclick=()=>{if(S.run){sync();stop()}else{if(!S.left)return;S.run=true;endAt=Date.now()+S.left*1000;tick=setInterval(sync,250);keepAwake(true)}show()};
$('teacher').onclick=e=>{const on=document.body.classList.toggle('t');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.classList.toggle('on',on)};
if(window.self===window.top){$('print').hidden=false;$('print').onclick=()=>window.print()}
/* 선택 */
fill($('col'),cols,S.col);
function fillDept(){fill($('dept'),DATA.depts.filter(d=>d.col===S.col).map(d=>d.name),S.dept)}
$('col').onchange=e=>{S.col=e.target.value;S.dept=DATA.depts.find(d=>d.col===S.col).name;S.type=0;S.area=null;S.set=0;fillDept();render();resetClock()};
$('dept').onchange=e=>{S.dept=e.target.value;S.type=0;S.area=null;S.set=0;render();resetClock()};
fillDept();render();resetClock();
</script>
</body>
</html>
