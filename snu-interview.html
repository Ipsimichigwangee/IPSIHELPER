=\"application/x-tex\">\\pm50</annotation></semantics></math></span> m/s 사이에서 변하였다.</p><p>(나) 행성과 별은 공통 질량 중심 둘레를 같은 주기로 돌며, (별의 질량)×(별의 속력)=(행성의 질량)×(행성의 속력)이 성립한다. 궤도는 원이고 궤도면은 시선 방향과 나란하다고 하자.</p><p>(다) 태양과 질량이 같은 별 둘레를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span>일에 한 번 도는 행성의 궤도 반지름은 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.09</mn></mrow><annotation encoding=\"application/x-tex\">0.09</annotation></semantics></math></span> AU <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>1.35</mn><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup></mrow><annotation encoding=\"application/x-tex\">=1.35\\times10^7</annotation></semantics></math></span> km이다. 목성의 질량은 태양의 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>1000</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1{1000}</annotation></semantics></math></span>이다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span>일은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8.64</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup></mrow><annotation encoding=\"application/x-tex\">8.64\\times10^5</annotation></semantics></math></span>초이다.</p></div>","qs":[],"ans":[],"follow":["밝기가 줄어든 시간의 길이에서는 무엇을 알 수 있는가?","중심별이 태양보다 어두운 별이라면 생명 가능 지대는 어디에 놓이는가?"],"groups":[{"parts":["밝기가 주기적으로 줄어드는 까닭을 설명하고, 그래프에서 알 수 있는 주기를 말하시오.","밝기가 줄어드는 정도로부터 이 별 주위를 도는 천체의 반지름이 별 반지름의 몇 배인지 구하고, 태양계의 어떤 행성과 크기가 비슷한지 말하시오."],"ans":["행성이 별 앞을 지나며 별빛의 일부를 가리는 식 현상이다. 밝기 감소가 3일, 13일, 23일에 나타나므로 공전 주기는 10일이다.","가려지는 빛의 비율은 단면적의 비와 같다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo fence=\"true\">(</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msub><mi>R</mi><mtext>행성</mtext></msub><msub><mi>R</mi><mtext>별</mtext></msub></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mn>2</mn></msup><mo>=</mo><mn>0.01</mn></mrow><annotation encoding=\"application/x-tex\">\\left(\\dfrac{R_{행성}}{R_{별}}\\right)^2=0.01</annotation></semantics></math></span>이므로 반지름은 별의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.1</mn></mrow><annotation encoding=\"application/x-tex\">0.1</annotation></semantics></math></span>배. 별이 태양과 크기가 같으므로 목성과 비슷한 크기이다."]},{"parts":["같은 기간에 이 별의 스펙트럼을 관측하면 흡수선의 파장이 주기적으로 변한다. 밝기가 줄어든 직후에는 흡수선이 파장이 긴 쪽과 짧은 쪽 중 어느 쪽으로 이동하는가? 이유와 함께 설명하시오.","이 방법으로 지구와 비슷한 행성을 찾기 어려운 이유를 두 가지 이상 말하고, 이 행성이 생명 가능 지대에 있는지 판단하려면 무엇을 더 알아야 하는지 설명하시오."],"ans":["행성과 별은 공통 질량 중심을 사이에 두고 서로 반대쪽에서 돈다. 식이 끝난 직후 행성은 관측자에게서 멀어지는 쪽으로 움직이므로 별은 관측자 쪽으로 다가온다. 따라서 흡수선은 파장이 짧은 쪽으로 이동한다(청색 편이).","지구 크기의 행성은 별빛을 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.01</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">0.01\\,\\%</annotation></semantics></math></span>만 가려 변화가 매우 작다. 공전 궤도면이 시선 방향과 거의 나란해야만 식이 일어난다. 공전 주기가 길면 식이 드물어 오래 관측해야 한다. 생명 가능 지대 여부는 별의 광도와 행성의 궤도 반지름(공전 주기와 별의 질량으로 추정)을 알아야 판단할 수 있다. 태양과 같은 별에서 주기 10일인 행성은 별에 너무 가까워 물이 액체로 있기 어렵다."]},{"parts":["(다)의 궤도 반지름 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.09</mn></mrow><annotation encoding=\"application/x-tex\">0.09</annotation></semantics></math></span> AU가 케플러 제3법칙에서 어떻게 나오는지 설명하시오.","이어서 행성의 공전 속력을 구하고, (가)와 (나)를 이용하여 행성의 질량이 목성의 약 몇 배인지 구하시오."],"ans":["지구(주기 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>365</mn></mrow><annotation encoding=\"application/x-tex\">365</annotation></semantics></math></span>일, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> AU)와 견주면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>a</mi><mn>3</mn></msup><mo>∝</mo><msup><mi>P</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">a^3\\propto P^2</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><msup><mrow><mo fence=\"true\">(</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>10</mn><mn>365</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">/</mi><mn>3</mn></mrow></msup><mo>≈</mo><mn>0.09</mn></mrow><annotation encoding=\"application/x-tex\">a=\\left(\\dfrac{10}{365}\\right)^{2/3}\\approx0.09</annotation></semantics></math></span> AU. 속력은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mi>π</mi><mo>×</mo><mn>1.35</mn><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup></mrow><mrow><mn>8.64</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup></mrow></mfrac></mstyle><mo>≈</mo><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{2\\pi\\times1.35\\times10^7}{8.64\\times10^5}\\approx100</annotation></semantics></math></span> km/s. 질량의 비는 속력의 비의 역수이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>50</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">/</mi><mi mathvariant=\"normal\">s</mi></mrow></mrow><mrow><mn>100</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">/</mi><mi mathvariant=\"normal\">s</mi></mrow></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2000</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{50\\ \\mathrm{m/s}}{100\\ \\mathrm{km/s}}=\\dfrac1{2000}</annotation></semantics></math></span>, 목성의 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">0.5</annotation></semantics></math></span>배."]},{"parts":["문제 1의 (2)에서 구한 반지름과 위에서 구한 질량으로 이 행성의 평균 밀도를 목성과 견주시오.","이 행성은 어떤 종류의 행성이며, 중심별에 매우 가깝다는 사실이 이 결과와 어떻게 이어질 수 있는지 추론하시오. 식 현상과 시선 속도 관측을 함께 해야만 알 수 있는 것은 무엇인가?"],"ans":["반지름은 목성과 비슷한데 질량이 절반이므로 평균 밀도는 목성의 절반쯤이다. 기체로 된 목성형 행성이다. 별에 매우 가까워 뜨겁게 데워져 대기가 부풀어 있다고 볼 수 있다. 식 현상은 크기를, 시선 속도는 질량을 알려 주므로 둘을 함께 해야 밀도와 행성의 종류를 알 수 있다."]}]},{"kind":"연습","src":"연습 2 · 바다 밑의 줄무늬","scope":"지구과학Ⅰ","concept":"해양저 확장, 고지자기, 판의 이동 속도, 열점, 판 이동의 방향과 속도, 가정의 검토","body":"<p>그림은 어느 해령 부근 해양 지각에 기록된 고지자기 줄무늬를 위에서 본 것이다. 해령에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span> km 떨어진 지점 P의 암석 나이는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>500</mn></mrow><annotation encoding=\"application/x-tex\">500</annotation></semantics></math></span>만 년이다.</p><figure><svg viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"해령을 중심으로 대칭인 고지자기 줄무늬\">\n<rect class=\"cell on\" x=\"180\" y=\"40\" width=\"18\" height=\"60\"/><rect class=\"cell on\" x=\"162\" y=\"40\" width=\"18\" height=\"60\"/><rect class=\"cell\" x=\"198\" y=\"40\" width=\"30\" height=\"60\"/><rect class=\"cell\" x=\"132\" y=\"40\" width=\"30\" height=\"60\"/><rect class=\"cell on\" x=\"228\" y=\"40\" width=\"22\" height=\"60\"/><rect class=\"cell on\" x=\"110\" y=\"40\" width=\"22\" height=\"60\"/><rect class=\"cell\" x=\"250\" y=\"40\" width=\"36\" height=\"60\"/><rect class=\"cell\" x=\"74\" y=\"40\" width=\"36\" height=\"60\"/><rect class=\"cell on\" x=\"286\" y=\"40\" width=\"26\" height=\"60\"/><rect class=\"cell on\" x=\"48\" y=\"40\" width=\"26\" height=\"60\"/>\n<line class=\"ln2\" x1=\"180\" y1=\"30\" x2=\"180\" y2=\"110\"/><text class=\"c\" x=\"180\" y=\"24\">해령</text>\n<line class=\"ax\" x1=\"180\" y1=\"120\" x2=\"280\" y2=\"120\"/><line class=\"tk\" x1=\"180\" y1=\"115\" x2=\"180\" y2=\"125\"/><line class=\"tk\" x1=\"280\" y1=\"115\" x2=\"280\" y2=\"125\"/><text class=\"c s\" x=\"230\" y=\"136\">100 km</text><circle class=\"pt\" cx=\"280\" cy=\"70\" r=\"3.5\"/><text x=\"286\" y=\"66\">P</text>\n</svg><figcaption>[그림] 해령 부근 해양 지각의 고지자기 줄무늬. 색칠한 곳은 정자극기, 흰 곳은 역자극기</figcaption></figure><div class=\"box\"><b>자료 · 줄지어 선 화산섬</b><p>어느 해양판 위에 화산섬들이 한 줄로 늘어서 있다. 지금 화산 활동이 일어나는 섬은 가장 남동쪽의 섬 하나뿐이다. 이 섬에서 북서쪽으로 가면서 각 섬의 화산암 나이를 조사하였다. 이 섬들은 맨틀 깊은 곳에서 올라오는 뜨거운 물질이 판을 뚫고 나와 생긴 것으로 본다(열점).</p>\n<table><tr><th>활동 중인 섬에서의 거리(km)</th><td>0</td><td>300</td><td>600</td><td>1500</td></tr><tr><th>화산암의 나이(만 년)</th><td>0</td><td>400</td><td>800</td><td>2000</td></tr></table>\n<p>더 멀리 가면 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3500</mn></mrow><annotation encoding=\"application/x-tex\">3500</annotation></semantics></math></span> km 지점(나이 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4700</mn></mrow><annotation encoding=\"application/x-tex\">4700</annotation></semantics></math></span>만 년)에서 섬들이 늘어선 방향이 북서에서 북쪽으로 꺾인다.</p></div>","qs":[],"ans":[],"follow":["줄무늬의 폭이 서로 다른 것은 무엇을 뜻하는가?","가장 오래된 해양 지각이 대륙 지각보다 훨씬 젊은 이유는?"],"groups":[{"parts":["줄무늬가 해령을 중심으로 대칭인 이유를 설명하시오.","해령에서 한쪽으로 지각이 이동하는 평균 속도를 cm/년 단위로 구하시오."],"ans":["해령에서 마그마가 올라와 굳으면서 그때의 지구 자기장 방향이 암석에 기록되고, 새 지각이 양쪽으로 같은 속도로 밀려난다. 지구 자기장이 뒤바뀔 때마다 줄무늬가 양쪽에 똑같이 생긴다.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>100</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow><mrow><mn>500</mn><mtext>만 년</mtext></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><msup><mn>10</mn><mn>7</mn></msup><mtext> </mtext><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow><mrow><mn>5</mn><mo>×</mo><msup><mn>10</mn><mn>6</mn></msup><mtext> 년</mtext></mrow></mfrac></mstyle><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{100\\ \\mathrm{km}}{500\\text{만 년}}=\\dfrac{10^7\\ \\mathrm{cm}}{5\\times10^6\\ \\text{년}}=2</annotation></semantics></math></span> cm/년."]},{"parts":["이 해령이 가운데에 있는 바다의 폭이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4000</mn></mrow><annotation encoding=\"application/x-tex\">4000</annotation></semantics></math></span> km라면, 이 바다가 열리기 시작한 것은 대략 언제인가? 이 계산에 들어 있는 가정을 말하시오.","해령에서 멀어질수록 해저 퇴적물의 두께와 수심은 어떻게 변하는가? 이유와 함께 설명하시오."],"ans":["양쪽으로 합쳐 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span> cm/년씩 벌어지므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>4</mn><mo>×</mo><msup><mn>10</mn><mn>8</mn></msup><mtext> </mtext><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow><mrow><mn>4</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">/</mi><mtext>년</mtext></mrow></mrow></mfrac></mstyle><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{4\\times10^8\\ \\mathrm{cm}}{4\\ \\mathrm{cm/년}}=1</annotation></semantics></math></span>억 년 전. 확장 속도가 내내 일정했고 지각이 그동안 사라지지 않았다는 가정이 들어 있다.","멀수록 지각이 오래되어 퇴적물이 쌓인 시간이 길어 두껍다. 또 오래된 지각은 식어서 밀도가 커지고 가라앉아 수심이 깊다."]},{"parts":["자료에서 이 판이 움직이는 방향과 속력을 구하시오.","이 방법과 문제 1의 고지자기 줄무늬를 이용한 방법이 각각 무엇을 기준으로 판의 움직임을 재는지 비교하시오."],"ans":["오래된 섬일수록 북서쪽에 있으므로 판은 북서쪽으로 움직인다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>300</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow><mrow><mn>400</mn><mtext>만 년</mtext></mrow></mfrac></mstyle><mo>=</mo><mn>7.5</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{300\\ \\mathrm{km}}{400\\text{만 년}}=7.5</annotation></semantics></math></span> cm/년(다른 자료도 같은 값). 줄무늬는 해령(판의 경계)을 기준으로 두 판이 서로 멀어지는 속도를, 열점은 맨틀 깊은 곳의 고정된 점을 기준으로 판 하나의 움직임을 잰다."]},{"parts":["약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4700</mn></mrow><annotation encoding=\"application/x-tex\">4700</annotation></semantics></math></span>만 년 전의 지점에서 섬의 배열이 꺾인 것을 어떻게 해석할 수 있는가?","가능한 설명을 두 가지 내고, 각각이 옳은지 알아보려면 무엇을 조사해야 하는지 말하시오."],"ans":["① 그 무렵 판의 이동 방향이 북쪽에서 북서쪽으로 바뀌었다. ② 판의 방향은 그대로인데 열점 자체가 움직였다. ①이라면 같은 판 위의 다른 열점 섬 줄에도 같은 시기의 꺾임이 있어야 한다. ②라면 꺾이기 전 화산암의 고지자기로 알아낸 생성 당시의 위도가 지금의 열점 위도와 다를 것이다."]}]},{"kind":"연습","src":"연습 3 · 따뜻해진 동태평양","scope":"지구과학Ⅰ","concept":"대기와 해양의 상호 작용, 용승, 엘니뇨, 되먹임, 자료에 의한 예측, 수온 약층","body":"<p>적도 부근 태평양에서는 평소 동쪽에서 서쪽으로 무역풍이 분다. 이 때문에 따뜻한 표층 해수가 서쪽에 모이고, 동쪽의 남아메리카 연안에서는 찬 해수가 아래에서 올라온다. 몇 년에 한 번씩 무역풍이 약해지면 동태평양의 표층 수온이 평소보다 높은 상태가 여러 달 이어지는데, 이를 엘니뇨라 한다.</p>\n<table><tr><th></th><th>평소</th><th>엘니뇨 시기</th></tr><tr><th>동태평양 표층 수온</th><td>약 24 ℃</td><td>약 27 ℃</td></tr><tr><th>페루 연안 어획량</th><td>많음</td><td>크게 줄어듦</td></tr><tr><th>인도네시아 강수량</th><td>많음</td><td>줄어듦</td></tr></table><div class=\"box\"><b>자료 · 세 가지 상태</b><p>무역풍이 평소보다 강해져 동태평양의 수온이 평소보다 낮은 상태가 이어지는 것을 라니냐라 한다. 표는 적도 태평양의 세 상태를 견준 것이다. 수온 약층은 따뜻한 표층과 찬 심층 사이에서 수온이 급격히 변하는 층이다.</p>\n<table><tr><th></th><th>엘니뇨</th><th>평소</th><th>라니냐</th></tr><tr><th>무역풍</th><td>약함</td><td>보통</td><td>강함</td></tr><tr><th>동태평양 표층 수온</th><td>27 ℃</td><td>24 ℃</td><td>(ㄱ)</td></tr><tr><th>서태평양 수온 약층의 깊이</th><td>(ㄴ)</td><td>약 150 m</td><td>더 깊음</td></tr><tr><th>동태평양 수온 약층의 깊이</th><td>(ㄷ)</td><td>약 50 m</td><td>더 얕음</td></tr></table></div>","qs":[],"ans":[],"follow":["반대로 무역풍이 평소보다 강해지면 어떤 일이 일어나는가?","엘니뇨가 한국의 날씨에도 영향을 줄 수 있는 이유는?"],"groups":[{"parts":["평소 남아메리카 연안에서 찬 해수가 올라오는 과정과, 그곳에 물고기가 많은 이유를 설명하시오.","무역풍이 약해지면 동태평양의 수온이 올라가고 어획량이 주는 이유를 설명하시오."],"ans":["무역풍이 표층 해수를 서쪽으로 밀어내면 동쪽 연안에서는 빈자리를 채우려 깊은 곳의 찬 해수가 올라온다(용승). 깊은 곳의 해수에는 영양 염류가 많아 식물 플랑크톤이 늘고 이를 먹는 물고기가 모인다.","표층 해수를 서쪽으로 미는 힘이 약해져 따뜻한 해수가 동쪽으로 퍼지고 용승이 약해진다. 영양 염류의 공급이 줄어 어획량이 준다."]},{"parts":["엘니뇨 시기에 인도네시아의 강수량이 줄어드는 이유를 대기의 움직임으로 설명하시오. 같은 시기 페루 연안의 날씨는 어떻게 될지도 추론하시오.","\"무역풍이 약해진다 → 동서의 수온 차가 줄어든다 → 무역풍이 더 약해진다\"는 설명이 있다. 이것이 어떤 종류의 되먹임인지 말하고, 왜 그렇게 되는지 설명하시오."],"ans":["평소에는 서쪽의 따뜻한 바다 위에서 공기가 올라가 구름과 비를 만든다. 엘니뇨 때는 따뜻한 해수가 동쪽으로 옮겨 가 상승 기류가 생기는 곳도 동쪽으로 옮겨 간다. 인도네시아는 가물고, 평소 건조한 페루 연안에는 비가 많이 온다.","양의 되먹임. 무역풍은 서쪽이 따뜻하고 동쪽이 차서 생기는 기압 차로 유지되는데, 수온 차가 줄면 기압 차도 줄어 바람이 더 약해지고, 그러면 수온 차가 더 준다."]},{"parts":["(ㄱ)~(ㄷ)에 들어갈 내용을 추론하고 그 이유를 무역풍과 표층 해수의 이동으로 설명하시오.","평소에 수온 약층이 서쪽에서 깊고 동쪽에서 얕은 까닭도 함께 설명하시오."],"ans":["(ㄱ) <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>24</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">24\\,</annotation></semantics></math></span>℃보다 낮다(약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>22</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">22\\,</annotation></semantics></math></span>℃). 강한 무역풍이 용승을 더 일으킨다. (ㄴ) 평소보다 얕다. (ㄷ) 평소보다 깊다. 무역풍이 따뜻한 표층수를 서쪽으로 밀어 쌓으므로 서쪽은 따뜻한 층이 두껍고(약층이 깊고) 동쪽은 얇다. 엘니뇨 때는 미는 힘이 약해 따뜻한 물이 동쪽으로 퍼지며 기울기가 완만해진다."]},{"parts":["라니냐 시기에 인도네시아와 페루 연안의 강수량, 페루 연안의 어획량이 평소와 견주어 어떻게 될지 예측하시오.","또 엘니뇨나 라니냐가 시작되는 것을 미리 알아내려면 적도 태평양에서 무엇을 관측해야 하는지, 표면 수온만 재는 것으로 부족한 이유와 함께 제안하시오."],"ans":["인도네시아는 따뜻한 물이 더 모여 상승 기류가 강해져 비가 더 많이 오고, 페루 연안은 더 건조하다. 용승이 강해져 영양 염류가 늘어 어획량은 는다. 바람의 세기와 방향, 깊이별 수온(약층의 깊이), 해수면 높이를 고정 부이와 위성으로 관측한다. 표면 수온은 변화가 이미 드러난 뒤의 결과이고, 따뜻한 물의 두께 변화가 먼저 나타난다."]}]},{"kind":"연습","src":"연습 4 · 멀어지는 은하들","scope":"지구과학Ⅰ","concept":"허블 법칙, 적색 편이, 우주의 팽창과 나이, 표준 광원, 가속 팽창","body":"<p>다음은 은하 네 개의 거리와 후퇴 속도를 측정한 결과이다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> Mpc은 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.1</mn><mo>×</mo><msup><mn>10</mn><mn>19</mn></msup></mrow><annotation encoding=\"application/x-tex\">3.1\\times10^{19}</annotation></semantics></math></span> km이고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>년은 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.2</mn><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup></mrow><annotation encoding=\"application/x-tex\">3.2\\times10^{7}</annotation></semantics></math></span>초이다.</p>\n<table><tr><th>은하</th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><th>거리(Mpc)</th><td>50</td><td>100</td><td>200</td><td>400</td></tr><tr><th>후퇴 속도(km/s)</th><td>3500</td><td>7000</td><td>14000</td><td>28000</td></tr></table><div class=\"box\"><b>토막글 · 거리를 재는 초신성</b><p>Ⅰa형 초신성은 가장 밝을 때의 실제 밝기(광도)가 거의 일정하다고 알려져 있어, 겉보기 밝기를 재면 거리를 알 수 있다. 광도가 같은 천체의 겉보기 밝기는 거리의 제곱에 반비례한다.</p></div>","qs":[],"ans":[],"follow":["허블 상수가 더 크게 측정된다면 우주의 나이 추정은 어떻게 바뀌는가?","은하까지의 거리는 어떻게 재는가?"],"groups":[{"parts":["거리와 후퇴 속도 사이의 관계를 식으로 나타내고 허블 상수를 구하시오.","은하의 후퇴 속도는 어떻게 측정하는가?"],"ans":["후퇴 속도는 거리에 비례한다: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><mi>H</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">v=Hr</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mo>=</mo><mn>70</mn></mrow><annotation encoding=\"application/x-tex\">H=70</annotation></semantics></math></span> km/s/Mpc.","은하의 스펙트럼에서 흡수선의 파장이 원래보다 얼마나 길어졌는지(적색 편이)를 재어 속도를 구한다."]},{"parts":["은하들이 지금의 속도로 계속 멀어져 왔다고 가정하고 우주의 나이를 어림하시오.","모든 은하가 우리에게서 멀어진다는 관측은 우리 은하가 우주의 중심이라는 뜻인가? 또 가까운 안드로메다은하가 우리에게 다가오고 있다는 사실은 허블 법칙과 어긋나는가?"],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mi>H</mi></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>3.1</mn><mo>×</mo><msup><mn>10</mn><mn>19</mn></msup></mrow><mn>70</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1H=\\dfrac{3.1\\times10^{19}}{70}</annotation></semantics></math></span>초 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>4.4</mn><mo>×</mo><msup><mn>10</mn><mn>17</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\approx4.4\\times10^{17}</annotation></semantics></math></span>초 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>1.4</mn><mo>×</mo><msup><mn>10</mn><mn>10</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\approx1.4\\times10^{10}</annotation></semantics></math></span>년, 약 140억 년.","아니다. 공간 자체가 고르게 늘어나면 어느 은하에서 보아도 다른 은하들이 거리에 비례하는 속도로 멀어진다(부푸는 풍선 위의 점). 가까운 은하끼리는 서로 끄는 중력에 의한 운동이 팽창의 효과보다 커서 다가올 수 있다. 허블 법칙은 먼 은하들에서 나타나는 전체적인 경향이다."]},{"parts":["은하 A에서 나타난 Ⅰa형 초신성과, 어느 은하 X에서 나타난 Ⅰa형 초신성을 관측하였더니 X의 것의 겉보기 밝기가 A의 것의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>16</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1{16}</annotation></semantics></math></span>이었다. 은하 X까지의 거리와 허블 법칙에서 예상되는 후퇴 속도를 구하시오.","은하의 거리를 후퇴 속도로부터 구하지 않고 이렇게 따로 재야 하는 이유는 무엇인가?"],"ans":["밝기가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>16</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1{16}</annotation></semantics></math></span>이면 거리는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>배, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>200</mn></mrow><annotation encoding=\"application/x-tex\">200</annotation></semantics></math></span> Mpc. 예상 후퇴 속도는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>70</mn><mo>×</mo><mn>200</mn><mo>=</mo><mn>14000</mn></mrow><annotation encoding=\"application/x-tex\">70\\times200=14000</annotation></semantics></math></span> km/s(은하 C와 같다). 허블 법칙은 거리와 속도를 서로 다른 방법으로 재어 견주어야 확인할 수 있다. 속도에서 거리를 구하면 확인하려는 법칙을 미리 가정하는 셈이다."]},{"parts":["매우 먼 은하들의 Ⅰa형 초신성을 관측하였더니, 적색 편이로 구한 후퇴 속도와 일정한 팽창 속도를 가정하여 예상한 것보다 더 어둡게 보였다. 이 관측이 우주의 팽창에 대해 무엇을 말해 주는지 추론하시오.","(1)의 결론은 문제 2에서 구한 우주의 나이 어림에 어떤 영향을 주는가?"],"ans":["예상보다 어둡다는 것은 예상보다 멀리 있다는 뜻이다. 빛이 떠난 뒤로 우주가 일정한 속도로 팽창했을 때보다 더 많이 팽창했으므로 팽창이 점점 빨라지고 있다(가속 팽창). 이를 일으키는 것으로 암흑 에너지를 생각한다. 팽창 속도가 일정했다는 가정이 맞지 않으므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mi>H</mi></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1H</annotation></semantics></math></span>은 어림값일 뿐이며, 과거의 팽창 속도가 어떻게 변했는지를 넣어 다시 계산해야 한다."]}]},{"kind":"기출","src":"2026학년도 지구과학 문제 1","page":"문항집 66~69쪽","scope":"지구과학Ⅰ · 지구과학Ⅱ","concept":"기권의 층상 구조, 복사 평형, 대기의 안정도, 단열 변화, 이슬점, 경도풍, 표층 염분","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"body":"<p>지구 대기의 안정도와 복사 평형, 대기 운동(단열 변화, 지균풍, 경도풍), 대기와 해양의 상호 작용에 관한 문항이다.</p><figure><svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"고도에 따른 평년 기온 분포\">\n<line class=\"ax\" x1=\"50\" y1=\"175\" x2=\"280\" y2=\"175\"/><line class=\"ax\" x1=\"50\" y1=\"180\" x2=\"50\" y2=\"14\"/><polyline class=\"ln\" points=\"220,175 110,90 130,20\"/>\n<line class=\"dash\" x1=\"50\" y1=\"150\" x2=\"270\" y2=\"150\"/><line class=\"dash\" x1=\"50\" y1=\"38\" x2=\"270\" y2=\"38\"/><line class=\"grid1\" x1=\"50\" y1=\"90\" x2=\"270\" y2=\"90\"/>\n<text x=\"54\" y=\"146\">고도 A</text><text x=\"54\" y=\"34\">고도 B</text><text x=\"190\" y=\"86\">대류권 계면</text><text x=\"200\" y=\"64\">하부 성층권</text><text x=\"220\" y=\"130\">대류권</text><text x=\"250\" y=\"192\">기온</text><text x=\"20\" y=\"100\">고도</text>\n</svg><figcaption>[그림 1-1] 어느 지역의 고도에 따른 평년 기온 분포</figcaption></figure>\n<p>고도에 따른 기온 변화의 크기는 대류권이 하부 성층권보다 크다.</p>","qs":["(1) 기후 변화로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span>년 뒤 고도 A의 기온은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">1\\,</annotation></semantics></math></span>℃ 오르고 고도 B의 기온은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">1\\,</annotation></semantics></math></span>℃ 내렸다. 대류권 계면의 고도와 기온이 그림 1-1에 비해 어떻게 변할지 설명하시오. (두 층의 기온 감률은 변하지 않고, A와 B는 여전히 각각 대류권과 하부 성층권에 있다.)<br>(2) 전 지구적으로 이런 변화가 생기면 적란운과 태풍이 발달할 수 있는 높이가 어떻게 변할지 유추하고, 이것이 지구 대기의 평균 온도에 미치는 영향을 설명하시오.","겨울철 상대적으로 따뜻한 바다 위로 찬 기단이 이동하면 해상에 눈구름이 생긴다. 바다 위 지점 A에서 측정한 고도별 기온은 표와 같고, 해수면 근처 공기 덩어리의 이슬점은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">6\\,</annotation></semantics></math></span>℃이다. 세 질문 모두 해수면 근처의 공기 덩어리가 강제로 상승하는 경우이다.\n<table><tr><th>고도(km)</th><td>0</td><td>0.5</td><td>1.0</td><td>1.5</td><td>2.0</td><td>2.5</td><td>3.0</td><td>3.5</td><td>4.0</td></tr><tr><th>기온(℃)</th><td>10.0</td><td>4.0</td><td>1.0</td><td>−1.0</td><td>−2.5</td><td>−4.0</td><td>−5.5</td><td>−7.0</td><td>−7.0</td></tr></table>\n(1) 현재 A에서 상승 응결 고도, 구름 최상부의 높이, 구름의 두께를 구하시오.<br>(2) 시베리아 기단의 남하로 고도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>∼</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">1\\sim4</annotation></semantics></math></span> km의 모든 높이에서 기온이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">3\\,</annotation></semantics></math></span>℃ 낮아지면 구름의 두께가 어떻게 변할지 설명하시오.<br>(3) 표층 수온 상승으로 해수면 근처의 기온과 이슬점이 각각 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">2\\,</annotation></semantics></math></span>℃ 높아지면 구름의 두께가 어떻게 변할지 설명하시오.","위도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>인 북반구 중위도에서 회전 중심으로부터 거리 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>인 곳의 고기압성 경도풍과 저기압성 경도풍을 생각한다. (위도 변화는 무시한다.)<br>(1) 고기압성 경도풍의 속력 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi mathvariant=\"normal\">H</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_\\mathrm{H}</annotation></semantics></math></span>가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>r</mi><mi>f</mi></mrow><mn>4</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{rf}{4}</annotation></semantics></math></span> (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">Ω</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">f=2\\Omega\\sin\\theta</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>: 지구 자전 각속도)일 때, 기압 경도력의 크기와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>이 같은 저기압성 경도풍의 속력 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi mathvariant=\"normal\">L</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_\\mathrm{L}</annotation></semantics></math></span>을 구하고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msub><mi>v</mi><mi mathvariant=\"normal\">L</mi></msub><msub><mi>v</mi><mi mathvariant=\"normal\">H</mi></msub></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{v_\\mathrm{L}}{v_\\mathrm{H}}</annotation></semantics></math></span>을 계산하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>2</mn></msqrt><mo>=</mo><mn>1.414</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt2=1.414</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>3</mn></msqrt><mo>=</mo><mn>1.732</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt3=1.732</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>5</mn></msqrt><mo>=</mo><mn>2.236</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt5=2.236</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>7</mn></msqrt><mo>=</mo><mn>2.645</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt7=2.645</annotation></semantics></math></span>)<br>(2) 상층 편서풍 파동에서 기압 마루와 기압골 사이의 경도풍 속력 차이가 지상 저기압·고기압 발달에 미치는 영향을 설명하시오. 또 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>이 감소하면 (1)의 비율이 어떻게 변하고 이것이 지상 저기압·고기압 발달에 어떤 영향을 주는지 설명하시오.","전 세계 해양의 연평균 표층 염분 분포를 보면 대서양의 아열대 해역은 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>37</mn></mrow><annotation encoding=\"application/x-tex\">37</annotation></semantics></math></span> psu, 태평양의 아열대 해역은 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>35</mn><mo>∼</mo><mn>36</mn></mrow><annotation encoding=\"application/x-tex\">35\\sim36</annotation></semantics></math></span> psu로 대서양이 더 높다. 대서양이 태평양보다 평균 표층 염분이 높은 이유를 대기 대순환과 수륙 및 산맥의 분포(아메리카 대륙 서쪽의 로키·안데스산맥 등)와 연관 지어 설명하시오. (원문의 염분 분포 지도는 문항집 69쪽 참조)"],"ans":["연직 기온 분포와 대류권 계면을 이해하여 계면의 고도와 기온 변화를 추론하는지, 지구 복사에 대한 이해로 구름이 대기 온도에 미치는 영향을 설명하는지 본다.","기단의 변질에 따른 구름 발생을 이해하고, 단열 선도를 해석하여 상승 응결 고도와 구름의 두께를 정량적으로 설명하는지 본다.","경도풍에 작용하는 세 힘으로 두 경도풍의 풍속을 정량적으로 비교하고, 편서풍 파동이 지상 기압 배치에 미치는 영향을 풍속 변화로 설명하는지 본다.","표층 염분을 결정하는 강수량과 증발량의 지역 차이를 대기 대순환, 수륙과 산맥의 분포와 연관 지어 논리적으로 설명하는지 본다."]},{"kind":"기출","src":"2026학년도 지구과학 문제 2","page":"문항집 72~75쪽","scope":"지구과학Ⅰ · 지구과학Ⅱ","concept":"지구 온난화, 반사도, 열염 순환, 지각 평형, 중력 이상, 마그마 생성, 탄소 순환, 한반도의 지질","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"qnum":2,"body":"<p>플룸과 연계된 대규모 화성 활동이나 인간 활동에 의한 대기 중 이산화 탄소 농도의 증가는 지구 평균 기온을 빠르게 올리는 요인이다. 지구 온난화와 관련된 다음 문항에 답하시오.</p>","qs":["지구 온난화가 진행될 때 극지방 해역의 표층 수온은 적도 지방 해역보다 더 빠르게 오른다고 알려져 있다. 이유를 설명하시오.","극지방 해역의 수심(0~1,500 m)에 따른 수온 분포를 지구 온난화가 진행되기 전과 후로 나누어 그래프로 나타내고, 이 변화가 해양의 열염 순환에 미치는 영향을 설명하시오.","<figure><svg viewBox=\"0 0 360 180\" role=\"img\" aria-label=\"그린란드 주변의 빙하, 바다, 지각, 맨틀 모식도\">\n<rect class=\"sand\" x=\"20\" y=\"60\" width=\"320\" height=\"110\"/>\n<path class=\"cell on\" d=\"M20,70 L170,70 Q200,72 230,90 L250,100 Q200,150 120,150 Q50,150 20,120 Z\"/>\n<rect class=\"sea\" x=\"215\" y=\"72\" width=\"125\" height=\"18\"/><rect class=\"pt\" x=\"240\" y=\"90\" width=\"100\" height=\"10\" opacity=\".55\"/>\n<path class=\"bub\" d=\"M40,70 Q100,40 180,70 Z\"/><line class=\"dash\" x1=\"196\" y1=\"30\" x2=\"196\" y2=\"74\"/>\n<text x=\"60\" y=\"48\">빙하</text><text x=\"70\" y=\"112\">그린란드 대륙 지각</text><text x=\"270\" y=\"68\">바다</text><text x=\"262\" y=\"118\">해양 지각</text><text x=\"230\" y=\"158\">맨틀</text><text x=\"200\" y=\"28\">해안선</text>\n</svg><figcaption>[그림 2-1] 그린란드 주변의 빙하, 바다, 지각, 맨틀의 분포</figcaption></figure>(1) 지구 온난화로 그림 2-1의 빙하가 녹을 때 그린란드의 해안선 변화에 영향을 주는 여러 요인과 그에 따른 해안선의 이동 방향을 설명하시오.<br>(2) 중력 이상의 정의를 말하고, (1)의 경우 그린란드의 중력 이상이 어떻게 변하는지 설명하시오.","중앙 해령에서는 맨틀 물질이 상승할 때 압력이 줄어 현무암질 마그마가 생긴다(상승하는 맨틀 물질의 온도–깊이 경로가 물이 포함되지 않은 맨틀의 용융 곡선과 만난다).\n<div class=\"box\"><b>조건</b><p>맨틀의 밀도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ρ</mi><mi>m</mi></msub><mo>=</mo><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>3</mn></msup><mtext> </mtext><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">/</mi><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></mrow></mrow><annotation encoding=\"application/x-tex\">\\rho_m=3\\times10^3\\ \\mathrm{kg/m^3}</annotation></semantics></math></span>, 중력 가속도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi><mo>=</mo><mn>10</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">/</mi><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup></mrow></mrow><annotation encoding=\"application/x-tex\">g=10\\ \\mathrm{m/s^2}</annotation></semantics></math></span>, 맨틀의 평균 상승 속도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>m</mi></msub><mo>=</mo><mn>0.02</mn></mrow><annotation encoding=\"application/x-tex\">v_m=0.02</annotation></semantics></math></span> m/yr, 정역학 평형 식 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>=</mo><mi>ρ</mi><mi>g</mi><mi mathvariant=\"normal\">Δ</mi><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta P=\\rho g\\Delta h</annotation></semantics></math></span></p></div>\n(1) 맨틀 물질의 감압 속도(Pa/yr)를 계산하시오.<br>(2) 전 지구적인 해수면 상승 속도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>w</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_w</annotation></semantics></math></span>가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.01</mn></mrow><annotation encoding=\"application/x-tex\">0.01</annotation></semantics></math></span> m/yr일 때, 감압 속도가 해수면이 오르지 않는 경우에 비해 어떻게 변하는지 계산하시오. (해수의 밀도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ρ</mi><mi>w</mi></msub><mo>=</mo><mn>1</mn><mo>×</mo><msup><mn>10</mn><mn>3</mn></msup><mtext> </mtext><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">/</mi><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></mrow></mrow><annotation encoding=\"application/x-tex\">\\rho_w=1\\times10^3\\ \\mathrm{kg/m^3}</annotation></semantics></math></span>)<br>(3) 이 현상이 지구 온난화에 미치는 영향을 설명하시오. (마그마 생성 속도는 감압 속도에 비례한다.)","지구 시스템의 탄소는 각 권역의 상호 작용으로 끊임없이 순환한다.<br>(1) 탄소가 지권에 저장되는 과정에는 무엇이 있는지 설명하시오.<br>(2) 고생대에 한반도의 일부 지역은 얕은 바다와 육상 습지 환경이 되풀이되며 탄소가 지권에 저장되었다. 이때 만들어진 지층들의 이름과 여기서 나는 탄소 자원이 무엇인지 설명하시오."],"ans":["극지방 얼음과 눈의 융해, 반사도, 열수지의 관계와 적도·극지방 해역의 표층·심층 해수의 이동을 이해하는지 본다.","혼합층과 수온 약층이 만들어지는 원리를 이해하고, 수온 상승과 담수 유입으로 연직 대류가 약해짐을 판단하는지 본다.","담수 유입, 열팽창, 빙하의 인력 약화, 대륙 지각의 융기가 해안선에 미치는 영향을 복합적으로 고려하는지, 중력 이상과 지각 평형을 연결해 설명하는지 본다.","감압에 의한 마그마 생성을 정역학 평형과 연관 지어 정량적으로 해석하고, 해수면 상승이 해저 화산 활동과 온난화에 미치는 영향을 설명하는지 본다.","탄소가 지권에 저장되는 여러 과정을 파악하고, 평안 누층군의 퇴적 과정을 유기적 퇴적암과 연관 지어 설명하는지 본다."]}],"hum":[{"kind":"연습","src":"연습 1 · 기록과 잊힐 권리","scope":"국어 · 사회 · 도덕 교과 전반","concept":"기록의 가치, 잊힐 권리, 공익과 사익, 역사 서술","noAnswer":true,"plain":true,"body":"<p>(가) 기록은 공동체가 스스로를 기억하는 방식이다. 한 시대의 기록은 좋은 일과 부끄러운 일을 가리지 않고 남겨질 때에만 뒷사람에게 쓸모가 있다. 불편하다는 이유로 기록을 하나씩 지우기 시작하면, 남는 것은 사실이 아니라 그때그때의 사정에 맞게 다듬어진 이야기이다. 기록을 지킬 책임은 그 기록에 등장하는 사람의 바람보다 앞선다.</p>\n<p>(나) 사람은 과거의 한 장면으로 고정되지 않는다. 오래전의 잘못이나 불운이 검색 한 번으로 끝없이 되살아난다면, 그 사람은 달라질 기회를 얻지 못한다. 예전에는 시간이 지나면 기억이 흐려졌고, 그 흐려짐이 사람에게 다시 시작할 자리를 마련해 주었다. 모든 것이 저장되는 시대에는 잊는 일도 따로 보장해야 할 권리가 된다.</p>\n<p>(다) 어느 지역 신문사가 지난 30년 치 기사를 누구나 검색할 수 있는 인터넷 자료실로 공개하였다. 20년 전 가게 문을 닫으며 빚을 갚지 못해 재판을 받았던 한 시민이, 자신의 이름이 실린 당시 기사를 지워 달라고 신문사에 요청하였다. 그는 그 뒤 빚을 모두 갚았고 지금은 같은 지역에서 새 가게를 하고 있다.</p><p>(라) 어느 소설에는 보고 들은 것을 하나도 잊지 못하게 된 사람이 나온다. 그는 어제 본 나뭇잎 한 장 한 장의 모양까지 떠올릴 수 있지만, 서로 다른 때에 본 개를 같은 '개'라는 말로 묶는 일을 견디지 못한다. 작가는 그가 생각하는 능력을 잃었다고 쓴다. 생각한다는 것은 차이를 잊고 묶는 일이기 때문이다.</p>","qs":[],"ans":[],"follow":["기사를 지우지 않고 검색에서만 빼는 것은 (가)의 입장에서 받아들일 수 있는가?","기록을 남길지 지울지를 누가 결정해야 하는가?"],"groups":[{"parts":["(가)와 (나)가 기록을 바라보는 관점의 차이를 설명하시오.","(1)에서 정리한 각 관점에서 (다)의 요청에 어떻게 답할지 말하시오."],"ans":["(가)는 기록을 공동체의 것으로 보고 온전함을 우선하며, (나)는 기록에 담긴 개인의 삶을 우선한다. (가)라면 삭제를 거절하고, (나)라면 삭제를 받아들일 것이다. 두 글의 주장과 근거를 자기 말로 정확히 옮기는지 본다."]},{"parts":["지원자가 신문사의 편집 책임자라면 (다)의 요청을 어떻게 처리하겠는가? 판단의 기준을 제시하시오.","(1)의 기준이 다른 요청(예: 공직자의 과거 비위 기사 삭제 요청)에도 그대로 적용될 수 있는지 설명하시오."],"ans":["삭제와 유지 사이의 다른 길(이름 가리기, 검색 제외, 후속 사실 덧붙이기)을 떠올리는지, 기준(당사자가 공인인지, 지난 시간, 사안의 공익성, 기록 원본의 보존 여부)을 세우고 다른 사례에 일관되게 적용하는지 본다."]},{"parts":["(라)에 비추어 (가)가 말하는 '기록의 온전함'을 다시 검토하시오. 모든 것을 남기는 것이 곧 잘 기억하는 것인가?","(1)의 생각을 바탕으로, 한 사회가 무엇을 남기고 무엇을 흐려지게 둘지는 누가, 어떤 기준으로 정해야 하는지 (다)의 사례에 적용하여 말하시오."],"ans":["(라)에서 \"잊음이 사고의 조건\"이라는 생각을 읽어 내고, 저장과 기억을 구분하는지 본다. 선별이 피할 수 없다면 문제는 '지울 것인가'가 아니라 '누가 고르는가'로 옮겨 간다는 데까지 나아가면 높게 평가한다."]},{"parts":["기사 원문은 자료실에 남겨 두되 이름으로는 검색되지 않게 하는 방안이 있다. 이 방안이 (가)와 (나) 각각의 우려를 얼마나 덜어 주는지 평가하시오.","(1)의 방안을 받아들인다면, 검색 제외를 해 주어서는 안 되는 기사는 어떤 것인가? 기준과 이유를 말하시오."],"ans":["(1) 기록의 보존과 개인의 새 출발을 함께 살리지만, (가)에서는 찾을 수 없는 기록이 사실상 없는 기록이 될 수 있고 (나)에서는 여전히 남아 있다는 불안이 남는다는 점을 짚는지 본다. (2) 공적 지위, 사안의 공익성, 지난 시간 등의 기준을 세우고 이유를 대는지 본다."]}]},{"kind":"연습","src":"연습 2 · 기계가 쓴 시","scope":"국어 · 사회 · 도덕 교과 전반","concept":"작가와 독자, 작품의 가치, 창작의 의미","noAnswer":true,"plain":true,"body":"<p>(가) 작품은 그것을 쓴 사람의 삶에서 나온다. 우리가 한 편의 시에서 감동을 받는 것은 그 말들 뒤에 그렇게 말할 수밖에 없었던 한 사람이 있다고 믿기 때문이다. 겪은 적 없는 이별을 노래한 시가 아무리 매끄러워도, 그것이 누구의 이별도 아니라는 사실을 알게 되면 우리는 속았다고 느낀다.</p>\n<p>(나) 작품의 뜻은 읽는 사람에게서 완성된다. 작가가 무슨 뜻으로 썼는지는 대개 알 수 없고, 알 필요도 없다. 오래된 노래의 지은이를 모르면서도 우리는 그 노래에 운다. 글이 독자에게 무엇을 일으켰는가가 그 글의 값이다.</p>\n<p>(다) 어느 문학 공모전에서 심사 위원 전원이 가장 높은 점수를 준 시가, 응모자가 인공지능에게 몇 마디 지시를 주어 얻은 것임이 뒤늦게 밝혀졌다. 응모 요강에는 인공지능 사용에 관한 규정이 없었다.</p><p>(라) 어느 미술관이 수십 년 동안 대표작으로 걸어 온 그림이 유명 화가의 작품이 아니라 솜씨 좋은 다른 사람이 그린 위작임이 밝혀졌다. 그림 자체는 붓질 하나 달라지지 않았지만, 미술관은 그림을 전시실에서 내려 수장고로 옮겼다. 관람객 가운데에는 \"어제까지 감동받던 그림을 오늘 볼 수 없게 되었다\"고 아쉬워하는 사람도 있었다.</p>","qs":[],"ans":[],"follow":["지시문을 고르고 결과를 추린 응모자는 작가인가?","심사 위원들이 사실을 알고 다시 읽으면 감상이 달라져야 하는가?"],"groups":[{"parts":["(가)와 (나)가 작품의 값을 어디에서 찾는지 각각 설명하시오.","(1)의 두 관점에서 (다)의 시가 좋은 작품인지 각각 판단하고 근거를 말하시오."],"ans":["(가)는 작품 뒤의 삶을 값의 근거로 보므로 낮게 평가하고, (나)는 독자에게 일으킨 효과를 근거로 보므로 좋은 작품으로 본다. 두 글의 근거를 구분해 옮기는지 본다."]},{"parts":["\"좋은 작품인가\"와 \"상을 받을 자격이 있는가\"는 같은 물음인가? 지원자의 생각을 말하시오.","(1)의 구분을 바탕으로 주최 측이 이 시의 수상을 취소해야 하는지 판단하시오."],"ans":["작품의 질과 상의 취지(사람의 창작을 격려하는 제도인지)를 구분하는지, 규정이 없었다는 사정을 어떻게 다루는지, 자신의 기준을 다른 경우(대필, 공동 창작)에도 일관되게 적용하는지 본다."]},{"parts":["(라)에서 미술관이 한 일을 (가)와 (나)의 관점에서 각각 평가하시오.","(라)의 위작과 (다)의 시는 어떤 점에서 같고 어떤 점에서 다른가? 그 차이가 문제 2의 판단에 영향을 주는지 말하시오."],"ans":["공통점(작품은 그대로인데 만든 이에 대한 정보가 평가를 바꿈)과 차이점(위작은 남을 사칭한 속임이 있고, (다)는 규정이 없던 새 도구의 사용)을 구분하는지 본다. '속임'과 '출처'를 나누어 생각하면 높게 평가한다."]},{"parts":["(다)의 응모자가 지시문을 수십 번 고쳐 쓰고 여러 결과 가운데 한 편을 골랐다고 하자. 이 과정을 창작으로 볼 수 있는지, 셔터를 누르는 사진가의 작업과 견주어 말하시오.","(1)의 판단을 바탕으로 내년 공모전 응모 요강에 넣을 규정을 한 가지 제안하고 이유를 설명하시오."],"ans":["(1) 고르고 다듬는 판단이 창작의 일부일 수 있음과, 표현 자체를 만든 주체가 누구인지를 구분해 견주는지 본다. (2) 금지, 사용 사실의 공개, 부문 분리 등 제안이 (1)의 판단과 일관되는지 본다."]}]},{"kind":"연습","src":"연습 3 · 자막 속의 표준어","scope":"국어 · 사회 · 도덕 교과 전반","concept":"표준어와 방언, 소통과 다양성, 언어와 정체성","noAnswer":true,"plain":true,"body":"<p>(가) 서로 다른 지역의 사람들이 한 사회를 이루어 살려면 누구나 알아듣는 공통의 말이 있어야 한다. 표준어는 출신 지역에 따라 사람을 달리 대하지 않게 하는 장치이기도 하다. 학교와 방송이 표준어를 쓰는 것은 어느 한 지역의 말을 높여서가 아니라, 모두가 같은 조건에서 배우고 들을 수 있게 하기 위해서이다.</p>\n<p>(나) 방언에는 그 지역 사람들이 세상을 나누어 보는 방식이 담겨 있다. 바닷가 마을의 말에는 바람과 물때를 가리키는 낱말이 촘촘하다. 방언을 틀린 말, 고쳐야 할 말로 대하는 순간 그 말을 쓰는 사람들의 삶도 낮추어 보게 된다.</p>\n<p>(다) 한 방송사의 다큐멘터리에서 섬마을 노인이 방언으로 한 말을 자막에서는 모두 표준어로 바꾸어 내보냈다. 방송사는 시청자의 이해를 돕기 위한 것이라고 설명하였다.</p><p>(라) 한 조사 기관이 이 프로그램의 시청자와 그 섬 지역 주민에게 물었다.</p>\n<table><tr><th>질문</th><th>그렇다</th></tr><tr><th>(시청자) 자막이 없으면 섬 주민의 말을 이해하기 어렵다</th><td>70 %</td></tr><tr><th>(시청자) 원래 말이 궁금하다, 그대로도 보고 싶다</th><td>45 %</td></tr><tr><th>(섬 주민) 방송에서 우리 말이 표준어로 바뀌어 나갈 때 불쾌하다</th><td>60 %</td></tr></table>","qs":[],"ans":[],"follow":["외국어 인터뷰의 번역 자막과 이 경우는 무엇이 다른가?","표준어 자체가 한 지역의 말에서 왔다는 사실은 (가)의 주장을 약하게 만드는가?"],"groups":[{"parts":["(가)와 (나)가 표준어와 방언을 각각 어떻게 보는지 설명하시오.","(1)의 두 관점에서 (다)의 자막 처리를 각각 평가하시오."],"ans":["(가)는 이해를 돕는 정당한 조치로 보고, (나)는 화자의 말을 지우고 고쳐야 할 것으로 다룬 처사로 본다. 각 글의 핵심 근거(소통·평등, 삶의 방식·존중)를 짚는지 본다."]},{"parts":["지원자가 이 프로그램의 제작자라면 자막을 어떻게 처리하겠는가?","(1)의 방식이 (가)와 (나)의 우려를 각각 얼마나 덜 수 있는지 설명하시오."],"ans":["방언을 소리 나는 대로 적고 뜻풀이를 덧붙이는 방법 등 구체적인 대안을 내고, 그 대안의 비용(가독성, 화면 공간)까지 따지는지 본다."]},{"parts":["(라)의 조사 결과를 근거로 문제 2에서 낸 방안을 보완하시오.","다수의 편의와 소수의 존중이 부딪칠 때 어떤 원칙으로 판단해야 하는가? (라)의 조사 결과가 그 판단에 줄 수 있는 것과 줄 수 없는 것을 구분하여 말하시오."],"ans":["세 수치를 모두 써서 방안을 고치는지(예: 원래 말을 적고 풀이를 덧붙임) 본다. 조사는 사람들의 바람이 어떤지는 알려 주지만 무엇이 옳은지는 정해 주지 않는다는 점, 다수결로 정할 수 없는 문제가 있다는 점을 말하면 높게 평가한다."]},{"parts":["외국어 인터뷰에 붙이는 번역 자막과 (다)의 자막은 무엇이 같고 무엇이 다른가?","(1)의 차이에 비추어, 남의 말을 다른 말로 옮기는 일이 존중이 되는 조건과 깎아내림이 되는 조건을 말하시오."],"ans":["(1) 둘 다 이해를 돕지만, 방언은 같은 언어의 한 갈래여서 '고쳐야 할 말'로 다루어질 위험이 있음을 짚는지 본다. (2) 원래 말을 지우지 않는지, 당사자의 뜻을 묻는지 등 조건을 스스로 세우는지 본다."]}]},{"kind":"연습","src":"연습 4 · 설립자의 동상","scope":"국어 · 사회 · 도덕 교과 전반","concept":"역사 평가, 기념의 의미, 과거와 현재의 가치","noAnswer":true,"plain":true,"body":"<p>(가) 지나간 시대의 사람을 오늘의 잣대로 재는 것은 공정하지 않다. 그 시대에는 그 시대의 상식이 있었고, 누구도 자기 시대를 완전히 벗어나 생각할 수 없다. 흠이 있다는 이유로 과거의 인물을 하나씩 지워 나가면 기억할 만한 사람은 아무도 남지 않는다.</p>\n<p>(나) 동상을 세우는 것은 과거를 기록하는 일이 아니라, 지금 우리가 무엇을 본받겠다고 밝히는 일이다. 기록은 책과 박물관에 남기면 된다. 광장 한가운데에 누구를 세워 둘지는 지금 여기에 사는 사람들이 정할 문제이다.</p>\n<p>(다) 어느 학교의 설립자는 가난한 학생들을 위해 전 재산을 내놓은 사람으로 기려져 교정에 동상이 서 있다. 그런데 그가 재산을 모으는 과정에서 일꾼들을 가혹하게 부렸다는 기록이 새로 발견되었다. 학생회는 동상을 옮기자는 안건을 올렸다.</p><p>(라) 어떤 도시는 논란이 된 인물의 동상을 치우지 않기로 했다. 대신 동상 바로 맞은편에 그 인물 때문에 고통받은 사람들을 기리는 조형물을 새로 세우고, 두 조형물 사이의 바닥에 양쪽의 사실을 모두 적은 글을 새겼다. 이 결정에 대해 \"역사를 있는 그대로 마주하게 한다\"는 평가와 \"가해자와 피해자를 나란히 세웠다\"는 비판이 함께 나왔다.</p>","qs":[],"ans":[],"follow":["설립자의 공과 과를 저울질하는 것이 가능한가?","동상 옆에 새로 발견된 사실을 적은 안내판을 세우는 안은 두 관점을 모두 만족시키는가?"],"groups":[{"parts":["(가)와 (나)의 관점이 (다)의 안건에 대해 각각 어떤 결론에 이를지 설명하시오.","(1)의 두 관점이 서로 놓치고 있는 점을 하나씩 지적하시오."],"ans":["(가)는 유지, (나)는 구성원의 결정에 따른 이전을 지지한다. 놓친 점의 예: (가)는 당대에도 비판받았을 행위인지 따지지 않고, (나)는 현재의 판단도 훗날 바뀔 수 있음을 고려하지 않는다."]},{"parts":["지원자가 학생회 회의에 참석한다면 어떤 안을 내겠는가?","(1)의 안에 반대할 사람의 가장 강한 논거를 스스로 제시하고 그에 답하시오."],"ans":["유지·이전·설명문 추가 등 구체적인 안과 절차를 내는지, 반대 논거를 약하게 만들지 않고 제대로 세운 뒤 답하는지 본다."]},{"parts":["(라)의 방식에 대한 두 평가 가운데 어느 쪽에 더 동의하는지 밝히고, '기억하는 것'과 '기리는 것'을 구분하여 그 이유를 설명하시오.","(1)의 생각을 바탕으로 (라)의 방식을 (다)의 학교에 적용한다면 무엇을 더 고려해야 하는지 말하시오."],"ans":["기억(있었던 일을 남김)과 기림(본받을 것으로 내세움)을 구분하여 (가)·(나)의 대립을 다시 정리하는지 본다. 학교는 학생이 날마다 지나는 교육의 공간이라는 점, 피해자에 해당하는 사람들의 뜻을 묻는 절차 등을 고려하면 높게 평가한다."]},{"parts":["백 년 뒤의 사람들이 오늘 우리가 당연하게 여기는 일 가운데 무엇을 비판할지 예를 하나 들어 보시오.","(1)의 예에 (가)의 논리를 적용하면 오늘의 우리는 비판을 면할 수 있는가? 이를 바탕으로 과거의 인물을 평가할 때 쓸 기준을 하나 제안하시오."],"ans":["(1) 예가 구체적인지 본다. (2) \"그 시대의 상식\"이라는 변명이 어디까지 통하는지 따지고, '그때에도 비판하는 목소리가 있었는가', '피할 수 있는 선택이었는가' 같은 기준을 내는지 본다."]}]},{"kind":"기출","src":"2026학년도 인문학","page":"문항집 1~2쪽","scope":"국어 · 사회 · 도덕 교과 전반","concept":"도덕적 이해, 추론, 직접 경험, 간접 경험, 문학의 가치와 기능, 공감, 상상","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"plain":true,"body":"<p class=\"note2\">제시문은 원문을 요약한 것입니다. 전문은 문항집 1~2쪽에서 확인하세요.</p>\n<p>(가) 어떤 행위가 왜 그른지를 자기 말로 설명하고, 그 이유에서 결론을 추론하며, 비슷한 이유에서 비슷한 결론을 끌어낼 수 있어야 그 행위의 그름을 도덕적으로 이해했다고 할 수 있다. 남들의 말에 따라 동의하는 것만으로는 이해가 아니다.</p>\n<p>(나) 도덕적 이해의 핵심은 일인칭의 경험이다. 처형 장면을 직접 목격한 한 작가는 그 순간에야 사람을 죽이는 일의 그릇됨을 깨달았다고 회상한다. 이때 그의 도덕적 이해는 넓어졌지만, 그가 이유를 따져 추론했다고 보기는 어렵다.</p>\n<p>(다) 우리는 남의 감정을 직접 겪을 수 없으므로 상상을 통해서만 공감할 수 있다. 또 자기 행동을 치우침 없는 관찰자의 눈으로 상상해 돌아봄으로써 감정을 다스리고 도덕적 판단을 한다.</p>","qs":["도덕적 이해에 대한 (가)와 (나)의 관점 중 하나를 골라 다른 하나를 비판하시오.","문학을 통한 도덕적 이해가 가능하다는 주장이 있다. (가), (나), (다)의 유기적 관계를 파악하여 이 주장을 뒷받침하시오."],"ans":["추론 능력을 핵심으로 보는 견해와 체험을 핵심으로 보는 견해 중 더 공감하는 쪽을 바탕으로 상대 견해를 비판적으로 살피는지 본다.","문학이 상상·공감·감정을 매개로 간접 경험을 준다는 점을 (다)와 잇고, 문학 읽기에 추론, 경험, 상상이 함께 쓰인다는 점을 세 제시문을 모두 써서 분석하는지 본다."]},{"kind":"기출","src":"2025학년도 인문학","page":"문항집 1~2쪽","scope":"국어 · 사회 · 도덕 교과 전반","concept":"번역, 번역의 태도, 세계화, 역사관, 역사 해석","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"plain":true,"body":"<p class=\"note2\">제시문은 원문을 요약한 것입니다. 전문은 2025학년도 문항집 1~2쪽에서 확인하세요.</p>\n<p>(가) 번역문은 번역자의 모국어로 쓴 원작처럼 매끄럽게 읽혀야 성공한 것이다. 단어를 하나씩 옮기는 일을 피하고 일상의 말로 옮겨야 한다.</p>\n<p>(나) 번역 작품을 읽는 것은 외국 여행과 같아서 낯선 느낌이 남아 있어야 한다. 알기 쉽게 옮기는 일과 원작의 모습을 지키는 일은 자주 부딪치는데, 때로는 매끄럽지 못한 번역이 더 낫다.</p>\n<p>(다) 번역가는 뜻만 옮기는 것이 아니라 낯선 언어의 소리와 표현을 모국어 안에 받아들여 모국어를 넓힌다. 원문에 숨어 있던 뜻도 번역을 통해 새로 드러난다. 이 점에서 번역가는 창조자이지만, 원문을 벗어난 말놀이를 뜻하지는 않는다.</p>","qs":["(가), (나), (다)의 필자가 번역에 대해 가지는 입장을 비교하여 설명한 뒤, 자신의 독서 경험에 비추어 어떤 입장이 타당하다고 생각하는지 밝히시오.","\"역사 해석은 번역과 나란하다. 과거의 역사를 원문에, 그 해석을 번역문에 견줄 수 있고, 역사가도 저마다 해석의 방식이 있다.\"는 글을 참고하여, (가), (나), (다)의 입장 차이가 역사 해석에서 어떻게 드러날 수 있는지 구체적인 사례를 들어 설명하시오."],"ans":["세 입장(읽는 쪽에 맞춤, 원작의 낯섦을 지킴, 두 언어를 함께 넓힘)을 정확히 구분해 비교하고, 자신의 독서 경험을 근거로 삼는지 본다.","번역 태도의 차이를 역사 해석(현재의 눈으로 풀기, 당대의 맥락을 지키기, 과거와 현재를 함께 새로 보기)에 옮겨 구체적 사례로 설명하는지 본다. (이 항목은 문항 분석을 바탕으로 정리한 것입니다.)"]}],"soc":[{"kind":"연습","src":"연습 1 · 기본값의 힘","scope":"통합사회 · 경제 · 사회·문화","concept":"합리적 선택, 기본값 효과, 자료 해석, 정책의 정당성","noAnswer":true,"plain":true,"body":"<p>(가) 사람은 선택할 수 있는 길들의 이익과 비용을 견주어 자신에게 가장 좋은 것을 고른다. 선택지의 내용이 같다면 그것이 어떤 순서나 형식으로 주어지든 선택은 달라지지 않는다. 그러므로 사람들의 선택을 바꾸려면 이익이나 비용을 바꾸어야 한다.</p>\n<p>(나) 사람들은 따로 정하지 않으면 적용되는 선택지, 곧 기본값을 그대로 두는 경향이 있다. 고르는 데 드는 수고를 피하려 하고, 기본값을 권장 사항으로 받아들이며, 바꾸었다가 나빠지는 일을 더 크게 느끼기 때문이다.</p>\n<p>(다) 갑국과 을국은 소득 수준, 종교, 의료 제도가 비슷하다. 갑국에서는 장기 기증에 동의한다고 신청한 사람만 기증자가 되고, 을국에서는 기증을 거부한다고 신청하지 않은 사람은 모두 기증에 동의한 것으로 본다. 두 나라 모두 신청은 인터넷으로 5분이면 할 수 있다.</p><figure><svg viewBox=\"0 0 360 190\" role=\"img\" aria-label=\"두 나라의 장기 기증 동의 비율 막대그래프\">\n<line class=\"ax\" x1=\"50\" y1=\"160\" x2=\"330\" y2=\"160\"/><line class=\"ax\" x1=\"50\" y1=\"165\" x2=\"50\" y2=\"14\"/>\n<line class=\"grid1\" x1=\"50\" y1=\"160\" x2=\"330\" y2=\"160\"/><text x=\"24\" y=\"164\">0</text><line class=\"grid1\" x1=\"50\" y1=\"95\" x2=\"330\" y2=\"95\"/><text x=\"24\" y=\"99\">50</text><line class=\"grid1\" x1=\"50\" y1=\"30\" x2=\"330\" y2=\"30\"/><text x=\"24\" y=\"34\">100</text>\n<rect class=\"sea\" x=\"100\" y=\"141.8\" width=\"60\" height=\"18.2\"/><rect class=\"sand\" x=\"220\" y=\"41.7\" width=\"60\" height=\"118.3\"/>\n<text class=\"c\" x=\"130\" y=\"135.8\">14 %</text><text class=\"c\" x=\"250\" y=\"35.7\">91 %</text>\n<text class=\"c\" x=\"130\" y=\"176\">갑국</text><text class=\"c\" x=\"250\" y=\"176\">을국</text><text x=\"6\" y=\"12\">기증 동의 비율(%)</text>\n</svg><figcaption>[그림] 가상의 두 나라 갑국과 을국의 성인 장기 기증 동의 비율</figcaption></figure><p>(라) 두 나라의 실제 장기 이식 건수를 조사하였다. 두 나라 모두 본인이 동의했더라도 사망 뒤 가족이 반대하면 기증이 이루어지지 않는다.</p>\n<table><tr><th></th><th>기증 동의 비율</th><th>인구 100만 명당 연간 이식 건수</th><th>가족이 반대한 비율</th></tr><tr><th>갑국</th><td>14 %</td><td>25건</td><td>10 %</td></tr><tr><th>을국</th><td>91 %</td><td>30건</td><td>45 %</td></tr></table>","qs":[],"ans":[],"follow":["두 나라의 차이가 기본값 때문인지 가리려면 어떤 조사를 하면 되는가?","기업이 유료 서비스 자동 갱신을 기본값으로 두는 것은 같은 기준으로 어떻게 평가되는가?"],"groups":[{"parts":["(다)의 자료가 (가)의 관점으로는 설명하기 어려운 이유를 말하고, (나)의 관점으로 설명하시오.","(1)의 설명만으로 (나)가 옳다고 결론짓기 전에 확인해야 할 점을 하나 이상 제시하시오."],"ans":["두 나라에서 선택지의 내용과 바꾸는 비용(5분)이 같으므로 (가)에 따르면 동의 비율이 비슷해야 한다. (나)는 기본값의 차이로 14 %와 91 %의 차이를 설명한다. 확인할 점: 두 나라 국민의 실제 의사가 같은지, 제도를 알고 있는 비율, 동의 비율이 실제 기증으로 이어지는지, 다른 조건이 정말 비슷한지."]},{"parts":["정부가 국민에게 이로운 방향으로 기본값을 정하는 정책에 대해 찬성과 반대의 근거를 각각 드시오.","(1)에서 든 근거를 바탕으로, 그러한 정책이 정당하려면 어떤 조건을 갖추어야 하는지 말하시오."],"ans":["찬성: 선택의 자유를 남기면서 사회적으로 바람직한 결과를 얻는다, 어차피 기본값은 누군가 정해야 한다. 반대: 무엇이 이로운지를 정부가 정한다, 모르는 사이에 동의한 것으로 처리된다. 조건의 예: 기본값이 공개되어 있을 것, 바꾸기 쉬울 것, 대다수가 숙고하면 고를 선택일 것. 근거와 조건이 서로 맞물리는지 본다."]},{"parts":["(라)에서 동의 비율은 을국이 갑국의 6배가 넘는데 이식 건수는 1.2배에 그친다. 이 차이를 (나)와 (라)의 자료로 설명하시오.","(1)의 설명에 비추어 정책의 성과를 무엇으로 재야 하는지, 기본값을 바꾸는 정책이 놓칠 수 있는 것은 무엇인지 말하시오."],"ans":["기본값으로 '동의'가 된 사람은 스스로 결정한 적이 없어 가족도 본인의 뜻을 모르고, 그래서 가족의 반대 비율(45 %)이 높다는 설명을 끌어내는지 본다. 동의율(중간 지표)이 아니라 실제 이식 건수(최종 결과)로 재야 하며, 선택을 바꾸는 것과 생각을 바꾸는 것은 다르다는 점을 말하면 높게 평가한다."]},{"parts":["유료 서비스의 '자동 갱신'을 기본값으로 두는 기업의 관행을 (나)로 설명하시오.","(1)의 관행을 문제 2에서 세운 조건으로 평가하시오. 정부의 기본값 정책과 결론이 달라진다면 그 이유는 무엇인가?"],"ans":["(1) 해지하는 수고, 기본값을 권장으로 받아들이는 경향으로 설명하는지 본다. (2) 누구의 이익을 위한 기본값인지, 바꾸기 쉬운지, 공개되어 있는지를 같은 잣대로 따지는지 본다."]}]},{"kind":"연습","src":"연습 2 · 최저 임금과 일자리","scope":"통합사회 · 경제 · 사회·문화","concept":"가격 규제, 노동 시장, 자료 해석과 비교 집단","noAnswer":true,"plain":true,"body":"<p>(가) 임금은 노동의 가격이다. 정부가 임금의 아래 한계를 시장에서 정해지던 수준보다 높게 정하면, 기업은 사람을 덜 쓰려 하고 일하려는 사람은 늘어난다. 그 결과 일자리를 얻지 못하는 사람이 생긴다.</p>\n<p>(나) 일할 곳이 몇 군데뿐인 지역에서는 기업이 임금을 낮게 정할 힘을 가진다. 이런 곳에서는 임금의 아래 한계를 높여도 고용이 줄지 않을 수 있다. 임금이 오르면 그만두는 사람이 줄어 새로 뽑고 가르치는 비용도 준다.</p>\n<p>(다) 이웃한 두 지역 갑과 을은 산업 구조가 비슷하다. 갑 지역만 올해 최저 임금을 올렸다.</p>\n<table><tr><th>음식점 고용 인원(만 명)</th><th>작년</th><th>올해</th></tr><tr><th>갑 지역 (인상)</th><td>6.2</td><td>6.1</td></tr><tr><th>을 지역 (동결)</th><td>6.2</td><td>6.0</td></tr></table><p>(라) 같은 기간의 다른 자료이다.</p>\n<table><tr><th></th><th colspan=\"2\">음식점 직원 1인당 주간 근로 시간</th><th>음식값 변화</th></tr><tr><th></th><th>작년</th><th>올해</th><th></th></tr><tr><th>갑 지역 (인상)</th><td>40시간</td><td>36시간</td><td>+5 %</td></tr><tr><th>을 지역 (동결)</th><td>40시간</td><td>39시간</td><td>+2 %</td></tr></table>","qs":[],"ans":[],"follow":["근로 시간이 줄었다면 결론이 어떻게 달라지는가?","인상 폭이 훨씬 컸다면 같은 결과를 기대할 수 있는가?"],"groups":[{"parts":["갑 지역의 자료만 보고 내릴 수 있는 결론과, 을 지역과 견주어 내릴 수 있는 결론이 어떻게 다른지 설명하시오.","(1)의 비교에 비추어 이 자료는 (가)와 (나) 중 어느 쪽에 더 가까운지 판단하시오."],"ans":["갑만 보면 인상 뒤 고용이 0.1만 명 줄었다. 을과 견주면, 인상이 없던 곳도 0.2만 명 줄었으므로 인상 때문에 줄었다고 보기 어렵고 오히려 덜 줄었다. (나)에 더 가깝다. 비교 집단의 필요성을 스스로 말하는지 본다."]},{"parts":["이 자료만으로 최저 임금 인상의 효과를 단정하기 어려운 이유를 드시오.","(1)의 이유를 없애려면 더 확인해야 할 자료는 무엇인지 제시하시오."],"ans":["두 지역이 다른 면에서도 같은지, 한 해의 변화가 우연인지, 고용 인원 말고 근로 시간·폐업·가격이 어떻게 변했는지, 갑 지역 주민이 을 지역으로 일하러 옮겨 가지 않았는지 등을 든다."]},{"parts":["(라)의 고용 인원과 근로 시간을 함께 써서 두 지역의 전체 노동 시간이 각각 얼마나 변했는지 어림하시오.","(1)의 결과로 문제 1의 결론이 어떻게 달라지는지 말하고, 임금 인상의 부담을 누가 나누어 졌는지 설명하시오."],"ans":["갑: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.2</mn><mo>×</mo><mn>40</mn><mo>=</mo><mn>248</mn></mrow><annotation encoding=\"application/x-tex\">6.2\\times40=248</annotation></semantics></math></span> → <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.1</mn><mo>×</mo><mn>36</mn><mo>≈</mo><mn>220</mn></mrow><annotation encoding=\"application/x-tex\">6.1\\times36\\approx220</annotation></semantics></math></span>(약 11 % 감소), 을: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>248</mn></mrow><annotation encoding=\"application/x-tex\">248</annotation></semantics></math></span> → <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.0</mn><mo>×</mo><mn>39</mn><mo>=</mo><mn>234</mn></mrow><annotation encoding=\"application/x-tex\">6.0\\times39=234</annotation></semantics></math></span>(약 6 % 감소)로, 사람 수로는 보이지 않던 차이가 드러남을 계산하는지 본다. 부담이 근로 시간 단축(노동자), 가격 인상(소비자), 이윤 감소(사업주)로 나뉘었음을 짚고, 무엇을 재느냐에 따라 결론이 달라진다는 점을 말하면 높게 평가한다."]},{"parts":["이 연구의 결론에 반대하는 사람이 제기할 수 있는 가장 강한 문제를 하나 제시하시오.","(1)의 문제 제기에 답하려면 조사를 어떻게 다시 설계해야 하는가? 비교할 지역과 기간을 중심으로 말하시오."],"ans":["(1) 두 지역이 원래 다른 흐름에 있었을 가능성, 한 해만 본 점, 경계를 넘는 이동 등을 드는지 본다. (2) 인상 전 여러 해의 추이가 같았는지 확인, 여러 지역 쌍, 더 긴 기간 등 설계가 (1)의 문제에 맞게 대응하는지 본다."]}]},{"kind":"연습","src":"연습 3 · 어장의 배","scope":"통합사회 · 경제 · 사회·문화","concept":"공유 자원, 개인의 합리성과 사회적 결과, 제도 설계","noAnswer":true,"plain":true,"body":"<p>(가) 누구나 쓸 수 있는 자원은 아무도 아끼지 않는다. 한 사람이 더 쓰는 데서 오는 이익은 그 사람이 모두 갖지만, 자원이 줄어드는 손해는 모두가 나누어 지기 때문이다.</p>\n<p>(나) 자원을 함께 쓰는 사람들이 서로를 알고 오래 같이 살아갈 곳에서는, 스스로 규칙을 만들고 서로 지켜보며 어긴 사람을 제재하는 방식으로 자원을 오래 지켜 온 사례가 많다.</p>\n<p>(다) 어느 마을 앞바다 어장에서 조업하는 배의 수와 한 해 어획량의 관계는 다음과 같다. 배의 크기와 장비는 모두 같다.</p>\n<table><tr><th>배의 수(척)</th><td>10</td><td>20</td><td>30</td><td>40</td></tr><tr><th>전체 어획량(톤)</th><td>100</td><td>160</td><td>180</td><td>160</td></tr></table><p>(라) 배 한 척을 한 해 동안 운영하는 데에는 물고기 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">3</annotation></semantics></math></span>톤어치의 비용이 든다. 한 정책 연구자는 마을 전체가 조업할 수 있는 배의 수를 정한 뒤 그만큼의 조업권을 나누어 주고, 조업권을 서로 사고팔 수 있게 하자고 제안하였다.</p>","qs":[],"ans":[],"follow":["전체 어획량이 가장 많은 30척이 마을에 가장 좋은 선택인가? 배 한 척의 운영비가 5톤어치라면?","외지의 배가 들어오기 시작하면 (나)의 방식은 어떻게 되는가?"],"groups":[{"parts":["(다)의 표에서 배 한 척당 어획량과, 배가 10척 늘 때마다 전체 어획량이 얼마나 변하는지 계산하시오.","(1)의 계산을 이용하여 배가 30척일 때에도 새로 배를 띄우려는 사람이 나오는 이유를 (가)로 설명하시오."],"ans":["척당 어획량은 10, 8, 6, 4톤. 전체는 30척에서 최대이고 40척이 되면 20톤 준다. 그래도 새로 들어오는 사람은 4톤을 얻으므로 들어올 까닭이 있다. 손해(기존 배들의 어획 감소)는 남들이 나누어 진다."]},{"parts":["이 어장을 지키는 방법으로 정부가 배의 수를 제한하는 것, 어장을 나누어 개인 소유로 하는 것, 마을이 스스로 규칙을 정하는 것의 장단점을 비교하시오.","(1)의 비교를 바탕으로 이 마을에 가장 알맞다고 생각하는 방법과 그것이 성공하기 위한 조건을 말하시오."],"ans":["각 방법의 장단(감시 비용, 현지 사정 반영, 공정성, 바다는 나누기 어렵다는 점)을 들고, (나)의 조건(구성원이 정해져 있고 오래 함께 살며 서로 지켜볼 수 있음)이 이 마을에 맞는지 따지는지 본다."]},{"parts":["(다)의 표와 (라)의 비용으로 배의 수에 따른 마을 전체의 순이익을 계산하여, 순이익이 가장 큰 배의 수와 누구나 자유롭게 배를 띄울 때의 결과를 비교하시오.","(라)의 조업권 제도가 (1)의 차이를 줄일 수 있는 이유와, 처음에 조업권을 누구에게 어떻게 나누어 줄지에 따라 생길 수 있는 문제를 말하시오."],"ans":["순이익: 10척 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>70</mn></mrow><annotation encoding=\"application/x-tex\">70</annotation></semantics></math></span>, 20척 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span>, 30척 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90</mn></mrow><annotation encoding=\"application/x-tex\">90</annotation></semantics></math></span>, 40척 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn></mrow><annotation encoding=\"application/x-tex\">40</annotation></semantics></math></span>톤. 가장 좋은 것은 20척인데, 40척일 때에도 척당 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo>−</mo><mn>3</mn><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">4-3=1</annotation></semantics></math></span>톤이 남으므로 자유롭게 두면 배가 계속 늘어 순이익이 거의 사라진다. 조업권은 배의 수를 묶어 두고, 더 잘 잡는 사람이 사서 쓰게 한다. 처음 배분(기존 어민에게 무상, 경매 등)에 따라 이익이 누구에게 가는지, 조업권이 외지 자본에 모일 수 있는지를 짚으면 높게 평가한다."]},{"parts":["출퇴근 시간의 도로 혼잡을 (가)의 틀로 설명하시오. 어장의 무엇이 도로의 무엇에 해당하는가?","어장에서 살펴본 해결 방법 가운데 (1)의 도로 문제에 옮겨 쓸 수 있는 것과 없는 것을 가려 이유를 말하시오."],"ans":["(1) 운전자 한 사람이 얻는 편익은 자기 것이고 늘어난 지체는 모두가 나누어 진다는 대응을 짚는지 본다. (2) 통행료(조업권과 비슷), 차량 수 제한은 옮길 수 있으나, 구성원이 정해져 있지 않아 자율 규칙은 어렵다는 식으로 조건의 차이를 따지는지 본다."]}]},{"kind":"연습","src":"연습 4 · 십만 명의 설문","scope":"통합사회 · 사회·문화","concept":"표본 조사, 대표성, 자료의 신뢰성","noAnswer":true,"plain":true,"body":"<p>(가) 조사에 응한 사람이 많을수록 우연에 의한 오차가 줄어든다. 천 명에게 물은 결과보다 십만 명에게 물은 결과가 전체의 생각에 더 가깝다.</p>\n<p>(나) 조사의 정확성은 몇 명에게 물었는가보다 누구에게 물었는가에 달려 있다. 응답자가 전체를 고르게 닮지 않았다면 아무리 많은 사람에게 물어도 결과는 한쪽으로 치우친다.</p>\n<p>(다) 어느 도시가 도심 차량 통행 제한 정책을 두고 시민의 의견을 물었다.</p>\n<table><tr><th>조사 방법</th><th>응답자 수</th><th>찬성</th></tr><tr><th>시 누리집에서 원하는 사람이 참여</th><td>100,000명</td><td>31 %</td></tr><tr><th>무작위로 고른 전화번호로 조사</th><td>1,000명</td><td>58 %</td></tr></table><p>(라) 누리집 조사 응답자를 연령으로 나누어 보았다.</p>\n<table><tr><th></th><th>청년층</th><th>중년층</th><th>노년층</th></tr><tr><th>누리집 응답자 가운데 비율</th><td>60 %</td><td>30 %</td><td>10 %</td></tr><tr><th>누리집 응답자의 찬성 비율</th><td>20 %</td><td>40 %</td><td>70 %</td></tr><tr><th>이 도시 실제 인구 가운데 비율</th><td>20 %</td><td>40 %</td><td>40 %</td></tr></table>","qs":[],"ans":[],"follow":["누리집 조사 결과는 아무 쓸모가 없는가?","찬성 58 %라는 결과만으로 정책을 시행해도 되는가?"],"groups":[{"parts":["두 조사의 결과가 크게 다른 이유를 (가)와 (나)를 이용하여 설명하시오.","(1)의 설명에 비추어 어느 쪽이 시민 전체의 의견에 더 가까울지 판단하시오."],"ans":["누리집 조사는 응답자가 많아 우연 오차는 작지만, 스스로 참여한 사람들(정책에 강한 불만이 있는 사람, 인터넷을 자주 쓰는 사람)로 치우쳤을 수 있다. 무작위 전화 조사는 수는 적어도 대표성이 높아 전체에 더 가깝다고 본다. (가)가 성립하는 전제(무작위 추출)를 짚는지 본다."]},{"parts":["전화 조사에도 있을 수 있는 한계를 드시오.","(1)의 한계를 고려하여, 지원자가 이 도시의 담당자라면 시민의 의견을 어떻게 확인하고 발표하겠는지 말하시오."],"ans":["전화를 받지 않는 사람, 응답을 거절하는 사람, 질문 문구와 순서의 영향 등을 든다. 조사 방법과 응답률을 함께 공개하고, 방법이 다른 조사를 섞어 평균 내지 않는 등 구체적인 방안을 내는지 본다."]},{"parts":["(라)의 표로 누리집 조사의 전체 찬성 비율 31 %가 어떻게 나왔는지 확인하고, 응답자의 연령 구성을 실제 인구에 맞추어 다시 계산한 찬성 비율을 구하시오.","(1)에서 고친 값이 전화 조사의 58 %와 여전히 다른 이유를 추론하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.6</mn><mo>×</mo><mn>20</mn><mo>+</mo><mn>0.3</mn><mo>×</mo><mn>40</mn><mo>+</mo><mn>0.1</mn><mo>×</mo><mn>70</mn><mo>=</mo><mn>31</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">0.6\\times20+0.3\\times40+0.1\\times70=31\\,\\%</annotation></semantics></math></span>. 인구 비율로 고치면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.2</mn><mo>×</mo><mn>20</mn><mo>+</mo><mn>0.4</mn><mo>×</mo><mn>40</mn><mo>+</mo><mn>0.4</mn><mo>×</mo><mn>70</mn><mo>=</mo><mn>48</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">0.2\\times20+0.4\\times40+0.4\\times70=48\\,\\%</annotation></semantics></math></span>. 연령을 맞추어도 같은 연령 안에서 스스로 참여한 사람은 그렇지 않은 사람과 생각이 다를 수 있다(관심과 불만이 큰 사람이 참여). 보정은 알려진 치우침만 고칠 뿐이라는 점을 말하면 높게 평가한다."]},{"parts":["인터넷 쇼핑몰의 상품 별점에는 이 문제와 같은 구조의 치우침이 어떻게 나타날 수 있는지 설명하시오.","(1)을 고려할 때 소비자가 별점을 볼 때 확인해야 할 것과, 쇼핑몰이 별점을 더 믿을 만하게 만들 방법을 하나씩 제안하시오."],"ans":["(1) 아주 만족했거나 아주 불만인 사람이 주로 평을 남긴다는 점(스스로 참여한 표본)을 짚는지 본다. (2) 평의 수와 분포, 실제 구매자 여부를 확인하는 일, 구매자 가운데 무작위로 평가를 요청하는 방법 등을 내는지 본다."]}]},{"kind":"기출","src":"2026학년도 사회과학","page":"문항집 5~6쪽","scope":"통합사회 · 경제 · 사회·문화","concept":"환경 적응성, 확신, 불확실성, 행동 지연, 판단 오류","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"plain":true,"body":"<p class=\"note2\">제시문은 원문을 요약한 것입니다. 전문은 문항집 5~6쪽에서 확인하세요.</p>\n<p>(가) 뇌는 예측으로 환경에 적응한다. 자기 지식에 대한 확신이 낮으면 새 정보에 민감해져 많이 배우지만, 지나치면 인지 자원을 과하게 쓰고 행동이 늦어진다. 확신이 높으면 빠르게 판단하지만, 과신하면 다른 가능성을 무시해 판단 오류가 는다. 정보의 수집·분석·해석에서 체계적 검증과 편향 제거로 균형을 지켜야 한다.</p>\n<p>(나) 한 필자는 적정 가치를 벗어난 주가 상승은 반드시 하락한다고 단언한다. 회사의 현재 이익과 주가를 견주는 단순한 방식이 최선이며, 지금 첨단 기술 기업의 주가는 이미 고평가되어 있으므로 적정 가치로 돌아올 수밖에 없다고 본다.</p>\n<p>(다) 다른 필자는 미래를 확신할 수 없어 투자를 하지 못한다. 오를 것이라는 뉴스와 내릴 것이라는 뉴스를 매일 접하고, 주변 사람들은 직관으로 투자해 수익을 얻기도 하지만, 아무리 조사해도 결과를 확신할 수 없어 아무 결정도 내리지 못한다.</p>","qs":["(가)를 활용하여 (나)와 (다) 각각에 나타난 판단 과정의 문제점을 설명하고, 그 극복 방안을 제시하시오.","(나)와 (다) 각각의 인지 성향이 사회에 기여할 수 있음을 실제 사례를 들어 설명하시오."],"ans":["(나)의 과신(하나의 모형과 선명한 사례에 기댐)과 (다)의 지나친 민감도(행동 지연)를 (가)의 틀로 짚고, 검증·편향 제거·결정 기준 마련 같은 방안을 내는지 본다. (문항 분석을 바탕으로 정리한 것입니다.)","확신이 강한 성향과 신중한 성향이 각각 쓸모 있는 실제 장면(신속한 결단이 필요한 일, 위험을 살피는 일 등)을 구체적 사례로 드는지 본다. (문항 분석을 바탕으로 정리한 것입니다.)"]},{"kind":"기출","src":"2025학년도 사회과학","page":"문항집 5~6쪽","scope":"통합사회 · 경제 · 사회·문화","concept":"사회·문화 현상, 자기실현적 예언, 사회 불평등, 사회적 소수자","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"plain":true,"body":"<p class=\"note2\">제시문은 원문을 요약한 것입니다. 전문은 2025학년도 문항집 5~6쪽에서 확인하세요.</p>\n<p>(가) 사람 사회에서는 상황에 대한 예측이 사태의 전개에 영향을 준다. 은행이 망한다는 예측이 퍼지면 사람들이 예금을 찾아 튼튼한 은행도 망할 수 있다. 이런 '자기실현적 예언'의 예로, ㉠ 어떤 집단이 열등하고 반사회적이라는 믿음 때문에 공동체에서 배제되면 그들은 실제로 실패하고 반사회적 행동을 하게 된다. 이 악순환을 다스리려면 제도적 개입과 조정이 필요하다.</p>\n<p>(나) 주술사에게 공개적으로 저주받은 사람은 자신의 죽음을 확신하고, 주변 사람들도 그를 이미 죽은 사람처럼 대한다. 모든 유대에서 배제된 그는 끝내 죽음에 이른다. 주술은 주술사, 당사자, 집단 전체의 믿음에 기대어 효력을 낸다.</p>\n<p>(다) 많은 사람이 물가가 오를 것이라 예상하면 소비, 가격, 임금 요구가 함께 올라 실제로 물가가 크게 오른다. 중앙은행이 목표 물가 상승률을 미리 공개하면, 이를 믿는 사람들이 그에 맞추어 행동을 조정하여 실제 물가 상승률이 목표 가까이에서 이루어진다.</p>","qs":["(가)의 '자기실현적 예언'의 관점에서 (나)의 '부두 죽음'과 (다)의 '물가 안정 목표제'를 비교하여 설명하시오.","사회 현상에 들어 있는 '자기실현적 예언'의 속성을 고려할 때, ㉠을 해결하기 위해 교육자, 언론인, 정책 입안자, 연구자, 차별 피해자 집단이 각각 어떤 노력을 할 수 있을지, 이 중 세 집단을 골라 설명하시오."],"ans":["둘 다 집단의 믿음이 결과를 만든다는 공통점과, 하나는 믿음이 파괴적 결과를 낳고 다른 하나는 제도가 믿음을 이용해 안정을 얻는다는 차이를 짚는지 본다. (문항 분석을 바탕으로 정리한 것입니다.)","고른 세 집단의 노력이 '믿음 → 행동 → 결과'의 고리 중 어디를 끊는지 구체적으로 설명하는지 본다. (문항 분석을 바탕으로 정리한 것입니다.)"]}],"mh":[{"kind":"기출","src":"2026학년도 수학 A","page":"문항집 9~10쪽","scope":"수학 · 수학Ⅱ · 확률과 통계","concept":"이산확률변수의 평균과 분산, 이차함수의 최대, 연립이차방정식","body":"<p>민호는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>그램, 영희는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>그램의 금을 가지고 있고, 다음 규칙에 따라 금을 주고받는다.</p>\n<div class=\"box\"><b>규칙</b>\n<p>(가) 실수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mtext> </mtext><mo stretchy=\"false\">(</mo><mn>0</mn><mo>≤</mo><mi>a</mi><mo>≤</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">a\\ (0\\le a\\le 1)</annotation></semantics></math></span>에 대하여 민호가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>그램의 금을 영희에게 준다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>를 <u>투자량</u>이라 한다.</p>\n<p>(나) 실수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mtext> </mtext><mo stretchy=\"false\">(</mo><mn>0</mn><mo>≤</mo><mi>b</mi><mo>≤</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">b\\ (0\\le b\\le 1)</annotation></semantics></math></span>에 대하여 공정한 주사위를 한 번 던져, 영희가 민호에게 금을 준다. 눈의 수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span> 이하이면 투자량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>그램당 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mo>+</mo><mi>b</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2+b)</annotation></semantics></math></span>그램, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">3</annotation></semantics></math></span> 이상이면 투자량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>그램당 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mi>b</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(1-b)</annotation></semantics></math></span>그램을 준다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">b</annotation></semantics></math></span>를 <u>활성도</u>라 한다.</p></div>\n<p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">b</annotation></semantics></math></span>는 주사위를 던지기 전에 다음 중 한 방식으로 정해진다.</p>\n<p>[방식 1] 영희가 먼저 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">b</annotation></semantics></math></span>를 정해 알리면, 민호가 그 값을 알고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>를 정한다.<br>[방식 2] 민호가 먼저 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>를 정해 알리면, 영희가 그 값을 알고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">b</annotation></semantics></math></span>를 정한다.</p>\n<p>시행 결과 민호와 영희가 갖게 되는 금의 그램 수를 각각 확률변수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi></mrow><annotation encoding=\"application/x-tex\">X</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Y</mi></mrow><annotation encoding=\"application/x-tex\">Y</annotation></semantics></math></span>라 하자. 두 사람은 평균을 기대수익, 분산을 위험도로 본다.</p>","qs":["투자량이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>, 활성도가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">b</annotation></semantics></math></span>로 정해졌을 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">E</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E}(X)</annotation></semantics></math></span>와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">V</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{V}(X)</annotation></semantics></math></span>를 구하시오.","영희가 먼저 활성도를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">b</annotation></semantics></math></span>로 정해 알렸다. 민호의 자산 관리지표가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi><mo>=</mo><mi mathvariant=\"normal\">E</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo stretchy=\"false\">)</mo><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi mathvariant=\"normal\">V</mi><mo stretchy=\"false\">(</mo><mi>X</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">U=\\mathrm{E}(X)-\\dfrac12\\mathrm{V}(X)</annotation></semantics></math></span>일 때, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>≤</mo><mi>a</mi><mo>≤</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">0\\le a\\le1</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>를 최대로 하는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>의 값(민호의 최적 투자량)을 구하시오.","민호가 먼저 투자량을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>로 정해 알렸다. 영희의 자산 관리지표가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi><mo>=</mo><mi mathvariant=\"normal\">E</mi><mo stretchy=\"false\">(</mo><mi>Y</mi><mo stretchy=\"false\">)</mo><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi mathvariant=\"normal\">V</mi><mo stretchy=\"false\">(</mo><mi>Y</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">W=\\mathrm{E}(Y)-\\dfrac12\\mathrm{V}(Y)</annotation></semantics></math></span>일 때, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>≤</mo><mi>b</mi><mo>≤</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">0\\le b\\le1</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>를 최대로 하는 <span class=\"katex\"><math xmlns=\"http://
