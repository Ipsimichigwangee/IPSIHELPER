an>과 막대에서 소모되는 전력 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">P_2</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>이 포함된 식으로 나타내시오.","레일의 간격이 위쪽에서는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>이지만 아래로 갈수록 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>보다 좁아지도록 바꾸었다. 이 레일에서도 막대가 일정한 속력으로 내려갈 수 있는지 정성적으로 설명하시오. (레일은 충분히 길다.)","1-2의 장치에서 전류계 대신 파란색 발광 다이오드를 연결하고, 막대 대신 너비 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>인 ㄷ자 도선을 레일에 걸쳐 회전축 둘레로 일정한 각속도로 회전시켰다. 파란색 발광 다이오드는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span>초 동안 켜지고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">20</annotation></semantics></math></span>초 동안 꺼지기를 되풀이했다(주기 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>24</mn></mrow><annotation encoding=\"application/x-tex\">24</annotation></semantics></math></span>초). 초록색 발광 다이오드로 바꾸고 같은 각속도로 회전시키면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>24</mn></mrow><annotation encoding=\"application/x-tex\">24</annotation></semantics></math></span>초마다 빛을 내는 시간은 몇 초인가? 토막글 ②, ③을 참고하시오. (다이오드의 내부 저항은 무시하고, 빛의 파장은 파란색 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>320</mn><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">320\\sqrt2</annotation></semantics></math></span> nm, 초록색 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>320</mn><msqrt><mn>3</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">320\\sqrt3</annotation></semantics></math></span> nm로 한다.)"],"ans":["여러 힘이 합성될 때 힘의 벡터로 알짜힘을 구하고, 뉴턴 운동 법칙으로 물체의 운동을 정량적으로 예측할 수 있는지 본다.","자기 선속이 변할 때 회로에 유도되는 기전력의 크기를 구하고, 알짜힘과 운동을 정량적으로 예측하며, 저항에서 소모되는 전기 에너지를 구할 수 있는지 본다.","유도 기전력의 크기와 힘의 합성을 바탕으로 물체의 운동을 예측할 수 있는지 본다.","유도 기전력의 크기를 구하고, 빛의 파장과 에너지의 관계와 p-n 접합 다이오드의 원리를 이해하는지 본다."]},{"kind":"기출","src":"2026학년도 물리학 문제 2","page":"문항집 33~38쪽","scope":"물리학Ⅰ · 물리학Ⅱ","concept":"등가 원리, 등속 원운동, 등가속도 직선 운동, 볼록 렌즈","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"qnum":2,"body":"<p>길이와 너비가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>인 수레가 반지름 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>인 마찰 없는 원형 레일을 따라 속력 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>로 등속 원운동을 한다. 수레 바닥에는 원형 레일과 항상 수직인 직선 선로가 있고, 질량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>이고 크기를 무시할 수 있는 물체가 선로의 중앙에 고정되어 있다. 수레와 물체의 총질량은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>이다. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>보다 매우 크고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>보다 매우 크다.)</p><figure><svg viewBox=\"0 0 380 200\" role=\"img\" aria-label=\"원형 레일을 도는 수레와 수레 내부의 직선 선로\">\n<circle class=\"ax\" cx=\"90\" cy=\"100\" r=\"70\"/><circle class=\"pt\" cx=\"90\" cy=\"100\" r=\"3\"/><line class=\"dash\" x1=\"90\" y1=\"100\" x2=\"40\" y2=\"50\"/><text x=\"52\" y=\"82\">R</text><text x=\"96\" y=\"116\">O</text>\n<rect class=\"cell on\" x=\"150\" y=\"88\" width=\"22\" height=\"22\"/><text x=\"60\" y=\"192\">수레 M, 속력 v</text>\n<line class=\"dash\" x1=\"172\" y1=\"88\" x2=\"230\" y2=\"30\"/><line class=\"dash\" x1=\"172\" y1=\"110\" x2=\"230\" y2=\"170\"/>\n<rect class=\"bub\" x=\"230\" y=\"30\" width=\"140\" height=\"140\"/><line class=\"ax\" x1=\"230\" y1=\"100\" x2=\"370\" y2=\"100\"/><rect class=\"pt\" x=\"294\" y=\"92\" width=\"12\" height=\"16\"/><text x=\"290\" y=\"124\">m</text>\n<line class=\"tk\" x1=\"230\" y1=\"20\" x2=\"370\" y2=\"20\"/><text class=\"c\" x=\"300\" y=\"16\">d</text><text x=\"236\" y=\"92\">직선 선로</text><text x=\"256\" y=\"186\">수레 안 (위에서 본 모습)</text>\n</svg><figcaption>[그림] 직선 선로는 원형 레일에 항상 수직이다 (레일의 지름 방향)</figcaption></figure>\n<div class=\"box\"><b>토막글 ④ 수직 항력과 운동 마찰력</b><p>수직 항력 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>은 물체가 닿아 있는 면이 물체를 면에 수직인 방향으로 미는 힘이다. 운동 마찰력은 물체가 움직이는 동안 운동 반대 방향으로 작용하며 크기는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">\\mu N</annotation></semantics></math></span>이다(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>: 운동 마찰 계수).</p></div>","qs":["원형 레일을 무중력 공간에 설치하였다. 고정이 풀린 물체가 마찰 없는 직선 선로를 따라 움직이기 시작했다. 물체가 수레 벽과 탄성 충돌한다고 할 때, 수레가 한 바퀴 도는 동안 물체가 벽과 충돌하는 횟수를 구하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>10000</mn><msup><mi>π</mi><mn>2</mn></msup></mfrac></mstyle><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">R=\\dfrac{10000}{\\pi^2}d</annotation></semantics></math></span>이고, 충돌해도 수레는 등속 원운동을 계속한다.)","물체 대신 질량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>, 초점 거리 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>8</mn></mfrac></mstyle><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">f=\\dfrac18d</annotation></semantics></math></span>인 얇은 볼록 렌즈를 선로에 올렸다. 렌즈는 레일 중심에 가까운 쪽 벽과 용수철(원래 길이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">\\dfrac12d</annotation></semantics></math></span>, 용수철 상수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>)로 이어져 있고 마찰 없이 선로를 따라 움직일 수 있다. 맞은편 벽에는 크기 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>인 인형이 붙어 있다. 수레가 등속 원운동을 하는 동안 수레 안의 관찰자가 보기에 렌즈는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>16</mn></mfrac></mstyle><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">x=+\\dfrac3{16}d</annotation></semantics></math></span>에 정지해 있었다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t=0</annotation></semantics></math></span>에 수레가 레일을 벗어나 접선 방향으로 등속 직선 운동을 시작했다.<figure><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"수레 안의 용수철에 연결된 볼록 렌즈와 벽에 붙은 인형\">\n<rect class=\"bub\" x=\"60\" y=\"30\" width=\"240\" height=\"80\"/><line class=\"dash\" x1=\"60\" y1=\"70\" x2=\"300\" y2=\"70\"/>\n<polyline class=\"ln\" points=\"60,70 75,60 90,80 105,60 120,80 135,60 150,80 165,60 180,80 195,60 210,80 225,70\"/>\n<ellipse class=\"cell on\" cx=\"225\" cy=\"70\" rx=\"6\" ry=\"28\"/><rect class=\"pt\" x=\"294\" y=\"56\" width=\"6\" height=\"14\"/>\n<line class=\"dash\" x1=\"180\" y1=\"24\" x2=\"180\" y2=\"116\"/><line class=\"dash\" x1=\"225\" y1=\"24\" x2=\"225\" y2=\"116\"/><line class=\"dash\" x1=\"135\" y1=\"24\" x2=\"135\" y2=\"116\"/>\n<text class=\"c s\" x=\"180\" y=\"130\">x = 0</text><text class=\"c s\" x=\"228\" y=\"130\">+3d/16</text><text class=\"c s\" x=\"132\" y=\"130\">−3d/16</text>\n<text x=\"66\" y=\"48\">용수철 k</text><text x=\"232\" y=\"48\">렌즈 m</text><text x=\"304\" y=\"60\">인형(크기 h)</text><text x=\"6\" y=\"144\">← 레일 중심 쪽</text><text class=\"c\" x=\"180\" y=\"20\">d</text>\n</svg><figcaption>[그림] 수레 안의 모습. 용수철은 레일 중심에 가까운 쪽 벽과 렌즈를 잇고, 인형은 맞은편 벽에 붙어 있다</figcaption></figure>(1) <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mo separator=\"true\">,</mo><mi>v</mi><mo separator=\"true\">,</mo><mi>d</mi><mo separator=\"true\">,</mo><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">m,v,d,R</annotation></semantics></math></span>로 나타내시오.<br>(2) 렌즈가 인형에서 가장 멀 때와 가장 가까울 때 생기는 인형의 상의 위치 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mtext>far</mtext></msub></mrow><annotation encoding=\"application/x-tex\">x_{\\text{far}}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mtext>near</mtext></msub></mrow><annotation encoding=\"application/x-tex\">x_{\\text{near}}</annotation></semantics></math></span>를 구하고, 각각의 배율과 상의 종류를 설명하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">x=0</annotation></semantics></math></span> 기준)<br>(3) 인형 대신 광축에서 높이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>인 곳에 레이저를 달아 광축과 평행하게 렌즈에 비춘다. 용수철이 달린 벽의 스크린에 레이저 빛이 맺히는 점이 광축에서 떨어진 거리 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span>의 범위를 구하시오.","원형 레일을 중력장 안에 놓았다(중력은 레일이 놓인 평면에 수직, 중력 가속도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>). 수레를 레일 안쪽으로 기울어진 경사면(경사각 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>45</mn><mo>∘</mo></msup></mrow><annotation encoding=\"application/x-tex\">45^\\circ</annotation></semantics></math></span>)을 가진 것으로 바꾸고, 경사면에 마찰이 있는 직선 선로를 놓았다. 수레는 일정한 속력 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>로 돌고 있다. 선로 중앙에 고정된 질량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>인 물체가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t=0</annotation></semantics></math></span>에 풀려 움직이기 시작했다. 이 순간 수레 안의 관찰자가 측정한 물체의 가속도의 크기와 방향을 구하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msup><mi>v</mi><mn>2</mn></msup><mrow><mn>4</mn><mi>g</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">R=\\dfrac{v^2}{4g}</annotation></semantics></math></span>, 운동 마찰 계수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>5</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\mu=\\dfrac15</annotation></semantics></math></span>, 토막글 ④ 참고)","2-3의 경사면 양 끝에 벽을 세웠다. 물체는 벽과 탄성 충돌한다.<br>(1) 물체의 속력–시간 그래프를 개략적으로 그리고 설명하시오.<br>(2) 물체가 벽에 다섯 번 충돌할 때까지의 총 이동 거리는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>의 몇 배인가?"],"ans":["등속 원운동의 구심력을 설명하고, 가속 좌표계와 등가 원리로 원심 가속도를 설명하여 물체의 운동을 정량적으로 계산할 수 있는지 본다.","힘의 평형으로 물체에 작용하는 힘을 계산하고, 용수철에 매단 물체의 운동으로 렌즈의 위치를 구하며, 볼록 렌즈에서 초점과 상의 관계, 배율을 정량적으로 구할 수 있는지 본다.","빗면에서 여러 힘이 합성될 때 알짜힘을 구해 물체의 가속도를 정량적으로 예측할 수 있는지 본다.","등가속도 직선 운동의 이동 거리를 계산하고, 1차원 충돌 전후의 속력 변화를 정량적으로 예측할 수 있는지 본다."]}],"chem":[{"kind":"연습","src":"연습 1 · 주사기 속 기체의 색","scope":"화학Ⅰ · 화학Ⅱ","concept":"화학 평형, 평형 상수, 반응 지수, 르샤틀리에 원리, 온도와 평형 상수, 생활 속 평형","body":"<p>사산화 이질소(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{N_2O_4}</annotation></semantics></math></span>)는 무색 기체이고 이산화 질소(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{NO_2}</annotation></semantics></math></span>)는 적갈색 기체이다. 두 기체는 다음과 같이 평형을 이루며, 정반응은 흡열 반응이다.</p>\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mrow><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></mrow><mo stretchy=\"false\">(</mo><mi>g</mi><mo stretchy=\"false\">)</mo><mo>⇌</mo><mn>2</mn><mtext> </mtext><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><mo stretchy=\"false\">(</mo><mi>g</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{N_2O_4}(g)\\rightleftharpoons 2\\,\\mathrm{NO_2}(g)</annotation></semantics></math></span>\n<p>일정한 온도에서 부피가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">L</mi></mrow><annotation encoding=\"application/x-tex\">1\\ \\mathrm{L}</annotation></semantics></math></span>인 용기에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{N_2O_4}</annotation></semantics></math></span> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.0</mn></mrow><annotation encoding=\"application/x-tex\">1.0</annotation></semantics></math></span> mol을 넣었더니, 평형에 도달했을 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{NO_2}</annotation></semantics></math></span>가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.40</mn></mrow><annotation encoding=\"application/x-tex\">0.40</annotation></semantics></math></span> mol 들어 있었다.</p><figure><svg viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"기체가 든 주사기의 피스톤을 눌러 부피를 줄이는 모습\">\n<rect class=\"bub\" x=\"60\" y=\"20\" width=\"200\" height=\"34\" rx=\"3\"/><rect class=\"sea\" x=\"62\" y=\"22\" width=\"150\" height=\"30\"/><rect class=\"pt\" x=\"212\" y=\"21\" width=\"8\" height=\"32\"/><line class=\"ax\" x1=\"220\" y1=\"37\" x2=\"300\" y2=\"37\"/><line class=\"ax\" x1=\"300\" y1=\"25\" x2=\"300\" y2=\"49\"/><line class=\"ax\" x1=\"40\" y1=\"37\" x2=\"60\" y2=\"37\"/><text x=\"62\" y=\"70\">(가) 누르기 전</text><rect class=\"bub\" x=\"60\" y=\"86\" width=\"200\" height=\"34\" rx=\"3\"/><rect class=\"sand\" x=\"62\" y=\"88\" width=\"90\" height=\"30\"/><rect class=\"pt\" x=\"152\" y=\"87\" width=\"8\" height=\"32\"/><line class=\"ax\" x1=\"160\" y1=\"103\" x2=\"240\" y2=\"103\"/><line class=\"ax\" x1=\"240\" y1=\"91\" x2=\"240\" y2=\"115\"/><line class=\"ax\" x1=\"40\" y1=\"103\" x2=\"60\" y2=\"103\"/><text x=\"62\" y=\"136\">(나) 누른 직후</text>\n<text x=\"100\" y=\"42\">N₂O₄ + NO₂</text>\n</svg><figcaption>[그림] 끝을 막은 주사기 속의 혼합 기체. 피스톤을 빠르게 눌러 부피를 줄인다</figcaption></figure><div class=\"box\"><b>자료 · 온도와 평형 상수</b><p>(가) 온도를 높였더니 이 반응의 평형 상수가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.80</mn></mrow><annotation encoding=\"application/x-tex\">0.80</annotation></semantics></math></span>이 되었다.</p><p>(나) 탄산음료 병 속에서는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><mo stretchy=\"false\">(</mo><mi>g</mi><mo stretchy=\"false\">)</mo><mo>⇌</mo><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><mo stretchy=\"false\">(</mo><mi>a</mi><mi>q</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CO_2}(g)\\rightleftharpoons\\mathrm{CO_2}(aq)</annotation></semantics></math></span>의 평형이 이루어져 있다. 이산화 탄소가 물에 녹는 과정은 발열 과정이다.</p></div>","qs":[],"ans":[],"follow":["문제 1의 (2)에서 농도가 줄었는데도 \"정반응 쪽으로 이동했다\"고 말하는 까닭은?","반응에 참여하지 않는 기체를 부피 변화 없이 넣으면 평형은 어떻게 되는가?"],"groups":[{"parts":["평형 상태에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{N_2O_4}</annotation></semantics></math></span>의 농도와 이 온도에서의 평형 상수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>를 구하시오.","온도를 그대로 두고 용기의 부피를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mtext> </mtext><mi mathvariant=\"normal\">L</mi></mrow><annotation encoding=\"application/x-tex\">2\\ \\mathrm{L}</annotation></semantics></math></span>로 늘렸다. 늘린 직후의 반응 지수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>를 구하여 반응이 어느 쪽으로 진행하는지 판단하고, 새로운 평형에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{NO_2}</annotation></semantics></math></span>의 농도를 구하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>6.56</mn></msqrt><mo>≈</mo><mn>2.56</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt{6.56}\\approx2.56</annotation></semantics></math></span>)"],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{NO_2}</annotation></semantics></math></span> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.40</mn></mrow><annotation encoding=\"application/x-tex\">0.40</annotation></semantics></math></span> mol이 생기려면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{N_2O_4}</annotation></semantics></math></span> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.20</mn></mrow><annotation encoding=\"application/x-tex\">0.20</annotation></semantics></math></span> mol이 반응한다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">[</mo><mrow><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></mrow><mo stretchy=\"false\">]</mo><mo>=</mo><mn>0.80</mn><mtext> </mtext><mi mathvariant=\"normal\">M</mi></mrow><annotation encoding=\"application/x-tex\">[\\mathrm{N_2O_4}]=0.80\\ \\mathrm M</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mn>0.40</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mn>0.80</mn></mfrac></mstyle><mo>=</mo><mn>0.20</mn></mrow><annotation encoding=\"application/x-tex\">K=\\dfrac{(0.40)^2}{0.80}=0.20</annotation></semantics></math></span>.","직후 농도는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.40</mn></mrow><annotation encoding=\"application/x-tex\">0.40</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.20</mn><mtext> </mtext><mi mathvariant=\"normal\">M</mi></mrow><annotation encoding=\"application/x-tex\">0.20\\ \\mathrm M</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mn>0.20</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mn>0.40</mn></mfrac></mstyle><mo>=</mo><mn>0.10</mn><mo>&lt;</mo><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">Q=\\dfrac{(0.20)^2}{0.40}=0.10&lt;K</annotation></semantics></math></span>, 정반응이 진행한다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{N_2O_4}</annotation></semantics></math></span>가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span> mol 더 반응하면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mn>0.40</mn><mo>+</mo><mn>2</mn><mi>y</mi><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mrow><mn>2</mn><mo stretchy=\"false\">(</mo><mn>0.80</mn><mo>−</mo><mi>y</mi><mo stretchy=\"false\">)</mo></mrow></mfrac></mstyle><mo>=</mo><mn>0.20</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{(0.40+2y)^2}{2(0.80-y)}=0.20</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>y</mi><mo>−</mo><mn>0.16</mn><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">4y^2+2y-0.16=0</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>≈</mo><mn>0.07</mn></mrow><annotation encoding=\"application/x-tex\">y\\approx0.07</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{NO_2}</annotation></semantics></math></span>는 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.54</mn></mrow><annotation encoding=\"application/x-tex\">0.54</annotation></semantics></math></span> mol, 농도는 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.27</mn><mtext> </mtext><mi mathvariant=\"normal\">M</mi></mrow><annotation encoding=\"application/x-tex\">0.27\\ \\mathrm M</annotation></semantics></math></span>. 분자 수는 늘었지만 농도는 처음(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.40</mn><mtext> </mtext><mi mathvariant=\"normal\">M</mi></mrow><annotation encoding=\"application/x-tex\">0.40\\ \\mathrm M</annotation></semantics></math></span>)보다 작다."]},{"parts":["그림과 같이 평형 상태의 혼합 기체가 든 주사기의 피스톤을 빠르게 누르면, 기체의 색이 누른 직후 진해졌다가 시간이 지나면서 조금 옅어진다. 두 단계의 색 변화를 각각 설명하시오.","부피를 그대로 두고 이 용기를 따뜻한 물에 담그면 기체의 색과 평형 상수는 각각 어떻게 되는가?"],"ans":["누른 직후에는 부피가 줄어 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{NO_2}</annotation></semantics></math></span>의 농도가 커지므로 색이 진해진다(평형 이동과 무관). 이때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mo>&gt;</mo><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">Q&gt;K</annotation></semantics></math></span>가 되어 기체 분자 수가 줄어드는 역반응이 진행하고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{NO_2}</annotation></semantics></math></span>가 줄어 색이 조금 옅어진다. 그래도 누르기 전보다는 진하다.","정반응이 흡열 반응이므로 온도가 높아지면 평형이 정반응 쪽으로 이동하여 색이 진해진다. 평형 상수는 온도에 따라 달라지며 이 경우 커진다."]},{"parts":["(가)의 온도에서 부피가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> L인 용기에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{N_2O_4}</annotation></semantics></math></span> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.0</mn></mrow><annotation encoding=\"application/x-tex\">1.0</annotation></semantics></math></span> mol을 넣었을 때 평형에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{NO_2}</annotation></semantics></math></span>의 양을 구하고, 처음 온도에서의 값(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.40</mn></mrow><annotation encoding=\"application/x-tex\">0.40</annotation></semantics></math></span> mol)과 비교하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>13.44</mn></msqrt><mo>≈</mo><mn>3.67</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt{13.44}\\approx3.67</annotation></semantics></math></span>)","(1)의 결과를 바탕으로, 온도를 높였을 때 평형 상수가 커진 것과 정반응이 흡열 반응이라는 사실이 어떻게 이어지는지 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>x</mi><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mrow><mn>1</mn><mo>−</mo><mi>x</mi></mrow></mfrac></mstyle><mo>=</mo><mn>0.80</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{(2x)^2}{1-x}=0.80</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>0.8</mn><mi>x</mi><mo>−</mo><mn>0.8</mn><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">4x^2+0.8x-0.8=0</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>≈</mo><mn>0.36</mn></mrow><annotation encoding=\"application/x-tex\">x\\approx0.36</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{NO_2}</annotation></semantics></math></span>는 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.72</mn></mrow><annotation encoding=\"application/x-tex\">0.72</annotation></semantics></math></span> mol로 거의 두 배. 온도를 높이면 평형은 열을 흡수하는 쪽으로 이동하고, 그 쪽이 정반응이므로 생성물이 늘어 평형 상수가 커진다."]},{"parts":["(나)를 이용하여 탄산음료의 뚜껑을 열면 기포가 올라오는 현상과, 차가운 음료보다 미지근한 음료에서 김이 더 빨리 빠지는 현상을 각각 평형의 이동으로 설명하시오.","뚜껑을 다시 닫아 두면 어떻게 되는지도 말하시오."],"ans":["뚜껑을 열면 병 속 기체의 압력(이산화 탄소의 부분 압력)이 낮아져 평형이 기체가 생기는 쪽으로 이동한다. 녹는 과정이 발열이므로 온도가 높으면 평형이 녹지 않는 쪽으로 이동하고, 반응도 빨라진다. 뚜껑을 닫으면 빠져나온 기체가 병 속에 쌓여 압력이 다시 높아지고 새로운 평형에 이르러 더 이상 빠지지 않는다. 다만 녹아 있는 양은 처음보다 적다."]}]},{"kind":"연습","src":"연습 2 · 식초 속 아세트산의 양","scope":"화학Ⅰ · 화학Ⅱ","concept":"몰 농도, 중화 적정, 지시약, 실험 오차, 완충 용액, 이온화 상수, 지시약의 변색 범위","body":"<p>시판 식초에 들어 있는 아세트산(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CH_3COOH}</annotation></semantics></math></span>, 분자량 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>60</mn></mrow><annotation encoding=\"application/x-tex\">60</annotation></semantics></math></span>)의 양을 알아보려고 다음 실험을 하였다.</p>\n<div class=\"box\"><p>(가) 식초 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span> mL를 취하여 증류수를 넣어 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span> mL로 만든다.</p><p>(나) (가)의 용액 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">20</annotation></semantics></math></span> mL를 삼각 플라스크에 넣고 지시약을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mo>∼</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">2\\sim3</annotation></semantics></math></span>방울 넣는다.</p><p>(다) 뷰렛에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.10</mn></mrow><annotation encoding=\"application/x-tex\">0.10</annotation></semantics></math></span> M 수산화 나트륨 수용액을 넣고 (나)의 용액에 조금씩 떨어뜨린다. 용액의 색이 변한 순간까지 넣은 부피는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>18.0</mn></mrow><annotation encoding=\"application/x-tex\">18.0</annotation></semantics></math></span> mL였다.</p></div><div class=\"box\"><b>자료 · 적정 중의 pH</b><p>(다)의 과정에서 넣어 준 수산화 나트륨 수용액의 부피에 따른 삼각 플라스크 속 용액의 pH를 측정하였다. 지시약 메틸 오렌지는 pH <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.1</mn><mo>∼</mo><mn>4.4</mn></mrow><annotation encoding=\"application/x-tex\">3.1\\sim4.4</annotation></semantics></math></span>에서, 페놀프탈레인은 pH <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8.2</mn><mo>∼</mo><mn>10.0</mn></mrow><annotation encoding=\"application/x-tex\">8.2\\sim10.0</annotation></semantics></math></span>에서 색이 변한다.</p>\n<table><tr><th>넣은 부피(mL)</th><td>0</td><td>9.0</td><td>17.0</td><td>18.0</td><td>19.0</td></tr><tr><th>pH</th><td>2.9</td><td>4.7</td><td>6.0</td><td>8.7</td><td>11.4</td></tr></table></div>","qs":[],"ans":[],"follow":["실험 (가)에서 식초를 묽히는 까닭은?","삼각 플라스크에 물기가 남아 있었다면 결과에 영향을 주는가?"],"groups":[{"parts":["묽히기 전 식초 속 아세트산의 몰 농도를 구하시오.","식초의 밀도를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.0</mn></mrow><annotation encoding=\"application/x-tex\">1.0</annotation></semantics></math></span> g/mL라 할 때 아세트산의 질량 퍼센트 농도를 구하시오."],"ans":["묽힌 용액: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.10</mn><mo>×</mo><mn>18.0</mn><mo>=</mo><mi>M</mi><mo>×</mo><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">0.10\\times18.0=M\\times20</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.090</mn></mrow><annotation encoding=\"application/x-tex\">0.090</annotation></semantics></math></span> M. 10배 묽혔으므로 식초는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.90</mn></mrow><annotation encoding=\"application/x-tex\">0.90</annotation></semantics></math></span> M.","식초 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> L에 아세트산 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.90</mn><mo>×</mo><mn>60</mn><mo>=</mo><mn>54</mn></mrow><annotation encoding=\"application/x-tex\">0.90\\times60=54</annotation></semantics></math></span> g, 식초 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> L는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1000</mn></mrow><annotation encoding=\"application/x-tex\">1000</annotation></semantics></math></span> g이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5.4</mn><mtext> </mtext><mi mathvariant=\"normal\">%</mi></mrow><annotation encoding=\"application/x-tex\">5.4\\,\\%</annotation></semantics></math></span>."]},{"parts":["이 실험에 알맞은 지시약은 산성에서 색이 변하는 것과 염기성에서 색이 변하는 것 중 어느 쪽인가? 이유를 설명하시오.","뷰렛을 증류수로만 씻고 물기가 남은 채로 수산화 나트륨 수용액을 넣었다면, 구한 농도는 실제보다 큰가 작은가?"],"ans":["약산과 강염기의 중화에서는 중화점에서 생긴 아세트산 이온이 물과 반응해 용액이 약한 염기성을 띤다. 따라서 염기성 쪽에서 색이 변하는 지시약(예: 페놀프탈레인)이 알맞다.","뷰렛 속 수산화 나트륨 수용액이 묽어져 중화에 더 많은 부피가 든다. 계산에서는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.10</mn></mrow><annotation encoding=\"application/x-tex\">0.10</annotation></semantics></math></span> M로 보므로 아세트산의 농도가 실제보다 크게 나온다."]},{"parts":["넣은 부피가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9.0</mn></mrow><annotation encoding=\"application/x-tex\">9.0</annotation></semantics></math></span> mL 부근일 때에는 수산화 나트륨 수용액을 더 넣어도 pH가 조금밖에 변하지 않는다. 이때 용액 속에 주로 들어 있는 입자를 말하고 그 이유를 설명하시오.","또 이 자료로 아세트산의 이온화 상수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mi>a</mi></msub></mrow><annotation encoding=\"application/x-tex\">K_a</annotation></semantics></math></span>를 어림하시오. (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>10</mn><mrow><mo>−</mo><mn>4.7</mn></mrow></msup><mo>≈</mo><mn>2</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>5</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">10^{-4.7}\\approx2\\times10^{-5}</annotation></semantics></math></span>)"],"ans":["절반이 중화된 지점으로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CH_3COOH}</annotation></semantics></math></span>와 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">O</mi><msup><mi mathvariant=\"normal\">O</mi><mo>−</mo></msup></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CH_3COO^-}</annotation></semantics></math></span>이 거의 같은 양 들어 있다. 넣어 준 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">O</mi><msup><mi mathvariant=\"normal\">H</mi><mo>−</mo></msup></mrow><annotation encoding=\"application/x-tex\">\\mathrm{OH^-}</annotation></semantics></math></span>은 남아 있는 아세트산과 반응해 없어지므로 pH가 잘 변하지 않는다(완충 용액). 두 농도가 같으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mi>a</mi></msub><mo>=</mo><mo stretchy=\"false\">[</mo><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></mrow><mo stretchy=\"false\">]</mo><mo>=</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>4.7</mn></mrow></msup><mo>≈</mo><mn>2</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>5</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">K_a=[\\mathrm{H_3O^+}]=10^{-4.7}\\approx2\\times10^{-5}</annotation></semantics></math></span>."]},{"parts":["중화점(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>18.0</mn></mrow><annotation encoding=\"application/x-tex\">18.0</annotation></semantics></math></span> mL)의 pH가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">7</annotation></semantics></math></span>이 아니라 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8.7</mn></mrow><annotation encoding=\"application/x-tex\">8.7</annotation></semantics></math></span>인 이유를 설명하시오.","이 실험에서 지시약으로 메틸 오렌지를 썼다면 색이 변하는 것은 대략 어느 부피 구간이며, 그 결과 구한 식초의 농도는 어떻게 되는지 자료로 판단하시오."],"ans":["중화점에는 아세트산 나트륨만 있고, 아세트산 이온이 물과 반응해 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">O</mi><msup><mi mathvariant=\"normal\">H</mi><mo>−</mo></msup></mrow><annotation encoding=\"application/x-tex\">\\mathrm{OH^-}</annotation></semantics></math></span>을 만든다. 메틸 오렌지는 pH <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.1</mn><mo>∼</mo><mn>4.4</mn></mrow><annotation encoding=\"application/x-tex\">3.1\\sim4.4</annotation></semantics></math></span>에서 변하므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9.0</mn></mrow><annotation encoding=\"application/x-tex\">9.0</annotation></semantics></math></span> mL에 이르기도 전에(pH <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4.7</mn></mrow><annotation encoding=\"application/x-tex\">4.7</annotation></semantics></math></span>보다 앞서) 색이 변한다. 실제 중화점의 절반에도 못 미치는 부피에서 멈추게 되어 농도가 절반 이하로 작게 구해진다."]}]},{"kind":"연습","src":"연습 3 · 물은 왜 100 ℃에서 끓는가","scope":"화학Ⅰ · 화학Ⅱ","concept":"분자 구조와 극성, 전기 음성도, 분산력, 수소 결합, 분자 구조와 물질의 성질 예측","body":"<p>그림은 14족 원소와 16족 원소의 수소 화합물의 끓는점을 주기에 따라 나타낸 것이다.</p><figure><svg viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"14족과 16족 수소 화합물의 끓는점 그래프\">\n<line class=\"ax\" x1=\"60\" y1=\"205\" x2=\"330\" y2=\"205\"/><line class=\"ax\" x1=\"60\" y1=\"210\" x2=\"60\" y2=\"12\"/>\n<line class=\"grid1\" x1=\"60\" y1=\"193\" x2=\"320\" y2=\"193\"/><text x=\"30\" y=\"197\">-150</text><line class=\"grid1\" x1=\"60\" y1=\"168\" x2=\"320\" y2=\"168\"/><text x=\"30\" y=\"172\">-100</text><line class=\"grid1\" x1=\"60\" y1=\"143\" x2=\"320\" y2=\"143\"/><text x=\"30\" y=\"147\">-50</text><line class=\"grid1\" x1=\"60\" y1=\"118\" x2=\"320\" y2=\"118\"/><text x=\"30\" y=\"122\">0</text><line class=\"grid1\" x1=\"60\" y1=\"93\" x2=\"320\" y2=\"93\"/><text x=\"30\" y=\"97\">50</text><line class=\"grid1\" x1=\"60\" y1=\"68\" x2=\"320\" y2=\"68\"/><text x=\"30\" y=\"72\">100</text>\n<polyline class=\"ln2\" points=\"100,199 165,174 230,162 295,144\"/><polyline class=\"ln\" points=\"100,68 165,148 230,138.5 295,119\"/>\n<circle class=\"pt\" cx=\"100\" cy=\"199\" r=\"3\"/><circle class=\"pt\" cx=\"100\" cy=\"68\" r=\"3\"/><text class=\"s\" x=\"108\" y=\"211\">CH₄</text><text class=\"c s\" x=\"100\" y=\"60\">H₂O</text><text class=\"c s\" x=\"100\" y=\"220\">2주기</text><circle class=\"pt\" cx=\"165\" cy=\"174\" r=\"3\"/><circle class=\"pt\" cx=\"165\" cy=\"148\" r=\"3\"/><text class=\"s\" x=\"173\" y=\"186\">SiH₄</text><text class=\"c s\" x=\"165\" y=\"140\">H₂S</text><text class=\"c s\" x=\"165\" y=\"220\">3주기</text><circle class=\"pt\" cx=\"230\" cy=\"162\" r=\"3\"/><circle class=\"pt\" cx=\"230\" cy=\"138.5\" r=\"3\"/><text class=\"s\" x=\"238\" y=\"174\">GeH₄</text><text class=\"c s\" x=\"230\" y=\"130.5\">H₂Se</text><text class=\"c s\" x=\"230\" y=\"220\">4주기</text><circle class=\"pt\" cx=\"295\" cy=\"144\" r=\"3\"/><circle class=\"pt\" cx=\"295\" cy=\"119\" r=\"3\"/><text class=\"s\" x=\"303\" y=\"156\">SnH₄</text><text class=\"c s\" x=\"295\" y=\"111\">H₂Te</text><text class=\"c s\" x=\"295\" y=\"220\">5주기</text>\n<text x=\"6\" y=\"12\">끓는점(℃)</text>\n</svg><figcaption>[그림] 14족(점선)과 16족(실선) 원소의 수소 화합물의 끓는점</figcaption></figure><div class=\"box\"><b>자료 · 분자량이 비슷한 세 물질</b><table><tr><th>물질</th><th>구조</th><th>분자량</th><th>끓는점(℃)</th></tr><tr><th>프로페인</th><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CH_3CH_2CH_3}</annotation></semantics></math></span></td><td>44</td><td>−42</td></tr><tr><th>다이메틸 에테르</th><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CH_3OCH_3}</annotation></semantics></math></span></td><td>46</td><td>−24</td></tr><tr><th>에탄올</th><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CH_3CH_2OH}</annotation></semantics></math></span></td><td>46</td><td>78</td></tr></table><p>다이메틸 에테르와 에탄올은 분자식이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub><mi mathvariant=\"normal\">O</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{C_2H_6O}</annotation></semantics></math></span>로 같다.</p></div>","qs":[],"ans":[],"follow":["HF와 NH₃의 끓는점도 같은 족에서 벗어나는가?","H₂S 분자도 굽은 모양인데 수소 결합이 약한 이유는?"],"groups":[{"parts":["14족 원소의 수소 화합물은 주기가 커질수록 끓는점이 높아진다. 이유를 설명하시오.","16족에서 물만 경향에서 크게 벗어난다. 물 분자의 구조와 전기 음성도로 그 이유를 설명하시오."],"ans":["네 분자 모두 무극성이고, 분자량이 클수록 전자가 많아 분산력이 커진다.","산소는 전기 음성도가 커서 O–H 결합의 극성이 크고, 분자가 굽은 모양이라 극성 분자이다. 한 분자의 수소와 이웃 분자의 산소 사이에 수소 결합이 생겨 떼어 내는 데 많은 에너지가 든다."]},{"parts":["물이 3~5주기 화합물의 경향을 그대로 따랐다면 끓는점은 대략 몇 ℃였을지 그래프에서 어림하고, 그랬다면 지구의 모습이 어떻게 달랐을지 말하시오.","얼음이 물에 뜨는 이유를 분자 사이의 결합으로 설명하고, 이 성질이 호수에 사는 생물에게 주는 의미를 말하시오."],"ans":["세 점을 이은 선을 2주기로 늘리면 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>80</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">-80\\,</annotation></semantics></math></span>℃ 안팎. 물은 지표의 온도에서 기체였을 것이고 바다와 액체 상태의 물에 기대는 생명은 있기 어렵다.","얼음에서는 물 분자가 수소 결합으로 빈 공간이 많은 육각 구조를 이루어 밀도가 물보다 작다. 호수는 위부터 얼고 얼음이 아래의 물을 덮어 주어 생물이 겨울을 난다."]},{"parts":["세 물질의 끓는점 차이를 분자 구조와 분자 사이의 힘으로 설명하시오.","특히 분자식이 같은 두 물질의 끓는점이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">100\\,</annotation></semantics></math></span>℃ 넘게 차이 나는 이유를 구조에서 찾으시오."],"ans":["프로페인은 무극성이라 분산력만, 다이메틸 에테르는 굽은 C–O–C 때문에 극성이라 쌍극자 사이의 힘이 더해진다. 에탄올은 O–H 결합이 있어 분자끼리 수소 결합을 한다. 에테르에는 산소에 직접 붙은 수소가 없어 자기들끼리 수소 결합을 하지 못한다."]},{"parts":["세 물질이 물에 녹는 정도를 예측하여 순서를 정하고 근거를 대시오.","또 에탄올이 든 손 소독제를 바르면 시원하게 느껴지는 이유를, 물이 묻었을 때보다 더 빨리 마르는 사실과 함께 설명하시오."],"ans":["에탄올 > 다이메틸 에테르 > 프로페인. 에탄올은 물과 수소 결합을 주고받고, 에테르는 산소가 물의 수소와 수소 결합을 할 수 있으며, 프로페인은 물과 끌림이 약하다. 에탄올은 수소 결합의 수가 물보다 적어 분자 사이의 힘이 약하므로 더 빨리 증발하고, 증발할 때 피부에서 열을 빼앗는다."]}]},{"kind":"연습","src":"연습 4 · 녹슬지 않는 배","scope":"화학Ⅰ · 화학Ⅱ","concept":"산화와 환원, 금속의 반응성, 화학 전지의 원리","body":"<p>철이 녹스는 것은 철이 전자를 잃고, 물에 녹아 있는 산소가 그 전자를 얻는 반응이다. 금속이 전자를 잃기 쉬운 정도는 마그네슘 &gt; 아연 &gt; 철 &gt; 주석 &gt; 구리의 순서이다. 서로 다른 두 금속이 닿은 채 물에 젖으면 전자를 잃기 쉬운 금속이 먼저 반응한다.</p><div class=\"box\"><b>자료 · 두 금속으로 만든 전지</b><p>묽은 소금물에 서로 다른 두 금속판을 담그고 전압계를 연결하여 전압과 (−)극이 되는 금속을 조사하였다. (−)극에서는 금속이 전자를 잃는 산화 반응이 일어난다.</p><table><tr><th>두 금속</th><td>아연, 철</td><td>철, 주석</td><td>아연, 구리</td></tr><tr><th>전압(V)</th><td>0.32</td><td>0.30</td><td>1.10</td></tr><tr><th>(−)극</th><td>아연</td><td>철</td><td>아연</td></tr></table></div>","qs":[],"ans":[],"follow":["철에 구리를 붙이면 어떻게 되는가?","페인트칠과 문제 2의 (1)의 방법은 원리가 어떻게 다른가?"],"groups":[{"parts":["철이 녹슬 때 산화되는 물질과 환원되는 물질을 말하고, 물과 산소가 모두 필요한 이유를 설명하시오.","철판에 아연을 입힌 것과 주석을 입힌 것이 있다. 겉이 긁혀 철이 드러났을 때 어느 쪽의 철이 더 빨리 녹스는가?"],"ans":["철이 산화되고 산소가 환원된다. 산소는 전자를 받는 물질이고, 물은 이온이 움직이는 길이 되어 전자를 잃는 곳과 얻는 곳을 이어 준다.","주석을 입힌 쪽. 아연은 철보다 전자를 잃기 쉬워 대신 반응하며 철을 지키지만, 주석은 철보다 전자를 잃기 어려워 철이 먼저 반응한다."]},{"parts":["바닷물에 잠기는 배의 철판에 마그네슘 덩어리를 붙여 두는 까닭을 설명하시오. 이 덩어리는 왜 주기적으로 갈아 주어야 하는가?","철은 민물보다 바닷물에서 더 빨리 녹슨다. 이유를 추론하시오."],"ans":["마그네슘이 철 대신 전자를 잃어 철이 산화되지 않는다. 마그네슘은 이온이 되어 녹아 없어지므로 갈아 주어야 한다.","바닷물에는 이온이 많아 전류가 잘 흐르므로 전자를 잃는 곳과 얻는 곳 사이의 반응이 빨라진다."]},{"parts":["자료의 세 실험 결과에서 아연, 철, 주석이 전자를 잃기 쉬운 순서를 정하고, 제시문의 순서와 맞는지 확인하시오. 구리의 자리는 어떻게 추정할 수 있는가?","(1)을 바탕으로 문제 1의 (2)의 두 철판(아연을 입힌 것, 주석을 입힌 것)이 긁혔을 때 각각 어느 금속이 (−)극이 되는지 판단하시오. 또 아연판과 주석판으로 전지를 만들면 (−)극이 되는 금속은 무엇이며, 전압은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.32</mn></mrow><annotation encoding=\"application/x-tex\">0.32</annotation></semantics></math></span> V보다 클지 작을지 근거를 들어 예측하시오."],"ans":["아연–철에서 아연이 (−)극이므로 아연이 철보다, 철–주석에서 철이 (−)극이므로 철이 주석보다 전자를 잃기 쉽다(아연 > 철 > 주석). 제시문과 일치. 아연–구리의 전압(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.10</mn></mrow><annotation encoding=\"application/x-tex\">1.10</annotation></semantics></math></span> V)이 아연–철(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.32</mn></mrow><annotation encoding=\"application/x-tex\">0.32</annotation></semantics></math></span> V)보다 훨씬 크므로 구리는 아연과 반응성 차이가 가장 큰, 가장 뒤쪽 금속으로 추정한다. 아연을 입힌 철판은 아연이 (−)극이 되어 철이 보호되고, 주석을 입힌 철판은 철이 (−)극이 되어 철이 먼저 산화된다. 아연–주석 전지는 아연이 (−)극이고, 두 금속의 반응성 차이는 아연–철, 철–주석의 차이를 합한 만큼이므로 전압은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.32</mn></mrow><annotation encoding=\"application/x-tex\">0.32</annotation></semantics></math></span> V보다 크다(약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.6</mn></mrow><annotation encoding=\"application/x-tex\">0.6</annotation></semantics></math></span> V로 예상)."]},{"parts":["철판 두 장을 구리 못으로 이은 구조물과, 구리판 두 장을 철 못으로 이은 구조물이 비에 젖는다. 어느 쪽이 먼저 못 쓰게 되는지 추론하시오.","산화가 일어나는 금속의 넓이가 좁을 때 어떤 일이 생길지 생각하여 답하고, 서로 다른 금속을 이어야 할 때의 원칙을 하나 제안하시오."],"ans":["두 경우 모두 철이 산화된다. 구리판에 박힌 철 못은 넓은 구리 면에서 일어나는 환원에 필요한 전자를 좁은 못 하나가 모두 내놓아야 하므로 매우 빨리 삭아 구조물이 풀린다. 철판에 박힌 구리 못은 넓은 철판이 조금씩 산화될 뿐이다. 원칙의 예: 작은 부품(못, 나사)은 큰 판보다 산화되기 어려운 금속으로 한다, 두 금속 사이에 전기가 통하지 않는 것을 끼운다."]}]},{"kind":"기출","src":"2026학년도 화학 문제 1","page":"문항집 41~44쪽","scope":"화학Ⅰ · 화학Ⅱ","concept":"양적 관계, 전기 분해, 반응 엔탈피, 반응 속도, 화학 평형, 끓는점","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"body":"<p>하버–보슈 공정은 질소와 수소를 반응시켜 암모니아를 만드는 공정이다. 공장 A와 B는 이 공정으로 암모니아를 합성하며, 각 공장에는 질소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">50</annotation></semantics></math></span> mol과 수소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>150</mn></mrow><annotation encoding=\"application/x-tex\">150</annotation></semantics></math></span> mol이 제공된다. 반응기의 부피는 둘 다 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span> L이고 Fe 기반 촉매를 쓴다. 온도는 공장 A가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_1</annotation></semantics></math></span>, 공장 B가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_2</annotation></semantics></math></span>이며 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub><mo>&gt;</mo><msub><mi>T</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_1&gt;T_2</annotation></semantics></math></span>이다.</p>\n<p>암모니아를 생성하는 반응의 농도로 정의되는 평형 상수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_1</annotation></semantics></math></span>과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_2</annotation></semantics></math></span>에서 각각 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1600</mn><mn>2187</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{1600}{2187}</annotation></semantics></math></span> 또는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>100</mn><mn>1728</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{100}{1728}</annotation></semantics></math></span> 중 하나이다. 반응기의 온도와 부피는 항상 일정하다.</p>\n<table><tr><th>결합</th><td>N–N</td><td>N=N</td><td>N≡N</td><td>N–H</td><td>H–H</td></tr><tr><th>평균 결합 에너지(kJ/mol)</th><td>163</td><td>418</td><td>941</td><td>391</td><td>436</td></tr></table><figure><svg viewBox=\"0 0 360 190\" role=\"img\" aria-label=\"반응 시간에 따른 암모니아 농도 그래프 두 개\">\n<line class=\"ax\" x1=\"50\" y1=\"160\" x2=\"340\" y2=\"160\"/><line class=\"ax\" x1=\"50\" y1=\"165\" x2=\"50\" y2=\"14\"/><line class=\"dash\" x1=\"50\" y1=\"40\" x2=\"300\" y2=\"40\"/><line class=\"dash\" x1=\"50\" y1=\"95\" x2=\"300\" y2=\"95\"/>\n<polyline class=\"ln\" points=\"50.0,160.0 54.1,151.6 58.3,143.8 62.4,136.5 66.5,129.6 70.6,123.3 74.8,117.3 78.9,111.8 83.0,106.6 87.1,101.7 91.3,97.2 95.4,93.0 99.5,89.1 103.6,85.4 107.8,81.9 111.9,78.7 116.0,75.7 120.1,73.0 124.3,70.3 128.4,67.9 132.5,65.6 136.6,63.5 140.8,61.5 144.9,59.7 149.0,58.0 153.1,56.4 157.3,54.9 161.4,53.4 165.5,52.1 169.6,50.9 173.8,49.8 177.9,48.7 182.0,47.7 186.1,46.8 190.3,45.9 194.4,45.1 198.5,44.3 202.6,43.6 206.8,43.0 210.9,42.4 215.0,41.8 219.1,41.2 223.3,40.7 227.4,40.3 231.5,40.0 235.6,40.0 239.8,40.0 243.9,40.0 248.0,40.0 252.1,40.0 256.3,40.0 260.4,40.0 264.5,40.0 268.6,40.0 272.8,40.0 276.9,40.0 281.0,40.0 285.1,40.0 289.3,40.0 293.4,40.0 297.5,40.0\"/>\n<polyline class=\"ln2\" points=\"50.0,160.0 54.1,143.0 58.3,130.3 62.4,120.8 66.5,113.7 70.6,108.5 74.8,104.5 78.9,101.6 83.0,99.4 87.1,97.8 91.3,96.6 95.4,95.7 99.5,95.0 103.6,95.0 107.8,95.0 111.9,95.0 116.0,95.0 120.1,95.0 124.3,95.0 128.4,95.0 132.5,95.0 136.6,95.0 140.8,95.0 144.9,95.0 149.0,95.0 153.1,95.0 157.3,95.0 161.4,95.0 165.5,95.0 169.6,95.0 173.8,95.0 177.9,95.0 182.0,95.0 186.1,95.0 190.3,95.0 194.4,95.0 198.5,95.0 202.6,95.0 206.8,95.0 210.9,95.0 215.0,95.0 219.1,95.0 223.3,95.0 227.4,95.0 231.5,95.0 235.6,95.0 239.8,95.0 243.9,95.0 248.0,95.0 252.1,95.0 256.3,95.0 260.4,95.0 264.5,95.0 268.6,95.0 272.8,95.0 276.9,95.0 281.0,95.0 285.1,95.0 289.3,95.0 293.4,95.0 297.5,95.0\"/>\n<text x=\"34\" y=\"44\">a</text><text x=\"34\" y=\"99\">b</text><text x=\"306\" y=\"44\">(가)</text><text x=\"306\" y=\"99\">(나)</text><line class=\"tk\" x1=\"62\" y1=\"156\" x2=\"62\" y2=\"164\"/><text class=\"c s\" x=\"62\" y=\"176\">t₀</text>\n<text x=\"270\" y=\"180\">반응 시간(분)</text><text x=\"6\" y=\"12\">[NH₃] (M)</text>\n</svg><figcaption>[그림 1-1] 공장 A, B에서 반응 시간에 따른 암모니아의 농도</figcaption></figure>","qs":["(1) 암모니아 합성 반응의 화학 반응식을 쓰고, 표의 평균 결합 에너지로 암모니아 기체 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> mol이 생성되는 반응의 반응 엔탈피를 구하시오.<br>(2) 그림 1-1은 두 공장에서 반응물을 모두 넣고 반응시킬 때 시간에 따른 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">[</mo><mrow><mi mathvariant=\"normal\">N</mi><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub></mrow><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">[\\mathrm{NH_3}]</annotation></semantics></math></span>이다. 공장 A, B가 (가), (나) 중 어느 것인지 답하고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">t_0</annotation></semantics></math></span>분일 때 두 곡선의 기울기가 다른 이유를 제시하시오. 이를 바탕으로 a와 b에 해당하는 농도를 구하시오. (반응 시 질소는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.1</mn></mrow><annotation encoding=\"application/x-tex\">0.1</annotation></semantics></math></span> M 단위로 반응한다고 가정한다.)","새 공장 C는 반응기의 온도를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_1</annotation></semantics></math></span> 또는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_2</annotation></semantics></math></span>로만 설정할 수 있고 다른 조건은 A, B와 같다. 화학 평형과 반응 속도를 고려하여 공장 C가 운영 효율을 높이는 전략을 제시하고, 그림 1-1에 공장 C의 암모니아 농도 변화를 나타내어 A, B보다 나아진 점을 설명하시오. (온도 변화 횟수는 최소로 한다.)","공장 B는 반응 뒤의 혼합 기체에서 암모니아만 분리하고 남은 물질을 다시 반응시키는 재순환 시스템을 들이려 한다.<br>(1) 암모니아만 분리하는 방법을 질소, 수소, 암모니아의 분자 구조에 따른 성질로 설명하시오.<br>(2) 재순환 시스템으로 질소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">50</annotation></semantics></math></span> mol과 수소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>150</mn></mrow><annotation encoding=\"application/x-tex\">150</annotation></semantics></math></span> mol에서 얻을 수 있는 암모니아의 최대 질량을 구하시오.","공장 D는 바닷물을 전기 분해하여 반응물 중 하나를 얻으려 한다. 바닷물은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.5</mn><mtext> </mtext><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">0.5\\,m</annotation></semantics></math></span> NaCl(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">aq</annotation></semantics></math></span>)로만 되어 있고 전극은 반응에 참여하지 않는다.<br>(1) (+)극과 (−)극에서 일어나는 반쪽 반응과 그 반응이 일어나는 이유를 설명하시오.<br>(2) 수소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>150</mn></mrow><annotation encoding=\"application/x-tex\">150</annotation></semantics></math></span> mol을 얻는 데 필요한 바닷물의 최소 질량을 구하시오. (NaCl의 화학식량은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>58</mn></mrow><annotation encoding=\"application/x-tex\">58</annotation></semantics></math></span>)","공장 A는 기존 반응기로 암모니아에서 수소를 얻을 수 있는지 세 번 시험 가동하였다. ① 암모니아 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span> mol만 넣었더니 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span>시간 동안 수소가 거의 생기지 않았다. ② 소량의 수소를 먼저 넣은 뒤 암모니아를 넣었더니 ①보다 수소가 많이 생겼다. ③ 일산화 탄소를 먼저 넣은 뒤 암모니아를 넣었더니 ①보다 수소가 많이 생겼다.<br>(1) 연구원들은 ①, ②로부터 수소가 촉매 표면의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">F</mi><msub><mi mathvariant=\"normal\">e</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{Fe_2O_3}</annotation></semantics></math></span>를 활성화한다고 추정했다. ①~③을 종합하여 이 추정이 타당한지 판단하고, 실제 촉매로 기능하는 물질을 추론하여 ②, ③의 촉매 활성화 반응의 화학 반응식으로 설명하시오.<br>(2) 철의 제련(용광로에서 코크스가 산소와 반응해 일산화 탄소가 되고, 일산화 탄소가 철광석과 반응해 철과 이산화 탄소가 됨)에서 생기는 환경 문제를 줄일 방안을 (1)의 반응식을 바탕으로 설명하시오."],"ans":["화학 반응식을 세우고 평균 결합 에너지로 반응 엔탈피를 구할 수 있는지, 르샤틀리에 원리로 반응 엔탈피와 평형의 관계를 설명하는지, 평형과 반응 속도를 종합적으로 이해하는지 본다.","온도가 반응에 미치는 영향을 반응 속도와 평형의 관점에서 설명하고, 생성물 농도를 가장 크게 하는 방법을 끌어낼 수 있는지 본다.","분자 구조(쌍극자 모멘트, 수소 결합 여부)와 끓는점의 관계를 이해하고 이를 바탕으로 혼합물의 분리 방법을 고안할 수 있는지, 평형과 르샤틀리에 원리를 이해하는지 본다.","전기 분해 때 두 극에서 일어나는 반응, 이온화 경향과 용액의 농도를 종합적으로 이해하는지 본다.","주어진 상황을 해석하여 산화 환원 반응과 촉매 반응에서 각 물질의 역할을 유추할 수 있는지 본다."]},{"kind":"기출","src":"2026학년도 화학 문제 2","page":"문항집 47~50쪽","scope":"화학Ⅰ · 화학Ⅱ","concept":"양적 관계, 부분 압력, 이상 기체 방정식, 전기 분해, 반응 엔탈피, 반응 속도식","ansLabel":"출제 의도 (서울대 공개 문항해설 요약)","follow":[],"qnum":2,"body":"<p>우주 실험 동물인 생명체 X의 호흡으로 생긴 이산화 탄소를 산소로 재생하기 위해 두 장치를 개발하였다.</p>\n<div class=\"box\"><p><b style=\"display:inline\">장치 A</b> 이산화 탄소와 수소를 물과 메테인으로 바꾼다. 피스톤이 달린 닫힌 반응기가 있고, 반응기의 부피는 내부 기체의 부피와 같다. 내부 온도와 압력은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>27</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">27\\,</annotation></semantics></math></span>℃, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> atm으로 유지된다. 피스톤의 질량과 마찰은 무시한다.</p><p><b style=\"display:inline\">장치 B</b> 물을 수소와 산소로 바꾸는 전기 분해 장치이다.</p></div>","qs":["(1) 장치 A의 반응기의 처음 부피는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.4</mn></mrow><annotation encoding=\"application/x-tex\">2.4</annotation></semantics></math></span> L이고 이산화 탄소와 수소만 들어 있다. 반응이 끝났을 때 둘 다 모두 소진되었다. 반응이 끝난 뒤 반응기의 부피와 생성된 물의 몰 수를 구하시오. (기체 상수는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.08</mn></mrow><annotation encoding=\"application/x-tex\">0.08</annotation></semantics></math></span> atm·L/mol·K)<br>(2) 장치 B에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{H_2O}</annotation></semantics></math></span>만 넣고 가동했더니 작동하지 않았다. 이유를 설명하고 해결책을 제안하시오.","생명체 X의 호흡은 설탕(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><msub><mi mathvariant=\"normal\">C</mi><mn>12</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>22</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>11</mn></msub></mrow><mo stretchy=\"false\">(</mo><mi>s</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{C_{12}H_{22}O_{11}}(s)</annotation></semantics></math></span>)과 산소를 이산화 탄소와 물(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>l</mi></mrow><annotation encoding=\"application/x-tex\">l</annotation></semantics></math></span>)로 바꾸는 과정이다. 표준 생성 엔탈피는 설탕 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>2220</mn></mrow><annotation encoding=\"application/x-tex\">-2220</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><mo stretchy=\"false\">(</mo><mi>g</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CO_2}(g)</annotation></semantics></math></span> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>390</mn></mrow><annotation encoding=\"application/x-tex\">-390</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow><mo stretchy=\"false\">(</mo><mi>l</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm{H_2O}(l)</annotation></semantics></math></span> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>290</mn></mrow><annotation encoding=\"application/x-tex\">-290</annotation></semantics></math></span> kJ/mol이다. X가 하루에 필요로 하는 최소 열량이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>14125</mn></mrow><annotation encoding=\"application/x-tex\">14125</annotation></semantics></math></span> kJ일 때, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>400</mn></mrow><annotation encoding=\"application/x-tex\">400</annotation></semantics></math></span>일 동안 소비하는 설탕과 산소의 최소 질량을 각각 구하시오. (원자량: H 1, C 12, O 16)","우주 정거장에서 X가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>400</mn></mrow><annotation encoding=\"application/x-tex\">400</annotation></semantics></math></span>일 동안 호흡에 쓸 물질을 지구에서 보내려 한다. 연구원은 장치 A와 B로 호흡의 생성물에서 산소를 재생하는 시스템(호흡 → <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CO_2}</annotation></semantics></math></span> → 장치 A → <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">C</mi><msub><mi mathvariant=\"normal\">H</mi><mn>4</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CH_4}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{H_2O}</annotation></semantics></math></span> → 장치 B → <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{H_2}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{O_2}</annotation></semantics></math></span> → 호흡)을 만들 수 있다고 보았다.<br>(1) 연구원은 설탕 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> mol과 수소 기체 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">2n</annotation></semantics></math></span> mol을 보내는 것이 최적이라고 생각했다. 이 전략이 타당한 이유를 구체적으로 설명하시오.<br>(2) X가 설탕 대신 포도당(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>12</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>6</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{C_6H_{12}O_6}</annotation></semantics></math></span>)으로 호흡할 수 있어 포도당을 보내기로 했다면 전략이 어떻게 달라지는지 설명하시오.","일정한 온도에서 장치 A에 수소와 이산화 탄소의 초기 농도를 달리하여 넣고 반응 초기 메테인의 부분 압력 변화율을 측정하였다.<figure><svg viewBox=\"0 0 380 160\" role=\"img\" aria-label=\"수소와 이산화 탄소의 초기 농도에 따른 메테인 부분 압력의 초기 변화율\">\n<line class=\"ax\" x1=\"40\" y1=\"125\" x2=\"175\" y2=\"125\"/><line class=\"ax\" x1=\"40\" y1=\"130\" x2=\"40\" y2=\"14\"/><line class=\"dash\" x1=\"40\" y1=\"125\" x2=\"165\" y2=\"35\"/><circle class=\"pt\" cx=\"62\" cy=\"109.2\" r=\"3\"/><circle class=\"pt\" cx=\"84\" cy=\"93.4\" r=\"3\"/><circle class=\"pt\" cx=\"106\" cy=\"77.6\" r=\"3\"/><circle class=\"pt\" cx=\"128\" cy=\"61.8\" r=\"3\"/><circle class=\"pt\" cx=\"150\" cy=\"46\" r=\"3\"/>\n<line class=\"ax\" x1=\"230\" y1=\"125\" x2=\"365\" y2=\"125\"/><line class=\"ax\" x1=\"230\" y1=\"130\" x2=\"230\" y2=\"14\"/><line class=\"dash\" x1=\"230\" y1=\"75\" x2=\"355\" y2=\"75\"/><circle class=\"pt\" cx=\"252\" cy=\"75\" r=\"3\"/><circle class=\"pt\" cx=\"274\" cy=\"75\" r=\"3\"/><circle class=\"pt\" cx=\"296\" cy=\"75\" r=\"3\"/><circle class=\"pt\" cx=\"318\" cy=\"75\" r=\"3\"/><circle class=\"pt\" cx=\"340\" cy=\"75\" r=\"3\"/>\n<text x=\"110\" y=\"142\">[H₂]₀</text><text x=\"300\" y=\"142\">[CO₂]₀</text><text class=\"c s\" x=\"108\" y=\"156\">[그림 2-3] [CO₂]₀ 일정</text><text class=\"c s\" x=\"298\" y=\"156\">[그림 2-4] [H₂]₀ 일정</text>\n</svg><figcaption>세로축은 반응 초기 메테인의 부분 압력 변화율 (ΔP/Δt)₀ (atm/s)</figcaption></figure>(1) 장치 A에서 일어나는 반응의 반응 속도식을 구하시오.<br>(2) 장치 A의 반응기는 기체를 최대 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span> L 담을 수 있다. 수소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">8</annotation></semantics></math></span> L와 이산화 탄소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span> L의 반응을 가장 빨리 끝내는 전략을 (1)의 속도식으로 제안하시오. (원하는 반응물을 언제든 넣고 생성물을 뺄 수 있으며, 반응기 내부는 항상 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1</annotation></semantics></math></span> atm이다.)"],"ans":["화학 반응식, 부분 압력, 이상 기체 방정식, 물의 상평형, 양적 관계를 복합적으로 활용할 수 있는지, 전기 분해에서 전해질의 역할을 이해하는지 본다.","주어진 정보로 반응 엔탈피를 계산하고 활용할 수 있는지 본다.","화학 반응식으로 문제 상황을 평가하고, 상황 변화에 맞게 반응식을 변형할 수 있는지 본다.","초기 농도에 따른 초기 속도 변화에서 반응 차수를 얻고, 1차 반응의 특성으로 반응 전략을 세울 수 있는지 본다."]}],"bio":[{"kind":"연습","src":"연습 1 · 효소와 두 가지 물질","scope":"생명과학Ⅱ","concept":"효소와 기질, 활성 부위, 경쟁적 저해제와 비경쟁적 저해제, 대조 실험, 되먹임 억제, 실험 설계","body":"<p>어떤 효소의 양을 일정하게 하고 기질 농도를 바꾸어 가며 초기 반응 속도를 측정하였다(A). 같은 실험을 물질 X를 함께 넣은 경우(B)와 물질 Y를 함께 넣은 경우(C)에 대해서도 하였다. 온도와 pH는 모든 실험에서 같다.</p><figure><svg viewBox=\"0 0 380 200\" role=\"img\" aria-label=\"기질 농도에 따른 초기 반응 속도 그래프 세 개\">\n<line class=\"ax\" x1=\"50\" y1=\"170\" x2=\"345\" y2=\"170\"/><line class=\"ax\" x1=\"50\" y1=\"175\" x2=\"50\" y2=\"14\"/>\n<line class=\"dash\" x1=\"50\" y1=\"30\" x2=\"335\" y2=\"30\"/><line class=\"dash\" x1=\"50\" y1=\"100\" x2=\"335\" y2=\"100\"/>\n<polyline class=\"ln\" points=\"50,170.0 57,123.3 64,100.0 71,86.0 78,76.7 85,70.0 92,65.0 99,61.1 106,58.0 113,55.5 120,53.3 127,51.5 134,50.0 141,48.7 148,47.5 155,46.5 162,45.6 169,44.7 176,44.0 183,43.3 190,42.7 197,42.2 204,41.7 211,41.2 218,40.8 225,40.4 232,40.0 239,39.7 246,39.3 253,39.0 260,38.8 267,38.5 274,38.2 281,38.0 288,37.8 295,37.6 302,37.4 309,37.2 316,37.0 323,36.8 330,36.7\"/><polyline class=\"ln2\" points=\"50,170.0 57,154.4 64,142.0 71,131.8 78,123.3 85,116.2 92,110.0 99,104.7 106,100.0 113,95.9 120,92.2 127,88.9 134,86.0 141,83.3 148,80.9 155,78.7 162,76.7 169,74.8 176,73.1 183,71.5 190,70.0 197,68.6 204,67.3 211,66.1 218,65.0 225,63.9 232,62.9 239,62.0 246,61.1 253,60.3 260,59.5 267,58.7 274,58.0 281,57.3 288,56.7 295,56.0 302,55.5 309,54.9 316,54.3 323,53.8 330,53.3\"/><polyline class=\"ln3\" points=\"50,170.0 57,146.7 64,135.0 71,128.0 78,123.3 85,120.0 92,117.5 99,115.6 106,114.0 113,112.7 120,111.7 127,110.8 134,110.0 141,109.3 148,108.8 155,108.2 162,107.8 169,107.4 176,107.0 183,106.7 190,106.4 197,106.1 204,105.8 211,105.6 218,105.4 225,105.2 232,105.0 239,104.8 246,104.7 253,104.5 260,104.4 267,104.2 274,104.1 281,104.0 288,103.9 295,103.8 302,103.7 309,103.6 316,103.5 323,103.4 330,103.3\"/>\n<text x=\"336\" y=\"42\">A</text><text x=\"336\" y=\"60\">B</text><text x=\"336\" y=\"112\">C</text>\n<text x=\"34\" y=\"34\">V</text><text x=\"22\" y=\"104\">V/2</text><text x=\"150\" y=\"192\">기질 농도</text><text x=\"6\" y=\"12\">초기 반응 속도</text>\n</svg><figcaption>[그림] A: 효소만 넣음, B: 물질 X를 함께 넣음, C: 물질 Y를 함께 넣음 (효소의 양은 모두 같다)</figcaption></figure>\n<p>알코올 탈수소 효소는 간에서 에탄올을 분해하는 효소인데, 구조가 비슷한 메탄올도 기질로 삼는다. 메탄올이 이 효소로 분해되어 생기는 물질은 사람에게 매우 해롭다.</p><div class=\"box\"><b>토막글 · 세포 안의 생산 조절</b><p>세포에서 물질 P는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mover><mo stretchy=\"true\" minsize=\"3.0em\">→</mo><mpadded width=\"+0.6em\" lspace=\"0.3em\"><mrow><mtext> </mtext><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub><mtext> </mtext></mrow></mpadded></mover><mi mathvariant=\"normal\">A</mi><mover><mo stretchy=\"true\" minsize=\"3.0em\">→</mo><mpadded width=\"+0.6em\" lspace=\"0.3em\"><mrow><mtext> </mtext><msub><mi mathvariant=\"normal\">E</mi><mn>2</mn></msub><mtext> </mtext></mrow></mpadded></mover><mi mathvariant=\"normal\">B</mi><mover><mo stretchy=\"true\" minsize=\"3.0em\">→</mo><mpadded width=\"+0.6em\" lspace=\"0.3em\"><mrow><mtext> </mtext><msub><mi mathvariant=\"normal\">E</mi><mn>3</mn></msub><mtext> </mtext></mrow></mpadded></mover><mi mathvariant=\"normal\">P</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm S\\xrightarrow{\\ \\mathrm{E_1}\\ }\\mathrm A\\xrightarrow{\\ \\mathrm{E_2}\\ }\\mathrm B\\xrightarrow{\\ \\mathrm{E_3}\\ }\\mathrm P</annotation></semantics></math></span>의 세 단계로 만들어진다(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E_1}</annotation></semantics></math></span>~<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E_3}</annotation></semantics></math></span>는 효소). P는 S와 구조가 전혀 다르지만, 세포 안에 P가 많아지면 P가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E_1}</annotation></semantics></math></span>에 결합하여 첫 단계가 느려진다. P가 줄어들면 P는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E_1}</annotation></semantics></math></span>에서 떨어진다.</p></div>","qs":[],"ans":[],"follow":["X가 경쟁적 저해제임을 확인하려면 어떤 실험을 더 하면 되는가?","온도를 10 ℃ 높이면 A의 그래프가 어떻게 달라질지 두 가지 가능성을 말해 보시오."],"groups":[{"parts":["A에서 기질 농도가 충분히 높아지면 초기 반응 속도가 더 이상 커지지 않는 이유를 설명하시오.","B와 C의 그래프가 A와 어떻게 다른지 비교하고, 물질 X와 Y가 효소에 각각 어떻게 작용하는지 추론하시오."],"ans":["효소의 양이 일정하므로 기질이 충분히 많으면 모든 효소의 활성 부위가 기질과 결합한 상태(포화)가 된다. 이때 속도는 효소의 양이 정한다.","B는 기질 농도가 낮을 때 속도가 A보다 작지만 기질 농도를 높이면 A의 최대 속도에 가까워진다. X는 활성 부위를 놓고 기질과 경쟁하는 경쟁적 저해제이다. C는 기질 농도를 높여도 최대 속도가 A의 절반에 머문다. Y는 활성 부위가 아닌 곳에 결합해 효소의 구조를 바꾸는 비경쟁적 저해제이다."]},{"parts":["A의 조건에서 효소의 양만 2배로 하면 그래프는 어떻게 달라지는가? C의 그래프와 견주어 설명하시오.","메탄올을 마신 환자에게 응급 처치로 에탄올을 투여하는 경우가 있다. 제시문과 위 실험 결과를 이용하여 그 원리를 설명하시오."],"ans":["모든 기질 농도에서 속도가 2배가 되어 최대 속도가 2V가 된다. C는 일할 수 있는 효소가 절반으로 줄어든 것과 같은 결과이므로, 효소의 양을 바꾼 그래프와 모양이 같고 높이만 다르다.","에탄올과 메탄올은 같은 효소의 활성 부위에 결합한다. 에탄올을 넣으면 에탄올이 메탄올에 대해 경쟁적 저해제처럼 작용하여 메탄올이 분해되는 속도가 느려지고, 해로운 물질이 생기기 전에 메탄올이 몸 밖으로 나갈 시간을 번다."]},{"parts":["P는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E_1}</annotation></semantics></math></span>의 어느 부위에 결합한다고 추론할 수 있는가? 그림의 X와 Y 가운데 어느 것과 작용 방식이 같은지 근거를 들어 말하시오.","세포가 마지막 효소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E_3}</annotation></semantics></math></span>가 아니라 첫 효소 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathrm{E_1}</annotation></semantics></math></span>을 조절하는 것은 어떤 점에서 유리한가?"],"ans":["P는 기질 S와 구조가 달라 활성 부위에 맞지 않으므로 활성 부위가 아닌 다른 부위에 결합해 효소의 모양을 바꾼다. Y(비경쟁적 저해)와 같다. 첫 단계를 막으면 중간 산물 A, B를 쓸데없이 만들지 않아 원료와 에너지를 아끼고, P가 줄면 저해가 풀려 다시 만든다(음성 피드백)."]},{"parts":["새로 찾은 물질 Z가 이 효소의 작용을 방해한다. Z가 X와 같은 유형인지 Y와 같은 유형인지 가려내는 실험을 설계하시오.","바꾸는 조건, 측정할 것, 같게 유지할 조건을 밝히고 유형에 따라 예상되는 결과를 각각 말하시오."],"ans":["효소와 Z의 양, 온도, pH를 같게 두고 기질 농도만 여러 단계로 바꾸어 초기 반응 속도를 잰다. Z가 없는 대조군도 같은 조건으로 잰다. 기질 농도를 충분히 높였을 때 속도가 대조군의 최댓값에 가까워지면 X형(경쟁적), 높여도 최댓값이 낮은 채로 머물면 Y형(비경쟁적)."]}]},{"kind":"연습","src":"연습 2 · 밥을 먹은 뒤의 혈당","scope":"생명과학Ⅰ","concept":"항상성, 혈당량 조절, 음성 피드백, 호르몬의 표적 세포, 자료 해석, 호르몬과 표적 세포","body":"<p>그림은 건강한 사람이 식사한 뒤 혈당량과 이자에서 분비되는 두 호르몬의 혈중 농도를 나타낸 것이다.</p><figure><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"식사 뒤 혈당량, 인슐린, 글루카곤 농도의 변화\">\n<line class=\"ax\" x1=\"50\" y1=\"170\" x2=\"385\" y2=\"170\"/><line class=\"ax\" x1=\"50\" y1=\"175\" x2=\"50\" y2=\"14\"/><line class=\"dash\" x1=\"95\" y1=\"170\" x2=\"95\" y2=\"20\"/><text class=\"c s\" x=\"95\" y=\"184\">식사</text>\n<polyline class=\"ln\" points=\"50.0,110.0 53.0,110.0 56.0,110.0 59.0,110.0 62.0,110.0 65.0,110.0 68.0,110.0 71.0,110.0 74.0,110.0 77.0,110.0 80.0,110.0 83.0,110.0 86.0,110.0 89.0,110.0 92.0,110.0 95.0,110.0 98.0,109.0 101.0,10
