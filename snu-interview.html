tyle></mrow><annotation encoding=\"application/x-tex\">p=\\dfrac13</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">N=4</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">k=1</annotation></semantics></math></span>일 때 소심한 전략과 대담한 전략으로 성공할 확률을 각각 구하여 비교하시오.","불리한 게임에서는 왜 대담한 전략이 나은지, 유리한 게임(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p&gt;\\dfrac12</annotation></semantics></math></span>)에서는 어떨지 설명하시오."],"ans":["소심: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">r=2</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>1</mn><mo>−</mo><mn>2</mn></mrow><mrow><mn>1</mn><mo>−</mo><msup><mn>2</mn><mn>4</mn></msup></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>15</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{1-2}{1-2^4}=\\dfrac1{15}</annotation></semantics></math></span>. 대담: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>→</mo><mn>2</mn><mo>→</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">1\\to2\\to4</annotation></semantics></math></span>로 두 번 연달아 이기면 되므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>9</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac19</annotation></semantics></math></span>. 불리한 게임은 회를 거듭할수록 평균적으로 잃으므로 횟수를 줄이는 편이 낫다. 유리한 게임에서는 반대로 조금씩 여러 번 거는 편이 성공 확률을 높인다."]}]}],"mn2":[{"kind":"기출","src":"2026학년도 수학 D","page":"문항집 19~20쪽","scope":"수학 · 확률과 통계 · 미적분","concept":"같은 것이 있는 순열, 수학적 확률, 수열의 극한, 정적분과 급수, 부분적분법","body":"<p>자연수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>2</mn><mi>n</mi><mo>≤</mo><mi>k</mi><mo>≤</mo><mn>2</mn><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">-2n\\le k\\le 2n</annotation></semantics></math></span>인 정수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>에 대하여, 다음 조건을 모두 만족시키며 좌표평면 위를 움직이는 도둑이 있다.</p>\n<div class=\"box\"><b>조건</b>\n<p>(가) 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>y</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x,y)</annotation></semantics></math></span>에 있는 도둑은 한 번 움직일 때마다 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mi>y</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x+1,y+1)</annotation></semantics></math></span> 또는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mi>y</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(x+1,y-1)</annotation></semantics></math></span>까지 최단 거리로 이동한다.</p>\n<p>(나) 도둑은 원점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">O</mi><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm O(0,0)</annotation></semantics></math></span>에서 출발하여 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">4n</annotation></semantics></math></span>번 움직여 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>4</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>2</mn><mi>k</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(4n,2k)</annotation></semantics></math></span>에 도착한다.</p></div>\n<p>도둑이 지나간 모든 점의 집합을 <u>도주경로</u>라 하자.</p><figure><svg viewBox=\"0 0 360 190\" role=\"img\" aria-label=\"n=2, k=1일 때 도주경로의 예\">\n<g class=\"grid\"><line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"170\"/><line x1=\"75\" y1=\"20\" x2=\"75\" y2=\"170\"/><line x1=\"110\" y1=\"20\" x2=\"110\" y2=\"170\"/><line x1=\"145\" y1=\"20\" x2=\"145\" y2=\"170\"/><line x1=\"180\" y1=\"20\" x2=\"180\" y2=\"170\"/><line x1=\"215\" y1=\"20\" x2=\"215\" y2=\"170\"/><line x1=\"250\" y1=\"20\" x2=\"250\" y2=\"170\"/><line x1=\"285\" y1=\"20\" x2=\"285\" y2=\"170\"/><line x1=\"320\" y1=\"20\" x2=\"320\" y2=\"170\"/><line x1=\"40\" y1=\"25\" x2=\"320\" y2=\"25\"/><line x1=\"40\" y1=\"60\" x2=\"320\" y2=\"60\"/><line x1=\"40\" y1=\"95\" x2=\"320\" y2=\"95\"/><line x1=\"40\" y1=\"130\" x2=\"320\" y2=\"130\"/><line x1=\"40\" y1=\"165\" x2=\"320\" y2=\"165\"/></g>\n<line class=\"ax\" x1=\"30\" y1=\"95\" x2=\"340\" y2=\"95\"/><line class=\"ax\" x1=\"40\" y1=\"180\" x2=\"40\" y2=\"10\"/>\n<polyline class=\"ln\" points=\"40,95 75,60 110,25 145,60 180,95 215,130 250,95 285,60 320,25\"/>\n<circle class=\"pt\" cx=\"40\" cy=\"95\" r=\"2.6\"/><circle class=\"pt\" cx=\"75\" cy=\"60\" r=\"2.6\"/><circle class=\"pt\" cx=\"110\" cy=\"25\" r=\"2.6\"/><circle class=\"pt\" cx=\"145\" cy=\"60\" r=\"2.6\"/><circle class=\"pt\" cx=\"180\" cy=\"95\" r=\"2.6\"/><circle class=\"pt\" cx=\"215\" cy=\"130\" r=\"2.6\"/><circle class=\"pt\" cx=\"250\" cy=\"95\" r=\"2.6\"/><circle class=\"pt\" cx=\"285\" cy=\"60\" r=\"2.6\"/><circle class=\"pt\" cx=\"320\" cy=\"25\" r=\"2.6\"/>\n<text x=\"26\" y=\"108\">O</text><text x=\"342\" y=\"99\">x</text><text x=\"36\" y=\"9\">y</text><text x=\"312\" y=\"16\">(8, 2)</text>\n</svg><figcaption>[그림] n = 2, k = 1일 때 가능한 도주경로의 하나</figcaption></figure>\n<p>경찰은 도둑이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>4</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>2</mn><mi>k</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(4n,2k)</annotation></semantics></math></span>에 도착했다는 제보를 받고, 가능한 모든 도주경로 중 하나를 같은 확률로 골라 수사한다. 고른 도주경로가 세 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>2</mn><mi>n</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,2n)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,0)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>2</mn><mi>n</mi><mo separator=\"true\">,</mo><mo>−</mo><mn>2</mn><mi>n</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(2n,-2n)</annotation></semantics></math></span> 중 하나를 포함하면 경찰은 <u>단서를 발견</u>한다고 하자.</p>","qs":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n=3</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">k=0,2,4</annotation></semantics></math></span>일 때 경찰이 단서를 발견할 확률을 각각 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>2</mn><mi>n</mi><mo>−</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">k=2n-3</annotation></semantics></math></span>일 때 경찰이 단서를 발견할 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_n</annotation></semantics></math></span>이라 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>n</mi><mo>→</mo><mi mathvariant=\"normal\">∞</mi></mrow></munder><msub><mi>p</mi><mi>n</mi></msub></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\lim_{n\\to\\infty}p_n</annotation></semantics></math></span>을 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">k=n</annotation></semantics></math></span>일 때 경찰이 단서를 발견할 확률을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">q_n</annotation></semantics></math></span>이라 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><munder><mrow><mi>lim</mi><mo>⁡</mo></mrow><mrow><mi>n</mi><mo>→</mo><mi mathvariant=\"normal\">∞</mi></mrow></munder><mfrac><mn>1</mn><mi>n</mi></mfrac><mi>ln</mi><mo>⁡</mo><msub><mi>q</mi><mi>n</mi></msub></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\lim_{n\\to\\infty}\\frac1n\\ln q_n</annotation></semantics></math></span>을 구하시오."],"ans":["전체 경로 수는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>4</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mn>2</mn><mi>n</mi><mo>+</mo><mi>k</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{4n}\\mathrm C_{2n+k}</annotation></semantics></math></span>. 세 점을 지나는 경로 수는 차례로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{2n}\\mathrm C_{k}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>n</mi></msub><mo>⋅</mo><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mi>n</mi><mo>+</mo><mi>k</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{2n}\\mathrm C_n\\cdot{}_{2n}\\mathrm C_{n+k}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mo>−</mo><mi>k</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\"> {}_{2n}\\mathrm C_{-k}</annotation></semantics></math></span> (정의되지 않으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>)이고 서로 겹치지 않는다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n=3</annotation></semantics></math></span>: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">k=0</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>67</mn><mn>154</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{67}{154}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">k=2</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>11</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac3{11}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">k=4</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>5</mn><mn>22</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac5{22}</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>≥</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">n\\ge4</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>n</mi></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mn>3</mn></msub></mrow><mrow><msub><mrow></mrow><mrow><mn>4</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mn>3</mn></msub></mrow></mfrac></mstyle><mo>→</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>8</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">p_n=\\dfrac{{}_{2n}\\mathrm C_3}{{}_{4n}\\mathrm C_3}\\to\\dfrac18</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mi>n</mi></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mtext> </mtext><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>n</mi></msub></mrow><mrow><msub><mrow></mrow><mrow><mn>4</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mn>3</mn><mi>n</mi></mrow></msub></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">q_n=\\dfrac{2\\,{}_{2n}\\mathrm C_n}{{}_{4n}\\mathrm C_{3n}}</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mi>n</mi></mfrac></mstyle><mi>ln</mi><mo>⁡</mo><msub><mrow></mrow><mrow><mn>2</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mi>n</mi></msub><mo>→</mo><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mi>ln</mi><mo>⁡</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>1</mn><mo>+</mo><mi>x</mi></mrow><mi>x</mi></mfrac></mstyle><mi>d</mi><mi>x</mi><mo>=</mo><mn>2</mn><mi>ln</mi><mo>⁡</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac1n\\ln{}_{2n}\\mathrm C_n\\to\\int_0^1\\ln\\dfrac{1+x}{x}dx=2\\ln2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mi>n</mi></mfrac></mstyle><mi>ln</mi><mo>⁡</mo><msub><mrow></mrow><mrow><mn>4</mn><mi>n</mi></mrow></msub><msub><mi mathvariant=\"normal\">C</mi><mrow><mn>3</mn><mi>n</mi></mrow></msub><mo>→</mo><mn>8</mn><mi>ln</mi><mo>⁡</mo><mn>2</mn><mo>−</mo><mn>3</mn><mi>ln</mi><mo>⁡</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac1n\\ln{}_{4n}\\mathrm C_{3n}\\to8\\ln2-3\\ln3</annotation></semantics></math></span>이므로 극한값은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mi>ln</mi><mo>⁡</mo><mn>3</mn><mo>−</mo><mn>6</mn><mi>ln</mi><mo>⁡</mo><mn>2</mn><mo>=</mo><mi>ln</mi><mo>⁡</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>27</mn><mn>64</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">3\\ln3-6\\ln2=\\ln\\dfrac{27}{64}</annotation></semantics></math></span>."],"follow":["세 사건이 동시에 일어날 수 없는 이유를 설명하시오.","급수를 정적분으로 바꿀 때 구간과 함수를 어떻게 정했는가?"]},{"kind":"기출","src":"2026학년도 수학 E","page":"문항집 23쪽","scope":"수학 · 수학Ⅱ","concept":"직선의 방정식, 이차함수의 최대·최소, 평면좌표","body":"<p>양의 실수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s</mi></mrow><annotation encoding=\"application/x-tex\">s</annotation></semantics></math></span>가 주어져 있다. 좌표평면 위의 두 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">A</mi><mo stretchy=\"false\">(</mo><mn>1</mn><mo separator=\"true\">,</mo><mi>s</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm A(1,s)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">B</mi><mo stretchy=\"false\">(</mo><mi>s</mi><mo>+</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm B(s+1,0)</annotation></semantics></math></span>에 대하여 다음 제시문을 읽고 물음에 답하시오.</p>\n<div class=\"box\">\n<p>(가) 함수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">f(x)</annotation></semantics></math></span>를 어떤 실수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo separator=\"true\">,</mo><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">k,a,b</annotation></semantics></math></span>에 대하여\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mrow><mo fence=\"true\">{</mo><mtable rowspacing=\"0.36em\" columnalign=\"left left\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mi>k</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><mi>a</mi><mo stretchy=\"false\">)</mo><mo>+</mo><mi>b</mi></mrow></mstyle></mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo>≤</mo><mi>a</mi><mo stretchy=\"false\">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mo stretchy=\"false\">(</mo><mi>k</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><mi>a</mi><mo stretchy=\"false\">)</mo><mo>+</mo><mi>b</mi></mrow></mstyle></mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mo stretchy=\"false\">(</mo><mi>x</mi><mo>&gt;</mo><mi>a</mi><mo stretchy=\"false\">)</mo></mrow></mstyle></mtd></mtr></mtable></mrow></mrow><annotation encoding=\"application/x-tex\">f(x)=\\begin{cases}k(x-a)+b&amp;(x\\le a)\\\\(k+1)(x-a)+b&amp;(x&gt;a)\\end{cases}</annotation></semantics></math></span>\n로 나타낼 수 있을 때, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">y=f(x)</annotation></semantics></math></span>의 그래프를 <u>꺾인 선</u>이라 한다. 이때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>와 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(a,b)</annotation></semantics></math></span>를 각각 이 꺾인 선의 <u>비탈</u>과 <u>꺾인 점</u>이라 한다.</p>\n<p>(나) 주어진 양의 실수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>에 대하여, 꺾인 점이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(a,b)</annotation></semantics></math></span>인 꺾인 선의 <u>활성도</u>는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi></mrow><annotation encoding=\"application/x-tex\">ma^2+b</annotation></semantics></math></span>이다.</p></div>","qs":["두 점 A, B를 모두 지나는 꺾인 선의 비탈로 가능한 값의 범위를 구하시오.","두 점 A, B를 모두 지나는 꺾인 선과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span>축으로 둘러싸인 도형의 넓이의 최솟값을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s</mi></mrow><annotation encoding=\"application/x-tex\">s</annotation></semantics></math></span>에 대한 식으로 나타내시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">s=2</annotation></semantics></math></span>일 때, 다음 조건을 만족시키는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>의 값을 모두 구하시오.<br>[조건] 두 점 A, B를 모두 지나는 꺾인 선 가운데 활성도가 가장 작은 것의 개수는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">2</annotation></semantics></math></span>이다."],"ans":["직선 AB의 기울기는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">-1</annotation></semantics></math></span>. 꺾인 점이 두 점의 오른쪽이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">k=-1</annotation></semantics></math></span>, 왼쪽이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mo>−</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">k=-2</annotation></semantics></math></span>, 사이(<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>≤</mo><mi>a</mi><mo>≤</mo><mi>s</mi><mo>+</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\le a\\le s+1</annotation></semantics></math></span>)이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>1</mn><mo>+</mo><mi>s</mi><mo stretchy=\"false\">(</mo><mi>k</mi><mo>+</mo><mn>2</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">a=1+s(k+2)</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>2</mn><mo>≤</mo><mi>k</mi><mo>≤</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">-2\\le k\\le-1</annotation></semantics></math></span>. 따라서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mn>2</mn><mo>≤</mo><mi>k</mi><mo>≤</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">-2\\le k\\le-1</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mi>k</mi><mo>+</mo><mn>1</mn><mtext> </mtext><mo stretchy=\"false\">(</mo><mo>−</mo><mn>1</mn><mo>≤</mo><mi>t</mi><mo>≤</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">t=k+1\\ (-1\\le t\\le0)</annotation></semantics></math></span>로 놓으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>1</mn><mo>+</mo><mi>s</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">a=1+s(t+1)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>=</mo><mi>s</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">b=st^2</annotation></semantics></math></span>이고 넓이는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msup><mi>s</mi><mn>2</mn></msup><mn>2</mn></mfrac></mstyle><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>−</mo><mn>1</mn></mrow><mn>2</mn></mfrac></mstyle><mi>t</mi><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mi>s</mi><mo>+</mo><mn>1</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{s^2}2t^2+\\dfrac{s^2-1}{2}t+\\dfrac{(s+1)^2}2</annotation></semantics></math></span>. 꼭짓점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>1</mn><mo>−</mo><msup><mi>s</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><msup><mi>s</mi><mn>2</mn></msup></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">t=\\dfrac{1-s^2}{2s^2}</annotation></semantics></math></span>이 구간에 들어가는 것은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s</mi><mo>≥</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">s\\ge1</annotation></semantics></math></span>일 때이다. 따라서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>s</mi><mo>&lt;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">0&lt;s&lt;1</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mi>s</mi><mo>+</mo><mn>1</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{(s+1)^2}{2}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s</mi><mo>≥</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">s\\ge1</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mi>s</mi><mo>+</mo><mn>1</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mn>2</mn></mfrac></mstyle><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>−</mo><mn>1</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mrow><mn>8</mn><msup><mi>s</mi><mn>2</mn></msup></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{(s+1)^2}{2}-\\dfrac{(s^2-1)^2}{8s^2}</annotation></semantics></math></span>.","꺾인 점의 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>좌표 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>로 활성도를 쓰면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>≤</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">a\\le1</annotation></semantics></math></span> 또는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>≥</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">a\\ge3</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><mi>a</mi><mo>+</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">ma^2-a+3</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>≤</mo><mi>a</mi><mo>≤</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">1\\le a\\le3</annotation></semantics></math></span>일 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mo stretchy=\"false\">(</mo><mi>a</mi><mo>−</mo><mn>3</mn><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">ma^2+\\dfrac{(a-3)^2}2</annotation></semantics></math></span>. 최솟값을 주는 점이 둘이려면 두 이차함수의 꼭짓점 값이 같아야 한다: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mrow><mn>4</mn><mi>m</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>9</mn><mi>m</mi></mrow><mrow><mn>2</mn><mi>m</mi><mo>+</mo><mn>1</mn></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">3-\\dfrac1{4m}=\\dfrac{9m}{2m+1}</annotation></semantics></math></span>, 즉 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12</mn><msup><mi>m</mi><mn>2</mn></msup><mo>−</mo><mn>10</mn><mi>m</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">12m^2-10m+1=0</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>5</mn><mo>±</mo><msqrt><mn>13</mn></msqrt></mrow><mn>12</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">m=\\dfrac{5\\pm\\sqrt{13}}{12}</annotation></semantics></math></span>이고 두 값 모두 꼭짓점이 해당 구간에 놓임을 확인한다."],"follow":["k = −1일 때 꺾인 점은 어디에 놓일 수 있는가?","1-3에서 구간의 경계 a = 1, a = 3에서는 왜 최소가 되지 않는가?"]},{"kind":"연습","src":"연습 1 · 해변 구조대원의 최단 시간 경로","scope":"수학 · 미적분","concept":"무리함수·합성함수의 미분, 함수의 최솟값, 삼각비, 일반화, 굴절 현상과의 대응","body":"<p>해안선을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축으로 놓자. 구조대원은 모래사장의 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">A</mi><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>30</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm A(0,30)</annotation></semantics></math></span>에 있고, 물에 빠진 사람은 바다의 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">B</mi><mo stretchy=\"false\">(</mo><mn>70</mn><mo separator=\"true\">,</mo><mo>−</mo><mn>40</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm B(70,-40)</annotation></semantics></math></span>에 있다(단위는 m). 구조대원은 모래사장에서 초속 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">4</annotation></semantics></math></span> m로 달리고, 바다에서는 초속 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">3</annotation></semantics></math></span> m로 헤엄친다. 구조대원은 해안선 위의 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mtext> </mtext><mo stretchy=\"false\">(</mo><mn>0</mn><mo>≤</mo><mi>x</mi><mo>≤</mo><mn>70</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm P(x,0)\\ (0\\le x\\le70)</annotation></semantics></math></span>까지 똑바로 달린 뒤 B까지 똑바로 헤엄친다.</p><figure><svg viewBox=\"0 0 360 210\" role=\"img\" aria-label=\"모래사장의 A에서 물속의 B까지 해안선 위의 점 P를 거쳐 가는 경로\">\n<rect class=\"sand\" x=\"20\" y=\"10\" width=\"320\" height=\"90\"/><rect class=\"sea\" x=\"20\" y=\"100\" width=\"320\" height=\"100\"/>\n<line class=\"ax\" x1=\"20\" y1=\"100\" x2=\"340\" y2=\"100\"/>\n<line class=\"ln\" x1=\"50\" y1=\"25\" x2=\"170\" y2=\"100\"/><line class=\"ln\" x1=\"170\" y1=\"100\" x2=\"260\" y2=\"200\"/>\n<line class=\"dash\" x1=\"50\" y1=\"25\" x2=\"50\" y2=\"100\"/><line class=\"dash\" x1=\"260\" y1=\"200\" x2=\"260\" y2=\"100\"/><line class=\"dash\" x1=\"170\" y1=\"55\" x2=\"170\" y2=\"150\"/>\n<circle class=\"pt\" cx=\"50\" cy=\"25\" r=\"3.4\"/><circle class=\"pt\" cx=\"260\" cy=\"200\" r=\"3.4\"/><circle class=\"pt\" cx=\"170\" cy=\"100\" r=\"3.4\"/>\n<text x=\"34\" y=\"22\">A</text><text x=\"268\" y=\"198\">B</text><text x=\"176\" y=\"96\">P(x, 0)</text><text x=\"26\" y=\"66\">30 m</text><text x=\"266\" y=\"150\">40 m</text>\n<text x=\"150\" y=\"72\">θ₁</text><text x=\"176\" y=\"140\">θ₂</text><text x=\"285\" y=\"30\">모래사장</text><text x=\"40\" y=\"185\">바다</text><text x=\"46\" y=\"114\">O</text>\n</svg><figcaption>[그림] 해안선을 x축으로 놓는다. A(0, 30), B(70, −40), 단위는 m</figcaption></figure>\n<p>선분 AP, PB가 해안선에 수직인 직선과 이루는 예각의 크기를 각각 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_1,\\theta_2</annotation></semantics></math></span>라 하자.</p><div class=\"box\"><b>토막글 · 빛이 가는 길</b><p>빛은 한 점에서 다른 점으로 갈 때 걸리는 시간이 가장 짧은 길을 따른다고 알려져 있다. 빛의 속력은 공기에서보다 물에서 느리며, 공기에서의 속력은 물에서의 속력의 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac43</annotation></semantics></math></span>배이다. 빛이 공기에서 물로 들어갈 때 수면에 수직인 직선과 이루는 각을 공기 쪽에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_1</annotation></semantics></math></span>, 물 쪽에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_2</annotation></semantics></math></span>라 한다.</p></div>","qs":[],"ans":[],"follow":["두 속력이 같다면 문제 1의 (2)의 조건은 무엇을 뜻하는가?","헤엄 속력이 0에 가까워지면 최적의 P는 어디로 가는가?"],"groups":[{"parts":["A에서 B까지 걸리는 시간 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">T(x)</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>에 대한 식으로 나타내시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">T&#x27;(x)=0</annotation></semantics></math></span>이 되는 조건을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_1</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_2</annotation></semantics></math></span>로 나타내시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msqrt><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>900</mn></mrow></msqrt><mn>4</mn></mfrac></mstyle><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msqrt><mrow><mo stretchy=\"false\">(</mo><mn>70</mn><mo>−</mo><mi>x</mi><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mo>+</mo><mn>1600</mn></mrow></msqrt><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">T(x)=\\dfrac{\\sqrt{x^2+900}}4+\\dfrac{\\sqrt{(70-x)^2+1600}}3</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>x</mi><mrow><mn>4</mn><msqrt><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>900</mn></mrow></msqrt></mrow></mfrac></mstyle><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>70</mn><mo>−</mo><mi>x</mi></mrow><mrow><mn>3</mn><msqrt><mrow><mo stretchy=\"false\">(</mo><mn>70</mn><mo>−</mo><mi>x</mi><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mo>+</mo><mn>1600</mn></mrow></msqrt></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub></mrow><mn>4</mn></mfrac></mstyle><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">T&#x27;(x)=\\dfrac{x}{4\\sqrt{x^2+900}}-\\dfrac{70-x}{3\\sqrt{(70-x)^2+1600}}=\\dfrac{\\sin\\theta_1}4-\\dfrac{\\sin\\theta_2}3</annotation></semantics></math></span>. 따라서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub></mrow><mn>4</mn></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><mn>3</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{\\sin\\theta_1}{4}=\\dfrac{\\sin\\theta_2}{3}</annotation></semantics></math></span>."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">T&#x27;(x)</annotation></semantics></math></span>가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>≤</mo><mi>x</mi><mo>≤</mo><mn>70</mn></mrow><annotation encoding=\"application/x-tex\">0\\le x\\le70</annotation></semantics></math></span>에서 증가함을 설명하고, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">T(x)</annotation></semantics></math></span>가 최소가 되는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>의 값과 그때 걸리는 시간을 구하시오.","A와 B를 잇는 선분을 따라 움직일 때 걸리는 시간과 문제 2의 (1)의 최소 시간 중 어느 쪽이 얼마나 짧은지 비교하고, 가장 빠른 경로가 직선이 아닌 이유를 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>가 커지면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_1</annotation></semantics></math></span>은 커지고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_2</annotation></semantics></math></span>는 작아지므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup></mrow><annotation encoding=\"application/x-tex\">T&#x27;</annotation></semantics></math></span>은 증가한다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mo>&lt;</mo><mn>0</mn><mo>&lt;</mo><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mn>70</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">T&#x27;(0)&lt;0&lt;T&#x27;(70)</annotation></semantics></math></span>이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">T&#x27;(x)=0</annotation></semantics></math></span>인 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>가 하나뿐이고 거기서 최소. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>40</mn></mrow><annotation encoding=\"application/x-tex\">x=40</annotation></semantics></math></span>이면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>4</mn><mn>5</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_1=\\dfrac45</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>3</mn><mn>5</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_2=\\dfrac35</annotation></semantics></math></span>로 조건을 만족시킨다. 최소 시간은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>50</mn><mn>4</mn></mfrac></mstyle><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>50</mn><mn>3</mn></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>175</mn><mn>6</mn></mfrac></mstyle><mo>≈</mo><mn>29.2</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{50}4+\\dfrac{50}3=\\dfrac{175}{6}\\approx29.2</annotation></semantics></math></span>초.","선분 AB는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>30</mn></mrow><annotation encoding=\"application/x-tex\">x=30</annotation></semantics></math></span>에서 해안선과 만나고 시간은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>30</mn><msqrt><mn>2</mn></msqrt></mrow><mn>4</mn></mfrac></mstyle><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>40</mn><msqrt><mn>2</mn></msqrt></mrow><mn>3</mn></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>125</mn><msqrt><mn>2</mn></msqrt></mrow><mn>6</mn></mfrac></mstyle><mo>≈</mo><mn>29.5</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{30\\sqrt2}4+\\dfrac{40\\sqrt2}{3}=\\dfrac{125\\sqrt2}{6}\\approx29.5</annotation></semantics></math></span>초. 약 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.3</mn></mrow><annotation encoding=\"application/x-tex\">0.3</annotation></semantics></math></span>초 차이. 빠른 구간(모래)을 더 길게, 느린 구간(바다)을 더 짧게 가는 편이 유리하기 때문이다. 빛의 굴절과 같은 원리다."]},{"parts":["모래사장과 바다에서의 속력을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>v</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_1,v_2</annotation></semantics></math></span>, 두 점을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">A</mi><mo stretchy=\"false\">(</mo><mn>0</mn><mo separator=\"true\">,</mo><mi>a</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm A(0,a)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">B</mi><mo stretchy=\"false\">(</mo><mi>d</mi><mo separator=\"true\">,</mo><mo>−</mo><mi>b</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm B(d,-b)</annotation></semantics></math></span>로 일반화하여도 시간이 최소일 조건이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub></mrow><msub><mi>v</mi><mn>1</mn></msub></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><msub><mi>v</mi><mn>2</mn></msub></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{\\sin\\theta_1}{v_1}=\\dfrac{\\sin\\theta_2}{v_2}</annotation></semantics></math></span>임을 보이시오.","이 조건에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo separator=\"true\">,</mo><mi>b</mi><mo separator=\"true\">,</mo><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">a,b,d</annotation></semantics></math></span>가 직접 나타나지 않는다는 사실은 무엇을 뜻하는가?"],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msqrt><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup></mrow></msqrt><msub><mi>v</mi><mn>1</mn></msub></mfrac></mstyle><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msqrt><mrow><mo stretchy=\"false\">(</mo><mi>d</mi><mo>−</mo><mi>x</mi><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup></mrow></msqrt><msub><mi>v</mi><mn>2</mn></msub></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">T(x)=\\dfrac{\\sqrt{x^2+a^2}}{v_1}+\\dfrac{\\sqrt{(d-x)^2+b^2}}{v_2}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub></mrow><msub><mi>v</mi><mn>1</mn></msub></mfrac></mstyle><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><msub><mi>v</mi><mn>2</mn></msub></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">T&#x27;(x)=\\dfrac{\\sin\\theta_1}{v_1}-\\dfrac{\\sin\\theta_2}{v_2}</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup></mrow><annotation encoding=\"application/x-tex\">T&#x27;</annotation></semantics></math></span>은 증가하므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">T&#x27;=0</annotation></semantics></math></span>에서 최소. 조건은 경계를 지나는 점에서의 두 각과 두 속력만으로 정해진다. 출발점과 도착점이 어디든 경계에서 꺾이는 규칙은 같다."]},{"parts":["토막글을 이용하여 빛이 공기에서 물로 들어갈 때 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_1</annotation></semantics></math></span>과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_2</annotation></semantics></math></span> 사이의 관계를 쓰고, 문제의 구조대원 경로와 견주시오.","물가에 서서 물속의 물고기를 볼 때 물고기가 실제보다 얕은 곳에 있는 것처럼 보이는 이유를 이 관계로 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_1=\\dfrac43\\sin\\theta_2</annotation></semantics></math></span>. 속력의 비가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mo>:</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">4:3</annotation></semantics></math></span>인 구조대원 문제와 같은 식이다. 물고기에서 나온 빛은 수면에서 꺾여 눈에 들어오는데, 눈은 빛이 곧게 왔다고 여기므로 꺾이기 전의 방향을 거꾸로 늘인 곳, 곧 실제보다 얕은 곳에 물고기가 있다고 본다."]}]},{"kind":"연습","src":"연습 2 · 위성 안테나와 포물선","scope":"기하 · 미적분","concept":"포물선의 정의와 접선, 음함수의 미분, 함수의 최솟값, 타원의 정의와 접선","body":"<p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">p&gt;0</annotation></semantics></math></span>일 때 포물선 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>p</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">y^2=4px</annotation></semantics></math></span>의 초점은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">F</mi><mo stretchy=\"false\">(</mo><mi>p</mi><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm F(p,0)</annotation></semantics></math></span>, 준선은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mo>−</mo><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">x=-p</annotation></semantics></math></span>이다. 포물선 위의 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">P</mi><mo stretchy=\"false\">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><msub><mi>y</mi><mn>1</mn></msub><mo stretchy=\"false\">)</mo><mtext> </mtext><mo stretchy=\"false\">(</mo><msub><mi>y</mi><mn>1</mn></msub><mo>&gt;</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm P(x_1,y_1)\\ (y_1&gt;0)</annotation></semantics></math></span>에서의 접선이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축과 만나는 점을 T라 하자.</p><figure><svg viewBox=\"0 0 360 210\" role=\"img\" aria-label=\"포물선 위의 점 P에서 축에 평행하게 들어온 빛이 초점 F로 반사되는 모습\">\n<line class=\"ax\" x1=\"20\" y1=\"105\" x2=\"345\" y2=\"105\"/><line class=\"ax\" x1=\"110\" y1=\"205\" x2=\"110\" y2=\"6\"/>\n<path class=\"ln\" d=\"M278.4,6 Q-58.4,105 278.4,204\"/>\n<line class=\"dash\" x1=\"20\" y1=\"20\" x2=\"262\" y2=\"152\"/>\n<line class=\"ln2\" x1=\"340\" y1=\"45\" x2=\"140\" y2=\"45\"/><line class=\"ln2\" x1=\"140\" y1=\"45\" x2=\"170\" y2=\"105\"/>\n<circle class=\"pt\" cx=\"140\" cy=\"45\" r=\"3.4\"/><circle class=\"pt\" cx=\"170\" cy=\"105\" r=\"3.4\"/><circle class=\"pt\" cx=\"80\" cy=\"105\" r=\"3.4\"/>\n<text x=\"126\" y=\"38\">P</text><text x=\"174\" y=\"120\">F(p, 0)</text><text x=\"70\" y=\"122\">T</text><text x=\"96\" y=\"120\">O</text><text x=\"336\" y=\"100\">x</text><text x=\"116\" y=\"14\">y</text><text x=\"286\" y=\"40\">빛</text><text x=\"228\" y=\"150\">접선</text>\n</svg><figcaption>[그림] 포물선 y² = 4px 위의 점 P에서의 접선이 x축과 만나는 점이 T이다</figcaption></figure>\n<p>위성 안테나의 접시는 포물선을 축 둘레로 돌린 모양이다. 축에 평행하게 들어온 전파는 접시에서 반사되는데, 반사될 때 들어온 방향과 접선이 이루는 각은 나가는 방향과 접선이 이루는 각과 크기가 같다.</p><div class=\"box\"><b>토막글 · 속삭이는 방</b><p>천장이나 벽이 타원 모양인 방에서는 한 초점에서 작게 낸 소리가 다른 초점에서 또렷이 들린다. 타원 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>25</mn></mfrac></mstyle><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>9</mn></mfrac></mstyle><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{x^2}{25}+\\dfrac{y^2}{9}=1</annotation></semantics></math></span>의 두 초점을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">F</mi><mo stretchy=\"false\">(</mo><mn>4</mn><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm F(4,0)</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi mathvariant=\"normal\">F</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mo>−</mo><mn>4</mn><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm F&#x27;(-4,0)</annotation></semantics></math></span>이라 하자. 소리는 벽에서 반사될 때 들어오는 방향과 접선이 이루는 각이 나가는 방향과 접선이 이루는 각과 같다.</p></div>","qs":[],"ans":[],"follow":["접시를 더 깊게 만들면 초점은 어느 쪽으로 움직이는가?","문제 2의 (2)의 거리 공식을 포물선의 정의에서 어떻게 얻었는가?"],"groups":[{"parts":["점 P에서의 접선의 방정식을 구하고, 점 T의 좌표를 구하시오.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">P</mi></mrow><mo stretchy=\"true\">‾</mo></mover><mo>=</mo><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">T</mi></mrow><mo stretchy=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\overline{\\mathrm{FP}}=\\overline{\\mathrm{FT}}</annotation></semantics></math></span>임을 보이시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>y</mi><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mstyle><mo>=</mo><mn>4</mn><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">2y\\dfrac{dy}{dx}=4p</annotation></semantics></math></span>에서 기울기는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mi>p</mi></mrow><msub><mi>y</mi><mn>1</mn></msub></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{2p}{y_1}</annotation></semantics></math></span>. 접선은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mn>1</mn></msub><mi>y</mi><mo>=</mo><mn>2</mn><mi>p</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo>+</mo><msub><mi>x</mi><mn>1</mn></msub><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">y_1y=2p(x+x_1)</annotation></semantics></math></span>이고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">T</mi><mo stretchy=\"false\">(</mo><mo>−</mo><msub><mi>x</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathrm T(-x_1,0)</annotation></semantics></math></span>.","포물선의 정의에 의해 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">P</mi></mrow><mo stretchy=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\overline{\\mathrm{FP}}</annotation></semantics></math></span>는 P에서 준선까지의 거리 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">x_1+p</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">T</mi></mrow><mo stretchy=\"true\">‾</mo></mover><mo>=</mo><mi>p</mi><mo>−</mo><mo stretchy=\"false\">(</mo><mo>−</mo><msub><mi>x</mi><mn>1</mn></msub><mo stretchy=\"false\">)</mo><mo>=</mo><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">\\overline{\\mathrm{FT}}=p-(-x_1)=x_1+p</annotation></semantics></math></span>."]},{"parts":["(2)를 이용하여 축에 평행하게 들어와 점 P에서 반사된 전파가 초점 F를 지남을 설명하시오.","지름이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.2</mn></mrow><annotation encoding=\"application/x-tex\">1.2</annotation></semantics></math></span> m, 깊이가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.3</mn></mrow><annotation encoding=\"application/x-tex\">0.3</annotation></semantics></math></span> m인 접시의 수신기는 꼭짓점에서 얼마나 떨어진 곳에 달아야 하는가? 또 초점 F를 지나는 직선이 포물선과 만나는 두 점 사이의 거리의 최솟값이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">4p</annotation></semantics></math></span>임을 보이시오."],"ans":["삼각형 FPT가 이등변삼각형이므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∠</mi><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">T</mi></mrow><mo>=</mo><mi mathvariant=\"normal\">∠</mi><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">P</mi></mrow></mrow><annotation encoding=\"application/x-tex\">\\angle\\mathrm{FPT}=\\angle\\mathrm{FTP}</annotation></semantics></math></span>. 축에 평행한 전파와 접선이 이루는 각은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∠</mi><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">P</mi></mrow></mrow><annotation encoding=\"application/x-tex\">\\angle\\mathrm{FTP}</annotation></semantics></math></span>와 동위각으로 같다. 따라서 들어온 방향과 접선이 이루는 각이 선분 PF와 접선이 이루는 각과 같아, 반사된 전파는 F를 향한다.","단면을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>p</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">y^2=4px</annotation></semantics></math></span>로 놓으면 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>0.3</mn><mo separator=\"true\">,</mo><mtext> </mtext><mn>0.6</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(0.3,\\,0.6)</annotation></semantics></math></span>을 지나므로 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.36</mn><mo>=</mo><mn>1.2</mn><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">0.36=1.2p</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>0.3</mn></mrow><annotation encoding=\"application/x-tex\">p=0.3</annotation></semantics></math></span> m. 초점을 지나는 직선이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>축의 양의 방향과 이루는 각을 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>라 하면 두 교점까지의 거리는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mi>p</mi></mrow><mrow><mn>1</mn><mo>−</mo><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{2p}{1-\\cos\\theta}</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mi>p</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{2p}{1+\\cos\\theta}</annotation></semantics></math></span>이고 합은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>4</mn><mi>p</mi></mrow><mrow><msup><mrow><mi>sin</mi><mo>⁡</mo></mrow><mn>2</mn></msup><mi>θ</mi></mrow></mfrac></mstyle><mo>≥</mo><mn>4</mn><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">\\dfrac{4p}{\\sin^2\\theta}\\ge4p</annotation></semantics></math></span>. 등호는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>π</mi><mn>2</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\theta=\\dfrac\\pi2</annotation></semantics></math></span>일 때."]},{"parts":["타원 위의 점 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">P</mi><mtext> ⁣</mtext><mrow><mo fence=\"true\">(</mo><mn>4</mn><mo separator=\"true\">,</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>9</mn><mn>5</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathrm P\\!\\left(4,\\dfrac95\\right)</annotation></semantics></math></span>에서의 접선의 방정식을 구하시오.","(1)의 접선과 두 선분 PF, PF'이 이루는 예각의 크기가 같음을 계산으로 확인하시오."],"ans":["접선은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>4</mn><mi>x</mi></mrow><mn>25</mn></mfrac></mstyle><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mi>y</mi><mn>5</mn></mfrac></mstyle><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\dfrac{4x}{25}+\\dfrac{y}{5}=1</annotation></semantics></math></span>, 방향은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mn>5</mn><mo separator=\"true\">,</mo><mo>−</mo><mn>4</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(5,-4)</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">F</mi></mrow><mo stretchy=\"true\">→</mo></mover><mo>=</mo><mrow><mo fence=\"true\">(</mo><mn>0</mn><mo separator=\"true\">,</mo><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>9</mn><mn>5</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\overrightarrow{\\mathrm{PF}}=\\left(0,-\\dfrac95\\right)</annotation></semantics></math></span>과 이루는 각의 코사인은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>4</mn><msqrt><mn>41</mn></msqrt></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac4{\\sqrt{41}}</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">P</mi><msup><mi mathvariant=\"normal\">F</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup></mrow><mo stretchy=\"true\">→</mo></mover><mo>=</mo><mrow><mo fence=\"true\">(</mo><mo>−</mo><mn>8</mn><mo separator=\"true\">,</mo><mo>−</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>9</mn><mn>5</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\overrightarrow{\\mathrm{PF&#x27;}}=\\left(-8,-\\dfrac95\\right)</annotation></semantics></math></span>은 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mo>−</mo><mn>40</mn><mo separator=\"true\">,</mo><mo>−</mo><mn>9</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">(-40,-9)</annotation></semantics></math></span>와 같은 방향(크기 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>41</mn></mrow><annotation encoding=\"application/x-tex\">41</annotation></semantics></math></span>)이고 코사인의 절댓값이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi mathvariant=\"normal\">∣</mi><mo>−</mo><mn>200</mn><mo>+</mo><mn>36</mn><mi mathvariant=\"normal\">∣</mi></mrow><mrow><mn>41</mn><msqrt><mn>41</mn></msqrt></mrow></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>4</mn><msqrt><mn>41</mn></msqrt></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{|-200+36|}{41\\sqrt{41}}=\\dfrac4{\\sqrt{41}}</annotation></semantics></math></span>로 같다."]},{"parts":["타원의 정의를 이용하여 초점 F에서 나와 벽에 한 번 반사된 뒤 F'에 이르는 소리의 이동 거리를 구하시오.","이 값이 반사되는 점에 따라 달라지지 않는다는 사실로 \"속삭이는 방\"의 현상을 설명하고, 포물선 안테나의 경우(문제 2의 (1))와 공통점을 말하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">F</mi></mrow><mo stretchy=\"true\">‾</mo></mover><mo>+</mo><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">P</mi><msup><mi mathvariant=\"normal\">F</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup></mrow><mo stretchy=\"true\">‾</mo></mover><mo>=</mo><mn>2</mn><mi>a</mi><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">\\overline{\\mathrm{PF}}+\\overline{\\mathrm{PF&#x27;}}=2a=10</annotation></semantics></math></span>. 어느 점에서 반사되든 거리가 같으므로 여러 방향으로 퍼진 소리가 F'에 동시에 모여 크게 들린다. 포물선에서는 축에 평행하게 들어온 전파가 초점까지 가는 거리가 모두 같다. 둘 다 \"모이는 점까지의 거리가 같다\"는 성질이다."]}]},{"kind":"연습","src":"연습 3 · 식어 가는 국","scope":"수학Ⅰ · 미적분","concept":"지수함수와 로그, 지수함수의 미분과 적분, 평균값, 식의 일반화와 해석","body":"<p>온도가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">20\\,</annotation></semantics></math></span>℃로 일정한 방에 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">90\\,</annotation></semantics></math></span>℃인 국을 놓았다. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>분 뒤 국의 온도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">T(t)</annotation></semantics></math></span> (℃)는 양의 상수 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>에 대하여 다음과 같다고 한다.</p>\n<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>T</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>20</mn><mo>+</mo><mn>70</mn><msup><mi>e</mi><mrow><mo>−</mo><mi>k</mi><mi>t</mi></mrow></msup></mrow><annotation encoding=\"application/x-tex\">T(t)=20+70e^{-kt}</annotation></semantics></math></span>\n<p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>분 뒤 국의 온도는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>55</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">55\\,</annotation></semantics></math></span>℃였다.</p><div class=\"box\"><b>토막글 · 언제 섞을까</b><p>온도가 다른 두 액체를 섞으면 섞은 직후의 온도는 질량을 가중치로 한 평균이 된다고 하자. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">90\\,</annotation></semantics></math></span>℃인 국 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>300</mn></mrow><annotation encoding=\"application/x-tex\">300</annotation></semantics></math></span> g에 온도가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>w</mi></msub><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">T_w\\,</annotation></semantics></math></span>℃인 물 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">100</annotation></semantics></math></span> g을 섞어 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>분 뒤에 먹으려 한다. 섞은 뒤에도 방과의 온도 차는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>분마다 절반이 된다고 가정한다. 방법 ①은 지금 바로 섞고 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>분을 기다리는 것이고, 방법 ②는 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">5</annotation></semantics></math></span>분을 기다린 뒤 섞는 것이다.</p></div>","qs":[],"ans":[],"follow":["방의 온도가 더 낮으면 5분 뒤의 온도 차는 어떻게 되는가?","온도가 정확히 20 ℃가 되는 시각이 있는가?"],"groups":[{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>의 값을 구하시오.","국의 온도가 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40</mn><mtext> </mtext></mrow><annotation encoding=\"application/x-tex\">40\\,</annotation></semantics></math></span>℃가 되는 것은 몇 분 뒤인가? (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ln</mi><mo>⁡</mo><mn>2</mn><mo>≈</mo><mn>0.69</mn></mrow><annotation encoding=\"application/x-tex\">\\ln2\\approx0.69</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ln</mi><mo>⁡</mo><mn>3.5</mn><mo>≈</mo><mn>1.25</mn></mrow><annotation encoding=\"application/x-tex\">\\ln3.5\\approx1.25</annotation></semantics></math></span>)"],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>70</mn><msup><mi>e</mi><mrow><mo>−</mo><mn>5</mn><mi>k</mi></mrow></msup><mo>=</mo><mn>35</mn></mrow><annotation encoding=\"application/x-tex\">70e^{-5k}=35</annotation></semantics></math></span>에서 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>ln</mi><mo>⁡</mo><mn>2</mn></mrow><mn>5</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">k=\\dfrac{\\ln2}{5}</annotation></semantics></math></span>.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>k</mi><mi>t</mi></mrow></msup><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>2</mn><mn>7</mn></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">e^{-kt}=\\dfrac27</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mi>ln</mi><mo>⁡</mo><mn>3.5</mn></mrow><mi>k</mi></mfrac></mstyle><mo>=</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mrow><mn>5</mn><mi>ln</mi><mo>⁡</mo><mn>3.5</mn></mrow><mrow><mi>ln</mi><mo>⁡</mo><mn>2</mn></mrow></mfrac></mstyle><mo>≈</mo><mn>9.1</mn></mrow><annotation encoding=\"application/x-tex\">t=\\dfrac{\\ln3.5}{k}=\\dfrac{5\\ln3.5}{\\ln2}\\approx9.1</annotation></semantics></math></span>분."]},{"parts":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">T&#x27;(t)</annotation></semantics></math></span>를 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">T(t)</annotation></semantics></math></span>로 나타내고, 그 식이 뜻하는 바를 말하시오.","처음 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span>분 동안 국의 평균 온도 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>1</mn><mn>10</mn></mfrac></mstyle><mstyle scriptlevel=\"0\" displaystyle=\"true\"><msubsup><mo>∫</mo><mn>0</mn><mn>10</mn></msubsup><mi>T</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mtext> </mtext><mi>d</mi><mi>t</mi></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac1{10}\\displaystyle\\int_0^{10}T(t)\\,dt</annotation></semantics></math></span>를 구하시오. 이 값이 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span>분과 <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">10</annotation></semantics></math></span>분의 온도의 평균보다 높은지 낮은지 판단하고 이유를 그래프의 모양으로 설명하시오."],"ans":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mo>−</mo><mn>70</mn><mi>k</mi><msup><mi>e</mi><mrow><mo>−</mo><mi>k</mi><mi>t</mi></mrow></msup><mo>=</mo><mo>−</mo><mi>k</mi><mo stretchy=\"false\">{</mo><mi>T</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>−</mo><mn>20</mn><mo stretchy=\"false\">}</mo></mrow><annotation encoding=\"application/x-tex\">T&#x27;(t)=-70ke^{-kt}=-k\\{T(t)-20\\}</annotation></semantics></math></span>. 식는 빠르기는 국과 방의 온도 차에 비례한다.","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mfrac><mn>7</mn><mi>k</mi></mfrac></mstyle><mrow><mo fence=\"true\">(</mo><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>10</mn><mi>k</mi></mrow></msup><mo fence=\"true\">)</mo></mrow><mo>=</mo><mn>20</mn><mo>+</mo><mstyle
